<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IT Inventory — Assignments</title>
<link rel="stylesheet" href="../../styles.css">
<script>
  (function(){
    function apply(t){ if(t) document.documentElement.setAttribute("data-theme", t); }
    window.addEventListener("message", function(e){ if(e.data && e.data.rumbuTheme) apply(e.data.rumbuTheme); });
    try{ apply(localStorage.getItem("rumbu_theme")); }catch(e){}
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../auth.js"></script>
<style>
  :root{--navy:var(--heading);--blue:var(--accent);--blue-dark:var(--accent-2);--muted:#6b7280;--red:#c0392b;--green:#1d8a4e;--amber:#d97706;}
  *{box-sizing:border-box;}
  body{font-family:var(--sans);background:var(--bg);margin:0;padding:18px;color:var(--text);}
  .wrap{max-width:1150px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;}
  .card h3{color:var(--navy);margin:0 0 4px;font-size:16px;}
  .card .sub{color:var(--blue);font-size:12px;margin:0 0 14px;}
  label{display:block;font-size:12px;font-weight:bold;color:var(--text);margin:10px 0 4px;}
  input,textarea,select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;}
  textarea{resize:vertical;min-height:50px;}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row > div{flex:1;min-width:170px;}
  button{padding:10px 14px;border:none;border-radius:8px;font-weight:bold;font-size:13px;cursor:pointer;background:var(--blue);color:#fff;}
  button:hover{background:var(--blue-dark);}
  button.mini{padding:5px 9px;font-size:12px;}
  button.ret{background:var(--amber);} button.ret:hover{background:#b25f00;}
  .status{margin-top:10px;font-weight:bold;font-size:13px;min-height:16px;}
  .status.ok{color:var(--green);} .status.err{color:var(--red);}
  #connStatus{font-size:12px;font-weight:bold;text-align:center;margin-bottom:10px;}
  table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px;}
  th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top;}
  thead th{background:var(--navy);color:#fff;font-size:12px;}
  tbody tr:nth-child(even){background:#f6f8fb;}
  .tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:bold;color:#fff;}
  .tag.active{background:var(--amber);} .tag.returned{background:var(--green);}
</style>
</head>
<body>

<div class="wrap">
<div id="connStatus">Loading...</div>

<div id="appArea" style="display:none;">
  <div class="card">
    <h3>Issue a Device</h3>
    <p class="sub">Issuing updates the device's "assigned to" on the register. Returning clears it back to Unassigned.</p>
    <div class="row">
      <div><label>Device</label><select id="device" onchange="onDeviceChange()"></select></div>
      <div><label>Assign to (name)</label><input type="text" id="assignName" placeholder="Person's name"></div>
    </div>
    <div id="currentBox" style="font-size:12px;color:#6b7280;margin-top:6px;"></div>
    <div class="row">
      <div><label>Email</label><input type="text" id="assignEmail"></div>
      <div><label>Phone</label><input type="text" id="assignPhone"></div>
      <div><label>Department</label><input type="text" id="assignDept"></div>
      <div><label>Unit</label><input type="text" id="assignUnit"></div>
    </div>
    <label>Notes</label>
    <textarea id="notes"></textarea>
    <div style="margin-top:12px;"><button onclick="issue()">Issue Device</button></div>
    <div class="status" id="formStatus"></div>
  </div>

  <div class="card">
    <h3>Assignments</h3>
    <div class="row">
      <div><label>Status</label><select id="fStatus" onchange="applyFilters()"><option value="">All</option><option value="active">Active (out)</option><option value="returned">Returned</option></select></div>
      <div><label>Search (device / person)</label><input type="text" id="search" placeholder="Type to filter" oninput="applyFilters()"></div>
      <div style="flex:0 0 auto;"><label>&nbsp;</label><button onclick="loadAssignments()">Refresh</button></div>
    </div>
    <div class="status" id="listStatus"></div>
    <div id="tableWrap"></div>
  </div>
</div>
</div>

<script>
let ME = null;
let DEVICES = [], ASSIGNS = [], BRANCHES = [];

async function logActivity(actionType, description){
  try{
    await sb.from("activity_log").insert({
      actor_id: ME.id, actor_username: ME.username, actor_role: ME.role,
      section_id: ME.sectionId, action_type: actionType, description: description
    });
  }catch(e){ console.warn("Activity log write failed (non-fatal):", e); }
}
function deviceLabel(d){ return d.device_code + " — " + [d.make,d.model].filter(Boolean).join(" ") + (d.serial_number?(" ("+d.serial_number+")"):""); }

async function init(){
  const status = document.getElementById("connStatus");
  try{
    ME = await requireAuth("../../login.html");
    if(!ME) return;
    status.style.color = "#1d8a4e"; status.textContent = "Connected.";
    document.getElementById("appArea").style.display = "block";
    await loadDevices();
    await loadAssignments();
  }catch(e){
    status.style.color = "#c0392b"; status.textContent = "❌ " + e.message; console.error(e);
  }
}

async function loadDevices(){
  let q = sb.from("it_devices").select("*").order("device_code");
  if(ME.role !== "super_admin"){
    if(ME.sectionNames && ME.sectionNames.length){ q = q.in("branch", ME.sectionNames); }
    else { q = q.eq("branch","___none___"); }
  }
  const { data } = await q;
  DEVICES = data||[];
  const sel = document.getElementById("device");
  sel.innerHTML = "";
  DEVICES.forEach(d=>{ const o=document.createElement("option"); o.value=d.id; o.textContent=deviceLabel(d); sel.appendChild(o); });
  onDeviceChange();
}

function currentDevice(){ return DEVICES.find(d=>String(d.id)===document.getElementById("device").value); }
function onDeviceChange(){
  const d = currentDevice();
  const box = document.getElementById("currentBox");
  if(!d){ box.textContent=""; return; }
  const holder = (d.assigned_name && d.assigned_name!=="Unassigned") ? d.assigned_name : "Unassigned";
  box.innerHTML = "Currently assigned to: <b>"+holder+"</b> &nbsp;|&nbsp; Branch: "+(d.branch||"—");
}

async function nextCode(){
  const { data, error } = await sb.from("it_assignments").select("assign_code").like("assign_code","ASN-%").order("assign_code",{ascending:false}).limit(1);
  if(error) throw error;
  let seq=1; if(data&&data.length){ seq=parseInt(data[0].assign_code.slice(4),10)+1; }
  return "ASN-"+String(seq).padStart(5,"0");
}

async function issue(){
  const status = document.getElementById("formStatus");
  const d = currentDevice();
  if(!d){ status.className="status err"; status.textContent="Select a device."; return; }
  const g=id=>document.getElementById(id).value.trim();
  const name = g("assignName");
  if(!name){ status.className="status err"; status.textContent="Assignee name is required."; return; }

  status.className="status"; status.textContent="Saving...";
  try{
    // close any existing open assignment for this device
    await sb.from("it_assignments").update({ date_returned: new Date().toISOString() })
      .eq("device_id", d.id).is("date_returned", null);

    const code = await nextCode();
    const { error: aErr } = await sb.from("it_assignments").insert({
      assign_code: code, device_id: d.id, device_label: deviceLabel(d), branch: d.branch,
      assigned_name: name, assigned_email: g("assignEmail")||null, assigned_phone: g("assignPhone")||null,
      department: g("assignDept")||null, unit: g("assignUnit")||null,
      assigned_by: ME.username, notes: g("notes")||null
    });
    if(aErr) throw aErr;

    const { error: dErr } = await sb.from("it_devices").update({
      assigned_name: name, assigned_email: g("assignEmail")||null, assigned_phone: g("assignPhone")||null
    }).eq("id", d.id);
    if(dErr) throw dErr;

    await logActivity("it_device_assigned", ME.username+" issued "+d.device_code+" to "+name);
    status.className="status ok"; status.textContent="✅ "+d.device_code+" issued to "+name+" ("+code+").";
    ["assignName","assignEmail","assignPhone","assignDept","assignUnit","notes"].forEach(id=>document.getElementById(id).value="");
    await loadDevices();
    await loadAssignments();
  }catch(e){
    status.className="status err"; status.textContent="❌ "+e.message;
  }
}

async function returnDevice(id){
  const a = ASSIGNS.find(x=>x.id===id); if(!a) return;
  if(!confirm("Mark "+a.device_label+" as returned by "+a.assigned_name+"?")) return;
  const status = document.getElementById("listStatus");
  status.className="status"; status.textContent="Saving...";
  try{
    const { error: aErr } = await sb.from("it_assignments").update({ date_returned: new Date().toISOString() }).eq("id", id);
    if(aErr) throw aErr;
    if(a.device_id){
      const { error: dErr } = await sb.from("it_devices").update({
        assigned_name: "Unassigned", assigned_email: null, assigned_phone: null
      }).eq("id", a.device_id);
      if(dErr) throw dErr;
    }
    await logActivity("it_device_returned", ME.username+" recorded return of "+a.device_label+" from "+a.assigned_name);
    status.className="status ok"; status.textContent="✅ Returned.";
    await loadDevices();
    await loadAssignments();
  }catch(e){ status.className="status err"; status.textContent="❌ "+e.message; }
}

async function loadAssignments(){
  const status = document.getElementById("listStatus");
  status.className="status"; status.textContent="Loading...";
  try{
    let q = sb.from("it_assignments").select("*").order("date_assigned",{ascending:false});
    if(ME.role!=="super_admin"){
      if(ME.sectionNames && ME.sectionNames.length){ q = q.in("branch", ME.sectionNames); }
      else { q = q.eq("branch","___none___"); }
    }
    const { data, error } = await q;
    if(error) throw error;
    ASSIGNS = data||[];
    status.className="status ok"; status.textContent=ASSIGNS.length+" assignment(s).";
    applyFilters();
  }catch(e){ status.className="status err"; status.textContent="❌ "+e.message; }
}

function applyFilters(){
  const st = document.getElementById("fStatus").value;
  const s = document.getElementById("search").value.trim().toLowerCase();
  let rows = ASSIGNS.slice();
  if(st==="active") rows = rows.filter(r=>!r.date_returned);
  else if(st==="returned") rows = rows.filter(r=>r.date_returned);
  if(s){
    rows = rows.filter(r =>
      (r.device_label||"").toLowerCase().includes(s) ||
      (r.assigned_name||"").toLowerCase().includes(s));
  }
  render(rows);
}

function fmt(ts){ return ts ? new Date(ts).toLocaleDateString() : ""; }

function render(rows){
  const wrap = document.getElementById("tableWrap");
  if(!rows.length){ wrap.innerHTML="<p>No assignments match.</p>"; return; }
  let html = "<table><thead><tr><th>Code</th><th>Device</th><th>Assigned To</th><th>Branch</th><th>Issued</th><th>Returned</th><th>Status</th><th>Action</th></tr></thead><tbody>";
  rows.forEach(r=>{
    const out = !r.date_returned;
    html += "<tr>" +
      `<td>${r.assign_code||""}</td>` +
      `<td>${r.device_label||""}</td>` +
      `<td>${r.assigned_name||""}</td>` +
      `<td>${r.branch||""}</td>` +
      `<td>${fmt(r.date_assigned)}</td>` +
      `<td>${fmt(r.date_returned)}</td>` +
      `<td><span class="tag ${out?'active':'returned'}">${out?'OUT':'RETURNED'}</span></td>` +
      `<td>${out?`<button class="mini ret" onclick="returnDevice(${r.id})">Return</button>`:"—"}</td>` +
    "</tr>";
  });
  html += "</tbody></table>";
  wrap.innerHTML = html;
}

init();
</script>
</body>
</html>
