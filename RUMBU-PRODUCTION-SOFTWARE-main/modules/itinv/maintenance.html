<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IT Inventory — Maintenance</title>
<link rel="stylesheet" href="../../styles.css">
<script>
  (function(){
    function apply(t){ if(t) document.documentElement.setAttribute("data-theme", t); }
    window.addEventListener("message", function(e){ if(e.data && e.data.rumbuTheme) apply(e.data.rumbuTheme); });
    try{ apply(localStorage.getItem("rumbu_theme")); }catch(e){}
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../auth.js"></script>
<style>
  :root{--navy:var(--heading);--blue:var(--accent);--blue-dark:var(--accent-2);--muted:#6b7280;--red:#c0392b;--green:#1d8a4e;--amber:#d97706;}
  *{box-sizing:border-box;}
  body{font-family:var(--sans);background:var(--bg);margin:0;padding:18px;color:var(--text);}
  .wrap{max-width:1150px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;}
  .card h3{color:var(--navy);margin:0 0 4px;font-size:16px;}
  .card .sub{color:var(--blue);font-size:12px;margin:0 0 14px;}
  label{display:block;font-size:12px;font-weight:bold;color:var(--text);margin:10px 0 4px;}
  input,textarea,select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;}
  textarea{resize:vertical;min-height:50px;}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row > div{flex:1;min-width:170px;}
  button{padding:10px 14px;border:none;border-radius:8px;font-weight:bold;font-size:13px;cursor:pointer;background:var(--blue);color:#fff;}
  button:hover{background:var(--blue-dark);}
  button.mini{padding:5px 9px;font-size:12px;}
  button.done{background:var(--green);} button.done:hover{background:#166a2c;}
  .status{margin-top:10px;font-weight:bold;font-size:13px;min-height:16px;}
  .status.ok{color:var(--green);} .status.err{color:var(--red);}
  #connStatus{font-size:12px;font-weight:bold;text-align:center;margin-bottom:10px;}
  table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px;}
  th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top;}
  thead th{background:var(--navy);color:#fff;font-size:12px;}
  tbody tr:nth-child(even){background:#f6f8fb;}
  tr.due td{background:#fff7e6;}
  .tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:bold;color:#fff;}
  .tag.Scheduled{background:var(--amber);} .tag.Completed{background:var(--green);}
</style>
</head>
<body>

<div class="wrap">
<div id="connStatus">Loading...</div>

<div id="appArea" style="display:none;">
  <div class="card">
    <h3>Schedule Maintenance</h3>
    <div class="row">
      <div><label>Device</label><select id="device"></select></div>
      <div><label>Type</label><input type="text" id="type" placeholder="e.g. Servicing, cleaning"></div>
      <div><label>Scheduled date</label><input type="date" id="schedDate"></div>
    </div>
    <label>Notes</label>
    <textarea id="notes"></textarea>
    <div style="margin-top:12px;"><button onclick="schedule()">Schedule</button></div>
    <div class="status" id="formStatus"></div>
  </div>

  <div class="card">
    <h3>Maintenance</h3>
    <div class="row">
      <div><label>Status</label><select id="fStatus" onchange="applyFilters()"><option value="">All</option><option value="Scheduled">Scheduled</option><option value="Completed">Completed</option></select></div>
      <div><label>Search (device / type)</label><input type="text" id="search" placeholder="Type to filter" oninput="applyFilters()"></div>
      <div style="flex:0 0 auto;"><label>&nbsp;</label><button onclick="loadMaint()">Refresh</button></div>
    </div>
    <div class="status" id="listStatus"></div>
    <div id="tableWrap"></div>
  </div>
</div>
</div>

<script>
let ME = null;
let DEVICES = [], MAINT = [];

async function logActivity(actionType, description){
  try{
    await sb.from("activity_log").insert({
      actor_id: ME.id, actor_username: ME.username, actor_role: ME.role,
      section_id: ME.sectionId, action_type: actionType, description: description
    });
  }catch(e){ console.warn("Activity log write failed (non-fatal):", e); }
}
function deviceLabel(d){ return d.device_code + " — " + [d.make,d.model].filter(Boolean).join(" ") + (d.serial_number?(" ("+d.serial_number+")"):""); }

async function init(){
  const status = document.getElementById("connStatus");
  try{
    ME = await requireAuth("../../login.html");
    if(!ME) return;
    status.style.color = "#1d8a4e"; status.textContent = "Connected.";
    document.getElementById("appArea").style.display = "block";
    await loadDevices();
    await loadMaint();
  }catch(e){
    status.style.color = "#c0392b"; status.textContent = "❌ " + e.message; console.error(e);
  }
}

async function loadDevices(){
  let q = sb.from("it_devices").select("*").order("device_code");
  if(ME.role !== "super_admin"){
    if(ME.sectionNames && ME.sectionNames.length){ q = q.in("branch", ME.sectionNames); }
    else { q = q.eq("branch","___none___"); }
  }
  const { data } = await q;
  DEVICES = data||[];
  const sel = document.getElementById("device");
  sel.innerHTML = "";
  DEVICES.forEach(d=>{ const o=document.createElement("option"); o.value=d.id; o.textContent=deviceLabel(d); sel.appendChild(o); });
}
function currentDevice(){ return DEVICES.find(d=>String(d.id)===document.getElementById("device").value); }

async function nextCode(){
  const { data, error } = await sb.from("it_maintenance").select("maint_code").like("maint_code","MNT-%").order("maint_code",{ascending:false}).limit(1);
  if(error) throw error;
  let seq=1; if(data&&data.length){ seq=parseInt(data[0].maint_code.slice(4),10)+1; }
  return "MNT-"+String(seq).padStart(5,"0");
}

async function schedule(){
  const status = document.getElementById("formStatus");
  const d = currentDevice();
  if(!d){ status.className="status err"; status.textContent="Select a device."; return; }
  const g=id=>document.getElementById(id).value.trim();
  if(!g("schedDate")){ status.className="status err"; status.textContent="Scheduled date is required."; return; }

  status.className="status"; status.textContent="Saving...";
  try{
    const code = await nextCode();
    const { error } = await sb.from("it_maintenance").insert({
      maint_code: code, device_id: d.id, device_label: deviceLabel(d), branch: d.branch,
      type: g("type")||null, scheduled_date: g("schedDate"), status: "Scheduled", notes: g("notes")||null
    });
    if(error) throw error;
    await logActivity("it_maint_scheduled", ME.username+" scheduled maintenance "+code+" for "+d.device_code);
    status.className="status ok"; status.textContent="✅ Scheduled as "+code+".";
    ["type","schedDate","notes"].forEach(id=>document.getElementById(id).value="");
    await loadMaint();
  }catch(e){ status.className="status err"; status.textContent="❌ "+e.message; }
}

async function complete(id){
  const m = MAINT.find(x=>x.id===id); if(!m) return;
  const by = prompt("Performed by (name):","") ; if(by === null) return;
  const cost = prompt("Cost (₦, optional):","") || "";
  const next = prompt("Next due date (YYYY-MM-DD, optional):","") || "";
  const status = document.getElementById("listStatus");
  status.className="status"; status.textContent="Saving...";
  try{
    const upd = {
      status: "Completed", date_performed: new Date().toISOString().slice(0,10),
      performed_by: by||null, cost: cost?parseFloat(cost):null
    };
    if(next) upd.next_due_date = next;
    const { error } = await sb.from("it_maintenance").update(upd).eq("id", id);
    if(error) throw error;
    await logActivity("it_maint_completed", ME.username+" completed maintenance "+m.maint_code);
    status.className="status ok"; status.textContent="✅ Marked complete.";
    await loadMaint();
  }catch(e){ status.className="status err"; status.textContent="❌ "+e.message; }
}

async function loadMaint(){
  const status = document.getElementById("listStatus");
  status.className="status"; status.textContent="Loading...";
  try{
    let q = sb.from("it_maintenance").select("*").order("scheduled_date",{ascending:true});
    if(ME.role!=="super_admin"){
      if(ME.sectionNames && ME.sectionNames.length){ q = q.in("branch", ME.sectionNames); }
      else { q = q.eq("branch","___none___"); }
    }
    const { data, error } = await q;
    if(error) throw error;
    MAINT = data||[];
    status.className="status ok"; status.textContent=MAINT.length+" maintenance record(s).";
    applyFilters();
  }catch(e){ status.className="status err"; status.textContent="❌ "+e.message; }
}

function applyFilters(){
  const st = document.getElementById("fStatus").value;
  const s = document.getElementById("search").value.trim().toLowerCase();
  let rows = MAINT.slice();
  if(st) rows = rows.filter(r=>r.status===st);
  if(s){
    rows = rows.filter(r =>
      (r.device_label||"").toLowerCase().includes(s) ||
      (r.type||"").toLowerCase().includes(s));
  }
  render(rows);
}

function isDue(m){
  if(m.status==="Completed" || !m.scheduled_date) return false;
  return (new Date(m.scheduled_date) - new Date())/86400000 <= 7;
}

function render(rows){
  const wrap = document.getElementById("tableWrap");
  if(!rows.length){ wrap.innerHTML="<p>No maintenance records match.</p>"; return; }
  let html = "<table><thead><tr><th>Code</th><th>Device</th><th>Type</th><th>Scheduled</th><th>Performed</th><th>Next Due</th><th>Status</th><th>Action</th></tr></thead><tbody>";
  rows.forEach(r=>{
    const sched = r.status==="Scheduled";
    html += `<tr class="${isDue(r)?'due':''}">` +
      `<td>${r.maint_code||""}</td>` +
      `<td>${r.device_label||""}</td>` +
      `<td>${r.type||""}</td>` +
      `<td>${r.scheduled_date||""}</td>` +
      `<td>${r.date_performed||""}</td>` +
      `<td>${r.next_due_date||""}</td>` +
      `<td><span class="tag ${r.status}">${(r.status||"").toUpperCase()}</span></td>` +
      `<td>${sched?`<button class="mini done" onclick="complete(${r.id})">Complete</button>`:"—"}</td>` +
    "</tr>";
  });
  html += "</tbody></table>";
  wrap.innerHTML = html;
}

init();
</script>
</body>
</html>
