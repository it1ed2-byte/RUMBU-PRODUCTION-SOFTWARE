<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fill PM Checklist</title>
<link rel="stylesheet" href="../../styles.css">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("rumbu_theme") || "navy"); }catch(e){} })();
  window.addEventListener("message", function(e){ if(e.data && e.data.rumbuTheme){ document.documentElement.setAttribute("data-theme", e.data.rumbuTheme); } });
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../auth.js"></script>
<style>
  body{padding:20px;}
  .wrap{max-width:920px;margin:0 auto;}
  #connStatus{font-size:12px;font-weight:700;text-align:center;margin-bottom:10px;color:var(--muted);}
  .job{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;background:var(--card);box-shadow:var(--shadow);}
  .job-head{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:13px 16px;background:var(--bg);border-bottom:1px solid var(--line);cursor:pointer;}
  .job-head .jt{font-weight:700;color:var(--heading);}
  .job-head .meta{font-size:12.5px;color:var(--muted);}
  .job-head .spacer{flex:1;}
  .badge{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:3px 10px;border-radius:20px;}
  .badge.pending{background:rgba(154,107,0,.14);color:var(--warn);}
  .badge.done{background:rgba(30,125,52,.14);color:var(--ok);}
  .job-body{padding:6px 16px 16px;display:none;}
  .job.open .job-body{display:block;}
  table.cl{width:100%;border-collapse:collapse;}
  table.cl th,table.cl td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle;text-align:left;}
  table.cl th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);}
  table.cl td:first-child,table.cl th:first-child{width:40px;text-align:center;color:var(--muted);font-weight:700;}
  .gb{display:inline-flex;gap:6px;}
  .gb label{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;cursor:pointer;padding:5px 11px;border:1px solid var(--line-2);border-radius:20px;color:var(--heading);margin:0;}
  .gb input{margin:0;width:auto;}
  .gb label.good.sel{background:rgba(30,125,52,.14);border-color:var(--ok);color:var(--ok);}
  .gb label.bad.sel{background:rgba(176,42,55,.14);border-color:var(--bad);color:var(--bad);}
  .rmk{width:100%;}
  .job-actions{margin-top:14px;display:flex;gap:10px;align-items:center;}
  .job-actions .btn-primary{background:var(--accent);color:var(--logo-fg);}
  .empty{padding:26px;text-align:center;color:var(--muted);}
  .ro{font-size:13px;}
  .ro .res-good{color:var(--ok);font-weight:700;}
  .ro .res-bad{color:var(--bad);font-weight:700;}
</style>
</head>
<body>
<div class="wrap">
<button onclick="(window.parent&&window.parent.closeModule)?window.parent.closeModule():(window.location.href='../../index.html')" style="max-width:220px;margin-bottom:12px;background:var(--accent);color:var(--logo-fg);">&larr; Back to Dashboard</button>
<div id="connStatus">Loading...</div>

<div class="card-panel">
  <h3>My PM Checklists</h3>
  <p class="sub" id="whoSub">Preventive-maintenance jobs assigned to you. Mark each item Good or Bad, add a remark if needed, then submit.</p>
  <div id="pendingWrap"></div>
  <div class="empty" id="emptyMsg" style="display:none;">You have no PM checklists to fill right now.</div>
</div>

<div class="card-panel">
  <h3>Completed</h3>
  <div id="doneWrap"></div>
  <div class="empty" id="doneEmpty" style="display:none;">No completed checklists yet.</div>
</div>
</div>

<script>
let ME = null;
let MY_EMP = null;      // { id, full_name } of the logged-in specialist
let IS_ADMIN = false;   // super_admin oversight (sees all)
let JOBS = [];          // pm_initiations rows in scope
let ITEMS = {};         // { initiation_id: [ {id,item_no,checklist_item,result,remark} ] }
let OPEN = new Set();

async function logActivity(actionType, description){
  try{
    await sb.from("activity_log").insert({
      actor_id: ME.id, actor_username: ME.username, actor_role: ME.role,
      section_id: ME.sectionId, action_type: actionType, description: description
    });
  }catch(e){ console.warn("Activity log write failed (non-fatal):", e); }
}

async function init(){
  const status = document.getElementById("connStatus");
  try{
    ME = await requireAuth("../../login.html");
    if(!ME) return;
    IS_ADMIN = (ME.role === "super_admin");

    // Which employee is this login? Needed to show only their jobs.
    const { data: emp } = await sb.from("employees").select("id, full_name").eq("linked_profile_id", ME.id).maybeSingle();
    MY_EMP = emp || null;

    if(IS_ADMIN){
      document.getElementById("whoSub").textContent = "Super Admin: you can view and fill any specialist's PM checklist.";
    }else if(!MY_EMP){
      document.getElementById("connStatus").style.color = "var(--warn)";
      status.textContent = "Your login is not linked to an employee record yet, so no PM jobs can be shown. Ask a Super Admin to link your account in Manage Accounts.";
    }

    await load();
    status.style.color = "var(--ok)"; if(!status.textContent.startsWith("Your login")) status.textContent = "Connected.";
  }catch(e){
    status.style.color = "var(--bad)"; status.textContent = "Could not load: " + e.message;
  }
}

async function load(){
  JOBS = []; ITEMS = {};
  let q = sb.from("pm_initiations").select("*").order("initiated_at", { ascending: false });
  if(!IS_ADMIN){
    if(!MY_EMP){ render(); return; }
    q = q.eq("specialist_emp_pk", MY_EMP.id);   // only THIS specialist's jobs
  }
  const { data: jobs, error } = await q;
  if(error) throw error;
  JOBS = jobs || [];

  if(JOBS.length){
    const ids = JOBS.map(j => j.id);
    const { data: items, error: iErr } = await sb.from("pm_initiation_items")
      .select("id, initiation_id, item_no, checklist_item, result, remark").in("initiation_id", ids).order("item_no");
    if(iErr) throw iErr;
    (items || []).forEach(it => { (ITEMS[it.initiation_id] = ITEMS[it.initiation_id] || []).push(it); });
  }
  render();
}

function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
function fmtDate(s){ if(!s) return "—"; try{ return new Date(s).toLocaleDateString(); }catch(e){ return s; } }

function jobHeadHtml(j){
  const done = j.status === "Completed";
  return "<div class='job-head' onclick='toggle(" + j.id + ")'>" +
    "<span class='jt'>" + esc(j.policy_number) + " — " + esc(j.policy_name) + "</span>" +
    "<span class='meta'>Asset: " + esc(j.asset) + "</span>" +
    "<span class='meta'>Due: " + fmtDate(j.due_date) + "</span>" +
    (IS_ADMIN ? "<span class='meta'>Specialist: " + esc(j.specialist_name || "—") + "</span>" : "") +
    "<span class='spacer'></span>" +
    "<span class='badge " + (done ? "done" : "pending") + "'>" + (done ? "Completed" : "Pending") + "</span>" +
    "</div>";
}

function render(){
  const pend = JOBS.filter(j => j.status !== "Completed");
  const done = JOBS.filter(j => j.status === "Completed");

  // Pending (editable) — but only the assigned specialist edits; admins see read-only.
  const pw = document.getElementById("pendingWrap");
  document.getElementById("emptyMsg").style.display = pend.length ? "none" : "block";
  pw.innerHTML = pend.map(j => {
    const items = ITEMS[j.id] || [];
    const open = OPEN.has(j.id);
    const editable = true; // the assigned specialist fills their own; a Super Admin can fill any
    let body = "";
    if(editable){
      body = "<table class='cl'><thead><tr><th>#</th><th>Checklist Item</th><th>Result</th><th>Remark</th></tr></thead><tbody>" +
        items.map(it =>
          "<tr>" +
          "<td>" + it.item_no + "</td>" +
          "<td>" + esc(it.checklist_item) + "</td>" +
          "<td><span class='gb'>" +
            "<label class='good' data-for='" + it.id + "'><input type='radio' name='r_" + it.id + "' value='Good' onchange='markSel(this)'> Good</label>" +
            "<label class='bad' data-for='" + it.id + "'><input type='radio' name='r_" + it.id + "' value='Bad' onchange='markSel(this)'> Bad</label>" +
          "</span></td>" +
          "<td><input type='text' class='rmk' id='rmk_" + it.id + "' placeholder='Optional note'></td>" +
          "</tr>"
        ).join("") +
        "</tbody></table>" +
        "<div class='job-actions'><button class='btn-primary' onclick='submitJob(" + j.id + ")'>Submit Checklist</button>" +
        "<span class='status' id='st_" + j.id + "' style='display:none;'></span></div>";
    }else{
      body = readonlyItems(items);
    }
    return "<div class='job" + (open ? " open" : "") + "' id='job_" + j.id + "'>" + jobHeadHtml(j) + "<div class='job-body'>" + body + "</div></div>";
  }).join("");

  // Completed (always read-only)
  const dw = document.getElementById("doneWrap");
  document.getElementById("doneEmpty").style.display = done.length ? "none" : "block";
  dw.innerHTML = done.map(j => {
    const open = OPEN.has(j.id);
    return "<div class='job" + (open ? " open" : "") + "' id='job_" + j.id + "'>" + jobHeadHtml(j) +
      "<div class='job-body'>" + readonlyItems(ITEMS[j.id] || []) +
      "<div class='ro' style='margin-top:8px;color:var(--muted);'>Filled by <b>" + esc(j.filled_by || "—") + "</b> on " + fmtDate(j.completed_at) + "</div></div></div>";
  }).join("");
}

function readonlyItems(items){
  return "<table class='cl'><thead><tr><th>#</th><th>Checklist Item</th><th>Result</th><th>Remark</th></tr></thead><tbody>" +
    items.map(it =>
      "<tr><td>" + it.item_no + "</td><td>" + esc(it.checklist_item) + "</td>" +
      "<td class='ro'>" + (it.result === "Good" ? "<span class='res-good'>Good</span>" : (it.result === "Bad" ? "<span class='res-bad'>Bad</span>" : "—")) + "</td>" +
      "<td class='ro'>" + esc(it.remark || "") + "</td></tr>"
    ).join("") + "</tbody></table>";
}

function toggle(id){ if(OPEN.has(id)) OPEN.delete(id); else OPEN.add(id); render(); }

// Visually highlight the chosen Good/Bad pill.
function markSel(input){
  const wrap = input.closest(".gb");
  wrap.querySelectorAll("label").forEach(l => l.classList.remove("sel"));
  if(input.checked) input.closest("label").classList.add("sel");
}

async function submitJob(jobId){
  const st = document.getElementById("st_" + jobId);
  const show = (cls, msg) => { st.style.display = "inline-block"; st.className = "status " + cls; st.textContent = msg; };
  const items = ITEMS[jobId] || [];

  // Gather results; every item must be marked.
  const updates = [];
  for(const it of items){
    const sel = document.querySelector("input[name='r_" + it.id + "']:checked");
    if(!sel){ return show("bad", "Mark every item Good or Bad before submitting."); }
    const remark = (document.getElementById("rmk_" + it.id) || {}).value || "";
    updates.push({ id: it.id, result: sel.value, remark: remark.trim() || null });
  }

  show("warn", "Submitting...");
  try{
    for(const u of updates){
      const { error } = await sb.from("pm_initiation_items").update({ result: u.result, remark: u.remark }).eq("id", u.id);
      if(error) throw error;
    }
    const { error: jErr } = await sb.from("pm_initiations").update({ status: "Completed", completed_at: new Date().toISOString(), filled_by: ME.username }).eq("id", jobId);
    if(jErr) throw jErr;

    const job = JOBS.find(j => j.id === jobId);
    const bad = updates.filter(u => u.result === "Bad").length;
    await logActivity("pm_checklist_submit", "Submitted PM checklist for " + (job ? job.policy_number + " on " + job.asset : ("job " + jobId)) + " (" + bad + " item(s) marked Bad).");

    show("ok", "Submitted. Thank you.");
    OPEN.delete(jobId);
    await load();
  }catch(e){
    show("bad", "Could not submit: " + (e.message || e));
  }
}

init();
</script>
</body>
</html>
