<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Manage QR Password — PET Collection</title>
<link rel="stylesheet" href="../../styles.css">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("rumbu_theme")||"navy"); }catch(e){} })();
  window.addEventListener("message",function(e){ if(e.data&&e.data.rumbuTheme) document.documentElement.setAttribute("data-theme",e.data.rumbuTheme); });
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../auth.js"></script>
<style>
  body{padding:20px;}
  .wrap{max-width:560px;margin:0 auto;}
  label{font-size:12px;font-weight:700;display:block;margin:14px 0 6px;color:var(--muted);}
  input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;background:var(--card);color:var(--text);}
  .card-panel{border:1px solid var(--line);border-radius:10px;padding:20px;background:var(--card);}
  .current-box{background:var(--bg);border-radius:8px;padding:14px;text-align:center;margin:10px 0 4px;}
  .current-box .pw{font-size:20px;font-weight:800;letter-spacing:2px;color:var(--heading);}
</style>
</head>
<body>
<div class="wrap">
  <button onclick="(window.parent&&window.parent.closeModule)?window.parent.closeModule():(window.location.href='../../index.html')" style="max-width:200px;margin-bottom:12px;background:var(--accent);color:var(--logo-fg);">&larr; Back</button>
  <div id="connStatus" style="font-size:12px;font-weight:700;text-align:center;margin-bottom:10px;color:var(--muted);">Loading...</div>

  <div id="appArea" style="display:none;">
    <div class="card-panel">
      <div style="font-weight:700;font-size:14px;color:var(--heading);margin:0 0 8px;">Manage QR Access Password</div>
      <p style="font-size:12px;color:var(--muted);margin:0 0 10px;">
        This is the single shared password required to view a bag's information after scanning its QR code. Changing it here takes effect immediately for every QR code already printed and in circulation.
      </p>

      <div style="font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700;text-align:center;">Current Password</div>
      <div class="current-box"><span class="pw" id="currentPw">••••••••</span> <button class="btn-ghost" style="padding:4px 10px;font-size:11px;margin-left:10px;" onclick="revealCurrent()">Show</button></div>

      <label>New Password *</label>
      <input type="text" id="newPw" placeholder="Enter a new password">
      <label>Confirm New Password *</label>
      <input type="text" id="newPwConfirm" placeholder="Re-enter the new password">

      <div style="margin-top:18px;">
        <button onclick="savePassword()">Save New Password</button>
      </div>
      <div id="saveStatus" style="margin-top:10px;font-size:13px;font-weight:700;min-height:16px;"></div>
    </div>
  </div>
</div>

<script>
let ME=null, CURRENT_PASSWORD=null;

async function init(){
  const cs=document.getElementById("connStatus");
  try{
    ME=await requireAuth("../../login.html");
    if(!ME) return;
    cs.style.display="none";
    document.getElementById("appArea").style.display="block";

    const { data, error } = await sb.from("pet_qr_settings").select("qr_password").eq("id",1).single();
    if(error) throw new Error(error.message);
    CURRENT_PASSWORD = data.qr_password;
  }catch(e){
    cs.style.display="block"; cs.style.color="var(--bad)"; cs.textContent="Error: "+e.message;
  }
}

function revealCurrent(){
  document.getElementById("currentPw").textContent = CURRENT_PASSWORD || "—";
}

async function savePassword(){
  const st=document.getElementById("saveStatus");
  const pw = document.getElementById("newPw").value.trim();
  const confirm = document.getElementById("newPwConfirm").value.trim();

  if(!pw){ st.style.color="var(--bad)"; st.textContent="Enter a new password."; return; }
  if(pw.length<4){ st.style.color="var(--bad)"; st.textContent="Password should be at least 4 characters."; return; }
  if(pw!==confirm){ st.style.color="var(--bad)"; st.textContent="Passwords do not match."; return; }

  st.style.color="var(--muted)"; st.textContent="Saving...";
  try{
    const { error } = await sb.from("pet_qr_settings").update({ qr_password: pw, updated_by: ME.id, updated_at: new Date().toISOString() }).eq("id",1);
    if(error) throw new Error(error.message);
    CURRENT_PASSWORD = pw;
    document.getElementById("newPw").value="";
    document.getElementById("newPwConfirm").value="";
    st.style.color="var(--ok)"; st.textContent="Password updated. This takes effect immediately.";
  }catch(e){ st.style.color="var(--bad)"; st.textContent="Error: "+e.message; }
}

init();
</script>
</body>
</html>
