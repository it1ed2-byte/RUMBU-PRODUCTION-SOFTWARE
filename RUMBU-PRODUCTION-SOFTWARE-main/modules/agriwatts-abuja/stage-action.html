<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Abuja Office Express Payment Request — Stage Action</title>
<link rel="stylesheet" href="../../styles.css">
<script>
  (function(){
    function apply(t){ if(t) document.documentElement.setAttribute("data-theme", t); }
    window.addEventListener("message", function(e){ if(e.data && e.data.rumbuTheme) apply(e.data.rumbuTheme); });
    try{ apply(localStorage.getItem("rumbu_theme")); }catch(e){}
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../auth.js"></script>
<script src="../../assets/letterhead.js"></script>
<style>
  body{padding:20px;}
  .wrap{max-width:1000px;margin:0 auto;}
  #connStatus{font-size:12px;font-weight:700;text-align:center;margin-bottom:10px;color:var(--muted);}
  .empty-note{background:var(--bg);border:1px dashed var(--line-2);border-radius:var(--radius);padding:24px;text-align:center;color:var(--muted);font-size:13px;}

  .req-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow);}
  .rc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px;flex-wrap:wrap;}
  .rc-ref{font-weight:800;color:var(--heading);font-size:14.5px;}
  .rc-stage{background:var(--bg);border:1px solid var(--line-2);border-radius:20px;padding:4px 12px;font-size:11.5px;font-weight:700;color:var(--muted);}
  .rc-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;font-size:13px;color:var(--text);margin-bottom:14px;}
  .rc-meta .m-label{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.3px;}

  .att-list{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 12px;}
  .att-list a{font-size:12px;background:var(--bg);border:1px solid var(--line-2);border-radius:16px;padding:3px 10px;color:var(--primary);text-decoration:none;font-weight:600;}
  .att-list a:hover{border-color:var(--accent);}

  .dropzone{background:var(--bg);border:1px dashed var(--line-2);border-radius:var(--radius);padding:18px 14px;text-align:center;cursor:pointer;}
  .dropzone:hover,.dropzone.drag{border-color:var(--accent);}
  .dropzone .dz-action{color:var(--primary);font-weight:700;font-size:13.5px;}
  .dropzone .dz-hint{font-size:11px;color:var(--muted);margin-top:2px;}
  .dropzone input[type=file]{display:none;}
  .file-list{margin-top:8px;display:flex;flex-direction:column;gap:6px;}
  .file-chip{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:7px;padding:5px 10px;font-size:12px;}
  .file-chip .fc-remove{color:var(--bad);cursor:pointer;font-weight:700;background:none;border:0;padding:0 4px;font-size:14px;}
</style>
</head>
<body>
<div class="wrap">
<button class="no-print" onclick="(window.parent&&window.parent.closeModule)?window.parent.closeModule():(window.location.href='../../index.html')" style="max-width:240px;margin-bottom:12px;background:var(--accent);color:var(--logo-fg);">&larr; Back to Dashboard</button>
<div id="connStatus">Loading...</div>

<div class="card-panel">
  <h3>Pending My Action — Abuja Office Express Payment Request</h3>
  <p class="sub">Requests waiting at a stage you're assigned to. All assignees on a stage must approve before it advances; a decline sends the request back to the submitter to edit and resubmit.</p>
</div>

<div id="topStatus" class="status" style="display:none;"></div>
<div id="listWrap"></div>
</div>

<script>
let ME = null;
let MY_EMPLOYEE_REF_ID = null;
let STAGES_BY_ID = {};
let STAGES = [];
let MY_STAGE_IDS = new Set();
let CD_NAME = {};                 // company_department id -> name
const STAGED_FILES = {};          // requestId -> { field_key: [File,...] }

function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
function fmtDate(s){ if(!s) return "—"; try{ return new Date(s).toLocaleDateString(); }catch(e){ return s; } }

// Which extra fields a stage shows, inferred from its name (matches the Kissflow steps).
function stageKind(name){
  const n = (name||"").toLowerCase();
  return {
    isPayment: n.indexOf("payment") !== -1,
    isUploadInvoice: n.indexOf("invoice") !== -1 && n.indexOf("upload") !== -1
  };
}
function isTerminalName(name){ return (name||"").toLowerCase().indexOf("complete") !== -1; }

async function init(){
  const status = document.getElementById("connStatus");
  try{
    ME = await requireAuth("../../login.html");
    if(!ME) return;

    const { data: emp, error: empErr } = await sb.from("employees").select("id").eq("linked_profile_id", ME.id).maybeSingle();
    if(empErr) throw empErr;
    if(!emp){ throw new Error("No employee record is linked to your account, so no stage assignments can be found for you."); }
    MY_EMPLOYEE_REF_ID = emp.id;

    const { data: stages, error: stErr } = await sb.from("abuja_workflow_stages").select("*").order("sequence_order");
    if(stErr) throw stErr;
    STAGES = stages || [];
    STAGES.forEach(s => STAGES_BY_ID[s.id] = s);

    const { data: assigns, error: asErr } = await sb.from("abuja_workflow_stage_assignees")
      .select("stage_id").eq("employee_ref_id", MY_EMPLOYEE_REF_ID);
    if(asErr) throw asErr;
    MY_STAGE_IDS = new Set((assigns||[]).map(a => a.stage_id));

    const { data: cds } = await sb.from("abuja_company_departments").select("id,name");
    (cds||[]).forEach(c => CD_NAME[c.id] = c.name);

    status.style.color = "#1d8a4e"; status.textContent = "Connected.";
    await loadPending();
  }catch(e){
    status.style.color = "#c0392b"; status.textContent = "❌ " + e.message; console.error(e);
  }
}

async function loadPending(){
  const wrap = document.getElementById("listWrap");
  if(!MY_STAGE_IDS.size){ wrap.innerHTML = "<div class='empty-note'>You aren't assigned to any workflow stage yet.</div>"; return; }

  const { data: requests, error } = await sb.from("abuja_requests")
    .select("*, abuja_payees(name,account_number,bank), employees:submitted_by(full_name)")
    .eq("status", "in_progress")
    .in("current_stage_id", Array.from(MY_STAGE_IDS))
    .order("request_date", { ascending: true });
  if(error){ wrap.innerHTML = "<div class='empty-note'>Error: " + esc(error.message) + "</div>"; return; }
  if(!requests || !requests.length){ wrap.innerHTML = "<div class='empty-note'>Nothing pending your action right now.</div>"; return; }

  // Drop any I've already acted on for the current stage + cycle.
  const ids = requests.map(r => r.id);
  const { data: myActions } = await sb.from("abuja_request_stage_actions")
    .select("request_id, stage_id, cycle").eq("employee_ref_id", MY_EMPLOYEE_REF_ID).in("request_id", ids);
  const acted = new Set((myActions||[]).map(a => a.request_id + ":" + a.stage_id + ":" + a.cycle));

  // Attachments per request (to show what was uploaded so far).
  const { data: atts } = await sb.from("abuja_request_attachments").select("request_id, field_key, file_name, file_url").in("request_id", ids);
  const attByReq = {}; (atts||[]).forEach(a => { (attByReq[a.request_id] = attByReq[a.request_id] || []).push(a); });

  wrap.innerHTML = "";
  requests.forEach(r => {
    if(acted.has(r.id + ":" + r.current_stage_id + ":" + r.cycle)) return;
    wrap.appendChild(renderRequestCard(r, attByReq[r.id] || []));
  });
  if(!wrap.children.length){ wrap.innerHTML = "<div class='empty-note'>Nothing pending your action right now.</div>"; }
}

function renderRequestCard(r, atts){
  const stage = STAGES_BY_ID[r.current_stage_id];
  const kind = stageKind(stage ? stage.stage_name : "");
  const el = document.createElement("div");
  el.className = "req-card";
  STAGED_FILES[r.id] = { payment_slip: [], invoice: [], invoice_2: [] };

  const attHtml = atts.length
    ? "<div class='att-list'>" + atts.map(a => "<a href='" + esc(a.file_url) + "' target='_blank'>" + esc(a.field_key) + ": " + esc(a.file_name) + "</a>").join("") + "</div>"
    : "";

  let extra = "";
  if(kind.isPayment){
    extra += fieldUpload(r.id, "payment_slip", "Payment Slip", true, false);
  }
  if(kind.isUploadInvoice){
    extra += fieldUpload(r.id, "invoice", "Invoice *", false, true);
    extra += fieldUpload(r.id, "invoice_2", "Invoice 2", true, false);
  }

  el.innerHTML =
    "<div class='rc-head'>" +
      "<span class='rc-ref'>" + esc(r.reference_no) + " — " + esc(r.title) + "</span>" +
      "<span class='rc-stage'>" + (stage ? esc(stage.stage_name) : "—") + "</span>" +
    "</div>" +
    "<div class='rc-meta'>" +
      "<div><span class='m-label'>Submitted by</span><br>" + esc(r.employees ? r.employees.full_name : "—") + "</div>" +
      "<div><span class='m-label'>Recipient</span><br>" + esc(r.abuja_payees ? r.abuja_payees.name + " — " + (r.abuja_payees.account_number||"") : "—") + "</div>" +
      "<div><span class='m-label'>Company / Department</span><br>" + esc(CD_NAME[r.company_id] || "—") + " / " + esc(CD_NAME[r.department_id] || "—") + "</div>" +
      "<div><span class='m-label'>Amount</span><br>" + esc(r.currency) + " " + Number(r.total_amount).toLocaleString() + "</div>" +
      "<div><span class='m-label'>Duration</span><br>" + esc(r.project_duration_days) + " day(s)</div>" +
      "<div><span class='m-label'>Description</span><br>" + esc(r.description || "—") + "</div>" +
    "</div>" +
    attHtml +
    extra +
    "<div class='field'><label>" + (stage ? esc(stage.stage_name.toUpperCase()) : "") + " Comment *</label><textarea id='comment-" + r.id + "' placeholder='Required'></textarea></div>" +
    "<div class='form-row'>" +
      "<div class='field'><label>ACTION *</label><select id='action-" + r.id + "'><option value=''>— Select —</option><option value='approve'>Approve</option><option value='decline'>Decline</option></select></div>" +
      "<div class='field'><label>Action Date</label><input type='datetime-local' id='actiondate-" + r.id + "'></div>" +
    "</div>" +
    "<button onclick=\"submitAction('" + r.id + "')\">Submit</button>" +
    "<div class='status' id='status-" + r.id + "' style='display:none;'></div>";

  wireDropzonesFor(el, r.id);
  setTimeout(()=>{ const d = document.getElementById("actiondate-" + r.id); if(d) d.value = new Date().toISOString().slice(0,16); }, 0);
  return el;
}

function fieldUpload(reqId, key, label, multi, required){
  return "<div class='field'><label>" + esc(label) + "</label>" +
    "<div class='dropzone' data-req='" + reqId + "' data-target='" + key + "' data-multi='" + (multi?"true":"false") + "'>" +
      "<div class='dz-action'>Upload file" + (multi?"s":"") + "</div>" +
      "<div class='dz-hint'>Drag and drop or paste from clipboard</div>" +
      "<input type='file'" + (multi?" multiple":"") + "></div>" +
    "<div class='file-list' data-list='" + reqId + "-" + key + "'></div></div>";
}

function wireDropzonesFor(container, requestId){
  container.querySelectorAll(".dropzone").forEach(zone=>{
    const key = zone.getAttribute("data-target");
    const multi = zone.getAttribute("data-multi") === "true";
    const input = zone.querySelector("input[type=file]");
    zone.addEventListener("click", ()=>input.click());
    input.addEventListener("change", e => stageFiles(requestId, key, multi, e.target.files));
    zone.addEventListener("dragover", e => { e.preventDefault(); zone.classList.add("drag"); });
    zone.addEventListener("dragleave", () => zone.classList.remove("drag"));
    zone.addEventListener("drop", e => { e.preventDefault(); zone.classList.remove("drag"); stageFiles(requestId, key, multi, e.dataTransfer.files); });
    zone.addEventListener("paste", e => { const items = (e.clipboardData || {}).files; if(items && items.length) stageFiles(requestId, key, multi, items); });
  });
}
function stageFiles(requestId, key, multi, fileList){
  const files = Array.from(fileList || []);
  if(!files.length) return;
  if(multi) STAGED_FILES[requestId][key].push(...files); else STAGED_FILES[requestId][key] = [files[0]];
  renderFileList(requestId, key);
}
function renderFileList(requestId, key){
  const wrap = document.querySelector(`.file-list[data-list="${requestId}-${key}"]`);
  if(!wrap) return;
  wrap.innerHTML = STAGED_FILES[requestId][key].map((f, i) =>
    `<div class="file-chip"><span>${esc(f.name)}</span><button class="fc-remove" onclick="removeStagedFile('${requestId}','${key}',${i})">&times;</button></div>`).join("");
}
function removeStagedFile(requestId, key, idx){ STAGED_FILES[requestId][key].splice(idx, 1); renderFileList(requestId, key); }
window.removeStagedFile = removeStagedFile;

async function submitAction(requestId){
  const status = document.getElementById("status-" + requestId);
  const show = (cls, msg) => { status.style.display = "inline-block"; status.className = "status " + cls; status.textContent = msg; };
  const action = document.getElementById("action-" + requestId).value;
  const comment = document.getElementById("comment-" + requestId).value.trim();
  const actionDate = document.getElementById("actiondate-" + requestId).value || new Date().toISOString();
  if(!action){ return show("err", "Select Approve or Decline."); }
  if(!comment){ return show("err", "A comment is required before you submit."); }

  show("", "Submitting...");
  try{
    const { data: reqRow, error: reqErr } = await sb.from("abuja_requests").select("cycle, current_stage_id").eq("id", requestId).single();
    if(reqErr) throw reqErr;
    const stage = STAGES_BY_ID[reqRow.current_stage_id];
    const kind = stageKind(stage ? stage.stage_name : "");

    // Invoice is required at the Upload Invoice step (before approving it).
    if(action === "approve" && kind.isUploadInvoice && !STAGED_FILES[requestId].invoice.length){
      // allow if an invoice was already uploaded on a previous pass
      const { count } = await sb.from("abuja_request_attachments").select("id", { count:"exact", head:true }).eq("request_id", requestId).eq("field_key", "invoice");
      if(!count){ return show("err", "Invoice upload is required at this stage."); }
    }

    // 1) Upload any staged files for this stage.
    for(const key of Object.keys(STAGED_FILES[requestId])){
      for(const file of STAGED_FILES[requestId][key]){
        const path = `abuja/${requestId}/${key}/${Date.now()}_${file.name}`;
        const { error: upErr } = await sb.storage.from("request-attachments").upload(path, file);
        if(upErr) throw upErr;
        const { data: pub } = sb.storage.from("request-attachments").getPublicUrl(path);
        await sb.from("abuja_request_attachments").insert({ request_id: requestId, field_key: key, file_name: file.name, file_url: pub.publicUrl, uploaded_by: MY_EMPLOYEE_REF_ID });
      }
    }

    // 2) Record this assignee's action for the stage + cycle.
    const { error: actErr } = await sb.from("abuja_request_stage_actions").insert({
      request_id: requestId, stage_id: reqRow.current_stage_id, employee_ref_id: MY_EMPLOYEE_REF_ID,
      action, comment, action_date: actionDate, cycle: reqRow.cycle
    });
    if(actErr) throw actErr;

    if(action === "decline"){
      const { error } = await sb.from("abuja_requests").update({ status: "rejected" }).eq("id", requestId);
      if(error) throw error;
    } else {
      // Advance only when every assignee on this stage has approved this cycle.
      const { data: assignees } = await sb.from("abuja_workflow_stage_assignees").select("employee_ref_id").eq("stage_id", reqRow.current_stage_id);
      const { data: approvals } = await sb.from("abuja_request_stage_actions")
        .select("employee_ref_id").eq("request_id", requestId).eq("stage_id", reqRow.current_stage_id).eq("cycle", reqRow.cycle).eq("action", "approve");
      const allApproved = (assignees||[]).length > 0 && (assignees||[]).every(a => (approvals||[]).some(ap => ap.employee_ref_id === a.employee_ref_id));
      if(allApproved){
        // Step to the NEXT stage by order (robust to non-consecutive sequence_order values).
        const idx = STAGES.findIndex(s => String(s.id) === String(reqRow.current_stage_id));
        const next = (idx >= 0 && idx < STAGES.length - 1) ? STAGES[idx + 1] : null;
        if(next){
          const done = isTerminalName(next.stage_name);
          const { error: advErr } = await sb.from("abuja_requests").update({ current_stage_id: next.id, status: done ? "completed" : "in_progress" }).eq("id", requestId);
          if(advErr) throw advErr;
        } else {
          const { error: advErr } = await sb.from("abuja_requests").update({ status: "completed" }).eq("id", requestId);
          if(advErr) throw advErr;
        }
      }
    }

    show("ok", "✅ Recorded.");
    const top = document.getElementById("topStatus");
    top.style.display = "block"; top.className = action === "decline" ? "status err" : "status ok";
    top.textContent = (action === "decline" ? "✅ Declined — " : "✅ Approved — ") + " request recorded. Refreshing...";
    setTimeout(()=>{ top.style.display = "none"; }, 4000);
    setTimeout(loadPending, 700);
  }catch(e){
    show("err", "❌ " + (e.message || e));
  }
}
window.submitAction = submitAction;

init();
</script>
</body>
</html>
