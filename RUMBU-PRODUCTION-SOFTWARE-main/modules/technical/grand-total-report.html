<title>Grand Total Report</title>
<link rel="stylesheet" href="../../styles.css">
<script>
  (function(){
    function apply(t){ if(t) document.documentElement.setAttribute("data-theme", t); }
    window.addEventListener("message", function(e){ if(e.data && e.data.rumbuTheme) apply(e.data.rumbuTheme); });

<style>
  :root{--navy:var(--heading);}
  *{box-sizing:border-box;}
  body{font-family:var(--sans);background:var(--bg);padding:15px;margin:0;}
  .box{max-width:480px;margin:0 auto 16px;background:var(--card);padding:15px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.1);}
  h2{color:var(--navy);text-align:center;margin-bottom:15px;font-size:1.2em;}
  label{display:block;margin-top:10px;font-weight:600;font-size:.95em;}
  select,input,button{width:100%;padding:8px;margin-top:6px;font-size:.95em;border:1px solid var(--line);border-radius:6px;box-sizing:border-box;}
  button{background:var(--navy);color:#fff;font-weight:bold;cursor:pointer;}
  button.alt{background:#00695C;margin-top:8px;}
  #status{text-align:center;color:var(--navy);margin-top:10px;font-size:.9em;font-weight:bold;}
  .wide{max-width:480px;margin:0 auto;}
  table{border-collapse:collapse;width:100%;margin-top:10px;}
  th,td{border:1px solid #444;padding:5px;text-align:center;}
  th{background:var(--navy);color:#fff;font-weight:bold;}
  @media print{ .no-print{display:none !important;} }
</style>

function getJobCodesByDepartment(department){
  if(department === "All") return Object.values(DEPARTMENTS).flat();
  return DEPARTMENTS[department] || [];
}


async function fetchAllControlRows(){
  const pageSize=1000; let all=[], offset=0;
  while(true){
    const res = await fetch(SUPABASE_URL + "/rest/v1/control?select=*&limit="+pageSize+"&offset="+offset, { headers: authHeaders() });
    if(!res.ok) throw new Error("HTTP " + res.status);
    const page = await res.json();
    all = all.concat(page);
    if(page.length < pageSize) break;
    offset += pageSize;
  }
  return all;
}


function normalizeControlRow(r){
  if(r.date_col === undefined) r.date_col = r.date;
  if(r.names === undefined) r.names = r.nurse_name;
  if(r.stop_time === undefined) r.stop_time = r.mc_stoppage_time;
  if(r.extimated_time === undefined) r.extimated_time = r.estimated_duration;
  if(r.discription === undefined) r.discription = r.description;
  return r;
}

async function init(){
  const status = document.getElementById("status");
  try{
    const me = await requireAuth("../../login.html");
    if(!me) return;

    const mySections = (me.sectionNames && me.sectionNames.length) ? me.sectionNames : ["Rumbu","MamaSannu"];
    document.getElementById("section").innerHTML = '<option>All</option>' +
      mySections.map(s=>`<option value="${s}">${SECTION_LABEL[s]||s}</option>`).join("");

    const jobRes = await fetch(SUPABASE_URL + "/rest/v1/job_table?select=job_code", { headers: authHeaders() });
    if(jobRes.ok){
      const jobRows = await jobRes.json();
      EXCLUDED_JOB_CODES = new Set(jobRows.map(r=>r.job_code));
    }
    // Department dropdown — uses known department column values matching BigQuery's
    // SELECT DISTINCT Department FROM maintenance_log. Hardcoded to avoid paginating
    // through 93k rows just to get distinct values.
    const KNOWN_DEPARTMENTS = [
      "BEAMING","DELIVERY","DESIGN CARD","ELEC EXTRUDER","ELEC MAT WEAVING",
      "ELECRICAL RECYCLING","ELECTRICAL TWINE","EXT-MECH CUTTER","EXT-MECH DIE HEAD",
      "EXTRUDER","FEEDING","QUALITY CONTROL","RECYCLING","Technical",
      "TRANSMISSION","TWINE"
    ];
    const deptSel = document.getElementById("department");
    KNOWN_DEPARTMENTS.forEach(d=>{
      const o = document.createElement("option");
      o.value = d; o.textContent = d;
      deptSel.appendChild(o);
    });
    status.style.color="#1d8a4e";
    status.textContent = "Ready. Select a date range and click Generate.";
  }catch(e){
    status.style.color="#c0392b"; status.textContent = "Could not read data: " + (e.message||e);
  }
}

async function fetchAllRows(table, select, query){
  let all = [], offset = 0; const pageSize = 1000;
  const q = query || "";
  for(let guard=0; guard<500; guard++){
    const headers = Object.assign({}, authHeaders(), { "Range-Unit":"items", "Range": offset + "-" + (offset+pageSize-1) });
    const res = await fetch(SUPABASE_URL + "/rest/v1/" + table + "?select=" + (select||"*") + q, { headers });
    if(!res.ok) throw new Error(table + ": HTTP " + res.status);
    const batch = await res.json();
    all = all.concat(batch);
    if(batch.length < pageSize) break;
    offset += pageSize;
  }
  return all;
}

async function generate(){
  const dateFrom = document.getElementById("dateFrom").value;
  const dateTo = document.getElementById("dateTo").value;
  const department = document.getElementById("department").value;
  const shift = document.getElementById("shift").value;
  const section = document.getElementById("section").value;
  if(!dateFrom || !dateTo){ alert("⚠️ Please select both From and To dates."); return; }

  const status = document.getElementById("status");
  status.style.color=""; status.textContent = "Loading…";
  try{
    // FIX: Filter on the date column (operator-recorded date = BigQuery Event_Date).
    // Matches DATE(m.MC_Stoppage_Time) in the GAS script — the operator's recorded
    // date, NOT the raw timestamp. Same fix applied to downtime-by-assets.html.
    CTRL_ROWS = await fetchAllRows("control","*", "&date=gte."+dateFrom+"&date=lte."+dateTo);
    CTRL_ROWS.forEach(normalizeControlRow);
  }catch(e){
    status.style.color="#c0392b"; status.textContent = "Could not read data: " + (e.message||e); return;
  }
  status.textContent = "";

  const rows = CTRL_ROWS.filter(r=>{
    // FIX: Use date_col (operator-recorded date) — same as BigQuery Event_Date.
    // Do NOT derive from mc_stoppage_time; night-shift timestamps cross midnight
    // and cause boundary records to land on the wrong day.
    const recDate = r.date_col || null;
    if(!recDate || recDate < dateFrom || recDate > dateTo) return false;
    // Exclude job_table codes (operational codes like EX01-EX10)
    if(EXCLUDED_JOB_CODES.has(r.job_code)) return false;
    // Department: filter by actual department COLUMN — matches old AppScript's
    // AND Department=@department. Do NOT use job-code mapping here; that approach
    // pulls in records from other departments that share job codes, inflating totals.
    if(department !== "All" && (r.department||"").trim() !== department) return false;
    // Shift
    if(shift !== "All" && r.shift !== shift) return false;
    // FIX: Section filter.
    // The GAS script uses AND Section=@section where the value passed is exactly
    // "Mama Sannu" (with a space) or "Rumbu". The Supabase column stores it with
    // a space too, so we must check for "MAMA SANNU" (space), not "MAMASANNU".
    if(section !== "All"){
      const sec = (r.section||"").toUpperCase().trim();
      const isMama = sec === "MAMA SANNU" || sec.includes("MAMA SANNU");
      if(section === "MamaSannu" && !isMama) return false;
      if(section === "Rumbu"     &&  isMama) return false;
    }
    return true;
  });

  let downtime=0, repairTime=0;
  rows.forEach(r=>{
    // FIX: Mirror BigQuery's TIMESTAMP_DIFF null behaviour exactly.
    // TIMESTAMP_DIFF returns NULL when either argument is NULL, and
    // SUM() ignores NULLs — so any record missing a timestamp is skipped.
    // minutesBetween() was returning 0 for null inputs, causing records
    // with missing timestamps to partially contribute (e.g. repair counted
    // but downtime=0, or downtime counted but repair=0), skewing both totals.
    const tStop  = parseDT(r.stop_time);
    const tStart = parseDT(r.starting_time);
    const tFinish= parseDT(r.finish_time);
    if(!tStop || !tStart || !tFinish) return; // skip — mirrors SQL NULL behaviour
    const d   = Math.trunc((tFinish - tStop)  / 60000);
    const rep = Math.trunc((tFinish - tStart) / 60000);
    if(d < 0 || rep < 0) return; // skip impossible values
    downtime   += d;
    repairTime += rep;
  });
  downtime = Math.ceil(downtime);
  repairTime = Math.ceil(repairTime);
  const waitingTime = Math.ceil(downtime - repairTime);
  const finishPercent = downtime ? Math.ceil((repairTime/downtime)*100) : 0;
  const waitingPercent = downtime ? Math.ceil((waitingTime/downtime)*100) : 0;

  document.getElementById("reportArea").innerHTML = `
    <div class="box"><h2>📊 GRAND TOTAL REPORT</h2>
    <table><tr><th>Metric</th><th>Minutes</th></tr>
      <tr><td>Downtime</td><td>${downtime}</td></tr>
      <tr><td>Repair Time</td><td>${repairTime}</td></tr>
      <tr><td>Waiting Time</td><td>${waitingTime}</td></tr>
    </table>
    <table style="margin-top:10px;"><tr><th>Metric</th><th>Percentage</th></tr>
      <tr><td>% Finish Time</td><td>${finishPercent}%</td></tr>
      <tr><td>% Waiting Time</td><td>${waitingPercent}%</td></tr>
    </table></div>`;
}

init();
</script>
