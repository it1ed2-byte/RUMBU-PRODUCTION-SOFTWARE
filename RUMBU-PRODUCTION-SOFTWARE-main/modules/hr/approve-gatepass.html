<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HR — Approve Gatepass</title>
<link rel="stylesheet" href="../../styles.css">
<script>
  (function(){
    function apply(t){ if(t) document.documentElement.setAttribute("data-theme", t); }
    window.addEventListener("message", function(e){ if(e.data && e.data.rumbuTheme) apply(e.data.rumbuTheme); });
    try{ apply(localStorage.getItem("rumbu_theme")); }catch(e){}
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../auth.js"></script>
<style>
  :root{--navy:var(--heading);--blue:var(--accent);--blue-dark:var(--accent-2);--muted:#6b7280;--red:#c0392b;--green:#1d8a4e;--amber:#d97706;}
  *{box-sizing:border-box;}
  body{font-family:var(--sans);background:var(--bg);margin:0;padding:18px;color:var(--text);}
  .wrap{max-width:1050px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;}
  .card h3{color:var(--navy);margin:0 0 4px;font-size:16px;}
  .card .sub{color:var(--blue);font-size:12px;margin:0 0 14px;}
  label{display:block;font-size:12px;font-weight:bold;color:var(--text);margin:10px 0 4px;}
  select,input{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
  .row > div{flex:1;min-width:150px;}
  button{padding:10px 14px;border:none;border-radius:8px;font-weight:bold;font-size:13px;cursor:pointer;background:var(--blue);color:#fff;}
  button:hover{background:var(--blue-dark);}
  button.mini{padding:6px 10px;font-size:12px;}
  button.ok{background:var(--green);}
  button.ok:hover{background:#166a2c;}
  button.rej{background:var(--red);}
  button.rej:hover{background:#96242e;}
  button.view{background:#6b7280;}
  button.view:hover{background:#4b5563;}
  .status{margin-top:10px;font-weight:bold;font-size:13px;min-height:16px;}
  .status.ok{color:var(--green);} .status.err{color:var(--red);}
  #connStatus{font-size:12px;font-weight:bold;text-align:center;margin-bottom:10px;}
  table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px;}
  th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;}
  thead th{background:var(--navy);color:#fff;font-size:12px;}
  tbody tr:nth-child(even){background:#f6f8fb;}
  .tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:bold;color:#fff;}
  .tag.pending{background:var(--amber);}
  .tag.approved{background:var(--green);}
  .tag.rejected{background:var(--red);}
  .noaccess{color:var(--red);font-weight:bold;text-align:center;padding:30px;}
</style>
</head>
<body>

<div class="wrap">
<div id="connStatus">Loading...</div>

<div id="appArea" style="display:none;">
<div class="card">
  <h3>Approve Gatepass</h3>
  <p class="sub" id="scopeNote"></p>
  <div class="row">
    <div>
      <label>Status</label>
      <select id="statusFilter" onchange="applyFilters()">
        <option value="pending">Pending (awaiting decision)</option>
        <option value="approved">Approved</option>
        <option value="rejected">Rejected</option>
        <option value="">All</option>
      </select>
    </div>
    <div>
      <label>Search (part / person / number)</label>
      <input type="text" id="search" placeholder="Type to filter" oninput="applyFilters()">
    </div>
    <div style="flex:0 0 auto;">
      <button onclick="loadRecords()">Refresh</button>
    </div>
  </div>
  <div class="status" id="status"></div>
</div>

<div class="card">
  <div id="tableWrap"></div>
</div>
</div>

<div id="noAccess" class="noaccess" style="display:none;">
  You do not have permission to approve gatepasses. Only Admins and Super Admins can.
</div>
</div>

<script>
let ME = null;
let ALL = [];
const COMPANY = "Rumbu Industries Limited";

async function logActivity(actionType, description){
  try{
    await sb.from("activity_log").insert({
      actor_id: ME.id, actor_username: ME.username, actor_role: ME.role,
      section_id: ME.sectionId, action_type: actionType, description: description
    });
  }catch(e){ console.warn("Activity log write failed (non-fatal):", e); }
}

async function init(){
  const status = document.getElementById("connStatus");
  try{
    ME = await requireAuth("../../login.html");
    if(!ME) return;

    // Only Admin / Super Admin can approve.
    if(ME.role !== "super_admin" && ME.role !== "admin"){
      status.style.color = "#1d8a4e"; status.textContent = "Connected.";
      document.getElementById("noAccess").style.display = "block";
      return;
    }

    document.getElementById("appArea").style.display = "block";
    document.getElementById("scopeNote").textContent = ME.role === "super_admin"
      ? "You can approve gatepasses from every Branch."
      : "You can approve gatepasses for your own Branch only" + (ME.sectionName ? " (" + ME.sectionName + ")." : ".");

    status.style.color = "#1d8a4e";
    status.textContent = "Connected.";
    await loadRecords();
  }catch(e){
    status.style.color = "#c0392b";
    status.textContent = "❌ " + e.message;
    console.error(e);
  }
}

async function loadRecords(){
  const status = document.getElementById("status");
  status.className = "status"; status.textContent = "Loading...";
  try{
    let q = sb.from("hr_gatepass").select("*").order("created_at", { ascending: false });
    if(ME.role !== "super_admin"){
      if(ME.sectionNames && ME.sectionNames.length){
        q = q.in("branch", ME.sectionNames);
      } else {
        q = q.eq("branch", "___none___");
      }
    }
    const { data, error } = await q;
    if(error) throw error;
    ALL = data || [];
    status.className = "status ok"; status.textContent = ALL.length + " gatepass(es) loaded.";
    applyFilters();
  }catch(e){
    status.className = "status err"; status.textContent = "❌ " + e.message;
  }
}

function applyFilters(){
  const st = document.getElementById("statusFilter").value;
  const search = document.getElementById("search").value.trim().toLowerCase();
  let rows = ALL.slice();
  if(st) rows = rows.filter(r => (r.status || "pending") === st);
  if(search){
    rows = rows.filter(r =>
      (r.part_name || "").toLowerCase().includes(search) ||
      (r.person_name || "").toLowerCase().includes(search) ||
      (r.gatepass_number || "").toLowerCase().includes(search)
    );
  }
  render(rows);
}

function render(rows){
  const wrap = document.getElementById("tableWrap");
  if(!rows.length){ wrap.innerHTML = "<p>No gatepasses match.</p>"; return; }

  let html = "<table><thead><tr>" +
    "<th>Number</th><th>Date</th><th>Part</th><th>Person</th><th>Qty</th>" +
    "<th>Branch</th><th>Status</th><th>Actions</th>" +
    "</tr></thead><tbody>";
  rows.forEach(r=>{
    const st = r.status || "pending";
    let actions = `<button class="mini view" onclick="openPDF(${r.id})">Open/PDF</button> `;
    if(st === "pending"){
      actions += `<button class="mini ok" onclick="decide(${r.id},'approved')">Approve</button> ` +
                 `<button class="mini rej" onclick="decide(${r.id},'rejected')">Reject</button>`;
    } else {
      actions += `<span style="font-size:11px;color:#6b7280;">by ${r.approved_by || "-"}</span>`;
    }
    html += "<tr>" +
      `<td>${r.gatepass_number || ""}</td>` +
      `<td>${r.pass_date || ""}</td>` +
      `<td>${r.part_name || ""}</td>` +
      `<td>${r.person_name || ""}</td>` +
      `<td>${r.quantity != null ? r.quantity : ""}</td>` +
      `<td>${r.branch || ""}</td>` +
      `<td><span class="tag ${st}">${st.toUpperCase()}</span></td>` +
      `<td>${actions}</td>` +
    "</tr>";
  });
  html += "</tbody></table>";
  wrap.innerHTML = html;
}

async function decide(id, decision){
  const r = ALL.find(x => x.id === id);
  if(!r) return;

  let reason = null;
  if(decision === "rejected"){
    reason = prompt("Reason for rejecting gatepass " + r.gatepass_number + " (optional):", "");
    if(reason === null) return; // cancelled
  } else {
    if(!confirm("Approve gatepass " + r.gatepass_number + " for " + r.person_name + "?")) return;
  }

  const status = document.getElementById("status");
  status.className = "status"; status.textContent = "Saving decision...";
  try{
    const { error } = await sb.from("hr_gatepass").update({
      status: decision,
      approved_by: ME.username,
      approved_at: new Date().toISOString(),
      reject_reason: decision === "rejected" ? (reason || null) : null
    }).eq("id", id);
    if(error) throw error;

    await logActivity("gatepass_" + decision, ME.username + " " + decision + " gatepass " + r.gatepass_number + " (" + r.person_name + ")");
    status.className = "status ok"; status.textContent = "✅ Gatepass " + r.gatepass_number + " " + decision + ".";
    await loadRecords();
  }catch(e){
    status.className = "status err"; status.textContent = "❌ " + e.message;
  }
}

function buildGatepassHTML(r){
  const st = (r.status || "pending").toUpperCase();
  const stColor = st === "APPROVED" ? "#1d8a4e" : (st === "REJECTED" ? "#c0392b" : "#d97706");
  return `
<html><head><style>
@page { size:A4; margin:40pt 50pt; }
body { font-family:"Times New Roman", serif; font-size:12pt; margin:0; padding:40px; color:#000; }
h2 { text-align:center; font-size:18pt; margin:0 0 4px; }
h3 { text-align:center; font-size:14pt; margin:0 0 24px; letter-spacing:2px; }
table { width:100%; border-collapse:collapse; margin-top:10px; }
td { padding:8px 10px; border:1px solid #000; vertical-align:top; }
td.k { width:32%; font-weight:bold; background:#f0f0f0; }
.status-box { margin-top:22px; font-size:13pt; }
.sign { margin-top:70px; display:flex; justify-content:space-between; }
.sign div { width:45%; border-top:1px solid #000; padding-top:6px; text-align:center; font-size:11pt; }
</style></head><body>
<h2>${COMPANY}</h2>
<h3>MATERIAL GATE PASS</h3>
<table>
<tr><td class="k">Gatepass No.</td><td>${r.gatepass_number || ""}</td></tr>
<tr><td class="k">Date</td><td>${r.pass_date || ""}</td></tr>
<tr><td class="k">Branch</td><td>${r.branch || ""}</td></tr>
<tr><td class="k">Part Name</td><td>${r.part_name || ""}</td></tr>
<tr><td class="k">Quantity</td><td>${r.quantity != null ? r.quantity : ""}</td></tr>
<tr><td class="k">Person (carrying out)</td><td>${r.person_name || ""}</td></tr>
<tr><td class="k">Description</td><td>${r.description || ""}</td></tr>
<tr><td class="k">Raised By</td><td>${r.created_by_username || ""}</td></tr>
</table>
<div class="status-box">
<b>Status:</b> <span style="color:${stColor};font-weight:bold;">${st}</span>
${r.approved_by ? " &nbsp; | &nbsp; <b>By:</b> " + r.approved_by : ""}
${r.approved_at ? " &nbsp; | &nbsp; <b>On:</b> " + new Date(r.approved_at).toLocaleString() : ""}
${(st === "REJECTED" && r.reject_reason) ? "<br><b>Reason:</b> " + r.reject_reason : ""}
</div>
<div class="sign">
  <div>Authorised Signature</div>
  <div>Security / Gate Officer</div>
</div>
</body></html>`;
}

function openPDF(id){
  const r = ALL.find(x => x.id === id);
  if(!r) return;
  const w = window.open("", "_blank");
  w.document.write(buildGatepassHTML(r));
  w.document.close();
  w.onload = function(){ w.focus(); w.print(); };
}

init();
</script>
</body>
</html>
