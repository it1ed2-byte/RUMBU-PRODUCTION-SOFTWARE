<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HR — Add Gatepass</title>
<link rel="stylesheet" href="../../styles.css">
<script>
  (function(){
    function apply(t){ if(t) document.documentElement.setAttribute("data-theme", t); }
    window.addEventListener("message", function(e){ if(e.data && e.data.rumbuTheme) apply(e.data.rumbuTheme); });
    try{ apply(localStorage.getItem("rumbu_theme")); }catch(e){}
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../auth.js"></script>
<style>
  :root{--navy:var(--heading);--blue:var(--accent);--blue-dark:var(--accent-2);--muted:#6b7280;--red:#c0392b;--green:#1d8a4e;}
  *{box-sizing:border-box;}
  body{font-family:var(--sans);background:var(--bg);margin:0;padding:18px;color:var(--text);}
  .wrap{max-width:720px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;}
  .card h3{color:var(--navy);margin:0 0 4px;font-size:16px;}
  .card .sub{color:var(--blue);font-size:12px;margin:0 0 14px;}
  label{display:block;font-size:12px;font-weight:bold;color:var(--text);margin:10px 0 4px;}
  input,textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;}
  textarea{resize:vertical;min-height:70px;}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row > div{flex:1;min-width:180px;}
  button{padding:11px 16px;border:none;border-radius:8px;font-weight:bold;font-size:14px;cursor:pointer;background:var(--blue);color:#fff;margin-top:14px;}
  button:hover{background:var(--blue-dark);}
  button:disabled{opacity:.6;cursor:not-allowed;}
  .status{margin-top:10px;font-weight:bold;font-size:13px;min-height:16px;}
  .status.ok{color:var(--green);} .status.err{color:var(--red);}
  #connStatus{font-size:12px;font-weight:bold;text-align:center;margin-bottom:10px;}
</style>
</head>
<body>

<div class="wrap">
<div id="connStatus">Loading...</div>

<div class="card">
  <h3>Add Gatepass &mdash; Material Out of Company</h3>
  <p class="sub" id="branchNote"></p>

  <div class="row">
    <div>
      <label>Branch (this gatepass is for)</label>
      <select id="branch"></select>
    </div>
    <div>
      <label>Date</label>
      <input type="date" id="passDate">
    </div>
  </div>

  <div class="row">
    <div>
      <label>Part Name</label>
      <input type="text" id="partName" placeholder="e.g. Bearing 6204">
    </div>
    <div>
      <label>Quantity</label>
      <input type="number" step="any" id="quantity" placeholder="e.g. 5">
    </div>
  </div>

  <label>Name of Person (taking material out)</label>
  <input type="text" id="personName" placeholder="Full name">

  <label>Description</label>
  <textarea id="description" placeholder="Reason / where it is going / any notes"></textarea>

  <button onclick="save()">Save Gatepass</button>
  <div class="status" id="status"></div>
</div>
</div>

<script>
let ME = null;

function todayISO(){ return new Date().toISOString().slice(0,10); }

async function logActivity(actionType, description){
  try{
    await sb.from("activity_log").insert({
      actor_id: ME.id, actor_username: ME.username, actor_role: ME.role,
      section_id: ME.sectionId, action_type: actionType, description: description
    });
  }catch(e){ console.warn("Activity log write failed (non-fatal):", e); }
}

async function init(){
  const status = document.getElementById("connStatus");
  try{
    ME = await requireAuth("../../login.html");
    if(!ME) return;

    document.getElementById("passDate").value = todayISO();
    populateBranches();
    document.getElementById("branchNote").textContent = "Signed in as " + ME.username;

    status.style.color = "#1d8a4e";
    status.textContent = "Connected.";
  }catch(e){
    status.style.color = "#c0392b";
    status.textContent = "❌ " + e.message;
    console.error(e);
  }
}

// Only branches this person holds; single -> auto-fill and lock.
function populateBranches(){
  const sel = document.getElementById("branch");
  sel.innerHTML = "";

  if(ME.role === "super_admin"){
    sb.from("app_sections").select("name").order("name").then(({data})=>{
      (data || []).forEach(s=>{
        const o = document.createElement("option");
        o.value = s.name; o.textContent = s.name;
        sel.appendChild(o);
      });
    });
    sel.disabled = false;
    return;
  }

  const mine = ME.sectionNames || [];
  if(!mine.length){
    const o = document.createElement("option");
    o.value = ""; o.textContent = "— no branch assigned —";
    sel.appendChild(o);
    sel.disabled = true;
    return;
  }
  mine.forEach(name=>{
    const o = document.createElement("option");
    o.value = name; o.textContent = name;
    sel.appendChild(o);
  });
  sel.disabled = (mine.length === 1);
}

async function nextNumber(){
  const year = new Date().getFullYear().toString();
  const prefix = "GP-" + year;
  const { data, error } = await sb
    .from("hr_gatepass")
    .select("gatepass_number")
    .like("gatepass_number", prefix + "%")
    .order("gatepass_number", { ascending: false })
    .limit(1);
  if(error) throw error;
  let seq = 1;
  if(data && data.length){
    const last = data[0].gatepass_number;      // GP-20260007
    seq = parseInt(last.slice(prefix.length), 10) + 1;
  }
  return prefix + String(seq).padStart(4, "0");
}

async function save(){
  const status = document.getElementById("status");
  const g = id => document.getElementById(id).value.trim();

  const branch = g("branch");
  const passDate = g("passDate");
  const partName = g("partName");
  const personName = g("personName");
  const quantity = g("quantity");
  const description = g("description");

  if(!partName || !personName){ status.className = "status err"; status.textContent = "Part name and person's name are required."; return; }
  if(!passDate){ status.className = "status err"; status.textContent = "Date is required."; return; }
  if(!branch){ status.className = "status err"; status.textContent = "No Branch available — ask your Super Admin to assign you a Branch."; return; }
  if(ME.role !== "super_admin" && (ME.sectionNames || []).indexOf(branch) === -1){
    status.className = "status err"; status.textContent = "You are not assigned to that Branch."; return;
  }

  status.className = "status"; status.textContent = "Saving...";
  try{
    const number = await nextNumber();
    const { error } = await sb.from("hr_gatepass").insert({
      gatepass_number: number,
      branch: branch,
      pass_date: passDate,
      part_name: partName,
      person_name: personName,
      quantity: quantity ? parseFloat(quantity) : null,
      description: description || null,
      status: "pending",
      created_by_username: ME.username
    });
    if(error) throw error;

    await logActivity("gatepass_added", ME.username + " added gatepass " + number + " for " + personName + " (" + partName + ")");
    status.className = "status ok"; status.textContent = "✅ Saved as " + number + " (pending approval).";

    ["partName","personName","quantity","description"].forEach(id => document.getElementById(id).value = "");
    document.getElementById("passDate").value = todayISO();
  }catch(e){
    status.className = "status err"; status.textContent = "❌ " + e.message;
  }
}

init();
</script>
</body>
</html>
