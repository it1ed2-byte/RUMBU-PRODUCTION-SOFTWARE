<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RumbuApp — Login</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F3864">
<link rel="icon" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RumbuApp">
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- auth.js gives this page the same connection (sb), the Rumbu logo and the no-network banner as the rest of the app. -->
<script src="auth.js"></script>
<style>
  html, body{touch-action:manipulation;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain;}
  button, a, img{-webkit-touch-callout:none;}
  img{-webkit-user-drag:none;}
  :root{--navy:#1F3864;--blue:#2E75B6;--blue-dark:#245d92;--line:#d8dee8;--bg:#eef2f7;--red:#c0392b;
    --sans:"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  *{box-sizing:border-box;}
  body{font-family:var(--sans);background:linear-gradient(135deg,var(--navy) 0%,#142a4d 100%);margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;overflow-x:hidden;}
  .login-wrap{position:relative;width:100%;max-width:420px;}
  .brand-watermark{position:absolute;left:50%;top:-170px;transform:translateX(-50%);width:340px;max-width:80vw;opacity:.55;filter:drop-shadow(0 18px 36px rgba(0,0,0,.45));pointer-events:none;z-index:0;user-select:none;}
  .card{position:relative;z-index:1;background:#fff;border-radius:14px;padding:36px 30px;width:100%;max-width:380px;margin:0 auto;box-shadow:0 12px 32px rgba(0,0,0,.25);}
  h1{color:var(--navy);font-size:18px;text-align:center;margin:0 0 4px;letter-spacing:.5px;}
  p.sub{text-align:center;color:#6b7280;font-size:12px;margin:0 0 24px;}
  label{display:block;font-size:12px;font-weight:bold;color:var(--text);margin:14px 0 4px;}
  input{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;}
  input:focus{outline:2px solid var(--blue);border-color:var(--blue);}
  button{width:100%;padding:12px;margin-top:20px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:bold;cursor:pointer;}
  button:hover{background:var(--blue-dark);}
  button:disabled{opacity:.6;cursor:not-allowed;}
  .status{margin-top:14px;text-align:center;font-size:13px;font-weight:bold;min-height:16px;}
  .status.err{color:var(--red);}
  .status.ok{color:#1d8a4e;}
  .pw-wrap{position:relative;}
  .pw-wrap input{padding-right:58px;}
  .pw-toggle{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:auto;margin:0;padding:6px 8px;background:none;color:var(--blue);border:none;border-radius:6px;font-size:12px;font-weight:bold;cursor:pointer;}
  .pw-toggle:hover{background:#eef2f7;color:var(--blue-dark);}
  .brand-watermark.rs-wm{height:auto;aspect-ratio:974/1028;filter:brightness(0) invert(1);}
  .card-logo{display:flex;justify-content:center;margin:0 0 10px;}
  .card-logo .rs-tile{width:60px;height:60px;}
  .notice{display:none;margin:0 0 14px;padding:10px 12px;border-radius:8px;font-size:12.5px;line-height:1.5;text-align:left;}
  .notice.show{display:block;}
  .notice.info{background:#eef4fc;color:#1d3a7a;border:1px solid #c9d6f2;}
  .notice.warn{background:#fff8e6;color:#6b4a00;border:1px solid #f5d48a;}
  #goingIn{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy) 0%,#142a4d 100%);}
  #goingIn.show{display:flex;}
  #goingIn .rs-loader{color:#dbe6f7;}
  #goingIn .rs-loader .rs-tile{width:96px;height:96px;}
</style>
</head>
<body>

<div class="login-wrap">
  <div class="brand-watermark rs-wm" id="watermark" aria-hidden="true"></div>
  <div class="card">
  <div class="card-logo" id="cardLogo" aria-hidden="true"></div>
  <h1>RumbuApp</h1>
  <p class="sub">RUMBU INDUSTRIES GROUP &bull; Sign in</p>
  <div class="notice" id="notice" role="status"></div>

  <label>Username or Email</label>
  <input type="text" id="username" autocomplete="username" placeholder="Employee ID or email" onkeydown="if(event.key==='Enter'){document.getElementById('password').focus();}">

  <label>Password</label>
  <div class="pw-wrap">
    <input type="password" id="password" autocomplete="current-password" onkeydown="if(event.key==='Enter'){login();}">
    <button type="button" class="pw-toggle" onclick="togglePasswordField('password', this)">Show</button>
  </div>

  <button id="loginBtn" onclick="login()">LOG IN</button>
  <div class="status" id="status" role="alert" aria-live="assertive"></div>
  </div>
</div>
<div id="goingIn" role="status" aria-live="polite"></div>

<script>
// sb (the connection) comes from auth.js.
document.getElementById("watermark").innerHTML = RumbuUI.logoSvg(false);
document.getElementById("cardLogo").innerHTML = '<span class="rs-tile">' + RumbuUI.logoSvg(false) + '</span>';
(function(){
  const q = new URLSearchParams(location.search), n = document.getElementById("notice");
  if(q.get("expired") === "1"){ n.className = "notice info show"; n.textContent = "Your session ended, so you were signed out for your security. Sign in again to carry on."; }
  else if(q.get("blocked") === "inactive"){ n.className = "notice warn show"; n.textContent = "Your account is not active at the moment. Contact HR or IT if you think this is wrong."; }
})();
// Is this error a connection problem rather than a wrong password?
function isNetworkError(err){
  if(!navigator.onLine) return true;
  if(!err) return false;
  if(err.status === 0 || err.name === "AuthRetryableFetchError" || err.name === "TypeError") return true;
  return RumbuUI.explain(err).kind === "network";
}
function setBusy(on){
  const btn = document.getElementById("loginBtn"), wm = document.getElementById("watermark");
  btn.disabled = on;
  btn.innerHTML = on ? '<span class="rs-dots">Signing in</span>' : "LOG IN";
  wm.innerHTML = RumbuUI.logoSvg(on);   // the big logo behind the card animates while signing in
}
function showNetError(status){
  status.className = "status err";
  status.textContent = navigator.onLine ? "Can't reach the server. Check the network, then try again." : "No internet connection. Reconnect, then try again.";
}

// Shared show/hide toggle for any password-type field: swaps the input's
// type between password and text and updates the button's own label.
function togglePasswordField(inputId, btn){
  const input = document.getElementById(inputId);
  if(!input) return;
  const showing = input.type === "text";
  input.type = showing ? "password" : "text";
  btn.textContent = showing ? "Show" : "Hide";
}

async function login(){
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;
  const status = document.getElementById("status");
  const btn = document.getElementById("loginBtn");

  if(!username || !password){
    status.className = "status err"; status.textContent = "Enter your username or email and your password.";
    return;
  }

  if(!navigator.onLine){ showNetError(status); return; }
  if(!sb){ showNetError(status); return; }
  setBusy(true);
  status.className = "status"; status.textContent = "";

  try{
    // What the person typed could be their Employee ID (their real
    // username) or their personal email. If it looks like an email, first
    // check whether it belongs to a known employee — if so, resolve it to
    // THEIR Employee ID and proceed exactly as a normal username login
    // would, through the same trusted username->Auth-email RPC. This
    // means email login piggybacks on the existing, already-correct
    // username resolution rather than needing its own separate path.
    let identifier = username;
    if(username.indexOf("@") !== -1){
      try{
        const { data: empId, error: e1 } = await sb.rpc("resolve_email_to_username", { p_email: username });
        if(e1 && isNetworkError(e1)){ showNetError(status); return; }
        if(empId) identifier = empId;
      }catch(e){ if(isNetworkError(e)){ showNetError(status); return; } /* not a recognized employee email — fall through below */ }
    }

    // Resolve what the person typed (or the Employee ID we just resolved
    // their email to) to their real Auth login email. A staff member's
    // username is their Employee ID; Super Admins use their real email as
    // their username. The RPC maps either to the login email.
    let email = null;
    try{
      const { data, error: e2 } = await sb.rpc("resolve_username_to_email", { p_username: identifier });
      if(e2 && isNetworkError(e2)){ showNetError(status); return; }
      if(data) email = data;
    }catch(e){ if(isNetworkError(e)){ showNetError(status); return; } /* fall through to the email fallback below */ }

    // If it still wasn't resolved but looks like an email, try it
    // directly — covers a Super Admin whose Auth email itself was typed.
    if(!email && username.indexOf("@") !== -1) email = username;

    if(!email){
      status.className = "status err"; status.textContent = "Invalid username or password.";
      return;
    }

    const { error: signInErr } = await sb.auth.signInWithPassword({ email, password });
    if(signInErr){
      if(isNetworkError(signInErr)){ showNetError(status); return; }
      status.className = "status err"; status.textContent = "Invalid username or password.";
      return;
    }
    RumbuUI.markSession();
    const go = document.getElementById("goingIn");
    go.innerHTML = RumbuUI.loaderHtml("Opening RumbuApp");
    go.classList.add("show");
    window.location.href = "index.html";
    return;
  }catch(e){
    if(isNetworkError(e)){ showNetError(status); }
    else { status.className = "status err"; status.textContent = "Sign in did not work: " + (e.message || e) + ". Try again."; }
  }finally{
    if(!document.getElementById("goingIn").classList.contains("show")) setBusy(false);
  }
}
</script>
</body>
</html>
