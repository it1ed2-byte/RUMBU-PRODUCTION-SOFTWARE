<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Naslina Express — Stage Action</title>
<link rel="stylesheet" href="../../styles.css">
<script>
  (function(){
    try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("rumbu_theme") || "navy"); }catch(e){}
  })();
  window.addEventListener("message", function(e){
    if(e.data && e.data.rumbuTheme){ document.documentElement.setAttribute("data-theme", e.data.rumbuTheme); }
  });
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../auth.js"></script>
<style>
  body{padding:20px;}
  .wrap{max-width:1000px;margin:0 auto;}
  #connStatus{font-size:12px;font-weight:700;text-align:center;margin-bottom:10px;color:var(--muted);}
  .empty-note{background:var(--bg);border:1px dashed var(--line-2);border-radius:var(--radius);padding:24px;text-align:center;color:var(--muted);font-size:13px;}

  .req-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow);}
  .req-card .rc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px;flex-wrap:wrap;}
  .req-card .rc-ref{font-weight:800;color:var(--heading);font-size:14.5px;}
  .req-card .rc-stage{background:var(--bg);border:1px solid var(--line-2);border-radius:20px;padding:4px 12px;font-size:11.5px;font-weight:700;color:var(--muted);}
  .rc-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;font-size:13px;color:var(--text);margin-bottom:14px;}
  .rc-meta .m-label{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.3px;}

  .dropzone{
    background:var(--bg);border:1px dashed var(--line-2);border-radius:var(--radius);
    padding:20px 14px;text-align:center;cursor:pointer;transition:border-color .15s;
  }
  .dropzone:hover,.dropzone.drag{border-color:var(--accent);}
  .dropzone .dz-action{color:var(--primary);font-weight:700;font-size:13.5px;}
  .dropzone .dz-hint{font-size:11px;color:var(--muted);margin-top:2px;}
  .dropzone input[type=file]{display:none;}
  .file-list{margin-top:8px;display:flex;flex-direction:column;gap:6px;}
  .file-chip{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:7px;padding:5px 10px;font-size:12px;}
  .file-chip .fc-remove{color:var(--bad);cursor:pointer;font-weight:700;background:none;border:0;padding:0 4px;font-size:14px;}

  .already-acted{background:rgba(30,125,52,.10);color:var(--ok);border-radius:var(--radius-sm);padding:8px 12px;font-size:12.5px;font-weight:600;}
</style>
</head>
<body>
<div class="wrap">
<div id="connStatus">Loading...</div>

<div class="card-panel">
  <h3>Pending My Action — Naslina Express Payment Requests</h3>
  <p class="sub">Requests currently at a workflow stage you're assigned to. All assignees on a stage must approve before it advances; a decline sends the request back to the submitter for edits and resubmission.</p>
</div>

<div id="topStatus" class="status" style="display:none;"></div>

<div id="listWrap"></div>

</div>

<script>
let ME = null;
let MY_EMPLOYEE_ID = null;
let STAGES_BY_ID = {};
let MY_STAGE_KEYS = new Set(); // stage_key values I'm an assignee on
// requestId -> { field_key: [File, ...] }
const STAGED_FILES = {};

async function init(){
  const status = document.getElementById("connStatus");
  try{
    ME = await requireAuth("../../login.html");
    if(!ME) return;

    const { data: emp, error: empErr } = await sb.from("employees").select("id").eq("linked_profile_id", ME.id).maybeSingle();
    if(empErr) throw empErr;
    if(!emp){ throw new Error("No employee record is linked to your account, so no stage assignments can be found for you."); }
    MY_EMPLOYEE_ID = emp.id;

    const { data: stages, error: stErr } = await sb.from("naslina_workflow_stages").select("*").order("sequence_order");
    if(stErr) throw stErr;
    stages.forEach(s => STAGES_BY_ID[s.id] = s);

    const { data: assignments, error: asErr } = await sb.from("naslina_workflow_stage_assignees")
      .select("stage_id").eq("employee_ref_id", MY_EMPLOYEE_ID);
    if(asErr) throw asErr;
    MY_STAGE_KEYS = new Set((assignments||[]).map(a => a.stage_id));

    status.style.color = "#1d8a4e"; status.textContent = "Connected.";

    await loadPending();
  }catch(e){
    status.style.color = "#c0392b"; status.textContent = "\u274C " + e.message;
    console.error(e);
  }
}

async function loadPending(){
  const wrap = document.getElementById("listWrap");
  if(!MY_STAGE_KEYS.size){
    wrap.innerHTML = "<div class='empty-note'>You aren't an assignee on any workflow stage yet.</div>";
    return;
  }

  const { data: requests, error } = await sb.from("naslina_requests")
    .select("*, beneficiaries(name,account_number,bank), naslina_companies(name), naslina_departments(name), employees:submitted_by(full_name)")
    .eq("status", "in_progress")
    .in("current_stage_id", Array.from(MY_STAGE_KEYS))
    .order("request_date", { ascending: true });
  if(error){ wrap.innerHTML = "<div class='empty-note'>Error: " + error.message + "</div>"; return; }

  if(!requests || !requests.length){
    wrap.innerHTML = "<div class='empty-note'>Nothing pending your action right now.</div>";
    return;
  }

  // For each request, check whether I've already actioned this stage
  // in the current cycle (so re-loading doesn't re-show an acted card).
  const ids = requests.map(r => r.id);
  const { data: myActions } = await sb.from("naslina_request_stage_actions")
    .select("request_id, stage_id, action")
    .eq("employee_ref_id", MY_EMPLOYEE_ID)
    .in("request_id", ids);
  const actedKey = new Set((myActions||[]).map(a => a.request_id + ":" + a.stage_id));

  wrap.innerHTML = "";
  requests.forEach(r => {
    if(actedKey.has(r.id + ":" + r.current_stage_id)) return; // already acted this cycle
    wrap.appendChild(renderRequestCard(r));
  });

  if(!wrap.children.length){
    wrap.innerHTML = "<div class='empty-note'>Nothing pending your action right now.</div>";
  }
}

function renderRequestCard(r){
  const stage = STAGES_BY_ID[r.current_stage_id];
  const stageKey = stage ? stage.stage_key : "";
  const showPaymentFields = (stageKey === "payment" || stageKey === "upload_invoice");

  const el = document.createElement("div");
  el.className = "req-card";
  STAGED_FILES[r.id] = { payment_slip: [], invoice: [], invoice_2: [] };

  el.innerHTML = `
    <div class="rc-head">
      <span class="rc-ref">${r.reference_no} \u2014 ${r.title}</span>
      <span class="rc-stage">${stage ? stage.stage_name : "\u2014"}</span>
    </div>
    <div class="rc-meta">
      <div><span class="m-label">Submitted by</span><br>${r.employees ? r.employees.full_name : "\u2014"}</div>
      <div><span class="m-label">Recipient</span><br>${r.beneficiaries ? r.beneficiaries.name + " \u2014 " + r.beneficiaries.account_number : "\u2014"}</div>
      <div><span class="m-label">Company / Department</span><br>${r.naslina_companies ? r.naslina_companies.name : "\u2014"} / ${r.naslina_departments ? r.naslina_departments.name : "\u2014"}</div>
      <div><span class="m-label">Amount</span><br>${r.currency} ${Number(r.total_amount).toLocaleString()}</div>
      <div><span class="m-label">Duration</span><br>${r.project_duration_days} day(s)</div>
      <div><span class="m-label">Description</span><br>${r.description || "\u2014"}</div>
    </div>

    ${showPaymentFields ? `
      <div class="field">
        <label>Payment Slip</label>
        <div class="dropzone" data-req="${r.id}" data-target="payment_slip" data-multi="true">
          <div class="dz-action">Upload files</div>
          <div class="dz-hint">Drag and drop files or paste from clipboard</div>
          <input type="file" multiple>
        </div>
        <div class="file-list" data-list="${r.id}-payment_slip"></div>
      </div>
      <div class="field">
        <label>Invoice *</label>
        <div class="dropzone" data-req="${r.id}" data-target="invoice" data-multi="false" data-accept="image/*">
          <div class="dz-action">Upload image</div>
          <div class="dz-hint">Drag and drop file or paste from clipboard</div>
          <input type="file" accept="image/*">
        </div>
        <div class="file-list" data-list="${r.id}-invoice"></div>
        <div class="req-note" style="color:var(--muted);font-size:12px;margin-top:4px;">Upload invoice or receipts</div>
      </div>
      <div class="field">
        <label>Invoice 2</label>
        <div class="dropzone" data-req="${r.id}" data-target="invoice_2" data-multi="true">
          <div class="dz-action">Upload files</div>
          <div class="dz-hint">Drag and drop files or paste from clipboard</div>
          <input type="file" multiple>
        </div>
        <div class="file-list" data-list="${r.id}-invoice_2"></div>
      </div>
    ` : ""}

    <div class="field">
      <label>${stage ? stage.stage_name.toUpperCase() : ""} Comment</label>
      <textarea id="comment-${r.id}"></textarea>
    </div>

    <div class="form-row">
      <div class="field">
        <label>ACTION *</label>
        <select id="action-${r.id}">
          <option value="">\u2014 Select \u2014</option>
          <option value="approve">Approve</option>
          <option value="decline">Decline</option>
        </select>
      </div>
      <div class="field">
        <label>Action Date</label>
        <input type="datetime-local" id="actiondate-${r.id}">
      </div>
    </div>

    <button onclick="submitAction('${r.id}', '${stageKey}', '${r.reference_no}')">Submit</button>
    <div class="status" id="status-${r.id}"></div>
  `;

  document.getElementById(`actiondate-${r.id}`) // set after insertion below
  wireDropzonesFor(el, r.id);
  setTimeout(()=>{ const dEl = document.getElementById(`actiondate-${r.id}`); if(dEl) dEl.value = new Date().toISOString().slice(0,16); }, 0);
  return el;
}

function wireDropzonesFor(container, requestId){
  container.querySelectorAll(".dropzone").forEach(zone=>{
    const key = zone.getAttribute("data-target");
    const multi = zone.getAttribute("data-multi") === "true";
    const input = zone.querySelector("input[type=file]");

    zone.addEventListener("click", ()=>input.click());
    input.addEventListener("change", e => stageFiles(requestId, key, multi, e.target.files));
    zone.addEventListener("dragover", e => { e.preventDefault(); zone.classList.add("drag"); });
    zone.addEventListener("dragleave", () => zone.classList.remove("drag"));
    zone.addEventListener("drop", e => { e.preventDefault(); zone.classList.remove("drag"); stageFiles(requestId, key, multi, e.dataTransfer.files); });
    zone.addEventListener("paste", e => {
      const items = (e.clipboardData || {}).files;
      if(items && items.length) stageFiles(requestId, key, multi, items);
    });
  });
}

function stageFiles(requestId, key, multi, fileList){
  const files = Array.from(fileList || []);
  if(!files.length) return;
  if(multi) STAGED_FILES[requestId][key].push(...files);
  else STAGED_FILES[requestId][key] = [files[0]];
  renderFileList(requestId, key);
}

function renderFileList(requestId, key){
  const wrap = document.querySelector(`.file-list[data-list="${requestId}-${key}"]`);
  if(!wrap) return;
  wrap.innerHTML = STAGED_FILES[requestId][key].map((f, i) =>
    `<div class="file-chip"><span>${f.name}</span><button class="fc-remove" onclick="removeStagedFile('${requestId}','${key}',${i})">&times;</button></div>`
  ).join("");
}

function removeStagedFile(requestId, key, idx){
  STAGED_FILES[requestId][key].splice(idx, 1);
  renderFileList(requestId, key);
}
window.removeStagedFile = removeStagedFile;

async function submitAction(requestId, stageKey, referenceNo){
  const status = document.getElementById(`status-${requestId}`);
  const action = document.getElementById(`action-${requestId}`).value;
  const comment = document.getElementById(`comment-${requestId}`).value.trim() || null;
  const actionDate = document.getElementById(`actiondate-${requestId}`).value || new Date().toISOString();

  if(!action){ status.className = "status err"; status.textContent = "Select Approve or Decline."; return; }
  if(stageKey === "upload_invoice" && !STAGED_FILES[requestId].invoice.length){
    status.className = "status err"; status.textContent = "Invoice upload is required at this stage."; return;
  }

  status.className = "status"; status.textContent = "Submitting...";
  try{
    const { data: reqRow, error: reqErr } = await sb.from("naslina_requests").select("cycle, current_stage_id").eq("id", requestId).single();
    if(reqErr) throw reqErr;

    // 1) Upload any staged files for this stage.
    for(const key of Object.keys(STAGED_FILES[requestId])){
      for(const file of STAGED_FILES[requestId][key]){
        const path = `naslina/${requestId}/${key}/${Date.now()}_${file.name}`;
        const { error: upErr } = await sb.storage.from("request-attachments").upload(path, file);
        if(upErr) throw upErr;
        const { data: pub } = sb.storage.from("request-attachments").getPublicUrl(path);
        await sb.from("naslina_request_attachments").insert({
          request_id: requestId, field_key: key, file_name: file.name,
          file_url: pub.publicUrl, uploaded_by: MY_EMPLOYEE_ID
        });
      }
    }

    // 2) Log this assignee's action for the current stage/cycle.
    const { error: actionErr } = await sb.from("naslina_request_stage_actions").insert({
      request_id: requestId, stage_id: reqRow.current_stage_id, employee_ref_id: MY_EMPLOYEE_ID,
      action, comment, action_date: actionDate, cycle: reqRow.cycle
    });
    if(actionErr) throw actionErr;

    if(action === "decline"){
      // Reject: send back to submitter. Stage stays put; the "resubmit"
      // flow (separate page \u2014 next phase) bumps cycle and resets to
      // stage 1 once the submitter has made their edits.
      const { error: rejErr } = await sb.from("naslina_requests").update({ status: "rejected" }).eq("id", requestId);
      if(rejErr) throw rejErr;
    } else {
      // Approve: check if every assignee on this stage has now approved
      // for this cycle \u2014 if so, advance to the next stage.
      const { data: assignees } = await sb.from("naslina_workflow_stage_assignees")
        .select("employee_ref_id").eq("stage_id", reqRow.current_stage_id);
      const { data: approvals } = await sb.from("naslina_request_stage_actions")
        .select("employee_ref_id").eq("request_id", requestId).eq("stage_id", reqRow.current_stage_id)
        .eq("cycle", reqRow.cycle).eq("action", "approve");

      const allApproved = (assignees||[]).length > 0 &&
        (assignees||[]).every(a => (approvals||[]).some(ap => ap.employee_ref_id === a.employee_ref_id));

      if(allApproved){
        const currentStage = STAGES_BY_ID[reqRow.current_stage_id];
        const nextStage = Object.values(STAGES_BY_ID).find(s => s.sequence_order === currentStage.sequence_order + 1);
        if(nextStage){
          await sb.from("naslina_requests").update({
            current_stage_id: nextStage.id,
            status: nextStage.is_terminal ? "completed" : "in_progress"
          }).eq("id", requestId);
        }
      }
    }

    status.className = "status ok"; status.textContent = "\u2705 Recorded.";

    const topStatus = document.getElementById("topStatus");
    topStatus.style.display = "block";
    topStatus.className = action === "decline" ? "status err" : "status ok";
    topStatus.textContent = (action === "decline" ? "\u2705 Declined \u2014 " : "\u2705 Approved \u2014 ") +
      referenceNo + " recorded. Refreshing list...";
    setTimeout(()=>{ topStatus.style.display = "none"; }, 5000);

    setTimeout(loadPending, 700);
  }catch(e){
    status.className = "status err"; status.textContent = "\u274C " + (e.message || e);
  }
}
window.submitAction = submitAction;

init();
</script>
</body>
</html>
