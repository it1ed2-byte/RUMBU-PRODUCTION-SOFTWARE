<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Visitor Attendance — Manage Visitors</title>
<link rel="stylesheet" href="../../styles.css">
<script>
  (function(){
    function apply(t){ if(t) document.documentElement.setAttribute("data-theme", t); }
    window.addEventListener("message", function(e){ if(e.data && e.data.rumbuTheme) apply(e.data.rumbuTheme); });
    try{ apply(localStorage.getItem("rumbu_theme")); }catch(e){}
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../auth.js"></script>
<style>
  :root{--navy:var(--heading);--blue:var(--accent);--blue-dark:var(--accent-2);--muted:#6b7280;--red:#c0392b;--green:#1d8a4e;--amber:#d97706;}
  *{box-sizing:border-box;}
  body{font-family:var(--sans);background:var(--bg);margin:0;padding:18px;color:var(--text);}
  .wrap{max-width:1100px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;}
  .card h3{color:var(--navy);margin:0 0 4px;font-size:16px;}
  .card .sub{color:var(--blue);font-size:12px;margin:0 0 14px;}
  label{display:block;font-size:12px;font-weight:bold;color:var(--text);margin:10px 0 4px;}
  input,select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
  .row > div{flex:1;min-width:150px;}
  button{padding:10px 14px;border:none;border-radius:8px;font-weight:bold;font-size:13px;cursor:pointer;background:var(--blue);color:#fff;}
  button:hover{background:var(--blue-dark);}
  button.mini{padding:6px 10px;font-size:12px;}
  button.del{background:var(--red);}
  button.del:hover{background:#96242e;}
  button.pdf{background:#6b7280;}
  button.pdf:hover{background:#4b5563;}
  .status{margin-top:10px;font-weight:bold;font-size:13px;min-height:16px;}
  .status.ok{color:var(--green);} .status.err{color:var(--red);}
  #connStatus{font-size:12px;font-weight:bold;text-align:center;margin-bottom:10px;}
  table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px;}
  th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;}
  thead th{background:var(--navy);color:#fff;font-size:12px;}
  tbody tr:nth-child(even){background:#f6f8fb;}
  .tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:bold;color:#fff;}
  .tag.inside{background:var(--amber);}
  .tag.checked_out{background:var(--green);}
</style>
</head>
<body>

<div class="wrap">
<button onclick="(window.parent&&window.parent.closeModule)?window.parent.closeModule():(window.location.href='../../index.html')" style="max-width:200px;margin-bottom:12px;background:var(--navy);">&larr; Back to Menu</button>
<div id="connStatus">Loading...</div>

<div class="card">
  <h3>Manage Visitors</h3>
  <p class="sub" id="scopeNote"></p>
  <div class="row">
    <div>
      <label>From Date</label>
      <input type="date" id="fromDate">
    </div>
    <div>
      <label>To Date</label>
      <input type="date" id="toDate">
    </div>
    <div>
      <label>Status</label>
      <select id="statusFilter" onchange="applyFilters()">
        <option value="">All</option>
        <option value="inside">Inside</option>
        <option value="checked_out">Checked-out</option>
      </select>
    </div>
    <div>
      <label>Search (name / phone / company)</label>
      <input type="text" id="search" placeholder="Type to filter" oninput="applyFilters()">
    </div>
    <div style="flex:0 0 auto;">
      <button onclick="loadRecords()">Refresh</button>
    </div>
    <div style="flex:0 0 auto;">
      <button class="pdf" onclick="printList()">PDF / Print</button>
    </div>
  </div>
  <div class="status" id="status"></div>
</div>

<div class="card">
  <div id="tableWrap"></div>
</div>
</div>

<script>
let ME = null;
let ALL = [];
let VIEW = [];
const COMPANY = "Rumbu Industries Limited";

async function logActivity(actionType, description){
  try{
    await sb.from("activity_log").insert({
      actor_id: ME.id, actor_username: ME.username, actor_role: ME.role,
      section_id: ME.sectionId, action_type: actionType, description: description
    });
  }catch(e){ console.warn("Activity log write failed (non-fatal):", e); }
}

async function init(){
  const status = document.getElementById("connStatus");
  try{
    ME = await requireAuth("../../login.html");
    if(!ME) return;
    document.getElementById("scopeNote").textContent = ME.role === "super_admin"
      ? "Showing visitors from every Branch."
      : "Showing visitors for your own Branch only" + (ME.sectionName ? " (" + ME.sectionName + ")." : ".");
    status.style.color = "#1d8a4e"; status.textContent = "Connected.";
    await loadRecords();
  }catch(e){
    status.style.color = "#c0392b"; status.textContent = "❌ " + e.message; console.error(e);
  }
}

async function loadRecords(){
  const status = document.getElementById("status");
  status.className = "status"; status.textContent = "Loading...";
  try{
    let q = sb.from("visitor_attendance").select("*").order("time_in",{ascending:false});
    if(ME.role !== "super_admin"){
      if(ME.sectionNames && ME.sectionNames.length){ q = q.in("branch", ME.sectionNames); }
      else { q = q.eq("branch","___none___"); }
    }
    const { data, error } = await q;
    if(error) throw error;
    ALL = data || [];
    status.className = "status ok"; status.textContent = ALL.length + " record(s) loaded.";
    applyFilters();
  }catch(e){
    status.className = "status err"; status.textContent = "❌ " + e.message;
  }
}

function applyFilters(){
  const from = document.getElementById("fromDate").value;
  const to = document.getElementById("toDate").value;
  const st = document.getElementById("statusFilter").value;
  const search = document.getElementById("search").value.trim().toLowerCase();
  let rows = ALL.slice();
  if(from) rows = rows.filter(r => (r.visit_date||"") >= from);
  if(to)   rows = rows.filter(r => (r.visit_date||"") <= to);
  if(st)   rows = rows.filter(r => (r.status||"inside") === st);
  if(search){
    rows = rows.filter(r =>
      (r.visitor_name||"").toLowerCase().includes(search) ||
      (r.phone||"").toLowerCase().includes(search) ||
      (r.company||"").toLowerCase().includes(search));
  }
  VIEW = rows;
  render(rows);
}

function fmt(ts){ return ts ? new Date(ts).toLocaleString() : ""; }

function render(rows){
  const wrap = document.getElementById("tableWrap");
  if(!rows.length){ wrap.innerHTML = "<p>No records match.</p>"; return; }
  const canDelete = (ME.role === "super_admin" || ME.role === "admin");
  let html = "<table><thead><tr>" +
    "<th>Date</th><th>Name</th><th>Phone</th><th>Company</th><th>Visiting</th>" +
    "<th>Purpose</th><th>Branch</th><th>Time In</th><th>Time Out</th><th>Status</th>" +
    (canDelete ? "<th></th>" : "") + "</tr></thead><tbody>";
  rows.forEach(r=>{
    const st = r.status || "inside";
    html += "<tr>" +
      `<td>${r.visit_date||""}</td>` +
      `<td>${r.visitor_name||""}</td>` +
      `<td>${r.phone||""}</td>` +
      `<td>${r.company||""}</td>` +
      `<td>${r.visiting||""}</td>` +
      `<td>${r.purpose||""}</td>` +
      `<td>${r.branch||""}</td>` +
      `<td>${fmt(r.time_in)}</td>` +
      `<td>${fmt(r.time_out)}</td>` +
      `<td><span class="tag ${st}">${st === "checked_out" ? "CHECKED-OUT" : "INSIDE"}</span></td>` +
      (canDelete ? `<td><button class="mini del" onclick="removeRow(${r.id})">Delete</button></td>` : "") +
    "</tr>";
  });
  html += "</tbody></table>";
  wrap.innerHTML = html;
}

async function removeRow(id){
  const r = ALL.find(x => x.id === id);
  if(!r) return;
  if(!confirm("Delete visitor record for " + r.visitor_name + "?")) return;
  const status = document.getElementById("status");
  status.className = "status"; status.textContent = "Deleting...";
  try{
    const { error } = await sb.from("visitor_attendance").delete().eq("id", id);
    if(error) throw error;
    await logActivity("visitor_deleted", ME.username + " deleted visitor record for " + r.visitor_name);
    status.className = "status ok"; status.textContent = "✅ Deleted.";
    await loadRecords();
  }catch(e){
    status.className = "status err"; status.textContent = "❌ " + e.message;
  }
}

function printList(){
  if(!VIEW.length){ alert("Nothing to print for the current filter."); return; }
  let rows = VIEW.map(r => `
    <tr>
      <td>${r.visit_date||""}</td><td>${r.visitor_name||""}</td><td>${r.phone||""}</td>
      <td>${r.company||""}</td><td>${r.visiting||""}</td><td>${r.branch||""}</td>
      <td>${fmt(r.time_in)}</td><td>${fmt(r.time_out)}</td>
      <td>${(r.status||"inside")==="checked_out"?"Checked-out":"Inside"}</td>
    </tr>`).join("");
  const html = `
<html><head><style>
@page { size:A4 landscape; margin:30pt; }
body { font-family:var(--sans); font-size:10pt; margin:0; padding:20px; }
h2 { text-align:center; margin:0 0 2px; } h3 { text-align:center; margin:0 0 16px; font-weight:normal; }
table { width:100%; border-collapse:collapse; }
th,td { border:1px solid #333; padding:5px 7px; text-align:left; }
th { background:#1F3864; color:#fff; }
</style></head><body>
<h2>${COMPANY}</h2>
<h3>Visitor Attendance Register</h3>
<table><thead><tr>
<th>Date</th><th>Name</th><th>Phone</th><th>Company</th><th>Visiting</th><th>Branch</th><th>Time In</th><th>Time Out</th><th>Status</th>
</tr></thead><tbody>${rows}</tbody></table>
</body></html>`;
  const w = window.open("", "_blank");
  w.document.write(html); w.document.close();
  w.onload = function(){ w.focus(); w.print(); };
}

init();
</script>
</body>
</html>
