<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Asset Summary</title>
<link rel="stylesheet" href="../../styles.css">
<script>
  (function(){
    function apply(t){ if(t) document.documentElement.setAttribute("data-theme", t); }
    window.addEventListener("message", function(e){ if(e.data && e.data.rumbuTheme) apply(e.data.rumbuTheme); });
    try{ apply(localStorage.getItem("rumbu_theme")); }catch(e){}
  })();
</script>
<style>
  :root{--navy:var(--heading);}
  *{box-sizing:border-box;}
  body{font-family:var(--sans);background:var(--bg);margin:0;padding:16px;}
  .card{max-width:1200px;margin:0 auto 16px;background:var(--card);border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.15);padding:20px;}
  h2{text-align:center;color:var(--navy);border-bottom:2px solid var(--navy);padding-bottom:10px;}
  h3{color:var(--navy);}
  label{font-weight:600;margin-top:8px;display:block;font-size:13px;}
  input,select{width:100%;padding:8px;margin-top:4px;border:1px solid var(--line);border-radius:6px;font-size:13px;}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
  .btn-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
  button{flex:1 1 160px;padding:11px;border:none;border-radius:8px;background:var(--navy);color:#fff;font-weight:bold;cursor:pointer;}
  button.alt{background:#38761d;}
  #status{margin-top:10px;font-weight:bold;font-size:13px;}
  table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px;}
  th,td{border:1px solid #333;padding:4px;text-align:center;}
  th{background:var(--navy);color:#fff;}
  tr:nth-child(even){background:#f9f9f9;}
  .total{font-weight:bold;background:#e2efda;}
  .grandtotal{font-weight:bold;background:#f4cccc;}
  @media (max-width:700px){ .grid{grid-template-columns:1fr 1fr;} }
  @media print{ .no-print{display:none !important;} .shed-break{break-before:page;page-break-before:always;} }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../auth.js"></script>
<script src="../../table-resolver.js"></script>
</head>
<body>

<div class="card no-print">
  <h2>🧶 Asset Summary</h2>
  <div class="grid">
    <div><label>From Date</label><input type="date" id="fromDate"></div>
    <div><label>To Date</label><input type="date" id="toDate"></div>
    <div><label>Shift</label><select id="shift"><option value="All">All</option><option>Morning</option><option>Night</option></select></div>
    <div><label>Group</label><select id="groupName"><option value="All">All</option><option value="A">Group A</option><option value="B">Group B</option></select></div>
    <div><label>Section</label><select id="section"><option value="All">All</option></select></div>
    <div><label>Work Duration</label><select id="workHours"><option value="660">11 hours</option><option value="600">10 hours</option><option value="540">9 hours</option></select></div>
    <div><label>Work Type</label><select id="workType"><option value="All">All</option><option value="Overtime">Holiday Days</option><option value="Normal">Working Days</option><option value="B grade">B Grade Days</option></select></div>
  </div>
  <div style="margin-top:10px;">
    <label style="display:block;font-weight:600;font-size:13px;margin-bottom:6px;">Shed (Select Multiple)</label>
    <div id="shedContainer" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);">
      <label style="font-weight:500;font-size:13px;display:flex;align-items:center;gap:5px;cursor:pointer;"><input type="checkbox" value="1"> Shed 1</label>
      <label style="font-weight:500;font-size:13px;display:flex;align-items:center;gap:5px;cursor:pointer;"><input type="checkbox" value="2"> Shed 2</label>
      <label style="font-weight:500;font-size:13px;display:flex;align-items:center;gap:5px;cursor:pointer;"><input type="checkbox" value="3"> Shed 3</label>
      <label style="font-weight:500;font-size:13px;display:flex;align-items:center;gap:5px;cursor:pointer;"><input type="checkbox" value="4"> Shed 4</label>
      <label style="font-weight:500;font-size:13px;display:flex;align-items:center;gap:5px;cursor:pointer;"><input type="checkbox" value="5"> Shed 5</label>
      <label style="font-weight:500;font-size:13px;display:flex;align-items:center;gap:5px;cursor:pointer;"><input type="checkbox" value="6"> Shed 6</label>
      <label style="font-weight:500;font-size:13px;display:flex;align-items:center;gap:5px;cursor:pointer;"><input type="checkbox" value="CR"> Computer Mat</label>
      <label style="font-weight:500;font-size:13px;display:flex;align-items:center;gap:5px;cursor:pointer;"><input type="checkbox" value="MamaSannu"> Mama Sannu</label>
    </div>
  </div>
  <div class="btn-row">
    <button onclick="viewQuick()">📊 View Report (quick)</button>
    <button class="alt" onclick="generateDetailed()">Generate Detailed Report</button>
    <button class="alt" onclick="window.print()">Print / Save as PDF</button>
  </div>
  <div id="status">Connecting to Supabase...</div>
</div>

<div id="quickArea"></div>
<div id="detailArea"></div>

<script>
let MW_TABLE = "mat_weaving"; // resolved properly in init() below
let MW_ROWS = [], CTRL_ROWS = [], EXCLUDED_JOB_CODES = new Set(); CTRL_ROWS.forEach(normalizeControlRow);

const SECTION_LABEL = { "Rumbu Mainmat": "Rumbu Mainmat", "MamaSannu": "Mama Sannu" };

function parseDT(v){ const d=new Date(v); return isNaN(d)?null:d; }
function minutesBetween(a,b){ return (!a||!b) ? 0 : Math.round((b-a)/60000); }
function authHeaders(){ return { "apikey": SUPABASE_ANON_KEY, "Authorization": "Bearer " + SUPABASE_ANON_KEY }; }


// Fetch ALL rows from a table, paginating past Supabase's 1000-row cap.
async function fetchAllRows(table, select, query){
  let all = [], offset = 0; const pageSize = 1000;
  const q = query || "";
  for(let guard=0; guard<500; guard++){
    const headers = Object.assign({}, authHeaders(), { "Range-Unit":"items", "Range": offset + "-" + (offset+pageSize-1) });
    const res = await fetch(SUPABASE_URL + "/rest/v1/" + table + "?select=" + (select||"*") + q + "&order=id.asc", { headers });
    if(!res.ok) throw new Error(table + ": HTTP " + res.status);
    const batch = await res.json();
    all = all.concat(batch);
    if(batch.length < pageSize) break;
    offset += pageSize;
  }
  return all;
}

function normalizeControlRow(r){
  if(r.date_col === undefined) r.date_col = r.date;
  if(r.names === undefined) r.names = r.nurse_name;
  if(r.stop_time === undefined) r.stop_time = r.mc_stoppage_time;
  if(r.extimated_time === undefined) r.extimated_time = r.estimated_duration;
  if(r.discription === undefined) r.discription = r.description;
  return r;
}

async function fetchRangeData(fromDate, toDate){
  const [mw, ctrl] = await Promise.all([
    fetchAllRows(MW_TABLE,"*", "&date_col=gte."+fromDate+"&date_col=lte."+toDate),
    fetchAllRows("control","*", "&date=gte."+fromDate+"&date=lte."+toDate)
  ]);
  MW_ROWS = mw;
  CTRL_ROWS = ctrl; CTRL_ROWS.forEach(normalizeControlRow);
}

async function init(){
  const status = document.getElementById("status");
  try{
    const me = await requireAuth("../../login.html");
    if(!me) return;
    MW_TABLE = await resolveWeavingTable();

    const mySections = (me.sectionNames && me.sectionNames.length) ? me.sectionNames : ["Rumbu Mainmat","MamaSannu"];
    document.getElementById("section").innerHTML = '<option value="All">All</option>' +
      mySections.map(s=>`<option value="${s}">${SECTION_LABEL[s]||s}</option>`).join("");
    // Default-select and lock the dropdown to the user's own Section when they only have one.
    if(mySections.length === 1){
      document.getElementById("section").value = mySections[0];
      document.getElementById("section").disabled = true;
    }

    const jobRes = await fetch(SUPABASE_URL + "/rest/v1/job_table?select=job_code", { headers: authHeaders() });
    if(jobRes.ok){
      const jobRows = await jobRes.json();
      EXCLUDED_JOB_CODES = new Set(jobRows.map(r => r.job_code));
    }
    status.style.color = "#1d8a4e";
    status.textContent = "Ready. Select a date range and click Generate.";
  }catch(e){
    status.style.color = "#c0392b";
    status.textContent = "Could not read data: " + (e.message||e);
  }
}


function getFilters(){
  return {
    fromDate: document.getElementById("fromDate").value,
    toDate: document.getElementById("toDate").value,
    shift: document.getElementById("shift").value,
    groupName: document.getElementById("groupName").value,
    section: document.getElementById("section").value,
    workType: document.getElementById("workType").value,
    shedType: Array.from(document.querySelectorAll("#shedContainer input:checked")).map(cb=>cb.value),
    workMinutes: Number(document.getElementById("workHours").value) || 660
  };
}

// ── Rules ported from the Apps Script (shared downtime view + metrics()) ─────────────────────────
const T = v => v == null ? "" : String(v).trim();                       // TRIM(...)
const cmp = (x, y) => { x = T(x); y = T(y); return x < y ? -1 : x > y ? 1 : 0; };   // ORDER BY (plain text order)
// normSec(): TRIM, and the extruder sections count as Rumbu. "Rumbu Mainmat" and "Rumbu" are the same section.
const FOLD_TO_RUMBU = new Set(["extruder1","extruder2","extruder3","extruder4","extruder5","mamasannuextruder"]);
function sectionKey(v){ const k = T(v).toLowerCase().replace(/\s+/g, ""); return (FOLD_TO_RUMBU.has(k) || k === "rumbu" || k === "rumbumainmat") ? "rumbu" : k; }
function sectionOk(selected, rowSection){ return selected === "All" || sectionKey(rowSection) === sectionKey(selected); }
// Mama Sannu rows count A + B + C as their Total (the stored Total column is not used for them).
function rowTotal(r){ return sectionKey(r.section) === "mamasannu" ? Number(r.a_double||0) + Number(r.a_single||0) + Number(r.b||0) + Number(r.c||0) : Number(r.total||0); }
// TIMESTAMP_DIFF(finish, stoppage, MINUTE): whole minutes (cut, not rounded); GREATEST(..., 0): never negative.
function dtMinutes(stop, finish){ return (!stop || !finish) ? 0 : Math.max(Math.trunc((finish - stop) / 60000), 0); }

function filterProd(f){
  const shedSet = f.shedType && f.shedType.length ? new Set(f.shedType) : null;
  return MW_ROWS.filter(r=>{
    if(r.date_col < f.fromDate || r.date_col > f.toDate) return false;
    if(f.shift !== "All" && r.shift !== f.shift) return false;
    if(f.groupName !== "All" && r.group_name !== f.groupName) return false;
    if(!sectionOk(f.section, r.section)) return false;
    if(f.workType !== "All" && r.work_type !== f.workType) return false; // matches GAS p.Work_Type
    if(shedSet && !shedSet.has(String(r.shed))) return false;             // matches GAS p.Shed IN (...)
    return true;
  });
}

// Shift and Group are independent filters. Groups rotate between Morning and Night, so a shift can hold rows from
// Group A, Group B or both. Nothing here assumes Morning = A or Night = B.
function groupLabel(rows){
  const g = [...new Set(rows.map(r => r.group_name || ""))].sort();
  return g.map(x => x ? "Group " + x : "no group recorded").join(" + ") || "no rows";
}
function groupMixHtml(rows){
  const by = {};
  rows.forEach(r => { const sh = r.shift || "no shift", g = r.group_name || "no group"; (by[sh] = by[sh] || {})[g] = (by[sh][g] || 0) + 1; });
  const parts = ["Morning","Night"].concat(Object.keys(by).filter(k => k !== "Morning" && k !== "Night")).filter(sh => by[sh])
    .map(sh => sh + ": " + Object.entries(by[sh]).sort((a,b) => b[1]-a[1]).map(([g,n]) => (g === "no group" ? g : "Group " + g) + " (" + n + ")").join(", "));
  return parts.length ? `<p style="text-align:center;font-size:12px;margin:4px 0;opacity:.85;">Groups in these rows &mdash; ${parts.join(" &middot; ")}</p>` : "";
}
// How many of the rows loaded for these dates the filters left out, and which filter did it.
function hiddenNote(f){
  const inRange = MW_ROWS.filter(r => r.date_col >= f.fromDate && r.date_col <= f.toDate);
  const kept = filterProd(f).length, hidden = inRange.length - kept;
  if(hidden <= 0) return "";
  const shedSet = f.shedType && f.shedType.length ? new Set(f.shedType) : null, by = [];
  const add = (label, n) => { if(n) by.push(label + " (" + n + ")"); };
  if(f.shift !== "All") add("Shift " + f.shift, inRange.filter(r => r.shift !== f.shift).length);
  if(f.groupName !== "All") add("Group " + f.groupName, inRange.filter(r => r.group_name !== f.groupName).length);
  if(f.section !== "All") add("Section " + (SECTION_LABEL[f.section] || f.section), inRange.filter(r => !sectionOk(f.section, r.section)).length);
  if(f.workType !== "All") add("Work type " + f.workType, inRange.filter(r => r.work_type !== f.workType).length);
  if(shedSet) add("Shed", inRange.filter(r => !shedSet.has(String(r.shed))).length);
  return `<p style="text-align:center;font-size:12px;margin:4px 0;padding:6px 10px;border:1px solid #d9a441;background:rgba(217,164,65,.14);border-radius:6px;">Showing <b>${kept}</b> of <b>${inRange.length}</b> production rows for these dates. Hidden by your filters: ${by.join(", ")}. A row can be hidden by more than one filter.</p>`;
}

// Downtime per asset for the chosen dates / shift / section, as the shared downtime view computes it:
// repairs whose job code is in job_table are left out, each record counts whole minutes (cut, never negative),
// and every asset is read (no asset list). Group, work type and shed do not apply to downtime.
function downtimeInfo(f){
  const info = {};
  CTRL_ROWS.forEach(r=>{
    if(r.date_col < f.fromDate || r.date_col > f.toDate) return;
    if(f.shift !== "All" && r.shift !== f.shift) return;
    if(!sectionOk(f.section, r.section)) return;
    if(EXCLUDED_JOB_CODES.has(r.job_code)) return;          // j.Job_Code IS NULL
    const a = T(r.assets), i = info[a] || (info[a] = { min:0, occ:0, shed:"" });
    i.min += dtMinutes(parseDT(r.stop_time), parseDT(r.finish_time));
    i.occ += 1;
    if(!i.shed && T(r.shed)) i.shed = T(r.shed);
  });
  return info;
}
function downtimeByAsset(f){
  const info = downtimeInfo(f), map = {};
  Object.keys(info).forEach(a => { map[a] = info[a].min; });
  return map;
}

// repairs by Assets+Shift, job_table excluded
function repairsByAssetShift(f){
  const map = {};
  CTRL_ROWS.forEach(r=>{
    if(r.date_col < f.fromDate || r.date_col > f.toDate) return;
    if(!sectionOk(f.section, r.section)) return;
    if(EXCLUDED_JOB_CODES.has(r.job_code)) return;
    const key = T(r.assets) + "||" + r.shift;
    map[key] = (map[key] || 0) + 1;
  });
  return map;
}

/* =========================================================
   QUICK VIEW — mirrors getAdvancedReportHTML: raw Total/Target
   per shift, no downtime adjustment.
   When a specific shift (Morning / Night) is selected the report
   shows a single-column table for that shift. The Group filter is
   separate: leave it on All to see every group that worked the shift.
   The two-column Morning-vs-Night comparison appears when Shift = All.
   ========================================================= */
async function viewQuick(){
  const f = getFilters();
  if(!f.fromDate || !f.toDate){ alert("Please select From & To dates."); return; }

  const status = document.getElementById("status");
  if(status){ status.style.color="#555"; status.textContent="Loading "+f.fromDate+" to "+f.toDate+"…"; }
  try{ await fetchRangeData(f.fromDate, f.toDate); }
  catch(e){
    if(status){ status.style.color="#c0392b"; status.textContent="Could not read data: "+(e.message||e); }
    return;
  }
  if(status){ status.textContent=""; }

  if(!MW_ROWS.length){
    document.getElementById("quickArea").innerHTML=`<div class="card"><p>⚠️ Mat_Weaving returned 0 rows for this range — check its read policy.</p></div>`;
    return;
  }

  const prod = filterProd(f);
  if(!prod.length){
    document.getElementById("quickArea").innerHTML = `<div class="card"><p>⚠️ No data found for the selected filters.</p>${hiddenNote(f)}</div>`;
    return;
  }
  const repairs = repairsByAssetShift(f);
  function color(p){ return p==null ? "#000" : (p>=90 ? "green" : "red"); }

  /* ── Single-group view (Morning or Night selected) ─────────────────────
     filterProd has already kept only the rows for this shift/group.
     Aggregate straight to Shed + Asset — no Morning/Night split needed.
     The Night column will NOT appear, so the report is complete and clear. */
  if(f.shift !== "All"){
    const label = f.shift + " (" + groupLabel(prod) + ")";

    const base = {};
    prod.forEach(r=>{
      const key = T(r.shed) + "||" + T(r.assets);
      if(!base[key]) base[key] = { shed:T(r.shed), assets:T(r.assets), total:0, target:0 };
      base[key].total += rowTotal(r);
      base[key].target += Number(r.target||0);
    });

    const sheds = {};
    Object.values(base).forEach(b=>{
      b.pct  = b.target ? (b.total / b.target) * 100 : null;
      b.reps = repairs[b.assets + "||" + f.shift] || 0;
      if(!sheds[b.shed]) sheds[b.shed] = [];
      sheds[b.shed].push(b);
    });

    let html = `<div class="card"><h2>📊 Asset Report — ${label}</h2>
      <p style="text-align:center;font-size:12px;">${f.fromDate} to ${f.toDate} | ${label} | Section: ${f.section}</p>${groupMixHtml(prod)}${hiddenNote(f)}`;
    Object.keys(sheds).sort(cmp).forEach((shed,shedIdx)=>{
      html += `<h3${shedIdx>0?' class="shed-break"':''}>SHED ${shed}</h3>`;
      html += `<table><tr><th>Asset</th><th>${f.shift} %</th><th>Repairs</th></tr>`;
      sheds[shed].sort((x,y)=>cmp(x.assets,y.assets)).forEach(r=>{
        const pct = r.pct!=null ? Math.round(r.pct) : "-";
        html += `<tr><td>${r.assets}</td><td style="color:${color(r.pct)}">${pct}</td><td>${r.reps}</td></tr>`;
      });
      html += "</table>";
    });
    html += "</div>";
    document.getElementById("quickArea").innerHTML = html;
    return;
  }

  /* ── Both shifts / All groups — Morning-vs-Night comparison ────────── */
  // base: per Shed+Assets+Shift, sum Total/Target
  const base = {};
  prod.forEach(r=>{
    const key = [T(r.shed), T(r.assets), r.shift].join("||");
    if(!base[key]) base[key] = { shed:T(r.shed), assets:T(r.assets), shift:r.shift, total:0, target:0 };
    base[key].total += rowTotal(r);
    base[key].target += Number(r.target||0);
  });

  // calc: per Shed+Assets, pick Morning/Night values
  const calc = {};
  Object.values(base).forEach(b=>{
    const key = b.shed + "||" + b.assets;
    if(!calc[key]) calc[key] = { shed:b.shed, assets:b.assets, P_M:null, P_N:null, R_M:0, R_N:0 };
    const pct = b.target ? (b.total/b.target)*100 : null;
    if(b.shift === "Morning"){ calc[key].P_M = pct; calc[key].R_M = repairs[b.assets+"||Morning"] || 0; }
    if(b.shift === "Night"){   calc[key].P_N = pct; calc[key].R_N = repairs[b.assets+"||Night"]   || 0; }
  });

  const sheds = {};
  Object.values(calc).forEach(c=>{ if(!sheds[c.shed]) sheds[c.shed]=[]; sheds[c.shed].push(c); });

  let html = `<div class="card"><h2>📊 Advanced Asset Report (Quick View) — ${f.groupName === "All" ? "All Groups" : "Group " + f.groupName}</h2>${groupMixHtml(prod)}${hiddenNote(f)}`;
  Object.keys(sheds).sort(cmp).forEach((shed,shedIdx)=>{
    html += `<h3${shedIdx>0?' class="shed-break"':''}>SHED ${shed}</h3>`;
    html += `<table><tr><th>Asset</th><th>Morning %</th><th>Night %</th><th>Rep M</th><th>Rep N</th></tr>`;
    sheds[shed].sort((x,y)=>cmp(x.assets,y.assets)).forEach(r=>{
      const pM = r.P_M!=null ? Math.round(r.P_M) : "-";
      const pN = r.P_N!=null ? Math.round(r.P_N) : "-";
      html += `<tr><td>${r.assets}</td><td style="color:${color(r.P_M)}">${pM}</td>` +
        `<td style="color:${color(r.P_N)}">${pN}</td><td>${r.R_M}</td><td>${r.R_N}</td></tr>`;
    });
    html += "</table>";
  });
  html += "</div>";
  document.getElementById("quickArea").innerHTML = html;
}

/* =========================================================
   DETAILED REPORT — mirrors generateAssetPDFBlob:
   Shed > Unit > Asset with MLD/ATG/MLU, grand + shed pass counts,
   plus Morning-vs-Night advanced analysis if Shift = All.
   ========================================================= */
async function generateDetailed(){
  const f = getFilters();
  if(!f.fromDate || !f.toDate){ alert("Please select From & To dates."); return; }
  const status = document.getElementById("status");
  if(status){ status.style.color="#555"; status.textContent="Loading "+f.fromDate+" to "+f.toDate+"…"; }
  try{ await fetchRangeData(f.fromDate, f.toDate); }
  catch(e){ if(status){ status.style.color="#c0392b"; status.textContent="Could not read data: "+(e.message||e);} return; }
  if(status){ status.textContent=""; }
  if(!MW_ROWS.length){ alert("No production rows found for this date range."); return; }

  const prod = filterProd(f);
  if(!prod.length){
    document.getElementById("detailArea").innerHTML = `<div class="card"><p>⚠️ No data found for the selected filters.</p>${hiddenNote(f)}</div>`;
    return;
  }
  const downtime = downtimeByAsset(f);

  // group by Shed + Units + Assets (this is the "prod" grouping in the original)
  const groups = {};
  prod.forEach(r=>{
    const key = [T(r.shed), T(r.units), T(r.assets)].join("||");
    if(!groups[key]) groups[key] = { shed:T(r.shed), unit:T(r.units), asset:T(r.assets), A:0,B:0,C:0,total:0,target:0, occ:0 };
    const g = groups[key];
    g.A += Number(r.a_double||0) + Number(r.a_single||0);
    g.B += Number(r.b||0);
    g.C += Number(r.c||0);
    g.total += rowTotal(r);
    g.target += Number(r.target||0);
    g.occ += 1;
  });

  // Row maths ported from the Apps Script metrics(): the target is scaled by the work hours (not rounded),
  // MLD can never be more than the target, ATG never below 0, and the percentages are N/A when ATG is 0.
  function computeRow(g){
    const rawTarget = g.target;
    const target = f.workMinutes !== 660 ? rawTarget * f.workMinutes / 660 : rawTarget;
    const D = downtime[g.asset] || 0;
    const MLD = Math.min((target * D) / (f.workMinutes * (g.occ||1)), target);
    const ATG = Math.max(target - MLD, 0);
    const MLU = g.total - ATG;
    const pA = ATG > 0 ? Math.round(g.A/ATG*100) : null;
    const pB = ATG > 0 ? Number((g.B/ATG*100).toFixed(2)) : null;
    const pP = ATG > 0 ? Math.round(g.total/ATG*100) : null;
    return { ...g, rawTarget, target, D, MLD, ATG, MLU, pA, pB, pP };
  }
  const rows = Object.values(groups).map(computeRow).sort((x,y)=> cmp(x.shed,y.shed) || cmp(x.unit,y.unit) || cmp(x.asset,y.asset));
  const naNum  = v => v == null ? "N/A" : v;
  const naPct2 = v => v == null ? "N/A" : v.toFixed(2);
  const totCells = t => `<td>${t.ATG>0?Math.round(t.A/t.ATG*100):"N/A"}</td><td>${t.ATG>0?(t.B/t.ATG*100).toFixed(2):"N/A"}</td><td>${t.ATG>0?Math.round(t.total/t.ATG*100):"N/A"}</td>`;
  const numCells = t => `<td>${Math.round(t.A)}</td><td>${Math.round(t.B)}</td><td>${Math.round(t.C)}</td><td>${Math.round(t.total)}</td>` +
    `<td>${Math.round(t.target)}</td><td>${Math.round(t.D)}</td><td>${Math.round(t.MLD)}</td><td>${Math.round(t.ATG)}</td><td>${Math.round(t.MLU)}</td>`;

  // grand + shed pass counts: >=90 / <=89 on %P; assets with no target (or no actual target) are Unrated
  let grandAbove=0, grandBelow=0, grandUnrated=0;
  const shedCounts = {};
  rows.forEach(r=>{
    const sc = shedCounts[r.shed] || (shedCounts[r.shed] = { shed:r.shed, above:0, below:0, unrated:0, total:0 });
    sc.total++;
    if(r.rawTarget <= 0 || r.pP === null){ grandUnrated++; sc.unrated++; return; }
    if(r.pP >= 90){ grandAbove++; sc.above++; } else { grandBelow++; sc.below++; }
  });

  // ── Overall Production Summary: built from the same rows as the tables, so every figure agrees ──
  const sumRows = k => rows.reduce((s,r)=>s+r[k],0);
  const overallA = sumRows("A"), overallB = sumRows("B"), overallC = sumRows("C"), overallTotal = sumRows("total");
  const overallTarget = sumRows("target"), totalMLD = sumRows("MLD"), overallATG = sumRows("ATG"), overallMLU = sumRows("MLU");
  const assetsUsed = [...new Set(rows.map(r=>r.asset))];
  const overallAssetsUsed = assetsUsed.length;
  const totalDowntime = assetsUsed.reduce((s,a)=>s+(downtime[a]||0),0);
  const overallPercB   = overallTotal>0 ? Math.round((overallB/overallTotal)*100) : 0;
  const overallPercC   = overallTotal>0 ? Math.round((overallC/overallTotal)*100) : 0;
  const overallProdEff = overallTarget>0 ? Math.round((overallTotal/overallTarget)*100) : 0;
  const overallActEff  = overallATG>0    ? Math.round((overallTotal/overallATG)*100)    : 0;

  let html = `<div class="card"><h2>🧶 Asset Summary Report (Detailed)</h2>
    <p style="text-align:center;">${f.fromDate} to ${f.toDate} | Shift: ${f.shift} | Group: ${f.groupName} | Section: ${f.section} | Work: ${f.workMinutes/60} hrs</p>${groupMixHtml(prod)}${hiddenNote(f)}`;

  html += `<h3>🏭 Overall Production Summary</h3>
    <p>Total Assets Used: <b>${overallAssetsUsed}</b></p>
    <p>A Grade Production: <b>${Math.round(overallA)}</b></p>
    <p>B Grade Production: <b>${Math.round(overallB)}</b></p>
    <p>C Grade Production: <b>${Math.round(overallC)}</b></p>
    <p>Total Production: <b>${Math.round(overallTotal)}</b></p>
    <p>Total Target: <b>${Math.round(overallTarget)}</b></p>
    <p>Actual Target (ATG): <b>${Math.round(overallATG)}</b></p>
    <p>B%: <b>${overallPercB}%</b></p>
    <p>C%: <b>${overallPercC}%</b></p>
    <p>Production Efficiency: <b>${overallProdEff}%</b></p>
    <p>Actual Production Efficiency: <b>${overallActEff}%</b></p>
    <p>Operational Loss (MLU): <b>${Math.round(overallMLU)}</b></p>
    <h4>Downtime Report</h4>
    <p>Total Downtime: <b>${Math.round(totalDowntime)} minutes</b></p>
    <p>Mat Loss by Downtime (MLD): <b>${Math.round(totalMLD)}</b></p>
    <hr>`;

  html += `<h3>📈 Grand Summary (All Sheds)</h3><table><tr><th>Metric</th><th>Count</th></tr>
    <tr><td>Assets ≥90%</td><td>${grandAbove}</td></tr>
    <tr><td>Assets ≤89%</td><td>${grandBelow}</td></tr>
    <tr><td>Unrated (no target)</td><td>${grandUnrated}</td></tr>
    <tr><td>Total Assets</td><td>${rows.length}</td></tr></table>`;

  html += `<h3>📊 Shed Summary (Performance)</h3><table><tr><th>Shed</th><th>Assets ≥90%</th><th>Assets ≤89%</th><th>Unrated</th><th>Total</th></tr>`;
  Object.values(shedCounts).sort((x,y)=>cmp(x.shed,y.shed)).forEach(s=>{
    html += `<tr><td>${s.shed}</td><td>${s.above}</td><td>${s.below}</td><td>${s.unrated}</td><td>${s.total}</td></tr>`;
  });
  html += "</table>";

  // Shed > Unit tables with Unit/Shed totals (totals are added up unrounded, then rounded for display)
  const bySh = {};
  rows.forEach(r=>{ if(!bySh[r.shed]) bySh[r.shed]=[]; bySh[r.shed].push(r); });

  const headers = ["S/N","Unit","Asset","A","B","C","Total","Target","Downtime","MLD","ATG","MLU","%A","%B","%P"];
  const zero = () => ({A:0,B:0,C:0,total:0,target:0,D:0,MLD:0,ATG:0,MLU:0});
  const addTo = (t, r) => { Object.keys(t).forEach(k => t[k] += r[k]); };
  let grand = zero();

  Object.keys(bySh).sort(cmp).forEach((shed,shedIdx)=>{
    html += `<h3${shedIdx>0?' class="shed-break"':''}>SHED ${shed}</h3>
    <p style="text-align:center;font-size:12px;margin:4px 0 8px;">${f.fromDate} to ${f.toDate} | Shift: ${f.shift} | Group: ${f.groupName} | Section: ${f.section} | Work: ${f.workMinutes/60} hrs</p>
    <table><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr>`;
    const shedRows = bySh[shed];
    const byUnit = {};
    shedRows.forEach(r=>{ if(!byUnit[r.unit]) byUnit[r.unit]=[]; byUnit[r.unit].push(r); });
    const shedTot = zero();

    Object.keys(byUnit).sort(cmp).forEach(unit=>{
      const unitTot = zero();
      byUnit[unit].forEach((r,i)=>{
        html += `<tr><td>${i+1}</td><td>${unit}</td><td>${r.asset}</td>${numCells(r)}` +
          `<td>${naNum(r.pA)}</td><td>${naPct2(r.pB)}</td><td>${naNum(r.pP)}</td></tr>`;
        addTo(unitTot, r);
      });
      html += `<tr class="total"><td></td><td>UNIT TOTAL</td><td></td>${numCells(unitTot)}${totCells(unitTot)}</tr>`;
      addTo(shedTot, unitTot);
    });

    html += `<tr class="grandtotal"><td></td><td>SHED TOTAL</td><td></td>${numCells(shedTot)}${totCells(shedTot)}</tr>`;
    html += "</table>";
    addTo(grand, shedTot);
  });

  html += `<h3>🏁 GRAND TOTAL (ALL SHEDS)</h3><table><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr>` +
    `<tr class="grandtotal"><td></td><td>GRAND TOTAL</td><td></td>${numCells(grand)}${totCells(grand)}</tr></table>`;

  // Downtime with no production output (ported from the Apps Script): assets that recorded downtime for these
  // dates / shift / section but produced nothing under the selected filters. Not shown while Shed or Work Type
  // filters are on, because those filters alone would make most assets look idle.
  if(!(f.shedType && f.shedType.length) && f.workType === "All"){
    const prodAssets = new Set(prod.map(r => T(r.assets)));
    const idle = Object.entries(downtimeInfo(f)).filter(([a]) => !prodAssets.has(a))
      .map(([a,v]) => ({ asset:a, shed:v.shed, down:v.min, occ:v.occ })).sort((x,y)=> y.down - x.down);
    if(idle.length){
      html += `<h3>⚠️ Downtime with No Production Output</h3>
        <p style="font-size:12px;margin:0 0 6px 0;">Assets that recorded downtime but produced nothing for the selected filters (full-shift stoppages or non-loom machines). Not included in the performance tables above.</p>
        <table><tr><th>Asset</th><th>Shed</th><th>Downtime (min)</th><th>Occurrences</th></tr>` +
        idle.map(r => `<tr><td>${r.asset}</td><td>${r.shed}</td><td>${Math.round(r.down)}</td><td>${r.occ}</td></tr>`).join("") + `</table>`;
    }
  }

  // Advanced Morning vs Night analysis — only when Shift = All
  if(f.shift === "All"){
    const repairs = repairsByAssetShift(f);
    const base = {};
    prod.forEach(r=>{
      const key = [T(r.shed), T(r.assets), r.shift].join("||");
      if(!base[key]) base[key] = { shed:T(r.shed), assets:T(r.assets), shift:r.shift, total:0, target:0 };
      base[key].total += rowTotal(r);
      base[key].target += Number(r.target||0);
    });
    const calc = {};
    Object.values(base).forEach(b=>{
      const key = b.shed + "||" + b.assets;
      if(!calc[key]) calc[key] = { shed:b.shed, assets:b.assets, P_M:null, P_N:null, R_M:0, R_N:0 };
      const pct = b.target ? (b.total/b.target)*100 : null;
      if(b.shift === "Morning"){ calc[key].P_M = pct; calc[key].R_M = repairs[b.assets+"||Morning"] || 0; }
      if(b.shift === "Night"){ calc[key].P_N = pct; calc[key].R_N = repairs[b.assets+"||Night"] || 0; }
    });
    const shAdv = {};
    Object.values(calc).forEach(c=>{ if(!shAdv[c.shed]) shAdv[c.shed]=[]; shAdv[c.shed].push(c); });
    function getColor(p){ return p==null ? "#000" : (p>=90 ? "#008000" : "#c00000"); }

    Object.keys(shAdv).sort(cmp).forEach(shed=>{
      const list = shAdv[shed].sort((x,y)=>cmp(x.assets,y.assets));
      html += `<h3>🔵 ALL ASSETS - SHED ${shed}</h3><table><tr><th>Asset</th><th>% Morning</th><th>% Night</th><th>Rep M</th><th>Rep N</th><th>Status</th></tr>`;
      list.forEach(r=>{
        const pM = r.P_M!=null?Math.round(r.P_M):null, pN = r.P_N!=null?Math.round(r.P_N):null;
        const status = (pM>=90 && pN>=90) ? "OK" : "NOT OK";
        html += `<tr><td>${r.assets}</td><td style="color:${getColor(pM)}">${pM??"-"}</td>` +
          `<td style="color:${getColor(pN)}">${pN??"-"}</td><td>${r.R_M}</td><td>${r.R_N}</td><td>${status}</td></tr>`;
      });
      html += "</table>";

      html += `<h3>🟡 MIXED PERFORMANCE</h3><table><tr><th>Asset</th><th>% Morning</th><th>% Night</th><th>Rep M</th><th>Rep N</th></tr>`;
      list.forEach(r=>{
        const pM = r.P_M!=null?Math.round(r.P_M):null, pN = r.P_N!=null?Math.round(r.P_N):null;
        if(pM!=null && pN!=null && ((pM>=90&&pN<90)||(pN>=90&&pM<90))){
          html += `<tr><td>${r.assets}</td><td style="color:${getColor(pM)}">${pM}</td><td style="color:${getColor(pN)}">${pN}</td><td>${r.R_M}</td><td>${r.R_N}</td></tr>`;
        }
      });
      html += "</table>";

      html += `<h3>🔴 BOTH BELOW 90</h3><table><tr><th>Asset</th><th>% Morning</th><th>% Night</th><th>Rep M</th><th>Rep N</th></tr>`;
      list.forEach(r=>{
        const pM = r.P_M!=null?Math.round(r.P_M):null, pN = r.P_N!=null?Math.round(r.P_N):null;
        if(pM!=null && pN!=null && pM<90 && pN<90){
          html += `<tr><td>${r.assets}</td><td style="color:${getColor(pM)}">${pM}</td><td style="color:${getColor(pN)}">${pN}</td><td>${r.R_M}</td><td>${r.R_N}</td></tr>`;
        }
      });
      html += "</table>";

      html += `<h3>⚫ SINGLE SHIFT ONLY</h3><table><tr><th>Asset</th><th>% Morning</th><th>% Night</th><th>Rep M</th><th>Rep N</th></tr>`;
      list.forEach(r=>{
        const pM = r.P_M!=null?Math.round(r.P_M):null, pN = r.P_N!=null?Math.round(r.P_N):null;
        if(pM==null || pN==null){
          html += `<tr><td>${r.assets}</td><td style="color:${getColor(pM)}">${pM??0}</td><td style="color:${getColor(pN)}">${pN??0}</td><td>${r.R_M}</td><td>${r.R_N}</td></tr>`;
        }
      });
      html += "</table>";
    });
  }

  html += "</div>";
  document.getElementById("detailArea").innerHTML = html;
}

init();
</script>
<script src="../../assets/letterhead.js"></script>
</body>
</html>
