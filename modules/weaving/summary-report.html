  (function(){
    function apply(t){ if(t) document.documentElement.setAttribute("data-theme", t); }
    window.addEventListener("message", function(e){ if(e.data && e.data.rumbuTheme) apply(e.data.rumbuTheme); });

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
*{box-sizing:border-box;}

/* ── Screen: navy gradient page, white card in the centre ── */
body{
  margin:0;font-family:var(--sans);
  background:linear-gradient(135deg,#0b5394,#073763);
  display:flex;justify-content:center;padding:18px;min-height:100vh;
}
.container{
  width:100%;max-width:1100px;
  background:#fff;          /* always white — never a CSS variable */
  color:#1f2430;            /* always dark text — never a CSS variable */
  border-radius:14px;
  box-shadow:0 15px 35px rgba(0,0,0,.25);
  padding:26px;
}

/* ── Header ── */
.header{text-align:center;margin-bottom:20px;}
.header h2{margin:0;color:#1F3864;font-size:24px;}
.header p{margin:4px 0 0;color:#666;font-size:13px;}

/* ── Form controls ── */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;}
.form-group{display:flex;flex-direction:column;}
label{font-weight:600;margin-bottom:5px;font-size:13px;color:#1F3864;}
input,select{padding:9px 10px;border:1px solid #d8dee8;border-radius:8px;font-size:13px;
  background:#fff;color:#1f2430;}
.shed-box{grid-column:1/-1;}
#shedContainer{
  border:1px solid #d8dee8;border-radius:10px;padding:10px;display:grid;
  grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;
  max-height:140px;overflow-y:auto;background:#f4f7fb;
}
#shedContainer label{font-weight:500;font-size:12px;display:flex;align-items:center;gap:5px;
  cursor:pointer;color:#1f2430;}
.btn-row{display:flex;gap:10px;margin-top:18px;}
button{flex:1;}

/* ── Status ── */
#status{margin-top:14px;text-align:center;font-weight:600;font-size:13px;}
.success{color:#0a7f2e;} .error{color:#c62828;} .loading{color:#1F3864;}

/* ── Report area — always white background, always dark text ── */
#reportArea{background:#fff;color:#1f2430;}
#reportArea h2{color:#1F3864;text-align:center;margin:18px 0 10px;}
#reportArea h3{color:#1F3864;margin:16px 0 6px;font-size:15px;
  border-bottom:2px solid #2E75B6;padding-bottom:4px;}
#reportArea h4{color:#2E75B6;margin:10px 0 4px;font-size:13px;}
#reportArea p{margin:4px 0;font-size:13px;color:#1f2430;}

/* ── Tables ── */
table{border-collapse:collapse;width:100%;font-size:12px;margin-top:6px;}
th,td{border:1px solid #666;padding:5px;text-align:center;}
th{background:#1F3864;color:#fff;}
tr:nth-child(even){background:#f2f2f2;}

/* ── Department block ── */
.dept-block{
  margin-bottom:12px;padding:10px 14px;
  border-left:4px solid #2E75B6;background:#f9fbfd;
  border-radius:0 8px 8px 0;
}
.dept-block h4{color:#1F3864;margin:0 0 6px;}
.dept-block p{margin:3px 0;font-size:13px;color:#1f2430;}

/* ── Notice banner ── */
.pending{
  background:#eaf6ee;border:1px dashed #1d8a4e;
  padding:10px;border-radius:8px;font-size:12px;color:#1d8a4e;
  margin-top:14px;
}

/* ── PRINT / SAVE AS PDF ─────────────────────────────────────
   Everything below overrides screen styles so the PDF is clean:
   white pages, dark text, no gradients, no shadows, no nav.
   ─────────────────────────────────────────────────────────── */
@media print{
  .no-print{display:none !important;}

  body{
    background:#fff !important;
    display:block !important;
    padding:0 !important;
    min-height:unset !important;
  }

  .container{
    max-width:100% !important;
    border-radius:0 !important;
    box-shadow:none !important;
    padding:10px 16px !important;
    background:#fff !important;
    color:#000 !important;
  }

  #reportArea{background:#fff !important;color:#000 !important;}
  #reportArea h2{color:#1F3864 !important;}
  #reportArea h3{color:#1F3864 !important;border-bottom:1.5px solid #2E75B6 !important;}
  #reportArea h4{color:#2E75B6 !important;}
  #reportArea p{color:#000 !important;}

  th{
    background:#1F3864 !important;color:#fff !important;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }
  tr:nth-child(even){
    background:#f2f2f2 !important;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }

  .dept-block{
    background:#f9fbfd !important;
    border-left:4px solid #2E75B6 !important;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
    break-inside:avoid;
  }
  .dept-block h4{color:#1F3864 !important;}
  .dept-block p{color:#000 !important;}

  /* Keep each section together where possible */
  h3{break-after:avoid;}
  h4{break-after:avoid;}
  p{orphans:3;widows:3;}
  table{break-inside:auto;}
  tr{break-inside:avoid;}
}
</style>

  'WW-01','WW-02','WW-03','WW-04','WW-05','WW-06','WW-07','WW-08','WW-09','WW-10','WW-11','WW-12',

  'WY-01','WY-02','WY-03','WY-04','WY-05','WY-06','WY-07','WY-08','WY-09','WY-10','WY-11','WY-12',
  'WY-13','WY-14','WY-15','WY-16','WY-17',

  'WZ-13','WZ-14','WZ-15','WZ-16','WZ-17','WZ-18'
]);

const SECTION_LABEL = { "Rumbu": "Rumbu", "MamaSannu": "Mama Sannu" };

let MW_TABLE = "mat_weaving"; // resolved properly in init() below
let MW_ROWS = [], CTRL_ROWS = [], COMPLAINTS_ROWS = [], EXCLUDED_JOB_CODES = new Set(); CTRL_ROWS.forEach(normalizeControlRow);

function parseDT(v){ const d=new Date(v); return isNaN(d)?null:d; }
function minutesBetween(a,b){ return (!a||!b) ? 0 : Math.trunc((b-a)/60000); } // FIX A: trunc matches BigQuery TIMESTAMP_DIFF(MINUTE)
function authHeaders(){ return { "apikey": SUPABASE_ANON_KEY, "Authorization": "Bearer " + SUPABASE_ANON_KEY }; }


// Fetch ALL rows from a table, paginating past Supabase's 1000-row cap.
async function fetchAllRows(table, select, query){
  let all = [], offset = 0; const pageSize = 1000;
  const q = query || "";
  for(let guard=0; guard<500; guard++){
    const headers = Object.assign({}, authHeaders(), { "Range-Unit":"items", "Range": offset + "-" + (offset+pageSize-1) });
    const res = await fetch(SUPABASE_URL + "/rest/v1/" + table + "?select=" + (select||"*") + q, { headers });
    if(!res.ok) throw new Error(table + ": HTTP " + res.status);
    const batch = await res.json();
    all = all.concat(batch);
    if(batch.length < pageSize) break;
    offset += pageSize;
  }
  return all;
}

// Fetch Mat_Weaving + control scoped to a date range (server-side filter).
async function fetchRangeData(fromDate, toDate){
  const mwQ   = "&date_col=gte." + fromDate + "&date_col=lte." + toDate;
  const ctrlQ = "&date=gte." + fromDate + "&date=lte." + toDate;
  const [mw, ctrl] = await Promise.all([
    fetchAllRows(MW_TABLE,"*", mwQ),
    fetchAllRows("control","*", ctrlQ)
  ]);
  MW_ROWS = mw;
  CTRL_ROWS = ctrl; CTRL_ROWS.forEach(normalizeControlRow);
}

function normalizeControlRow(r){
  if(r.date_col === undefined) r.date_col = r.date;
  if(r.names === undefined) r.names = r.nurse_name;
  if(r.stop_time === undefined) r.stop_time = r.mc_stoppage_time;
  if(r.extimated_time === undefined) r.extimated_time = r.estimated_duration;
  if(r.discription === undefined) r.discription = r.description;
  return r;
}

async function init(){
  const status = document.getElementById("status");
  try{
    const me = await requireAuth("../../login.html");
    if(!me) return;
    MW_TABLE = await resolveWeavingTable();

    const mySections = (me.sectionNames && me.sectionNames.length) ? me.sectionNames : ["Rumbu","MamaSannu","Rumbu Mainmat"];
    document.getElementById("section").innerHTML = '<option value="All">All</option>' +
      mySections.map(s=>`<option value="${s}">${SECTION_LABEL[s]||s}</option>`).join("");
    // Default-select and lock the dropdown to the user's own Section when they only have one.
    if(mySections.length === 1){
      document.getElementById("section").value = mySections[0];
      document.getElementById("section").disabled = true;
    }

    const [jobRes, compRes] = await Promise.all([
      fetch(SUPABASE_URL + "/rest/v1/job_table?select=job_code", { headers: authHeaders() }),
      fetch(SUPABASE_URL + "/rest/v1/complaints?select=*", { headers: authHeaders() })
    ]);
    if(jobRes.ok){
      const jobRows = await jobRes.json();
      EXCLUDED_JOB_CODES = new Set(jobRows.map(r => r.job_code));
    }
    COMPLAINTS_ROWS = compRes.ok ? await compRes.json() : [];
    status.className="success";
    status.textContent = "Ready. Select a date range and click Generate Report.";
  }catch(e){
    status.className="error";
    status.textContent = "Could not read data: " + (e.message||e);
  }
}

function getFormData(){
  return {
    fromDate: document.getElementById("fromDate").value,
    toDate: document.getElementById("toDate").value,
    shift: document.getElementById("shift").value,
    group: document.getElementById("group").value,
    section: document.getElementById("section").value,
    workType: document.getElementById("workType").value,
    shedType: [...document.querySelectorAll("#shedContainer input:checked")].map(cb=>cb.value),
    workMinutes: Number(document.getElementById("workMinutes").value) || 660
  };
}

async function generate(){
  const f = getFormData();
  const status = document.getElementById("status");
  if(!f.fromDate || !f.toDate){ status.className="error"; status.textContent="⚠ Please select From & To dates."; return; }

  status.className=""; status.textContent = "Loading data for " + f.fromDate + " to " + f.toDate + "…";
  try{
    await fetchRangeData(f.fromDate, f.toDate);
  }catch(e){
    status.className="error"; status.textContent = "Could not read data: " + (e.message||e); return;
  }
  status.className="success"; status.textContent = "";

  if(!MW_ROWS.length){
    document.getElementById("reportArea").innerHTML =
      "<p>No production records found for this date range.</p>";
    return;
  }

  // ---- filter production rows ----
  const prod = MW_ROWS.filter(r=>{
    if(r.date_col < f.fromDate || r.date_col > f.toDate) return false;
    if(f.shift !== "All" && r.shift !== f.shift) return false;
    if(f.group !== "All" && r.group_name !== f.group) return false;
    if(f.section !== "All" && r.section !== f.section) return false;
    if(f.workType !== "All" && r.work_type !== f.workType) return false;
    if(f.shedType.length && !f.shedType.includes(String(r.shed))) return false;
    return true;
  });
  if(!prod.length){
    document.getElementById("reportArea").innerHTML = `<p style='color:red'>⚠️ No data found for selected filters. ` +
      `Mat_Weaving had ${MW_ROWS.length} rows total, but none matched date ${f.fromDate} to ${f.toDate}, ` +
      `shift=${f.shift}, group=${f.group}, section=${f.section}, workType=${f.workType}, ` +
      `sheds=${f.shedType.join(",")||"(none selected = all)"}.</p>`;
    return;
  }

  // ---- downtime per asset+date (control) — matches BigQuery GROUP BY m.Assets, m.Date ----
  const downtimeByAssetDate = {};
  CTRL_ROWS.forEach(r=>{
    if(r.date_col < f.fromDate || r.date_col > f.toDate) return;
    if(f.shift !== "All" && r.shift !== f.shift) return;
    if(f.section !== "All" && r.section !== f.section) return;
    if(EXCLUDED_JOB_CODES.has(r.job_code)) return;
    if(!WEAVING_ASSETS.has(r.assets)) return; // matches GAS buildAssetInClause() whitelist
    const stop = parseDT(r.stop_time), finish = parseDT(r.finish_time);
    if(!stop || !finish) return;
    const key = r.assets + "||" + r.date_col;  // FIX 1: asset-level, not unit-level
    downtimeByAssetDate[key] = (downtimeByAssetDate[key] || 0) + minutesBetween(stop, finish);
  });

  // ---- production per asset+date (for MLD calc) — matches BigQuery GROUP BY p.Assets, p.Date ----
  const prodByAssetDate = {};
  prod.forEach(r=>{
    const key = r.assets + "||" + r.date_col;  // FIX 2: asset-level, not unit-level
    if(!prodByAssetDate[key]) prodByAssetDate[key] = { target:0, total:0, count:0 };
    prodByAssetDate[key].target += Number(r.target||0);
    prodByAssetDate[key].total  += Number(r.total||0);
    prodByAssetDate[key].count  += 1; // = COUNT(p.Assets) per asset+date in BigQuery
  });

  // ---- production grouped by Mat Type (daily MLD summed) ----
  const byType = {};
  prod.forEach(r=>{
    const type = r.mat_type || "(blank)";
    if(!byType[type]) byType[type] = { type, assets:0, A:0, B:0, C:0, total:0, target:0, downtime:0, mld:0 };
    const t = byType[type];
    t.assets += 1; // FIX 3: COUNT(p.Assets) per mat_type — matches BigQuery, counts all records not unique machines
    t.A += Number(r.a_double||0) + Number(r.a_single||0);
    t.B += Number(r.b||0);
    t.C += Number(r.c||0);
    t.total  += Number(r.total||0);
    t.target += Number(r.target||0);
    const akey = r.assets + "||" + r.date_col;          // FIX 1 applied here: asset-level key
    const dt   = downtimeByAssetDate[akey] || 0;
    const pa   = prodByAssetDate[akey] || { count:1 };
    const mld  = r.target ? Math.round((Number(r.target||0) * dt) / (f.workMinutes * (pa.count||1))) : 0;
    t.downtime += dt / (pa.count||1); // spread asset-level downtime across its shift records
    t.mld      += mld;
  });

  // ---- overall totals ----
  const overall = { A:0,B:0,C:0,total:0,target:0,downtime:0,mld:0,mlu:0,assets:0,actualTarget:0 };
  Object.values(byType).forEach(t=>{
    const ATG = t.target - t.mld;
    const MLU = t.total - ATG;
    overall.A += t.A; overall.B += t.B; overall.C += t.C; overall.total += t.total;
    overall.target += t.target; overall.mld += t.mld;
    overall.mlu += MLU; overall.assets += t.assets; overall.actualTarget += ATG;
  });

  // FIX B: compute total downtime directly from control rows — matches BigQuery's
  // standalone SUM(DowntimeMin) query. The byType loop misses assets that have
  // maintenance records but no production rows, causing undercount.
  let totalDT = 0;
  CTRL_ROWS.forEach(r=>{
    if(r.date_col < f.fromDate || r.date_col > f.toDate) return;
    if(f.shift   !== "All" && r.shift   !== f.shift)   return;
    if(f.section !== "All" && r.section !== f.section) return;
    if(EXCLUDED_JOB_CODES.has(r.job_code)) return;
    if(!WEAVING_ASSETS.has(r.assets)) return;
    const stop = parseDT(r.stop_time), finish = parseDT(r.finish_time);
    if(!stop || !finish) return;
    totalDT += minutesBetween(stop, finish);
  });
  overall.downtime = totalDT;
  const overallATG = overall.target - overall.mld;
  const pB = overall.total ? Math.round((overall.B/overall.total)*100) : 0;
  const pC = overall.total ? Math.round((overall.C/overall.total)*100) : 0;
  const prodEff = overall.target ? Math.round((overall.total/overall.target)*100) : 0;
  const actualEff = overallATG ? Math.round((overall.total/overallATG)*100) : 0;

  // ---- Department Downtime Summary (from control) ----
  const byDept = {};
  CTRL_ROWS.forEach(r=>{
    if(r.date_col < f.fromDate || r.date_col > f.toDate) return;
    if(f.shift !== "All" && r.shift !== f.shift) return;
    if(f.section !== "All" && r.section !== f.section) return;
    if(EXCLUDED_JOB_CODES.has(r.job_code)) return;
    if(!WEAVING_ASSETS.has(r.assets)) return; // matches GAS getDepartmentDowntimeSummary whitelist
    const stop = parseDT(r.stop_time), finish = parseDT(r.finish_time);
    if(!stop || !finish) return;
    const key = r.department || "(blank)";
    if(!byDept[key]) byDept[key] = { department:key, downtime:0, matLoss:0 };
    const dt = minutesBetween(stop, finish);
    byDept[key].downtime += dt;
    const akey = r.assets + "||" + r.date_col;  // FIX 1 applied to dept: asset-level
    const pa   = prodByAssetDate[akey];
    if(pa){
      const loss = Math.round((pa.target * dt) / (f.workMinutes * (pa.count||1)));
      byDept[key].matLoss += loss;
    }
  });

  // ---- build HTML ----
  let html = `<h3>Overall Production</h3>
    <p>Total Assets Used = ${overall.assets}</p>
    <p>Our A Grade Production = ${Math.round(overall.A)}</p>
    <p>Our B Grade Production = ${Math.round(overall.B)}</p>
    <p>Our C Grade Production = ${Math.round(overall.C)}</p>
    <p>Our Total Production = ${Math.round(overall.total)}</p>
    <p>Our Total Target = ${Math.round(overall.target)}</p>
    <p>Our Actual Target = ${Math.round(overall.actualTarget)}</p>
    <p>Our B % = ${pB}%</p>
    <p>Our C % = ${pC}%</p>
    <p>Our Production Efficiency = ${prodEff}%</p>
    <p>Our Actual Production Efficiency = ${actualEff}%</p>
    <p>Our Operational Loss = ${Math.round(overall.mlu)}</p>
    <h4>Down time report</h4>
    <p>Total Downtime = ${Math.round(overall.downtime)} minutes</p>
    <p>Mat Loss by Downtime = ${Math.round(overall.mld)}</p>
    <div style="page-break-after: always;"></div>`;

  html += "<h3>📊 Department Downtime Summary</h3>";
  const deptList = Object.values(byDept);
  if(deptList.length){
    deptList.sort((a,b)=>b.downtime-a.downtime).forEach(d=>{
      const percent = overall.total ? (d.matLoss/overall.total)*100 : 0;
      html += `<div class="dept-block"><h4>Department: ${d.department}</h4>
        <p>Our Downtime is: ${Math.round(d.downtime)} minutes</p>
        <p>Our Mat Loss due to downtime is: ${Math.round(d.matLoss)}</p>
        <p>Our Percentage Loss is: ${percent.toFixed(2)}%</p></div>`;
    });
  } else {
    html += "<p>No department data found.</p>";
  }
  html += `<div style="page-break-after: always;"></div>`;

  let typeCount = 0;
  const typeEntries = Object.values(byType);
  typeEntries.forEach((t,idx)=>{
    const ATG = t.target - t.mld;
    const MLU = t.total - ATG;
    const percB = t.total ? Math.round((t.B/t.total)*100) : 0;
    const percC = t.total ? Math.round((t.C/t.total)*100) : 0;
    const prodEffT = t.target ? Math.round((t.total/t.target)*100) : 0;
    const actualEffT = ATG ? Math.round((t.total/ATG)*100) : 0;
    html += `<div style="margin-bottom:16px;">
      <h3>Production By Type: ${t.type}</h3>
      <p>Assets Used = ${t.assets}</p>
      <p>Our A Grade Production = ${Math.round(t.A)}</p>
      <p>Our B Grade Production = ${Math.round(t.B)}</p>
      <p>Our C Grade Production = ${Math.round(t.C)}</p>
      <p>Our Total Production = ${Math.round(t.total)}</p>
      <p>Our B % = ${percB}%</p>
      <p>Our C % = ${percC}%</p>
      <p>Our Production Efficiency = ${prodEffT}%</p>
      <p>Our Actual Production Efficiency = ${actualEffT}%</p>
      <p>Our Operational Loss = ${Math.round(MLU)}</p>
      <h4>Down time report</h4>
      <p>Total Downtime = ${Math.round(t.downtime)} minutes</p>
      <p>Mat Loss by Downtime = ${Math.round(t.mld)}</p>
    </div>`;
    typeCount++;
    if(typeCount % 2 === 0 && idx < typeEntries.length-1) html += `<div style="page-break-after: always;"></div>`;
  });

  const complaints = COMPLAINTS_ROWS.filter(r=>{
    if(String(r.department||"").toLowerCase() !== "weaving") return false;
    if(r.date_col < f.fromDate || r.date_col > f.toDate) return false;
    if(f.shift !== "All" && r.shift !== f.shift) return false;
    if(f.section !== "All" && r.section !== f.section) return false;
    return true;
  }).sort((a,b)=> (a.date_col+a.from_time).localeCompare(b.date_col+b.from_time));

  html += `<h2 style="text-align:center;">📢 Complaints Report</h2>`;
  if(complaints.length){
    html += "<table><tr><th>ID</th><th>Section</th><th>Shift</th><th>Date</th><th>Type</th><th>From</th><th>To</th><th>Description</th></tr>";
    complaints.forEach(c=>{
      html += `<tr><td>${c.complaint_id||""}</td><td>${c.section||""}</td><td>${c.shift||""}</td>` +
        `<td>${c.date_col||""}</td><td>${c.complaint_type||""}</td><td>${c.from_time||""}</td>` +
        `<td>${c.to_time||""}</td><td>${c.description||""}</td></tr>`;
    });
    html += "</table>";
  } else {
    html += `<p style="text-align:center;">No complaints found for selected filters.</p>`;
  }

  document.getElementById("reportArea").innerHTML = html;
  status.className="success"; status.textContent = "✅ Report generated";
}

init();
</script>
<script src="../../assets/letterhead.js"></script>
</body>
</html>
