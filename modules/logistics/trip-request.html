<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Trip Request — Logistics</title>
<link rel="stylesheet" href="../../styles.css">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("rumbu_theme")||"navy"); }catch(e){} })();
  window.addEventListener("message",function(e){ if(e.data&&e.data.rumbuTheme) document.documentElement.setAttribute("data-theme",e.data.rumbuTheme); });
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../auth.js"></script>
<script src="review-modal.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  /* ── Layout ── */
  body{padding:16px;}
  .wrap{max-width:980px;margin:0 auto;}
  .back-btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:8px 16px;background:var(--card);color:var(--heading);
    border:1.5px solid var(--line);border-radius:9px;font-weight:700;
    font-size:13px;cursor:pointer;margin-bottom:14px;
    transition:all .15s ease;
  }
  .back-btn:hover{border-color:var(--accent);color:var(--accent);}
  #connStatus{font-size:12px;font-weight:700;text-align:center;margin-bottom:10px;color:var(--muted);}

  /* ── Page header ── */
  .page-header{
    background:linear-gradient(130deg,#1F3864 0%,#2E75B6 100%);
    border-radius:16px;padding:18px 22px;margin-bottom:16px;color:#fff;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .page-header h2{margin:0;font-size:18px;font-weight:800;}
  .page-header p{margin:4px 0 0;font-size:12px;opacity:.88;}
  .new-trip-btn{
    background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.4);
    color:#fff;padding:9px 18px;border-radius:9px;font-weight:800;
    font-size:13px;cursor:pointer;white-space:nowrap;
    transition:background .15s ease;
  }
  .new-trip-btn:hover{background:rgba(255,255,255,.25);}

  /* ── Form panel ── */
  .form-panel{
    background:var(--card);border:1.5px solid var(--line);
    border-radius:16px;padding:22px 24px;margin-bottom:18px;
    box-shadow:0 2px 8px rgba(0,0,0,.06),0 6px 20px rgba(0,0,0,.07);
    display:none;
  }
  .form-panel.open{display:block;}
  .form-panel h4{margin:0 0 16px;font-size:15px;font-weight:800;color:var(--heading);}

  .sec-label{
    font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;
    color:var(--accent);border-bottom:1.5px solid var(--accent);
    padding-bottom:5px;margin:18px 0 12px;
  }
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  @media(max-width:600px){.form-row,.form-row-3{grid-template-columns:1fr;}}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px;}
  .field input,.field select,.field textarea{
    width:100%;padding:10px 12px;border:1.5px solid var(--line-2);
    border-radius:9px;font-size:13.5px;font-family:inherit;
    background:var(--bg);color:var(--text);transition:border-color .15s ease;
  }
  .field input:focus,.field select:focus,.field textarea:focus{
    outline:none;border-color:var(--accent);
    box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent);
  }
  .field-hint{font-size:11.5px;color:var(--muted);margin-top:5px;}
  .field-hint.warn{color:var(--warn);font-weight:700;}

  /* Driver confirmed-name card */
  .driver-confirm{
    display:none;align-items:center;gap:10px;
    margin-top:8px;padding:9px 13px;
    background:color-mix(in srgb,var(--accent) 8%,var(--bg));
    border:1.5px solid color-mix(in srgb,var(--accent) 25%,transparent);
    border-radius:10px;
  }
  .driver-confirm .dc-av{
    width:34px;height:34px;border-radius:50%;flex:0 0 34px;
    background:var(--accent);color:var(--logo-fg);
    display:grid;place-items:center;font-weight:800;font-size:13px;
  }
  .driver-confirm .dc-name{font-size:13.5px;font-weight:700;color:var(--heading);}
  .driver-confirm .dc-id{font-size:11.5px;color:var(--muted);}

  .form-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;}
  .btn-submit{
    background:var(--accent);color:var(--logo-fg);
    padding:10px 22px;border:none;border-radius:9px;
    font-weight:800;font-size:13px;cursor:pointer;
    box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 30%,transparent);
    transition:all .15s ease;
  }
  .btn-submit:hover{filter:brightness(1.08);transform:translateY(-1px);}
  .btn-cancel{
    background:var(--bg);color:var(--muted);
    border:1.5px solid var(--line);padding:10px 18px;
    border-radius:9px;font-weight:700;font-size:13px;cursor:pointer;
  }
  .btn-cancel:hover{color:var(--heading);border-color:var(--line-2);}

  /* ── Filters bar ── */
  .filter-bar{
    background:var(--card);border:1.5px solid var(--line);
    border-radius:14px;padding:14px 18px;margin-bottom:16px;
    display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;
  }
  .filter-bar .f{flex:1;min-width:150px;}
  .filter-bar label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:4px;}
  .filter-bar input,.filter-bar select{
    width:100%;padding:8px 11px;border:1.5px solid var(--line-2);
    border-radius:8px;font-size:13px;background:var(--bg);color:var(--text);
  }
  .filter-bar .pdf-btn{
    background:var(--bg);border:1.5px solid var(--line);color:var(--heading);
    padding:8px 14px;border-radius:8px;font-weight:700;font-size:12.5px;
    cursor:pointer;white-space:nowrap;transition:all .15s ease;
  }
  .filter-bar .pdf-btn:hover{border-color:var(--accent);color:var(--accent);}

  /* ── Trip cards ── */
  .trips-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
    gap:14px;
  }
  .trip-card{
    background:var(--card);border:1.5px solid var(--line);border-radius:15px;
    overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.07);
    transition:box-shadow .15s ease,transform .15s ease;
  }
  .trip-card:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.10),0 12px 36px rgba(0,0,0,.12);}
  .trip-card .tc-head{
    padding:10px 14px;display:flex;align-items:center;
    justify-content:space-between;gap:8px;
    border-bottom:1px solid var(--line);background:var(--bg);
  }
  .trip-card .tc-date{font-size:12px;font-weight:700;color:var(--muted);}
  .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:10.5px;font-weight:800;}
  .b-submitted{background:#fef3c7;color:#92400e;}
  .b-dispatched{background:#e0e7ff;color:#3730a3;}
  .b-completed{background:#dcfce7;color:#166534;}
  .b-rejected{background:#fee2e2;color:#991b1b;}
  .trip-card .tc-body{padding:14px;}
  .trip-card .tc-dest{font-size:16px;font-weight:800;color:var(--heading);margin:0 0 4px;line-height:1.3;}
  .trip-card .tc-dept{font-size:12px;color:var(--muted);margin-bottom:10px;}
  .trip-card .tc-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--text);}
  .trip-card .tc-meta span{display:inline-flex;align-items:center;gap:5px;}
  .trip-card .tc-meta .ic{font-size:14px;}

  .empty-state{
    text-align:center;padding:40px 20px;
    color:var(--muted);font-size:13.5px;
    background:var(--card);border:1.5px solid var(--line);
    border-radius:14px;
  }
  .empty-state .emo{font-size:36px;margin-bottom:8px;}

  /* status */
  .status{min-height:16px;font-size:13px;font-weight:700;margin-top:10px;}
  .status.ok{color:var(--ok);}
  .status.err{color:var(--bad);}
  .status.warn{color:var(--warn);}
</style>
</head>
<body>
<div class="wrap">
  <button class="back-btn" onclick="(window.parent&&window.parent.closeModule)?window.parent.closeModule():(window.location.href='../../index.html')">← Back</button>
  <div id="connStatus">Loading…</div>

  <!-- Page header -->
  <div class="page-header">
    <div>
      <h2>🚗 Trip Requests</h2>
      <p>Request a vehicle and driver — goes to Dispatch queue on submit.</p>
    </div>
    <button class="new-trip-btn" onclick="toggleForm()">+ New Trip Request</button>
  </div>

  <!-- New trip form -->
  <div class="form-panel" id="formPanel">
    <h4 id="formTitle">New Trip Request</h4>
    <input type="hidden" id="t_id">

    <div class="sec-label">Trip Details</div>
    <div class="form-row">
      <div class="field"><label>Requesting Department *</label><input id="t_dept" placeholder="e.g. Finance, Production"></div>
      <div class="field"><label>Destination *</label><input id="t_destination" placeholder="Where is the vehicle going?"></div>
    </div>
    <div class="field" style="margin-top:14px;"><label>Purpose of Trip *</label><textarea id="t_purpose" rows="2" placeholder="Brief reason for the trip"></textarea></div>
    <div class="form-row" style="margin-top:14px;">
      <div class="field"><label>Trip Date *</label><input type="date" id="t_date"></div>
      <div class="field"><label>Expected Duration (hours) *</label><input type="number" step="0.5" min="0" id="t_duration" placeholder="e.g. 3"></div>
    </div>

    <div class="sec-label">Vehicle & Driver</div>
    <div class="form-row">
      <div class="field">
        <label>Vehicle *</label>
        <select id="t_vehicle" onchange="onVehicleChange()"><option value="">— Select Vehicle —</option></select>
        <p class="field-hint" id="vehicleStatusNote"></p>
      </div>
      <div class="field">
        <label>Driver *</label>
        <select id="t_driver" onchange="onDriverChange()"><option value="">— Select Driver —</option></select>
        <!-- Driver name auto-fill card -->
        <div class="driver-confirm" id="driverConfirm">
          <div class="dc-av" id="dcAv">?</div>
          <div><div class="dc-name" id="dcName">—</div><div class="dc-id" id="dcId">—</div></div>
        </div>
      </div>
    </div>

    <div class="sec-label">Attachment</div>
    <div class="field"><label>Supporting Document (optional)</label><input type="file" id="t_file"><div id="t_file_url" style="display:none;"></div></div>

    <div class="form-actions">
      <button class="btn-submit" onclick="submitTrip()">Submit Trip Request</button>
      <button class="btn-cancel" onclick="toggleForm()">Cancel</button>
    </div>
    <div class="status" id="formStatus"></div>
  </div>

  <!-- Filters -->
  <div class="filter-bar">
    <div class="f"><label>Search</label><input id="search" placeholder="Department, destination…" oninput="render()"></div>
    <div class="f"><label>Status</label>
      <select id="statusFilter" onchange="render()">
        <option value="">All statuses</option>
        <option value="submitted">Submitted (awaiting dispatch)</option>
        <option value="dispatched">Dispatched</option>
        <option value="completed">Completed</option>
      </select>
    </div>
    <button class="pdf-btn" onclick="downloadPdf()">⬇ Export PDF</button>
  </div>

  <!-- Trip cards grid -->
  <div id="tripsWrap"></div>
</div>

<script>
let ME = null, TRIPS = [], VEHICLES = [], DRIVERS = [], CURRENT_ROWS = [];

async function init(){
  const st = document.getElementById("connStatus");
  try{
    ME = await requireAuth("../../login.html");
    if(!ME) return;
    await loadAll();
    st.style.color="var(--ok)"; st.textContent="Connected.";
  }catch(e){
    st.style.color="var(--bad)"; st.textContent="Error: "+e.message;
  }
}

async function loadAll(){
  const [{ data:tData, error:tErr }, { data:vData }, { data:dData }] = await Promise.all([
    sb.from("logistics_trips")
      .select("*, logistics_vehicles(registration_number), logistics_drivers(employees(full_name))")
      .order("created_at",{ascending:false}),
    sb.from("logistics_vehicles").select("id,registration_number,operational_status").order("registration_number"),
    sb.from("logistics_drivers").select("id,employees(full_name,employee_id)").order("id")
  ]);
  if(tErr) throw tErr;
  TRIPS=tData||[]; VEHICLES=vData||[]; DRIVERS=dData||[];

  document.getElementById("t_vehicle").innerHTML =
    '<option value="">— Select Vehicle —</option>' +
    VEHICLES.map(v=>`<option value="${v.id}" data-status="${v.operational_status||''}">${v.registration_number} (${v.operational_status||'Unknown'})</option>`).join("");

  document.getElementById("t_driver").innerHTML =
    '<option value="">— Select Driver —</option>' +
    DRIVERS.map(d=>{
      const e = d.employees||{};
      return `<option value="${d.id}">${e.full_name||'Unknown'} — ${e.employee_id||'—'}</option>`;
    }).join("");

  render();
}

/* ── Vehicle change ── */
function onVehicleChange(){
  const sel = document.getElementById("t_vehicle");
  const opt = sel.options[sel.selectedIndex];
  const st  = opt ? opt.getAttribute("data-status") : "";
  const note = document.getElementById("vehicleStatusNote");
  if(st && st !== "Active" && st !== ""){
    note.className = "field-hint warn";
    note.textContent = `⚠️ This vehicle is currently "${st}" — confirm it's available before submitting.`;
  } else {
    note.className = "field-hint";
    note.textContent = "";
  }
}

/* ── Driver change: auto-fill name card ── */
function onDriverChange(){
  const sel     = document.getElementById("t_driver");
  const confirm = document.getElementById("driverConfirm");
  if(!sel.value){ confirm.style.display = "none"; return; }

  const driver = DRIVERS.find(d => String(d.id) === String(sel.value));
  if(driver && driver.employees){
    const e   = driver.employees;
    const name = e.full_name || "—";
    const initials = name.split(" ").map(w=>w[0]).join("").toUpperCase().slice(0,2);
    document.getElementById("dcAv").textContent  = initials;
    document.getElementById("dcName").textContent = name;
    document.getElementById("dcId").textContent  = "Employee ID: " + (e.employee_id || "—");
    confirm.style.display = "flex";
  } else {
    confirm.style.display = "none";
  }
}

/* ── Render trip cards ── */
const BADGE = { submitted:"b-submitted", dispatched:"b-dispatched", completed:"b-completed", rejected:"b-rejected" };
const LABEL = { submitted:"Submitted", dispatched:"Dispatched", completed:"Completed", rejected:"Rejected" };
const ICON  = { submitted:"🕐", dispatched:"🚚", completed:"✅", rejected:"❌" };

function render(){
  const q  = document.getElementById("search").value.trim().toLowerCase();
  const sf = document.getElementById("statusFilter").value;
  let rows = TRIPS.filter(t=>{
    if(sf && t.status!==sf) return false;
    if(q && !((t.requesting_department||"")+(t.destination||"")+(t.purpose||"")).toLowerCase().includes(q)) return false;
    return true;
  });
  CURRENT_ROWS = rows;
  const wrap = document.getElementById("tripsWrap");

  if(!rows.length){
    wrap.innerHTML = `<div class="empty-state"><div class="emo">🚗</div><p>No trip requests match.</p></div>`;
    return;
  }

  wrap.innerHTML = `<div class="trips-grid">${rows.map(t=>{
    const veh = t.logistics_vehicles ? t.logistics_vehicles.registration_number : "—";
    const drv = (t.logistics_drivers && t.logistics_drivers.employees) ? t.logistics_drivers.employees.full_name : "—";
    const st  = t.status || "submitted";
    const date = t.trip_date ? new Date(t.trip_date).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}) : "—";
    const dur  = t.expected_duration_hours != null ? t.expected_duration_hours + "h" : "—";

    return `<div class="trip-card">
      <div class="tc-head">
        <span class="tc-date">📅 ${date}</span>
        <span class="badge ${BADGE[st]||''}">${ICON[st]||''} ${LABEL[st]||st}</span>
      </div>
      <div class="tc-body">
        <div class="tc-dest">${esc(t.destination||"—")}</div>
        <div class="tc-dept">${esc(t.requesting_department||"—")}</div>
        <div class="tc-meta">
          <span><span class="ic">🚗</span>${esc(veh)}</span>
          <span><span class="ic">👤</span>${esc(drv)}</span>
          <span><span class="ic">⏱</span>${dur}</span>
        </div>
      </div>
    </div>`;
  }).join("")}</div>`;
}

function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ── Form toggle / clear ── */
function toggleForm(){
  const panel = document.getElementById("formPanel");
  const isOpen = panel.classList.toggle("open");
  if(isOpen) clearForm();
}
function clearForm(){
  document.getElementById("formTitle").textContent = "New Trip Request";
  document.getElementById("t_id").value = "";
  ["t_dept","t_destination","t_purpose","t_date","t_duration"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("t_vehicle").value = "";
  document.getElementById("t_driver").value = "";
  document.getElementById("vehicleStatusNote").textContent = "";
  document.getElementById("driverConfirm").style.display = "none";
  document.getElementById("formStatus").textContent = "";
}

/* ── Submit ── */
function submitTrip(){
  const status = document.getElementById("formStatus");
  const required = [
    ["t_dept","Requesting Department"],["t_destination","Destination"],["t_purpose","Purpose"],
    ["t_date","Trip Date"],["t_duration","Expected Duration"],["t_vehicle","Vehicle"],["t_driver","Driver"]
  ];
  for(const [id,label] of required){
    if(!document.getElementById(id).value){ status.className="status err"; status.textContent=`"${label}" is required.`; return; }
  }
  const vSel = document.getElementById("t_vehicle");
  const dSel = document.getElementById("t_driver");
  status.textContent = "";
  showReviewModal({
    title:"Review Before Submitting",
    subtitle: document.getElementById("t_destination").value + " — " + document.getElementById("t_date").value,
    mode:"submit",
    sections:[{ rows:[
      ["Requesting Department", document.getElementById("t_dept").value],
      ["Destination", document.getElementById("t_destination").value],
      ["Purpose", document.getElementById("t_purpose").value],
      ["Trip Date", document.getElementById("t_date").value],
      ["Expected Duration (hours)", document.getElementById("t_duration").value],
      ["Vehicle", vSel.options[vSel.selectedIndex]?.text||""],
      ["Driver", dSel.options[dSel.selectedIndex]?.text||""],
    ]}],
    onConfirm: proceedWithTripSubmit
  });
}
window.submitTrip = submitTrip;

async function proceedWithTripSubmit(){
  const status = document.getElementById("formStatus");
  status.className="status"; status.textContent="Saving…";
  try{
    const payload = {
      requesting_department: document.getElementById("t_dept").value.trim(),
      destination: document.getElementById("t_destination").value.trim(),
      purpose: document.getElementById("t_purpose").value.trim(),
      trip_date: document.getElementById("t_date").value,
      expected_duration_hours: Number(document.getElementById("t_duration").value),
      vehicle_id: Number(document.getElementById("t_vehicle").value),
      driver_id: Number(document.getElementById("t_driver").value),
      status:"submitted", cycle:1, requested_by:ME.id
    };
    const file = document.getElementById("t_file").files[0];
    if(file){
      const path = "trip-requests/"+Date.now()+"_"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
      const { error:upErr } = await sb.storage.from("logistics-attachments").upload(path,file);
      if(upErr){ status.className="status warn"; status.textContent="⚠️ Attachment failed, continuing: "+upErr.message; }
      else{ const { data } = sb.storage.from("logistics-attachments").getPublicUrl(path); payload.supporting_document = data.publicUrl; }
    }
    const { data:inserted, error } = await sb.from("logistics_trips").insert(payload).select("id").single();
    if(error) throw error;
    await sb.from("logistics_activity_log").insert({
      entity_type:"trip", entity_id:inserted.id, action:"submitted",
      actor_profile_id:ME.id, actor_username:ME.username,
      description:ME.username+" submitted a trip request to "+payload.destination
    });
    if(status.className!=="status warn"){ status.className="status ok"; status.textContent="✅ Trip request submitted."; }
    await loadAll();
    setTimeout(()=>{ document.getElementById("formPanel").classList.remove("open"); }, 900);
  }catch(e){
    status.className="status err"; status.textContent="❌ "+e.message;
  }
}

/* ── PDF export ── */
function downloadPdf(){
  if(!CURRENT_ROWS.length){ alert("Nothing to export — no rows match the current filters."); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation:"landscape",unit:"pt",format:"a4"});
  const navy=[31,56,100];
  doc.setFillColor(navy[0],navy[1],navy[2]);
  doc.rect(0,0,doc.internal.pageSize.getWidth(),56,"F");
  doc.setTextColor(255,255,255);
  doc.setFont("helvetica","bold"); doc.setFontSize(13);
  doc.text("RUMBU INDUSTRIES GROUP",30,24);
  doc.setFont("helvetica","normal"); doc.setFontSize(10);
  doc.text("Logistics — Trip Request Report",30,40);
  doc.text("Printed "+new Date().toLocaleString("en-GB"),doc.internal.pageSize.getWidth()-30,24,{align:"right"});
  doc.setTextColor(60,60,60); doc.setFontSize(9);
  doc.text("Showing "+CURRENT_ROWS.length+" record(s)",30,72);
  const body = CURRENT_ROWS.map(t=>{
    const veh = t.logistics_vehicles ? t.logistics_vehicles.registration_number : "—";
    const drv = (t.logistics_drivers&&t.logistics_drivers.employees) ? t.logistics_drivers.employees.full_name : "—";
    return [t.trip_date||"—",t.requesting_department||"—",t.destination||"—",t.purpose||"—",
      t.expected_duration_hours!=null?t.expected_duration_hours+"h":"—",veh,drv,LABEL[t.status]||t.status||"—"];
  });
  doc.autoTable({
    startY:84,
    head:[["Date","Department","Destination","Purpose","Duration","Vehicle","Driver","Status"]],
    body, styles:{fontSize:7.5,cellPadding:4},
    headStyles:{fillColor:navy,textColor:255,fontStyle:"bold"},
    alternateRowStyles:{fillColor:[240,244,249]},
    margin:{left:30,right:30},
    didDrawPage:function(){
      doc.setFontSize(8); doc.setTextColor(120,120,120);
      doc.text("CONFIDENTIAL",30,doc.internal.pageSize.getHeight()-16);
      doc.text("Page "+doc.internal.getCurrentPageInfo().pageNumber+" of "+doc.internal.getNumberOfPages(),
        doc.internal.pageSize.getWidth()-30,doc.internal.pageSize.getHeight()-16,{align:"right"});
    }
  });
  doc.save("Logistics_Trip_Requests_"+new Date().toISOString().slice(0,10)+".pdf");
}

init();
</script>
