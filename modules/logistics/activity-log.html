<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Activity Log — PET Collection</title>
<link rel="stylesheet" href="../../styles.css">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("rumbu_theme")||"navy"); }catch(e){} })();
  window.addEventListener("message",function(e){ if(e.data&&e.data.rumbuTheme) document.documentElement.setAttribute("data-theme",e.data.rumbuTheme); });
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../auth.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  body{padding:20px;}
  .wrap{max-width:1200px;margin:0 auto;}
  label{font-size:12px;font-weight:700;display:block;margin:10px 0 4px;color:var(--muted);}
  input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;background:var(--card);color:var(--text);}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .grid5{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:10px;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  th{text-align:left;padding:7px 8px;border-bottom:2px solid var(--line);white-space:nowrap;}
  td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top;}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;white-space:nowrap;}
  .b-approved{background:#dcfce7;color:#166534;}
  .b-rejected{background:#fee2e2;color:#991b1b;}
  .b-filled{background:#dbeafe;color:#1e40af;}
  .b-partial{background:#fef3c7;color:#92400e;}
  .b-other{background:#e5e7eb;color:#374151;}
</style>
</head>
<body>
<div class="wrap">
  <button onclick="(window.parent&&window.parent.closeModule)?window.parent.closeModule():(window.location.href='../../index.html')" style="max-width:200px;margin-bottom:12px;background:var(--accent);color:var(--logo-fg);">&larr; Back</button>
  <div id="connStatus" style="font-size:12px;font-weight:700;text-align:center;margin-bottom:10px;color:var(--muted);">Loading...</div>

  <div class="card-panel">
    <h3 style="color:var(--heading);margin:0 0 4px;">PET Collection — Activity Log</h3>
    <p style="font-size:12px;color:var(--muted);margin:0 0 16px;">Every fill and approval action across all four stages, with the ability to filter and export a PDF of what you're looking at.</p>

    <div class="grid5">
      <div><label>From Date</label><input type="date" id="alFrom" onchange="loadLog()"></div>
      <div><label>To Date</label><input type="date" id="alTo" onchange="loadLog()"></div>
      <div><label>Stage</label>
        <select id="alStage" onchange="loadLog()">
          <option value="">All</option>
          <option value="stage1">Stage 1 — Initiation</option>
          <option value="stage2">Stage 2 — Quality Control</option>
          <option value="stage3p1">Stage 3 Phase 1 — 90% Payment</option>
          <option value="stage4">Stage 4 — Production</option>
          <option value="stage3p2">Stage 3 Phase 2 — 10% Balance Payment</option>
        </select>
      </div>
      <div><label>Action</label>
        <select id="alAction" onchange="loadLog()">
          <option value="">All</option>
          <option value="initiated">Initiated</option>
          <option value="resubmitted">Resubmitted</option>
          <option value="stage2_filled">QC Filled</option>
          <option value="stage3p1_filled">Payment P1 Filled</option>
          <option value="stage4_filled">Production Filled</option>
          <option value="stage3p2_filled">Payment P2 Filled</option>
          <option value="approved_all">Approved (All)</option>
          <option value="approved_all_lot_freed">Approved (LOT Freed)</option>
          <option value="approved_partial">Approved (Awaiting Others)</option>
          <option value="rejected">Rejected</option>
        </select>
      </div>
      <div><label>Actor / Form Number</label><input type="text" id="alSearch" placeholder="Search username or form #" oninput="loadLog()"></div>
    </div>

    <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;">
      <button class="btn-ghost" onclick="clearFilters()">Clear Filters</button>
      <button onclick="downloadPdf()" id="pdfBtn">⬇ Download PDF</button>
    </div>

    <div id="logWrap" style="margin-top:16px;overflow-x:auto;"></div>
    <div id="logStatus" style="margin-top:10px;font-size:12px;color:var(--muted);"></div>
  </div>
</div>

<script>
let ME = null;
let CURRENT_ROWS = [];

const ACTION_LABELS = {
  initiated: "Initiated", resubmitted: "Resubmitted",
  stage2_filled: "QC Filled", stage3p1_filled: "Payment P1 Filled",
  stage4_filled: "Production Filled", stage3p2_filled: "Payment P2 Filled",
  approved_all: "Approved (All)", approved_all_lot_freed: "Approved (LOT Freed)",
  approved_partial: "Approved (Awaiting Others)", rejected: "Rejected"
};
const STAGE_LABELS = {
  stage1: "Stage 1 — Initiation", stage2: "Stage 2 — Quality Control",
  stage3p1: "Stage 3 P1 — 90% Payment", stage4: "Stage 4 — Production",
  stage3p2: "Stage 3 P2 — 10% Balance Payment"
};

function badgeClass(action){
  if(!action) return "b-other";
  if(action.startsWith("approved_partial")) return "b-partial";
  if(action.startsWith("approved")) return "b-approved";
  if(action==="rejected") return "b-rejected";
  if(action.endsWith("_filled")||action==="initiated"||action==="resubmitted") return "b-filled";
  return "b-other";
}

async function init(){
  const cs = document.getElementById("connStatus");
  try{
    ME = await requireAuth("../../login.html");
    if(!ME) return;
    await loadLog();
    cs.style.color="var(--ok)"; cs.textContent="Connected.";
  }catch(e){
    cs.style.color="var(--bad)"; cs.textContent="Error: "+e.message;
  }
}

function clearFilters(){
  ["alFrom","alTo","alStage","alAction","alSearch"].forEach(id=>document.getElementById(id).value="");
  loadLog();
}

async function loadLog(){
  const from = document.getElementById("alFrom").value;
  const to = document.getElementById("alTo").value;
  const stage = document.getElementById("alStage").value;
  const action = document.getElementById("alAction").value;
  const search = document.getElementById("alSearch").value.trim().toLowerCase();
  const wrap = document.getElementById("logWrap");
  const status = document.getElementById("logStatus");

  let query = sb.from("pet_activity_log")
    .select("id,collection_id,action,stage,actor_username,old_status,new_status,note,created_at,pet_collections(form_number,agent_name,section)")
    .order("created_at",{ascending:false})
    .limit(1000);
  if(from) query = query.gte("created_at", from+"T00:00:00");
  if(to)   query = query.lte("created_at", to+"T23:59:59");
  if(stage) query = query.eq("stage", stage);
  if(action) query = query.eq("action", action);

  const { data, error } = await query;
  if(error){ wrap.innerHTML = `<p style="color:var(--bad);">Error: ${error.message}</p>`; return; }

  let rows = data||[];
  if(search){
    rows = rows.filter(r=>{
      const c = r.pet_collections||{};
      return (r.actor_username||"").toLowerCase().includes(search) ||
             (c.form_number||"").toLowerCase().includes(search);
    });
  }
  CURRENT_ROWS = rows;
  status.textContent = rows.length + " entr" + (rows.length===1?"y":"ies") + " match these filters" + (rows.length>=1000?" (showing most recent 1000)":"") + ".";

  if(!rows.length){ wrap.innerHTML = `<p style="font-size:13px;color:var(--muted);">No activity matches these filters.</p>`; return; }

  wrap.innerHTML = `<table>
    <thead><tr>
      <th>Date/Time</th><th>Form #</th><th>Agent</th><th>Section</th><th>Stage</th>
      <th>Action</th><th>Actor</th><th>Status Change</th><th>Note</th>
    </tr></thead>
    <tbody>${rows.map(r=>{
      const c = r.pet_collections||{};
      return `<tr>
        <td>${new Date(r.created_at).toLocaleString("en-GB")}</td>
        <td><b>${c.form_number||"—"}</b></td>
        <td>${c.agent_name||"—"}</td>
        <td>${c.section||"—"}</td>
        <td>${STAGE_LABELS[r.stage]||r.stage||"—"}</td>
        <td><span class="badge ${badgeClass(r.action)}">${ACTION_LABELS[r.action]||r.action}</span></td>
        <td>${r.actor_username||"—"}</td>
        <td style="font-size:11px;color:var(--muted);">${r.old_status||"—"} → ${r.new_status||"—"}</td>
        <td>${r.note||"—"}</td>
      </tr>`;
    }).join("")}</tbody>
  </table>`;
}

function downloadPdf(){
  if(!CURRENT_ROWS.length){ alert("Nothing to export — no rows match the current filters."); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: "landscape", unit: "pt", format: "a4" });
  const navy = [31, 56, 100]; // #1F3864 — Rumbu house style heading colour

  // Header
  doc.setFillColor(navy[0], navy[1], navy[2]);
  doc.rect(0, 0, doc.internal.pageSize.getWidth(), 56, "F");
  doc.setTextColor(255,255,255);
  doc.setFont("helvetica","bold"); doc.setFontSize(13);
  doc.text("RUMBU INDUSTRIES GROUP", 30, 24);
  doc.setFont("helvetica","normal"); doc.setFontSize(10);
  doc.text("PET Collection — Activity Log", 30, 40);
  const printedAt = "Printed " + new Date().toLocaleString("en-GB");
  doc.text(printedAt, doc.internal.pageSize.getWidth()-30, 24, { align: "right" });

  // Filter summary line
  doc.setTextColor(60,60,60); doc.setFontSize(9);
  const from = document.getElementById("alFrom").value || "—";
  const to = document.getElementById("alTo").value || "—";
  const stage = document.getElementById("alStage").value ? (STAGE_LABELS[document.getElementById("alStage").value]||"") : "All";
  const action = document.getElementById("alAction").value ? (ACTION_LABELS[document.getElementById("alAction").value]||"") : "All";
  const search = document.getElementById("alSearch").value || "—";
  doc.text(`Date range: ${from} to ${to}   |   Stage: ${stage}   |   Action: ${action}   |   Search: ${search}   |   ${CURRENT_ROWS.length} entries`, 30, 72);

  const body = CURRENT_ROWS.map(r=>{
    const c = r.pet_collections||{};
    return [
      new Date(r.created_at).toLocaleString("en-GB"),
      c.form_number||"—", c.agent_name||"—", c.section||"—",
      STAGE_LABELS[r.stage]||r.stage||"—",
      ACTION_LABELS[r.action]||r.action||"—",
      r.actor_username||"—",
      (r.old_status||"—")+" → "+(r.new_status||"—"),
      r.note||"—"
    ];
  });

  doc.autoTable({
    startY: 84,
    head: [["Date/Time","Form #","Agent","Section","Stage","Action","Actor","Status Change","Note"]],
    body,
    styles: { fontSize: 7.5, cellPadding: 4 },
    headStyles: { fillColor: navy, textColor: 255, fontStyle: "bold" },
    alternateRowStyles: { fillColor: [240, 244, 249] },
    margin: { left: 30, right: 30 },
    didDrawPage: function(data){
      const pageCount = doc.internal.getNumberOfPages();
      doc.setFontSize(8); doc.setTextColor(120,120,120);
      doc.text("CONFIDENTIAL", 30, doc.internal.pageSize.getHeight()-16);
      doc.text("Page " + doc.internal.getCurrentPageInfo().pageNumber + " of " + pageCount,
        doc.internal.pageSize.getWidth()-30, doc.internal.pageSize.getHeight()-16, { align: "right" });
    }
  });

  doc.save("PET_Activity_Log_" + new Date().toISOString().slice(0,10) + ".pdf");
}

init();
</script>
</body>
</html>
