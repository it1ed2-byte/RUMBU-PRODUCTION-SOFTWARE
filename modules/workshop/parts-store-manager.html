<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Parts Store Manager</title>
<link rel="stylesheet" href="../../styles.css">
<script>
  (function(){
    function apply(t){ if(t) document.documentElement.setAttribute("data-theme", t); }
    window.addEventListener("message", function(e){ if(e.data && e.data.rumbuTheme) apply(e.data.rumbuTheme); });
    try{ apply(localStorage.getItem("rumbu_theme")); }catch(e){}
  })();
</script>
<style>
  *{ box-sizing: border-box; }
  body{ font-family: var(--sans); background: var(--bg); margin: 0; padding: 16px; }

  .card{ background: var(--card); width: 100%; max-width: 1100px; margin: 0 auto 16px; padding: 20px; border-radius: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.12); }

  h2{ text-align: center; color: var(--heading); border-bottom: 2px solid var(--heading); padding-bottom: 10px; margin: 0 0 16px; font-size: 18px; }
  h3{ color: var(--heading); font-size: 15px; margin: 0 0 14px; }

  #status{ font-size: 11px; text-align: center; color: #666; margin-bottom: 8px; }

  /* ── Form grid ── */
  .form-grid{ display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; }
  .form-group{ display: flex; flex-direction: column; }
  .form-group.full{ grid-column: 1 / -1; }
  label{ font-size: 12px; font-weight: 600; color: #555; margin-bottom: 4px; }
  input, select{
    width: 100%; padding: 9px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--card);
    color: var(--text); font-size: 13px; outline: none;
    transition: border-color .2s;
  }
  input:focus, select:focus{ border-color: var(--accent); }
  .hidden{ display: none !important; }

  /* ── Buttons ── */
  .btn-row{ display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  button{
    padding: 10px 18px; border: none; border-radius: 8px;
    background: var(--heading); color: #fff; font-weight: 600;
    font-size: 13px; cursor: pointer; transition: opacity .2s;
  }
  button:hover{ opacity: .85; }
  button.accent{ background: var(--accent); }
  button.danger{ background: #c0392b; }
  button.ghost{ background: transparent; color: var(--heading); border: 1px solid var(--line); }
  button:disabled{ opacity: .5; cursor: not-allowed; }
  .btn-sm{ padding: 6px 12px; font-size: 12px; }

  .msg{ margin-top: 10px; font-size: 13px; font-weight: 600; min-height: 18px; }
  .msg.ok{ color: #1e7a34; }
  .msg.err{ color: #c0392b; }

  /* ── Table toolbar ── */
  .table-toolbar{
    display: flex; align-items: center; gap: 10px;
    flex-wrap: wrap; margin-bottom: 12px;
  }
  .table-toolbar input[type="text"]{
    flex: 1; min-width: 180px;
  }
  .table-toolbar select{ width: auto; }
  .table-toolbar .count-label{ font-size: 12px; color: #666; white-space: nowrap; }

  /* ── Table ── */
  .table-wrap{ overflow-x: auto; }
  table{ border-collapse: collapse; width: 100%; font-size: 12px; }
  th{ background: var(--heading); color: #fff; padding: 9px 8px; text-align: left; white-space: nowrap; }
  td{ border-bottom: 1px solid var(--line); padding: 8px; vertical-align: middle; }
  tr:hover td{ background: var(--bg); }
  .actions-cell{ white-space: nowrap; }

  /* ── Pagination ── */
  .pagination{
    display: flex; align-items: center; justify-content: center;
    gap: 6px; margin-top: 14px; flex-wrap: wrap;
  }
  .pagination button{
    padding: 6px 12px; font-size: 12px; background: var(--bg);
    color: var(--heading); border: 1px solid var(--line);
    border-radius: 6px; font-weight: 600;
  }
  .pagination button.active{ background: var(--heading); color: #fff; border-color: var(--heading); }
  .pagination button:disabled{ opacity: .4; cursor: default; }
  .page-info{ font-size: 12px; color: #666; }

  @media(max-width:600px){
    .form-grid{ grid-template-columns: 1fr; }
    .form-group.full{ grid-column: 1; }
    .btn-row{ flex-direction: column; }
    button{ width: 100%; }
    .table-toolbar{ flex-direction: column; align-items: stretch; }
    .table-toolbar select{ width: 100%; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../auth.js"></script>
</head>
<body>

<!-- Add / Edit Form -->
<div class="card hidden" id="formCard">
  <h2 id="formTitle">➕ Add New Part</h2>
  <div class="form-grid">
    <div class="form-group">
      <label>Part Name</label>
      <input type="text" id="part_name" placeholder="Enter part name">
    </div>
    <div class="form-group">
      <label>Part Number</label>
      <input type="text" id="part_number" placeholder="Enter part number">
    </div>
    <div class="form-group">
      <label>Department</label>
      <select id="department" onchange="toggleOther('department')"></select>
      <input type="text" id="department_other" class="hidden" placeholder="Enter department" style="margin-top:6px;">
    </div>
    <div class="form-group">
      <label>Unit</label>
      <select id="unit" onchange="toggleOther('unit')"></select>
      <input type="text" id="unit_other" class="hidden" placeholder="Enter unit" style="margin-top:6px;">
    </div>
  </div>
  <div class="btn-row">
    <button id="addBtn" class="accent" onclick="submitAdd()">Add Part</button>
    <button id="updateBtn" class="hidden accent" onclick="submitUpdate()">Update Part</button>
    <button id="cancelBtn" class="hidden ghost" onclick="resetForm()">Cancel</button>
  </div>
  <div class="msg" id="msg"></div>
</div>

<!-- Parts List -->
<div class="card">
  <h2>📦 Parts List</h2>
  <div id="status">Connecting...</div>

  <div class="table-toolbar">
    <input type="text" id="searchBox" placeholder="🔍 Search by name, number, department or unit..." oninput="onSearch()">
    <select id="rowsPerPage" onchange="onRowsChange()">
      <option value="10">10 rows</option>
      <option value="25" selected>25 rows</option>
      <option value="50">50 rows</option>
      <option value="100">100 rows</option>
      <option value="all">All rows</option>
    </select>
    <button class="ghost btn-sm" onclick="loadParts()">⟳ Refresh</button>
    <span class="count-label" id="countLabel"></span>
  </div>

  <div class="table-wrap">
    <div id="tableArea">Loading...</div>
  </div>
  <div class="pagination" id="paginationArea"></div>
</div>

<script>
function authHeaders(){ return { "apikey": SUPABASE_ANON_KEY, "Authorization": "Bearer " + SUPABASE_ANON_KEY, "Content-Type": "application/json" }; }

var DEPARTMENTS = ['FEEDING','DELIVERY','QUALITY CONTROL','TRANSMISSION','DESIGN CARD','TWINE','RECYCLING','ELECTRICAL','WORKSHOP','EXTRUDER MECHANICS','OILING','POWER HOUSE','PET MECHANICS','Other'];
var UNITS = DEPARTMENTS;

var canEdit = false;
var ALL_ROWS = [];
var FILTERED_ROWS = [];
var currentPage = 1;

function getRowsPerPage(){
  const v = document.getElementById("rowsPerPage").value;
  return v === "all" ? Infinity : Number(v);
}

async function fetchAllRows(table, query){
  let all = [], offset = 0; const pageSize = 1000;
  const q = query || "";
  for(let guard=0; guard<500; guard++){
    const headers = Object.assign({}, authHeaders(), { "Range-Unit":"items", "Range": offset + "-" + (offset+pageSize-1) });
    const res = await fetch(SUPABASE_URL + "/rest/v1/" + table + "?select=*" + q, { headers });
    if(!res.ok) throw new Error(table + ": HTTP " + res.status);
    const batch = await res.json();
    all = all.concat(batch);
    if(batch.length < pageSize) break;
    offset += pageSize;
  }
  return all;
}

async function init(){
  const status = document.getElementById("status");
  try{
    const me = await requireAuth("../../login.html");
    if(!me) return;
    canEdit = true;
    document.getElementById("formCard").classList.remove("hidden");
    fillDropdown('department', DEPARTMENTS);
    fillDropdown('unit', UNITS);
    status.classList.add("hidden");
    await loadParts();
  }catch(e){
    status.style.color = "#c0392b";
    status.textContent = "Could not load: " + (e.message||e);
  }
}

function fillDropdown(id, items){
  const sel = document.getElementById(id);
  sel.innerHTML = "";
  items.forEach(i=>{ const o = document.createElement("option"); o.value=i; o.text=i; sel.add(o); });
}

function toggleOther(field){
  const sel = document.getElementById(field);
  const other = document.getElementById(field + "_other");
  if(sel.value === "Other") other.classList.remove("hidden"); else other.classList.add("hidden");
}
function getFieldValue(field){
  const sel = document.getElementById(field);
  if(sel.value === "Other") return document.getElementById(field + "_other").value.trim();
  return sel.value;
}
function gatherData(){
  return {
    part_name: document.getElementById("part_name").value.trim(),
    part_number: document.getElementById("part_number").value.trim(),
    department: getFieldValue("department"),
    unit: getFieldValue("unit")
  };
}

async function submitAdd(){
  const d = gatherData();
  if(!d.part_name || !d.part_number){ setMsg("Part name and number required.", "err"); return; }
  setMsg("Saving...", "");
  try{
    const row = { part_name: d.part_name, part_number: d.part_number, department: d.department, unit: d.unit, recorded_at: new Date().toISOString() };
    const res = await fetch(SUPABASE_URL + "/rest/v1/store", { method:"post", headers: authHeaders(), body: JSON.stringify(row) });
    if(!res.ok) throw new Error("HTTP " + res.status + " - " + await res.text());
    setMsg("✅ Part added.", "ok"); resetForm(); await loadParts();
  }catch(e){ setMsg("❌ Error: " + (e.message||e), "err"); }
}

async function submitUpdate(){
  const d = gatherData();
  if(!d.part_number){ setMsg("Part number required.", "err"); return; }
  setMsg("Updating...", "");
  try{
    const url = SUPABASE_URL + "/rest/v1/store?part_number=eq." + encodeURIComponent(d.part_number);
    const res = await fetch(url, { method:"patch", headers: authHeaders(), body: JSON.stringify({ part_name: d.part_name, department: d.department, unit: d.unit }) });
    if(!res.ok) throw new Error("HTTP " + res.status + " - " + await res.text());
    setMsg("✅ Part updated.", "ok"); resetForm(); await loadParts();
  }catch(e){ setMsg("❌ Error: " + (e.message||e), "err"); }
}

function editRow(name, number, dept, unit){
  document.getElementById("formTitle").innerText = "✏️ Update Part";
  document.getElementById("part_name").value = name;
  document.getElementById("part_number").value = number;
  setSelect("department", dept);
  setSelect("unit", unit);
  document.getElementById("addBtn").classList.add("hidden");
  document.getElementById("updateBtn").classList.remove("hidden");
  document.getElementById("cancelBtn").classList.remove("hidden");
  window.scrollTo(0,0);
}

function setSelect(field, value){
  const sel = document.getElementById(field);
  let found = false;
  for(let i=0;i<sel.options.length;i++){ if(sel.options[i].value===value){ sel.selectedIndex=i; found=true; break; } }
  if(!found){
    sel.value = "Other";
    const other = document.getElementById(field + "_other");
    other.classList.remove("hidden"); other.value = value;
  } else { toggleOther(field); }
}

async function deleteRow(number){
  if(!confirm("Delete part " + number + "?")) return;
  try{
    const url = SUPABASE_URL + "/rest/v1/store?part_number=eq." + encodeURIComponent(number);
    const res = await fetch(url, { method:"delete", headers: authHeaders() });
    if(!res.ok) throw new Error("HTTP " + res.status + " - " + await res.text());
    setMsg("✅ Part deleted.", "ok"); await loadParts();
  }catch(e){ setMsg("❌ Error: " + (e.message||e), "err"); }
}

function resetForm(){
  document.getElementById("formTitle").innerText = "➕ Add New Part";
  document.getElementById("part_name").value = "";
  document.getElementById("part_number").value = "";
  document.getElementById("department").selectedIndex = 0;
  document.getElementById("unit").selectedIndex = 0;
  document.getElementById("department_other").classList.add("hidden");
  document.getElementById("unit_other").classList.add("hidden");
  document.getElementById("department_other").value = "";
  document.getElementById("unit_other").value = "";
  document.getElementById("addBtn").classList.remove("hidden");
  document.getElementById("updateBtn").classList.add("hidden");
  document.getElementById("cancelBtn").classList.add("hidden");
  setMsg("", "");
}

async function loadParts(){
  document.getElementById("tableArea").innerHTML = "Loading...";
  document.getElementById("paginationArea").innerHTML = "";
  try{
    ALL_ROWS = await fetchAllRows("store", "&order=recorded_at.desc");
    currentPage = 1;
    applyFilter();
  }catch(e){
    document.getElementById("tableArea").innerHTML = "❌ Could not load: " + (e.message||e);
  }
}

function onSearch(){ currentPage = 1; applyFilter(); }
function onRowsChange(){ currentPage = 1; applyFilter(); }

function applyFilter(){
  const q = document.getElementById("searchBox").value.trim().toLowerCase();
  FILTERED_ROWS = q
    ? ALL_ROWS.filter(r =>
        (r.part_name||"").toLowerCase().includes(q) ||
        (r.part_number||"").toLowerCase().includes(q) ||
        (r.department||"").toLowerCase().includes(q) ||
        (r.unit||"").toLowerCase().includes(q)
      )
    : ALL_ROWS.slice();
  renderTable();
}

function renderTable(){
  const total = FILTERED_ROWS.length;
  const rpp = getRowsPerPage();
  const totalPages = rpp === Infinity ? 1 : Math.max(1, Math.ceil(total / rpp));
  if(currentPage > totalPages) currentPage = totalPages;

  const start = rpp === Infinity ? 0 : (currentPage - 1) * rpp;
  const end   = rpp === Infinity ? total : Math.min(start + rpp, total);
  const pageRows = FILTERED_ROWS.slice(start, end);

  document.getElementById("countLabel").textContent =
    total + " part" + (total !== 1 ? "s" : "") + (FILTERED_ROWS.length !== ALL_ROWS.length ? " (filtered from " + ALL_ROWS.length + ")" : "");

  if(!pageRows.length){
    document.getElementById("tableArea").innerHTML = "<p style='color:#666;font-size:13px;'>No parts found.</p>";
    document.getElementById("paginationArea").innerHTML = "";
    return;
  }

  let html = "<table><thead><tr><th>#</th><th>Part Name</th><th>Part Number</th><th>Department</th><th>Unit</th><th>Recorded At</th>";
  if(canEdit) html += "<th>Actions</th>";
  html += "</tr></thead><tbody>";
  pageRows.forEach((r, i)=>{
    const rowNum = start + i + 1;
    const recDate = r.recorded_at ? r.recorded_at.slice(0,10) : "—";
    html += `<tr>
      <td>${rowNum}</td>
      <td>${esc(r.part_name)}</td>
      <td>${esc(r.part_number)}</td>
      <td>${esc(r.department)}</td>
      <td>${esc(r.unit)}</td>
      <td>${esc(recDate)}</td>`;
    if(canEdit){
      html += `<td class="actions-cell">
        <button class="btn-sm accent" onclick="editRow('${js(r.part_name)}','${js(r.part_number)}','${js(r.department)}','${js(r.unit)}')">Edit</button>
        <button class="btn-sm danger" onclick="deleteRow('${js(r.part_number)}')">Delete</button>
      </td>`;
    }
    html += "</tr>";
  });
  html += "</tbody></table>";
  document.getElementById("tableArea").innerHTML = html;

  // Pagination controls
  if(totalPages <= 1){ document.getElementById("paginationArea").innerHTML = ""; return; }
  let pag = "";
  pag += `<button onclick="goPage(${currentPage-1})" ${currentPage===1?"disabled":""}>‹ Prev</button>`;

  const delta = 2;
  let pages = new Set([1, totalPages]);
  for(let p = Math.max(1, currentPage - delta); p <= Math.min(totalPages, currentPage + delta); p++) pages.add(p);
  let sorted = Array.from(pages).sort((a,b)=>a-b), prev = 0;
  sorted.forEach(p=>{
    if(prev && p - prev > 1) pag += `<span class="page-info">…</span>`;
    pag += `<button class="${p===currentPage?"active":""}" onclick="goPage(${p})">${p}</button>`;
    prev = p;
  });

  pag += `<button onclick="goPage(${currentPage+1})" ${currentPage===totalPages?"disabled":""}>Next ›</button>`;
  pag += `<span class="page-info">Page ${currentPage} of ${totalPages} · Showing ${start+1}–${end} of ${total}</span>`;
  document.getElementById("paginationArea").innerHTML = pag;
}

function goPage(p){
  const rpp = getRowsPerPage();
  const totalPages = rpp === Infinity ? 1 : Math.max(1, Math.ceil(FILTERED_ROWS.length / rpp));
  if(p < 1 || p > totalPages) return;
  currentPage = p;
  renderTable();
  document.getElementById("tableArea").scrollIntoView({ behavior:"smooth", block:"start" });
}

function esc(s){ return (s||"").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function js(s){ return (s||"").toString().replace(/\\/g,"\\\\").replace(/'/g,"\\'"); }
function setMsg(m, type){
  const el = document.getElementById("msg");
  el.innerText = m;
  el.className = "msg" + (type ? " " + type : "");
}

init();
</script>
</body>
</html>
