<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PM Schedule Dashboard</title>
<link rel="stylesheet" href="../../styles.css">
<script>
  (function(){
    function apply(t){ if(t) document.documentElement.setAttribute("data-theme", t); }
    window.addEventListener("message", function(e){ if(e.data && e.data.rumbuTheme) apply(e.data.rumbuTheme); });
    try{ apply(localStorage.getItem("rumbu_theme")); }catch(e){}
  })();
</script>
<style>
  *{ box-sizing: border-box; }
  body{ font-family: var(--sans); background: var(--bg); margin: 0; padding: 16px; }

  .card{
    background: var(--card); width: 100%; max-width: 1200px;
    margin: 0 auto 16px; padding: 20px; border-radius: 12px;
    box-shadow: 0 4px 12px rgba(0,0,0,.12);
  }

  h2{
    text-align: center; color: var(--heading);
    border-bottom: 2px solid var(--heading);
    padding-bottom: 10px; margin: 0 0 16px; font-size: 18px;
  }

  #status{ font-size: 11px; text-align: center; color: #666; margin-bottom: 12px; }

  /* ── Filter grid ── */
  .filter-grid{
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px 16px;
    margin-bottom: 14px;
  }
  .filter-group{ display: flex; flex-direction: column; }
  label{ font-size: 12px; font-weight: 600; color: #555; margin-bottom: 4px; }
  input, select{
    width: 100%; padding: 9px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--card);
    color: var(--text); font-size: 13px; outline: none;
    transition: border-color .2s;
  }
  input:focus, select:focus{ border-color: var(--accent); }

  /* ── Buttons ── */
  .btn-row{ display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  button{
    padding: 10px 20px; border: none; border-radius: 8px;
    background: var(--heading); color: #fff; font-weight: 600;
    font-size: 13px; cursor: pointer; transition: opacity .2s;
  }
  button:hover{ opacity: .85; }
  button.ghost{
    background: transparent; color: var(--heading);
    border: 1px solid var(--line);
  }

  /* ── Summary chips ── */
  .summary-row{
    display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px;
  }
  .chip{
    padding: 6px 14px; border-radius: 20px; font-size: 12px;
    font-weight: 600; white-space: nowrap;
  }
  .chip.total{ background: #e8f0fb; color: #1F3864; }
  .chip.urgent{ background: #fdecea; color: #c0392b; }
  .chip.ok{ background: #e8f8ee; color: #1e7a34; }

  /* ── Table ── */
  .table-wrap{ overflow-x: auto; }
  table{ border-collapse: collapse; width: 100%; font-size: 12px; min-width: 900px; }
  thead{ position: sticky; top: 0; z-index: 1; }
  th{
    background: var(--heading); color: #fff;
    padding: 10px 8px; text-align: center; white-space: nowrap;
  }
  td{
    padding: 9px 8px; text-align: center;
    border-bottom: 1px solid var(--line); vertical-align: middle;
  }
  tr.urgent-row td{ background: #fff5f5; }
  tr.ok-row td{ background: #f5fdf7; }
  tr.urgent-row td.days-cell{ color: #c0392b; font-weight: 700; }
  tr.ok-row td.days-cell{ color: #1e7a34; font-weight: 700; }
  tr:hover td{ filter: brightness(.97); }

  /* ── Treated button ── */
  .treat-btn{
    background: #1e7a34; color: #fff; border: none;
    padding: 6px 12px; border-radius: 6px; cursor: pointer;
    font-size: 12px; font-weight: 600; transition: opacity .2s;
  }
  .treat-btn:hover{ opacity: .82; }

  /* ── Pagination ── */
  .table-toolbar{
    display: flex; align-items: center; gap: 10px;
    flex-wrap: wrap; margin-bottom: 12px;
  }
  .table-toolbar input[type="text"]{ flex: 1; min-width: 180px; }
  .table-toolbar select{ width: auto; }
  .count-label{ font-size: 12px; color: #666; white-space: nowrap; }

  .pagination{
    display: flex; align-items: center; justify-content: center;
    gap: 6px; margin-top: 14px; flex-wrap: wrap;
  }
  .pagination button{
    padding: 6px 12px; font-size: 12px; background: var(--bg);
    color: var(--heading); border: 1px solid var(--line);
    border-radius: 6px; font-weight: 600;
  }
  .pagination button.active{ background: var(--heading); color: #fff; border-color: var(--heading); }
  .pagination button:disabled{ opacity: .4; cursor: default; }
  .page-info{ font-size: 12px; color: #666; }

  @media(max-width: 700px){
    .filter-grid{ grid-template-columns: 1fr 1fr; }
    .btn-row button{ flex: 1; }
    .summary-row{ gap: 6px; }
  }
  @media(max-width: 420px){
    .filter-grid{ grid-template-columns: 1fr; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../auth.js"></script>
</head>
<body>

<div class="card">
  <h2>🔧 PM Schedule Dashboard</h2>
  <div id="status">Connecting...</div>

  <!-- Filters -->
  <div class="filter-grid">
    <div class="filter-group">
      <label>Department</label>
      <input list="deptList" id="dept" placeholder="All departments">
      <datalist id="deptList"></datalist>
    </div>
    <div class="filter-group">
      <label>Unit</label>
      <input list="unitList" id="unit" placeholder="All units">
      <datalist id="unitList"></datalist>
    </div>
    <div class="filter-group">
      <label>Part Number</label>
      <input list="partList" id="part_number" placeholder="All parts">
      <datalist id="partList"></datalist>
    </div>
    <div class="filter-group">
      <label>Rating ≤</label>
      <input type="number" id="rating" value="100" placeholder="100">
    </div>
  </div>

  <div class="btn-row">
    <button onclick="applyFilter()">🔍 Filter Data</button>
    <button class="ghost" onclick="clearFilters()">✕ Clear</button>
  </div>
</div>

<div class="card">
  <!-- Summary chips -->
  <div class="summary-row" id="summaryRow" style="display:none;"></div>

  <!-- Table toolbar -->
  <div class="table-toolbar">
    <input type="text" id="searchBox" placeholder="🔍 Search within results..." oninput="onSearch()">
    <select id="rowsPerPage" onchange="onRowsChange()">
      <option value="10">10 rows</option>
      <option value="25" selected>25 rows</option>
      <option value="50">50 rows</option>
      <option value="100">100 rows</option>
      <option value="all">All rows</option>
    </select>
    <span class="count-label" id="countLabel"></span>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Part No</th>
          <th>Part Name</th>
          <th>Asset</th>
          <th>Qty</th>
          <th>Department</th>
          <th>Unit</th>
          <th>Entry Date</th>
          <th>PM Date</th>
          <th>Days Left</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div class="pagination" id="paginationArea"></div>
</div>

<script>
function authHeaders(){
  return { "apikey": SUPABASE_ANON_KEY, "Authorization": "Bearer " + SUPABASE_ANON_KEY, "Content-Type": "application/json" };
}

let CHECKLIST_ROWS = [], TREATED_IDS = new Set(), ME = null;
let DISPLAY_ROWS = [], FILTERED_ROWS = [];
let currentPage = 1;

function getRowsPerPage(){
  const v = document.getElementById("rowsPerPage").value;
  return v === "all" ? Infinity : Number(v);
}

async function fetchAllRows(table, query){
  let all = [], offset = 0; const pageSize = 1000;
  const q = query || "";
  for(let guard=0; guard<500; guard++){
    const headers = Object.assign({}, authHeaders(), { "Range-Unit":"items", "Range": offset+"-"+(offset+pageSize-1) });
    const res = await fetch(SUPABASE_URL + "/rest/v1/" + table + "?select=*" + q, { headers });
    if(!res.ok) throw new Error(table + ": HTTP " + res.status);
    const batch = await res.json();
    all = all.concat(batch);
    if(batch.length < pageSize) break;
    offset += pageSize;
  }
  return all;
}

async function init(){
  const status = document.getElementById("status");
  try{
    ME = await requireAuth("../../login.html");
    if(!ME) return;

    const [checklistRows, treatedRes] = await Promise.all([
      fetchAllRows("checklist", ""),
      fetch(SUPABASE_URL + "/rest/v1/treated_items?select=item_id", { headers: authHeaders() })
    ]);
    CHECKLIST_ROWS = checklistRows;
    if(treatedRes.ok){
      const t = await treatedRes.json();
      TREATED_IDS = new Set(t.map(r => r.item_id));
    }
    status.style.color = "#1d8a4e";
    status.textContent = "Connected — " + CHECKLIST_ROWS.length + " checklist items, " + TREATED_IDS.size + " treated.";
    loadDropdowns();
    applyFilter();
  }catch(e){
    status.style.color = "#c0392b";
    status.textContent = "Could not load: " + (e.message||e);
  }
}

function fill(id, arr){
  const dl = document.getElementById(id);
  dl.innerHTML = "";
  arr.forEach(v=>{ const o = document.createElement("option"); o.value = v; dl.appendChild(o); });
}

function loadDropdowns(){
  const depts = [...new Set(CHECKLIST_ROWS.map(r=>r.department).filter(Boolean))].sort();
  const units = [...new Set(CHECKLIST_ROWS.map(r=>r.unit).filter(Boolean))].sort();
  const parts = [...new Set(CHECKLIST_ROWS.map(r=>r.part_number).filter(Boolean))].sort();
  fill("deptList", depts); fill("unitList", units); fill("partList", parts);
}

function clearFilters(){
  document.getElementById("dept").value = "";
  document.getElementById("unit").value = "";
  document.getElementById("part_number").value = "";
  document.getElementById("rating").value = "100";
  document.getElementById("searchBox").value = "";
  applyFilter();
}

function applyFilter(){
  const dept   = document.getElementById("dept").value.trim();
  const unit   = document.getElementById("unit").value.trim();
  const partNo = document.getElementById("part_number").value.trim();
  const rating = document.getElementById("rating").value;
  const today  = new Date();

  DISPLAY_ROWS = CHECKLIST_ROWS
    .filter(r => {
      if(dept   && r.department  !== dept)   return false;
      if(unit   && r.unit        !== unit)   return false;
      if(partNo && r.part_number !== partNo) return false;
      if(rating && !(Number(r.app_rating) <= Number(rating))) return false;
      if(TREATED_IDS.has(r.item_id)) return false;
      if(!r.pm_schedule_date)        return false;
      return true;
    })
    .map((r, i) => {
      const pmDate = new Date(r.pm_schedule_date);
      const diff   = Math.ceil((pmDate - today) / (1000*60*60*24));
      return { ...r, days_to_pm: diff };
    })
    .sort((a, b) => a.days_to_pm - b.days_to_pm); // urgent first

  // Summary chips
  const urgent = DISPLAY_ROWS.filter(r => r.days_to_pm <= 7).length;
  const ok     = DISPLAY_ROWS.length - urgent;
  const sr = document.getElementById("summaryRow");
  sr.style.display = DISPLAY_ROWS.length ? "flex" : "none";
  sr.innerHTML =
    `<span class="chip total">📋 Total: ${DISPLAY_ROWS.length}</span>` +
    `<span class="chip urgent">🔴 Due ≤ 7 days: ${urgent}</span>` +
    `<span class="chip ok">🟢 On track: ${ok}</span>`;

  currentPage = 1;
  document.getElementById("searchBox").value = "";
  onSearch();
}

function onSearch(){
  const q = document.getElementById("searchBox").value.trim().toLowerCase();
  FILTERED_ROWS = q
    ? DISPLAY_ROWS.filter(r =>
        (r.part_name||"").toLowerCase().includes(q) ||
        (r.part_number||"").toLowerCase().includes(q) ||
        (r.asset||"").toLowerCase().includes(q) ||
        (r.department||"").toLowerCase().includes(q) ||
        (r.unit||"").toLowerCase().includes(q)
      )
    : DISPLAY_ROWS.slice();
  currentPage = 1;
  renderTable();
}

function onRowsChange(){ currentPage = 1; renderTable(); }

function renderTable(){
  const total      = FILTERED_ROWS.length;
  const rpp        = getRowsPerPage();
  const totalPages = rpp === Infinity ? 1 : Math.max(1, Math.ceil(total / rpp));
  if(currentPage > totalPages) currentPage = totalPages;

  const start    = rpp === Infinity ? 0 : (currentPage - 1) * rpp;
  const end      = rpp === Infinity ? total : Math.min(start + rpp, total);
  const pageRows = FILTERED_ROWS.slice(start, end);

  document.getElementById("countLabel").textContent =
    total + " item" + (total !== 1 ? "s" : "") +
    (FILTERED_ROWS.length !== DISPLAY_ROWS.length ? " (filtered from " + DISPLAY_ROWS.length + ")" : "");

  const tbody = document.getElementById("tbody");
  if(!pageRows.length){
    tbody.innerHTML = `<tr><td colspan="11" style="text-align:center;color:#666;padding:20px;">No items found.</td></tr>`;
    document.getElementById("paginationArea").innerHTML = "";
    return;
  }

  tbody.innerHTML = pageRows.map((r, i) => {
    const cls     = r.days_to_pm <= 7 ? "urgent-row" : "ok-row";
    const daysLbl = r.days_to_pm < 0
      ? `<span style="color:#c0392b;">Overdue ${Math.abs(r.days_to_pm)}d</span>`
      : r.days_to_pm + " days";
    return `<tr class="${cls}">
      <td>${start + i + 1}</td>
      <td>${esc(r.part_number)}</td>
      <td style="text-align:left;">${esc(r.part_name)}</td>
      <td>${esc(r.asset)}</td>
      <td>${esc(r.quantity)}</td>
      <td>${esc(r.department)}</td>
      <td>${esc(r.unit)}</td>
      <td>${esc(r.date_col)}</td>
      <td>${esc(r.pm_schedule_date)}</td>
      <td class="days-cell">${daysLbl}</td>
      <td><button class="treat-btn" onclick="markTreated('${js(r.item_id)}')">✓ Treated</button></td>
    </tr>`;
  }).join("");

  // Pagination
  if(totalPages <= 1){ document.getElementById("paginationArea").innerHTML = ""; return; }
  let pag = `<button onclick="goPage(${currentPage-1})" ${currentPage===1?"disabled":""}>‹ Prev</button>`;
  const delta = 2;
  let pages = new Set([1, totalPages]);
  for(let p = Math.max(1, currentPage-delta); p <= Math.min(totalPages, currentPage+delta); p++) pages.add(p);
  let sorted = Array.from(pages).sort((a,b)=>a-b), prev = 0;
  sorted.forEach(p=>{
    if(prev && p - prev > 1) pag += `<span class="page-info">…</span>`;
    pag += `<button class="${p===currentPage?"active":""}" onclick="goPage(${p})">${p}</button>`;
    prev = p;
  });
  pag += `<button onclick="goPage(${currentPage+1})" ${currentPage===totalPages?"disabled":""}>Next ›</button>`;
  pag += `<span class="page-info">Page ${currentPage} of ${totalPages} · ${start+1}–${end} of ${total}</span>`;
  document.getElementById("paginationArea").innerHTML = pag;
}

function goPage(p){
  const rpp = getRowsPerPage();
  const totalPages = rpp === Infinity ? 1 : Math.max(1, Math.ceil(FILTERED_ROWS.length / rpp));
  if(p < 1 || p > totalPages) return;
  currentPage = p;
  renderTable();
  document.querySelector(".table-wrap").scrollIntoView({ behavior:"smooth", block:"start" });
}

async function markTreated(itemId){
  if(!(ME && (ME.role === "super_admin" || ME.role === "admin"))){
    alert("❌ Only Admins and Super Admins can mark items as Treated."); return;
  }
  if(!confirm("⚠️ Are you sure this part is available and ready to be marked as TREATED?")) return;
  if(TREATED_IDS.has(itemId)){ alert("⚠️ Already marked as treated."); return; }
  try{
    const res = await fetch(SUPABASE_URL + "/rest/v1/treated_items", {
      method: "post", headers: authHeaders(), body: JSON.stringify({ item_id: itemId })
    });
    if(!res.ok) throw new Error("HTTP " + res.status + " - " + await res.text());
    TREATED_IDS.add(itemId);
    alert("✅ Marked as Treated.");
    applyFilter();
  }catch(e){
    alert("❌ Error: " + (e.message||e));
  }
}

function esc(s){ return (s||"").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function js(s){ return (s||"").toString().replace(/\\/g,"\\\\").replace(/'/g,"\\'"); }

init();
</script>
</body>
</html>
