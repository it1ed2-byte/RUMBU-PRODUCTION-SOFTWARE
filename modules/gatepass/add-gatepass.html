<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gatepass — Add</title>
<link rel="stylesheet" href="../../styles.css">
<script>
  (function(){
    function apply(t){ if(t) document.documentElement.setAttribute("data-theme", t); }
    window.addEventListener("message", function(e){ if(e.data && e.data.rumbuTheme) apply(e.data.rumbuTheme); });
    try{ apply(localStorage.getItem("rumbu_theme")); }catch(e){}
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../auth.js"></script>
<style>
  :root{--navy:var(--heading);--blue:var(--accent);--blue-dark:var(--accent-2);--muted:#6b7280;--red:#c0392b;--green:#1d8a4e;}
  *{box-sizing:border-box;}
  body{font-family:var(--sans);background:var(--bg);margin:0;padding:18px;color:var(--text);}
  .wrap{max-width:820px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;}
  .card h3{color:var(--navy);margin:0 0 4px;font-size:16px;}
  .card .sub{color:var(--blue);font-size:12px;margin:0 0 14px;}
  label{display:block;font-size:12px;font-weight:bold;color:var(--text);margin:10px 0 4px;}
  input,textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;background:var(--card);color:var(--text);}
  textarea{resize:vertical;min-height:70px;}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row > div{flex:1;min-width:180px;}
  button{padding:11px 16px;border:none;border-radius:8px;font-weight:bold;font-size:14px;cursor:pointer;background:var(--blue);color:#fff;margin-top:14px;}
  button:hover{background:var(--blue-dark);}
  button:disabled{opacity:.6;cursor:not-allowed;}
  button.add{background:var(--green);margin-top:0;padding:9px 13px;font-size:13px;}
  button.add:hover{background:#166a2c;}
  .status{margin-top:10px;font-weight:bold;font-size:13px;min-height:16px;}
  .status.ok{color:var(--green);} .status.err{color:var(--red);}
  #connStatus{font-size:12px;font-weight:bold;text-align:center;margin-bottom:10px;color:var(--muted);}
  .items-head{display:flex;justify-content:space-between;align-items:center;margin:6px 0 8px;}
  .items-head h4{margin:0;color:var(--navy);font-size:13px;}
  table.items{width:100%;border-collapse:collapse;}
  table.items th{font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);text-align:left;padding:4px 6px;}
  table.items td{padding:4px 6px;vertical-align:top;}
  table.items input{padding:8px;}
  .col-no{width:34px;text-align:center;color:var(--muted);font-weight:bold;padding-top:14px;}
  .col-qty{width:110px;} .col-unit{width:110px;} .col-rm{width:40px;}
  .rm-item{background:var(--red);color:#fff;border:none;border-radius:6px;width:28px;height:28px;font-size:15px;font-weight:bold;cursor:pointer;margin-top:6px;padding:0;}
  .rm-item:hover{background:#a03227;}
  .hint{font-size:11px;color:var(--muted);margin-top:4px;}
</style>
</head>
<body>

<div class="wrap">
<div id="connStatus">Loading...</div>

<div class="card">
  <h3>Add Gatepass &mdash; Material Out of Company</h3>
  <p class="sub" id="branchNote"></p>

  <div class="row">
    <div>
      <label>Branch (this gatepass is for)</label>
      <select id="branch" onchange="onBranchChanged()"></select>
    </div>
    <div>
      <label>Gatepass Type</label>
      <select id="gatepassType"><option value="">— select branch first —</option></select>
    </div>
    <div>
      <label>Date</label>
      <input type="date" id="passDate">
    </div>
  </div>

  <label>Name of Person (taking material out)</label>
  <input type="text" id="personName" placeholder="Full name">

  <div class="items-head" style="margin-top:16px;">
    <h4>Items</h4>
    <button type="button" class="add" onclick="addItemRow()">+ Add item</button>
  </div>
  <p class="hint">Add every item leaving the company on this pass, each with its quantity. You can add as many rows as you need.</p>
  <table class="items">
    <thead>
      <tr><th class="col-no">#</th><th>Item / Part name</th><th class="col-qty">Quantity</th><th class="col-unit">Unit</th><th class="col-rm"></th></tr>
    </thead>
    <tbody id="itemsBody"></tbody>
  </table>

  <label style="margin-top:16px;">Description / Reason</label>
  <textarea id="description" placeholder="Where it is going, reason, or any notes"></textarea>

  <button onclick="save()">Save Gatepass</button>
  <div class="status" id="status"></div>
</div>
</div>

<script>
let ME = null;
let GATEPASS_TYPES = [];
let ITEM_SEQ = 0;

function todayISO(){ return new Date().toISOString().slice(0,10); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

async function logActivity(actionType, description){
  try{
    await sb.from("activity_log").insert({
      actor_id: ME.id, actor_username: ME.username, actor_role: ME.role,
      section_id: ME.sectionId, action_type: actionType, description: description
    });
  }catch(e){ console.warn("Activity log write failed (non-fatal):", e); }
}

async function init(){
  const status = document.getElementById("connStatus");
  try{
    ME = await requireAuth("../../login.html");
    if(!ME) return;
    document.getElementById("passDate").value = todayISO();
    populateBranches();
    addItemRow(); addItemRow(); // start with a couple of rows
    document.getElementById("branchNote").textContent = "Signed in as " + ME.username;
    status.style.color = "#1d8a4e"; status.textContent = "Connected.";
  }catch(e){ status.style.color = "#c0392b"; status.textContent = "❌ " + e.message; console.error(e); }
}

function addItemRow(name, qty, unit){
  const id = ++ITEM_SEQ;
  const tr = document.createElement("tr");
  tr.id = "itemrow-" + id;
  tr.innerHTML =
    "<td class='col-no it-no'></td>" +
    "<td><input type='text' id='it-name-" + id + "' placeholder='e.g. Bearing 6204' value=\"" + esc(name||"") + "\"></td>" +
    "<td class='col-qty'><input type='number' step='any' id='it-qty-" + id + "' placeholder='0' value=\"" + esc(qty==null?"":qty) + "\"></td>" +
    "<td class='col-unit'><input type='text' id='it-unit-" + id + "' placeholder='pcs / kg' value=\"" + esc(unit||"") + "\"></td>" +
    "<td class='col-rm'><button type='button' class='rm-item' onclick=\"removeItemRow(" + id + ")\" title='Remove'>&times;</button></td>";
  document.getElementById("itemsBody").appendChild(tr);
  renumber();
}
window.addItemRow = addItemRow;

function removeItemRow(id){
  const tr = document.getElementById("itemrow-" + id);
  if(tr) tr.remove();
  if(!document.querySelectorAll("#itemsBody tr").length) addItemRow();
  renumber();
}
window.removeItemRow = removeItemRow;

function renumber(){
  document.querySelectorAll("#itemsBody tr").forEach((tr, i) => {
    const cell = tr.querySelector(".it-no"); if(cell) cell.textContent = (i + 1);
  });
}

function collectItems(){
  const rows = [];
  document.querySelectorAll("#itemsBody tr").forEach(tr => {
    const id = tr.id.replace("itemrow-", "");
    const name = (document.getElementById("it-name-" + id).value || "").trim();
    const qtyRaw = (document.getElementById("it-qty-" + id).value || "").trim();
    const unit = (document.getElementById("it-unit-" + id).value || "").trim();
    if(!name && !qtyRaw) return; // skip empty row
    rows.push({ name, qty: qtyRaw === "" ? null : parseFloat(qtyRaw), unit: unit || null });
  });
  return rows;
}

function populateBranches(){
  const sel = document.getElementById("branch");
  sel.innerHTML = "";
  if(ME.role === "super_admin"){
    sb.from("app_sections").select("name").order("name").then(({data})=>{
      (data || []).forEach(s=>{ const o = document.createElement("option"); o.value = s.name; o.textContent = s.name; sel.appendChild(o); });
      onBranchChanged();
    });
    sel.disabled = false;
    return;
  }
  const mine = ME.sectionNames || [];
  if(!mine.length){ const o = document.createElement("option"); o.value = ""; o.textContent = "— no branch assigned —"; sel.appendChild(o); sel.disabled = true; return; }
  mine.forEach(name=>{ const o = document.createElement("option"); o.value = name; o.textContent = name; sel.appendChild(o); });
  sel.disabled = (mine.length === 1);
  onBranchChanged();
}

async function onBranchChanged(){
  const branch = document.getElementById("branch").value;
  const typeSel = document.getElementById("gatepassType");
  typeSel.innerHTML = "<option value=\"\">Loading…</option>"; typeSel.disabled = true; GATEPASS_TYPES = [];
  if(!branch){ typeSel.innerHTML = "<option value=\"\">— select branch first —</option>"; return; }
  try{
    const { data, error } = await sb.from("hr_gatepass_types").select("id, type_name").eq("branch", branch).order("type_name");
    if(error) throw error;
    GATEPASS_TYPES = data || [];
    if(!GATEPASS_TYPES.length){ typeSel.innerHTML = "<option value=\"\">No gatepass types configured for this branch</option>"; typeSel.disabled = true; }
    else { typeSel.innerHTML = "<option value=\"\">-- Select Gatepass Type --</option>" + GATEPASS_TYPES.map(t => "<option value=\"" + t.id + "\">" + esc(t.type_name) + "</option>").join(""); typeSel.disabled = false; }
  }catch(e){ typeSel.innerHTML = "<option value=\"\">Could not load types</option>"; console.warn("Could not load gatepass types:", e.message); }
}
window.onBranchChanged = onBranchChanged;

async function nextNumber(){
  const year = new Date().getFullYear().toString();
  const prefix = "GP-" + year;
  const { data, error } = await sb.from("hr_gatepass").select("gatepass_number").like("gatepass_number", prefix + "%").order("gatepass_number", { ascending: false }).limit(1);
  if(error) throw error;
  let seq = 1;
  if(data && data.length){ const last = data[0].gatepass_number; seq = parseInt(last.slice(prefix.length), 10) + 1; }
  return prefix + String(seq).padStart(4, "0");
}

async function save(){
  const status = document.getElementById("status");
  const g = id => document.getElementById(id).value.trim();
  const branch = g("branch");
  const gatepassTypeId = g("gatepassType");
  const passDate = g("passDate");
  const personName = g("personName");
  const description = g("description");
  const items = collectItems();

  if(!personName){ status.className = "status err"; status.textContent = "The person's name is required."; return; }
  if(!passDate){ status.className = "status err"; status.textContent = "Date is required."; return; }
  if(!branch){ status.className = "status err"; status.textContent = "No Branch available — ask your Super Admin to assign you a Branch."; return; }
  if(ME.role !== "super_admin" && (ME.sectionNames || []).indexOf(branch) === -1){ status.className = "status err"; status.textContent = "You are not assigned to that Branch."; return; }
  if(GATEPASS_TYPES.length && !gatepassTypeId){ status.className = "status err"; status.textContent = "Select a Gatepass Type."; return; }
  if(!items.length){ status.className = "status err"; status.textContent = "Add at least one item."; return; }
  const badItem = items.find(it => !it.name || it.qty == null || isNaN(it.qty));
  if(badItem){ status.className = "status err"; status.textContent = "Every item needs a name and a quantity. Remove any blank row."; return; }

  const selectedType = GATEPASS_TYPES.find(t => String(t.id) === gatepassTypeId);
  const summaryName = items.length === 1 ? items[0].name : (items.length + " items");
  const summaryQty = items.length === 1 ? items[0].qty : null;

  status.className = "status"; status.textContent = "Saving...";
  try{
    const number = await nextNumber();
    const { data: header, error } = await sb.from("hr_gatepass").insert({
      gatepass_number: number,
      branch: branch,
      gatepass_type_id: selectedType ? selectedType.id : null,
      gatepass_type_name: selectedType ? selectedType.type_name : null,
      pass_date: passDate,
      part_name: summaryName,
      person_name: personName,
      quantity: summaryQty,
      item_count: items.length,
      description: description || null,
      status: "pending",
      created_by_username: ME.username
    }).select("id").single();
    if(error) throw error;

    const itemRows = items.map(it => ({ gatepass_id: header.id, item_name: it.name, quantity: it.qty, unit: it.unit }));
    const { error: itErr } = await sb.from("hr_gatepass_items").insert(itemRows);
    if(itErr) throw itErr;

    await logActivity("gatepass_added", ME.username + " added gatepass " + number + " for " + personName + " (" + items.length + " item(s))");
    status.className = "status ok"; status.textContent = "✅ Saved as " + number + " with " + items.length + " item(s) (pending approval).";

    document.getElementById("personName").value = "";
    document.getElementById("description").value = "";
    document.getElementById("itemsBody").innerHTML = ""; ITEM_SEQ = 0; addItemRow(); addItemRow();
    document.getElementById("passDate").value = todayISO();
  }catch(e){ status.className = "status err"; status.textContent = "❌ " + e.message; }
}
window.save = save;

init();
</script>
</body>
</html>
