<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Gatepass PDF Settings</title>
<link rel="stylesheet" href="../../styles.css">
<script>
  (function(){
    function apply(t){if(t)document.documentElement.setAttribute("data-theme",t);}
    window.addEventListener("message",function(e){if(e.data&&e.data.rumbuTheme)apply(e.data.rumbuTheme);});
    try{apply(localStorage.getItem("rumbu_theme"));}catch(e){}
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../auth.js"></script>
<style>
*{box-sizing:border-box;}
body{font-family:var(--sans);background:var(--bg);margin:0;padding:18px;color:var(--text);}
.wrap{max-width:900px;margin:0 auto;}
.page-head{
  background:linear-gradient(130deg,#1F3864 0%,#2E75B6 100%);
  border-radius:16px;padding:18px 22px;margin-bottom:18px;color:#fff;
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
}
.page-head h2{margin:0 0 4px;font-size:18px;font-weight:800;color:#fff;}
.page-head p{margin:0;font-size:12.5px;opacity:.88;color:#fff;}
#connStatus{font-size:12px;font-weight:700;text-align:center;margin-bottom:12px;color:var(--muted);}
.back-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 16px;background:var(--card);color:var(--heading);
  border:1.5px solid var(--line);border-radius:9px;font-weight:700;
  font-size:13px;cursor:pointer;margin-bottom:14px;
}
.back-btn:hover{border-color:var(--accent);color:var(--accent);}

/* Cards */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:14px;}
.branch-card{
  background:var(--card);border:1.5px solid var(--line);
  border-radius:14px;padding:20px 22px;
  box-shadow:0 2px 8px rgba(0,0,0,.07);
}
.bc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px;}
.bc-name{font-size:15px;font-weight:800;color:var(--heading);flex:1;}
.bc-tag{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:700;white-space:nowrap;}
.bc-tag.ok{background:#dcfce7;color:#166534;}
.bc-tag.empty{background:#f3f4f6;color:#6b7280;}

.field{margin-bottom:12px;}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:5px;letter-spacing:.2px;}
.field input{
  width:100%;padding:9px 12px;border:1.5px solid var(--line-2);
  border-radius:8px;font-size:13.5px;background:var(--bg);color:var(--text);
  transition:border-color .15s ease;
}
.field input:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent);}
.field .hint{font-size:11px;color:var(--muted);margin-top:4px;}
.phone-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.save-btn{
  width:100%;padding:10px;background:var(--accent);color:var(--logo-fg);
  border:none;border-radius:9px;font-weight:800;font-size:13px;cursor:pointer;
  margin-top:4px;transition:all .15s ease;
}
.save-btn:hover{filter:brightness(1.08);transform:translateY(-1px);}
.save-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.msg{font-size:12px;font-weight:700;text-align:center;margin-top:8px;min-height:16px;}
.msg.ok{color:var(--ok);}.msg.err{color:var(--bad);}

.notice{
  background:color-mix(in srgb,var(--accent) 8%,var(--bg));
  border:1.5px solid color-mix(in srgb,var(--accent) 22%,transparent);
  border-radius:10px;padding:12px 16px;font-size:12.5px;
  color:var(--heading);margin-bottom:16px;line-height:1.55;
}

.empty-note{color:var(--muted);font-size:13px;padding:20px 0;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
<button class="back-btn" onclick="window.location.href='view-gatepass.html'">← Back to Gatepass</button>
<div id="connStatus">Loading…</div>

<div class="page-head">
  <div>
    <h2>⚙ Gatepass PDF Settings</h2>
    <p>Configure address and contact numbers for each branch — they appear on every gate pass PDF.</p>
  </div>
</div>



<div class="notice" id="scopeNote" style="display:none;"></div>

<div class="cards-grid" id="cardsGrid">
  <p class="empty-note">Loading branches…</p>
</div>
</div>

<script>
let ME = null;
// branchName → existing settings row (or null)
let SETTINGS_MAP = {};

function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

async function loadAll(){
  const grid = document.getElementById("cardsGrid");
  grid.innerHTML = '<p class="empty-note">Loading…</p>';

  // 1. Always fetch ALL branches from app_sections (super_admin sees all;
  //    others are filtered below)
  const { data: secs } = await sb.from("app_sections").select("name").order("name");
  const allBranches = (secs||[]).map(s=>s.name);

  let branchNames = [];
  if(ME.role === "super_admin"){
    branchNames = allBranches;                         // super_admin: everything
  } else if((ME.sectionNames||[]).length){
    // Filter to only this user's assigned branches
    const mySet = new Set(ME.sectionNames);
    branchNames = allBranches.filter(n=>mySet.has(n));
  } else {
    // Fallback: no sectionNames set but auth passed — show all
    branchNames = allBranches;
  }

  // 2. Fetch existing settings (all, then filter client-side)
  const { data: rows, error } = await sb.from("gatepass_branch_settings")
    .select("*").order("branch_name");

  if(error){
    if(error.code==="42P01"){
      grid.innerHTML="<p style='color:var(--bad);font-size:13px;font-weight:700;'>⚠️ The <b>gatepass_branch_settings</b> table does not exist yet. Ask a super admin to create it in Supabase, then refresh.</p>";
      return;
    }
    grid.innerHTML=`<p style="color:var(--bad);">Error: ${esc(error.message)}</p>`;
    return;
  }

  SETTINGS_MAP = {};
  (rows||[]).forEach(r=>{ SETTINGS_MAP[r.branch_name] = r; });

  if(!branchNames.length){
    grid.innerHTML='<p class="empty-note">No branches found for your account.</p>';
    return;
  }

  grid.innerHTML = branchNames.map(name => cardHTML(name)).join("");
}

function cardHTML(name){
  const s = SETTINGS_MAP[name] || {};
  const hasData = s.address || s.chief_security_phone || s.plant_manager_phone;
  const safeId  = name.replace(/[^a-zA-Z0-9]/g,"_");
  return `<div class="branch-card" id="bc_${safeId}">
    <div class="bc-head">
      <span class="bc-name">${esc(name)}</span>
      <span class="bc-tag ${hasData?'ok':'empty'}" id="tag_${safeId}">
        ${hasData?'✓ Configured':'Not yet configured'}
      </span>
    </div>
    <div class="field">
      <label>Branch Address</label>
      <input id="addr_${safeId}" value="${esc(s.address||'')}"
        placeholder="e.g. Plot 14, Hadejia Road, Kano">
      <div class="hint">Appears in the PDF header under the branch name</div>
    </div>
    <div class="phone-row">
      <div class="field" style="margin:0;">
        <label>Chief Security Phone</label>
        <input id="sec_${safeId}" value="${esc(s.chief_security_phone||'')}"
          placeholder="+234 xxx xxxx xxxx">
      </div>
      <div class="field" style="margin:0;">
        <label>Plant Manager Phone</label>
        <input id="pm_${safeId}" value="${esc(s.plant_manager_phone||'')}"
          placeholder="+234 xxx xxxx xxxx">
      </div>
    </div>
    <button class="save-btn" onclick="saveCard('${name.replace(/'/g,"\\'")}','${safeId}')">
      Save
    </button>
    <div class="msg" id="msg_${safeId}"></div>
  </div>`;
}

async function saveCard(branchName, safeId){
  const btn = document.querySelector(`#bc_${safeId} .save-btn`);
  const msg = document.getElementById(`msg_${safeId}`);
  btn.disabled=true; msg.className="msg"; msg.textContent="Saving…";

  const payload = {
    branch_name: branchName,
    address: document.getElementById(`addr_${safeId}`).value.trim()||null,
    chief_security_phone: document.getElementById(`sec_${safeId}`).value.trim()||null,
    plant_manager_phone:  document.getElementById(`pm_${safeId}`).value.trim()||null,
    updated_at: new Date().toISOString()
  };

  // Upsert — insert if row doesn't exist, update if it does
  const { data, error } = await sb.from("gatepass_branch_settings")
    .upsert(payload, { onConflict: "branch_name" })
    .select().single();

  btn.disabled = false;
  if(error){
    msg.className="msg err"; msg.textContent="❌ "+error.message;
  } else {
    SETTINGS_MAP[branchName] = data;
    const hasData = data.address||data.chief_security_phone||data.plant_manager_phone;
    const tag = document.getElementById(`tag_${safeId}`);
    tag.className = "bc-tag "+(hasData?"ok":"empty");
    tag.textContent = hasData?"✓ Configured":"Not yet configured";
    msg.className="msg ok"; msg.textContent="✅ Saved.";
    setTimeout(()=>{ msg.textContent=""; },3000);
  }
}

async function init(){
  const cs = document.getElementById("connStatus");
  try{
    ME = await requireAuth("../../login.html");
    if(!ME) return;
    cs.style.color="var(--ok)"; cs.textContent="Connected as "+ME.username;



    // Scope note for non-super-admin
    const note = document.getElementById("scopeNote");
    if(ME.role!=="super_admin"){
      note.style.display="";
      note.textContent="ℹ You can configure PDF settings for your assigned branch"+(
        (ME.sectionNames||[]).length>1?"es":"")+": "+(ME.sectionNames||[]).join(", ")+"."
    }

    await loadAll();
  }catch(e){
    cs.style.color="var(--bad)"; cs.textContent="Error: "+e.message;
  }
}
init();
</script>
</body>
</html>
