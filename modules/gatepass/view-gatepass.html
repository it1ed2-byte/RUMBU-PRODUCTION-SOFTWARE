<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Gatepass — View</title>
<link rel="stylesheet" href="../../styles.css">
<script>
  (function(){
    function apply(t){if(t)document.documentElement.setAttribute("data-theme",t);}
    window.addEventListener("message",function(e){if(e.data&&e.data.rumbuTheme)apply(e.data.rumbuTheme);});
    try{apply(localStorage.getItem("rumbu_theme"));}catch(e){}
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../auth.js"></script>
<!-- html2pdf is NOT preloaded here — it is lazy-loaded only when Download is clicked -->
<style>
:root{--navy:#1F3864;--blue:#2E75B6;--blue-dk:#1a5a9a;--muted:#6b7280;--red:#c0392b;--green:#1d8a4e;--amber:#d97706;}
*{box-sizing:border-box;}
body{font-family:var(--sans);background:var(--bg);margin:0;padding:18px;color:var(--text);}
.wrap{max-width:1050px;margin:0 auto;}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;}
.card h3{color:var(--navy);margin:0 0 4px;font-size:16px;}
.card .sub{color:var(--blue);font-size:12px;margin:0 0 14px;}
label{display:block;font-size:12px;font-weight:bold;color:var(--text);margin:10px 0 4px;}
input,select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;background:var(--card);color:var(--text);}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
.row>div{flex:1;min-width:150px;}
button{padding:10px 14px;border:none;border-radius:8px;font-weight:bold;font-size:13px;cursor:pointer;background:var(--blue);color:#fff;}
button:hover{background:var(--blue-dk);}
button.mini{padding:6px 10px;font-size:12px;}
button.grey{background:#6b7280;}button.grey:hover{background:#4b5563;}
button.green{background:var(--green);}button.green:hover{background:#166a2c;}
button:disabled{opacity:.6;cursor:not-allowed;}
.status{margin-top:10px;font-weight:bold;font-size:13px;min-height:16px;}
.status.ok{color:var(--green);}.status.err{color:var(--red);}
#connStatus{font-size:12px;font-weight:bold;text-align:center;margin-bottom:10px;color:var(--muted);}
table.list{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px;}
table.list th,table.list td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;}
table.list thead th{background:var(--navy);color:#fff;font-size:12px;}
table.list tbody tr{cursor:pointer;}
table.list tbody tr:nth-child(even){background:var(--bg);}
table.list tbody tr:hover td{background:rgba(46,117,182,.10);}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:bold;color:#fff;}
.tag.pending{background:var(--amber);}.tag.approved{background:var(--green);}.tag.rejected{background:var(--red);}
.detail-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}

/* ══════════════════════════════════════════════════════
   GATE PASS DOCUMENT DESIGN
   ══════════════════════════════════════════════════════ */
.gp-paper{
  background:#fff;color:#000;max-width:720px;margin:0 auto;
  border:1px solid #ccc;font-family:"Times New Roman",serif;
  position:relative;overflow:hidden;
}

/* Diagonal watermark */
.gp-wm{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%) rotate(-42deg);
  font-size:64px;font-weight:900;letter-spacing:6px;
  color:rgba(31,56,100,.07);white-space:nowrap;pointer-events:none;
  z-index:0;font-family:Arial,sans-serif;width:130%;text-align:center;
}

/* Header gradient band */
.gp-head{
  background:linear-gradient(130deg,#1F3864 0%,#2E75B6 100%);
  color:#fff;padding:18px 24px 14px;
  display:flex;align-items:center;gap:16px;
  position:relative;z-index:1;
}
.gp-head img{width:56px;height:56px;border-radius:8px;background:#fff;padding:3px;flex:0 0 56px;object-fit:contain;}
.gp-head .co{flex:1;}
.gp-head .co-name{font-size:17px;font-weight:800;color:#fff;margin:0 0 2px;}
.gp-head .co-email{font-size:10px;opacity:.80;color:#fff;margin:0 0 4px;letter-spacing:.2px;}
.gp-head .co-sub{font-size:10.5px;opacity:.92;letter-spacing:.8px;text-transform:uppercase;color:#fff;font-weight:700;}
.gp-head .co-addr{font-size:10px;opacity:.75;color:#fff;margin-top:3px;line-height:1.4;}
.gp-head .badge-wrap{text-align:right;}
.gp-head .doc-type{
  font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;
  background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);
  border-radius:6px;padding:4px 12px;color:#fff;display:inline-block;
}
.gp-head .doc-no{display:block;font-size:11px;opacity:.85;color:#fff;margin-top:5px;}

/* Number strip */
.gp-strip{
  background:#f0f4fa;border-bottom:2px solid #2E75B6;
  padding:7px 24px;display:flex;align-items:center;
  justify-content:space-between;font-size:12px;
  position:relative;z-index:1;
}
.gp-strip .gno{font-weight:800;font-size:13px;color:#1F3864;}
.gp-strip .gdt{color:#555;}

/* Body */
.gp-body{padding:18px 24px;position:relative;z-index:1;}
.gp-stitle{
  font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;
  color:#2E75B6;border-bottom:1.5px solid #2E75B6;
  padding-bottom:4px;margin:14px 0 9px;
}
table.info-tbl{width:100%;border-collapse:collapse;font-size:12.5px;}
table.info-tbl td{padding:7px 10px;border:1px solid #d1d5db;vertical-align:top;}
table.info-tbl td.k{width:32%;font-weight:700;background:#f8fafc;color:#1F3864;border-right:2px solid #2E75B6;}
table.items-tbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px;}
table.items-tbl th{background:#1F3864;color:#fff;padding:7px 10px;font-size:10.5px;font-weight:700;text-align:left;letter-spacing:.3px;}
table.items-tbl td{padding:7px 10px;border:1px solid #d1d5db;vertical-align:top;}
table.items-tbl tr:nth-child(even) td{background:#f8fafc;}
td.num{text-align:center;font-weight:700;color:#6b7280;width:34px;}

/* Status stamps */
.gp-stamp{margin:16px 0 0;border-radius:8px;padding:11px 14px;display:flex;align-items:flex-start;gap:12px;font-size:12.5px;line-height:1.5;}
.gp-stamp.approved{background:#ecfdf5;border:2px solid #1d8a4e;color:#0f5c33;}
.gp-stamp.rejected{background:#fff1f1;border:2px solid #c0392b;color:#8f2531;}
.gp-stamp.pending{background:#fffbeb;border:2px solid #d97706;color:#9a5a08;}
.stamp-icon{font-size:20px;flex:0 0 auto;margin-top:2px;}
.stamp-text b{font-size:12.5px;display:block;margin-bottom:3px;letter-spacing:.3px;}

/* Signatures */
.gp-sign{display:flex;justify-content:space-between;gap:18px;margin-top:44px;}
.sig-block{flex:1;border-top:1.5px solid #1F3864;padding-top:7px;text-align:center;font-size:11px;color:#374151;}
.sig-name{font-weight:700;color:#1F3864;font-size:11.5px;margin-top:3px;}

/* Contact strip */
.gp-contacts{
  display:flex;justify-content:center;align-items:center;
  flex-wrap:wrap;gap:6px 32px;
  padding:8px 24px;
  background:#f0f4fa;border-top:1px solid #d1d5db;
  font-size:11px;color:#374151;
  position:relative;z-index:1;
}
.gp-contacts span{display:inline-flex;align-items:center;gap:5px;}
.gp-contacts b{color:#1F3864;font-weight:700;}

/* Footer */
.gp-footer{
  background:#1F3864;color:rgba(255,255,255,.78);
  padding:7px 24px;font-size:10px;
  display:flex;justify-content:space-between;align-items:center;
  position:relative;z-index:1;margin-top:22px;
}

/* ── Print / PDF media ── */
@media print{
  body{padding:0;background:#fff;}
  .wrap,.card{max-width:none;margin:0;padding:0;border:none;border-radius:0;box-shadow:none;background:#fff;}
  #listView,#detailView>.card>.detail-actions,#connStatus{display:none!important;}
  #detailView{display:block!important;}
  .gp-paper{border:none;max-width:none;}
}
</style>
</head>
<body>
<div class="wrap">
<div id="connStatus">Loading…</div>

<div id="listView">
  <div class="card">
    <h3>View Gatepass</h3>
    <p class="sub" id="scopeNote"></p>
    <div class="row">
      <div><label>From Date</label><input type="date" id="fromDate" onchange="applyFilters()"></div>
      <div><label>To Date</label><input type="date" id="toDate" onchange="applyFilters()"></div>
      <div>
        <label>Status</label>
        <select id="statusFilter" onchange="applyFilters()">
          <option value="">All</option><option value="pending">Pending</option>
          <option value="approved">Approved</option><option value="rejected">Rejected</option>
        </select>
      </div>
      <div><label>Gatepass Type</label><select id="typeFilter" onchange="applyFilters()"><option value="">All</option></select></div>
      <div><label>Search</label><input type="text" id="search" placeholder="Part / person / number" oninput="applyFilters()"></div>
      <div style="flex:0 0 auto;"><button onclick="loadRecords()">Refresh</button></div>
    </div>
    <div class="status" id="status"></div>
  </div>
  <div class="card">
    <p class="sub" style="margin:0 0 4px;">Click any row to open the gate pass, then download the PDF or print.</p>
    <div id="tableWrap"></div>
  </div>
</div>

<div id="detailView" style="display:none;">
  <button class="grey" style="margin-bottom:12px;" onclick="backToList()">← Back to list</button>
  <div class="card">
    <div class="detail-actions">
      <button class="green" id="dlBtn" onclick="downloadPDF()">⬇ Download PDF</button>
      <button onclick="printPass()">🖨 Print</button>
      <span id="pdfStatus" style="font-size:12px;color:var(--muted);"></span>
      <button id="settingsBtn" style="display:none;background:var(--bg);color:var(--heading);border:1.5px solid var(--line);padding:9px 14px;border-radius:8px;font-weight:700;font-size:13px;margin-left:auto;" onclick="window.location.href='gatepass-settings.html'">⚙ Branch Settings</button>
    </div>
    <div id="paperWrap"></div>
  </div>
</div>
</div>

<script>
const LOGO_URI = '../../icon-192.png';
const COMPANY  = 'Rumbu Industries Limited';
const DIVISION = 'Rumbu Mainmat';

let ME = null, ALL = [], CURRENT = null, CURRENT_ITEMS = [], CURRENT_SETTINGS = null;

// ── auth ──────────────────────────────────────────────────────────────
async function init(){
  const cs = document.getElementById('connStatus');
  try{
    ME = await requireAuth('../../login.html');
    if(!ME) return;
    document.getElementById('scopeNote').textContent = ME.role==='super_admin'
      ? 'Showing all gatepasses.' : 'Showing gatepasses for your branch.';
    cs.style.color='#1d8a4e'; cs.textContent='Connected.';
    if(ME.role==='super_admin') document.getElementById('settingsBtn').style.display='';
    await loadRecords();
  }catch(e){
    cs.style.color='#c0392b'; cs.textContent='❌ '+e.message;
  }
}

function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── list ──────────────────────────────────────────────────────────────
async function loadRecords(){
  const st=document.getElementById('status');
  st.className='status'; st.textContent='Loading…';
  try{
    let q=sb.from('hr_gatepass').select('*').order('created_at',{ascending:false});
    if(ME.role!=='super_admin'){
      if(ME.sectionNames&&ME.sectionNames.length) q=q.in('branch',ME.sectionNames);
      else q=q.eq('branch','___none___');
    }
    const{data,error}=await q;
    if(error) throw error;
    ALL=data||[];
    st.className='status ok'; st.textContent=ALL.length+' gatepass(es) loaded.';
    populateTypeFilter(); applyFilters();
  }catch(e){st.className='status err'; st.textContent='❌ '+e.message;}
}
window.loadRecords=loadRecords;

function populateTypeFilter(){
  const sel=document.getElementById('typeFilter'),cur=sel.value;
  const types=[...new Set(ALL.map(r=>r.gatepass_type_name).filter(Boolean))].sort();
  sel.innerHTML='<option value="">All</option>'+
    types.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('');
  if(types.includes(cur)) sel.value=cur;
}

function applyFilters(){
  const from=document.getElementById('fromDate').value;
  const to=document.getElementById('toDate').value;
  const sf=document.getElementById('statusFilter').value;
  const tf=document.getElementById('typeFilter').value;
  const q=document.getElementById('search').value.trim().toLowerCase();
  let rows=ALL.slice();
  if(from) rows=rows.filter(r=>(r.pass_date||'')>=from);
  if(to)   rows=rows.filter(r=>(r.pass_date||'')<=to);
  if(sf)   rows=rows.filter(r=>r.status===sf);
  if(tf)   rows=rows.filter(r=>r.gatepass_type_name===tf);
  if(q)    rows=rows.filter(r=>
    (r.gatepass_number||'').toLowerCase().includes(q)||
    (r.part_name||'').toLowerCase().includes(q)||
    (r.person_name||'').toLowerCase().includes(q)||
    (r.created_by_username||'').toLowerCase().includes(q));
  const wrap=document.getElementById('tableWrap');
  if(!rows.length){wrap.innerHTML="<p style='color:var(--muted);font-size:13px;padding:10px 0;'>No gatepasses found.</p>";return;}
  wrap.innerHTML=`<table class="list"><thead><tr>
    <th>No.</th><th>Date</th><th>Type</th><th>Part / Item</th>
    <th>Person</th><th>Qty</th><th>Branch</th><th>Status</th><th></th></tr></thead>
    <tbody>${rows.map(r=>{
      const s=(r.status||'pending').toLowerCase();
      return `<tr onclick="openDetail(${r.id})">
        <td>${esc(r.gatepass_number||'')}</td>
        <td>${esc(r.pass_date||'')}</td>
        <td>${esc(r.gatepass_type_name||'')}</td>
        <td>${esc(r.part_name||'')}</td>
        <td>${esc(r.person_name||'')}</td>
        <td>${r.quantity!=null?esc(r.quantity):''}</td>
        <td>${esc(r.branch||'')}</td>
        <td><span class="tag ${s}">${s.toUpperCase()}</span></td>
        <td><button class="mini grey" onclick="event.stopPropagation();openDetail(${r.id})">View</button></td>
      </tr>`;
    }).join('')}</tbody></table>`;
}

// ── detail ────────────────────────────────────────────────────────────
async function fetchItems(id){
  const{data,error}=await sb.from('hr_gatepass_items')
    .select('item_name,quantity,unit').eq('gatepass_id',id).order('id');
  if(error){console.warn('Items:',error.message);return[];}
  return data||[];
}

async function openDetail(id){
  const r=ALL.find(x=>x.id===id);
  if(!r) return;
  CURRENT=r; CURRENT_ITEMS=[];
  document.getElementById('paperWrap').innerHTML="<p style='color:var(--muted);'>Loading…</p>";
  document.getElementById('listView').style.display='none';
  document.getElementById('detailView').style.display='block';
  try{window.scrollTo(0,0);}catch(e){}
  CURRENT_ITEMS=await fetchItems(id);
  // Resolve full names and branch settings in parallel
  const [empResult, settingsResult] = await Promise.all([
    (async()=>{
      const users=[r.created_by_username,r.approved_by].filter(Boolean);
      if(!users.length) return {};
      const{data:emp}=await sb.from('employees').select('employee_id,full_name').in('employee_id',users);
      const nm={};(emp||[]).forEach(e=>{nm[e.employee_id]=e.full_name;});
      return nm;
    })(),
    r.branch
      ? sb.from('gatepass_branch_settings').select('*').eq('branch_name',r.branch).maybeSingle().then(res=>res.data||null)
      : Promise.resolve(null)
  ]);
  const nm=empResult;
  r._created_by_full_name=nm[r.created_by_username]||null;
  r._approved_by_full_name=nm[r.approved_by]||null;
  CURRENT_SETTINGS=settingsResult;
  document.getElementById('paperWrap').innerHTML=buildPaper(r,CURRENT_ITEMS,CURRENT_SETTINGS);
}
window.openDetail=openDetail;

function backToList(){
  document.getElementById('detailView').style.display='none';
  document.getElementById('listView').style.display='block';
  CURRENT=null; try{window.scrollTo(0,0);}catch(e){}
}
window.backToList=backToList;

// ── paper HTML (template literals — no quote-escaping issues) ─────────
function buildPaper(r, items, settings){
  const st=(r.status||'pending').toUpperCase();
  const list=(items&&items.length)?items:[{item_name:r.part_name,quantity:r.quantity,unit:null}];
  const today=new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'});
  // Watermark + branch sub-title: branch-specific
  const branch=(r.branch||DIVISION);
  const wmText=branch.toUpperCase();
  const wmSize=wmText.length<=10?'64px':wmText.length<=16?'52px':wmText.length<=22?'40px':'30px';
  const passDate=r.pass_date
    ? new Date(r.pass_date).toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'})
    : '—';
  const fp=(full,user)=>esc(full||user||'—');
  // Branch settings (from setup page)
  const addr   = settings?.address || '';
  const secPh  = settings?.chief_security_phone || '';
  const pmPh   = settings?.plant_manager_phone  || '';

  const itemRows=list.map((it,i)=>`
    <tr>
      <td class="num">${i+1}</td>
      <td>${esc(it.item_name||'')}</td>
      <td>${it.quantity!=null?esc(it.quantity):''}</td>
      <td>${esc(it.unit||'')}</td>
    </tr>`).join('');

  let stamp='';
  if(st==='APPROVED'){
    stamp=`<div class="gp-stamp approved">
      <div class="stamp-icon">✔</div>
      <div class="stamp-text">
        <b>APPROVED — VALID FOR MOVEMENT</b>
        Authorised by <b>${fp(r._approved_by_full_name,r.approved_by)}</b>${
          r.approved_at?' on '+esc(new Date(r.approved_at).toLocaleString('en-GB')):''}.
        Valid without a physical signature.
      </div></div>`;
  } else if(st==='REJECTED'){
    stamp=`<div class="gp-stamp rejected">
      <div class="stamp-icon">✕</div>
      <div class="stamp-text">
        <b>REJECTED — NOT VALID FOR MOVEMENT</b>
        Rejected by <b>${fp(r._approved_by_full_name,r.approved_by)}</b>${
          r.approved_at?' on '+esc(new Date(r.approved_at).toLocaleString('en-GB')):''}.
        ${r.reject_reason?'<br>Reason: '+esc(r.reject_reason):''}
      </div></div>`;
  } else {
    stamp=`<div class="gp-stamp pending">
      <div class="stamp-icon">⏳</div>
      <div class="stamp-text"><b>PENDING APPROVAL</b>
        Not valid for movement until approved on the system.
      </div></div>`;
  }

  return `<div class="gp-paper" id="gpPaper">

    <!-- Watermark: branch-specific -->
    <div class="gp-wm" style="font-size:${wmSize};">${wmText}</div>

    <!-- Header band -->
    <div class="gp-head">
      <img src="${LOGO_URI}" alt="Rumbu">
      <div class="co">
        <div class="co-name">${esc(COMPANY)}</div>
        <div class="co-email">info@rumbuindustries.com</div>
        <div class="co-sub">${esc(branch)} &mdash; Material Gate Pass</div>
        ${addr?`<div class="co-addr">📍 ${esc(addr)}</div>`:''}
      </div>
      <div class="badge-wrap">
        <span class="doc-type">Gate Pass</span>
        <span class="doc-no">${esc(r.gatepass_number||'—')}</span>
      </div>
    </div>

    <!-- Number strip -->
    <div class="gp-strip">
      <span class="gno">${esc(r.gatepass_number||'—')}</span>
      <span class="gdt">Pass Date: <b>${passDate}</b></span>
    </div>

    <!-- Body -->
    <div class="gp-body">
      <div class="gp-stitle">Pass Details</div>
      <table class="info-tbl">
        <tr><td class="k">Branch / Facility</td><td>${esc(r.branch||'')}</td></tr>
        <tr><td class="k">Gatepass Type</td><td>${esc(r.gatepass_type_name||'—')}</td></tr>
        <tr><td class="k">Person Carrying Out</td><td>${esc(r.person_name||'')}</td></tr>
        <tr><td class="k">Raised By</td><td>${fp(r._created_by_full_name,r.created_by_username)}</td></tr>
        ${r.description?`<tr><td class="k">Description</td><td>${esc(r.description)}</td></tr>`:''}
      </table>

      <div class="gp-stitle" style="margin-top:16px;">Items (${list.length})</div>
      <table class="items-tbl">
        <tr>
          <th style="width:34px;text-align:center;">#</th>
          <th>Item / Part Name</th>
          <th style="width:22%;">Quantity</th>
          <th style="width:20%;">Unit</th>
        </tr>
        ${itemRows}
      </table>

      ${stamp}

      <div class="gp-sign">
        <div class="sig-block">
          Issued By
          <div class="sig-name">${fp(r._created_by_full_name,r.created_by_username)}</div>
        </div>
        <div class="sig-block">Authorised By<div class="sig-name">&nbsp;</div></div>
        <div class="sig-block">Security / Gate Officer<div class="sig-name">&nbsp;</div></div>
      </div>
    </div>

    <!-- Contact strip: chief security + plant manager phones -->
    ${(secPh||pmPh)?`
    <div class="gp-contacts">
      ${secPh?`<span>📞 <b>Chief Security:</b> ${esc(secPh)}</span>`:''}
      ${pmPh?`<span>📞 <b>Plant Manager:</b> ${esc(pmPh)}</span>`:''}
    </div>`:''}

    <!-- Footer strip -->
    <div class="gp-footer">
      <span>${esc(COMPANY)} &mdash; ${esc(branch)}</span>
      <span>Printed: ${today}</span>
    </div>

  </div>`;
}

// ── PDF download (lazy-loads html2pdf only when needed) ───────────────
function downloadPDF(){
  if(!CURRENT) return;
  const btn=document.getElementById('dlBtn');
  const pst=document.getElementById('pdfStatus');
  btn.disabled=true; btn.textContent='Generating…'; pst.textContent='';

  function doGenerate(){
    const node=document.getElementById('gpPaper');
    const fname=(CURRENT.gatepass_number||'gatepass')+'.pdf';
    html2pdf().set({
      margin:0, filename:fname,
      image:{type:'jpeg',quality:0.98},
      html2canvas:{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false},
      jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}
    }).from(node).save()
      .then(()=>{btn.disabled=false;btn.textContent='⬇ Download PDF';})
      .catch(()=>{btn.disabled=false;btn.textContent='⬇ Download PDF';printPass();});
  }

  if(typeof html2pdf!=='undefined'){
    doGenerate();
  } else {
    pst.textContent='Loading PDF engine…';
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
    s.onload=()=>{pst.textContent='';doGenerate();};
    s.onerror=()=>{pst.textContent='';btn.disabled=false;btn.textContent='⬇ Download PDF';printPass();};
    document.head.appendChild(s);
  }
}

// ── Print (CSS @media print handles layout — no library needed) ───────
function printPass(){
  if(!CURRENT) return;
  // Clone the paper and print via a hidden iframe
  const paper=document.getElementById('gpPaper');
  if(!paper) return;
  const css=Array.from(document.styleSheets)
    .flatMap(ss=>{try{return Array.from(ss.cssRules).map(r=>r.cssText);}catch(e){return[];}})
    .join('\n');
  const html=`<!DOCTYPE html><html><head><style>
    @page{size:A4;margin:0;}
    *{box-sizing:border-box;}
    body{margin:0;padding:0;background:#fff;}
    ${css}
    .gp-paper{border:none;max-width:none;}
  </style></head><body>${paper.outerHTML}</body></html>`;
  const f=document.createElement('iframe');
  f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;';
  document.body.appendChild(f);
  const doc=f.contentWindow.document;
  doc.open(); doc.write(html); doc.close();
  f.onload=function(){
    try{f.contentWindow.focus();f.contentWindow.print();}
    catch(e){console.warn('print:',e);}
    setTimeout(()=>document.body.removeChild(f),1500);
  };
}

init();
