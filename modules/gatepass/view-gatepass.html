<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gatepass — View</title>
<link rel="stylesheet" href="../../styles.css">
<script>
  (function(){
    function apply(t){ if(t) document.documentElement.setAttribute("data-theme", t); }
    window.addEventListener("message", function(e){ if(e.data && e.data.rumbuTheme) apply(e.data.rumbuTheme); });
    try{ apply(localStorage.getItem("rumbu_theme")); }catch(e){}
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="../../auth.js"></script>
<style>
  :root{--navy:#1F3864;--blue:#2E75B6;--blue-dark:#1a5a9a;--muted:#6b7280;--red:#c0392b;--green:#1d8a4e;--amber:#d97706;}
  *{box-sizing:border-box;}
  body{font-family:var(--sans);background:var(--bg);margin:0;padding:18px;color:var(--text);}
  .wrap{max-width:1050px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;}
  .card h3{color:var(--navy);margin:0 0 4px;font-size:16px;}
  .card .sub{color:var(--blue);font-size:12px;margin:0 0 14px;}
  label{display:block;font-size:12px;font-weight:bold;color:var(--text);margin:10px 0 4px;}
  input,select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;background:var(--card);color:var(--text);}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
  .row > div{flex:1;min-width:150px;}
  button{padding:10px 14px;border:none;border-radius:8px;font-weight:bold;font-size:13px;cursor:pointer;background:var(--blue);color:#fff;}
  button:hover{background:var(--blue-dark);}
  button.mini{padding:6px 10px;font-size:12px;}
  button.grey{background:#6b7280;} button.grey:hover{background:#4b5563;}
  button.green{background:var(--green);} button.green:hover{background:#166a2c;}
  .status{margin-top:10px;font-weight:bold;font-size:13px;min-height:16px;}
  .status.ok{color:var(--green);} .status.err{color:var(--red);}
  #connStatus{font-size:12px;font-weight:bold;text-align:center;margin-bottom:10px;color:var(--muted);}
  table.list{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px;}
  table.list th,table.list td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;}
  table.list thead th{background:var(--navy);color:#fff;font-size:12px;}
  table.list tbody tr{cursor:pointer;}
  table.list tbody tr:nth-child(even){background:var(--bg);}
  table.list tbody tr:hover td{background:rgba(46,117,182,.10);}
  .tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:bold;color:#fff;}
  .tag.pending{background:var(--amber);}
  .tag.approved{background:var(--green);}
  .tag.rejected{background:var(--red);}
  .detail-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}

  /* ═══════════════════════════════════════════════════════════════
     GATE PASS DOCUMENT — on-screen preview
     ═══════════════════════════════════════════════════════════════ */
  .gp-paper{
    background:#fff;color:#000;
    max-width:720px;margin:0 auto;
    padding:0;
    border:1px solid #ccc;
    font-family:"Times New Roman",serif;
    position:relative;overflow:hidden;
  }

  /* ── Watermark ── */
  .gp-paper::before{
    content:"RUMBU MAINMAT";
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%) rotate(-42deg);
    font-size:68px;font-weight:900;
    color:rgba(31,56,100,.07);
    white-space:nowrap;pointer-events:none;z-index:0;
    letter-spacing:6px;font-family:Arial,sans-serif;
    width:120%;text-align:center;
  }

  /* ── Header band ── */
  .gp-head{
    background:linear-gradient(135deg,#1F3864 0%,#2E75B6 100%);
    color:#fff;padding:20px 28px 16px;
    display:flex;align-items:center;gap:18px;
    position:relative;z-index:1;
  }
  .gp-head .logo-img{
    width:60px;height:60px;border-radius:8px;
    background:#fff;padding:4px;flex:0 0 60px;
    object-fit:contain;
  }
  .gp-head .co-info{flex:1;}
  .gp-head .co-name{font-size:18px;font-weight:800;letter-spacing:.3px;margin:0 0 2px;color:#fff;}
  .gp-head .co-sub{font-size:11px;opacity:.88;letter-spacing:.8px;text-transform:uppercase;color:#fff;}
  .gp-head .doc-badge{
    text-align:right;flex:0 0 auto;
  }
  .gp-head .doc-badge .doc-type{
    font-size:13px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;
    background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);
    border-radius:6px;padding:4px 12px;color:#fff;display:inline-block;margin-bottom:6px;
  }
  .gp-head .doc-badge .doc-no{
    display:block;font-size:11px;opacity:.88;color:#fff;margin-top:2px;
  }

  /* ── Doc number strip ── */
  .gp-num-strip{
    background:#f0f4fa;border-bottom:2px solid #2E75B6;
    padding:8px 28px;display:flex;align-items:center;
    justify-content:space-between;font-size:12px;
    position:relative;z-index:1;
  }
  .gp-num-strip .gp-no{font-weight:800;font-size:14px;color:#1F3864;letter-spacing:.5px;}
  .gp-num-strip .gp-date{color:#4b5563;}

  /* ── Body content ── */
  .gp-body{padding:20px 28px;position:relative;z-index:1;}

  .gp-section-title{
    font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;
    color:#2E75B6;border-bottom:1.5px solid #2E75B6;
    padding-bottom:4px;margin:16px 0 10px;
  }

  /* Main info table */
  .gp-paper table.info-tbl{width:100%;border-collapse:collapse;font-size:12.5px;}
  .gp-paper table.info-tbl td{padding:7px 10px;border:1px solid #d1d5db;vertical-align:top;}
  .gp-paper table.info-tbl td.k{
    width:32%;font-weight:700;background:#f8fafc;color:#1F3864;border-right:2px solid #2E75B6;
  }
  .gp-paper table.info-tbl td.v{color:#111;line-height:1.45;}

  /* Items table */
  .gp-paper table.items-tbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px;}
  .gp-paper table.items-tbl th{
    background:#1F3864;color:#fff;padding:7px 10px;
    font-size:11px;font-weight:700;text-align:left;letter-spacing:.3px;
  }
  .gp-paper table.items-tbl td{padding:7px 10px;border:1px solid #d1d5db;vertical-align:top;}
  .gp-paper table.items-tbl tr:nth-child(even) td{background:#f8fafc;}
  .gp-paper table.items-tbl td.num{text-align:center;font-weight:700;color:#6b7280;width:34px;}

  /* Status stamp */
  .gp-stamp{
    margin:18px 0 0;border-radius:8px;padding:12px 16px;
    display:flex;align-items:flex-start;gap:12px;font-size:12.5px;line-height:1.5;
  }
  .gp-stamp.approved{background:#ecfdf5;border:2px solid #1d8a4e;color:#0f5c33;}
  .gp-stamp.rejected{background:#fff1f1;border:2px solid #c0392b;color:#8f2531;}
  .gp-stamp.pending{background:#fffbeb;border:2px solid #d97706;color:#9a5a08;}
  .gp-stamp .stamp-icon{font-size:22px;flex:0 0 auto;margin-top:2px;}
  .gp-stamp .stamp-text b{font-size:13px;display:block;margin-bottom:3px;letter-spacing:.3px;}

  /* Signature row */
  .gp-sign{
    display:flex;justify-content:space-between;gap:20px;
    margin-top:48px;padding-top:0;
  }
  .gp-sign .sig-block{
    flex:1;border-top:1.5px solid #1F3864;
    padding-top:8px;text-align:center;
    font-size:11.5px;color:#374151;
  }
  .gp-sign .sig-block .sig-name{font-weight:700;color:#1F3864;font-size:12px;margin-top:3px;}

  /* Footer strip */
  .gp-footer{
    background:#1F3864;color:rgba(255,255,255,.75);
    padding:8px 28px;font-size:10px;
    display:flex;justify-content:space-between;align-items:center;
    position:relative;z-index:1;margin-top:24px;
  }
</style>
</head>
<body>

<div class="wrap">
<div id="connStatus">Loading...</div>

<div id="listView">
  <div class="card">
    <h3>View Gatepass</h3>
    <p class="sub" id="scopeNote"></p>
    <div class="row">
      <div><label>From Date</label><input type="date" id="fromDate" onchange="applyFilters()"></div>
      <div><label>To Date</label><input type="date" id="toDate" onchange="applyFilters()"></div>
      <div>
        <label>Status</label>
        <select id="statusFilter" onchange="applyFilters()">
          <option value="">All</option><option value="pending">Pending</option>
          <option value="approved">Approved</option><option value="rejected">Rejected</option>
        </select>
      </div>
      <div><label>Gatepass Type</label><select id="typeFilter" onchange="applyFilters()"><option value="">All</option></select></div>
      <div><label>Search (part / person / number)</label><input type="text" id="search" placeholder="Type to filter" oninput="applyFilters()"></div>
      <div style="flex:0 0 auto;"><button onclick="loadRecords()">Refresh</button></div>
    </div>
    <div class="status" id="status"></div>
  </div>
  <div class="card">
    <p class="sub" style="margin:0 0 4px;">Click any gatepass to open it, then download the PDF or print.</p>
    <div id="tableWrap"></div>
  </div>
</div>

<div id="detailView" style="display:none;">
  <button class="grey" style="margin-bottom:12px;" onclick="backToList()">&larr; Back to list</button>
  <div class="card">
    <div class="detail-actions">
      <button class="green" onclick="downloadPDF()">&#11015; Download PDF</button>
      <button onclick="printPass()">&#128438; Print</button>
    </div>
    <div id="paperWrap"></div>
  </div>
</div>
</div>

const COMPANY  = "Rumbu Industries Limited";
const DIVISION = "Rumbu Mainmat";

let ME = null, ALL = [], CURRENT = null, CURRENT_ITEMS = [];

async function init(){
  const status = document.getElementById("connStatus");
  try{
    ME = await requireAuth("../../login.html");
    if(!ME) return;
    document.getElementById("scopeNote").textContent = ME.role === "super_admin"
      ? "Showing gatepasses from every Branch."
      : "Showing gatepasses for your own Branch only" + (ME.sectionName ? " (" + ME.sectionName + ")." : ".");
    status.style.color = "#1d8a4e"; status.textContent = "Connected.";
    await loadRecords();
  }catch(e){ status.style.color = "#c0392b"; status.textContent = "❌ " + e.message; console.error(e); }
}

function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

async function loadRecords(){
  const status = document.getElementById("status");
  status.className = "status"; status.textContent = "Loading...";
  try{
    let q = sb.from("hr_gatepass").select("*").order("created_at",{ascending:false});
    if(ME.role !== "super_admin"){
      if(ME.sectionNames && ME.sectionNames.length){ q = q.in("branch", ME.sectionNames); }
      else { q = q.eq("branch","___none___"); }
    }
    const { data, error } = await q;
    if(error) throw error;
    ALL = data || [];
    status.className = "status ok"; status.textContent = ALL.length + " gatepass(es) loaded.";
    populateTypeFilter();
    applyFilters();
  }catch(e){ status.className = "status err"; status.textContent = "❌ " + e.message; }
}
window.loadRecords = loadRecords;

function populateTypeFilter(){
  const sel = document.getElementById("typeFilter");
  const cur  = sel.value;
  const types = [...new Set(ALL.map(r=>r.gatepass_type_name).filter(Boolean))].sort();
  sel.innerHTML = "<option value="">All</option>" + types.map(t=>"<option value=""+esc(t)+"">"+esc(t)+"</option>").join("");
  if(types.indexOf(cur)!==-1) sel.value = cur;
}

function applyFilters(){
  const from   = document.getElementById("fromDate").value;
  const to     = document.getElementById("toDate").value;
  const st     = document.getElementById("statusFilter").value;
  const typeF  = document.getElementById("typeFilter").value;
  const search = document.getElementById("search").value.trim().toLowerCase();
  let rows = ALL.slice();
  if(from)   rows = rows.filter(r=>(r.pass_date||"")>=from);
  if(to)     rows = rows.filter(r=>(r.pass_date||"")<=to);
  if(st)     rows = rows.filter(r=>r.status===st);
  if(typeF)  rows = rows.filter(r=>r.gatepass_type_name===typeF);
  if(search) rows = rows.filter(r=>
    (r.gatepass_number||"").toLowerCase().includes(search)||
    (r.part_name||"").toLowerCase().includes(search)||
    (r.person_name||"").toLowerCase().includes(search)||
    (r.created_by_username||"").toLowerCase().includes(search));
  const wrap = document.getElementById("tableWrap");
  if(!rows.length){ wrap.innerHTML="<p class="sub" style="text-align:center;padding:20px;">No gatepasses found.</p>"; return; }
  let html = "<table class="list"><thead><tr><th>No.</th><th>Date</th><th>Type</th><th>Part / Item</th><th>Person</th><th>Qty</th><th>Branch</th><th>Status</th><th></th></tr></thead><tbody>";
  rows.forEach(r=>{
    const st2 = (r.status||"pending").toLowerCase();
    html += "<tr onclick="openDetail("+r.id+")">" +
      "<td>"+esc(r.gatepass_number||"")+"</td>" +
      "<td>"+esc(r.pass_date||"")+"</td>" +
      "<td>"+esc(r.gatepass_type_name||"")+"</td>" +
      "<td>"+esc(r.part_name||"")+"</td>" +
      "<td>"+esc(r.person_name||"")+"</td>" +
      "<td>"+(r.quantity!=null?esc(r.quantity):"")+"</td>" +
      "<td>"+esc(r.branch||"")+"</td>" +
      "<td><span class="tag "+st2+"">"+st2.toUpperCase()+"</span></td>" +
      "<td><button class="mini grey" onclick="event.stopPropagation();openDetail("+r.id+")" >View</button></td>" +
    "</tr>";
  });
  html += "</tbody></table>";
  wrap.innerHTML = html;
}

/* ═══════════════════════════════════════════════════════════════
   PAPER HTML — watermark, logo, professional layout
   ═══════════════════════════════════════════════════════════════ */
function paperHTML(r, items){
  const st    = (r.status||"pending").toUpperCase();
  const list  = (items&&items.length)?items:[{item_name:r.part_name,quantity:r.quantity,unit:null}];
  const today = new Date().toLocaleDateString("en-GB",{day:"2-digit",month:"long",year:"numeric"});
  const passDate = r.pass_date ? new Date(r.pass_date).toLocaleDateString("en-GB",{day:"2-digit",month:"long",year:"numeric"}) : "—";

  function fmtPerson(full,user){ return esc(full||user||"—"); }

  /* Items rows */
  let itemsRows = "";
  list.forEach((it,i)=>{
    itemsRows += "<tr>" +
      "<td class="num">"+(i+1)+"</td>" +
      "<td>"+esc(it.item_name||"")+"</td>" +
      "<td>"+(it.quantity!=null?esc(it.quantity):"")+"</td>" +
      "<td>"+esc(it.unit||"")+"</td>" +
    "</tr>";
  });

  /* Status stamp */
  let stamp = "";
  if(st==="APPROVED"){
    stamp = "<div class="gp-stamp approved">" +
      "<div class="stamp-icon">✔</div>" +
      "<div class="stamp-text"><b>APPROVED — VALID FOR MOVEMENT</b>" +
      "This gate pass was authorised on the system by <b>"+fmtPerson(r._approved_by_full_name,r.approved_by)+"</b>" +
      (r.approved_at?" on "+esc(new Date(r.approved_at).toLocaleString("en-GB")):"")+"." +
      " It is valid without a physical signature.</div></div>";
  } else if(st==="REJECTED"){
    stamp = "<div class="gp-stamp rejected">" +
      "<div class="stamp-icon">✕</div>" +
      "<div class="stamp-text"><b>REJECTED — NOT VALID FOR MOVEMENT</b>" +
      "Rejected by <b>"+fmtPerson(r._approved_by_full_name,r.approved_by)+"</b>" +
      (r.approved_at?" on "+esc(new Date(r.approved_at).toLocaleString("en-GB")):"")+"." +
      (r.reject_reason?"<br>Reason: "+esc(r.reject_reason):"")+"</div></div>";
  } else {
    stamp = "<div class="gp-stamp pending">" +
      "<div class="stamp-icon">⏳</div>" +
      "<div class="stamp-text"><b>PENDING APPROVAL</b>Not valid for material movement until approved on the system.</div></div>";
  }

  return [
    "<div class="gp-paper" id="gpPaper">",

    /* Watermark is handled by CSS ::before on .gp-paper */

    /* Header */
    "<div class="gp-head">",
      "<img class="logo-img" src=""+LOGO_URI+"" alt="Rumbu Logo">",
      "<div class="co-info">",
        "<div class="co-name">"+esc(COMPANY)+"</div>",
        "<div class="co-sub">"+esc(DIVISION)+" &mdash; Material Gate Pass</div>",
      "</div>",
      "<div class="doc-badge">",
        "<span class="doc-type">Gate Pass</span>",
        "<span class="doc-no">"+esc(r.gatepass_number||"—")+"</span>",
      "</div>",
    "</div>",

    /* Number strip */
    "<div class="gp-num-strip">",
      "<span class="gp-no">"+esc(r.gatepass_number||"—")+"</span>",
      "<span class="gp-date">Pass Date: <b>"+passDate+"</b></span>",
    "</div>",

    /* Body */
    "<div class="gp-body">",
      "<div class="gp-section-title">Pass Details</div>",
      "<table class="info-tbl">",
        "<tr><td class="k">Branch / Facility</td><td class="v">"+esc(r.branch||"")+"</td></tr>",
        "<tr><td class="k">Gatepass Type</td><td class="v">"+esc(r.gatepass_type_name||"—")+"</td></tr>",
        "<tr><td class="k">Person Carrying Out</td><td class="v">"+esc(r.person_name||"")+"</td></tr>",
        "<tr><td class="k">Raised By</td><td class="v">"+fmtPerson(r._created_by_full_name,r.created_by_username)+"</td></tr>",
        (r.description?"<tr><td class="k">Description / Purpose</td><td class="v">"+esc(r.description)+"</td></tr>":""),
      "</table>",

      "<div class="gp-section-title" style="margin-top:18px;">Items ("+list.length+")</div>",
      "<table class="items-tbl">",
        "<tr><th style="width:34px;text-align:center;">#</th><th>Item / Part Name</th><th style="width:22%;">Quantity</th><th style="width:20%;">Unit</th></tr>",
        itemsRows,
      "</table>",

      stamp,

      "<div class="gp-sign">",
        "<div class="sig-block"><span>Issued By</span><div class="sig-name">"+fmtPerson(r._created_by_full_name,r.created_by_username)+"</div></div>",
        "<div class="sig-block"><span>Authorised By</span><div class="sig-name">&nbsp;</div></div>",
        "<div class="sig-block"><span>Security / Gate Officer</span><div class="sig-name">&nbsp;</div></div>",
      "</div>",

    "</div>",

    /* Footer strip */
    "<div class="gp-footer">",
      "<span>"+esc(COMPANY)+" &mdash; "+esc(DIVISION)+"</span>",
      "<span>Printed: "+today+"</span>",
    "</div>",

    "</div>"
  ].join("");
}

async function fetchItems(id){
  const {data,error} = await sb.from("hr_gatepass_items")
    .select("item_name,quantity,unit").eq("gatepass_id",id).order("id");
  if(error){ console.warn("Items:",error.message); return []; }
  return data||[];
}

async function openDetail(id){
  const r = ALL.find(x=>x.id===id);
  if(!r) return;
  CURRENT = r; CURRENT_ITEMS = [];
  document.getElementById("paperWrap").innerHTML = "<p class="sub">Loading…</p>";
  document.getElementById("listView").style.display  = "none";
  document.getElementById("detailView").style.display = "block";
  try{ window.scrollTo(0,0); }catch(e){}
  CURRENT_ITEMS = await fetchItems(id);
  const usernamesToResolve = [r.created_by_username,r.approved_by].filter(Boolean);
  if(usernamesToResolve.length){
    const {data:empRows} = await sb.from("employees")
      .select("employee_id,full_name").in("employee_id",usernamesToResolve);
    const nm = {};
    (empRows||[]).forEach(e=>{ nm[e.employee_id]=e.full_name; });
    r._created_by_full_name  = nm[r.created_by_username]||null;
    r._approved_by_full_name = nm[r.approved_by]||null;
  }
  document.getElementById("paperWrap").innerHTML = paperHTML(r,CURRENT_ITEMS);
}
window.openDetail = openDetail;

function backToList(){
  document.getElementById("detailView").style.display = "none";
  document.getElementById("listView").style.display   = "block";
  CURRENT = null;
  try{ window.scrollTo(0,0); }catch(e){}
}
window.backToList = backToList;

/* ── Download PDF ── */
function downloadPDF(){
  if(!CURRENT) return;
  const node  = document.getElementById("gpPaper");
  const fname = (CURRENT.gatepass_number||"gatepass")+".pdf";
  if(typeof html2pdf==="undefined"){ printPass(); return; }
  const opt = {
    margin:0,
    filename:fname,
    image:{type:"jpeg",quality:0.98},
    html2canvas:{scale:2,backgroundColor:"#ffffff",useCORS:true,logging:false},
    jsPDF:{unit:"mm",format:"a4",orientation:"portrait"}
  };
  html2pdf().set(opt).from(node).save().catch(()=>printPass());
}
window.downloadPDF = downloadPDF;

/* ── Print ── */
function printPass(){
  if(!CURRENT) return;
  const printCSS = ;
  const html = "<html><head><style>"+printCSS+"</style></head><body>"+paperHTML(CURRENT,CURRENT_ITEMS)+"</body></html>";
  const frame = document.createElement("iframe");
  frame.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0;";
  document.body.appendChild(frame);
  const doc = frame.contentWindow.document;
  doc.open(); doc.write(html); doc.close();
  frame.onload = function(){
    try{ frame.contentWindow.focus(); frame.contentWindow.print(); }
    catch(e){ console.warn("Print failed:",e); }
    setTimeout(()=>{ document.body.removeChild(frame); },1500);
  };
}
window.printPass = printPass;

init();
</script>
