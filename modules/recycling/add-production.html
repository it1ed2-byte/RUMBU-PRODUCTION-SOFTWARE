<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Recycling — Enter Production</title>
<link rel="stylesheet" href="../../styles.css">
<script>
  (function(){
    function apply(t){ if(t) document.documentElement.setAttribute("data-theme", t); }
    window.addEventListener("message", function(e){ if(e.data && e.data.rumbuTheme) apply(e.data.rumbuTheme); });
    try{ apply(localStorage.getItem("rumbu_theme")); }catch(e){}
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../auth.js"></script>
<style>
  :root{
    --navy:var(--heading); --blue:var(--accent); --blue-dark:var(--accent-2);
      
    --red:var(--bad); --green:var(--ok);
  }
  *{box-sizing:border-box;}
  body{font-family:var(--sans);background:var(--bg);margin:0;padding:18px;color:var(--text);}
  .wrap{max-width:520px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:16px;}
  h3{color:var(--navy);margin:0 0 16px;font-size:16px;
    border-bottom:2px solid var(--navy);padding-bottom:8px;}
  label{display:block;font-size:12px;font-weight:bold;color:#374151;margin:0 0 4px;}
  input,select{
    width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;
    font-size:14px;font-family:inherit;margin-bottom:14px;
  }
  input:focus,select:focus{outline:2px solid var(--blue);border-color:var(--blue);}
  input[readonly]{background:var(--bg);color:var(--muted);cursor:default;}
  /* Operator ID lookup row */
  .op-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:0;}
  .op-row input{margin-bottom:0;}
  .op-lookup-note{font-size:11px;font-weight:700;margin-top:-10px;margin-bottom:14px;min-height:16px;}
  .op-lookup-note.ok  {color:var(--green);}
  .op-lookup-note.err {color:var(--red);}
  .op-lookup-note.wait{color:var(--warn);}
  /* several operators per machine */
  .op-add{display:flex;gap:8px;align-items:stretch;}
  .op-add input{margin-bottom:0;flex:1;min-width:0;}
  .op-add + .op-lookup-note{margin-top:6px;margin-bottom:8px;}
  .op-chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;}
  .op-chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 12px;font-size:12.5px;font-weight:600;}
  .op-chip button{border:none;background:var(--line);color:var(--text);width:20px;height:20px;border-radius:50%;cursor:pointer;font-size:11px;line-height:1;padding:0;}
  .op-count{font-size:11px;color:var(--muted);margin:-6px 0 14px;}
  /* downtime */
  .dt-row{display:flex;gap:12px;}
  .dt-row>div{flex:1;min-width:0;}
  .dt-total{margin:0 0 14px;padding:9px 12px;border-radius:8px;font-size:13px;font-weight:700;
    background:#eff6ff;border:1px solid #bfdbfe;color:var(--navy);}
  .dt-total.ok{background:#f0fdf4;border-color:#bbf7d0;color:var(--green);}
  .dt-total.err{background:#fef2f2;border-color:#fecaca;color:var(--red);}
  /* NOT called ".main": styles.css already uses .main for the whole page area (height:100vh), which made this button as tall as the screen. */
  button.btn-save{
    display:block;width:auto;min-width:200px;height:auto;margin:6px auto 0;padding:11px 28px;
    border:none;border-radius:8px;
    font-weight:bold;font-size:14px;cursor:pointer;
    background:var(--blue);color:#fff;
  }
  button.btn-save:hover{background:var(--blue-dark);}
  button.btn-save:disabled{background:#94a3b8;cursor:not-allowed;}
  .status{
    margin-top:10px;font-weight:bold;font-size:13px;
    padding:10px 14px;border-radius:8px;display:none;
  }
  .status.err {color:var(--red);  background:#fef2f2;border:1px solid #fecaca;}
  .status.ok  {color:var(--green);background:#f0fdf4;border:1px solid #bbf7d0;}
  .status.info{color:var(--navy); background:#eff6ff;border:1px solid #bfdbfe;}
  #connStatus{font-size:12px;font-weight:bold;text-align:center;margin-bottom:10px;}
</style>
</head>
<body>

<div class="wrap">

  <div id="connStatus">Loading...</div>

  <div id="appArea" style="display:none;">
    <div class="card">
      <h3>♻️ Enter Recycling Production</h3>

      <label>Production Date</label>
      <input type="date" id="prodDate">

      <label>Shift</label>
      <select id="shift">
        <option value="">— Select Shift —</option>
        <option value="Morning">Morning (7 am – 2 pm)</option>
        <option value="Afternoon">Afternoon (2 pm – 10 pm)</option>
        <option value="Night">Night (10 pm – 7 am)</option>
      </select>

      <label>Branch</label>
      <select id="branch"></select>

      <label>Machine</label>
      <select id="asset" onchange="onAssetChange()">
        <option value="">— Select Machine —</option>
      </select>

      <label>Target KG (per shift)</label>
      <input type="text" id="targetKg" readonly
             placeholder="Auto-filled when machine is selected">

      <label>KG Produced</label>
      <input type="number" id="kgProduced" min="0" step="0.1" placeholder="0.0">

      <!-- Downtime: Yes shows the time fields; the duration is worked out automatically -->
      <label>Was there downtime? <span style="color:var(--red);">*</span></label>
      <select id="downtimeSel" onchange="onDowntimeChange()">
        <option value="">— Select —</option>
        <option value="No">No</option>
        <option value="Yes">Yes</option>
      </select>

      <div id="downtimeBox" style="display:none;">
        <div class="dt-row">
          <div><label>Start Time</label><input type="time" id="dtStart" oninput="calcDowntime()"></div>
          <div><label>End Time</label><input type="time" id="dtEnd" oninput="calcDowntime()"></div>
        </div>
        <label>Reason for Downtime</label>
        <input type="text" id="dtReason" maxlength="200" placeholder="e.g. motor fault, power outage, waiting for material" autocomplete="off">
        <div class="dt-total" id="dtTotal">Downtime: enter the start and end time</div>
      </div>

      <!-- Operators: one or more Recycling employees per machine -->
      <label>Operators <span style="font-weight:400;color:var(--muted);">(add everyone who ran this machine)</span></label>
      <div class="op-add">
        <input type="text" id="opInput" list="opList" placeholder="Search a name or employee ID, then pick from the list" autocomplete="off">
        <datalist id="opList"></datalist>
      </div>
      <div class="op-lookup-note" id="opNote"></div>
      <div class="op-chips" id="opChips"></div>

      <button class="btn-save" id="submitBtn" onclick="submitEntry()">
        Save Production Entry
      </button>
      <div class="status" id="status"></div>
    </div>
  </div>
</div>

<script>
let ME = null, MY_SECTIONS = [], ASSETS = [];
let OP_MAP = {}; // kept for compatibility
const OP_SEP = " | ";   // several operators are stored in the same two columns, separated by " | "
const MAX_OPERATORS = 10;
let OPERATORS = [];     // every Recycling employee: { employee_id, full_name }
let CHOSEN = [];        // operators added to the entry being filled in
function esc(t){ return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function authHeaders(){
  return {
    "apikey":        SUPABASE_ANON_KEY,
    "Authorization": "Bearer " + SUPABASE_ANON_KEY,
    "Content-Type":  "application/json"
  };
}

function today(){
  return new Date().toISOString().slice(0, 10);
}

// ── Init ──────────────────────────────────────────────────
async function init(){
  const cs = document.getElementById("connStatus");
  try{
    ME = await requireAuth("../../login.html");
    if(!ME) return;

    MY_SECTIONS = (ME.sectionNames && ME.sectionNames.length)
      ? ME.sectionNames.filter(s => ["Rumbu Mainmat","MamaSannu"].includes(s))
      : ["Rumbu Mainmat","MamaSannu"];
    if(!MY_SECTIONS.length) MY_SECTIONS = ["Rumbu Mainmat","MamaSannu"];

    // Branch dropdown
    const branchSel = document.getElementById("branch");
    branchSel.innerHTML = MY_SECTIONS.map(s =>
      `<option value="${s}">${s === "MamaSannu" ? "Mama Sannu" : s}</option>`
    ).join("");

    document.getElementById("prodDate").value = today();
    await loadAssets();
    await loadOperators();

    cs.style.color = "#1d8a4e";
    cs.textContent = "✔ Connected.";
    document.getElementById("appArea").style.display = "block";

  }catch(e){
    cs.style.color = "#c0392b";
    cs.textContent = "❌ " + e.message;
    console.error(e);
  }
}

// ── Load active machines ───────────────────────────────────
async function loadAssets(){
  const res = await fetch(
    SUPABASE_URL + "/rest/v1/recycling_assets" +
    "?select=asset_code,asset_name,target_kg&is_active=eq.true&order=asset_code.asc",
    { headers: authHeaders() }
  );
  if(!res.ok) throw new Error("recycling_assets: HTTP " + res.status);
  ASSETS = await res.json();
  const sel = document.getElementById("asset");
  sel.innerHTML = '<option value="">— Select Machine —</option>' +
    ASSETS.map(a =>
      `<option value="${a.asset_code}" data-target="${a.target_kg}">${a.asset_name}</option>`
    ).join("");
}

// ── Machine selection → auto-fill target ──────────────────
function onAssetChange(){
  const sel = document.getElementById("asset");
  const opt = sel.options[sel.selectedIndex];
  const tkg = opt && opt.dataset.target ? parseFloat(opt.dataset.target) : 0;
  document.getElementById("targetKg").value = tkg
    ? tkg.toLocaleString(undefined, { maximumFractionDigits: 1 }) + " KG"
    : "";
}

// ── Load all Recycling employees (used by the operator search box) ──
// Uses sb (Supabase client from auth.js) so the authenticated
// session token is sent — required for RLS to allow the read.
function opLabel(o){ return o.full_name + " (" + o.employee_id + ")"; }
function setOpNote(text, cls){
  const note = document.getElementById("opNote");
  note.textContent = text || ""; note.className = "op-lookup-note" + (cls ? " " + cls : "");
}
async function loadOperators(){
  try{
    // OR filter — any employee where department OR unit contains RECYCLING
    const { data: rows, error } = await sb
      .from("employees")
      .select("employee_id, full_name")
      .or("department.ilike.%RECYCLING%,unit.ilike.%RECYCLING%")
      .order("full_name");

    if(error) throw new Error(error.message);

    OPERATORS = rows || [];
    if(!OPERATORS.length){
      setOpNote("No employees found with department = RECYCLING.", "err");
      return;
    }
    document.getElementById("opList").innerHTML =
      OPERATORS.map(o => `<option value="${esc(opLabel(o))}"></option>`).join("");
    setOpNote(OPERATORS.length + " Recycling staff loaded.", "ok");
  }catch(e){
    setOpNote("⚠️ Could not load staff: " + e.message, "err");
  }
}

// ── Operators on this entry ────────────────────────────────
function renderChips(){
  const box = document.getElementById("opChips");
  box.innerHTML = CHOSEN.map(o =>
    `<span class="op-chip">${esc(opLabel(o))}<button type="button" data-rm="${esc(o.employee_id)}" title="Remove">✕</button></span>`
  ).join("") + (CHOSEN.length ? `<div class="op-count" style="width:100%;margin:2px 0 0;">${CHOSEN.length} operator${CHOSEN.length===1?"":"s"} on this machine</div>` : "");
}
function addOperator(){
  const inp = document.getElementById("opInput");
  const v = inp.value.trim();
  if(!v) return;
  const low = v.toLowerCase();
  let match = OPERATORS.find(o => opLabel(o).toLowerCase() === low)
           || OPERATORS.find(o => String(o.employee_id).toLowerCase() === low);
  if(!match){
    const part = OPERATORS.filter(o => opLabel(o).toLowerCase().includes(low));
    if(part.length === 1) match = part[0];
    else { setOpNote(part.length ? part.length + " staff match \"" + v + "\". Pick one from the list." : "No Recycling staff match \"" + v + "\".", "err"); return; }
  }
  if(CHOSEN.some(c => c.employee_id === match.employee_id)){ setOpNote(match.full_name + " is already added.", "wait"); inp.value = ""; return; }
  if(CHOSEN.length >= MAX_OPERATORS){ setOpNote("At most " + MAX_OPERATORS + " operators per machine.", "err"); return; }
  CHOSEN.push(match);
  inp.value = "";
  setOpNote("Added " + match.full_name + ".", "ok");
  renderChips();
  inp.focus();
}
function removeOperator(id){
  CHOSEN = CHOSEN.filter(c => c.employee_id !== id);
  setOpNote("", "");
  renderChips();
}
document.getElementById("opChips").addEventListener("click", e => {
  const b = e.target.closest && e.target.closest("[data-rm]");
  if(b) removeOperator(b.getAttribute("data-rm"));
});
document.getElementById("opInput").addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); addOperator(); } });
// choosing a name from the list adds it straight away
document.getElementById("opInput").addEventListener("input", e => {
  const v = e.target.value.trim().toLowerCase();
  if(v && OPERATORS.some(o => opLabel(o).toLowerCase() === v)) addOperator();
});

// ── Downtime ───────────────────────────────────────────────
const SHIFT_MINUTES = { Morning: 420, Afternoon: 480, Night: 540 };   // 7 h, 8 h, 9 h
function toMin(t){ const p = String(t).split(":"); return Number(p[0]) * 60 + Number(p[1]); }
function fmtDuration(min){ const h = Math.floor(min / 60), m = min % 60; return h && !m ? h + " h" : (h ? h + " h " : "") + m + " min"; }
// Works out the minutes between start and end. A Night shift may cross midnight (e.g. 23:30 to 00:40).
function downtimeMinutes(){
  const s = document.getElementById("dtStart").value, e = document.getElementById("dtEnd").value;
  const shift = document.getElementById("shift").value;
  if(!s || !e) return { minutes: null, error: null };
  const a = toMin(s); let b = toMin(e);
  if(b === a) return { minutes: null, error: "Start and end time cannot be the same." };
  if(b < a){
    if(shift === "Night") b += 1440;
    else return { minutes: null, error: "End time must be after the start time." };
  }
  const mins = b - a, max = SHIFT_MINUTES[shift];
  if(max && mins > max) return { minutes: null, error: "That is longer than the " + shift + " shift (" + fmtDuration(max) + ")." };
  return { minutes: mins, error: null };
}
function calcDowntime(){
  const box = document.getElementById("dtTotal"), r = downtimeMinutes();
  if(r.error){ box.textContent = r.error; box.className = "dt-total err"; return; }
  if(r.minutes == null){ box.textContent = "Downtime: enter the start and end time"; box.className = "dt-total"; return; }
  box.textContent = "Downtime: " + fmtDuration(r.minutes) + " (" + r.minutes + " minutes)";
  box.className = "dt-total ok";
}
function onDowntimeChange(){
  const yes = document.getElementById("downtimeSel").value === "Yes";
  document.getElementById("downtimeBox").style.display = yes ? "block" : "none";
  if(!yes){ document.getElementById("dtStart").value = ""; document.getElementById("dtEnd").value = ""; document.getElementById("dtReason").value = ""; }
  calcDowntime();
}
document.getElementById("shift").addEventListener("change", calcDowntime);   // the Night rule depends on the shift

// ── Submit ─────────────────────────────────────────────────
async function submitEntry(){
  const btn       = document.getElementById("submitBtn");
  const date      = document.getElementById("prodDate").value;
  const shift     = document.getElementById("shift").value;
  const branch    = document.getElementById("branch").value;
  const assetSel  = document.getElementById("asset");
  const assetCode = assetSel.value;
  const kg        = parseFloat(document.getElementById("kgProduced").value);

  if(!date)                { showStatus("err","Select a production date."); return; }
  if(!shift)               { showStatus("err","Select a shift."); return; }
  if(!branch)              { showStatus("err","Select a branch."); return; }
  if(!assetCode)           { showStatus("err","Select a machine."); return; }
  if(isNaN(kg) || kg < 0) { showStatus("err","Enter a valid KG produced value."); return; }

  // downtime: a Yes/No answer is required; Yes needs start, end and a reason
  const dtAnswer = document.getElementById("downtimeSel").value;
  if(!dtAnswer) { showStatus("err","Answer \"Was there downtime?\" with Yes or No."); return; }
  let dtStart = null, dtEnd = null, dtMinutes = 0, dtReason = null;
  if(dtAnswer === "Yes"){
    dtStart = document.getElementById("dtStart").value;
    dtEnd   = document.getElementById("dtEnd").value;
    dtReason = document.getElementById("dtReason").value.trim();
    if(!dtStart || !dtEnd) { showStatus("err","Enter the downtime start time and end time."); return; }
    const dt = downtimeMinutes();
    if(dt.error) { showStatus("err", dt.error); return; }
    if(!dtReason) { showStatus("err","Enter the reason for the downtime."); return; }
    dtMinutes = dt.minutes;
  }

  // Picking a name from the list adds it straight away. If a name was typed but not picked, add it now when it is a
  // clear match; otherwise stop, so nobody is left out of the entry by accident.
  if(document.getElementById("opInput").value.trim()) addOperator();
  if(document.getElementById("opInput").value.trim()){
    showStatus("err","The operator you typed was not added. Pick the name from the list, or clear the box.");
    return;
  }
  // several operators are saved in the same two columns, joined with " | " (an entry with none saves null, as before)
  const operatorId   = CHOSEN.length ? CHOSEN.map(o => o.employee_id).join(OP_SEP) : null;
  const operatorName = CHOSEN.length ? CHOSEN.map(o => o.full_name).join(OP_SEP) : null;

  btn.disabled = true;
  showStatus("info","Saving...");

  try{
    const res = await fetch(
      SUPABASE_URL + "/rest/v1/recycling_production",
      {
        method:  "POST",
        headers: Object.assign({}, authHeaders(), { "Prefer": "return=minimal" }),
        body: JSON.stringify({
          production_date: date,
          shift,
          branch,
          asset_code:    assetCode,
          kg_produced:   kg,
          operator_id:   operatorId,
          operator_name: operatorName,
          entered_by:    ME.username || "",
          had_downtime:     dtAnswer === "Yes",
          downtime_start:   dtStart,
          downtime_end:     dtEnd,
          downtime_minutes: dtMinutes,
          downtime_reason:  dtReason
        })
      }
    );

    if(res.status === 409){
      throw new Error("An entry for this machine, shift and date already exists.");
    }
    if(!res.ok){
      const j = await res.json().catch(()=>({}));
      const msg = j.message || j.details || ("Save failed (HTTP " + res.status + ").");
      if(/downtime/i.test(msg) && /column/i.test(msg)){
        throw new Error("The database does not have the downtime columns yet. Please ask IT to run the downtime database update, then try again.");
      }
      throw new Error(msg);
    }

    const machineName = assetSel.options[assetSel.selectedIndex].text;
    showStatus("ok","✅ Saved — " + machineName + " · " + shift + " · " + date +
      (CHOSEN.length ? " · " + CHOSEN.length + " operator" + (CHOSEN.length===1?"":"s") : "") +
      (dtAnswer === "Yes" ? " · downtime " + fmtDuration(dtMinutes) : ""));

    // Reset form — keep date, shift, branch for fast back-to-back entry
    document.getElementById("asset").value        = "";
    document.getElementById("targetKg").value     = "";
    document.getElementById("kgProduced").value   = "";
    CHOSEN = []; renderChips(); setOpNote("", "");
    document.getElementById("downtimeSel").value = ""; onDowntimeChange();

  }catch(e){
    showStatus("err","❌ " + e.message);
  } finally {
    btn.disabled = false;
  }
}

function showStatus(type, msg){
  const el = document.getElementById("status");
  el.className   = "status " + type;
  el.textContent = msg;
  el.style.display = msg ? "block" : "none";
}

init();
</script>
</body>
</html>
