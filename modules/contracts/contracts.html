<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Government Contracts</title>
<script src="auth-contracts.js"></script>
<script src="sidebar-contracts.js"></script>
<link rel="stylesheet" href="contracts.css">
<style>
.contract-title{font-weight:600;font-size:13.5px;color:var(--heading);margin-top:3px}
.agency-name{font-size:12.5px;color:var(--muted)}
td.clickable{cursor:pointer}
</style>
</head>
<body>
<div class="page-hdr">
  <div class="ph-left">
    <div class="ph-icon">📋</div>
    <div>
      <div class="ph-title">Government Contracts</div>
      <div class="ph-sub" id="ph-sub">Loading…</div>
    </div>
  </div>
  <div class="ph-right">
    <button class="btn btn-hdr" onclick="openNew()">＋ New Contract</button>
    <button class="btn btn-hdr" id="admin-btn" style="display:none" onclick="goAdmin()">⚙ Manage Users</button>
  </div>
</div>

<div style="display:flex;gap:10px;flex-wrap:wrap;padding:14px 20px;
     background:#fff;border-bottom:1px solid #e2e8f0" id="stat-bar"></div>

<div class="content">
  <div id="loading" class="loading-wrap">
    <div class="spinner"></div>
    <div class="loading-txt">Loading contracts…</div>
  </div>

  <div id="app" style="display:none">
    <!-- Stats -->
    <div class="stats">
      <div class="stat-card">
        <span class="stat-icon">📄</span>
        <div class="stat-val" id="s-total">—</div>
        <div class="stat-lbl">Total Contracts</div>
      </div>
      <div class="stat-card ok-c">
        <span class="stat-icon">✅</span>
        <div class="stat-val" id="s-active">—</div>
        <div class="stat-lbl">Ongoing</div>
      </div>
      <div class="stat-card warn-c">
        <span class="stat-icon">⏳</span>
        <div class="stat-val" id="s-pipeline">—</div>
        <div class="stat-lbl">Pipeline / On Hold</div>
      </div>
      <div class="stat-card info-c">
        <span class="stat-icon">🏁</span>
        <div class="stat-val" id="s-completed">—</div>
        <div class="stat-lbl">Completed</div>
      </div>
      <div class="stat-card" style="border-left-color:#7C3AED">
        <span class="stat-icon">💰</span>
        <div class="stat-val sm" id="s-value">—</div>
        <div class="stat-lbl">Total Portfolio Value</div>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <input class="srch" id="q" type="search" placeholder="🔍  Search by title or reference…" oninput="render()">
      <select class="flt" id="fAgency" onchange="render()"><option value="">All Agencies</option></select>
      <select class="flt" id="fStatus" onchange="render()">
        <option value="">All Statuses</option>
        <option value="Pipeline">Pending</option>
        <option value="Active">Ongoing</option>
        <option value="On Hold">On Hold</option>
        <option value="At Risk">At Risk</option>
        <option value="Delayed">Delayed</option>
        <option value="Practically Complete">Practically Complete</option>
        <option value="Closed">Completed</option>
        <option value="Cancelled">Cancelled</option>
      </select>
      <select class="flt" id="fRisk" onchange="render()">
        <option value="">All Risk Levels</option>
        <option value="critical">🔴 Critical</option>
        <option value="high">🟠 High</option>
        <option value="medium">🟡 Medium</option>
        <option value="low">🟢 Low</option>
      </select>
    </div>

    <!-- Table -->
    <div class="tbl-wrap">
      <div class="tbl-scroll">
        <table>
          <thead>
            <tr>
              <th>Contractor</th>
              <th>Contract</th>
              <th>Risk</th>
              <th>Agency</th>
              <th>Value</th>
              <th>Dates</th>
              <th>Open Actions</th>
              <th>Status</th>
              <th>Escalation Flags</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
let sb, rows = [];

async function init() {
  try {
    const auth = await guardPage();
    if (!auth) return;
    sb = auth.sb;
    window._sb = sb;

    if (auth.permissions.has('users.manage'))
      document.getElementById('admin-btn').style.display = 'inline-flex';

    document.getElementById('ph-sub').textContent =
      'Welcome, ' + (auth.profile.full_name ?? 'Contractor') +
      ' · ' + new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'});

    const [cRes, aRes] = await Promise.all([
      sb.from('cnt_contracts').select(`
        id,contract_id,title,status,risk_level,original_value,
        start_date,original_completion_date,physical_progress_pct,financial_progress_pct,
        cnt_agencies(id,name),cnt_companies(id,name)
      `).order('created_at',{ascending:false}),
      sb.from('cnt_agencies').select('id,name').order('name')
    ]);

    rows = cRes.data ?? [];
    window._contracts = rows;
    // Populate status totals bar
    (function() {
      const norm = s => (s||'').toLowerCase();
      const counts = {};
      rows.forEach(c => { const s = norm(c.status); counts[s] = (counts[s]||0)+1; });
      const LABELS = {active:'Active',pipeline:'Pipeline',completed:'Completed',
                      on_hold:'On Hold',terminated:'Terminated',closeout:'Closeout'};
      const COLORS = {active:'#22c55e',pipeline:'#2E75B6',completed:'#10b981',
                      on_hold:'#f59e0b',terminated:'#ef4444',closeout:'#6b7280'};
      const el = document.getElementById('stat-bar');
      if (!el) return;
      const pill = (lbl,val,col) =>
        '<div style="background:'+col+'11;border:1px solid '+col+'44;border-radius:7px;'+
        'padding:6px 14px;display:flex;gap:8px;align-items:center">'+
        '<span style="font-size:18px;font-weight:900;color:'+col+'">'+val+'</span>'+
        '<span style="font-size:12px;color:#374151;font-weight:600">'+lbl+'</span></div>';
      el.innerHTML = pill('Total Contracts', rows.length, '#1F3864') +
        Object.entries(counts).map(([s,n]) =>
          pill(LABELS[s]||s, n, COLORS[s]||'#6b7280')).join('');
    })();

    (aRes.data ?? []).forEach(a => {
      const o = document.createElement('option');
      o.value = a.id; o.textContent = a.name;
      document.getElementById('fAgency').appendChild(o);
    });

    const totalVal = rows.reduce((s,r) => s + (r.original_value ?? 0), 0);
    document.getElementById('s-total').textContent     = rows.length;
    document.getElementById('s-active').textContent    = rows.filter(r=>r.status==='active').length;
    document.getElementById('s-pipeline').textContent  = rows.filter(r=>r.status==='pipeline'||r.status==='on_hold').length;
    document.getElementById('s-completed').textContent = rows.filter(r=>r.status==='completed').length;
    document.getElementById('s-value').textContent     = totalVal >= 1e9
      ? 'NGN ' + (totalVal/1e9).toFixed(2) + 'B'
      : totalVal >= 1e6
      ? 'NGN ' + (totalVal/1e6).toFixed(2) + 'M'
      : 'NGN ' + totalVal.toLocaleString('en-NG');

    render();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  } catch(e) {
    document.getElementById('loading').innerHTML =
      `<div style="color:var(--bad);text-align:center;padding:40px">
        <div style="font-size:32px;margin-bottom:10px">⚠️</div>
        <strong>Failed to load contracts</strong><br>
        <span style="font-size:12px;color:var(--muted)">${e.message}</span>
      </div>`;
    console.error(e);
  }
}

const STATUS_BADGE = {
  pipeline:  ['b-navy',  'Pipeline'],
  awarded:   ['b-info',  'Awarded'],
  active:    ['b-ok',    'Active'],
  on_hold:   ['b-warn',  'On Hold'],
  completed: ['b-gray',  'Completed'],
  terminated:['b-bad',   'Terminated'],
  closeout:  ['b-gold',  'Closeout'],
};

const RISK_BADGE = {
  low:      ['b-ok',   '🟢 Low'],
  medium:   ['b-warn', '🟡 Medium'],
  high:     ['b-orange','🟠 High'],
  critical: ['b-bad',  '🔴 Critical'],
};

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function render() {
  const q  = document.getElementById('q').value.toLowerCase();
  const st = document.getElementById('fStatus').value;
  const ag = document.getElementById('fAgency').value;
  const rk = document.getElementById('fRisk').value;

  const data = rows.filter(r => {
    if (q && !r.title?.toLowerCase().includes(q) && !r.contract_id?.toLowerCase().includes(q)) return false;
    if (st && r.status !== st) return false;
    if (ag && r.cnt_agencies?.id !== ag) return false;
    if (rk && r.risk_level !== rk) return false;
    return true;
  });

  const tbody = document.getElementById('tbody');
  if (!data.length) {
    tbody.innerHTML = `<tr><td colspan="9">
      <div class="empty-state">
        <span class="e-icon">📋</span>
        <p>${rows.length ? 'No contracts match your filters.' : 'No contracts yet. Click <strong>New Contract</strong> to create the first one.'}</p>
      </div></td></tr>`;
    return;
  }

  tbody.innerHTML = data.map(r => {
    const pp    = Math.min(100, r.physical_progress_pct ?? 0);
    const fp    = Math.min(100, r.financial_progress_pct ?? 0);
    const ppCol = pp >= 80 ? 'var(--ok)' : pp >= 40 ? 'var(--accent)' : 'var(--warn)';
    const fpCol = fp >= 80 ? 'var(--ok)' : fp >= 40 ? 'var(--accent)' : 'var(--warn)';
    const [bCls, bLabel] = STATUS_BADGE[r.status] ?? ['b-gray', r.status ?? '—'];
    const val  = r.original_value
      ? Number(r.original_value).toLocaleString('en-NG', {minimumFractionDigits:0})
      : '—';
    const end  = r.original_completion_date
      ? new Date(r.original_completion_date).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})
      : '—';
    const overdue = r.original_completion_date && new Date(r.original_completion_date) < new Date() && r.status === 'active';

    return `<tr onclick="openDetail('${r.id}')" style="cursor:pointer">
      <td style="font-size:12px;color:var(--text)">${esc(r.cnt_companies?.name ?? '—')}</td>
      <td>
        <span class="ref">${r.contract_id ?? '—'}</span>
        <div class="contract-title">${r.title ?? '—'}</div>
      </td>
      <td><span class="badge ${rCls}">${rLbl}</span></td>
      <td style="font-size:12px;color:var(--text)">${r.cnt_agencies?.name ?? '—'}</td>
      <td style="font-size:12px;font-weight:600;white-space:nowrap">${val}</td>
      <td style="font-size:11px;color:var(--muted);white-space:nowrap">
        <div>${start}</div>
        <div style="margin-top:2px">→ ${end}</div>
      </td>
      <td style="text-align:center;font-weight:700">${openAct}</td>
      <td><span class="badge ${sBadgeCls}">${sLabel}</span></td>
      <td>
        ${flags.length
          ? `<div class="esc-wrap">${flags.map(f => `<span class="esc-flag">${f}</span>`).join('')}</div>`
          : '<span style="font-size:12px;color:#22c55e;font-weight:600">✅ None</span>'}
      </td>
    </tr>`;
  
}).join('');
}

function openDetail(id){
  const c = (window._contracts || []).find(r => r.id === id);
  if (c) { openDetail_overlay(c); }
}
function openNew()     { location.href = 'new-contract.html'; }
function goAdmin()     { location.href = 'admin-users.html'; }

init();
</script>
<!-- CONTRACT DETAIL OVERLAY -->
<div id="dl-ov" style="display:none;position:fixed;inset:0;z-index:500;
     background:#f4f6fa;overflow-y:auto"></div>

<style>
.dlt{background:none;border:none;padding:11px 15px;font-size:13px;font-weight:600;
  cursor:pointer;color:#6b7280;border-bottom:3px solid transparent}
.dlt.on{color:#1F3864;border-bottom-color:#1F3864}
.dlt:hover{color:#1F3864}
.dlcard{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:14px}
.dllabel{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
  color:#6b7280;margin-bottom:4px}
.dlval{font-size:13px;font-weight:600;color:#1F3864}
.dltbl{width:100%;border-collapse:collapse;font-size:13px}
.dltbl th{background:#f8fafc;padding:8px 12px;text-align:left;font-size:11px;
  font-weight:700;text-transform:uppercase;color:#6b7280;border-bottom:1px solid #e2e8f0}
.dltbl td{padding:9px 12px;border-bottom:1px solid #f1f5f9;color:#374151}
.dlsec{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:18px;margin-bottom:14px}
</style>

<script>
var _dlC = null;
var _dlDone = {};

function openDetail_overlay(c) {
  _dlC = c;
  _dlDone = {};

  var RCOL = {low:'#22c55e',medium:'#f59e0b',high:'#f97316',critical:'#ef4444'};
  var SCOL = {Active:'#22c55e','On Hold':'#f59e0b','At Risk':'#f97316',
              Delayed:'#ef4444',Closed:'#6b7280','Pipeline':'#2E75B6'};
  var rc = RCOL[c.risk_level] || '#f59e0b';
  var sc = SCOL[c.status]     || '#1F3864';

  function fmtV(v){ return v!=null ? 'NGN '+Number(v).toLocaleString('en-NG',{maximumFractionDigits:0}) : '\u2014'; }
  function fmtD(v){ return v ? new Date(v).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) : '\u2014'; }
  function card(lbl,val){ return '<div class="dlcard"><div class="dllabel">'+lbl+'</div><div class="dlval">'+val+'</div></div>'; }

  var ov = document.getElementById('dl-ov');

  // Build header
  var hdr = '<div style="background:#1F3864;color:#fff;padding:12px 20px;display:flex;'
          + 'align-items:center;gap:14px;position:sticky;top:0;z-index:10;'
          + 'box-shadow:0 2px 8px rgba(0,0,0,.25)">'
          + '<button onclick="closeDetail()" style="background:rgba(255,255,255,.15);'
          + 'border:none;color:#fff;cursor:pointer;border-radius:6px;padding:6px 14px;'
          + 'font-size:13px;font-weight:700">\u2190 Dashboard</button>'
          + '<button onclick="editContract()" style="background:#2E75B6;border:1px solid rgba(255,255,255,.3);color:#fff;cursor:pointer;border-radius:6px;padding:6px 14px;font-size:13px;font-weight:700">\u270E Edit</button>'
          + '<div style="flex:1;min-width:0">'
          + '<div style="font-size:11px;font-weight:700;opacity:.7;letter-spacing:.07em">'
          + (c.contract_id||'') + '</div>'
          + '<div style="font-size:15px;font-weight:700">' + (c.title||'\u2014') + '</div>'
          + '</div>'
          + '<span style="background:'+sc+';color:#fff;padding:3px 12px;border-radius:20px;'
          + 'font-size:12px;font-weight:700">'+(c.status||'\u2014')+'</span>'
          + '<span style="background:'+rc+'22;color:'+rc+';border:1px solid '+rc+'55;'
          + 'padding:3px 12px;border-radius:20px;font-size:12px;font-weight:700">'
          + 'Risk: '+(c.risk_level||'\u2014')+'</span>'
          + '</div>';

  // Tabs
  var tabs = '<div style="background:#fff;border-bottom:1px solid #e2e8f0;padding:0 20px;'
           + 'display:flex;overflow-x:auto">'
           + '<button class="dlt on"  onclick="dlTab(\'ov\',this)">Overview</button>'
           + '<button class="dlt"     onclick="dlTab(\'pr\',this)">Progress</button>'
           + '<button class="dlt"     onclick="dlTab(\'kp\',this)">KPIs</button>'
           + '<button class="dlt"     onclick="dlTab(\'tm\',this)">Team</button>'
           + '<button class="dlt"     onclick="dlTab(\'ca\',this)">Corrective Actions</button>'
           + '<button class="dlt"     onclick="dlTab(\'nc\',this)">NCRs</button>'
           + '<button class="dlt"     onclick="dlTab(\'mb\',this)">Mobilisation</button>'
           + '</div>';

  // Overview content
  var pp = Math.min(100, c.physical_progress_pct  || 0);
  var fp = Math.min(100, c.financial_progress_pct || 0);
  var agency  = (c.cnt_agencies  && c.cnt_agencies.name)  ? c.cnt_agencies.name  : '\u2014';
  var company = (c.cnt_companies && c.cnt_companies.name) ? c.cnt_companies.name : '\u2014';

  var overview = '<div id="dl-ov-pane" style="max-width:920px;margin:0 auto;padding:20px">'
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">'
    + card('Agency', agency)
    + card('Contractor', company)
    + card('Contract Value', fmtV(c.original_value))
    + card('Start Date', fmtD(c.start_date))
    + card('End Date', fmtD(c.original_completion_date))
    + card('Status', c.status||'\u2014')
    + card('Risk Level', c.risk_level||'\u2014')
    + card('Location', [c.lga,c.state].filter(Boolean).join(', ')||'\u2014')
    + '</div>';

  // Risk notice
  if (c.risk_level === 'high' || c.risk_level === 'critical') {
    overview += '<div style="background:'+rc+'11;border:1.5px solid '+rc+';color:'+rc
      + ';border-radius:8px;padding:12px 16px;font-size:13px;margin-bottom:16px">'
      + (c.risk_level==='critical'
         ? '\uD83D\uDD34 <strong>Critical risk</strong> \u2014 Immediate executive intervention required.'
         : '\uD83D\uDFE0 <strong>High risk</strong> \u2014 Management escalation required.')
      + '</div>';
  }

  // Progress
  overview += '<div class="dlsec"><div style="font-size:11px;font-weight:700;'
    + 'text-transform:uppercase;letter-spacing:.07em;color:#6b7280;margin-bottom:12px">Progress</div>'
    + '<div style="margin-bottom:10px">'
    + '<div style="display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:4px">'
    + '<span>Physical</span><span>'+pp+'%</span></div>'
    + '<div style="height:10px;background:#f1f5f9;border-radius:5px;overflow:hidden">'
    + '<div style="height:100%;width:'+pp+'%;background:#2E75B6;border-radius:5px"></div></div></div>'
    + '<div>'
    + '<div style="display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:4px">'
    + '<span>Financial</span><span>'+fp+'%</span></div>'
    + '<div style="height:10px;background:#f1f5f9;border-radius:5px;overflow:hidden">'
    + '<div style="height:100%;width:'+fp+'%;background:#10b981;border-radius:5px"></div></div>'
    + '</div></div>';

  if (c.risk_notes) {
    overview += '<div class="dlsec"><div class="dllabel">Risk Notes</div>'
      + '<div style="font-size:13px;line-height:1.7;color:#374151">' + c.risk_notes + '</div></div>';
  }

  overview += '</div>';

  // Other tab placeholders
  var panes = '<div id="dl-pr-pane" style="display:none;max-width:920px;margin:0 auto;padding:20px">'
    + '<div style="text-align:center;padding:40px;color:#6b7280;font-size:13px">Loading\u2026</div></div>'
    + '<div id="dl-kp-pane" style="display:none;max-width:920px;margin:0 auto;padding:20px">'
    + '<div style="text-align:center;padding:40px;color:#6b7280;font-size:13px">Loading\u2026</div></div>'
    + '<div id="dl-tm-pane" style="display:none;max-width:920px;margin:0 auto;padding:20px">'
    + '<div style="text-align:center;padding:40px;color:#6b7280;font-size:13px">Loading\u2026</div></div>'
    + '<div id="dl-ca-pane" style="display:none;max-width:920px;margin:0 auto;padding:20px">'
    + '<div style="text-align:center;padding:40px;color:#6b7280;font-size:13px">Loading\u2026</div></div>'
    + '<div id="dl-nc-pane" style="display:none;max-width:920px;margin:0 auto;padding:20px">'
    + '<div style="text-align:center;padding:40px;color:#6b7280;font-size:13px">Loading\u2026</div></div>'
    + '<div id="dl-mb-pane" style="display:none;max-width:920px;margin:0 auto;padding:20px">'
    + '<div style="text-align:center;padding:40px;color:#6b7280;font-size:13px">Loading\u2026</div></div>';

  ov.innerHTML = hdr + tabs + overview + panes;
  ov.style.display = 'block';
  ov.scrollTop = 0;
  closePanel();
}

function closeDetail() {
  document.getElementById('dl-ov').style.display = 'none';
}

function dlTab(name, btn) {
  ['ov','pr','kp','tm','ca','nc','mb'].forEach(function(t) {
    document.getElementById('dl-'+t+'-pane').style.display = (t===name?'block':'none');
  });
  document.querySelectorAll('.dlt').forEach(function(b){ b.classList.remove('on'); });
  btn.classList.add('on');
  if (name !== 'ov' && !_dlDone[name]) { _dlDone[name]=true; dlLoad(name); }
}

async function dlLoad(name) {
  var sb  = window._sb;
  var cid = _dlC && _dlC.id;
  var el  = document.getElementById('dl-'+name+'-pane');
  if (!sb || !cid || !el) return;
  function noData(msg){ el.innerHTML='<div style="text-align:center;padding:40px;color:#6b7280;font-size:13px">'+msg+'</div>'; }
  function tbl(headers, rows) {
    var h = headers.map(function(t){ return '<th>'+t+'</th>'; }).join('');
    var r = rows.map(function(cols){
      return '<tr>'+cols.map(function(v){ return '<td>'+(v||'\u2014')+'</td>'; }).join('')+'</tr>';
    }).join('');
    return '<div class="dlsec"><table class="dltbl"><thead><tr>'+h+'</tr></thead><tbody>'+r+'</tbody></table></div>';
  }
  function fmtD(v){ return v ? new Date(v).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) : '\u2014'; }

  try {
    if (name === 'pr') {
      var r = await sb.from('cnt_progress_reports').select('*').eq('contract_id',cid).order('report_date',{ascending:false});
      if (!r.data || !r.data.length) { noData('No progress reports yet.'); return; }
      el.innerHTML = tbl(['Date','Physical %','Financial %','Description'],
        r.data.map(function(x){ return [fmtD(x.report_date), (x.physical_progress_pct||0)+'%', (x.financial_progress_pct||0)+'%', x.description||'']; }));
    }
    else if (name === 'kp') {
      var r = await sb.from('cnt_kpis').select('*').eq('contract_id',cid);
      if (!r.data || !r.data.length) { noData('No KPIs recorded.'); return; }
      el.innerHTML = tbl(['KPI','Target','Actual','Status'],
        r.data.map(function(x){ return [x.name||x.kpi_name, x.target_value, x.actual_value, x.status]; }));
    }
    else if (name === 'tm') {
      var r = await sb.from('cnt_contract_staff').select('id,role_on_contract,start_date,cnt_profiles(full_name,email)').eq('contract_id',cid);
      if (!r.data || !r.data.length) { noData('No team members recorded.'); return; }
      el.innerHTML = tbl(['Name','Role','Email','Start Date'],
        r.data.map(function(x){ return [x.cnt_profiles&&x.cnt_profiles.full_name, x.role_on_contract, x.cnt_profiles&&x.cnt_profiles.email, fmtD(x.start_date)]; }));
    }
    else if (name === 'ca') {
      var r = await sb.from('cnt_corrective_actions').select('*').eq('contract_id',cid).order('created_at',{ascending:false});
      if (!r.data || !r.data.length) { noData('No corrective actions recorded.'); return; }
      el.innerHTML = tbl(['Title','Status','Due Date','Priority'],
        r.data.map(function(x){ return [x.title||x.description, x.status, fmtD(x.due_date), x.priority]; }));
    }
    else if (name === 'nc') {
      var r = await sb.from('cnt_ncrs').select('*').eq('contract_id',cid).order('created_at',{ascending:false});
      if (!r.data || !r.data.length) { noData('No NCRs raised.'); return; }
      el.innerHTML = tbl(['Reference','Title','Status','Date'],
        r.data.map(function(x){ return [x.ncr_ref||x.reference_number, x.title, x.status, fmtD(x.created_at)]; }));
    }
    else if (name === 'mb') {
      var r = await sb.from('cnt_mobilization').select('*').eq('contract_id',cid).maybeSingle();
      var d = r.data;
      if (!d) { noData('No mobilisation record found.'); return; }
      var keys = ['personnel','equipment','materials','procedures','hse','insurance'];
      var labels = ['Approved personnel available','Equipment available','Materials planned',
                    'Work procedures reviewed','HSE plan in place','Insurance documents submitted'];
      el.innerHTML = tbl(['Item','Status'],
        keys.map(function(k,i){
          var v = d[k]==='yes' ? '<span style="color:#22c55e;font-weight:700">\u2713 Yes</span>'
                : d[k]==='no'  ? '<span style="color:#ef4444;font-weight:700">\u2717 No</span>'
                : '\u2014';
          return [labels[i], v];
        }));
    }
  } catch(e) {
    el.innerHTML = '<div style="text-align:center;padding:40px;color:#dc2626;font-size:13px">Error: '+e.message+'</div>';
  }
}
</script>
<!-- ═══════════════════════════════════════════════════
     EDIT CONTRACT MODAL
     ═══════════════════════════════════════════════════ -->
<div id="ec-backdrop" onclick="closeEdit()"
     style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:600"></div>

<div id="ec-modal"
     style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
            z-index:601;background:#fff;border-radius:12px;width:min(680px,95vw);

      <textarea id="ec-title" rows="2"

    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px">
      <div>
        <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
                      color:#6b7280;display:block;margin-bottom:5px">Agency</label>
        <select id="ec-agency"
                style="width:100%;box-sizing:border-box;border:1px solid #e2e8f0;border-radius:7px;
                       padding:9px 12px;font-size:13px;outline:none;background:#fff">
          <option value="">— select —</option>
        </select>
      </div>
      <div>
        <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
                      color:#6b7280;display:block;margin-bottom:5px">Subcontractor</label>
        <select id="ec-company"
                style="width:100%;box-sizing:border-box;border:1px solid #e2e8f0;border-radius:7px;
                       padding:9px 12px;font-size:13px;outline:none;background:#fff">
          <option value="">— select —</option>
        </select>
      </div>
    </div>

    <!-- Value, State, Risk -->
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:16px">
      <div>
        <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
                      color:#6b7280;display:block;margin-bottom:5px">Contract Value (NGN)</label>
        <input id="ec-value" type="number" placeholder="0"
               style="width:100%;box-sizing:border-box;border:1px solid #e2e8f0;border-radius:7px;
                      padding:9px 12px;font-size:13px;outline:none">
      </div>
      <div>
        <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
                      color:#6b7280;display:block;margin-bottom:5px">State</label>
        <input id="ec-state" placeholder="e.g. Lagos"
               style="width:100%;box-sizing:border-box;border:1px solid #e2e8f0;border-radius:7px;
                      padding:9px 12px;font-size:13px;outline:none">
      </div>
      <div>
        <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
                      color:#6b7280;display:block;margin-bottom:5px">Risk Level</label>
        <select id="ec-risk"
                style="width:100%;box-sizing:border-box;border:1px solid #e2e8f0;border-radius:7px;
                       padding:9px 12px;font-size:13px;outline:none;background:#fff">
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
          <option value="critical">Critical</option>
        </select>
      </div>
    </div>

    <!-- Dates -->
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:16px">
      <div>

                      color:#6b7280;display:block;margin-bottom:5px">Start Date</label>
        <input id="ec-start" type="date"
               style="width:100%;box-sizing:border-box;border:1px solid #e2e8f0;border-radius:7px;

      <div>

                      padding:9px 12px;font-size:13px;outline:none">
      </div>

        <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
                      color:#6b7280;display:block;margin-bottom:5px">Revised End Date</label>

        <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
                      color:#6b7280;display:block;margin-bottom:5px">Financial Progress %</label>
        <input id="ec-fp" type="number" min="0" max="100" placeholder="0"

    <!-- Risk Notes -->

      <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
                    color:#6b7280;display:block;margin-bottom:5px">Risk Notes</label>
      <textarea id="ec-risk-notes" rows="2"
                style="width:100%;box-sizing:border-box;border:1px solid #e2e8f0;border-radius:7px;
                       padding:9px 12px;font-size:13px;resize:vertical;outline:none"></textarea>
    </div>

    <!-- General Notes -->
    <div style="margin-bottom:20px">
      <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
                    color:#6b7280;display:block;margin-bottom:5px">Notes</label>
      <textarea id="ec-notes" rows="2"
                style="width:100%;box-sizing:border-box;border:1px solid #e2e8f0;border-radius:7px;
                       padding:9px 12px;font-size:13px;resize:vertical;outline:none"></textarea>
    </div>

    <!-- Error message -->
    <div id="ec-err" style="display:none;background:#fef2f2;border:1px solid #fca5a5;
         color:#dc2626;border-radius:7px;padding:10px 14px;font-size:13px;margin-bottom:14px"></div>

                     background:#fff;cursor:pointer;font-size:13px;font-weight:600;color:#374151">

      </button>

              id="ec-save-btn"
              style="padding:10px 28px;border:none;border-radius:7px;
                     background:#1F3864;color:#fff;cursor:pointer;
                     font-size:13px;font-weight:700">

      </button>

<script>
/* ── Edit Contract ────────────────────────────────────────────────────────── */
var _ecId = null;   // UUID of contract being edited

async function editContract() {
  var c = _dlC;
  if (!c) return;
  _ecId = c.id;

  document.getElementById('ec-ref').textContent    = c.contract_id || 'New Contract';
  document.getElementById('ec-contract-id').value  = c.contract_id || '';
  document.getElementById('ec-title').value        = c.title       || '';
  document.getElementById('ec-status').value       = c.status      || 'Pipeline';
  document.getElementById('ec-value').value        = c.original_value || '';
  document.getElementById('ec-state').value        = c.state       || '';
  document.getElementById('ec-risk').value         = c.risk_level  || 'medium';
  document.getElementById('ec-start').value        = c.start_date  ? c.start_date.slice(0,10) : '';
  document.getElementById('ec-end').value          = c.original_completion_date  ? c.original_completion_date.slice(0,10)  : '';
  document.getElementById('ec-revised').value      = c.revised_completion_date   ? c.revised_completion_date.slice(0,10)   : '';
  document.getElementById('ec-pp').value           = c.physical_progress_pct  ?? 0;
  document.getElementById('ec-fp').value           = c.financial_progress_pct ?? 0;
  document.getElementById('ec-risk-notes').value   = c.risk_notes  || '';
  document.getElementById('ec-notes').value        = c.notes       || '';
  document.getElementById('ec-err').style.display  = 'none';
  document.getElementById('ec-save-btn').textContent = 'Save Changes';

  // Load agencies dropdown
  var agSel = document.getElementById('ec-agency');
  agSel.innerHTML = '<option value="">— select —</option>';
  var agRes = await window._sb.from('cnt_agencies').select('id,name').order('name');
  (agRes.data || []).forEach(function(a) {
    var o = document.createElement('option');
    o.value = a.id; o.textContent = a.name;
    if (a.id === c.agency_id) o.selected = true;
    agSel.appendChild(o);
  });

  // Load companies dropdown
  var coSel = document.getElementById('ec-company');
  coSel.innerHTML = '<option value="">— select —</option>';
  var coRes = await window._sb.from('cnt_companies').select('id,name').order('name');
  (coRes.data || []).forEach(function(co) {
    var o = document.createElement('option');
    o.value = co.id; o.textContent = co.name;
    if (co.id === c.assigned_company_id) o.selected = true;
    coSel.appendChild(o);
  });

  document.getElementById('ec-backdrop').style.display = 'block';
  document.getElementById('ec-modal').style.display    = 'block';
}

function closeEdit() {
  document.getElementById('ec-backdrop').style.display = 'none';
  document.getElementById('ec-modal').style.display    = 'none';
}

async function saveContract() {
  var btn = document.getElementById('ec-save-btn');
  var err = document.getElementById('ec-err');
  err.style.display = 'none';
  btn.textContent = 'Saving…';
  btn.disabled = true;

  function v(id) { return document.getElementById(id).value.trim() || null; }
  function n(id) { var x = parseFloat(document.getElementById(id).value); return isNaN(x) ? null : x; }

  var payload = {
    contract_id:              v('ec-contract-id'),
    title:                    v('ec-title'),
    status:                   v('ec-status'),
    agency_id:                v('ec-agency')  || null,
    assigned_company_id:      v('ec-company') || null,
    original_value:           n('ec-value'),
    state:                    v('ec-state'),
    risk_level:               v('ec-risk'),
    start_date:               v('ec-start'),
    original_completion_date: v('ec-end'),
    revised_completion_date:  v('ec-revised'),
    physical_progress_pct:    n('ec-pp'),
    financial_progress_pct:   n('ec-fp'),
    risk_notes:               v('ec-risk-notes'),
    notes:                    v('ec-notes'),
  };

  // Remove null dates (PostgREST needs omit, not null, for date fields)
  ['start_date','original_completion_date','revised_completion_date'].forEach(function(k) {
    if (!payload[k]) delete payload[k];
  });

  var res = await window._sb.from('cnt_contracts').update(payload).eq('id', _ecId);

  if (res.error) {
    err.textContent = 'Save failed: ' + res.error.message;
    err.style.display = 'block';
    btn.textContent = 'Save Changes';
    btn.disabled = false;
    return;
  }

  // Update in-memory contract so overlay reflects changes immediately
  var idx = (window._contracts || []).findIndex(function(c) { return c.id === _ecId; });
  if (idx >= 0) {
    Object.assign(window._contracts[idx], payload);
    _dlC = window._contracts[idx];
  }

  btn.textContent = 'Saved ✓';
  setTimeout(function() {
    closeEdit();
    // Re-open overlay with updated data
    openDetail(_dlC);
    btn.disabled = false;
  }, 700);
}

// Close modal on Escape
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeEdit();
});
</script>
</body>
</html>
