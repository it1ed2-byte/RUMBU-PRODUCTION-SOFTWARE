<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Government Contracts</title>
<script src="auth-contracts.js"></script>
<style>
:root{
  --primary:#1F3864;--accent:#2E75B6;--ok:#22c55e;--bad:#ef4444;--warn:#f59e0b;
  --bg:#f0f4f8;--card:#fff;--line:#e2e8f0;--muted:#64748b;--heading:#0f172a;
  --th-bg:#f1f5f9;--th-fg:#374151;--shadow:0 1px 4px rgba(0,0,0,.09);--radius:10px
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;font-size:14px;background:var(--bg);color:var(--heading);min-height:100vh}

/* ── Module header ── */
.mod-hdr{
  background:linear-gradient(135deg,#1F3864 0%,#2E75B6 100%);
  color:#fff;padding:20px 24px;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px
}
.mod-hdr-left h1{font-size:19px;font-weight:700;letter-spacing:-.3px}
.mod-hdr-left p{font-size:12px;opacity:.75;margin-top:2px}
.mod-hdr-right{display:flex;gap:8px;flex-wrap:wrap}
.btn-hdr{
  display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:none;
  border-radius:7px;font-size:13px;cursor:pointer;font-weight:600
}
.btn-hdr-primary{background:#fff;color:var(--primary)}
.btn-hdr-primary:hover{background:#e8f0fe}
.btn-hdr-ghost{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3)}
.btn-hdr-ghost:hover{background:rgba(255,255,255,.25)}

/* ── Body padding ── */
.body{padding:20px 24px}

/* ── Stats ── */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
.stat{
  background:var(--card);border-radius:var(--radius);
  padding:16px 18px;box-shadow:var(--shadow);
  border-top:3px solid transparent;position:relative;overflow:hidden
}
.stat.blue{border-top-color:var(--accent)}
.stat.green{border-top-color:var(--ok)}
.stat.yellow{border-top-color:var(--warn)}
.stat.red{border-top-color:var(--bad)}
.stat.navy{border-top-color:var(--primary)}
.stat-icon{position:absolute;right:14px;top:14px;font-size:22px;opacity:.15}
.stat-val{font-size:24px;font-weight:800;color:var(--heading);letter-spacing:-.5px;line-height:1}
.stat-val.small{font-size:16px}
.stat-lbl{font-size:11px;color:var(--muted);margin-top:5px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}

/* ── Toolbar ── */
.toolbar{
  display:flex;gap:10px;margin-bottom:14px;
  flex-wrap:wrap;align-items:center
}
.toolbar input,.toolbar select{
  border:1px solid var(--line);border-radius:8px;
  padding:8px 12px;font-size:13px;background:var(--card);
  box-shadow:0 1px 2px rgba(0,0,0,.04)
}
.toolbar input{flex:1;min-width:200px}
.toolbar input::placeholder{color:#94a3b8}

/* ── Table ── */
.table-wrap{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead tr{background:var(--primary)}
th{
  color:rgba(255,255,255,.85);font-size:11px;font-weight:600;
  text-align:left;padding:11px 14px;white-space:nowrap;
  letter-spacing:.4px;text-transform:uppercase
}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#f8fafc;cursor:pointer}

/* ── Status pills ── */
.pill{
  display:inline-block;padding:3px 10px;border-radius:20px;
  font-size:11px;font-weight:700;white-space:nowrap
}
.pill-active{background:#dcfce7;color:#15803d}
.pill-awarded{background:#e0f2fe;color:#0369a1}
.pill-pipeline{background:#fef9c3;color:#854d0e}
.pill-on_hold{background:#fef3c7;color:#92400e}
.pill-completed{background:#f1f5f9;color:#475569}
.pill-terminated{background:#fee2e2;color:#991b1b}
.pill-closeout{background:#f1f5f9;color:#475569}
.pill-default{background:var(--th-bg);color:var(--th-fg)}

/* ── Progress mini ── */
.prog-col{min-width:90px}
.prog-track{height:5px;background:var(--line);border-radius:3px;margin-bottom:3px}
.prog-fill{height:5px;border-radius:3px}
.prog-label{font-size:11px;font-weight:600;color:var(--muted)}

/* ── Contract ref ── */
.ref-code{
  font-family:monospace;font-size:12px;font-weight:700;
  background:var(--th-bg);color:var(--primary);
  padding:2px 7px;border-radius:5px;white-space:nowrap
}
.contract-title{font-weight:600;font-size:13px}
.contract-meta{font-size:11px;color:var(--muted)}

/* ── Empty / loading ── */
.empty{text-align:center;padding:50px;color:var(--muted)}
.empty-icon{font-size:36px;margin-bottom:10px}
#loading{text-align:center;padding:80px;color:var(--muted)}
</style>
</head>
<body>
<div id="loading">Loading…</div>
<div id="app" style="display:none">

  <!-- Header -->
  <div class="mod-hdr">
    <div class="mod-hdr-left">
      <h1>Government Contracts</h1>
      <p id="hdr-sub">Rumbu Industries Group</p>
    </div>
    <div class="mod-hdr-right">
      <button class="btn-hdr btn-hdr-ghost" id="admin-btn" style="display:none" onclick="goAdmin()">⚙ Users</button>
      <button class="btn-hdr btn-hdr-primary" onclick="openNew()">+ New Contract</button>
    </div>
  </div>

  <div class="body">
    <!-- Stats -->
    <div class="stats">
      <div class="stat navy">
        <span class="stat-icon">📄</span>
        <div class="stat-val" id="s-total">—</div>
        <div class="stat-lbl">Total Contracts</div>
      </div>
      <div class="stat green">
        <span class="stat-icon">✅</span>
        <div class="stat-val" id="s-active">—</div>
        <div class="stat-lbl">Active</div>
      </div>
      <div class="stat yellow">
        <span class="stat-icon">⏳</span>
        <div class="stat-val" id="s-pipeline">—</div>
        <div class="stat-lbl">Pipeline / On Hold</div>
      </div>
      <div class="stat blue">
        <span class="stat-icon">🏁</span>
        <div class="stat-val" id="s-completed">—</div>
        <div class="stat-lbl">Completed</div>
      </div>
      <div class="stat navy">
        <span class="stat-icon">💰</span>
        <div class="stat-val small" id="s-value">—</div>
        <div class="stat-lbl">Total Portfolio Value</div>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <input id="q" type="search" placeholder="🔍  Search contract title or reference…" oninput="render()">
      <select id="fAgency" onchange="render()"><option value="">All Agencies</option></select>
      <select id="fStatus" onchange="render()">
        <option value="">All Statuses</option>
        <option value="pipeline">Pipeline</option>
        <option value="awarded">Awarded</option>
        <option value="active">Active</option>
        <option value="on_hold">On Hold</option>
        <option value="completed">Completed</option>
        <option value="terminated">Terminated</option>
        <option value="closeout">Closeout</option>
      </select>
    </div>

    <!-- Table -->
    <div class="table-wrap">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Contract</th>
              <th>Agency</th>
              <th>Company</th>
              <th>Value</th>
              <th>End Date</th>
              <th>Physical</th>
              <th>Financial</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
let sb, rows = [], isAdmin = false;

async function init() {
  const auth = await guardPage();
  if (!auth) return;
  sb = auth.sb;
  isAdmin = auth.permissions.has('users.manage');
  if (isAdmin) document.getElementById('admin-btn').style.display = 'inline-flex';

  document.getElementById('hdr-sub').textContent =
    'Welcome, ' + (auth.profile.full_name ?? 'Contractor') +
    ' · ' + new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'});

  const [cRes, aRes] = await Promise.all([
    sb.from('cnt_contracts').select(`
      id,contract_id,title,status,contract_value,
      start_date,end_date,physical_progress,financial_progress,
      cnt_agencies(id,name),cnt_companies(id,name)
    `).order('created_at',{ascending:false}),
    sb.from('cnt_agencies').select('id,name').order('name')
  ]);

  rows = cRes.data ?? [];

  // Populate agency filter
  (aRes.data ?? []).forEach(a => {
    const o = document.createElement('option');
    o.value = a.id; o.textContent = a.name;
    document.getElementById('fAgency').appendChild(o);
  });

  // Stats
  const totalVal = rows.reduce((s,r) => s + (r.contract_value ?? 0), 0);
  document.getElementById('s-total').textContent = rows.length;
  document.getElementById('s-active').textContent = rows.filter(r=>r.status==='active').length;
  document.getElementById('s-pipeline').textContent = rows.filter(r=>r.status==='pipeline'||r.status==='on_hold').length;
  document.getElementById('s-completed').textContent = rows.filter(r=>r.status==='completed').length;
  document.getElementById('s-value').textContent = totalVal >= 1e9
    ? 'NGN ' + (totalVal/1e9).toFixed(1) + 'B'
    : totalVal >= 1e6
    ? 'NGN ' + (totalVal/1e6).toFixed(1) + 'M'
    : 'NGN ' + totalVal.toLocaleString('en-NG',{minimumFractionDigits:0});

  render();
  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = 'block';
}

function render() {
  const q = document.getElementById('q').value.toLowerCase();
  const st = document.getElementById('fStatus').value;
  const ag = document.getElementById('fAgency').value;

  const data = rows.filter(r => {
    if (q && !r.title?.toLowerCase().includes(q) && !r.contract_id?.toLowerCase().includes(q)) return false;
    if (st && r.status !== st) return false;
    if (ag && r.cnt_agencies?.id !== ag) return false;
    return true;
  });

  const tbody = document.getElementById('tbody');

  if (!data.length) {
    tbody.innerHTML = `<tr><td colspan="8" class="empty">
      <div class="empty-icon">📋</div>
      <div>${rows.length ? 'No contracts match your filter.' : 'No contracts yet. Create your first one.'}</div>
    </td></tr>`;
    return;
  }

  tbody.innerHTML = data.map(r => {
    const pp = Math.min(100, r.physical_progress ?? 0);
    const fp = Math.min(100, r.financial_progress ?? 0);
    const ppCol = pp >= 80 ? '#22c55e' : pp >= 40 ? '#2E75B6' : '#f59e0b';
    const fpCol = fp >= 80 ? '#22c55e' : fp >= 40 ? '#2E75B6' : '#f59e0b';
    const pillCls = `pill pill-${r.status ?? 'default'}`;
    const pillLabel = {
      pipeline:'Pipeline',awarded:'Awarded',active:'Active',on_hold:'On Hold',
      completed:'Completed',terminated:'Terminated',closeout:'Closeout'
    }[r.status] ?? r.status;
    const val = r.contract_value
      ? 'NGN ' + Number(r.contract_value).toLocaleString('en-NG',{minimumFractionDigits:0})
      : '—';
    const endDate = r.end_date
      ? new Date(r.end_date).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})
      : '—';

    // Overdue check
    const overdue = r.end_date && new Date(r.end_date) < new Date() && r.status === 'active';

    return `<tr onclick="openDetail('${r.id}')">
      <td>
        <span class="ref-code">${r.contract_id ?? '—'}</span>
        <div class="contract-title" style="margin-top:4px">${r.title ?? '—'}</div>
      </td>
      <td class="contract-meta">${r.cnt_agencies?.name ?? '—'}</td>
      <td class="contract-meta">${r.cnt_companies?.name ?? '—'}</td>
      <td style="white-space:nowrap;font-size:13px;font-weight:600">${val}</td>
      <td style="${overdue?'color:var(--bad);font-weight:600':''}">
        ${endDate}${overdue?' <span style="font-size:10px">OVERDUE</span>':''}
      </td>
      <td class="prog-col">
        <div class="prog-track"><div class="prog-fill" style="width:${pp}%;background:${ppCol}"></div></div>
        <span class="prog-label">${pp}%</span>
      </td>
      <td class="prog-col">
        <div class="prog-track"><div class="prog-fill" style="width:${fp}%;background:${fpCol}"></div></div>
        <span class="prog-label">${fp}%</span>
      </td>
      <td><span class="${pillCls}">${pillLabel}</span></td>
    </tr>`;
  }).join('');
}

function openDetail(id) {
  if (window.parent?.navigate) window.parent.navigate('contracts/contract-detail.html?id=' + id);
  else location.href = 'contract-detail.html?id=' + id;
}
function openNew() {
  if (window.parent?.navigate) window.parent.navigate('contracts/new-contract.html');
  else location.href = 'new-contract.html';
}
function goAdmin() {
  if (window.parent?.navigate) window.parent.navigate('contracts/admin-users.html');
  else location.href = 'admin-users.html';
}

init();
</script>
</body>
</html>
