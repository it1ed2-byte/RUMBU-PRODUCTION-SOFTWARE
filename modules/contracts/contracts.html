<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Government Contracts</title>
<script src="auth-contracts.js"></script>
<script src="sidebar-contracts.js"></script>
<link rel="stylesheet" href="contracts.css">
<style>
.contract-title{font-weight:600;font-size:13.5px;color:var(--heading);margin-top:3px}
td.clickable{cursor:pointer}
</style>
</head>
<body>
<div class="page-hdr">
  <div class="ph-left">
    <div class="ph-icon">📋</div>
    <div>
      <div class="ph-title">Government Contracts</div>
      <div class="ph-sub" id="ph-sub">Loading…</div>
    </div>
  </div>
  <div class="ph-right">
    <button class="btn btn-hdr" id="new-btn" style="display:none" onclick="openNew()">＋ New Contract</button>
    <button class="btn btn-hdr" id="admin-btn" style="display:none" onclick="goAdmin()">⚙ Manage Users</button>
  </div>
</div>

<div style="display:flex;gap:10px;flex-wrap:wrap;padding:14px 20px;
     background:#fff;border-bottom:1px solid #e2e8f0" id="stat-bar"></div>

<div class="content">
  <div id="loading" class="loading-wrap">
    <div class="spinner"></div>
    <div class="loading-txt">Loading contracts…</div>
  </div>

  <div id="app" style="display:none">
    <div class="stats">
      <div class="stat-card">
        <span class="stat-icon">📄</span>
        <div class="stat-val" id="s-total">—</div>
        <div class="stat-lbl">Total Contracts</div>
      </div>
      <div class="stat-card ok-c">
        <span class="stat-icon">✅</span>
        <div class="stat-val" id="s-active">—</div>
        <div class="stat-lbl">Ongoing</div>
      </div>
      <div class="stat-card warn-c">
        <span class="stat-icon">⏳</span>
        <div class="stat-val" id="s-pipeline">—</div>
        <div class="stat-lbl">Pending / On Hold</div>
      </div>
      <div class="stat-card info-c">
        <span class="stat-icon">🏁</span>
        <div class="stat-val" id="s-completed">—</div>
        <div class="stat-lbl">Completed</div>
      </div>
      <div class="stat-card" style="border-left-color:#7C3AED">
        <span class="stat-icon">💰</span>
        <div class="stat-val sm" id="s-value">—</div>
        <div class="stat-lbl">Total Portfolio Value</div>
      </div>
    </div>

    <div class="toolbar">
      <input class="srch" id="q" type="search" placeholder="🔍  Search by title or reference…" oninput="render()">
      <select class="flt" id="fAgency" onchange="render()"><option value="">All Agencies</option></select>
      <select class="flt" id="fStatus" onchange="render()">
        <option value="">All Statuses</option>
        <option value="Pipeline">Pending</option>
        <option value="Active">Ongoing</option>
        <option value="On Hold">On Hold</option>
        <option value="At Risk">At Risk</option>
        <option value="Delayed">Delayed</option>
        <option value="Practically Complete">Practically Complete</option>
        <option value="Closed">Completed</option>
        <option value="Cancelled">Cancelled</option>
      </select>
      <select class="flt" id="fRisk" onchange="render()">
        <option value="">All Risk Levels</option>
        <option value="critical">🔴 Critical</option>
        <option value="high">🟠 High</option>
        <option value="medium">🟡 Medium</option>
        <option value="low">🟢 Low</option>
      </select>
    </div>

    <div class="tbl-wrap">
      <div class="tbl-scroll">
        <table>
          <thead>
            <tr>
              <th>Contractor</th><th>Contract</th><th>Risk</th><th>Agency</th>
              <th>Value</th><th>Dates</th><th>Open Actions</th><th>Status</th><th>Escalation Flags</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
// ── Globals ───────────────────────────────────────────────────────
var sb, rows = [];
var _myProfileId = null;
var _myRoles     = new Set();
var _isSupervisor = false;
var _canEdit      = false;  // based on role only; _canEditThis (window) includes per-contract HoC check

// ── Init ──────────────────────────────────────────────────────────
async function init() {
  try {
    var auth = await guardPage();
    if (!auth) return;
    sb = auth.sb;
    window._sb       = sb;
    _myProfileId     = auth.profile.id;

    // Fetch this user's CNT roles
    var rolesQry = await sb.from('cnt_profile_roles')
      .select('cnt_roles(name)').eq('profile_id', _myProfileId);
    _myRoles = new Set((rolesQry.data || []).map(function(r){ return r.cnt_roles && r.cnt_roles.name; }).filter(Boolean));
    _isSupervisor = _myRoles.has('SiteSupervisor');
    _canEdit = _myRoles.has('CEO') || _myRoles.has('ContractAdmin') || _myRoles.has('HeadOfContract');

    if (auth.permissions.has('users.manage'))
      document.getElementById('admin-btn').style.display = 'inline-flex';
    if (!_isSupervisor)
      document.getElementById('new-btn').style.display = 'inline-flex';

    document.getElementById('ph-sub').textContent =
      'Welcome, ' + (auth.profile.full_name || 'User') + ' · ' +
      new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'});

    // Supervisors only see contracts assigned to them
    var qry = sb.from('cnt_contracts').select(
      'id,contract_id,title,status,risk_level,original_value,' +
      'start_date,original_completion_date,revised_completion_date,' +
      'physical_progress_pct,financial_progress_pct,' +
      'site_supervisor_id,state,lga,risk_notes,notes,agency_id,' +
      'cnt_agencies(id,name),cnt_companies(id,name)'
    ).order('created_at',{ascending:false});

    if (_isSupervisor) qry = qry.eq('site_supervisor_id', _myProfileId);

    var [cRes, aRes] = await Promise.all([
      qry,
      sb.from('cnt_agencies').select('id,name').order('name')
    ]);

    rows = cRes.data || [];
    window._contracts = rows;

    // Status distribution bar
    (function(){
      var norm = function(s){ return (s||'').toLowerCase(); };
      var counts = {};
      rows.forEach(function(c){ var s = norm(c.status); counts[s] = (counts[s]||0)+1; });
      var LABELS = {active:'Ongoing',pipeline:'Pending',closed:'Completed','on hold':'On Hold',
                    'at risk':'At Risk',delayed:'Delayed',cancelled:'Cancelled','practically complete':'Practically Complete'};
      var COLORS = {active:'#22c55e',pipeline:'#2E75B6',closed:'#10b981','on hold':'#f59e0b',
                    'at risk':'#f97316',delayed:'#ef4444',cancelled:'#6b7280','practically complete':'#8b5cf6'};
      var el = document.getElementById('stat-bar');
      if (!el) return;
      var pill = function(lbl,val,col){
        return '<div style="background:'+col+'11;border:1px solid '+col+'44;border-radius:7px;'+
          'padding:6px 14px;display:flex;gap:8px;align-items:center">'+
          '<span style="font-size:18px;font-weight:900;color:'+col+'">'+val+'</span>'+
          '<span style="font-size:12px;color:#374151;font-weight:600">'+lbl+'</span></div>';
      };
      el.innerHTML = pill('Total', rows.length, '#1F3864') +
        Object.entries(counts).map(function(kv){ return pill(LABELS[kv[0]]||kv[0], kv[1], COLORS[kv[0]]||'#6b7280'); }).join('');
    })();

    (aRes.data || []).forEach(function(a){
      var o = document.createElement('option');
      o.value = a.id; o.textContent = a.name;
      document.getElementById('fAgency').appendChild(o);
    });

    var norm = function(s){ return (s||'').toLowerCase(); };
    var totalVal = rows.reduce(function(s,r){ return s + (r.original_value || 0); }, 0);
    document.getElementById('s-total').textContent    = rows.length;
    document.getElementById('s-active').textContent   = rows.filter(function(r){ return norm(r.status)==='active'; }).length;
    document.getElementById('s-pipeline').textContent = rows.filter(function(r){ return ['pipeline','on hold','on_hold'].includes(norm(r.status)); }).length;
    document.getElementById('s-completed').textContent= rows.filter(function(r){ return ['closed','completed'].includes(norm(r.status)); }).length;
    document.getElementById('s-value').textContent    = totalVal >= 1e9
      ? 'NGN ' + (totalVal/1e9).toFixed(2) + 'B'
      : totalVal >= 1e6
      ? 'NGN ' + (totalVal/1e6).toFixed(2) + 'M'
      : 'NGN ' + totalVal.toLocaleString('en-NG');

    render();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display     = 'block';
  } catch(e) {
    document.getElementById('loading').innerHTML =
      '<div style="color:var(--bad);text-align:center;padding:40px">' +
      '<div style="font-size:32px;margin-bottom:10px">⚠️</div>' +
      '<strong>Failed to load contracts</strong><br>' +
      '<span style="font-size:12px;color:var(--muted)">'+e.message+'</span></div>';
    console.error(e);
  }
}

// ── Badge maps ────────────────────────────────────────────────────
var STATUS_BADGE = {
  pipeline:               ['b-navy',   'Pending'],
  active:                 ['b-ok',     'Ongoing'],
  'on hold':              ['b-warn',   'On Hold'],
  'at risk':              ['b-orange', 'At Risk'],
  delayed:                ['b-bad',    'Delayed'],
  'practically complete': ['b-gold',   'Practically Complete'],
  closed:                 ['b-gray',   'Completed'],
  cancelled:              ['b-bad',    'Cancelled']
};
var RISK_BADGE = {
  low:      ['b-ok',    '🟢 Low'],
  medium:   ['b-warn',  '🟡 Medium'],
  high:     ['b-orange','🟠 High'],
  critical: ['b-bad',   '🔴 Critical']
};

function esc(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Render table ──────────────────────────────────────────────────
function render() {
  var q  = document.getElementById('q').value.toLowerCase();
  var st = document.getElementById('fStatus').value;
  var ag = document.getElementById('fAgency').value;
  var rk = document.getElementById('fRisk').value;

  var data = rows.filter(function(r){
    if (q && !r.title?.toLowerCase().includes(q) && !r.contract_id?.toLowerCase().includes(q)) return false;
    if (st && r.status !== st) return false;
    if (ag && r.cnt_agencies?.id !== ag) return false;
    if (rk && r.risk_level !== rk) return false;
    return true;
  });

  var tbody = document.getElementById('tbody');
  if (!data.length) {
    tbody.innerHTML = '<tr><td colspan="9"><div class="empty-state">' +
      '<span class="e-icon">📋</span><p>' +
      (rows.length ? 'No contracts match your filters.' : 'No contracts yet.') +
      '</p></div></td></tr>';
    return;
  }

  tbody.innerHTML = data.map(function(r){
    var norm = function(s){ return (s||'').toLowerCase(); };
    var _st  = norm(r.status);
    var rb   = RISK_BADGE[norm(r.risk_level)]   || ['b-gray','—'];
    var sb2  = STATUS_BADGE[_st]                || ['b-gray', r.status||'—'];
    var fmtD = function(d){ return d ? new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'2-digit'}) : '—'; };
    var val  = r.original_value
      ? ('NGN ' + (r.original_value >= 1e9 ? (r.original_value/1e9).toFixed(2)+'B' : (r.original_value/1e6).toFixed(1)+'M'))
      : '—';
    return '<tr onclick="openDetail(\''+r.id+'\')" style="cursor:pointer">'
      + '<td style="font-size:12px">'+esc(r.cnt_companies?.name||'—')+'</td>'
      + '<td><span class="ref">'+esc(r.contract_id||'—')+'</span>'
      + '<div class="contract-title">'+esc(r.title||'—')+'</div></td>'
      + '<td><span class="badge '+rb[0]+'">'+rb[1]+'</span></td>'
      + '<td style="font-size:12px">'+esc(r.cnt_agencies?.name||'—')+'</td>'
      + '<td style="font-size:12px;font-weight:600;white-space:nowrap">'+val+'</td>'
      + '<td style="font-size:11px;color:var(--muted);white-space:nowrap">'
      + '<div>'+fmtD(r.start_date)+'</div>'
      + '<div style="margin-top:2px">→ '+fmtD(r.original_completion_date)+'</div></td>'
      + '<td style="text-align:center;font-weight:700">0</td>'
      + '<td><span class="badge '+sb2[0]+'">'+sb2[1]+'</span></td>'
      + '<td><span style="font-size:12px;color:#22c55e;font-weight:600">✅ None</span></td>'
      + '</tr>';
  }).join('');
}

function openDetail(id){
  var c = (window._contracts||[]).find(function(r){ return r.id===id; });
  if (c) openDetail_overlay(c);
}
function openNew()  { location.href = 'new-contract.html'; }
function goAdmin()  { location.href = 'admin-users.html';  }

init();
</script>

<!-- ═══════════════════════════════════════════════
     CONTRACT DETAIL OVERLAY
     ═══════════════════════════════════════════════ -->
<div id="dl-ov" style="display:none;position:fixed;inset:0;z-index:500;
     background:#f4f6fa;overflow-y:auto"></div>

<style>
.dlt{background:none;border:none;padding:11px 15px;font-size:13px;font-weight:600;
  cursor:pointer;color:#6b7280;border-bottom:3px solid transparent;white-space:nowrap}
.dlt.on{color:#1F3864;border-bottom-color:#1F3864}
.dlt:hover{color:#1F3864}
.dlcard{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:14px}
.dllabel{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#6b7280;margin-bottom:4px}
.dlval{font-size:13px;font-weight:600;color:#1F3864}
.dltbl{width:100%;border-collapse:collapse;font-size:13px}
.dltbl th{background:#f8fafc;padding:8px 12px;text-align:left;font-size:11px;
  font-weight:700;text-transform:uppercase;color:#6b7280;border-bottom:1px solid #e2e8f0}
.dltbl td{padding:9px 12px;border-bottom:1px solid #f1f5f9;color:#374151}
.dlsec{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:18px;margin-bottom:14px}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:12px}
.media-item{border:1px solid #e2e8f0;border-radius:8px;overflow:hidden;background:#fff}
.media-thumb{width:100%;height:110px;object-fit:cover;display:block;background:#f1f5f9}
.media-info{padding:8px;font-size:11px;color:#6b7280}
.remark-item{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:12px 14px;margin-bottom:10px}
.remark-date{font-size:11px;color:#6b7280;font-weight:600;margin-bottom:4px}
.remark-text{font-size:13px;color:#374151;line-height:1.6}
.remark-author{font-size:11px;color:#9ca3af;margin-top:5px}
</style>

<script>
var _dlC    = null;
var _dlDone = {};

async function openDetail_overlay(c) {
  _dlC    = c;
  _dlDone = {};

  var ov = document.getElementById('dl-ov');
  ov.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;' +
    'height:200px;color:#6b7280;font-size:13px">Loading…</div>';
  ov.style.display = 'block';
  ov.scrollTop = 0;
  try { closePanel(); } catch(e) {}

  // ── Async: supervisor name ────────────────────────────────────
  var supervisorName = '—';
  if (c.site_supervisor_id) {
    try {
      var svR = await window._sb.from('cnt_profiles')
        .select('full_name').eq('id', c.site_supervisor_id).maybeSingle();
      supervisorName = (svR.data && svR.data.full_name) || '—';
    } catch(e) {}
  }

  // ── Can this user edit this contract? ─────────────────────────
  var canEditThis = _canEdit;
  if (!canEditThis && _myProfileId) {
    try {
      var hocR = await window._sb.from('cnt_contract_staff')
        .select('id').eq('contract_id', c.id).eq('profile_id', _myProfileId)
        .ilike('role_on_contract', '%head%').maybeSingle();
      canEditThis = !!(hocR.data);
    } catch(e) {}
  }
  window._canEditThis = canEditThis;

  // ── Build HTML ────────────────────────────────────────────────
  var RCOL = {low:'#22c55e',medium:'#f59e0b',high:'#f97316',critical:'#ef4444'};
  var SCOL = {Active:'#22c55e','On Hold':'#f59e0b','At Risk':'#f97316',
              Delayed:'#ef4444',Closed:'#6b7280',Pipeline:'#2E75B6',
              Cancelled:'#6b7280','Practically Complete':'#8b5cf6'};
  var SDISP= {Pipeline:'Pending',Active:'Ongoing',Closed:'Completed'};
  var rc = RCOL[c.risk_level] || '#f59e0b';
  var sc = SCOL[c.status]     || '#1F3864';
  function fmtV(v){ return v!=null ? 'NGN '+Number(v).toLocaleString('en-NG',{maximumFractionDigits:0}) : '\u2014'; }
  function fmtD(v){ return v ? new Date(v).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) : '\u2014'; }
  function card(lbl,val){ return '<div class="dlcard"><div class="dllabel">'+lbl+'</div><div class="dlval">'+val+'</div></div>'; }

  // Header
  var hdr = '<div style="background:#1F3864;color:#fff;padding:12px 20px;display:flex;' +
    'align-items:center;gap:12px;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.25)">'
    + '<button onclick="closeDetail()" style="background:rgba(255,255,255,.15);border:none;color:#fff;'
    + 'cursor:pointer;border-radius:6px;padding:6px 14px;font-size:13px;font-weight:700">← Back</button>';
  if (canEditThis) {
    hdr += '<button onclick="editContract()" style="background:#2E75B6;border:1px solid rgba(255,255,255,.3);'
      + 'color:#fff;cursor:pointer;border-radius:6px;padding:6px 14px;font-size:13px;font-weight:700">✎ Edit</button>';
  }
  hdr += '<div style="flex:1;min-width:0">'
    + '<div style="font-size:11px;font-weight:700;opacity:.7;letter-spacing:.07em">'+(c.contract_id||'')+'</div>'
    + '<div style="font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(c.title||'—')+'</div>'
    + '</div>'
    + '<span style="background:'+sc+';color:#fff;padding:3px 12px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap">'+(SDISP[c.status]||c.status||'—')+'</span>'
    + '<span style="background:'+rc+'22;color:'+rc+';border:1px solid '+rc+'55;padding:3px 12px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap">'
    + 'Risk: '+((c.risk_level||'').charAt(0).toUpperCase()+(c.risk_level||'').slice(1)||'—')+'</span>'
    + '</div>';

  // Tabs
  var tabs = '<div style="background:#fff;border-bottom:1px solid #e2e8f0;padding:0 20px;display:flex;overflow-x:auto">'
    + '<button class="dlt on" onclick="dlTab(\'ov\',this)">Overview</button>'
    + '<button class="dlt"    onclick="dlTab(\'pr\',this)">Progress</button>'
    + '<button class="dlt"    onclick="dlTab(\'kp\',this)">KPIs</button>'
    + '<button class="dlt"    onclick="dlTab(\'tm\',this)">Team</button>'
    + '<button class="dlt"    onclick="dlTab(\'ca\',this)">Corrective Actions</button>'
    + '<button class="dlt"    onclick="dlTab(\'nc\',this)">NCRs</button>'
    + '<button class="dlt"    onclick="dlTab(\'mb\',this)">Mobilisation</button>'
    + '<button class="dlt"    onclick="dlTab(\'md\',this)">Media &amp; Remarks</button>'
    + '</div>';

  // Overview pane
  var pp = Math.min(100, c.physical_progress_pct  || 0);
  var fp = Math.min(100, c.financial_progress_pct || 0);
  var agency  = (c.cnt_agencies  && c.cnt_agencies.name)  ? c.cnt_agencies.name  : '—';
  var company = (c.cnt_companies && c.cnt_companies.name) ? c.cnt_companies.name : '—';
  var loc = [c.lga, c.state].filter(Boolean).join(', ') || '—';

  var ov_pane = '<div id="dl-ov-pane" style="max-width:920px;margin:0 auto;padding:20px">'
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">'
    + card('Agency', agency) + card('Contractor', company)
    + card('Contract Value', fmtV(c.original_value))
    + card('Start Date', fmtD(c.start_date))
    + card('Original End Date', fmtD(c.original_completion_date))
    + (c.revised_completion_date ? card('Revised End Date', fmtD(c.revised_completion_date)) : '')
    + card('Status', SDISP[c.status]||c.status||'—')
    + card('Risk Level', ((c.risk_level||'').charAt(0).toUpperCase()+(c.risk_level||'').slice(1))||'—')
    + card('Location', loc)
    + card('Site Supervisor', supervisorName)
    + '</div>';

  if (c.risk_level === 'high' || c.risk_level === 'critical') {
    ov_pane += '<div style="background:'+rc+'11;border:1.5px solid '+rc+';color:'+rc
      + ';border-radius:8px;padding:12px 16px;font-size:13px;margin-bottom:16px">'
      + (c.risk_level==='critical'
         ? '🔴 <strong>Critical risk</strong> — Immediate executive intervention required.'
         : '🟠 <strong>High risk</strong> — Management escalation required.')
      + '</div>';
  }

  ov_pane += '<div class="dlsec">'
    + '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#6b7280;margin-bottom:12px">Progress</div>'
    + '<div style="margin-bottom:10px">'
    + '<div style="display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:4px"><span>Physical</span><span>'+pp+'%</span></div>'
    + '<div style="height:10px;background:#f1f5f9;border-radius:5px;overflow:hidden">'
    + '<div style="height:100%;width:'+pp+'%;background:#2E75B6;border-radius:5px"></div></div></div>'
    + '<div>'
    + '<div style="display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:4px"><span>Financial</span><span>'+fp+'%</span></div>'
    + '<div style="height:10px;background:#f1f5f9;border-radius:5px;overflow:hidden">'
    + '<div style="height:100%;width:'+fp+'%;background:#10b981;border-radius:5px"></div></div>'
    + '</div></div>';

  if (c.risk_notes) {
    ov_pane += '<div class="dlsec"><div class="dllabel">Risk Notes</div>'
      + '<div style="font-size:13px;line-height:1.7;color:#374151">'+esc(c.risk_notes)+'</div></div>';
  }
  if (c.notes) {
    ov_pane += '<div class="dlsec"><div class="dllabel">Notes</div>'
      + '<div style="font-size:13px;line-height:1.7;color:#374151">'+esc(c.notes)+'</div></div>';
  }
  ov_pane += '</div>';

  // Placeholder panes for other tabs
  var panes = ['pr','kp','tm','ca','nc','mb','md'].map(function(t){
    return '<div id="dl-'+t+'-pane" style="display:none;max-width:920px;margin:0 auto;padding:20px">'
      + '<div style="text-align:center;padding:40px;color:#6b7280;font-size:13px">Loading…</div></div>';
  }).join('');

  ov.innerHTML = hdr + tabs + ov_pane + panes;
  ov.scrollTop = 0;
}

function closeDetail() { document.getElementById('dl-ov').style.display = 'none'; }

function dlTab(name, btn) {
  ['ov','pr','kp','tm','ca','nc','mb','md'].forEach(function(t){
    document.getElementById('dl-'+t+'-pane').style.display = (t===name ? 'block' : 'none');
  });
  document.querySelectorAll('.dlt').forEach(function(b){ b.classList.remove('on'); });
  btn.classList.add('on');
  if (name !== 'ov' && !_dlDone[name]) { _dlDone[name] = true; dlLoad(name); }
}

async function dlLoad(name) {
  var sb2 = window._sb;
  var cid = _dlC && _dlC.id;
  var el  = document.getElementById('dl-'+name+'-pane');
  if (!sb2 || !cid || !el) return;
  function noData(m){ el.innerHTML='<div style="text-align:center;padding:40px;color:#6b7280;font-size:13px">'+m+'</div>'; }
  function tbl(headers, rowsData){
    if (!rowsData.length){ noData('No records found.'); return; }
    var h = headers.map(function(t){ return '<th>'+t+'</th>'; }).join('');
    var r = rowsData.map(function(cols){
      return '<tr>'+cols.map(function(v){ return '<td>'+(v||'—')+'</td>'; }).join('')+'</tr>';
    }).join('');
    el.innerHTML = '<div class="dlsec"><table class="dltbl"><thead><tr>'+h+'</tr></thead><tbody>'+r+'</tbody></table></div>';
  }
  function fmtD(v){ return v ? new Date(v).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) : '—'; }

  try {
    if (name === 'pr') {
      var r = await sb2.from('cnt_progress_reports').select('*').eq('contract_id',cid).order('report_date',{ascending:false});
      if (!r.data||!r.data.length){ noData('No progress reports yet.'); return; }
      tbl(['Date','Physical %','Financial %','Description'],
        r.data.map(function(x){ return [fmtD(x.report_date),(x.physical_progress_pct||0)+'%',(x.financial_progress_pct||0)+'%',esc(x.description||'')]; }));
    }
    else if (name === 'kp') {
      // Try cnt_kpi_records first (as per KPI review page), fall back to cnt_kpis
      var r = await sb2.from('cnt_kpi_records').select('*').eq('contract_id',cid);
      if (r.error) r = await sb2.from('cnt_kpis').select('*').eq('contract_id',cid);
      if (!r.data||!r.data.length){ noData('No KPI records found.'); return; }
      tbl(['KPI','Target','Actual','Score','Status'],
        r.data.map(function(x){ return [esc(x.kpi_name||x.name),x.target_value,x.actual_value,x.score,x.status]; }));
    }
    else if (name === 'tm') {
      var r = await sb2.from('cnt_contract_staff')
        .select('id,role_on_contract,start_date,cnt_profiles(id,full_name,email)')
        .eq('contract_id',cid).order('role_on_contract');
      var members = r.data || [];
      var hoc    = members.find(function(m){ return (m.role_on_contract||'').toLowerCase().includes('head'); });
      var others = members.filter(function(m){ return !(m.role_on_contract||'').toLowerCase().includes('head'); });
      var canMgr = window._canEditThis || _myRoles.has('CEO') || _myRoles.has('ContractAdmin');

      var h = '<div>';

      // ── HoC card ──
      h += '<div class="dlsec" style="margin-bottom:14px">'
        + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">'
        + '<div class="dllabel" style="margin-bottom:0">Head of Contract</div>'
        + (canMgr
          ? '<button onclick="showHoCAssign()" style="padding:5px 12px;border:1px solid #2E75B6;'
            + 'border-radius:6px;background:#fff;color:#2E75B6;cursor:pointer;font-size:12px;font-weight:600">'
            + (hoc ? '✎ Change' : '＋ Assign') + '</button>'
          : '')
        + '</div>';

      if (hoc && hoc.cnt_profiles) {
        var hp = hoc.cnt_profiles;
        h += '<div style="display:flex;align-items:center;gap:12px;padding:12px;'
          + 'background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px">'
          + '<div style="width:38px;height:38px;border-radius:50%;background:#2E75B6;color:#fff;'
          + 'display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0">'
          + esc((hp.full_name||'?').charAt(0).toUpperCase()) + '</div>'
          + '<div><div style="font-weight:700;font-size:13px;color:#1F3864">' + esc(hp.full_name||'—') + '</div>'
          + '<div style="font-size:12px;color:#6b7280">' + esc(hp.email||'') + '</div></div>'
          + (canMgr
            ? '<button onclick="hocTabClear(\'' + cid + '\')" style="margin-left:auto;padding:4px 10px;'
              + 'border:1px solid #fca5a5;border-radius:6px;background:#fff;color:#dc2626;'
              + 'cursor:pointer;font-size:11px;font-weight:600">Remove</button>'
            : '')
          + '</div>';
      } else {
        h += '<div style="color:#6b7280;font-size:13px;padding:12px;background:#f8fafc;'
          + 'border:1px solid #e2e8f0;border-radius:8px;text-align:center">'
          + 'No Head of Contract assigned yet.</div>';
      }

      if (canMgr) {
        h += '<div id="hoc-assign-wrap" style="display:none;margin-top:12px;position:relative">'
          + '<input id="hoc-assign-search" placeholder="Search by name or email…"'
          + ' oninput="hocTabSearch(\'' + cid + '\')" autocomplete="off"'
          + ' style="width:100%;box-sizing:border-box;border:1.5px solid #2E75B6;'
          + 'border-radius:7px;padding:9px 12px;font-size:13px;outline:none">'
          + '<div id="hoc-assign-results" style="display:none;position:absolute;top:100%;left:0;right:0;'
          + 'background:#fff;border:1.5px solid #2E75B6;border-top:none;border-radius:0 0 8px 8px;'
          + 'box-shadow:0 4px 12px rgba(0,0,0,.1);z-index:50;max-height:180px;overflow-y:auto"></div>'
          + '</div>';
      }
      h += '</div>';

      // ── Other team members ──
      h += '<div class="dlsec"><div class="dllabel" style="margin-bottom:12px">Team Members (' + others.length + ')</div>';
      if (!others.length) {
        h += '<div style="color:#6b7280;font-size:13px;text-align:center;padding:16px">No other team members recorded.</div>';
      } else {
        h += '<table class="dltbl"><thead><tr><th>Name</th><th>Role</th><th>Email</th><th>Start Date</th></tr></thead><tbody>'
          + others.map(function(x){
            return '<tr><td>' + esc((x.cnt_profiles&&x.cnt_profiles.full_name)||'—') + '</td>'
              + '<td>' + esc(x.role_on_contract||'—') + '</td>'
              + '<td>' + esc((x.cnt_profiles&&x.cnt_profiles.email)||'—') + '</td>'
              + '<td>' + fmtD(x.start_date) + '</td></tr>';
          }).join('')
          + '</tbody></table>';
      }
      h += '</div></div>';
      el.innerHTML = h;
    }
    else if (name === 'ca') {
      var r = await sb2.from('cnt_corrective_actions').select('*').eq('contract_id',cid).order('created_at',{ascending:false});
      if (!r.data||!r.data.length){ noData('No corrective actions recorded.'); return; }
      tbl(['Title','Status','Due Date','Priority'],
        r.data.map(function(x){ return [esc(x.title||x.description),x.status,fmtD(x.due_date),x.priority]; }));
    }
    else if (name === 'nc') {
      var r = await sb2.from('cnt_ncrs').select('*').eq('contract_id',cid).order('created_at',{ascending:false});
      if (!r.data||!r.data.length){ noData('No NCRs raised.'); return; }
      tbl(['Reference','Title','Status','Date'],
        r.data.map(function(x){ return [x.ncr_ref||x.reference_number,esc(x.title),x.status,fmtD(x.created_at)]; }));
    }
    else if (name === 'mb') {
      var r = await sb2.from('cnt_mobilization').select('*').eq('contract_id',cid).maybeSingle();
      var d = r.data;
      if (!d){ noData('No mobilisation record found.'); return; }
      var keys   = ['personnel','equipment','materials','procedures','hse','insurance'];
      var labels = ['Approved personnel available','Equipment available','Materials planned',
                    'Work procedures reviewed','HSE plan in place','Insurance documents submitted'];
      tbl(['Item','Status'], keys.map(function(k,i){
        var v = d[k]==='yes' ? '<span style="color:#22c55e;font-weight:700">✓ Yes</span>'
              : d[k]==='no'  ? '<span style="color:#ef4444;font-weight:700">✗ No</span>' : '—';
        return [labels[i], v];
      }));
    }
    else if (name === 'md') {
      await loadMediaTab(cid, el);
    }
  } catch(e) {
    el.innerHTML = '<div style="text-align:center;padding:40px;color:#dc2626;font-size:13px">Error: '+esc(e.message)+'</div>';
  }
}

// ── Media & Remarks tab ───────────────────────────────────────────
async function loadMediaTab(cid, el) {
  var sb2 = window._sb;
  var canUpload = _isSupervisor || _myRoles.has('CEO') || _myRoles.has('ContractAdmin') || _myRoles.has('HeadOfContract');
  var canRemark = _myRoles.has('CEO') || _myRoles.has('ContractAdmin') || _myRoles.has('HeadOfContract');

  var results = await Promise.all([
    sb2.from('cnt_contract_remarks')
      .select('id,remark_text,visit_date,created_at,cnt_profiles(full_name)')
      .eq('contract_id',cid).order('created_at',{ascending:false}),
    sb2.from('cnt_contract_media')
      .select('id,file_name,file_url,caption,mime_type,upload_type,created_at,cnt_profiles(full_name)')
      .eq('contract_id',cid).order('created_at',{ascending:false})
  ]);
  var remarks = results[0].data || [];
  var media   = results[1].data || [];

  var html = '<div>';

  // ── Forms ──
  if (canUpload || canRemark) {
    html += '<div class="dlsec">';
    if (canUpload) {
      html += '<div class="dllabel" style="margin-bottom:10px">Upload Evidence / Media</div>'
        + '<div style="display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;margin-bottom:'+(canRemark?'0':'4px')+'">'
        + '<div>'
        + '<input type="file" id="md-file" accept="image/*,video/*,application/pdf,.doc,.docx,.xlsx,.xls"'
        + ' style="display:block;width:100%;box-sizing:border-box;border:1px solid #e2e8f0;'
        + 'border-radius:7px;padding:8px 12px;font-size:13px;margin-bottom:8px">'
        + '<input id="md-caption" placeholder="Caption (optional)"'
        + ' style="width:100%;box-sizing:border-box;border:1px solid #e2e8f0;border-radius:7px;'
        + 'padding:9px 12px;font-size:13px;outline:none">'
        + '</div>'
        + '<button onclick="uploadMedia(\''+cid+'\')" id="upload-btn"'
        + ' style="padding:10px 18px;border:none;border-radius:7px;background:#2E75B6;'
        + 'color:#fff;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;height:42px">Upload</button>'
        + '</div>';
    }
    if (canRemark) {
      html += '<div style="'+(canUpload?'border-top:1px solid #e2e8f0;padding-top:14px;margin-top:14px':'')+'">'
        + '<div class="dllabel" style="margin-bottom:10px">Add Site Visit Remark</div>'
        + '<div style="display:grid;grid-template-columns:1fr 160px;gap:10px;margin-bottom:10px">'
        + '<textarea id="md-remark" rows="2" placeholder="Describe site observations…"'
        + ' style="width:100%;box-sizing:border-box;border:1px solid #e2e8f0;border-radius:7px;'
        + 'padding:9px 12px;font-size:13px;resize:vertical;outline:none"></textarea>'
        + '<div>'
        + '<label style="font-size:11px;color:#6b7280;font-weight:600;display:block;margin-bottom:4px">Visit Date</label>'
        + '<input type="date" id="md-visit-date"'
        + ' style="width:100%;box-sizing:border-box;border:1px solid #e2e8f0;border-radius:7px;padding:9px 12px;font-size:13px;outline:none">'
        + '</div>'
        + '</div>'
        + '<button onclick="addRemark(\''+cid+'\')"'
        + ' style="padding:9px 18px;border:none;border-radius:7px;background:#1F3864;'
        + 'color:#fff;font-size:13px;font-weight:700;cursor:pointer">Save Remark</button>'
        + '</div>';
    }
    html += '</div>';
  }

  // ── Remarks list ──
  html += '<div class="dlsec"><div class="dllabel" style="margin-bottom:12px">Site Remarks ('+remarks.length+')</div>';
  if (!remarks.length) {
    html += '<div style="color:#6b7280;font-size:13px;text-align:center;padding:16px">No remarks recorded yet.</div>';
  } else {
    remarks.forEach(function(rem){
      var vd = rem.visit_date ? new Date(rem.visit_date).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) : '';
      html += '<div class="remark-item">'
        + (vd ? '<div class="remark-date">📅 Site Visit: '+vd+'</div>' : '')
        + '<div class="remark-text">'+esc(rem.remark_text)+'</div>'
        + '<div class="remark-author">— '+(rem.cnt_profiles&&rem.cnt_profiles.full_name||'Unknown')
        + ' · '+new Date(rem.created_at).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+'</div>'
        + '</div>';
    });
  }
  html += '</div>';

  // ── Media grid ──
  html += '<div class="dlsec"><div class="dllabel" style="margin-bottom:12px">Media Files ('+media.length+')</div>';
  if (!media.length) {
    html += '<div style="color:#6b7280;font-size:13px;text-align:center;padding:16px">No media uploaded yet.</div>';
  } else {
    html += '<div class="media-grid">';
    media.forEach(function(m){
      var isImg = m.mime_type && m.mime_type.startsWith('image/');
      html += '<div class="media-item">'
        + '<a href="'+m.file_url+'" target="_blank" style="display:block;text-decoration:none">'
        + (isImg
          ? '<img src="'+m.file_url+'" class="media-thumb" alt="'+esc(m.file_name)+'" onerror="this.style.background=\'#f1f5f9\'">'
          : '<div style="height:80px;display:flex;align-items:center;justify-content:center;font-size:28px;background:#f8fafc">📎</div>')
        + '</a>'
        + '<div class="media-info">'
        + '<div style="font-weight:600;color:#374151;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:2px">'+esc(m.file_name)+'</div>'
        + (m.caption ? '<div style="margin-bottom:2px">'+esc(m.caption)+'</div>' : '')
        + '<div>'+new Date(m.created_at).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+'</div>'
        + '</div></div>';
    });
    html += '</div>';
  }
  html += '</div></div>';
  el.innerHTML = html;
}

async function uploadMedia(cid) {
  var sb2    = window._sb;
  var file   = document.getElementById('md-file') && document.getElementById('md-file').files[0];
  var caption= document.getElementById('md-caption') ? document.getElementById('md-caption').value.trim() : '';
  if (!file) { toast('Select a file first', 'warn'); return; }

  var btn = document.getElementById('upload-btn');
  if (btn) { btn.textContent = 'Uploading…'; btn.disabled = true; }

  try {
    var safeName = file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    var path = cid + '/' + Date.now() + '-' + safeName;

    var upRes = await sb2.storage.from('contract-media').upload(path, file, {upsert:false});
    if (upRes.error) throw new Error('Storage: ' + upRes.error.message);

    var urlRes = sb2.storage.from('contract-media').getPublicUrl(path);
    var publicUrl = urlRes.data && urlRes.data.publicUrl;

    var dbRes = await sb2.from('cnt_contract_media').insert({
      contract_id: cid,
      uploaded_by: _myProfileId,
      file_name:   file.name,
      file_url:    publicUrl,
      file_size:   file.size,
      mime_type:   file.type || 'application/octet-stream',
      caption:     caption || null,
      upload_type: 'evidence'
    });
    if (dbRes.error) throw new Error('DB: ' + dbRes.error.message);

    toast('File uploaded', 'ok');
    if (document.getElementById('md-file')) document.getElementById('md-file').value = '';
    if (document.getElementById('md-caption')) document.getElementById('md-caption').value = '';
    _dlDone['md'] = false;
    await loadMediaTab(cid, document.getElementById('dl-md-pane'));
  } catch(e) {
    toast('Upload failed: ' + e.message, 'err');
  } finally {
    if (btn) { btn.textContent = 'Upload'; btn.disabled = false; }
  }
}

async function addRemark(cid) {
  var text = document.getElementById('md-remark') ? document.getElementById('md-remark').value.trim() : '';
  var date = document.getElementById('md-visit-date') ? document.getElementById('md-visit-date').value : '';
  if (!text) { toast('Enter a remark first', 'warn'); return; }

  var res = await window._sb.from('cnt_contract_remarks').insert({
    contract_id: cid,
    author_id:   _myProfileId,
    remark_text: text,
    visit_date:  date || null
  });
  if (res.error) { toast(res.error.message, 'err'); return; }
  toast('Remark saved', 'ok');
  if (document.getElementById('md-remark')) document.getElementById('md-remark').value = '';
  if (document.getElementById('md-visit-date')) document.getElementById('md-visit-date').value = '';
  _dlDone['md'] = false;
  await loadMediaTab(cid, document.getElementById('dl-md-pane'));
}
</script>

          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
          <option value="critical">Critical</option>
        </select>
      </div>
    </div>

    <!-- Dates -->
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:16px">
      <div>
        <label class="ec-lbl">Start Date</label>
        <input id="ec-start" type="date" class="ec-inp">
      </div>
      <div>
        <label class="ec-lbl">End Date</label>
        <input id="ec-end" type="date" class="ec-inp">
      </div>
      <div>
        <label class="ec-lbl">Revised End Date</label>
        <input id="ec-revised" type="date" class="ec-inp">
      </div>
    </div>

    <!-- Progress -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px">
      <div>
        <label class="ec-lbl">Physical Progress %</label>
        <input id="ec-pp" type="number" min="0" max="100" placeholder="0" class="ec-inp">
      </div>
      <div>
        <label class="ec-lbl">Financial Progress %</label>
        <input id="ec-fp" type="number" min="0" max="100" placeholder="0" class="ec-inp">
      </div>
    </div>

    <!-- Risk Notes -->
    <div style="margin-bottom:16px">
      <label class="ec-lbl">Risk Notes</label>
      <textarea id="ec-risk-notes" rows="2" class="ec-ta"></textarea>
    </div>

    <!-- General Notes -->
    <div style="margin-bottom:20px">
      <label class="ec-lbl">Notes</label>
      <textarea id="ec-notes" rows="2" class="ec-ta"></textarea>
    </div>

    <div id="ec-err" style="display:none;background:#fef2f2;border:1px solid #fca5a5;
         color:#dc2626;border-radius:7px;padding:10px 14px;font-size:13px;margin-bottom:14px"></div>

    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button onclick="closeEdit()"
              style="padding:10px 22px;border:1px solid #e2e8f0;border-radius:7px;
                     background:#fff;cursor:pointer;font-size:13px;font-weight:600;color:#374151">Cancel</button>
      <button onclick="saveContract()" id="ec-save-btn"
              style="padding:10px 28px;border:none;border-radius:7px;
                     background:#1F3864;color:#fff;cursor:pointer;font-size:13px;font-weight:700">Save Changes</button>
    </div>
  </div>
</div>

<style>
.ec-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  color:#6b7280;display:block;margin-bottom:5px}
.ec-inp{width:100%;box-sizing:border-box;border:1px solid #e2e8f0;border-radius:7px;
  padding:9px 12px;font-size:13px;outline:none}
.ec-sel{width:100%;box-sizing:border-box;border:1px solid #e2e8f0;border-radius:7px;
  padding:9px 12px;font-size:13px;outline:none;background:#fff}
.ec-ta{width:100%;box-sizing:border-box;border:1px solid #e2e8f0;border-radius:7px;
  padding:9px 12px;font-size:13px;resize:vertical;outline:none}
</style>

<script>
var _ecId = null;
var _hocSelection = null;   // {id, name, email} or null
var _hocSearchTimer = null;
var _hocTabTimer    = null;

async function editContract() {
  var c = _dlC;
  if (!c) return;
  if (!window._canEditThis) { toast('You do not have permission to edit this contract.', 'warn'); return; }

  _ecId = c.id;

  document.getElementById('ec-ref').textContent          = c.contract_id || 'Contract';
  document.getElementById('ec-contract-id').value        = c.contract_id || '';
  document.getElementById('ec-title').value              = c.title || '';
  document.getElementById('ec-status').value             = c.status || 'Pipeline';
  document.getElementById('ec-value').value              = c.original_value || '';
  document.getElementById('ec-state').value              = c.state || '';
  document.getElementById('ec-risk').value               = c.risk_level || 'medium';
  document.getElementById('ec-start').value              = c.start_date               ? c.start_date.slice(0,10)               : '';
  document.getElementById('ec-end').value                = c.original_completion_date ? c.original_completion_date.slice(0,10) : '';
  document.getElementById('ec-revised').value            = c.revised_completion_date  ? c.revised_completion_date.slice(0,10)  : '';
  document.getElementById('ec-pp').value                 = c.physical_progress_pct  ?? 0;
  document.getElementById('ec-fp').value                 = c.financial_progress_pct ?? 0;
  document.getElementById('ec-risk-notes').value         = c.risk_notes || '';
  document.getElementById('ec-notes').value              = c.notes || '';
  document.getElementById('ec-err').style.display        = 'none';
  document.getElementById('ec-save-btn').textContent     = 'Save Changes';
  document.getElementById('ec-save-btn').disabled        = false;

  // Agency — read-only
  document.getElementById('ec-agency-display').textContent =
    (c.cnt_agencies && c.cnt_agencies.name) ? c.cnt_agencies.name : '—';

  // Companies dropdown
  var coSel = document.getElementById('ec-company');
  coSel.innerHTML = '<option value="">— select —</option>';
  var coRes = await window._sb.from('cnt_companies').select('id,name').order('name');
  (coRes.data || []).forEach(function(co){
    var o = document.createElement('option');
    o.value = co.id; o.textContent = co.name;
    if (co.id === c.assigned_company_id) o.selected = true;
    coSel.appendChild(o);
  });

  // Site Supervisor dropdown — users with SiteSupervisor role
  var svSel = document.getElementById('ec-supervisor');
  svSel.innerHTML = '<option value="">— None assigned —</option>';
  try {
    var svRoleR = await window._sb.from('cnt_roles').select('id').eq('name','SiteSupervisor').maybeSingle();
    var svRoleId = svRoleR.data && svRoleR.data.id;
    if (svRoleId) {
      var svPrR = await window._sb.from('cnt_profile_roles')
        .select('profile_id, cnt_profiles(id,full_name)')
        .eq('role_id', svRoleId);
      (svPrR.data || []).forEach(function(pr){
        if (pr.cnt_profiles) {
          var o = document.createElement('option');
          o.value = pr.cnt_profiles.id;
          o.textContent = pr.cnt_profiles.full_name;
          if (pr.cnt_profiles.id === c.site_supervisor_id) o.selected = true;
          svSel.appendChild(o);
        }
      });
    }
  } catch(e) { /* non-critical */ }

  // Head of Contract — load from cnt_contract_staff
  _hocSelection = null;
  document.getElementById('ec-hoc-selected').style.display = 'none';
  document.getElementById('ec-hoc-search').style.display   = 'block';
  document.getElementById('ec-hoc-search').value           = '';
  document.getElementById('ec-hoc-results').style.display  = 'none';
  try {
    var hocR = await window._sb.from('cnt_contract_staff')
      .select('cnt_profiles(id,full_name,email)')
      .eq('contract_id', c.id).ilike('role_on_contract','%head%').maybeSingle();
    if (hocR.data && hocR.data.cnt_profiles) {
      var hp = hocR.data.cnt_profiles;
      hocSelectUser(hp.id, hp.full_name || hp.email, hp.email);
    }
  } catch(e) {}

  document.getElementById('ec-backdrop').style.display = 'block';
  document.getElementById('ec-modal').style.display    = 'block';
}

function closeEdit() {
  document.getElementById('ec-backdrop').style.display = 'none';
  document.getElementById('ec-modal').style.display    = 'none';
}

async function saveContract() {
  var btn = document.getElementById('ec-save-btn');
  var err = document.getElementById('ec-err');
  err.style.display = 'none';
  btn.textContent   = 'Saving…';
  btn.disabled      = true;

  function v(id){ return document.getElementById(id).value.trim() || null; }
  function n(id){ var x = parseFloat(document.getElementById(id).value); return isNaN(x) ? null : x; }

  var payload = {
    contract_id:              v('ec-contract-id'),
    title:                    v('ec-title'),
    status:                   v('ec-status'),
    assigned_company_id:      v('ec-company') || null,
    site_supervisor_id:       v('ec-supervisor') || null,
    original_value:           n('ec-value'),
    state:                    v('ec-state'),
    risk_level:               v('ec-risk'),
    start_date:               v('ec-start'),
    original_completion_date: v('ec-end'),
    revised_completion_date:  v('ec-revised'),
    physical_progress_pct:    n('ec-pp'),
    financial_progress_pct:   n('ec-fp'),
    risk_notes:               v('ec-risk-notes'),
    notes:                    v('ec-notes')
    // agency_id intentionally omitted — it is read-only
  };

  // Remove null date fields to avoid PostgREST type errors
  ['start_date','original_completion_date','revised_completion_date'].forEach(function(k){
    if (!payload[k]) delete payload[k];
  });

  var res = await window._sb.from('cnt_contracts').update(payload).eq('id', _ecId);

  if (res.error) {
    err.textContent   = 'Save failed: ' + res.error.message;
    err.style.display = 'block';
    btn.textContent   = 'Save Changes';
    btn.disabled      = false;
    return;
  }

  // Save Head of Contract (always sync — idempotent)
  var hocRes = await window._sb.rpc('cnt_set_head_of_contract', {
    p_contract_id: _ecId,
    p_profile_id:  _hocSelection ? _hocSelection.id   : null,
    p_full_name:   _hocSelection ? _hocSelection.name  : '',
    p_email:       _hocSelection ? _hocSelection.email : ''
  });
  if (hocRes.error) {
    err.textContent   = 'Contract saved but HoC update failed: ' + hocRes.error.message;
    err.style.display = 'block';
  }

  // Update in-memory record
  var idx = (window._contracts || []).findIndex(function(c){ return c.id === _ecId; });
  if (idx >= 0) {
    Object.assign(window._contracts[idx], payload);
    _dlC  = window._contracts[idx];
    rows  = window._contracts;
  }

  btn.textContent = 'Saved ✓';
  setTimeout(function(){
    closeEdit();
    openDetail_overlay(_dlC);
    btn.disabled = false;
  }, 700);
}

// ── Head of Contract search (edit modal) ─────────────────────────
function hocSearchInput() {
  var q   = (document.getElementById('ec-hoc-search').value || '').trim();
  var res = document.getElementById('ec-hoc-results');
  if (!q || q.length < 2) { res.style.display = 'none'; return; }
  res.innerHTML = '<div style="padding:10px 14px;font-size:13px;color:#6b7280">Searching…</div>';
  res.style.display = 'block';
  clearTimeout(_hocSearchTimer);
  _hocSearchTimer = setTimeout(async function() {
    var r = await window._sb.rpc('cnt_search_users', { search_term: q });
    var hits = r.data || [];
    res.innerHTML = hits.length
      ? hits.map(function(u) {
          return '<div onclick="hocSelectUser(\'' + u.id + '\',\'' + esc(u.display_name||u.email) + '\',\'' + esc(u.email) + '\')"'
            + ' style="padding:10px 14px;cursor:pointer;border-top:1px solid #f1f5f9;font-size:13px"'
            + ' onmouseover="this.style.background=\'#f4f7ff\'" onmouseout="this.style.background=\'\'">'
            + '<div style="font-weight:600">' + esc(u.display_name||u.email) + '</div>'
            + '<div style="font-size:11px;color:#6b7280">' + esc(u.email) + '</div></div>';
        }).join('')
      : '<div style="padding:10px 14px;font-size:13px;color:#6b7280">No matching users found</div>';
    res.style.display = 'block';
  }, 300);
}
function hocSelectUser(id, name, email) {
  _hocSelection = { id: id, name: name, email: email };
  document.getElementById('ec-hoc-name').textContent      = name;
  document.getElementById('ec-hoc-email').textContent     = email;
  document.getElementById('ec-hoc-selected').style.display= 'flex';
  document.getElementById('ec-hoc-search').style.display  = 'none';
  document.getElementById('ec-hoc-results').style.display = 'none';
  document.getElementById('ec-hoc-search').value = '';
}
function hocClear() {
  _hocSelection = null;
  document.getElementById('ec-hoc-selected').style.display = 'none';
  document.getElementById('ec-hoc-search').style.display   = 'block';
  document.getElementById('ec-hoc-results').style.display  = 'none';
}

// ── Head of Contract — Team tab inline assignment ─────────────────
function showHoCAssign() {
  var w = document.getElementById('hoc-assign-wrap');
  if (w) w.style.display = w.style.display === 'none' ? 'block' : 'none';
}
function hocTabSearch(cid) {
  var q   = (document.getElementById('hoc-assign-search').value || '').trim();
  var res = document.getElementById('hoc-assign-results');
  if (!q || q.length < 2) { res.style.display = 'none'; return; }
  res.innerHTML = '<div style="padding:10px 14px;font-size:13px;color:#6b7280">Searching…</div>';
  res.style.display = 'block';
  clearTimeout(_hocTabTimer);
  _hocTabTimer = setTimeout(async function() {
    var r = await window._sb.rpc('cnt_search_users', { search_term: q });
    var hits = r.data || [];
    res.innerHTML = hits.length
      ? hits.map(function(u) {
          var n = esc(u.display_name || u.email);
          var em= esc(u.email);
          return '<div onclick="hocTabSelect(\'' + cid + '\',\'' + u.id + '\',\'' + n + '\',\'' + em + '\')"'
            + ' style="padding:10px 14px;cursor:pointer;border-top:1px solid #f1f5f9;font-size:13px"'
            + ' onmouseover="this.style.background=\'#f4f7ff\'" onmouseout="this.style.background=\'\'">'
            + '<div style="font-weight:600">' + n + '</div>'
            + '<div style="font-size:11px;color:#6b7280">' + em + '</div></div>';
        }).join('')
      : '<div style="padding:10px 14px;font-size:13px;color:#6b7280">No matching users found</div>';
  }, 300);
}
async function hocTabSelect(cid, id, name, email) {
  var r = await window._sb.rpc('cnt_set_head_of_contract',
    { p_contract_id: cid, p_profile_id: id, p_full_name: name, p_email: email });
  if (r.error) { toast('Failed: ' + r.error.message, 'err'); return; }
  toast('Head of Contract assigned', 'ok');
  _dlDone['tm'] = false;
  dlLoad('tm');
}
async function hocTabClear(cid) {
  if (!confirm('Remove the Head of Contract from this contract?')) return;
  var r = await window._sb.rpc('cnt_set_head_of_contract',
    { p_contract_id: cid, p_profile_id: null, p_full_name: '', p_email: '' });
  if (r.error) { toast('Failed: ' + r.error.message, 'err'); return; }
  toast('Head of Contract removed', 'ok');
  _dlDone['tm'] = false;
  dlLoad('tm');
}

document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeEdit(); });
</script>
</body>
</html>
