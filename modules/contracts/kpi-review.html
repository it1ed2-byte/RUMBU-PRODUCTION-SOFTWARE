<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KPI Review</title>
<script src="auth-contracts.js"></script>
<script src="sidebar-contracts.js"></script>
<link rel="stylesheet" href="contracts.css">
</head>
<body>
<div class="page-hdr">
  <div class="ph-left">
    <div class="ph-icon">🎯</div>
    <div>
      <div class="ph-title">KPI Review</div>
      <div class="ph-sub">Review and approve contractor KPI submissions</div>
    </div>
  </div>
  <div class="ph-right">
    <button class="btn btn-hdr" onclick="location.href='contracts.html'">← Contracts</button>
  </div>
</div>

<div class="content">
  <div id="loading" class="loading-wrap">
    <div class="spinner"></div>
    <div class="loading-txt">Loading KPI records…</div>
  </div>

  <div id="app" style="display:none">
    <div class="toolbar">
      <select class="flt" id="fStatus" onchange="render()">
        <option value="">All Status</option>
        <option value="pending">Pending Review</option>
        <option value="approved">Approved</option>
        <option value="rejected">Rejected</option>
      </select>
    </div>
    <div class="tbl-wrap">
      <div class="tbl-scroll">
        <table>
          <thead>
            <tr><th>Contract</th><th>KPI Name</th><th>Target</th><th>Actual</th><th>Score</th><th>Submitted</th><th>Status</th><th>Actions</th></tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Review modal -->
<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-hdr">
      <span class="modal-title">Review KPI Record</span>
      <button class="modal-x" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Close</button>
      <button class="btn btn-bad" onclick="doReview('rejected')">✗ Reject</button>
      <button class="btn btn-ok"  onclick="doReview('approved')">✓ Approve</button>
    </div>
  </div>
</div>

<script>
let sb, rows = [], reviewing = null;

async function init() {
  try {
    const auth = await guardPage();
    if (!auth) return;
    sb = auth.sb;
    const { data } = await sb.from('cnt_kpi_records').select(`
      id,kpi_name,target_value,actual_value,score,notes,submitted_at,review_status,
      cnt_contracts(contract_id,title)
    `).order('submitted_at',{ascending:false});
    rows = data ?? [];
    render();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  } catch(e) {
    document.getElementById('loading').innerHTML = `<div style="color:var(--bad);text-align:center;padding:40px">⚠️ ${e.message}</div>`;
  }
}

const ST = { pending:['b-warn','Pending'], approved:['b-ok','Approved'], rejected:['b-bad','Rejected'] };

function render() {
  const f = document.getElementById('fStatus').value;
  const data = f ? rows.filter(r => r.review_status === f) : rows;
  const tbody = document.getElementById('tbody');
  if (!data.length) {
    tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state"><span class="e-icon">🎯</span><p>${rows.length ? 'No records match.' : 'No KPI records submitted yet.'}</p></div></td></tr>`;
    return;
  }
  tbody.innerHTML = data.map(r => {
    const [bCls, bLbl] = ST[r.review_status] ?? ['b-gray', r.review_status ?? '—'];
    const score = r.score != null ? `<span style="font-weight:700">${r.score}</span>` : '—';
    return `<tr>
      <td>
        <span class="ref">${r.cnt_contracts?.contract_id ?? '—'}</span>
        <div style="font-size:12px;color:var(--muted);margin-top:2px">${r.cnt_contracts?.title ?? ''}</div>
      </td>
      <td style="font-weight:600">${r.kpi_name ?? '—'}</td>
      <td>${r.target_value ?? '—'}</td>
      <td>${r.actual_value ?? '—'}</td>
      <td>${score}</td>
      <td style="font-size:12.5px">${r.submitted_at ? fmtDate(r.submitted_at) : '—'}</td>
      <td><span class="badge ${bCls}">${bLbl}</span></td>
      <td>
        ${r.review_status === 'pending'
          ? `<button class="btn btn-accent btn-sm" onclick="openModal('${r.id}')">Review</button>`
          : '<span style="color:var(--muted);font-size:12px">Done</span>'}
      </td>
    </tr>`;
  }).join('');
}

function openModal(id) {
  reviewing = rows.find(r => r.id === id);
  if (!reviewing) return;
  document.getElementById('modal-body').innerHTML = `
    <div class="g2" style="margin-bottom:16px">
      <div><div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted);margin-bottom:6px">Target</div>
        <div style="font-size:22px;font-weight:800;color:var(--heading)">${reviewing.target_value ?? '—'}</div></div>
      <div><div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted);margin-bottom:6px">Actual</div>
        <div style="font-size:22px;font-weight:800;color:${reviewing.actual_value >= reviewing.target_value ? 'var(--ok)' : 'var(--warn)'}">${reviewing.actual_value ?? '—'}</div></div>
    </div>
    <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted);margin-bottom:6px">Notes</div>
    <div style="background:var(--subtle);border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-size:13.5px;line-height:1.7">
      ${reviewing.notes ?? '<em style="color:var(--muted)">No notes provided.</em>'}
    </div>`;
  document.getElementById('overlay').classList.add('open');
}
function closeModal() { document.getElementById('overlay').classList.remove('open'); reviewing = null; }

async function doReview(status) {
  if (!reviewing) return;
  await sb.from('cnt_kpi_records').update({
    review_status: status, reviewed_at: new Date().toISOString()
  }).eq('id', reviewing.id);
  const r = rows.find(r => r.id === reviewing.id);
  if (r) r.review_status = status;
  closeModal(); render();
}
function fmtDate(iso) {
  return new Date(iso).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
}
init();
</script>
</body>
</html>
