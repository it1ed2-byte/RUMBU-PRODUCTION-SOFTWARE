<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Companies</title>
<style>
:root{--primary:#1F3864;--accent:#2E75B6;--ok:#22c55e;--bad:#ef4444;--warn:#f59e0b;
--bg:#f8fafc;--card:#fff;--line:#e2e8f0;--muted:#64748b;--heading:#0f172a;
--th-bg:#f1f5f9;--th-fg:#374151;--shadow:0 1px 3px rgba(0,0,0,.08);--radius:8px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;font-size:14px;background:var(--bg);color:var(--heading);padding:20px}
h1{font-size:20px;font-weight:700;color:var(--primary);margin-bottom:4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.toolbar{display:flex;gap:10px;margin-bottom:14px;align-items:center}
.toolbar input{border:1px solid var(--line);border-radius:var(--radius);padding:7px 10px;font-size:13px;flex:1;background:var(--card)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border:none;border-radius:var(--radius);font-size:13px;cursor:pointer;font-weight:500}
.btn-accent{background:var(--accent);color:#fff}.btn-accent:hover{background:#1a5fa8}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}.btn-ghost:hover{background:var(--th-bg)}
.btn-bad{background:var(--bad);color:#fff}
.btn-sm{padding:4px 10px;font-size:12px}
.table-wrap{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{background:var(--th-bg);color:var(--th-fg);font-size:12px;font-weight:600;text-align:left;padding:10px 12px}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
.status{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;background:var(--th-bg);color:var(--th-fg)}
.status.ok{background:#dcfce7;color:#166534}
.empty{text-align:center;padding:30px;color:var(--muted)}
.contracts-badge{background:var(--accent);color:#fff;border-radius:12px;padding:1px 8px;font-size:11px;font-weight:600}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center}
.overlay.open{display:flex}
.modal{background:var(--card);border-radius:var(--radius);box-shadow:0 8px 32px rgba(0,0,0,.18);padding:24px;width:540px;max-width:95vw;max-height:90vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:700;color:var(--primary);margin-bottom:18px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
label{font-size:12px;font-weight:600;color:var(--th-fg)}
input,select,textarea{border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;font-size:14px;background:var(--card);width:100%}
input:focus,select:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
</style>
</head>
<body>
<h1>Subcontractor Companies</h1>
<p class="sub">Registered companies assigned to contracts and granted portal access.</p>
<div class="toolbar">
  <input id="q" type="search" placeholder="Search companies…" oninput="render()">
  <button class="btn btn-accent" onclick="openModal()">+ Add Company</button>
</div>
<div class="table-wrap">
  <div class="table-scroll">
    <table>
      <thead><tr><th>Company Name</th><th>Reg. No.</th><th>Contact</th><th>Phone</th><th>Email</th><th>Active Contracts</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-title" id="modal-title">Add Company</div>
    <input type="hidden" id="edit-id">
    <div class="form-row">
      <div class="field"><label>Company Name *</label><input id="f-name" placeholder="Full legal name"></div>
      <div class="field"><label>Reg. Number</label><input id="f-reg" placeholder="CAC / RC number"></div>
    </div>
    <div class="field"><label>Address</label><textarea id="f-address" rows="2" placeholder="Business address"></textarea></div>
    <div class="form-row">
      <div class="field"><label>Contact Person *</label><input id="f-contact" placeholder="Name"></div>
      <div class="field"><label>Contact Phone</label><input id="f-phone" placeholder="+234…"></div>
    </div>
    <div class="form-row">
      <div class="field"><label>Contact Email</label><input id="f-email" type="email" placeholder="contact@company.ng"></div>
      <div class="field"><label>Status</label>
        <select id="f-status"><option value="active">Active</option><option value="inactive">Inactive</option><option value="suspended">Suspended</option></select>
      </div>
    </div>
    <div class="field"><label>Notes</label><textarea id="f-notes" rows="2" placeholder="Any remarks…"></textarea></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-accent" onclick="save()">Save Company</button>
    </div>
  </div>
</div>

<script>
let sb, rows = [], contractCounts = {};

async function init() {
  sb = window.parent?.sb;
  if (!sb) return;
  const [cRes, ctRes] = await Promise.all([
    sb.from('cnt_companies').select('*').order('name'),
    sb.from('cnt_contracts').select('assigned_company_id').in('status',['active','awarded'])
  ]);
  rows = cRes.data ?? [];
  contractCounts = {};
  (ctRes.data ?? []).forEach(c => {
    if (c.assigned_company_id) contractCounts[c.assigned_company_id] = (contractCounts[c.assigned_company_id]??0)+1;
  });
  render();
}

function render() {
  const q = document.getElementById('q').value.toLowerCase();
  const data = rows.filter(r => !q || r.name?.toLowerCase().includes(q) || r.reg_number?.toLowerCase().includes(q));
  const t = document.getElementById('tbody');
  if (!data.length) { t.innerHTML = '<tr><td colspan="8" class="empty">No companies found</td></tr>'; return; }
  t.innerHTML = data.map(r => {
    const cnt = contractCounts[r.id] ?? 0;
    const stCls = r.status==='active'?'ok':r.status==='suspended'?'err':'';
    return `<tr>
      <td><strong>${r.name}</strong></td>
      <td>${r.reg_number ?? '—'}</td>
      <td>${r.contact_name ?? '—'}</td>
      <td>${r.contact_phone ?? '—'}</td>
      <td>${r.contact_email ?? '—'}</td>
      <td>${cnt > 0 ? `<span class="contracts-badge">${cnt}</span>` : '—'}</td>
      <td><span class="status ${stCls}">${r.status ?? 'active'}</span></td>
      <td style="display:flex;gap:6px">
        <button class="btn btn-ghost btn-sm" onclick='edit(${JSON.stringify(r)})'>Edit</button>
        <button class="btn btn-bad btn-sm" onclick="del('${r.id}')">Delete</button>
      </td>
    </tr>`;
  }).join('');
}

function openModal(data) {
  document.getElementById('modal-title').textContent = data ? 'Edit Company' : 'Add Company';
  document.getElementById('edit-id').value = data?.id ?? '';
  document.getElementById('f-name').value = data?.name ?? '';
  document.getElementById('f-reg').value = data?.reg_number ?? '';
  document.getElementById('f-address').value = data?.address ?? '';
  document.getElementById('f-contact').value = data?.contact_name ?? '';
  document.getElementById('f-phone').value = data?.contact_phone ?? '';
  document.getElementById('f-email').value = data?.contact_email ?? '';
  document.getElementById('f-status').value = data?.status ?? 'active';
  document.getElementById('f-notes').value = data?.notes ?? '';
  document.getElementById('overlay').classList.add('open');
}
function edit(r) { openModal(r); }
function closeModal(e) {
  if (!e || e.target === document.getElementById('overlay'))
    document.getElementById('overlay').classList.remove('open');
}

async function save() {
  const name = document.getElementById('f-name').value.trim();
  const contact = document.getElementById('f-contact').value.trim();
  if (!name || !contact) { alert('Company name and contact person are required'); return; }
  const payload = {
    name,
    reg_number: document.getElementById('f-reg').value.trim()||null,
    address: document.getElementById('f-address').value.trim()||null,
    contact_name: contact,
    contact_phone: document.getElementById('f-phone').value.trim()||null,
    contact_email: document.getElementById('f-email').value.trim()||null,
    status: document.getElementById('f-status').value,
    notes: document.getElementById('f-notes').value.trim()||null,
  };
  const id = document.getElementById('edit-id').value;
  if (id) {
    await sb.from('cnt_companies').update(payload).eq('id', id);
    const i = rows.findIndex(r => r.id === id);
    if (i >= 0) rows[i] = { ...rows[i], ...payload };
  } else {
    const { data } = await sb.from('cnt_companies').insert(payload).select().single();
    if (data) rows.unshift(data);
  }
  closeModal(); render();
}

async function del(id) {
  if (!confirm('Delete this company? Their portal access will be revoked.')) return;
  await sb.from('cnt_companies').delete().eq('id', id);
  rows = rows.filter(r => r.id !== id); render();
}

init();
</script>
</body>
</html>
