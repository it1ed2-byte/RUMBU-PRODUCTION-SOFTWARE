<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Companies</title>
<script src="auth-contracts.js"></script>
<script src="sidebar-contracts.js"></script>
<link rel="stylesheet" href="contracts.css">
</head>
<body>
<div class="page-hdr">
  <div class="ph-left">
    <div class="ph-icon">🏢</div>
    <div>
      <div class="ph-title">Subcontractor Companies</div>
      <div class="ph-sub">Manage subcontractors and their portal access</div>
    </div>
  </div>
  <div class="ph-right">
    <button class="btn btn-hdr-primary" onclick="openModal(null)">＋ Add Company</button>
  </div>
</div>

<div class="content">
  <div id="loading" class="loading-wrap">
    <div class="spinner"></div>
    <div class="loading-txt">Loading companies…</div>
  </div>

  <div id="app" style="display:none">
    <div class="toolbar">
      <input class="srch" id="q" type="search" placeholder="🔍  Search companies…" oninput="render()">
    </div>
    <div class="tbl-wrap">
      <div class="tbl-scroll">
        <table>
          <thead>
            <tr><th>Company</th><th>Reg. No.</th><th>Contact</th><th>Portal Email</th><th>Status</th><th>Actions</th></tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-hdr">
      <span class="modal-title" id="modal-title">Add Company</span>
      <button class="modal-x" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="m-id">
      <div class="g2" style="margin-bottom:14px">
        <div class="field">
          <label>Company Name <span class="req">*</span></label>
          <input id="m-name" placeholder="Company Ltd">
        </div>
        <div class="field">
          <label>Registration No.</label>
          <input id="m-reg" placeholder="RC123456">
        </div>
      </div>
      <div class="g2" style="margin-bottom:14px">
        <div class="field">
          <label>Contact Person</label>
          <input id="m-contact" placeholder="Name">
        </div>
        <div class="field">
          <label>Phone</label>
          <input id="m-phone" placeholder="+234…">
        </div>
      </div>
      <div class="g2" style="margin-bottom:14px">
        <div class="field">
          <label>Portal Login Email</label>
          <input id="m-email" type="email" placeholder="company@email.com">
          <span class="hint">Used for subcontractor portal access</span>
        </div>
        <div class="field">
          <label>Status</label>
          <select id="m-status">
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
          </select>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="save()">Save</button>
    </div>
    <div style="padding:0 22px 14px"><span id="msg" style="font-size:13px;display:none"></span></div>
  </div>
</div>

<script>
let sb, rows = [];

async function init() {
  try {
    const auth = await guardPage();
    if (!auth) return;
    sb = auth.sb;
    const { data } = await sb.from('cnt_companies').select('*').order('name');
    rows = data ?? [];
    render();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  } catch(e) {
    document.getElementById('loading').innerHTML = `<div style="color:var(--bad);text-align:center;padding:40px">⚠️ ${e.message}</div>`;
  }
}

function render() {
  const q = document.getElementById('q').value.toLowerCase();
  const data = q ? rows.filter(r => r.name?.toLowerCase().includes(q) || r.registration_no?.toLowerCase().includes(q)) : rows;
  const tbody = document.getElementById('tbody');
  if (!data.length) {
    tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state"><span class="e-icon">🏢</span><p>${rows.length ? 'No companies match.' : 'No companies yet.'}</p></div></td></tr>`;
    return;
  }
  tbody.innerHTML = data.map(r => `<tr>
    <td><strong>${r.name ?? '—'}</strong></td>
    <td>${r.registration_no ? `<span class="ref">${r.registration_no}</span>` : '—'}</td>
    <td>${r.contact_name ?? '—'}${r.phone ? '<br><span style="font-size:12px;color:var(--muted)">' + r.phone + '</span>' : ''}</td>
    <td style="font-size:13px">${r.email ?? '—'}</td>
    <td><span class="badge ${r.status === 'active' ? 'b-ok' : 'b-bad'}">${r.status === 'active' ? 'Active' : 'Inactive'}</span></td>
    <td>
      <div style="display:flex;gap:6px">
        <button class="btn btn-ghost btn-sm" onclick='editRow(${JSON.stringify(r).replace(/'/g,"&#39;")})'>Edit</button>
        <button class="btn btn-bad btn-sm" onclick="del('${r.id}')">Delete</button>
      </div>
    </td>
  </tr>`).join('');
}

function openModal(data) {
  document.getElementById('modal-title').textContent = data ? 'Edit Company' : 'Add Company';
  ['m-id','m-name','m-reg','m-contact','m-phone','m-email'].forEach(id => {
    document.getElementById(id).value = '';
  });
  if (data) {
    document.getElementById('m-id').value      = data.id;
    document.getElementById('m-name').value    = data.name ?? '';
    document.getElementById('m-reg').value     = data.registration_no ?? '';
    document.getElementById('m-contact').value = data.contact_name ?? '';
    document.getElementById('m-phone').value   = data.phone ?? '';
    document.getElementById('m-email').value   = data.email ?? '';
    document.getElementById('m-status').value  = data.status ?? 'active';
  }
  document.getElementById('msg').style.display = 'none';
  document.getElementById('overlay').classList.add('open');
}
function editRow(r) { openModal(r); }
function closeModal(e) {
  if (!e || e.target === document.getElementById('overlay'))
    document.getElementById('overlay').classList.remove('open');
}

async function save() {
  const id   = document.getElementById('m-id').value;
  const name = document.getElementById('m-name').value.trim();
  if (!name) return showMsg('Company name is required.', 'err');
  const payload = {
    name, status: document.getElementById('m-status').value,
    registration_no: document.getElementById('m-reg').value.trim() || null,
    contact_name: document.getElementById('m-contact').value.trim() || null,
    phone: document.getElementById('m-phone').value.trim() || null,
    email: document.getElementById('m-email').value.trim() || null,
  };
  let error;
  if (id) {
    ({ error } = await sb.from('cnt_companies').update(payload).eq('id', id));
  } else {
    const res = await sb.from('cnt_companies').insert(payload).select().single();
    error = res.error;
    if (!error && res.data) rows.push(res.data);
  }
  if (error) return showMsg('Error: ' + error.message, 'err');
  if (id) { const i = rows.findIndex(r => r.id === id); if (i >= 0) rows[i] = {...rows[i], ...payload}; }
  render(); closeModal();
}

async function del(id) {
  const r = rows.find(r => r.id === id);
  if (!confirm('Delete "' + (r?.name ?? id) + '"?')) return;
  const { error } = await sb.from('cnt_companies').delete().eq('id', id);
  if (error) return alert('Error: ' + error.message);
  rows = rows.filter(r => r.id !== id);
  render();
}

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text; el.style.color = type === 'ok' ? 'var(--ok)' : 'var(--bad)';
  el.style.display = 'inline';
}
init();
</script>
</body>
</html>
