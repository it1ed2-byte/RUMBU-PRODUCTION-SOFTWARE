<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contract Detail</title>
<style>
:root{--primary:#1F3864;--accent:#2E75B6;--ok:#22c55e;--bad:#ef4444;--warn:#f59e0b;
--bg:#f8fafc;--card:#fff;--line:#e2e8f0;--muted:#64748b;--heading:#0f172a;
--th-bg:#f1f5f9;--th-fg:#374151;--shadow:0 1px 3px rgba(0,0,0,.08);--radius:8px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;font-size:14px;background:var(--bg);color:var(--heading);padding:20px}
.hdr{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}
.hdr-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.hdr-title{font-size:19px;font-weight:700;color:var(--primary)}
.hdr-ref{font-size:13px;color:var(--muted);margin-top:2px}
.hdr-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px;
  padding-top:14px;border-top:1px solid var(--line)}
.meta-item{display:flex;flex-direction:column;gap:2px}
.meta-lbl{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase}
.meta-val{font-size:14px;font-weight:600}
.status{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600}
.status.ok{background:#dcfce7;color:#166534}
.status.warn{background:#fef3c7;color:#92400e}
.status.err{background:#fee2e2;color:#991b1b}
.prog-row{display:flex;gap:24px;margin-top:12px}
.prog-item{flex:1}
.prog-lbl{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:4px}
.prog-bar{height:8px;background:var(--line);border-radius:4px}
.prog-fill{height:8px;border-radius:4px}
.prog-pct{font-size:13px;font-weight:700;margin-top:4px}
.tabs{display:flex;gap:0;border-bottom:2px solid var(--line);margin-bottom:18px}
.tab{padding:10px 16px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);
  border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab.active{color:var(--accent);border-color:var(--accent)}
.tab:hover:not(.active){color:var(--heading)}
.panel{display:none}
.panel.active{display:block}
.card-panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:14px}
.card-title{font-size:13px;font-weight:700;color:var(--primary);margin-bottom:12px;
  text-transform:uppercase;letter-spacing:.4px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px}
.info-item{display:flex;flex-direction:column;gap:2px}
.info-lbl{font-size:11px;color:var(--muted);font-weight:600}
.info-val{font-size:14px}
.table-wrap{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{background:var(--th-bg);color:var(--th-fg);font-size:12px;font-weight:600;
  text-align:left;padding:9px 12px;white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:middle}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border:none;
  border-radius:var(--radius);font-size:13px;cursor:pointer;font-weight:500}
.btn-accent{background:var(--accent);color:#fff}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn-ghost:hover{background:var(--th-bg)}
.btn-ok{background:var(--ok);color:#fff}
.btn-bad{background:var(--bad);color:#fff}
.btn-sm{padding:4px 10px;font-size:12px}
.toolbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px}
.empty{text-align:center;padding:30px;color:var(--muted);font-size:13px}
#loading{text-align:center;padding:60px;color:var(--muted)}
.actions-bar{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<div id="loading">Loading contract…</div>
<div id="app" style="display:none">
  <div class="hdr">
    <div class="hdr-top">
      <div>
        <div class="hdr-title" id="hdr-title">—</div>
        <div class="hdr-ref"><span id="hdr-ref">—</span> &nbsp;·&nbsp; <span id="hdr-agency">—</span> &nbsp;·&nbsp; <span id="hdr-company">—</span></div>
      </div>
      <div class="actions-bar">
        <button class="btn btn-ghost btn-sm" onclick="goBack()">← Back</button>
        <button class="btn btn-ghost btn-sm" onclick="editContract()">Edit</button>
        <select id="statusSel" onchange="changeStatus(this.value)" style="border:1px solid var(--line);border-radius:var(--radius);padding:6px 10px;font-size:13px">
          <option value="">Change Status…</option>
          <option value="pipeline">Pipeline</option>
          <option value="awarded">Awarded</option>
          <option value="active">Active</option>
          <option value="on_hold">On Hold</option>
          <option value="completed">Completed</option>
          <option value="terminated">Terminated</option>
          <option value="closeout">Closeout</option>
        </select>
      </div>
    </div>
    <div class="hdr-meta">
      <div class="meta-item"><span class="meta-lbl">Value</span><span class="meta-val" id="hdr-value">—</span></div>
      <div class="meta-item"><span class="meta-lbl">Start Date</span><span class="meta-val" id="hdr-start">—</span></div>
      <div class="meta-item"><span class="meta-lbl">End Date</span><span class="meta-val" id="hdr-end">—</span></div>
      <div class="meta-item"><span class="meta-lbl">Status</span><span id="hdr-status">—</span></div>
    </div>
    <div class="prog-row">
      <div class="prog-item">
        <div class="prog-lbl">Physical Progress</div>
        <div class="prog-bar"><div class="prog-fill" id="pp-bar"></div></div>
        <div class="prog-pct" id="pp-pct">0%</div>
      </div>
      <div class="prog-item">
        <div class="prog-lbl">Financial Progress</div>
        <div class="prog-bar"><div class="prog-fill" id="fp-bar"></div></div>
        <div class="prog-pct" id="fp-pct">0%</div>
      </div>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>

  <!-- Overview -->
  <div class="panel active" id="tab-overview">
    <div class="card-panel">
      <div class="card-title">Contract Details</div>
      <div class="info-grid" id="details-grid"></div>
    </div>
  </div>

  <!-- Progress Reports -->
  <div class="panel" id="tab-progress">
    <div class="toolbar">
      <button class="btn btn-accent btn-sm" onclick="newProgressReport()">+ Add Report</button>
    </div>
    <div class="table-wrap">
      <div class="table-scroll">
        <table><thead><tr><th>Period</th><th>Physical%</th><th>Financial%</th><th>Submitted</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="progress-tbody"></tbody></table>
      </div>
    </div>
  </div>

  <!-- KPIs -->
  <div class="panel" id="tab-kpi">
    <div class="toolbar">
      <button class="btn btn-accent btn-sm" onclick="newKpiRecord()">+ Add KPI</button>
    </div>
    <div class="table-wrap">
      <div class="table-scroll">
        <table><thead><tr><th>KPI Name</th><th>Target</th><th>Actual</th><th>Variance</th><th>Period</th><th>Status</th></tr></thead>
        <tbody id="kpi-tbody"></tbody></table>
      </div>
    </div>
  </div>

  <!-- Team -->
  <div class="panel" id="tab-team">
    <div class="toolbar">
      <button class="btn btn-accent btn-sm" onclick="addTeamMember()">+ Assign Staff</button>
    </div>
    <div class="table-wrap">
      <div class="table-scroll">
        <table><thead><tr><th>Name</th><th>Role</th><th>Email</th><th>Actions</th></tr></thead>
        <tbody id="team-tbody"></tbody></table>
      </div>
    </div>
  </div>

  <!-- Documents -->
  <div class="panel" id="tab-docs">
    <div class="table-wrap">
      <div class="table-scroll">
        <table><thead><tr><th>Document</th><th>Type</th><th>Uploaded</th><th>Size</th></tr></thead>
        <tbody id="docs-tbody"></tbody></table>
      </div>
    </div>
  </div>

  <!-- Risks -->
  <div class="panel" id="tab-risks">
    <div class="table-wrap">
      <div class="table-scroll">
        <table><thead><tr><th>Risk</th><th>Impact</th><th>Likelihood</th><th>Status</th><th>Raised</th></tr></thead>
        <tbody id="risks-tbody"></tbody></table>
      </div>
    </div>
  </div>
</div>

<script>
let sb, contract, contractId;

const TABS = [
  { id:'overview',  label:'Overview' },
  { id:'progress',  label:'Progress Reports' },
  { id:'kpi',       label:'KPIs' },
  { id:'team',      label:'Team' },
  { id:'docs',      label:'Documents' },
  { id:'risks',     label:'Risks' },
];

async function init() {
  sb = window.parent?.sb;
  if (!sb) return;

  const params = new URLSearchParams(location.search);
  contractId = params.get('id');
  if (!contractId) { goBack(); return; }

  // Build tabs
  const tabBar = document.getElementById('tabs');
  TABS.forEach((t, i) => {
    const el = document.createElement('div');
    el.className = 'tab' + (i === 0 ? ' active' : '');
    el.textContent = t.label;
    el.onclick = () => switchTab(t.id, el);
    tabBar.appendChild(el);
  });

  await loadContract();
  await loadProgress();
  await loadKPIs();
  await loadTeam();
  await loadDocs();
  await loadRisks();

  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = 'block';
}

function switchTab(id, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-' + id).classList.add('active');
}

async function loadContract() {
  const { data } = await sb.from('cnt_contracts').select(`
    *,cnt_agencies(name),cnt_companies(name),cnt_branches(name),
    cnt_classifications(name)
  `).eq('id', contractId).single();
  if (!data) { goBack(); return; }
  contract = data;

  document.getElementById('hdr-title').textContent = data.title;
  document.getElementById('hdr-ref').textContent = data.contract_id;
  document.getElementById('hdr-agency').textContent = data.cnt_agencies?.name ?? '—';
  document.getElementById('hdr-company').textContent = data.cnt_companies?.name ?? '—';
  document.getElementById('hdr-value').textContent = data.contract_value
    ? 'NGN ' + Number(data.contract_value).toLocaleString('en-NG',{minimumFractionDigits:0}) : '—';
  document.getElementById('hdr-start').textContent = fmtDate(data.start_date);
  document.getElementById('hdr-end').textContent = fmtDate(data.end_date);

  const sm = {pipeline:'warn',awarded:'ok',active:'ok',on_hold:'warn',
    completed:'',terminated:'err',closeout:''};
  const sl = {pipeline:'Pipeline',awarded:'Awarded',active:'Active',on_hold:'On Hold',
    completed:'Completed',terminated:'Terminated',closeout:'Closeout'};
  const cls = sm[data.status]??''; const lbl = sl[data.status]??data.status;
  document.getElementById('hdr-status').innerHTML = `<span class="status ${cls}">${lbl}</span>`;
  document.getElementById('statusSel').value = '';

  const pp = data.physical_progress ?? 0;
  const fp = data.financial_progress ?? 0;
  const ppCol = pp>=80?'var(--ok)':pp>=40?'var(--accent)':'var(--warn)';
  const fpCol = fp>=80?'var(--ok)':fp>=40?'var(--accent)':'var(--warn)';
  document.getElementById('pp-bar').style.cssText = `width:${pp}%;background:${ppCol}`;
  document.getElementById('fp-bar').style.cssText = `width:${fp}%;background:${fpCol}`;
  document.getElementById('pp-pct').textContent = pp + '%';
  document.getElementById('fp-pct').textContent = fp + '%';

  document.getElementById('details-grid').innerHTML = [
    ['Description', data.description || '—'],
    ['Classification', data.cnt_classifications?.name ?? '—'],
    ['Branch', data.cnt_branches?.name ?? '—'],
    ['Award Date', fmtDate(data.award_date)],
    ['Contract Value', data.contract_value ? 'NGN ' + Number(data.contract_value).toLocaleString('en-NG',{minimumFractionDigits:2}) : '—'],
    ['Retention Rate', data.retention_rate ? data.retention_rate + '%' : '—'],
  ].map(([l,v]) => `<div class="info-item"><div class="info-lbl">${l}</div><div class="info-val">${v}</div></div>`).join('');
}

async function loadProgress() {
  const { data } = await sb.from('cnt_progress_reports')
    .select('id,report_period,physical_progress,financial_progress,submitted_at,review_status')
    .eq('contract_id', contractId).order('submitted_at', { ascending: false });
  const t = document.getElementById('progress-tbody');
  if (!data?.length) { t.innerHTML = '<tr><td colspan="6" class="empty">No progress reports yet</td></tr>'; return; }
  t.innerHTML = data.map(r => `<tr>
    <td>${r.report_period ?? '—'}</td>
    <td>${r.physical_progress ?? 0}%</td>
    <td>${r.financial_progress ?? 0}%</td>
    <td>${fmtDate(r.submitted_at)}</td>
    <td><span class="status ${r.review_status==='approved'?'ok':r.review_status==='returned'?'err':'warn'}">${r.review_status ?? 'pending'}</span></td>
    <td><button class="btn btn-ghost btn-sm" onclick="reviewReport('${r.id}')">Review</button></td>
  </tr>`).join('');
}

async function loadKPIs() {
  const { data } = await sb.from('cnt_kpi_records')
    .select('id,kpi_name,target_value,actual_value,variance,report_period,review_status')
    .eq('contract_id', contractId).order('created_at', { ascending: false });
  const t = document.getElementById('kpi-tbody');
  if (!data?.length) { t.innerHTML = '<tr><td colspan="6" class="empty">No KPI records yet</td></tr>'; return; }
  t.innerHTML = data.map(r => `<tr>
    <td>${r.kpi_name ?? '—'}</td>
    <td>${r.target_value ?? '—'}</td>
    <td>${r.actual_value ?? '—'}</td>
    <td>${r.variance ?? '—'}</td>
    <td>${r.report_period ?? '—'}</td>
    <td><span class="status ${r.review_status==='approved'?'ok':r.review_status==='returned'?'err':'warn'}">${r.review_status ?? 'pending'}</span></td>
  </tr>`).join('');
}

async function loadTeam() {
  const { data } = await sb.from('cnt_contract_team')
    .select('id,role_in_contract,cnt_profiles(display_name,email)')
    .eq('contract_id', contractId);
  const t = document.getElementById('team-tbody');
  if (!data?.length) { t.innerHTML = '<tr><td colspan="4" class="empty">No team members assigned</td></tr>'; return; }
  t.innerHTML = data.map(r => `<tr>
    <td>${r.cnt_profiles?.display_name ?? '—'}</td>
    <td>${r.role_in_contract ?? '—'}</td>
    <td>${r.cnt_profiles?.email ?? '—'}</td>
    <td><button class="btn btn-bad btn-sm" onclick="removeTeam('${r.id}')">Remove</button></td>
  </tr>`).join('');
}

async function loadDocs() {
  const { data } = await sb.from('cnt_documents')
    .select('id,file_name,document_type,uploaded_at,file_size_kb')
    .eq('contract_id', contractId).order('uploaded_at', { ascending: false });
  const t = document.getElementById('docs-tbody');
  if (!data?.length) { t.innerHTML = '<tr><td colspan="4" class="empty">No documents uploaded</td></tr>'; return; }
  t.innerHTML = data.map(r => `<tr>
    <td>${r.file_name ?? '—'}</td>
    <td>${r.document_type ?? '—'}</td>
    <td>${fmtDate(r.uploaded_at)}</td>
    <td>${r.file_size_kb ? r.file_size_kb + ' KB' : '—'}</td>
  </tr>`).join('');
}

async function loadRisks() {
  const { data } = await sb.from('cnt_risks')
    .select('id,description,impact_level,likelihood_level,status,created_at')
    .eq('contract_id', contractId).order('created_at', { ascending: false });
  const t = document.getElementById('risks-tbody');
  if (!data?.length) { t.innerHTML = '<tr><td colspan="5" class="empty">No risks logged</td></tr>'; return; }
  t.innerHTML = data.map(r => `<tr>
    <td>${r.description ?? '—'}</td>
    <td>${r.impact_level ?? '—'}</td>
    <td>${r.likelihood_level ?? '—'}</td>
    <td><span class="status ${r.status==='open'?'err':r.status==='mitigated'?'warn':'ok'}">${r.status ?? '—'}</span></td>
    <td>${fmtDate(r.created_at)}</td>
  </tr>`).join('');
}

async function changeStatus(newStatus) {
  if (!newStatus || !contractId) return;
  const { error } = await sb.from('cnt_contracts')
    .update({ status: newStatus, updated_at: new Date().toISOString() })
    .eq('id', contractId);
  if (error) { alert('Error: ' + error.message); return; }
  await loadContract();
  document.getElementById('statusSel').value = '';
}

async function removeTeam(id) {
  if (!confirm('Remove this team member?')) return;
  await sb.from('cnt_contract_team').delete().eq('id', id);
  await loadTeam();
}

function editContract() {
  if (window.parent?.navigate) window.parent.navigate('contracts/new-contract.html?edit=' + contractId);
  else location.href = 'new-contract.html?edit=' + contractId;
}
function newProgressReport() { location.href = '../contracts/progress-review.html?contract=' + contractId; }
function newKpiRecord() { location.href = '../contracts/kpi-review.html?contract=' + contractId; }
function addTeamMember() { location.href = '../contracts/contract-staff.html?contract=' + contractId; }
function reviewReport(id) { location.href = '../contracts/progress-review.html?report=' + id; }

function goBack() {
  if (window.parent?.navigate) window.parent.navigate('contracts/contracts.html');
  else history.back();
}

function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
}

init();
</script>
</body>
</html>
