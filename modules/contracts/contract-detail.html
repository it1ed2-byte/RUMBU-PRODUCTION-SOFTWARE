<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contract Detail</title>
<script src="auth-contracts.js"></script>
<link rel="stylesheet" href="contracts.css">
<style>
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:20px}
.info-item label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:4px;display:block}
.info-item .val{font-size:15px;font-weight:600;color:var(--heading)}
.info-item .val.mono{font-family:'Courier New',monospace;font-size:14px}
</style>
</head>
<body>
<div class="page-hdr">
  <div class="ph-left">
    <div class="ph-icon">📋</div>
    <div>
      <div class="ph-title" id="hdr-title">Contract Detail</div>
      <div class="ph-sub" id="hdr-sub">Loading…</div>
    </div>
  </div>
  <div class="ph-right" id="hdr-actions"></div>
</div>

<div class="content">
  <div id="loading" class="loading-wrap">
    <div class="spinner"></div>
    <div class="loading-txt">Loading contract…</div>
  </div>

  <div id="app" style="display:none">
    <!-- Tabs -->
    <div class="tabs" id="tabs">
      <button class="tab-btn active" onclick="switchTab('overview',this)">Overview</button>
      <button class="tab-btn" onclick="switchTab('progress',this)">Progress Reports</button>
      <button class="tab-btn" onclick="switchTab('kpi',this)">KPI</button>
      <button class="tab-btn" onclick="switchTab('team',this)">Team</button>
      <button class="tab-btn" onclick="switchTab('actions',this)">Corrective Actions</button>
      <button class="tab-btn" onclick="switchTab('ncr',this)">NCRs</button>
      <button class="tab-btn" onclick="switchTab('mob',this)">Mobilization</button>
    </div>

    <!-- Overview -->
    <div class="tab-pane active" id="tab-overview">
      <div class="sec-card">
        <div class="sec-hdr">
          <div class="sec-title">Contract Information</div>
          <div id="status-badge"></div>
        </div>
        <div class="sec-body">
          <div class="info-grid" id="info-grid"></div>
          <div style="border-top:1px solid var(--border);padding-top:16px;margin-top:4px">
            <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted);margin-bottom:8px">Physical Progress</div>
            <div class="prog-wrap" style="margin-bottom:14px">
              <div class="prog-track" style="flex:1"><div class="prog-fill" id="pp-fill" style="height:12px"></div></div>
              <span class="prog-pct" id="pp-pct">0%</span>
            </div>
            <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted);margin-bottom:8px">Financial Progress</div>
            <div class="prog-wrap">
              <div class="prog-track" style="flex:1"><div class="prog-fill" id="fp-fill" style="height:12px"></div></div>
              <span class="prog-pct" id="fp-pct">0%</span>
            </div>
          </div>
          <div id="notes-wrap" style="display:none;margin-top:16px;border-top:1px solid var(--border);padding-top:14px">
            <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted);margin-bottom:6px">Notes</div>
            <div id="notes-body" style="font-size:13.5px;line-height:1.7;color:var(--text)"></div>
          </div>
        </div>
      </div>

      <!-- Status change -->
      <div class="sec-card" id="status-card" style="display:none">
        <div class="sec-hdr"><div class="sec-title">Change Status</div></div>
        <div class="sec-body">
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            <button class="btn btn-ghost btn-sm" onclick="changeStatus('pipeline')">Pipeline</button>
            <button class="btn btn-ghost btn-sm" onclick="changeStatus('awarded')">Awarded</button>
            <button class="btn btn-ok btn-sm" onclick="changeStatus('active')">Active</button>
            <button class="btn btn-warn btn-sm" onclick="changeStatus('on_hold')">On Hold</button>
            <button class="btn btn-primary btn-sm" onclick="changeStatus('completed')">Completed</button>
            <button class="btn btn-ghost btn-sm" onclick="changeStatus('closeout')">Closeout</button>
            <button class="btn btn-bad btn-sm" onclick="changeStatus('terminated')">Terminated</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Progress Reports -->
    <div class="tab-pane" id="tab-progress">
      <div class="tbl-wrap">
        <div class="tbl-scroll"><table>
          <thead><tr><th>Period</th><th>Physical %</th><th>Financial %</th><th>Status</th><th>Date</th></tr></thead>
          <tbody id="prog-tbody"></tbody>
        </table></div>
      </div>
    </div>

    <!-- KPI -->
    <div class="tab-pane" id="tab-kpi">
      <div class="tbl-wrap">
        <div class="tbl-scroll"><table>
          <thead><tr><th>KPI Name</th><th>Target</th><th>Actual</th><th>Score</th><th>Status</th><th>Date</th></tr></thead>
          <tbody id="kpi-tbody"></tbody>
        </table></div>
      </div>
    </div>

    <!-- Team -->
    <div class="tab-pane" id="tab-team">
      <div class="tbl-wrap">
        <div class="tbl-scroll"><table>
          <thead><tr><th>Member</th><th>Role</th><th>Since</th><th>Actions</th></tr></thead>
          <tbody id="team-tbody"></tbody>
        </table></div>
      </div>
    </div>

    <!-- Corrective Actions -->
    <div class="tab-pane" id="tab-actions">
      <div class="tbl-wrap">
        <div class="tbl-scroll"><table>
          <thead><tr><th>Issue</th><th>Priority</th><th>Due</th><th>Status</th></tr></thead>
          <tbody id="ca-tbody"></tbody>
        </table></div>
      </div>
    </div>

    <!-- NCRs — §3.3 -->
    <div class="tab-pane" id="tab-ncr">
      <div style="display:flex;align-items:center;justify-content:space-between;
        margin-bottom:14px;flex-wrap:wrap;gap:10px">
        <div id="ncr-summary" style="font-size:13px;color:var(--muted)"></div>
        <button class="btn btn-primary" style="padding:6px 14px;font-size:13px"
          onclick="location.href='ncr-register.html?contract='+ID">
          ＋ Raise NCR
        </button>
      </div>
      <div class="tbl-wrap">
        <div class="tbl-scroll"><table>
          <thead><tr>
            <th>NCR Ref</th><th>Issue / Location</th>
            <th>Responsible</th><th>Due Date</th><th>Status</th>
          </tr></thead>
          <tbody id="ncr-tbody"></tbody>
        </table></div>
      </div>
    </div>

    <!-- Mobilization -->
    <div class="tab-pane" id="tab-mob">
      <div id="mob-content"></div>
    </div>

  </div>
</div>

<script>
let sb, contract, canAdmin = false;
const ID = new URLSearchParams(location.search).get('id');
const STATUS_BADGE = {
  pipeline:  ['b-navy','Pipeline'], awarded:['b-info','Awarded'],
  active:    ['b-ok','Active'],     on_hold:['b-warn','On Hold'],
  completed: ['b-gray','Completed'],terminated:['b-bad','Terminated'],
  closeout:  ['b-gold','Closeout'],
};
const PRIORITY = { critical:['b-bad','Critical'],high:['b-warn','High'],medium:['b-info','Medium'],low:['b-gray','Low'] };

async function init() {
  try {
    const auth = await guardPage();
    if (!auth) return;
    sb = auth.sb;
    canAdmin = auth.permissions.has('users.manage') || auth.permissions.has('contracts.write');
    if (!ID) {
      document.getElementById('loading').innerHTML = `<div style="color:var(--bad);text-align:center;padding:40px">No contract ID provided.</div>`;
      return;
    }
    await loadContract();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  } catch(e) {
    document.getElementById('loading').innerHTML = `<div style="color:var(--bad);text-align:center;padding:40px">⚠️ ${e.message}</div>`;
  }
}

function switchTab(id, el) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-' + id).classList.add('active');
  if (id === 'progress') loadProgress();
  if (id === 'kpi') loadKPIs();
  if (id === 'team') loadTeam();
  if (id === 'actions') loadActions();
  if (id === 'ncr')     loadNCRs();
  if (id === 'mob')     loadMobilization();
}

async function loadContract() {
  const { data } = await sb.from('cnt_contracts').select(`
    *,cnt_agencies(name),cnt_companies(name)
  `).eq('id', ID).single();
  contract = data;
  const [bCls, bLbl] = STATUS_BADGE[data.status] ?? ['b-gray', data.status ?? '—'];
  const RISK_BADGE = { low:['b-ok','🟢 Low'], medium:['b-warn','🟡 Medium'],
                       high:['b-orange','🟠 High'], critical:['b-bad','🔴 Critical'] };
  const [rCls, rLbl] = RISK_BADGE[data.risk_level ?? 'low'] ?? ['b-gray','—'];
  document.getElementById('hdr-title').textContent = data.contract_id ?? 'Contract';
  document.getElementById('hdr-sub').textContent   = data.title ?? '';
  document.getElementById('status-badge').innerHTML =
    `<span class="badge ${bCls}">${bLbl}</span>
     <span class="badge ${rCls}" title="Risk level — §5.4">Risk: ${rLbl}</span>`;

  if (canAdmin) {
    document.getElementById('hdr-actions').innerHTML =
      `<button class="btn btn-hdr" onclick="location.href='contracts.html'">← All Contracts</button>`;
    document.getElementById('status-card').style.display = 'block';
  }

  const fmtCcy = v => v != null ? 'NGN ' + Number(v).toLocaleString('en-NG') : '—';
  const fmtDt  = v => v ? new Date(v).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) : '—';

  document.getElementById('info-grid').innerHTML = [
    ['Agency',         data.cnt_agencies?.name ?? '—'],
    ['Subcontractor',  data.cnt_companies?.name ?? '—'],
    ['Contract Value', fmtCcy(data.contract_value)],
    ['Mobilisation',   fmtCcy(data.mobilisation_fee)],
    ['Start Date',     fmtDt(data.start_date)],
    ['End Date',       fmtDt(data.end_date)],
    ['Signed Date',    fmtDt(data.signed_date)],
    ['Risk Level',     `<span class="badge ${rCls}">${rLbl}</span>`],
    ['Risk Notes',     data.risk_notes ?? '—'],
  ].map(([label, val]) => `
    <div class="info-item">
      <label>${label}</label>
      <div class="val">${val}</div>
    </div>`).join('');

  // Monitoring intensity notice for high / critical contracts — §5.4
  const RISK_NOTICE = {
    high:     { bg:'#fff7ed', border:'#f97316', color:'#7c2d12',
                text:'🟠 <strong>High risk contract</strong> — Management escalation and recovery plan required. Apply increased monitoring frequency (§5.4).' },
    critical: { bg:'#fef2f2', border:'#ef4444', color:'#991b1b',
                text:'🔴 <strong>Critical risk contract</strong> — Immediate escalation and executive intervention required. Maximum monitoring intensity (§5.4).' }
  };
  const rNotice = RISK_NOTICE[data.risk_level];
  if (rNotice) {
    const nb = document.createElement('div');
    nb.style.cssText = `background:${rNotice.bg};border:1.5px solid ${rNotice.border};
      color:${rNotice.color};border-radius:8px;padding:12px 16px;font-size:13px;
      line-height:1.6;margin-top:14px`;
    nb.innerHTML = rNotice.text;
    document.getElementById('info-grid').after(nb);
  }

  const pp = Math.min(100, data.physical_progress ?? 0);
  const fp = Math.min(100, data.financial_progress ?? 0);
  const ppCol = pp >= 80 ? 'var(--ok)' : pp >= 40 ? 'var(--accent)' : 'var(--warn)';
  const fpCol = fp >= 80 ? 'var(--ok)' : fp >= 40 ? 'var(--accent)' : 'var(--warn)';
  document.getElementById('pp-fill').style.cssText = `width:${pp}%;background:${ppCol};border-radius:3px`;
  document.getElementById('fp-fill').style.cssText = `width:${fp}%;background:${fpCol};border-radius:3px`;
  document.getElementById('pp-pct').textContent = pp + '%';
  document.getElementById('fp-pct').textContent = fp + '%';

  if (data.notes) {
    document.getElementById('notes-wrap').style.display = 'block';
    document.getElementById('notes-body').textContent = data.notes;
  }
}

async function loadProgress() {
  const { data } = await sb.from('cnt_progress_reports')
    .select('id,period_label,physical_pct,financial_pct,review_status,submitted_at')
    .eq('cnt_contract_id', ID).order('submitted_at',{ascending:false});
  const ST = { pending:['b-warn','Pending'],approved:['b-ok','Approved'],rejected:['b-bad','Rejected'] };
  document.getElementById('prog-tbody').innerHTML = (data??[]).length ? (data??[]).map(r => {
    const [bCls,bLbl] = ST[r.review_status]??['b-gray','—'];
    const pp=r.physical_pct??0, fp=r.financial_pct??0;
    return `<tr>
      <td style="font-weight:600">${r.period_label??'—'}</td>
      <td><div class="prog-wrap"><div class="prog-track" style="min-width:60px"><div class="prog-fill" style="width:${pp}%;background:${pp>=80?'var(--ok)':'var(--accent)'}"></div></div><span class="prog-pct">${pp}%</span></div></td>
      <td><div class="prog-wrap"><div class="prog-track" style="min-width:60px"><div class="prog-fill" style="width:${fp}%;background:${fp>=80?'var(--ok)':'var(--accent)'}"></div></div><span class="prog-pct">${fp}%</span></div></td>
      <td><span class="badge ${bCls}">${bLbl}</span></td>
      <td style="font-size:12.5px">${r.submitted_at?new Date(r.submitted_at).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—'}</td>
    </tr>`;
  }).join('') : `<tr><td colspan="5"><div class="empty-state"><span class="e-icon">📊</span><p>No progress reports yet.</p></div></td></tr>`;
}

async function loadKPIs() {
  const { data } = await sb.from('cnt_kpi_records')
    .select('id,kpi_name,target_value,actual_value,score,review_status,submitted_at')
    .eq('cnt_contract_id', ID).order('submitted_at',{ascending:false});
  const ST = { pending:['b-warn','Pending'],approved:['b-ok','Approved'],rejected:['b-bad','Rejected'] };
  document.getElementById('kpi-tbody').innerHTML = (data??[]).length ? (data??[]).map(r => {
    const [bCls,bLbl] = ST[r.review_status]??['b-gray','—'];
    return `<tr>
      <td style="font-weight:600">${r.kpi_name??'—'}</td>
      <td>${r.target_value??'—'}</td>
      <td style="color:${r.actual_value>=r.target_value?'var(--ok)':'var(--warn)';};font-weight:600">${r.actual_value??'—'}</td>
      <td>${r.score!=null?`<strong>${r.score}</strong>`:'—'}</td>
      <td><span class="badge ${bCls}">${bLbl}</span></td>
      <td style="font-size:12.5px">${r.submitted_at?new Date(r.submitted_at).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—'}</td>
    </tr>`;
  }).join('') : `<tr><td colspan="6"><div class="empty-state"><span class="e-icon">🎯</span><p>No KPI records yet.</p></div></td></tr>`;
}

async function loadTeam() {
  const { data } = await sb.from('cnt_contract_team')
    .select('id,role_on_contract,start_date,cnt_profiles(full_name,email)')
    .eq('cnt_contract_id', ID);
  document.getElementById('team-tbody').innerHTML = (data??[]).length ? (data??[]).map(r => {
    const p = r.cnt_profiles;
    const init = (p?.full_name??'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
    return `<tr>
      <td><div class="user-cell"><div class="avatar">${init}</div>
        <div><div class="user-name">${p?.full_name??'—'}</div><div class="user-meta">${p?.email??''}</div></div>
      </div></td>
      <td>${r.role_on_contract?`<span class="badge b-navy">${r.role_on_contract}</span>`:'—'}</td>
      <td style="font-size:13px">${r.start_date?new Date(r.start_date).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—'}</td>
      <td>${canAdmin?`<button class="btn btn-bad btn-sm" onclick="removeTeam('${r.id}')">Remove</button>`:'—'}</td>
    </tr>`;
  }).join('') : `<tr><td colspan="4"><div class="empty-state"><span class="e-icon">👷</span><p>No team members assigned.</p></div></td></tr>`;
}

async function loadActions() {
  const { data } = await sb.from('cnt_corrective_actions')
    .select('id,issue_description,priority,due_date,status')
    .eq('cnt_contract_id', ID).order('due_date');
  const PR = {critical:['b-bad','Critical'],high:['b-warn','High'],medium:['b-info','Medium'],low:['b-gray','Low']};
  const ST = {open:['b-bad','Open'],in_progress:['b-warn','In Progress'],resolved:['b-ok','Resolved'],closed:['b-gray','Closed']};
  document.getElementById('ca-tbody').innerHTML = (data??[]).length ? (data??[]).map(r => {
    const [pCls,pLbl]=PR[r.priority]??['b-gray','—'];
    const [sCls,sLbl]=ST[r.status]??['b-gray','—'];
    return `<tr>
      <td>${r.issue_description??'—'}</td>
      <td><span class="badge ${pCls}">${pLbl}</span></td>
      <td style="font-size:13px">${r.due_date?new Date(r.due_date).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—'}</td>
      <td><span class="badge ${sCls}">${sLbl}</span></td>
    </tr>`;
  }).join('') : `<tr><td colspan="4"><div class="empty-state"><span class="e-icon">🔧</span><p>No corrective actions for this contract.</p></div></td></tr>`;
}

async function loadNCRs() {
  const { data } = await sb.from('cnt_ncrs')
    .select('id,ncr_ref,issue_description,location,responsible_person,due_date,status')
    .eq('contract_id', ID).order('raised_date', { ascending:false });
  const rows = data ?? [];
  const open   = rows.filter(r => r.status === 'open').length;
  const overdue= rows.filter(r => r.due_date && new Date(r.due_date) < new Date() && r.status !== 'closed').length;
  document.getElementById('ncr-summary').innerHTML =
    `<strong>${rows.length}</strong> total &nbsp;·&nbsp; ` +
    `<span style="color:${open?'#ef4444':'#22c55e'}">${open} open</span>` +
    (overdue ? ` &nbsp;·&nbsp; <span style="color:#ef4444;font-weight:700">${overdue} overdue</span>` : '');

  const SL = { open:'Open', in_progress:'In Progress', closed:'Closed', disputed:'Disputed' };
  const SC = { open:'b-bad', in_progress:'b-warn', closed:'b-ok', disputed:'b-info' };
  document.getElementById('ncr-tbody').innerHTML = rows.length ? rows.map(r => {
    const od = r.due_date && new Date(r.due_date) < new Date() && r.status !== 'closed';
    return `<tr onclick="location.href='ncr-register.html'" style="cursor:pointer">
      <td style="font-weight:700;font-size:12px;color:var(--muted)">${r.ncr_ref ?? '—'}</td>
      <td>
        <div style="font-weight:600;font-size:13px">${esc(r.issue_description ?? '—')}</div>
        <div style="font-size:11px;color:var(--muted)">📍 ${esc(r.location ?? '—')}</div>
      </td>
      <td style="font-size:13px">${esc(r.responsible_person ?? '—')}</td>
      <td style="font-size:13px;${od ? 'color:#ef4444;font-weight:700' : ''}">
        ${r.due_date ? new Date(r.due_date).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) : '—'}
        ${od ? ' ⚠' : ''}
      </td>
      <td><span class="badge ${SC[r.status] ?? 'b-gray'}">${SL[r.status] ?? r.status}</span></td>
    </tr>`;
  }).join('')
  : `<tr><td colspan="5"><div class="empty-state">
      <span class="e-icon">✅</span>
      <p>No NCRs raised for this contract. Click <strong>Raise NCR</strong> to log one.</p>
    </div></td></tr>`;
}

async function loadMobilization() {
  const { data: mob } = await sb.from('cnt_mobilization')
    .select('*').eq('contract_id', ID).maybeSingle();

  const ITEMS = [
    { key:'personnel',     label:'Approved personnel are available'                   },
    { key:'equipment',     label:'Required equipment is available and fit for purpose'},
    { key:'materials',     label:'Materials have been identified and planned'          },
    { key:'procedures',    label:'Work procedures have been reviewed'                 },
    { key:'safety',        label:'Safety requirements have been communicated'          },
    { key:'permits',       label:'Required permits and approvals are in place'         },
    { key:'communication', label:'Communication channels have been established'        },
    { key:'reporting',     label:'Reporting templates have been agreed'               },
    { key:'schedule',      label:'The baseline schedule has been approved'            },
  ];

  const items   = mob?.items ?? {};
  const confirmed = ITEMS.filter(ci => items[ci.key]?.status === 'confirmed').length;
  const pct     = Math.round((confirmed / ITEMS.length) * 100);
  const status  = mob?.status ?? 'not_started';
  const SBADGE  = {
    not_started: ['b-gray',   '⬜ Not Started'],
    in_progress: ['b-warn',   '⚠ In Progress'],
    signed_off:  ['b-ok',     '✅ Signed Off'],
  };
  const [sCls, sLbl] = SBADGE[status];

  const fillCol = pct === 100 ? '#22c55e' : pct >= 50 ? '#f59e0b' : '#ef4444';

  const itemRows = ITEMS.map((ci, i) => {
    const it = items[ci.key] ?? { status:'not_confirmed', notes:'' };
    const icon = it.status === 'confirmed' ? '✅' : it.status === 'in_progress' ? '⚠' : '✕';
    const col  = it.status === 'confirmed' ? '#166534' : it.status === 'in_progress' ? '#92400e' : '#64748b';
    return `<div style="display:flex;gap:12px;padding:10px 0;
      border-bottom:1px solid var(--border);align-items:flex-start">
      <span style="color:var(--muted);font-size:12px;min-width:20px;margin-top:1px">${i+1}.</span>
      <div style="flex:1;font-size:13.5px;color:var(--heading)">${ci.label}</div>
      <span style="font-weight:700;font-size:13px;color:${col};white-space:nowrap">${icon} ${
        { confirmed:'Confirmed', in_progress:'In Progress', not_confirmed:'Not Confirmed' }[it.status] ?? '—'
      }</span>
    </div>`;
  }).join('');

  const signedSection = mob?.status === 'signed_off'
    ? `<div style="margin-top:14px;background:#f0fdf4;border:1.5px solid #22c55e;
        border-radius:8px;padding:14px 16px;font-size:13px;color:#166534;line-height:1.7">
        ✅ <strong>Signed off</strong> on ${mob.signed_off_date
          ? new Date(mob.signed_off_date).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})
          : '—'}.
        Work may commence in accordance with .
      </div>` : '';

  document.getElementById('mob-content').innerHTML = `
    <div class="sec-card" style="margin-bottom:14px">
      <div class="sec-body" style="padding:18px 20px">
        <div style="display:flex;align-items:center;justify-content:space-between;
          flex-wrap:wrap;gap:10px;margin-bottom:12px">
          <div>
            <div style="font-size:15px;font-weight:700;color:var(--heading)">
              Mobilization Review
            </div>
            <div style="font-size:12px;color:var(--muted);margin-top:2px">
              Before commencement of work, the mobilization review should confirm:
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:10px">
            <span class="badge ${sCls}">${sLbl}</span>
            <button class="btn btn-primary" style="padding:6px 14px;font-size:13px"
              onclick="location.href='mobilization-checklist.html?contract=${ID}'">
              ${status === 'signed_off' ? 'View Checklist' : 'Open Checklist'}
            </button>
          </div>
        </div>
        <!-- Progress bar -->
        <div style="background:var(--border);border-radius:6px;height:10px;margin-bottom:6px">
          <div style="width:${pct}%;height:10px;border-radius:6px;background:${fillCol};transition:width .4s"></div>
        </div>
        <div style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:14px">
          ${confirmed} of ${ITEMS.length} items confirmed
        </div>
        ${itemRows}
        ${signedSection}
      </div>
    </div>`;
}

async function changeStatus(newStatus) {
  if (!confirm('Change status to "' + newStatus + '"?')) return;
  const { error } = await sb.from('cnt_contracts').update({ status: newStatus }).eq('id', ID);
  if (error) return alert('Error: ' + error.message);
  if (contract) contract.status = newStatus;
  const [bCls, bLbl] = STATUS_BADGE[newStatus] ?? ['b-gray', newStatus];
  document.getElementById('status-badge').innerHTML = `<span class="badge ${bCls}">${bLbl}</span>`;
}

async function removeTeam(id) {
  if (!confirm('Remove this team member?')) return;
  await sb.from('cnt_contract_team').delete().eq('id', id);
  loadTeam();
}
init();
</script>
</body>
</html>
