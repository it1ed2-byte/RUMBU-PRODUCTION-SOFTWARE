<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contract Detail</title>
<script src="auth-contracts.js"></script>
<script src="sidebar-contracts.js"></script>
<link rel="stylesheet" href="contracts.css">
<style>
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:20px}
.info-item label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:4px;display:block}
.info-item .val{font-size:15px;font-weight:600;color:var(--heading)}
.info-item .val.mono{font-family:'Courier New',monospace;font-size:14px}
</style>
</head>
<body>
<div class="page-hdr">
  <div class="ph-left">
    <div class="ph-icon">📋</div>
    <div>
      <div class="ph-title" id="hdr-title">Contract Detail</div>
      <div class="ph-sub" id="hdr-sub">Loading…</div>
    </div>
  </div>
  <div class="ph-right" id="hdr-actions"></div>
</div>

<div class="content">
  <div id="loading" class="loading-wrap">
    <div class="spinner"></div>
    <div class="loading-txt">Loading contract…</div>
  </div>

  <div id="app" style="display:none">
    <!-- Tabs -->
    <div class="tabs" id="tabs">
      <button class="tab-btn active" onclick="switchTab('overview',this)">Overview</button>
      <button class="tab-btn" onclick="switchTab('progress',this)">Progress Reports</button>
      <button class="tab-btn" onclick="switchTab('kpi',this)">KPI</button>
      <button class="tab-btn" onclick="switchTab('team',this)">Team</button>
      <button class="tab-btn" onclick="switchTab('actions',this)">Corrective Actions</button>
      <button class="tab-btn" onclick="switchTab('ncr',this)">NCRs</button>
      <button class="tab-btn" onclick="switchTab('mob',this)">Mobilization</button>
    </div>

    <!-- Overview -->
    <div class="tab-pane active" id="tab-overview">
      <div class="sec-card">
        <div class="sec-hdr">
          <div class="sec-title">Contract Information</div>
          <div id="status-badge"></div>
        </div>
        <div class="sec-body">
          <div class="info-grid" id="info-grid"></div>
          <div style="border-top:1px solid var(--border);padding-top:16px;margin-top:4px">
            <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted);margin-bottom:8px">Physical Progress</div>
            <div class="prog-wrap" style="margin-bottom:14px">
              <div class="prog-track" style="flex:1"><div class="prog-fill" id="pp-fill" style="height:12px"></div></div>
              <span class="prog-pct" id="pp-pct">0%</span>
            </div>
            <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted);margin-bottom:8px">Financial Progress</div>
            <div class="prog-wrap">
              <div class="prog-track" style="flex:1"><div class="prog-fill" id="fp-fill" style="height:12px"></div></div>
              <span class="prog-pct" id="fp-pct">0%</span>
            </div>
          </div>
          <div id="notes-wrap" style="display:none;margin-top:16px;border-top:1px solid var(--border);padding-top:14px">
            <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted);margin-bottom:6px">Notes</div>
            <div id="notes-body" style="font-size:13.5px;line-height:1.7;color:var(--text)"></div>
          </div>
        </div>
      </div>

      <!-- Status change -->
      <div class="sec-card" id="status-card" style="display:none">
        <div class="sec-hdr"><div class="sec-title">Change Status</div></div>
        <div class="sec-body">
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            <button class="btn btn-ghost btn-sm" onclick="changeStatus('pipeline')">Pipeline</button>
            <button class="btn btn-ghost btn-sm" onclick="changeStatus('awarded')">Awarded</button>
            <button class="btn btn-ok btn-sm" onclick="changeStatus('active')">Active</button>
            <button class="btn btn-warn btn-sm" onclick="changeStatus('on_hold')">On Hold</button>
            <button class="btn btn-primary btn-sm" onclick="changeStatus('completed')">Completed</button>
            <button class="btn btn-ghost btn-sm" onclick="changeStatus('closeout')">Closeout</button>
            <button class="btn btn-bad btn-sm" onclick="changeStatus('terminated')">Terminated</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Progress Reports -->
    <div class="tab-pane" id="tab-progress">
      <div class="tbl-wrap">
        <div class="tbl-scroll"><table>
          <thead><tr><th>Period</th><th>Physical %</th><th>Financial %</th><th>Status</th><th>Date</th></tr></thead>
          <tbody id="prog-tbody"></tbody>
        </table></div>
      </div>
    </div>

    <!-- KPI -->
    <div class="tab-pane" id="tab-kpi">
      <div class="tbl-wrap">
        <div class="tbl-scroll"><table>
          <thead><tr><th>KPI Name</th><th>Target</th><th>Actual</th><th>Score</th><th>Status</th><th>Date</th></tr></thead>
          <tbody id="kpi-tbody"></tbody>
        </table></div>
      </div>
    </div>

    <!-- Team -->
    <div class="tab-pane" id="tab-team">
      <div class="tbl-wrap">
        <div class="tbl-scroll"><table>
          <thead><tr><th>Member</th><th>Role</th><th>Since</th><th>Actions</th></tr></thead>
          <tbody id="team-tbody"></tbody>
        </table></div>
      </div>
    </div>

    <!-- Corrective Actions -->
    <div class="tab-pane" id="tab-actions">
      <div class="tbl-wrap">
        <div class="tbl-scroll"><table>
          <thead><tr><th>Issue</th><th>Priority</th><th>Due</th><th>Status</th></tr></thead>
          <tbody id="ca-tbody"></tbody>
        </table></div>
      </div>
    </div>

    <!-- NCRs — §3.3 -->
    <div class="tab-pane" id="tab-ncr">
      <div style="display:flex;align-items:center;justify-content:space-between;
        margin-bottom:14px;flex-wrap:wrap;gap:10px">
        <div id="ncr-summary" style="font-size:13px;color:var(--muted)"></div>
        <button class="btn btn-primary" style="padding:6px 14px;font-size:13px"
          onclick="location.href='ncr-register.html?contract='+ID">
          ＋ Raise NCR
        </button>
      </div>
      <div class="tbl-wrap">
        <div class="tbl-scroll"><table>
          <thead><tr>
            <th>NCR Ref</th><th>Issue / Location</th>
            <th>Responsible</th><th>Due Date</th><th>Status</th>
          </tr></thead>
          <tbody id="ncr-tbody"></tbody>
        </table></div>
      </div>
    </div>

    <!-- Mobilization -->
    <div class="tab-pane" id="tab-mob">
      <div id="mob-content"></div>
    </div>

  </div>
</div>

<script>
let sb, contract, canAdmin = false;
const ID = new URLSearchParams(location.search).get('id');
const STATUS_BADGE = {
  'Pipeline':            ['b-navy','Pipeline'],
  'Active':             ['b-ok','Active'],
  'On Hold':            ['b-warn','On Hold'],
  'At Risk':            ['b-orange','At Risk'],
  'Delayed':            ['b-bad','Delayed'],
  'Practically Complete':['b-info','Practically Complete'],
  'Closed':             ['b-gray','Closed'],
  'Cancelled':          ['b-gray','Cancelled'],
};
const PRIORITY = { critical:['b-bad','Critical'],high:['b-warn','High'],medium:['b-info','Medium'],low:['b-gray','Low'] };

async function init() {
  const setMsg = m => {
    const el = document.getElementById('loading');
    if (el) el.innerHTML = `<div style="color:var(--muted);text-align:center;padding:40px;font-size:13px">${m}</div>`;
  };
  // Safety timeout — shows diagnostic if stuck after 12 s
  const timeout = setTimeout(() => setMsg(
    '⚠️ Loading timed out. This may be an authentication or network issue.<br>' +
    '<a href="contracts.html" style="color:var(--accent)">← Return to contracts list</a>'
  ), 12000);

  try {
    setMsg('Authenticating…');
    const auth = await guardPage();
    if (!auth) { clearTimeout(timeout); return; }
    sb = auth.sb;
    canAdmin = auth.permissions.has('users.manage') || auth.permissions.has('contract.edit');
    if (!ID) {
      clearTimeout(timeout);
      setMsg('No contract ID provided. <a href="contracts.html" style="color:var(--accent)">← Back</a>');
      return;
    }
    setMsg('Loading contract…');
    await loadContract();
    clearTimeout(timeout);
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  } catch(e) {
    clearTimeout(timeout);
    setMsg(`⚠️ ${e.message}<br><a href="contracts.html" style="color:var(--accent)">← Return to contracts list</a>`);
  }
}

function switchTab(id, el) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-' + id).classList.add('active');
  if (id === 'progress') loadProgress();
  if (id === 'kpi') loadKPIs();
  if (id === 'team') loadTeam();
  if (id === 'actions') loadActions();
  if (id === 'ncr')     loadNCRs();
  if (id === 'mob')     loadMobilization();
}

async function loadContract() {
  // ── FAST PATH: use data passed from management dashboard / contracts list ──
  try {
    const cached = window.parent?._pendingContract;
    if (cached && cached.id === ID) {
      window.parent._pendingContract = null;     // consume once

      // Resolve agency / company names from what the parent already has
      const agencyName  = cached.cnt_agencies?.name  || cached.agency_name  || '';
      const companyName = cached.cnt_companies?.name || cached.company_name || '';

      contract = { ...cached, agency_name: agencyName, company_name: companyName };
      render(contract);
      return;
    }
  } catch (_) {}

  // ── FALLBACK: fetch from database ─────────────────────────────────────────
  // Note: single-row filtered queries sometimes stall in this environment;
  // the fast path above should handle the common case.

  const { data: rows, error: cErr } = await sb
    .from('cnt_contracts')
    .select([
      'id','reference_number','title','description','status','risk_level',
      'original_value','original_start_date','original_completion_date',
      'revised_completion_date','contract_type','funding_source',
      'site_location','lga','state','notes','agency_id','assigned_company_id',
      'created_at','updated_at'
    ].join(','))
    .eq('id', ID)
    .limit(1);

  if (cErr) throw new Error('DB error: ' + cErr.message);
  const row = (rows || [])[0];
  if (!row) {
    document.getElementById('loading').innerHTML =
      '<p style="color:#b91c1c;padding:2rem">Contract not found (ID: ' + ID + ')</p>';
    return;
  }

  // Resolve names with two small targeted queries
  const [agR, coR] = await Promise.all([
    row.agency_id
      ? sb.from('cnt_agencies').select('name').eq('id', row.agency_id).limit(1)
      : { data: [] },
    row.assigned_company_id
      ? sb.from('cnt_companies').select('name').eq('id', row.assigned_company_id).limit(1)
      : { data: [] },
  ]);

  row.agency_name  = agR.data?.[0]?.name  || '';
  row.company_name = coR.data?.[0]?.name || '';

  contract = row;
  render(contract);
}
