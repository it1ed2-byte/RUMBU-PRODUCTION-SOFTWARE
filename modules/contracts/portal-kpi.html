<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Submit KPI Record</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--primary:#1F3864;--accent:#2E75B6;--ok:#22c55e;--bad:#ef4444;--warn:#f59e0b;
--bg:#f0f4f8;--card:#fff;--line:#e2e8f0;--muted:#64748b;--heading:#0f172a;
--shadow:0 1px 4px rgba(0,0,0,.1);--radius:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;font-size:14px;background:var(--bg);min-height:100vh}
.top-nav{background:var(--primary);color:#fff;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between}
.nav-brand{font-size:16px;font-weight:800}
.nav-brand span{color:#7eb3e8}
.nav-back{background:rgba(255,255,255,.15);border:none;color:#fff;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px}
.body{max-width:700px;margin:28px auto;padding:0 16px}
h1{font-size:20px;font-weight:700;color:var(--primary);margin-bottom:4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:22px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px;margin-bottom:16px}
.card-title{font-size:13px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.4px;margin-bottom:14px;border-bottom:1px solid var(--line);padding-bottom:8px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
label{font-size:12px;font-weight:600;color:var(--muted)}
.req{color:var(--bad)}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:14px;background:var(--card);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.variance-box{background:var(--bg);border-radius:8px;padding:12px 16px;display:flex;align-items:center;gap:10px;margin-bottom:14px}
.var-label{font-size:12px;color:var(--muted)}
.var-value{font-size:20px;font-weight:800}
.var-pos{color:var(--ok)}.var-neg{color:var(--bad)}.var-zero{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 22px;border:none;border-radius:8px;font-size:15px;cursor:pointer;font-weight:700}
.btn-accent{background:var(--primary);color:#fff;width:100%}
.btn-accent:hover{background:#2a4a80}
.msg{padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:14px}
.msg.ok{background:#dcfce7;color:#166534}
.msg.err{background:#fee2e2;color:#991b1b}
.kpi-items{display:flex;flex-direction:column;gap:14px}
.kpi-item{border:1px solid var(--line);border-radius:8px;padding:14px}
.kpi-item-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.kpi-item-title{font-size:13px;font-weight:700;color:var(--heading)}
.btn-rm{background:var(--bad);color:#fff;border:none;border-radius:6px;padding:3px 10px;font-size:12px;cursor:pointer}
.btn-add{display:inline-flex;align-items:center;gap:5px;padding:8px 16px;background:transparent;
  border:1px dashed var(--accent);color:var(--accent);border-radius:8px;font-size:13px;cursor:pointer;margin-top:8px}
.btn-add:hover{background:#eff6ff}
.status{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600;background:#e2e8f0;color:#374151}
.status.ok{background:#dcfce7;color:#166534}.status.warn{background:#fef3c7;color:#92400e}
.prev-table{width:100%;border-collapse:collapse;font-size:13px}
.prev-table th{background:var(--bg);color:var(--muted);font-weight:600;font-size:11px;text-align:left;padding:7px 10px}
.prev-table td{padding:7px 10px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div class="top-nav">
  <div class="nav-brand">RUMBU<span>CONTRACTS</span></div>
  <button class="nav-back" onclick="history.back()">← Back to Portal</button>
</div>
<div class="body">
  <h1>Submit KPI Record</h1>
  <p class="sub">Log your key performance indicators for the current reporting period.</p>

  <div id="msg" class="msg" style="display:none"></div>

  <div class="card">
    <div class="card-title">Contract & Period</div>
    <div class="form-row">
      <div class="field">
        <label>Contract <span class="req">*</span></label>
        <select id="f-contract" onchange="loadPrevious()"><option value="">— Select —</option></select>
      </div>
      <div class="field">
        <label>Reporting Period <span class="req">*</span></label>
        <input id="f-period" placeholder="e.g. October 2026">
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">KPI Entries</div>
    <div class="kpi-items" id="kpi-items">
      <!-- items added dynamically -->
    </div>
    <button class="btn-add" onclick="addKPI()">+ Add KPI</button>
  </div>

  <div class="card" id="prev-card" style="display:none">
    <div class="card-title">Recent KPI Records</div>
    <table class="prev-table"><thead><tr><th>KPI</th><th>Target</th><th>Actual</th><th>Period</th><th>Status</th></tr></thead>
    <tbody id="prev-tbody"></tbody></table>
  </div>

  <button class="btn btn-accent" onclick="submit()" style="margin-bottom:30px">Submit KPI Records</button>
</div>

<script>
const SUPABASE_URL = 'https://betfhunzmhtdzgvufmfk.supabase.co';
const SUPABASE_ANON = 'sb_publishable_AfDp1FlHghu9TOfqEUj20Q_Pke7GlTp';
const sb = (window.parent?.sb) ?? supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

let profile, contracts = [], kpiCount = 0;

async function init() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) { window.location.href = '/portal.html'; return; }

  const { data: p } = await sb.from('cnt_profiles').select('id,display_name,company_id,status').eq('id', user.id).single();
  if (!p || !p.company_id || p.status !== 'active') { window.location.href = '/portal.html'; return; }
  profile = p;

  const { data: c } = await sb.from('cnt_contracts')
    .select('id,contract_id,title')
    .eq('assigned_company_id', p.company_id)
    .in('status', ['active','awarded'])
    .order('contract_id');
  contracts = c ?? [];

  const sel = document.getElementById('f-contract');
  contracts.forEach(c => {
    const o = document.createElement('option'); o.value = c.id;
    o.textContent = c.contract_id + ' — ' + c.title; sel.appendChild(o);
  });

  // Start with 2 KPI rows
  addKPI(); addKPI();
}

let itemCounter = 0;
function addKPI() {
  itemCounter++;
  const id = itemCounter;
  const wrap = document.getElementById('kpi-items');
  const div = document.createElement('div');
  div.className = 'kpi-item';
  div.id = 'kpi-' + id;
  div.innerHTML = `
    <div class="kpi-item-header">
      <span class="kpi-item-title">KPI ${id}</span>
      ${id > 1 ? `<button class="btn-rm" onclick="removeKPI(${id})">Remove</button>` : ''}
    </div>
    <div class="form-row" style="margin-bottom:10px">
      <div class="field"><label>KPI Name <span class="req">*</span></label>
        <input id="kpi-${id}-name" placeholder="e.g. Concrete Poured (m³)"></div>
      <div class="field"><label>Unit</label>
        <input id="kpi-${id}-unit" placeholder="e.g. m³, %, NGN"></div>
    </div>
    <div class="form-row-3">
      <div class="field"><label>Target <span class="req">*</span></label>
        <input id="kpi-${id}-target" type="number" step="any" oninput="calcVariance(${id})"></div>
      <div class="field"><label>Actual <span class="req">*</span></label>
        <input id="kpi-${id}-actual" type="number" step="any" oninput="calcVariance(${id})"></div>
      <div class="field"><label>Variance</label>
        <input id="kpi-${id}-variance" readonly style="background:var(--bg);font-weight:700"></div>
    </div>
    <div class="field"><label>Notes</label>
      <textarea id="kpi-${id}-notes" rows="2" placeholder="Explanation or context…"></textarea>
    </div>`;
  wrap.appendChild(div);
}

function removeKPI(id) {
  document.getElementById('kpi-' + id).remove();
}

function calcVariance(id) {
  const t = parseFloat(document.getElementById('kpi-'+id+'-target').value);
  const a = parseFloat(document.getElementById('kpi-'+id+'-actual').value);
  const vEl = document.getElementById('kpi-'+id+'-variance');
  if (!isNaN(t) && !isNaN(a)) {
    const v = a - t;
    vEl.value = (v >= 0 ? '+' : '') + v.toFixed(2);
    vEl.style.color = v >= 0 ? 'var(--ok)' : 'var(--bad)';
  } else {
    vEl.value = '';
    vEl.style.color = '';
  }
}

async function loadPrevious() {
  const contractId = document.getElementById('f-contract').value;
  if (!contractId) return;
  const { data } = await sb.from('cnt_kpi_records')
    .select('kpi_name,target_value,actual_value,report_period,review_status')
    .eq('contract_id', contractId).order('created_at',{ascending:false}).limit(8);
  const pc = document.getElementById('prev-card');
  if (data?.length) {
    pc.style.display='block';
    document.getElementById('prev-tbody').innerHTML = data.map(r =>
      `<tr><td>${r.kpi_name??'—'}</td><td>${r.target_value??'—'}</td><td>${r.actual_value??'—'}</td>
      <td>${r.report_period??'—'}</td>
      <td><span class="status ${r.review_status==='approved'?'ok':'warn'}">${r.review_status??'pending'}</span></td></tr>`
    ).join('');
  } else pc.style.display='none';
}

async function submit() {
  const contractId = document.getElementById('f-contract').value;
  const period = document.getElementById('f-period').value.trim();
  if (!contractId || !period) { showMsg('Select a contract and enter the reporting period.','err'); return; }

  const items = document.querySelectorAll('.kpi-item');
  if (!items.length) { showMsg('Add at least one KPI entry.','err'); return; }

  const records = [];
  for (const item of items) {
    const iid = item.id.replace('kpi-','');
    const name = document.getElementById('kpi-'+iid+'-name')?.value.trim();
    const target = parseFloat(document.getElementById('kpi-'+iid+'-target')?.value);
    const actual = parseFloat(document.getElementById('kpi-'+iid+'-actual')?.value);
    if (!name || isNaN(target) || isNaN(actual)) { showMsg('Please complete all KPI fields.','err'); return; }
    records.push({
      contract_id: contractId,
      submitted_by: profile.id,
      kpi_name: name,
      unit: document.getElementById('kpi-'+iid+'-unit')?.value.trim()||null,
      target_value: target,
      actual_value: actual,
      variance: actual - target,
      report_period: period,
      notes: document.getElementById('kpi-'+iid+'-notes')?.value.trim()||null,
      review_status: 'pending',
      created_at: new Date().toISOString(),
    });
  }

  const { error } = await sb.from('cnt_kpi_records').insert(records);
  if (error) { showMsg('Error: ' + error.message,'err'); return; }

  showMsg(`${records.length} KPI record${records.length>1?'s':''} submitted successfully.`,'ok');
  document.getElementById('f-period').value = '';
  document.getElementById('kpi-items').innerHTML = '';
  itemCounter = 0;
  addKPI(); addKPI();
  await loadPrevious();
}

function showMsg(text, type) {
  const m = document.getElementById('msg');
  m.textContent = text; m.className = 'msg '+type; m.style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
}

init();
</script>
</body>
</html>
