<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Submit Progress Report</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--primary:#1F3864;--accent:#2E75B6;--ok:#22c55e;--bad:#ef4444;--warn:#f59e0b;
--bg:#f0f4f8;--card:#fff;--line:#e2e8f0;--muted:#64748b;--heading:#0f172a;
--shadow:0 1px 4px rgba(0,0,0,.1);--radius:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;font-size:14px;background:var(--bg);min-height:100vh}
.top-nav{background:var(--primary);color:#fff;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between}
.nav-brand{font-size:16px;font-weight:800}
.nav-brand span{color:#7eb3e8}
.nav-back{background:rgba(255,255,255,.15);border:none;color:#fff;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px}
.body{max-width:700px;margin:28px auto;padding:0 16px}
h1{font-size:20px;font-weight:700;color:var(--primary);margin-bottom:4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:22px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px;margin-bottom:16px}
.card-title{font-size:13px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.4px;margin-bottom:14px;border-bottom:1px solid var(--line);padding-bottom:8px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
label{font-size:12px;font-weight:600;color:var(--muted)}
.req{color:var(--bad)}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:14px;background:var(--card);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.prog-field{display:flex;flex-direction:column;gap:6px}
.prog-input-row{display:flex;align-items:center;gap:10px}
.prog-input-row input[type=range]{flex:1}
.prog-val{font-size:16px;font-weight:700;color:var(--primary);min-width:40px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 22px;border:none;border-radius:8px;font-size:15px;cursor:pointer;font-weight:700}
.btn-accent{background:var(--primary);color:#fff;width:100%}
.btn-accent:hover{background:#2a4a80}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line);padding:9px 18px}
.msg{padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:14px}
.msg.ok{background:#dcfce7;color:#166534}
.msg.err{background:#fee2e2;color:#991b1b}
.prev-table{width:100%;border-collapse:collapse;font-size:13px}
.prev-table th{background:var(--bg);color:var(--muted);font-weight:600;font-size:11px;text-align:left;padding:7px 10px}
.prev-table td{padding:7px 10px;border-top:1px solid var(--line)}
.status{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600;background:#e2e8f0;color:#374151}
.status.ok{background:#dcfce7;color:#166534}.status.warn{background:#fef3c7;color:#92400e}
</style>
</head>
<body>
<div class="top-nav">
  <div class="nav-brand">RUMBU<span>CONTRACTS</span></div>
  <button class="nav-back" onclick="history.back()">← Back to Portal</button>
</div>
<div class="body">
  <h1>Submit Progress Report</h1>
  <p class="sub">Report the physical and financial progress for your contract.</p>

  <div id="msg" class="msg" style="display:none"></div>

  <div class="card">
    <div class="card-title">Report Details</div>
    <div class="field">
      <label>Contract <span class="req">*</span></label>
      <select id="f-contract" onchange="loadContractInfo()"><option value="">— Select your contract —</option></select>
    </div>
    <div id="contract-info" style="background:var(--bg);border-radius:8px;padding:12px;margin-bottom:14px;display:none;font-size:13px;color:var(--muted)"></div>
    <div class="form-row">
      <div class="field">
        <label>Reporting Period <span class="req">*</span></label>
        <input id="f-period" type="text" placeholder="e.g. October 2026">
      </div>
      <div class="field">
        <label>Report Date</label>
        <input id="f-date" type="date">
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Progress</div>
    <div class="field">
      <label>Physical Progress (%) <span class="req">*</span></label>
      <div class="prog-input-row">
        <input type="range" id="pp-slider" min="0" max="100" value="0" oninput="syncSlider('pp')">
        <input type="number" id="pp-num" min="0" max="100" value="0" style="width:70px" oninput="syncNum('pp')">
        <span style="color:var(--muted)">%</span>
      </div>
    </div>
    <div class="field">
      <label>Financial Progress (%) <span class="req">*</span></label>
      <div class="prog-input-row">
        <input type="range" id="fp-slider" min="0" max="100" value="0" oninput="syncSlider('fp')">
        <input type="number" id="fp-num" min="0" max="100" value="0" style="width:70px" oninput="syncNum('fp')">
        <span style="color:var(--muted)">%</span>
      </div>
    </div>
    <div class="field">
      <label>Notes / Remarks</label>
      <textarea id="f-notes" rows="3" placeholder="Describe progress, challenges, or highlights…"></textarea>
    </div>
  </div>

  <div class="card" id="prev-card" style="display:none">
    <div class="card-title">Previous Reports</div>
    <table class="prev-table"><thead><tr><th>Period</th><th>Physical</th><th>Financial</th><th>Status</th></tr></thead>
    <tbody id="prev-tbody"></tbody></table>
  </div>

  <button class="btn btn-accent" onclick="submit()" style="margin-bottom:30px">Submit Report</button>
</div>

<script>
const SUPABASE_URL = 'https://betfhunzmhtdzgvufmfk.supabase.co';
const SUPABASE_ANON = 'sb_publishable_AfDp1FlHghu9TOfqEUj20Q_Pke7GlTp';
const sb = (window.parent?.sb) ?? supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

let profile, contracts = [];

async function init() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) { window.location.href = '/portal.html'; return; }

  const { data: p } = await sb.from('cnt_profiles').select('id,display_name,company_id,status').eq('id', user.id).single();
  if (!p || !p.company_id || p.status !== 'active') { window.location.href = '/portal.html'; return; }
  profile = p;

  const { data: c } = await sb.from('cnt_contracts')
    .select('id,contract_id,title,physical_progress,financial_progress,cnt_agencies(name)')
    .eq('assigned_company_id', p.company_id)
    .in('status', ['active','awarded'])
    .order('contract_id');
  contracts = c ?? [];

  const sel = document.getElementById('f-contract');
  contracts.forEach(c => {
    const o = document.createElement('option'); o.value = c.id;
    o.textContent = c.contract_id + ' — ' + c.title; sel.appendChild(o);
  });

  // Set today's date
  document.getElementById('f-date').value = new Date().toISOString().slice(0,10);

  // Check URL param
  const param = new URLSearchParams(location.search).get('contract');
  if (param) { sel.value = param; loadContractInfo(); }
}

async function loadContractInfo() {
  const id = document.getElementById('f-contract').value;
  const c = contracts.find(x => x.id === id);
  if (!c) { document.getElementById('contract-info').style.display='none'; return; }

  document.getElementById('contract-info').style.display = 'block';
  document.getElementById('contract-info').innerHTML =
    `Current progress — Physical: <strong>${c.physical_progress ?? 0}%</strong> · Financial: <strong>${c.financial_progress ?? 0}%</strong> · Agency: ${c.cnt_agencies?.name ?? '—'}`;

  // Load previous reports
  const { data: rpts } = await sb.from('cnt_progress_reports')
    .select('report_period,physical_progress,financial_progress,review_status')
    .eq('contract_id', id).order('created_at',{ascending:false}).limit(5);
  const pb = document.getElementById('prev-card');
  if (rpts?.length) {
    pb.style.display='block';
    document.getElementById('prev-tbody').innerHTML = rpts.map(r =>
      `<tr><td>${r.report_period??'—'}</td><td>${r.physical_progress??0}%</td><td>${r.financial_progress??0}%</td>
      <td><span class="status ${r.review_status==='approved'?'ok':'warn'}">${r.review_status??'pending'}</span></td></tr>`
    ).join('');
  } else pb.style.display='none';
}

function syncSlider(id) {
  document.getElementById(id+'-num').value = document.getElementById(id+'-slider').value;
}
function syncNum(id) {
  let v = parseInt(document.getElementById(id+'-num').value)||0;
  v = Math.min(100,Math.max(0,v));
  document.getElementById(id+'-num').value = v;
  document.getElementById(id+'-slider').value = v;
}

async function submit() {
  const contractId = document.getElementById('f-contract').value;
  const period = document.getElementById('f-period').value.trim();
  const pp = parseInt(document.getElementById('pp-num').value)||0;
  const fp = parseInt(document.getElementById('fp-num').value)||0;

  if (!contractId || !period) { showMsg('Select a contract and enter the reporting period.','err'); return; }

  const { error } = await sb.from('cnt_progress_reports').insert({
    contract_id: contractId,
    submitted_by: profile.id,
    report_period: period,
    report_date: document.getElementById('f-date').value || null,
    physical_progress: pp,
    financial_progress: fp,
    notes: document.getElementById('f-notes').value.trim()||null,
    review_status: 'pending',
    submitted_at: new Date().toISOString(),
  });

  if (error) { showMsg('Error: ' + error.message, 'err'); return; }

  // Update contract progress
  await sb.from('cnt_contracts').update({ physical_progress: pp, financial_progress: fp }).eq('id', contractId);

  showMsg('Report submitted successfully. The contract manager will review it shortly.','ok');
  document.getElementById('f-period').value = '';
  document.getElementById('f-notes').value = '';
  document.getElementById('pp-slider').value = 0; document.getElementById('pp-num').value = 0;
  document.getElementById('fp-slider').value = 0; document.getElementById('fp-num').value = 0;
  await loadContractInfo();
}

function showMsg(text, type) {
  const m = document.getElementById('msg');
  m.textContent = text; m.className = 'msg '+type; m.style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
}

init();
</script>
</body>
</html>
