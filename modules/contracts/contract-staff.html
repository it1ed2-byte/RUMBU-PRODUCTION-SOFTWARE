<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contract Staff</title>
<script src="auth-contracts.js"></script>
<script src="sidebar-contracts.js"></script>
<link rel="stylesheet" href="contracts.css">
</head>
<body>
<div class="page-hdr">
  <div class="ph-left">
    <div class="ph-icon">👷</div>
    <div>
      <div class="ph-title">Contract Staff</div>
      <div class="ph-sub">Assign team members to contracts</div>
    </div>
  </div>
  <div class="ph-right">
    <button class="btn btn-hdr-primary" onclick="openModal()">＋ Assign Member</button>
  </div>
</div>

<div class="content">
  <div id="loading" class="loading-wrap">
    <div class="spinner"></div>
    <div class="loading-txt">Loading team assignments…</div>
  </div>

  <div id="app" style="display:none">
    <div class="toolbar">
      <select class="flt" id="fContract" onchange="render()">
        <option value="">All Contracts</option>
      </select>
    </div>
    <div class="tbl-wrap">
      <div class="tbl-scroll">
        <table>
          <thead>
            <tr><th>Staff Member</th><th>Contract</th><th>Role on Contract</th><th>Start Date</th><th>Actions</th></tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-hdr">
      <span class="modal-title">Assign Team Member</span>
      <button class="modal-x" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="g2" style="margin-bottom:14px">
        <div class="field">
          <label>Contract <span class="req">*</span></label>
          <select id="m-contract"><option value="">— Select Contract —</option></select>
        </div>
        <div class="field">
          <label>Staff Member <span class="req">*</span></label>
          <select id="m-profile"><option value="">— Select Staff —</option></select>
        </div>
      </div>
      <div class="g2">
        <div class="field">
          <label>Role on Contract</label>
          <input id="m-role" placeholder="e.g. Site Engineer, Inspector">
        </div>
        <div class="field">
          <label>Assignment Start</label>
          <input id="m-date" type="date">
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="assign()">Assign</button>
    </div>
    <div style="padding:0 22px 14px"><span id="msg" style="font-size:13px;display:none"></span></div>
  </div>
</div>

<script>
let sb, rows = [];

async function init() {
  try {
    const auth = await guardPage();
    if (!auth) return;
    sb = auth.sb;

    const [tRes, cRes, pRes] = await Promise.all([
      sb.from('cnt_contract_team').select(`
        id,role_on_contract,start_date,
        cnt_contracts(id,contract_id,title),
        cnt_profiles(id,full_name,email)
      `).order('start_date',{ascending:false}),
      sb.from('cnt_contracts').select('id,contract_id,title').eq('status','active').order('contract_id'),
      sb.from('cnt_profiles').select('id,full_name').eq('status','active').not('staff_id','like','SA-%').order('full_name')
    ]);

    rows = tRes.data ?? [];

    const cSel = document.getElementById('m-contract');
    const fSel = document.getElementById('fContract');
    (cRes.data ?? []).forEach(c => {
      const label = c.contract_id + ' — ' + c.title;
      [cSel, fSel].forEach(sel => {
        const o = document.createElement('option');
        o.value = c.id; o.textContent = label;
        sel.appendChild(o);
      });
    });

    const pSel = document.getElementById('m-profile');
    (pRes.data ?? []).forEach(p => {
      const o = document.createElement('option');
      o.value = p.id; o.textContent = p.full_name;
      pSel.appendChild(o);
    });

    render();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  } catch(e) {
    document.getElementById('loading').innerHTML = `<div style="color:var(--bad);text-align:center;padding:40px">⚠️ ${e.message}</div>`;
  }
}

function render() {
  const fc = document.getElementById('fContract').value;
  const data = fc ? rows.filter(r => r.cnt_contracts?.id === fc) : rows;
  const tbody = document.getElementById('tbody');
  if (!data.length) {
    tbody.innerHTML = `<tr><td colspan="5"><div class="empty-state"><span class="e-icon">👷</span><p>${rows.length ? 'No assignments match.' : 'No team members assigned yet.'}</p></div></td></tr>`;
    return;
  }
  tbody.innerHTML = data.map(r => {
    const p = r.cnt_profiles;
    const c = r.cnt_contracts;
    const initials = (p?.full_name ?? '?').split(' ').map(w => w[0]).slice(0,2).join('').toUpperCase();
    return `<tr>
      <td>
        <div class="user-cell">
          <div class="avatar">${initials}</div>
          <div>
            <div class="user-name">${p?.full_name ?? '—'}</div>
            <div class="user-meta">${p?.email ?? ''}</div>
          </div>
        </div>
      </td>
      <td>
        <span class="ref">${c?.contract_id ?? '—'}</span>
        <div style="font-size:12px;color:var(--muted);margin-top:2px">${c?.title ?? ''}</div>
      </td>
      <td>${r.role_on_contract ? `<span class="badge b-navy">${r.role_on_contract}</span>` : '—'}</td>
      <td style="font-size:13px">${r.start_date ? fmtDate(r.start_date) : '—'}</td>
      <td>
        <button class="btn btn-bad btn-sm" onclick="remove('${r.id}')">Remove</button>
      </td>
    </tr>`;
  }).join('');
}

function openModal() {
  document.getElementById('m-contract').value = '';
  document.getElementById('m-profile').value  = '';
  document.getElementById('m-role').value     = '';
  document.getElementById('m-date').value     = '';
  document.getElementById('msg').style.display = 'none';
  document.getElementById('overlay').classList.add('open');
}
function closeModal() { document.getElementById('overlay').classList.remove('open'); }

async function assign() {
  const contractId = document.getElementById('m-contract').value;
  const profileId  = document.getElementById('m-profile').value;
  if (!contractId || !profileId) return showMsg('Select a contract and staff member.', 'err');
  const { error } = await sb.from('cnt_contract_team').insert({
    cnt_contract_id: contractId,
    cnt_profile_id:  profileId,
    role_on_contract: document.getElementById('m-role').value.trim() || null,
    start_date: document.getElementById('m-date').value || null,
  });
  if (error) return showMsg('Error: ' + error.message, 'err');
  const { data } = await sb.from('cnt_contract_team').select(`
    id,role_on_contract,start_date,
    cnt_contracts(id,contract_id,title),
    cnt_profiles(id,full_name,email)
  `).order('start_date',{ascending:false});
  rows = data ?? [];
  render(); closeModal();
}

async function remove(id) {
  if (!confirm('Remove this team member from the contract?')) return;
  await sb.from('cnt_contract_team').delete().eq('id', id);
  rows = rows.filter(r => r.id !== id);
  render();
}

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text; el.style.color = type === 'ok' ? 'var(--ok)' : 'var(--bad)';
  el.style.display = 'inline';
}
function fmtDate(iso) {
  return new Date(iso).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
}
init();
</script>
</body>
</html>
