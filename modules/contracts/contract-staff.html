<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contract Staff</title>
<style>
:root{--primary:#1F3864;--accent:#2E75B6;--ok:#22c55e;--bad:#ef4444;--warn:#f59e0b;
--bg:#f8fafc;--card:#fff;--line:#e2e8f0;--muted:#64748b;--heading:#0f172a;
--th-bg:#f1f5f9;--th-fg:#374151;--shadow:0 1px 3px rgba(0,0,0,.08);--radius:8px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;font-size:14px;background:var(--bg);color:var(--heading);padding:20px}
h1{font-size:20px;font-weight:700;color:var(--primary);margin-bottom:18px}
.toolbar{display:flex;gap:10px;margin-bottom:14px;align-items:center;flex-wrap:wrap}
.toolbar select,.toolbar input{border:1px solid var(--line);border-radius:var(--radius);padding:7px 10px;font-size:13px;background:var(--card)}
.toolbar input{flex:1;min-width:160px}
.btn{display:inline-flex;align-items:center;padding:7px 14px;border:none;border-radius:var(--radius);font-size:13px;cursor:pointer;font-weight:500}
.btn-accent{background:var(--accent);color:#fff}
.btn-bad{background:var(--bad);color:#fff}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn-sm{padding:4px 10px;font-size:12px}
.table-wrap{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{background:var(--th-bg);color:var(--th-fg);font-size:12px;font-weight:600;text-align:left;padding:10px 12px}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
.empty{text-align:center;padding:30px;color:var(--muted)}
.avatar{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;
  border-radius:50%;background:var(--accent);color:#fff;font-size:13px;font-weight:700;flex-shrink:0}
.name-cell{display:flex;align-items:center;gap:10px}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center}
.overlay.open{display:flex}
.modal{background:var(--card);border-radius:var(--radius);box-shadow:0 8px 32px rgba(0,0,0,.18);padding:24px;width:480px;max-width:95vw;max-height:90vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:700;color:var(--primary);margin-bottom:18px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
label{font-size:12px;font-weight:600;color:var(--th-fg)}
input,select{border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;font-size:14px;background:var(--card);width:100%}
input:focus,select:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
</style>
</head>
<body>
<h1>Contract Staff Assignments</h1>
<div class="toolbar">
  <input id="q" type="search" placeholder="Search staff or contract…" oninput="render()">
  <select id="fContract" onchange="render()"><option value="">All Contracts</option></select>
  <button class="btn btn-accent" onclick="openModal()">+ Assign Staff</button>
</div>
<div class="table-wrap">
  <div class="table-scroll">
    <table>
      <thead><tr><th>Staff Member</th><th>Contract</th><th>Role on Contract</th><th>Assigned</th><th></th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-title">Assign Staff to Contract</div>
    <div class="field">
      <label>Contract *</label>
      <select id="f-contract"><option value="">— Select Contract —</option></select>
    </div>
    <div class="field">
      <label>Staff Member *</label>
      <select id="f-staff"><option value="">— Select Staff —</option></select>
    </div>
    <div class="field">
      <label>Role on Contract</label>
      <input id="f-role" placeholder="e.g. Site Supervisor, Contract Manager">
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-accent" onclick="assign()">Assign</button>
    </div>
  </div>
</div>

<script>
let sb, rows = [], contracts = [], staff = [];

async function init() {
  sb = window.parent?.sb;
  if (!sb) return;

  const [tRes, cRes, sRes] = await Promise.all([
    sb.from('cnt_contract_team').select(`
      id,role_in_contract,assigned_at,
      cnt_contracts(id,contract_id,title),
      cnt_profiles(id,display_name,email)
    `).order('assigned_at',{ascending:false}),
    sb.from('cnt_contracts').select('id,contract_id,title').in('status',['active','awarded']).order('contract_id'),
    sb.from('cnt_profiles').select('id,display_name,email').eq('status','active').is('company_id',null).order('display_name')
  ]);

  rows = tRes.data ?? [];
  contracts = cRes.data ?? [];
  staff = sRes.data ?? [];

  // Populate filter + modal dropdowns
  contracts.forEach(c => {
    const o1 = document.createElement('option'); o1.value = c.id; o1.textContent = c.contract_id + ' — ' + c.title;
    document.getElementById('fContract').appendChild(o1);
    const o2 = o1.cloneNode(true);
    document.getElementById('f-contract').appendChild(o2);
  });
  staff.forEach(s => {
    const o = document.createElement('option'); o.value = s.id;
    o.textContent = s.display_name + (s.email ? ' (' + s.email + ')' : '');
    document.getElementById('f-staff').appendChild(o);
  });

  render();
}

function render() {
  const q = document.getElementById('q').value.toLowerCase();
  const fc = document.getElementById('fContract').value;
  const data = rows.filter(r => {
    if (fc && r.cnt_contracts?.id !== fc) return false;
    if (q && !r.cnt_profiles?.display_name?.toLowerCase().includes(q) && !r.cnt_contracts?.title?.toLowerCase().includes(q)) return false;
    return true;
  });
  const t = document.getElementById('tbody');
  if (!data.length) { t.innerHTML = '<tr><td colspan="5" class="empty">No assignments found</td></tr>'; return; }
  t.innerHTML = data.map(r => {
    const initials = (r.cnt_profiles?.display_name ?? '?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
    return `<tr>
      <td><div class="name-cell"><div class="avatar">${initials}</div>
        <div><div style="font-weight:600">${r.cnt_profiles?.display_name ?? '—'}</div>
        <div style="font-size:12px;color:var(--muted)">${r.cnt_profiles?.email ?? ''}</div></div>
      </div></td>
      <td><strong>${r.cnt_contracts?.contract_id}</strong><br><small style="color:var(--muted)">${r.cnt_contracts?.title}</small></td>
      <td>${r.role_in_contract ?? '—'}</td>
      <td>${fmtDate(r.assigned_at)}</td>
      <td><button class="btn btn-bad btn-sm" onclick="remove('${r.id}')">Remove</button></td>
    </tr>`;
  }).join('');
}

function openModal() { document.getElementById('overlay').classList.add('open'); }
function closeModal(e) {
  if (!e || e.target === document.getElementById('overlay'))
    document.getElementById('overlay').classList.remove('open');
}

async function assign() {
  const contractId = document.getElementById('f-contract').value;
  const staffId = document.getElementById('f-staff').value;
  if (!contractId || !staffId) { alert('Select contract and staff member'); return; }

  // Prevent duplicate
  if (rows.some(r => r.cnt_contracts?.id === contractId && r.cnt_profiles?.id === staffId)) {
    alert('This staff member is already assigned to this contract'); return;
  }

  const { error } = await sb.from('cnt_contract_team').insert({
    contract_id: contractId,
    profile_id: staffId,
    role_in_contract: document.getElementById('f-role').value.trim() || null,
    assigned_at: new Date().toISOString(),
  });
  if (error) { alert('Error: ' + error.message); return; }

  closeModal();
  const { data } = await sb.from('cnt_contract_team').select(`
    id,role_in_contract,assigned_at,
    cnt_contracts(id,contract_id,title),
    cnt_profiles(id,display_name,email)
  `).order('assigned_at',{ascending:false});
  rows = data ?? [];
  render();
}

async function remove(id) {
  if (!confirm('Remove this staff assignment?')) return;
  await sb.from('cnt_contract_team').delete().eq('id', id);
  rows = rows.filter(r => r.id !== id);
  render();
}

function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
}

init();
</script>
</body>
</html>
