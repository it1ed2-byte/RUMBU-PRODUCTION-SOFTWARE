let sb, totalSteps, doneSteps = 0;

function setProgress(label) {
  doneSteps++;
  const pct = Math.min(100, Math.round((doneSteps / totalSteps) * 100));
  document.getElementById('fill').style.width = pct + '%';
  document.getElementById('progressLbl').textContent = label + ' (' + pct + '%)';
}
function log(msg, cls) {
  const el = document.getElementById('log');
  const d  = document.createElement('div');
  d.className = 'log-line c-' + (cls || 'info');
  d.textContent = new Date().toLocaleTimeString() + '  ' + msg;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
}

async function runImport() {
  const btn = document.getElementById('btn');
  btn.disabled = true;
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('log').style.display = 'block';
  document.getElementById('result').style.display = 'none';
  doneSteps = 0;

  const contractBatches = [];
  for (let i = 0; i < DATA.contracts.length; i += BATCH)
    contractBatches.push(DATA.contracts.slice(i, i + BATCH));
  totalSteps = DATA.agencies.length + DATA.companies.length + contractBatches.length;

  const agencyMap  = {};
  const companyMap = {};
  let inserted = 0, skipped = 0, errors = 0;

  try {
    // ── Step 1: Agencies ─────────────────────────────────────────────────
    log('── Step 1: Agencies (' + DATA.agencies.length + ')', 'info');
    for (const name of DATA.agencies) {
      const { data: ex } = await sb.from('cnt_agencies')
        .select('id').ilike('name', name).limit(1);
      if (ex && ex.length) {
        agencyMap[name.toLowerCase()] = ex[0].id;
        log('  SKIP ' + name, 'warn');
      } else {
        const { data: ins, error } = await sb.from('cnt_agencies')
          .insert({ name, org_id: ORG_ID }).select('id').single();
        if (error) { log('  ERR  ' + name + ' — ' + error.message, 'err'); errors++; }
        else        { agencyMap[name.toLowerCase()] = ins.id; log('  OK   ' + name, 'ok'); }
      }
      setProgress('Agencies');
    }
    log('  Agencies done — ' + Object.keys(agencyMap).length + ' mapped', 'ok');

    // ── Step 2: Companies ────────────────────────────────────────────────
    log('── Step 2: Companies (' + DATA.companies.length + ')', 'info');
    for (const name of DATA.companies) {
      const { data: ex } = await sb.from('cnt_companies')
        .select('id').ilike('name', name).limit(1);
      if (ex && ex.length) {
        companyMap[name.toLowerCase()] = ex[0].id;
      } else {
        const { data: ins, error } = await sb.from('cnt_companies')
          .insert({ name, status: 'active', org_id: ORG_ID }).select('id').single();
        if (error) { errors++; }
        else        { companyMap[name.toLowerCase()] = ins.id; }
      }
      setProgress('Companies');
    }
    log('  Companies done — ' + Object.keys(companyMap).length + ' mapped', 'ok');

    // ── Step 3: Contracts ────────────────────────────────────────────────
    log('── Step 3: Contracts (' + DATA.contracts.length + ' in batches of ' + BATCH + ')', 'info');
    for (let bi = 0; bi < contractBatches.length; bi++) {
      const rows = [];
      for (const c of contractBatches[bi]) {
        const { data: ex } = await sb.from('cnt_contracts')
          .select('id').eq('contract_id', c.contract_id).limit(1);
        if (ex && ex.length) { skipped++; continue; }
        rows.push({
          org_id:                 ORG_ID,
          contract_id:            c.contract_id,
          title:                  c.title,
          status:                 c.status,
          agency_id:              agencyMap[c.agency_name.toLowerCase()] || null,
          assigned_company_id:    companyMap[c.company_name.toLowerCase()] || null,
          original_value:         c.original_value,
          currency:               'NGN',
          award_date:             c.year + '-01-01',
          start_date:             c.year + '-01-01',
          state:                  c.state,
          physical_progress_pct:  0,
          financial_progress_pct: 0,
          overall_progress_pct:   0,
          risk_level:             'low',
        });
      }
      if (rows.length) {
        const { error } = await sb.from('cnt_contracts').insert(rows);
        if (error) {
          log('  ERR batch ' + (bi+1) + ': ' + error.message, 'err');
          errors += rows.length;
        } else {
          inserted += rows.length;
          log('  Batch ' + (bi+1) + '/' + contractBatches.length +
              ' — ' + rows.length + ' inserted', 'ok');
        }
      }
      setProgress('Contracts batch ' + (bi+1));
    }

    // ── Summary ──────────────────────────────────────────────────────────
    const summary = 'Done. Inserted: ' + inserted +
                    ' | Skipped: '  + skipped +
                    ' | Errors: '   + errors;
    log('── ' + summary, errors ? 'err' : 'ok');
    const res = document.getElementById('result');
    res.className = 'imp-result ' + (errors ? 'err' : 'ok');
    res.textContent = summary;
    res.style.display = 'block';
  } catch (e) {
    log('FATAL: ' + e.message, 'err');
    const res = document.getElementById('result');
    res.className = 'imp-result err';
    res.textContent = 'Fatal: ' + e.message;
    res.style.display = 'block';
  }
  btn.disabled = false;
  btn.textContent = '↺ Run Again';
}

// ── Auth gate — same as every other contracts page ─────────────────────────
async function init() {
  try {
    const auth = await guardPage();
    if (!auth) return;
    sb = auth.sb;
    document.getElementById('btn').disabled = false;
  } catch(e) {
    document.getElementById('btn').textContent = 'Auth error: ' + e.message;
  }
}
document.getElementById('btn').disabled = true;
document.getElementById('btn').textContent = 'Checking auth…';
init();
</script>
