<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Corrective Actions</title>
<style>
:root{--primary:#1F3864;--accent:#2E75B6;--ok:#22c55e;--bad:#ef4444;--warn:#f59e0b;
--bg:#f8fafc;--card:#fff;--line:#e2e8f0;--muted:#64748b;--heading:#0f172a;
--th-bg:#f1f5f9;--th-fg:#374151;--shadow:0 1px 3px rgba(0,0,0,.08);--radius:8px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;font-size:14px;background:var(--bg);color:var(--heading);padding:20px}
h1{font-size:20px;font-weight:700;color:var(--primary);margin-bottom:18px}
.toolbar{display:flex;gap:10px;margin-bottom:14px;align-items:center;flex-wrap:wrap}
.toolbar select,.toolbar input{border:1px solid var(--line);border-radius:var(--radius);padding:7px 10px;font-size:13px;background:var(--card)}
.toolbar input{flex:1;min-width:160px}
.btn{display:inline-flex;align-items:center;padding:7px 14px;border:none;border-radius:var(--radius);font-size:13px;cursor:pointer;font-weight:500}
.btn-accent{background:var(--accent);color:#fff}
.btn-ok{background:var(--ok);color:#fff}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn-sm{padding:4px 10px;font-size:12px}
.table-wrap{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{background:var(--th-bg);color:var(--th-fg);font-size:12px;font-weight:600;text-align:left;padding:10px 12px}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
.status{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;background:var(--th-bg);color:var(--th-fg)}
.status.ok{background:#dcfce7;color:#166534}.status.warn{background:#fef3c7;color:#92400e}.status.err{background:#fee2e2;color:#991b1b}
.empty{text-align:center;padding:30px;color:var(--muted)}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center}
.overlay.open{display:flex}
.modal{background:var(--card);border-radius:var(--radius);box-shadow:0 8px 32px rgba(0,0,0,.18);padding:24px;width:540px;max-width:95vw;max-height:90vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:700;color:var(--primary);margin-bottom:18px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
label{font-size:12px;font-weight:600;color:var(--th-fg)}
input,select,textarea{border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;font-size:14px;background:var(--card);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
</style>
</head>
<body>
<h1>Corrective Actions</h1>
<div class="toolbar">
  <input id="q" type="search" placeholder="Search…" oninput="render()">
  <select id="fStatus" onchange="render()">
    <option value="">All Statuses</option>
    <option value="open">Open</option>
    <option value="in_progress">In Progress</option>
    <option value="resolved">Resolved</option>
    <option value="closed">Closed</option>
  </select>
  <button class="btn btn-accent" onclick="openModal()">+ Log Action</button>
</div>
<div class="table-wrap">
  <div class="table-scroll">
    <table>
      <thead><tr><th>Contract</th><th>Company</th><th>Description</th><th>Due Date</th><th>Status</th><th>Logged</th><th></th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-title" id="modal-title">Log Corrective Action</div>
    <input type="hidden" id="edit-id">
    <div class="field">
      <label>Contract</label>
      <select id="f-contract"><option value="">— Select Contract —</option></select>
    </div>
    <div class="field">
      <label>Description *</label>
      <textarea id="f-desc" rows="3" placeholder="Describe the issue and required corrective action…"></textarea>
    </div>
    <div class="form-row">
      <div class="field"><label>Due Date</label><input id="f-due" type="date"></div>
      <div class="field"><label>Status</label>
        <select id="f-status">
          <option value="open">Open</option>
          <option value="in_progress">In Progress</option>
          <option value="resolved">Resolved</option>
          <option value="closed">Closed</option>
        </select>
      </div>
    </div>
    <div class="field"><label>Resolution Notes</label><textarea id="f-resolution" rows="2" placeholder="Steps taken / outcome…"></textarea></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-accent" onclick="save()">Save</button>
    </div>
  </div>
</div>

<script>
let sb, rows = [], contracts = [];

async function init() {
  sb = window.parent?.sb;
  if (!sb) return;
  const [aRes, cRes] = await Promise.all([
    sb.from('cnt_corrective_actions').select(`
      id,description,due_date,status,resolution_notes,created_at,
      cnt_contracts(id,contract_id,title,cnt_companies(name))
    `).order('created_at',{ascending:false}),
    sb.from('cnt_contracts').select('id,contract_id,title').in('status',['active','awarded','on_hold']).order('contract_id')
  ]);
  rows = aRes.data ?? [];
  contracts = cRes.data ?? [];
  contracts.forEach(c => {
    const o = document.createElement('option');
    o.value = c.id; o.textContent = c.contract_id + ' — ' + c.title;
    document.getElementById('f-contract').appendChild(o);
  });
  render();
}

function render() {
  const q = document.getElementById('q').value.toLowerCase();
  const st = document.getElementById('fStatus').value;
  const data = rows.filter(r => {
    if (st && r.status !== st) return false;
    if (q && !r.description?.toLowerCase().includes(q) && !r.cnt_contracts?.title?.toLowerCase().includes(q)) return false;
    return true;
  });
  const t = document.getElementById('tbody');
  if (!data.length) { t.innerHTML = '<tr><td colspan="7" class="empty">No corrective actions</td></tr>'; return; }
  t.innerHTML = data.map(r => {
    const stCls = r.status==='resolved'||r.status==='closed'?'ok':r.status==='in_progress'?'warn':'err';
    const stLbl = {open:'Open',in_progress:'In Progress',resolved:'Resolved',closed:'Closed'}[r.status]??r.status;
    const overdue = r.due_date && new Date(r.due_date) < new Date() && r.status==='open';
    return `<tr>
      <td><strong>${r.cnt_contracts?.contract_id}</strong></td>
      <td>${r.cnt_contracts?.cnt_companies?.name ?? '—'}</td>
      <td style="max-width:260px">${r.description ?? '—'}</td>
      <td style="${overdue?'color:var(--bad);font-weight:600':''}">${fmtDate(r.due_date)}${overdue?' ⚠':''}️</td>
      <td><span class="status ${stCls}">${stLbl}</span></td>
      <td>${fmtDate(r.created_at)}</td>
      <td><button class="btn btn-ghost btn-sm" onclick='edit(${JSON.stringify(r)})'>Update</button></td>
    </tr>`;
  }).join('');
}

function openModal(data) {
  document.getElementById('modal-title').textContent = data ? 'Update Corrective Action' : 'Log Corrective Action';
  document.getElementById('edit-id').value = data?.id ?? '';
  document.getElementById('f-contract').value = data?.cnt_contracts?.id ?? '';
  document.getElementById('f-desc').value = data?.description ?? '';
  document.getElementById('f-due').value = data?.due_date ?? '';
  document.getElementById('f-status').value = data?.status ?? 'open';
  document.getElementById('f-resolution').value = data?.resolution_notes ?? '';
  document.getElementById('overlay').classList.add('open');
}
function edit(r) { openModal(r); }
function closeModal(e) {
  if (!e || e.target === document.getElementById('overlay'))
    document.getElementById('overlay').classList.remove('open');
}

async function save() {
  const desc = document.getElementById('f-desc').value.trim();
  const contractId = document.getElementById('f-contract').value;
  if (!desc || !contractId) { alert('Contract and description are required'); return; }
  const payload = {
    contract_id: contractId,
    description: desc,
    due_date: document.getElementById('f-due').value || null,
    status: document.getElementById('f-status').value,
    resolution_notes: document.getElementById('f-resolution').value.trim() || null,
  };
  const id = document.getElementById('edit-id').value;
  if (id) {
    await sb.from('cnt_corrective_actions').update(payload).eq('id', id);
  } else {
    await sb.from('cnt_corrective_actions').insert(payload);
  }
  closeModal();
  const { data } = await sb.from('cnt_corrective_actions').select(`
    id,description,due_date,status,resolution_notes,created_at,
    cnt_contracts(id,contract_id,title,cnt_companies(name))
  `).order('created_at',{ascending:false});
  rows = data ?? [];
  render();
}

function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
}

init();
</script>
</body>
</html>
