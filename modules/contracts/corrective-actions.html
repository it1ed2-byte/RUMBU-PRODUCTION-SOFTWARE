<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Corrective Actions</title>
<script src="auth-contracts.js"></script>
<script src="sidebar-contracts.js"></script>
<link rel="stylesheet" href="contracts.css">
</head>
<body>
<div class="page-hdr">
  <div class="ph-left">
    <div class="ph-icon">🔧</div>
    <div>
      <div class="ph-title">Corrective Actions</div>
      <div class="ph-sub">Track and manage contract corrective action items</div>
    </div>
  </div>
  <div class="ph-right">
    <button class="btn btn-hdr-primary" onclick="openModal(null)">＋ New Action</button>
  </div>
</div>

<div class="content">
  <div id="loading" class="loading-wrap">
    <div class="spinner"></div>
    <div class="loading-txt">Loading actions…</div>
  </div>

  <div id="app" style="display:none">
    <div class="toolbar">
      <select class="flt" id="fStatus" onchange="render()">
        <option value="">All Status</option>
        <option value="open">Open</option>
        <option value="in_progress">In Progress</option>
        <option value="resolved">Resolved</option>
        <option value="closed">Closed</option>
      </select>
      <select class="flt" id="fPriority" onchange="render()">
        <option value="">All Priorities</option>
        <option value="critical">Critical</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
    </div>
    <div class="tbl-wrap">
      <div class="tbl-scroll">
        <table>
          <thead>
            <tr><th>Contract</th><th>Issue</th><th>Priority</th><th>Due Date</th><th>Status</th><th>Actions</th></tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" style="width:540px">
    <div class="modal-hdr">
      <span class="modal-title" id="modal-title">New Corrective Action</span>
      <button class="modal-x" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="m-id">
      <div class="g2" style="margin-bottom:14px">
        <div class="field">
          <label>Contract <span class="req">*</span></label>
          <select id="m-contract"><option value="">— Select —</option></select>
        </div>
        <div class="field">
          <label>Priority</label>
          <select id="m-priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
            <option value="critical">Critical</option>
          </select>
        </div>
      </div>
      <div class="field" style="margin-bottom:14px">
        <label>Issue Description <span class="req">*</span></label>
        <textarea id="m-issue" rows="3" placeholder="Describe the issue…"></textarea>
      </div>
      <div class="field" style="margin-bottom:14px">
        <label>Required Action</label>
        <textarea id="m-action" rows="2" placeholder="What must be done…"></textarea>
      </div>
      <div class="g2">
        <div class="field">
          <label>Due Date</label>
          <input id="m-due" type="date">
        </div>
        <div class="field">
          <label>Status</label>
          <select id="m-status">
            <option value="open">Open</option>
            <option value="in_progress">In Progress</option>
            <option value="resolved">Resolved</option>
            <option value="closed">Closed</option>
          </select>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="save()">Save</button>
    </div>
    <div style="padding:0 22px 14px"><span id="msg" style="font-size:13px;display:none"></span></div>
  </div>
</div>

<script>
let sb, rows = [], contracts = [];

const PRIORITY = {
  critical: ['b-bad',  'Critical'],
  high:     ['b-warn', 'High'],
  medium:   ['b-info', 'Medium'],
  low:      ['b-gray', 'Low'],
};
const STATUS_CA = {
  open:        ['b-bad',  'Open'],
  in_progress: ['b-warn', 'In Progress'],
  resolved:    ['b-ok',   'Resolved'],
  closed:      ['b-gray', 'Closed'],
};

async function init() {
  try {
    const auth = await guardPage();
    if (!auth) return;
    sb = auth.sb;

    const [caRes, cRes] = await Promise.all([
      sb.from('cnt_corrective_actions').select(`
        id,issue_description,required_action,priority,due_date,status,created_at,
        cnt_contracts(contract_id,title)
      `).order('created_at',{ascending:false}),
      sb.from('cnt_contracts').select('id,contract_id,title').order('contract_id')
    ]);

    rows = caRes.data ?? [];
    contracts = cRes.data ?? [];

    const sel = document.getElementById('m-contract');
    contracts.forEach(c => {
      const o = document.createElement('option');
      o.value = c.id; o.textContent = c.contract_id + ' — ' + c.title;
      sel.appendChild(o);
    });

    render();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  } catch(e) {
    document.getElementById('loading').innerHTML = `<div style="color:var(--bad);text-align:center;padding:40px">⚠️ ${e.message}</div>`;
  }
}

function render() {
  const fSt = document.getElementById('fStatus').value;
  const fPr = document.getElementById('fPriority').value;
  const data = rows.filter(r =>
    (!fSt || r.status === fSt) && (!fPr || r.priority === fPr)
  );
  const tbody = document.getElementById('tbody');
  if (!data.length) {
    tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state"><span class="e-icon">🔧</span><p>${rows.length ? 'No actions match the filters.' : 'No corrective actions yet.'}</p></div></td></tr>`;
    return;
  }
  tbody.innerHTML = data.map(r => {
    const [pCls, pLbl] = PRIORITY[r.priority] ?? ['b-gray', r.priority ?? '—'];
    const [sCls, sLbl] = STATUS_CA[r.status] ?? ['b-gray', r.status ?? '—'];
    const overdue = r.due_date && new Date(r.due_date) < new Date() && r.status !== 'resolved' && r.status !== 'closed';
    return `<tr>
      <td>
        <span class="ref">${r.cnt_contracts?.contract_id ?? '—'}</span>
        <div style="font-size:12px;color:var(--muted);margin-top:2px">${r.cnt_contracts?.title ?? ''}</div>
      </td>
      <td style="max-width:280px">
        <div style="font-size:13.5px;line-height:1.5">${r.issue_description ?? '—'}</div>
        ${r.required_action ? `<div style="font-size:12px;color:var(--muted);margin-top:3px">Action: ${r.required_action}</div>` : ''}
      </td>
      <td><span class="badge ${pCls}">${pLbl}</span></td>
      <td style="white-space:nowrap${overdue?';color:var(--bad);font-weight:600':''}">
        ${r.due_date ? fmtDate(r.due_date) : '—'}
        ${overdue ? '<br><span style="font-size:10px;background:#fee2e2;padding:1px 5px;border-radius:4px">OVERDUE</span>' : ''}
      </td>
      <td><span class="badge ${sCls}">${sLbl}</span></td>
      <td>
        <button class="btn btn-ghost btn-sm" onclick='editRow(${JSON.stringify(r).replace(/'/g,"&#39;")})'>Edit</button>
      </td>
    </tr>`;
  }).join('');
}

function openModal(data) {
  document.getElementById('modal-title').textContent = data ? 'Edit Corrective Action' : 'New Corrective Action';
  document.getElementById('m-id').value       = data?.id ?? '';
  document.getElementById('m-contract').value = data?.cnt_contracts ? (contracts.find(c => c.contract_id === data.cnt_contracts?.contract_id)?.id ?? '') : '';
  document.getElementById('m-issue').value    = data?.issue_description ?? '';
  document.getElementById('m-action').value   = data?.required_action ?? '';
  document.getElementById('m-priority').value = data?.priority ?? 'medium';
  document.getElementById('m-due').value      = data?.due_date ?? '';
  document.getElementById('m-status').value   = data?.status ?? 'open';
  document.getElementById('msg').style.display = 'none';
  document.getElementById('overlay').classList.add('open');
}
function editRow(r) { openModal(r); }
function closeModal() { document.getElementById('overlay').classList.remove('open'); }

async function save() {
  const contractId = document.getElementById('m-contract').value;
  const issue      = document.getElementById('m-issue').value.trim();
  if (!contractId || !issue) return showMsg('Contract and issue description required.', 'err');
  const id = document.getElementById('m-id').value;
  const payload = {
    cnt_contract_id: contractId,
    issue_description: issue,
    required_action: document.getElementById('m-action').value.trim() || null,
    priority: document.getElementById('m-priority').value,
    due_date: document.getElementById('m-due').value || null,
    status:   document.getElementById('m-status').value,
  };
  let error;
  if (id) {
    ({ error } = await sb.from('cnt_corrective_actions').update(payload).eq('id', id));
  } else {
    ({ error } = await sb.from('cnt_corrective_actions').insert(payload));
  }
  if (error) return showMsg('Error: ' + error.message, 'err');
  const { data } = await sb.from('cnt_corrective_actions').select(`
    id,issue_description,required_action,priority,due_date,status,created_at,
    cnt_contracts(contract_id,title)
  `).order('created_at',{ascending:false});
  rows = data ?? [];
  render(); closeModal();
}

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text; el.style.color = type === 'ok' ? 'var(--ok)' : 'var(--bad)';
  el.style.display = 'inline';
}
function fmtDate(iso) {
  return new Date(iso).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
}
init();
</script>
</body>
</html>
