<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>New Contract</title>
<script src="auth-contracts.js"></script>
<style>
:root{--primary:#1F3864;--accent:#2E75B6;--ok:#22c55e;--bad:#ef4444;--warn:#f59e0b;
--bg:#f8fafc;--card:#fff;--line:#e2e8f0;--muted:#64748b;--heading:#0f172a;
--th-bg:#f1f5f9;--th-fg:#374151;--shadow:0 1px 3px rgba(0,0,0,.08);--radius:8px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;font-size:14px;background:var(--bg);color:var(--heading);padding:20px}
h1{font-size:20px;font-weight:700;color:var(--primary);margin-bottom:4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:22px}
.card-panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:18px}
.section-title{font-size:13px;font-weight:700;color:var(--primary);text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:4px}
label{font-size:12px;font-weight:600;color:var(--th-fg)}
input,select,textarea{border:1px solid var(--line);border-radius:var(--radius);
  padding:8px 10px;font-size:14px;background:var(--card);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:var(--accent)}
input[readonly]{background:var(--th-bg);color:var(--muted)}
.req{color:var(--bad)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border:none;
  border-radius:var(--radius);font-size:14px;cursor:pointer;font-weight:600}
.btn-accent{background:var(--accent);color:#fff}
.btn-accent:hover{background:#1a5fa8}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn-ghost:hover{background:var(--th-bg)}
.footer{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.msg{padding:10px 14px;border-radius:var(--radius);font-size:13px;margin-bottom:14px}
.msg.err{background:#fee2e2;color:#991b1b}
.msg.ok{background:#dcfce7;color:#166534}
#loading{text-align:center;padding:60px;color:var(--muted)}
</style>
</head>
<body>
<div id="loading">Preparing form…</div>
<div id="app" style="display:none">
  <h1>New Contract</h1>
  <p class="sub">All fields marked <span class="req">*</span> are required.</p>
  <div id="msg" style="display:none" class="msg"></div>

  <div class="card-panel">
    <div class="section-title">Contract Identification</div>
    <div class="form-row">
      <div class="field">
        <label>Contract Reference <span class="req">*</span></label>
        <input id="contract_id" readonly placeholder="Auto-generated">
      </div>
      <div class="field">
        <label>Title <span class="req">*</span></label>
        <input id="title" type="text" placeholder="e.g. Road Rehabilitation Phase 2">
      </div>
    </div>
    <div class="form-row">
      <div class="field">
        <label>Government Agency <span class="req">*</span></label>
        <select id="agency_id"><option value="">— Select Agency —</option></select>
      </div>
      <div class="field">
        <label>Assigned Company <span class="req">*</span></label>
        <select id="assigned_company_id"><option value="">— Select Company —</option></select>
      </div>
    </div>
    <div class="form-row">
      <div class="field">
        <label>Classification</label>
        <select id="classification_id"><option value="">— Select Classification —</option></select>
      </div>
      <div class="field">
        <label>Branch</label>
        <select id="branch_id"><option value="">— Select Branch —</option></select>
      </div>
    </div>
    <div class="field" style="margin-bottom:14px">
      <label>Description</label>
      <textarea id="description" rows="3" placeholder="Brief description of the contract scope…"></textarea>
    </div>
  </div>

  <div class="card-panel">
    <div class="section-title">Dates</div>
    <div class="form-row-3">
      <div class="field">
        <label>Award Date</label>
        <input id="award_date" type="date">
      </div>
      <div class="field">
        <label>Start Date <span class="req">*</span></label>
        <input id="start_date" type="date">
      </div>
      <div class="field">
        <label>End Date <span class="req">*</span></label>
        <input id="end_date" type="date">
      </div>
    </div>
  </div>

  <div class="card-panel">
    <div class="section-title">Financial</div>
    <div class="form-row">
      <div class="field">
        <label>Contract Value (NGN) <span class="req">*</span></label>
        <input id="contract_value" type="number" min="0" step="0.01" placeholder="0.00">
      </div>
      <div class="field">
        <label>Retention Rate (%)</label>
        <input id="retention_rate" type="number" min="0" max="100" step="0.1" placeholder="e.g. 5">
      </div>
    </div>
  </div>

  <div class="card-panel">
    <div class="section-title">Initial Progress</div>
    <div class="form-row">
      <div class="field">
        <label>Physical Progress (%)</label>
        <input id="physical_progress" type="number" min="0" max="100" value="0">
      </div>
      <div class="field">
        <label>Financial Progress (%)</label>
        <input id="financial_progress" type="number" min="0" max="100" value="0">
      </div>
    </div>
    <div class="form-row">
      <div class="field">
        <label>Status</label>
        <select id="status">
          <option value="pipeline">Pipeline</option>
          <option value="awarded">Awarded</option>
          <option value="active" selected>Active</option>
        </select>
      </div>
    </div>
  </div>

  <div class="footer">
    <button class="btn btn-ghost" onclick="goBack()">Cancel</button>
    <button class="btn btn-accent" onclick="save()" id="btnSave">Save Contract</button>
  </div>
</div>

<script>
let sb, currentUser, orgId;

async function init() {
  const auth = await guardPage();
  if (!auth) return;
  sb = auth.sb;
  currentUser = auth.user;
  orgId = auth.profile.org_id;

  // Generate next contract ID
  const { data: seq } = await sb.rpc('next_cnt_id', {});
  document.getElementById('contract_id').value = seq ?? '';

  // Load dropdowns
  const [agencies, companies, classifications, branches] = await Promise.all([
    sb.from('cnt_agencies').select('id,name').eq('status','active').order('name'),
    sb.from('cnt_companies').select('id,name').eq('status','active').order('name'),
    sb.from('cnt_classifications').select('id,name').order('name'),
    sb.from('cnt_branches').select('id,name').eq('is_active',true).order('name')
  ]);

  populate('agency_id', agencies.data);
  populate('assigned_company_id', companies.data);
  populate('classification_id', classifications.data);
  populate('branch_id', branches.data);

  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = 'block';
}

function populate(id, rows) {
  const sel = document.getElementById(id);
  (rows ?? []).forEach(r => {
    const o = document.createElement('option');
    o.value = r.id; o.textContent = r.name;
    sel.appendChild(o);
  });
}

async function save() {
  const title = document.getElementById('title').value.trim();
  const agency = document.getElementById('agency_id').value;
  const company = document.getElementById('assigned_company_id').value;
  const start = document.getElementById('start_date').value;
  const end = document.getElementById('end_date').value;
  const value = document.getElementById('contract_value').value;

  if (!title || !agency || !company || !start || !end || !value) {
    showMsg('Please fill in all required fields.', 'err'); return;
  }
  if (new Date(end) <= new Date(start)) {
    showMsg('End date must be after start date.', 'err'); return;
  }

  const btn = document.getElementById('btnSave');
  btn.disabled = true; btn.textContent = 'Saving…';

  const payload = {
    contract_id: document.getElementById('contract_id').value,
    title,
    description: document.getElementById('description').value.trim() || null,
    org_id: orgId,
    agency_id: agency,
    assigned_company_id: company,
    classification_id: document.getElementById('classification_id').value || null,
    branch_id: document.getElementById('branch_id').value || null,
    award_date: document.getElementById('award_date').value || null,
    start_date: start,
    end_date: end,
    contract_value: parseFloat(value),
    retention_rate: parseFloat(document.getElementById('retention_rate').value) || null,
    physical_progress: parseInt(document.getElementById('physical_progress').value) || 0,
    financial_progress: parseInt(document.getElementById('financial_progress').value) || 0,
    status: document.getElementById('status').value,
    created_by: currentUser.id
  };

  const { data, error } = await sb.from('cnt_contracts').insert(payload).select('id').single();
  if (error) {
    showMsg('Error: ' + error.message, 'err');
    btn.disabled = false; btn.textContent = 'Save Contract';
    return;
  }

  if (window.parent?.navigate) {
    window.parent.navigate('contracts/contract-detail.html?id=' + data.id);
  } else {
    location.href = 'contract-detail.html?id=' + data.id;
  }
}

function showMsg(text, type) {
  const m = document.getElementById('msg');
  m.textContent = text; m.className = 'msg ' + type; m.style.display = 'block';
  m.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function goBack() {
  if (window.parent?.navigate) window.parent.navigate('contracts/contracts.html');
  else history.back();
}

init();
</script>
</body>
</html>
