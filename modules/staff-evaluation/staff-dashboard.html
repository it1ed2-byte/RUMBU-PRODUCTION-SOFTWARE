<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>My Performance Dashboard</title>
<link rel="stylesheet" href="../../styles.css">
<script>(function(){function apply(t){if(t)document.documentElement.setAttribute("data-theme",t);}window.addEventListener("message",function(e){if(e.data&&e.data.rumbuTheme)apply(e.data.rumbuTheme);});try{apply(localStorage.getItem("rumbu_theme"));}catch(e){}})();</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../auth.js"></script>
<script src="../../table-resolver.js"></script>
<style>
:root{--navy:var(--heading);--blue:var(--accent);--blue-dark:var(--accent-2);--muted:#6b7280;--red:#c0392b;--green:#1d8a4e;--amber:#d97706;--teal:#0f766e;--purple:#7c3aed;}
*{box-sizing:border-box;}
body{font-family:var(--sans);background:var(--bg);margin:0;padding:18px;color:var(--text);}
.wrap{max-width:1100px;margin:0 auto;}
#connStatus{font-size:12px;font-weight:700;text-align:center;margin-bottom:10px;}
.page-head{border-radius:14px;padding:20px 22px;margin-bottom:16px;color:#fff;background:linear-gradient(130deg,#1F3864 0%,#2E75B6 100%);}
.page-head h2{margin:0 0 4px;font-size:18px;font-weight:800;color:#fff;}
.page-head p{margin:0;font-size:12px;opacity:.88;color:#fff;}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;}
.card h3{color:var(--navy);margin:0 0 14px;font-size:14px;font-weight:800;}
label{display:block;font-size:12px;font-weight:700;color:var(--text);margin:0 0 4px;}
input,select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;background:var(--card);color:var(--text);}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
.row>div{flex:1;min-width:130px;}
button{padding:9px 16px;border:none;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;background:var(--blue);color:#fff;}
button:hover{background:var(--blue-dark);}
.quickbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.qbtn{background:var(--bg);color:var(--navy);padding:6px 12px;border:1px solid var(--line);border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;}
.qbtn.active{background:var(--blue);color:#fff;border-color:var(--blue);}
.status{margin-top:8px;font-weight:700;font-size:13px;min-height:14px;}
.status.err{color:var(--red);}.status.ok{color:var(--green);}
/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:0;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;}
.kpi .n{font-size:26px;font-weight:800;color:var(--navy);line-height:1.1;}
.kpi .l{font-size:11px;color:var(--muted);margin-top:4px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
.kpi .subv{font-size:11px;color:var(--muted);margin-top:2px;}
.kpi.good .n{color:var(--green);}.kpi.warn .n{color:var(--amber);}
.kpi.bad  .n{color:var(--red);} .kpi.teal .n{color:var(--teal);}
.kpi.purple .n{color:var(--purple);}.kpi.blue .n{color:var(--blue);}
/* charts */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;}
.bar-row{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px;}
.bar-row .lbl{width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bar-row .track{flex:1;background:#eef2f7;border-radius:6px;height:16px;overflow:hidden;}
.bar-row .fill{height:100%;background:var(--blue);}
.bar-row .fill.a{background:var(--green);}.bar-row .fill.b{background:var(--amber);}
.bar-row .fill.c{background:var(--red);}.bar-row .fill.t{background:#94a3b8;}.bar-row .fill.teal{background:var(--teal);}
.bar-row .val{width:70px;text-align:right;font-weight:700;color:var(--navy);font-size:12px;}
svg{width:100%;height:auto;display:block;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin-top:8px;}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.dot{width:11px;height:11px;border-radius:3px;display:inline-block;}
.rank-badge{display:inline-flex;align-items:center;gap:8px;background:var(--bg);border:1.5px solid var(--line);border-radius:24px;padding:8px 16px;font-size:13px;font-weight:700;color:var(--navy);margin-bottom:14px;}
.rank-badge .rank-num{font-size:22px;font-weight:900;color:var(--blue);}
.section-label{font-size:12px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.5px;margin:18px 0 10px;border-bottom:2px solid var(--line);padding-bottom:6px;}
</style>
</head>
<body>
<div class="wrap">
<div id="connStatus">Loading...</div>

<div id="notLinked" style="display:none;" class="card">
  <p id="notLinkedMsg" style="color:var(--red);font-weight:700;"></p>
</div>

<div id="appArea" style="display:none;">
  <div class="page-head" id="pageHead"></div>

  <div class="card">
    <div class="quickbar">
      <button class="qbtn" onclick="setRange('week',this)">This Week</button>
      <button class="qbtn active" onclick="setRange('month',this)">This Month</button>
      <button class="qbtn" onclick="setRange('quarter',this)">Last 3 Months</button>
      <button class="qbtn" onclick="setRange('year',this)">This Year</button>
    </div>
    <div class="row">
      <div><label>From</label><input type="date" id="fromDate"></div>
      <div><label>To</label><input type="date" id="toDate"></div>
      <div><label>Shift</label><select id="shift"><option value="All">All Shifts</option><option>Morning</option><option>Night</option></select></div>
      <div style="flex:0 0 auto;"><label>&nbsp;</label><button onclick="runDashboard()">▶ Refresh</button></div>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div id="dash" style="display:none;">
    <div id="peerRank"></div>

    <!-- Production KPIs -->
    <div class="section-label">📦 Production Output</div>
    <div class="kpis" id="prodKpis" style="margin-bottom:16px;"></div>

    <!-- Attendance -->
    <div class="card">
      <h3>📅 Attendance — Monday to Saturday</h3>
      <div class="kpis" id="attKpis"></div>
    </div>

    <!-- Downtime / MLD / ATG / MLU / Efficiency -->
    <div class="card">
      <h3>⚙ Machine & Efficiency Metrics</h3>
      <div class="kpis" id="metricsKpis"></div>
    </div>

    <!-- Charts -->
    <div class="grid2">
      <div class="card"><h3>Grade Distribution</h3><div id="chartGrade"></div></div>
      <div class="card"><h3>Morning vs Night</h3><div id="chartShift"></div></div>
      <div class="card"><h3>Production by Asset</h3><div id="chartAssets"></div></div>
      <div class="card"><h3>Production by Shed</h3><div id="chartSheds"></div></div>
      <div class="card"><h3>Production by Mat Type</h3><div id="chartMat"></div></div>
    </div>
    <div class="card"><h3>📈 Daily Production Trend</h3><div id="chartTrend"></div></div>
  </div>
</div>
</div>

<script>
const WORK_MINUTES = 660;
const HOLIDAY_TYPES = new Set(["Overtime","overtime","Cover duty","cover duty","COVER DUTY","Mixed","mixed","MIXED"]);
const OT_TYPES = new Set(["Overtime","overtime","OVERTIME"]);
const COVER_TYPES = new Set(["Cover duty","cover duty","COVER DUTY"]);

let ME=null, MY_EMP_ID=null, MW_TABLE="mat_weaving";
let EXCLUDED_JOB_CODES=new Set();

function n(v){const x=parseFloat(v);return isNaN(x)?0:x;}
function fmt(v){return Math.round(v).toLocaleString();}
function iso(d){return d.toISOString().slice(0,10);}
function authHeaders(){return{"apikey":SUPABASE_ANON_KEY,"Authorization":"Bearer "+SUPABASE_ANON_KEY};}
function sumBy(rows,kFn,vFn){const m={};rows.forEach(r=>{const k=kFn(r);if(!k)return;m[k]=(m[k]||0)+vFn(r);});return m;}
function parseDT(v){const d=new Date(v);return isNaN(d)?null:d;}
function minutesBetween(a,b){return(!a||!b)?0:Math.max(0,Math.round((b-a)/60000));}
function normalizeCtrl(r){
  if(r.date_col===undefined)r.date_col=r.date;
  if(r.stop_time===undefined)r.stop_time=r.mc_stoppage_time;
  if(r.finish_time===undefined)r.finish_time=r.extimated_time||r.estimated_duration;
  return r;
}

/* Generate every Monday–Saturday between two ISO date strings */
function getMonSatDates(from, to){
  const days=[], cur=new Date(from), end=new Date(to);
  while(cur<=end){
    const dow=cur.getDay(); // 0=Sun,6=Sat
    if(dow>=1&&dow<=6) days.push(cur.toISOString().slice(0,10));
    cur.setDate(cur.getDate()+1);
  }
  return days;
}

async function fetchPaged(table, selectFields, extraClause, orderClause){
  let all=[], offset=0;
  const base=SUPABASE_URL+"/rest/v1/"+table+"?select="+selectFields+extraClause+(orderClause||"");
  for(let g=0;g<500;g++){
    const res=await fetch(base,{headers:Object.assign({},authHeaders(),
      {"Range-Unit":"items","Range":offset+"-"+(offset+999)})});
    if(!res.ok)throw new Error(table+": HTTP "+res.status);
    const batch=await res.json();
    all=all.concat(batch);
    if(batch.length<1000)break;
    offset+=1000;
  }
  return all;
}

async function init(){
  const cs=document.getElementById("connStatus");
  try{
    ME=await requireAuth("../../login.html");
    if(!ME)return;

    cs.textContent="Resolving table...";
    MW_TABLE=await resolveWeavingTable();

    cs.textContent="Loading your profile...";
    // Find employee by linked_profile_id ONLY — no chained .or() to avoid maybeSingle() silent null
    const{data:emp,error:empErr}=await sb.from("employees")
      .select("employee_id,full_name,department,unit,rank")
      .eq("linked_profile_id",ME.id)
      .maybeSingle();

    if(empErr) throw new Error("Profile lookup: "+empErr.message);
    if(!emp||!emp.employee_id){
      document.getElementById("notLinkedMsg").textContent=
        `⚠ Your account (${ME.username}) is not linked to an employee record. Contact HR to link your account.`;
      document.getElementById("notLinked").style.display="block";
      cs.style.color="var(--red)"; cs.textContent="Account not linked.";
      return;
    }

    MY_EMP_ID=emp.employee_id;
    document.getElementById("pageHead").innerHTML=
      `<h2>📈 My Performance Dashboard</h2>`+
      `<p>👤 ${emp.full_name||ME.username} &nbsp;·&nbsp; ID: ${emp.employee_id}`+
      `${emp.department?" &nbsp;·&nbsp; "+emp.department:""}${emp.unit?"/"+emp.unit:""}${emp.rank?" &nbsp;·&nbsp; "+emp.rank:""}</p>`;

    // Load excluded job codes (non-fatal)
    try{
      const jr=await fetch(SUPABASE_URL+"/rest/v1/job_table?select=job_code",{headers:authHeaders()});
      if(jr.ok){const j=await jr.json();EXCLUDED_JOB_CODES=new Set(j.map(r=>r.job_code));}
    }catch(e){}

    setRange("month",document.querySelector(".qbtn.active"));
    cs.style.color="var(--green)"; cs.textContent="Connected — "+emp.full_name;
    document.getElementById("appArea").style.display="block";

    // Auto-run immediately — no click needed
    await runDashboard();
  }catch(e){
    document.getElementById("connStatus").style.color="var(--red)";
    document.getElementById("connStatus").textContent="❌ "+e.message;
    console.error("Staff dashboard init:", e);
  }
}

function setRange(range,btn){
  document.querySelectorAll(".qbtn").forEach(b=>b.classList.remove("active"));
  if(btn)btn.classList.add("active");
  const t=new Date(); let from;
  if(range==="week"){const d=(t.getDay()+6)%7;from=new Date(t);from.setDate(t.getDate()-d);}
  else if(range==="month"){from=new Date(t.getFullYear(),t.getMonth(),1);}
  else if(range==="quarter"){from=new Date(t);from.setMonth(t.getMonth()-3);}
  else if(range==="year"){from=new Date(t.getFullYear(),0,1);}
  else return;
  document.getElementById("fromDate").value=iso(from);
  document.getElementById("toDate").value=iso(t);
}

async function runDashboard(){
  const status=document.getElementById("status");
  const from=document.getElementById("fromDate").value;
  const to=document.getElementById("toDate").value;
  const shift=document.getElementById("shift").value;
  if(!from||!to){status.className="status err";status.textContent="Select a date range.";return;}

  status.className="status"; status.textContent="Loading production data...";
  try{
    const dateClause="&date_col=gte."+from+"&date_col=lte."+to;

    // Fetch in parallel: my rows, all-date rows (attendance+peer), control rows, query count
    const [myRows, allDateRows, ctrlRows, qRes] = await Promise.all([
      fetchPaged(MW_TABLE,
        "date_col,shift,work_type,mat_type,assets,shed,a_double,a_single,b,c,total,target,operator_id,operator_name",
        dateClause+"&operator_id=eq."+encodeURIComponent(MY_EMP_ID),
        "&order=date_col.asc"),
      fetchPaged(MW_TABLE,
        "date_col,work_type,operator_id,total,target",
        dateClause,
        "&order=date_col.asc"),
      fetchPaged("control",
        "*",
        "&date=gte."+from+"&date=lte."+to,
        ""),   /* control table uses 'date' not 'date_col' — no order needed */
      sb.from("hr_queries").select("id",{count:"exact",head:true}).eq("employee_id",MY_EMP_ID)
    ]);

    ctrlRows.forEach(normalizeCtrl);
    const queryCount = qRes.count || 0;

    // Apply shift filter to my rows
    const filteredMy = shift==="All" ? myRows : myRows.filter(r=>r.shift===shift);

    status.className="status ok"; status.textContent="";

    if(!filteredMy.length){
      document.getElementById("dash").style.display="none";
      status.textContent="No production records found for this period.";
      return;
    }

    document.getElementById("dash").style.display="block";

    // Render all sections
    renderPeerRank(filteredMy, shift==="All"?allDateRows:allDateRows.filter(r=>r.shift===shift));
    renderProdKpis(filteredMy, queryCount);
    renderAttendance(from, to, filteredMy, allDateRows);
    renderMetrics(filteredMy, ctrlRows);
    renderCharts(filteredMy);

  }catch(e){
    status.className="status err";
    status.textContent="❌ "+e.message;
    console.error("Staff dashboard run:", e);
  }
}

/* ─── PEER RANK ─────────────────────────────────────── */
function renderPeerRank(myRows, allRows){
  const opMap={};
  allRows.forEach(r=>{
    if(!r.operator_id)return;
    if(!opMap[r.operator_id])opMap[r.operator_id]={tot:0,tg:0};
    opMap[r.operator_id].tot+=n(r.total);
    opMap[r.operator_id].tg+=n(r.target);
  });
  const me=opMap[MY_EMP_ID];
  const ranked=Object.entries(opMap)
    .filter(([,v])=>v.tg>0)
    .map(([k,v])=>({id:k,e:v.tot/v.tg*100}))
    .sort((a,b)=>b.e-a.e);
  const pos=ranked.findIndex(o=>o.id===MY_EMP_ID)+1;
  const total=ranked.length;
  const myEff=me&&me.tg?((me.tot/me.tg)*100).toFixed(1):"—";
  const medal=pos===1?"🥇":pos===2?"🥈":pos===3?"🥉":"";
  document.getElementById("peerRank").innerHTML=total>1
    ?`<div class="rank-badge">${medal} <span class="rank-num">${pos}</span> of ${total} operators &nbsp;·&nbsp; Overall Efficiency: <span style="color:var(--teal);">${myEff}%</span></div>`
    :"";
}

/* ─── PRODUCTION KPIs ───────────────────────────────── */
function renderProdKpis(rows, queryCount){
  let tot=0,ad=0,as=0,b=0,c=0,tg=0;
  rows.forEach(r=>{tot+=n(r.total);ad+=n(r.a_double);as+=n(r.a_single);b+=n(r.b);c+=n(r.c);tg+=n(r.target);});
  const a=ad+as;
  const pA=tot?Math.round(a/tot*100):0;
  const pB=tot?Math.round(b/tot*100):0;
  const tiles=[
    {n:fmt(tot),   l:"Total Mats"},
    {n:fmt(a),     l:"A Grade",    cls:"good",sub:`Dbl ${fmt(ad)} · Sgl ${fmt(as)}`},
    {n:pA+"%",     l:"%A (A/Total)",cls:"good"},
    {n:fmt(b),     l:"B Grade",    cls:"warn"},
    {n:pB+"%",     l:"%B (B/Total)",cls:"warn"},
    {n:fmt(c),     l:"C Grade"},
    {n:fmt(tg),    l:"Target"},
    {n:queryCount, l:"Total Queries",cls:queryCount>0?"bad":"good"}
  ];
  document.getElementById("prodKpis").innerHTML=tiles.map(k=>
    `<div class="kpi ${k.cls||''}"><div class="n">${k.n}</div><div class="l">${k.l}</div>${k.sub?`<div class="subv">${k.sub}</div>`:""}</div>`
  ).join("");
}

/* ─── ATTENDANCE ────────────────────────────────────── */
function renderAttendance(from, to, myRows, allRows){
  const scheduledDays = getMonSatDates(from, to);

  // My dates → Set
  const myDates = new Set(myRows.map(r=>r.date_col));

  // My overtime and cover duty dates
  const myOtDates  = new Set(myRows.filter(r=>OT_TYPES.has(r.work_type||"")).map(r=>r.date_col));
  const myCovDates = new Set(myRows.filter(r=>COVER_TYPES.has(r.work_type||"")).map(r=>r.date_col));

  // All rows grouped by date for absence classification
  const dateWorkTypes={};
  allRows.forEach(r=>{
    if(!dateWorkTypes[r.date_col])dateWorkTypes[r.date_col]=[];
    dateWorkTypes[r.date_col].push(r.work_type||"Normal");
  });

  let present=0, absent=0, holiday=0;
  scheduledDays.forEach(d=>{
    if(myDates.has(d)){
      present++;
    } else {
      const dayTypes = dateWorkTypes[d];
      if(!dayTypes||!dayTypes.length){
        // No production at all that day — plant closed/holiday
        holiday++;
      } else if(dayTypes.some(wt=>HOLIDAY_TYPES.has(wt))){
        // Work was Overtime/Cover/Mixed that day
        holiday++;
      } else {
        absent++;
      }
    }
  });

  const tiles=[
    {n:scheduledDays.length, l:"Scheduled Days (Mon–Sat)", cls:"blue"},
    {n:present,              l:"Days Present",             cls:"good"},
    {n:absent,               l:"Days Absent",              cls:absent>0?"bad":"good"},
    {n:holiday,              l:"Holidays / Off Days",      cls:"teal"},
    {n:myOtDates.size,       l:"Overtime Days",            cls:"warn"},
    {n:myCovDates.size,      l:"Cover Duty Days",          cls:"purple"}
  ];
  document.getElementById("attKpis").innerHTML=tiles.map(k=>
    `<div class="kpi ${k.cls||''}"><div class="n">${k.n}</div><div class="l">${k.l}</div></div>`
  ).join("");
}

/* ─── MACHINE METRICS (MLD / ATG / MLU / Efficiency) ── */
function renderMetrics(myRows, ctrlRows){
  // Build downtime map from control table (my assets only)
  const myAssets=new Set(myRows.map(r=>r.assets).filter(Boolean));
  const downtimeMap={};
  ctrlRows.forEach(r=>{
    if(!myAssets.has(r.assets))return;
    if(EXCLUDED_JOB_CODES.has(r.job_code))return;
    const stop=parseDT(r.stop_time), finish=parseDT(r.finish_time);
    if(!stop||!finish)return;
    const key=[r.assets,r.date_col,r.shift].join("||");
    downtimeMap[key]=(downtimeMap[key]||0)+minutesBetween(stop,finish);
  });

  // Accumulate per operator (single operator so one pass)
  let A=0,B=0,C=0,total=0,target=0,downtime=0;
  const mcWork=new Set(), mcCover=new Set();

  myRows.forEach(r=>{
    A+=n(r.a_double)+n(r.a_single);
    B+=n(r.b); C+=n(r.c);
    total+=n(r.total); target+=n(r.target);
    const wk=r.assets+"||"+r.date_col;
    if(COVER_TYPES.has(r.work_type||"")){
      mcCover.add(wk);
    } else {
      mcWork.add(wk);
      const dkey=[r.assets,r.date_col,r.shift].join("||");
      downtime+=(downtimeMap[dkey]||0);
    }
  });

  const mc=mcWork.size||1;
  const MLD  = target ? Math.round((target*downtime)/(WORK_MINUTES*mc)) : 0;
  const ATG  = Math.round(target-MLD);
  const MLU  = Math.round(A-ATG);
  const eff  = ATG ? (total/ATG*100) : 0;

  const tiles=[
    {n:Math.round(downtime)+" min", l:"Total Downtime"},
    {n:fmt(MLD),                    l:"MLD"},
    {n:fmt(ATG),                    l:"ATG (Adj. Target)",  cls:"teal"},
    {n:fmt(MLU),                    l:"MLU",                cls:MLU>=0?"warn":"good"},
    {n:eff.toFixed(1)+"%",          l:"Efficiency (T/ATG)", cls:eff>=90?"good":eff>=75?"teal":"warn"}
  ];
  document.getElementById("metricsKpis").innerHTML=tiles.map(k=>
    `<div class="kpi ${k.cls||''}"><div class="n">${k.n}</div><div class="l">${k.l}</div></div>`
  ).join("");
}

/* ─── CHARTS ────────────────────────────────────────── */
function hbars(id,entries,cls){
  const w=document.getElementById(id);
  if(!entries||!entries.length){w.innerHTML="<p style='color:var(--muted);font-size:13px;'>No data.</p>";return;}
  const max=Math.max(...entries.map(e=>e[1]))||1;
  w.innerHTML=entries.map(([label,val,extra])=>{
    const pct=Math.round(val/max*100);
    return`<div class="bar-row"><div class="lbl" title="${label}">${label}</div>`+
      `<div class="track"><div class="fill ${cls||''}" style="width:${pct}%"></div></div>`+
      `<div class="val">${extra||fmt(val)}</div></div>`;
  }).join("");
}

function renderCharts(rows){
  let tot=0,ad=0,as=0,b=0,c=0,tg=0;
  rows.forEach(r=>{tot+=n(r.total);ad+=n(r.a_double);as+=n(r.a_single);b+=n(r.b);c+=n(r.c);tg+=n(r.target);});
  hbars("chartGrade",[["A Grade",ad+as],["B Grade",b],["C Grade",c],["Target",tg]]);
  document.querySelectorAll("#chartGrade .fill").forEach((f,i)=>f.classList.add(["a","b","c","t"][i]||""));
  hbars("chartShift",Object.entries(sumBy(rows,r=>r.shift,r=>n(r.total))).sort((a,b)=>b[1]-a[1]),"teal");
  hbars("chartAssets",Object.entries(sumBy(rows,r=>r.assets,r=>n(r.total))).sort((a,b)=>b[1]-a[1]).slice(0,8));
  hbars("chartSheds",Object.entries(sumBy(rows,r=>r.shed,r=>n(r.total))).sort((a,b)=>b[1]-a[1]).slice(0,8));
  hbars("chartMat",Object.entries(sumBy(rows,r=>r.mat_type,r=>n(r.total))).sort((a,b)=>b[1]-a[1]));
  // Daily trend
  const dayMap=sumBy(rows,r=>r.date_col,r=>n(r.total));
  lineChart(Object.entries(dayMap).sort((a,b)=>a[0]<b[0]?-1:1));
}

function lineChart(series){
  const w=document.getElementById("chartTrend");
  if(!series.length){w.innerHTML="<p style='color:var(--muted);font-size:13px;'>No data.</p>";return;}
  const W=1000,H=230,pad=40;
  const xs=series.map((_,i)=>pad+i*((W-2*pad)/Math.max(1,series.length-1)));
  const maxV=Math.max(...series.map(s=>s[1]))||1;
  const ys=series.map(s=>H-pad-(s[1]/maxV)*(H-2*pad));
  let path=""; xs.forEach((x,i)=>{path+=(i===0?"M":"L")+x.toFixed(1)+" "+ys[i].toFixed(1)+" ";});
  const step=Math.max(1,Math.floor(series.length/8));
  let labels="";
  for(let i=0;i<series.length;i+=step)
    labels+=`<text x="${xs[i].toFixed(1)}" y="${H-pad+16}" font-size="10" fill="#6b7280" text-anchor="middle">${series[i][0].slice(5)}</text>`;
  const area=`M ${xs[0].toFixed(1)} ${H-pad} `+series.map((s,i)=>`L ${xs[i].toFixed(1)} ${ys[i].toFixed(1)}`).join(" ")+` L ${xs[xs.length-1].toFixed(1)} ${H-pad} Z`;
  w.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="${pad}" y1="${pad}" x2="${pad}" y2="${H-pad}" stroke="#cbd5e1" stroke-width="1"/>
    <path d="${area}" fill="#059669" opacity="0.10"/>
    <path d="${path}" fill="none" stroke="#059669" stroke-width="2.5"/>
    ${xs.map((x,i)=>`<circle cx="${x.toFixed(1)}" cy="${ys[i].toFixed(1)}" r="3" fill="#065f46"/>`).join("")}
    <text x="${pad-6}" y="${pad}" font-size="10" fill="#6b7280" text-anchor="end">${fmt(maxV)}</text>
    <text x="${pad-6}" y="${H-pad}" font-size="10" fill="#6b7280" text-anchor="end">0</text>
    ${labels}
  </svg>
  <div class="legend"><span><span class="dot" style="background:#059669"></span>Total mats per day</span></div>`;
}

init();
</script>
</body>
</html>
