<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>My Asset Report</title>
<link rel="stylesheet" href="../../styles.css">
<script>(function(){function apply(t){if(t)document.documentElement.setAttribute("data-theme",t);}window.addEventListener("message",function(e){if(e.data&&e.data.rumbuTheme)apply(e.data.rumbuTheme);});try{apply(localStorage.getItem("rumbu_theme"));}catch(e){}})();</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../auth.js"></script>
<script src="../../table-resolver.js"></script>
<style>
:root{--navy:var(--heading);--blue:var(--accent);--blue-dark:var(--accent-2);--muted:#6b7280;--red:#c0392b;--green:#1d8a4e;--amber:#d97706;}
*{box-sizing:border-box;}
body{font-family:var(--sans);background:var(--bg);margin:0;padding:18px;color:var(--text);}
.wrap{max-width:1250px;margin:0 auto;}
.page-head{background:linear-gradient(130deg,#064e3b 0%,#059669 100%);border-radius:14px;padding:18px 22px;margin-bottom:16px;color:#fff;}
.page-head h2{margin:0 0 3px;font-size:18px;font-weight:800;color:#fff;}
.page-head p{margin:0;font-size:12px;opacity:.88;color:#fff;}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px;}
.card h3{color:var(--navy);margin:0 0 12px;font-size:14px;font-weight:800;}
label{display:block;font-size:12px;font-weight:700;margin-bottom:4px;}
input,select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;background:var(--card);color:var(--text);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;}
.quickbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.qbtn{background:var(--bg);color:var(--navy);padding:6px 12px;border:1px solid var(--line);border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;}
.qbtn.active{background:var(--blue);color:#fff;border-color:var(--blue);}
.btn-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
button{padding:10px 18px;border:none;border-radius:8px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer;font-size:13px;}
button:hover{background:var(--blue-dark);}
button:disabled{opacity:.55;cursor:wait;}
button.alt{background:var(--green);}
#status{margin-top:10px;font-size:13px;font-weight:700;min-height:16px;}
#status.ok{color:var(--green);}#status.err{color:var(--red);}
#connStatus{font-size:12px;font-weight:700;text-align:center;margin-bottom:10px;}
.table-scroll{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px;}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:center;white-space:nowrap;}
th{background:var(--navy);color:#fff;font-size:11px;}
td.left{text-align:left;white-space:normal;}
.colorHigh{background:#d9ead3;color:#1a4731;}.colorMedium{background:#fce5cd;}.colorLow{background:#f4cccc;}
.note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.6;}
.shed-box{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);}
.shed-box label{display:flex;align-items:center;gap:5px;font-weight:500;font-size:13px;margin:0;cursor:pointer;}
.shed-box input[type="checkbox"]{width:auto;padding:0;}
.op-card{background:var(--bg);border:1.5px solid var(--blue);border-radius:10px;padding:12px 16px;margin-bottom:14px;}
.op-card .name{font-size:16px;font-weight:800;color:var(--navy);}
.op-card .meta{font-size:12px;color:var(--muted);margin-top:2px;}
.reward-big{font-weight:800;color:var(--green);}
#printHeader{display:none;}

/* ───── Print: A4 landscape, 9pt table cells, filters hidden ───── */
@media print{
  @page{size:A4 landscape;margin:12mm;}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  body{padding:0;background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;}
  .no-print,.page-head,#connStatus,.op-card,#status{display:none !important;}
  #printHeader{display:block !important;margin-bottom:10px;}
  #printHeader .ph-top{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #1F3864;padding-bottom:4px;}
  #printHeader .ph-co{font-size:8pt;font-weight:700;color:#1F3864;letter-spacing:.5px;}
  #printHeader .ph-title{font-size:8pt;color:#1F3864;}
  #printHeader h1{font-size:16pt;color:#1F3864;margin:8px 0 2px;}
  #printHeader .ph-line{font-size:10pt;margin:1px 0;}
  .card{border:none;padding:0;margin-bottom:8px;background:#fff;}
  .card h3,h4{color:#1F3864;font-size:11pt;}
  .table-scroll{overflow:visible;}
  table{font-size:9pt;}
  th,td{padding:3px 4px;border-color:#888;}
  th{background:#1F3864 !important;color:#fff !important;}
  tr{page-break-inside:avoid;}
  .note{color:#333;font-size:8pt;}
}
</style>
</head>
<body>
<div class="wrap">
<div id="connStatus">Loading...</div>

<div class="page-head no-print">
  <h2>📋 My Asset Report</h2>
  <p>Your personal production record: output, downtime, efficiency and reward eligibility.</p>
</div>

<div id="notLinked" style="display:none;" class="card">
  <p id="notLinkedMsg" style="color:var(--red);font-weight:700;margin:0 0 6px;"></p>
  <p style="font-size:13px;color:var(--muted);margin:0;">Once HR links your login to your employee record, this page will show your own production data.</p>
</div>

<!-- Appears on the printed page only -->
<div id="printHeader">
  <div class="ph-top"><span class="ph-co">RUMBU INDUSTRIES GROUP</span><span class="ph-title">My Asset Report</span></div>
  <h1 id="ph_name"></h1>
  <div class="ph-line" id="ph_line1"></div>
  <div class="ph-line" id="ph_line2"></div>
</div>

<div id="appArea" style="display:none;">
  <div class="op-card no-print" id="opCard"></div>

  <div class="card no-print">
    <h3>Filters</h3>
    <div class="quickbar" id="quickbar">
      <button class="qbtn" onclick="setRange('week',this)">This Week</button>
      <button class="qbtn active" onclick="setRange('month',this)">This Month</button>
      <button class="qbtn" onclick="setRange('lastmonth',this)">Last Month</button>
      <button class="qbtn" onclick="setRange('quarter',this)">Last 3 Months</button>
      <button class="qbtn" onclick="setRange('year',this)">This Year</button>
    </div>
    <div class="grid">
      <div><label>From Date</label><input type="date" id="fromDate" name="date_from"></div>
      <div><label>To Date</label><input type="date" id="toDate" name="date_to"></div>
      <div><label>Shift</label><select id="shiftFilter"><option value="All">All Shifts</option><option>Morning</option><option>Night</option></select></div>
    </div>
    <div style="margin-top:12px;">
      <label>Shed <span style="font-weight:400;color:var(--muted);">(leave all unticked for every shed)</span>
        <a href="#" onclick="clearSheds();return false;" style="margin-left:8px;font-weight:400;">Clear</a></label>
      <div id="shedContainer" class="shed-box"><span class="note">Loading sheds…</span></div>
    </div>
    <div class="btn-row">
      <button id="genBtn" onclick="generate()">▶ Generate Report</button>
      <button class="alt" onclick="window.print()">🖨 Print / Save as PDF</button>
    </div>
    <div id="status"></div>
  </div>

  <div id="reportArea"></div>
</div>
</div>

<script>
/*==PURE-START==*/
/* DOM-free: unit-tested. Rules below are fixed so a printed report cannot be altered by the operator. */
const RULES={workMinutes:660,minPercentA:93,minWorkDays:5,rewardLow:2500,rewardHigh:5000,highMats:["No.2","No.3","No.4"]};

function n(v){const x=parseFloat(v);return isNaN(x)?0:x;}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function parseDT(v){const d=new Date(v);return isNaN(d)?null:d;}
function minutesBetween(a,b){return(!a||!b)?0:Math.max(0,Math.round((b-a)/60000));}
function normalizeCtrl(r){
  if(r.date_col===undefined)r.date_col=r.date;
  if(r.stop_time===undefined)r.stop_time=r.mc_stoppage_time;
  if(r.finish_time===undefined)r.finish_time=r.extimated_time||r.estimated_duration;
  return r;
}
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function dmy(s){const p=String(s).split("-");return p.length===3?(p[2]+" "+MONTHS[Number(p[1])-1]+" "+p[0]):String(s);}   // DD MMM YYYY

/* downtime minutes keyed by asset||date||shift, excluding configured job codes */
function buildDowntimeMap(ctrlRows,from,to,excluded){
  const m={};
  ctrlRows.forEach(r=>{
    if(r.date_col<from||r.date_col>to)return;
    if(excluded.has(r.job_code))return;
    const s=parseDT(r.stop_time),f=parseDT(r.finish_time);
    if(!s||!f)return;
    const k=[r.assets,r.date_col,r.shift].join("||");
    m[k]=(m[k]||0)+minutesBetween(s,f);
  });
  return m;
}

/* Same formulae as operator-report.html, applied to one operator's rows.
   %A, %B, %C are shares of Total; %P is Total / ATG. */
function computeOperatorMetrics(rows,downtimeMap,rules){
  const o={dates:new Set(),mats:new Set(),mcWork:new Set(),mcCover:new Set(),A:0,B:0,C:0,total:0,target:0,downtime:0};
  rows.forEach(r=>{
    o.dates.add(r.date_col);
    if(r.mat_type)o.mats.add(r.mat_type);
    const wk=r.assets+"||"+r.date_col;
    const cover=(r.work_type||"")==="Cover duty";
    if(cover)o.mcCover.add(wk);else o.mcWork.add(wk);
    o.A+=n(r.a_double)+n(r.a_single);o.B+=n(r.b);o.C+=n(r.c);o.total+=n(r.total);o.target+=n(r.target);
    if(!cover)o.downtime+=downtimeMap[[r.assets,r.date_col,r.shift].join("||")]||0;
  });
  const workDays=o.dates.size, mcWork=o.mcWork.size;
  const MLD=o.target?Math.round((o.target*o.downtime)/(rules.workMinutes*(mcWork||1))):0;
  const ATG=Math.round(o.target-MLD);
  const MLU=Math.round(o.A-ATG);
  const pA=o.total?Math.round(o.A/o.total*100):0;
  const pB=o.total?Math.round(o.B/o.total*100):0;
  const pC=o.total?Math.round(o.C/o.total*100):0;
  const pP=ATG?Math.round(o.total/ATG*100):0;
  const mats=[...o.mats];
  const onlyHigh=mats.length>0&&mats.every(m=>rules.highMats.includes(m));
  let reward=0;
  if(workDays>=rules.minWorkDays&&pA>=rules.minPercentA)reward=onlyHigh?rules.rewardHigh:rules.rewardLow;
  return {workDays,mcWork,mcCover:o.mcCover.size,A:Math.round(o.A),B:Math.round(o.B),C:Math.round(o.C),
    total:Math.round(o.total),target:Math.round(o.target),down:Math.round(o.downtime),MLD,ATG,MLU,pA,pB,pC,pP,reward,onlyHigh};
}
/*==PURE-END==*/

const $=id=>document.getElementById(id);
const esc=v=>String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function authHeaders(){return{"apikey":SUPABASE_ANON_KEY,"Authorization":"Bearer "+SUPABASE_ANON_KEY};}
function shedLabel(v){return /^\d+$/.test(v)?"Shed "+v:v;}
function shedSort(a,b){const x=Number(a),y=Number(b),ix=!isNaN(x),iy=!isNaN(y);return ix&&iy?x-y:(ix?-1:(iy?1:a.localeCompare(b)));}
function checkedSheds(){return Array.from(document.querySelectorAll("#shedContainer input:checked")).map(cb=>cb.value);}
function clearSheds(){document.querySelectorAll("#shedContainer input").forEach(cb=>{cb.checked=false;});}
function setStatus(msg,cls){const s=$("status");s.className=cls||"";s.textContent=msg;}
/* printed-on stamp in WAT (UTC+1) regardless of the device's own timezone */
function nowWAT(){const d=new Date(Date.now()+3600000);
  return String(d.getUTCDate()).padStart(2,"0")+" "+MONTHS[d.getUTCMonth()]+" "+d.getUTCFullYear()+", "+
         String(d.getUTCHours()).padStart(2,"0")+":"+String(d.getUTCMinutes()).padStart(2,"0")+" WAT";}

let ME=null, MY={id:null,name:"",dept:"",unit:"",rank:""}, MW_TABLE="mat_weaving";
let UNIT_SHEDS=[], EXCLUDED=new Set(), BUSY=false;

function setRange(range,btn){
  document.querySelectorAll("#quickbar .qbtn").forEach(b=>b.classList.remove("active"));
  if(btn)btn.classList.add("active");
  const t=new Date();let from,to=t;
  if(range==="week")from=new Date(t.getFullYear(),t.getMonth(),t.getDate()-((t.getDay()+6)%7));
  else if(range==="month")from=new Date(t.getFullYear(),t.getMonth(),1);
  else if(range==="lastmonth"){from=new Date(t.getFullYear(),t.getMonth()-1,1);to=new Date(t.getFullYear(),t.getMonth(),0);}
  else if(range==="quarter")from=new Date(t.getFullYear(),t.getMonth()-3,t.getDate());
  else if(range==="year")from=new Date(t.getFullYear(),0,1);
  else return;
  $("fromDate").value=iso(from);$("toDate").value=iso(to);
}

function refreshShedOptions(){
  const keep=new Set(checkedSheds());
  const list=(UNIT_SHEDS.length?[...new Set(UNIT_SHEDS.map(u=>String(u.shed)))]:["1","2","3","4","5","6"]).sort(shedSort);
  $("shedContainer").innerHTML=list.length
    ?list.map(v=>`<label><input type="checkbox" value="${esc(v)}"${keep.has(v)?" checked":""}> ${esc(shedLabel(v))}</label>`).join("")
    :'<span class="note">No sheds found.</span>';
}

async function fetchAll(table,clause,order){
  let all=[],offset=0;
  const base=SUPABASE_URL+"/rest/v1/"+table+"?select=*"+clause+(order||"");
  for(let g=0;g<500;g++){
    const res=await fetch(base,{headers:Object.assign({},authHeaders(),{"Range-Unit":"items","Range":offset+"-"+(offset+999)})});
    if(!res.ok)throw new Error(table+": HTTP "+res.status);
    const batch=await res.json();
    all=all.concat(batch);
    if(batch.length<1000)break;
    offset+=1000;
  }
  return all;
}

async function init(){
  const cs=$("connStatus");
  try{
    ME=await requireAuth("../../login.html");
    if(!ME)return;
    cs.textContent="Loading your profile...";
    MW_TABLE=await resolveWeavingTable();

    const {data:emp,error}=await sb.from("employees")
      .select("employee_id,full_name,unit,department,rank").eq("linked_profile_id",ME.id).maybeSingle();
    if(error)throw new Error("Profile lookup: "+error.message);
    if(!emp||!emp.employee_id){
      $("notLinkedMsg").textContent=`⚠ Your account (${ME.username}) is not linked to an employee record.`;
      $("notLinked").style.display="block";
      cs.style.color="var(--red)";cs.textContent="Account not linked.";
      return;
    }
    MY={id:String(emp.employee_id),name:emp.full_name||ME.username,dept:emp.department||"",unit:emp.unit||"",rank:emp.rank||""};
    $("opCard").innerHTML=`<div class="name">👤 ${esc(MY.name)}</div>`+
      `<div class="meta">ID: ${esc(MY.id)} &nbsp;·&nbsp; ${esc(MY.dept)}${MY.unit?" / "+esc(MY.unit):""}${MY.rank?" · "+esc(MY.rank):""}</div>`;
    $("ph_name").textContent=MY.name;

    try{const {data}=await sb.from("weaving_units").select("shed");
        UNIT_SHEDS=(data||[]).filter(u=>u.shed!=null&&String(u.shed).trim()!=="");}catch(e){UNIT_SHEDS=[];}
    refreshShedOptions();
    try{const r=await fetch(SUPABASE_URL+"/rest/v1/job_table?select=job_code",{headers:authHeaders()});
        if(r.ok){const j=await r.json();EXCLUDED=new Set(j.map(x=>x.job_code));}}catch(e){}

    setRange("month",document.querySelector("#quickbar .qbtn.active"));
    $("appArea").style.display="block";
    cs.style.color="var(--green)";cs.textContent="Connected: "+MY.name;
    await generate();                       // show the report straight away
  }catch(e){
    cs.style.color="var(--red)";cs.textContent="❌ "+e.message;
    console.error("my-asset-report init:",e);
  }
}

async function generate(){
  if(BUSY)return;
  const from=$("fromDate").value,to=$("toDate").value,shift=$("shiftFilter").value;
  if(!from||!to){setStatus("Select both dates.","err");return;}
  if(from>to){setStatus("The From date is after the To date.","err");return;}
  BUSY=true;$("genBtn").disabled=true;
  try{
    setStatus("Loading your production records...");
    const mine=await fetchAll(MW_TABLE,"&operator_id=eq."+encodeURIComponent(MY.id)+"&date_col=gte."+from+"&date_col=lte."+to,"&order=date_col.asc");

    const sheds=checkedSheds();
    let prod=shift==="All"?mine:mine.filter(r=>r.shift===shift);
    if(sheds.length)prod=prod.filter(r=>sheds.includes(String(r.shed)));
    const shedText=sheds.length?sheds.map(shedLabel).join(", "):"All";

    // Header block used when printing
    $("ph_line1").textContent="Employee ID: "+MY.id+"   |   "+[MY.dept,MY.unit,MY.rank].filter(Boolean).join(" / ");
    $("ph_line2").textContent="Period: "+dmy(from)+" to "+dmy(to)+"   |   Shift: "+shift+"   |   Shed: "+shedText+"   |   Printed: "+nowWAT();

    if(!prod.length){
      $("reportArea").innerHTML="<div class='card'><p style='color:var(--red);font-weight:700;margin:0;'>No records found for the selected filters.</p></div>";
      setStatus("");return;
    }

    // Only the machines this operator used, so we do not download the whole factory's downtime log.
    const assets=[...new Set(prod.map(r=>r.assets).filter(Boolean))];
    setStatus("Loading downtime records for "+assets.length+" machine(s)...");
    let ctrl=[];
    if(assets.length){
      const inList=assets.map(a=>'"'+String(a).replace(/"/g,'\\"')+'"').join(",");
      ctrl=await fetchAll("control","&date=gte."+from+"&date=lte."+to+"&assets=in.("+encodeURIComponent(inList)+")","");
      ctrl.forEach(normalizeCtrl);
    }
    const dt=buildDowntimeMap(ctrl,from,to,EXCLUDED);

    render(prod,dt,from,to,shift,shedText);
    setStatus("");
  }catch(e){
    setStatus("❌ "+e.message,"err");console.error("my-asset-report generate:",e);
  }finally{
    BUSY=false;$("genBtn").disabled=false;
  }
}

function render(prod,dt,from,to,shift,shedText){
  const R=RULES, S=computeOperatorMetrics(prod,dt,R);
  const clr=v=>v>=R.minPercentA?"colorHigh":v>=85?"colorMedium":"colorLow";   // colour %A and %P only

  let html=`<div class="card"><h3>My Production Summary</h3>
  <p class="note" style="margin-top:0;">${dmy(from)} to ${dmy(to)} &middot; Shift: ${esc(shift)} &middot; Shed: ${esc(shedText)}</p>
  <div class="table-scroll"><table>
  <tr><th>Days</th><th>Work</th><th>Cover</th><th>A</th><th>B</th><th>C</th><th>Total</th><th>Target</th><th>Down (min)</th><th>MLD</th><th>ATG</th><th>MLU</th><th>%A</th><th>%B</th><th>%C</th><th>%P</th><th>Reward (₦)</th></tr>
  <tr><td>${S.workDays}</td><td>${S.mcWork}</td><td>${S.mcCover}</td><td>${S.A}</td><td>${S.B}</td><td>${S.C}</td>
  <td>${S.total}</td><td>${S.target}</td><td>${S.down}</td><td>${S.MLD}</td><td>${S.ATG}</td><td>${S.MLU}</td>
  <td class="${clr(S.pA)}">${S.pA}%</td><td>${S.pB}%</td><td>${S.pC}%</td><td class="${clr(S.pP)}">${S.pP}%</td>
  <td class="reward-big">₦${S.reward.toLocaleString()}</td></tr></table></div>
  <p class="note">%A, %B and %C are shares of Total output. %P = Total ÷ ATG × 100 (ATG = Target − MLD, based on ${R.workMinutes/60}-hour shifts).
  Reward rule: at least ${R.minWorkDays} work days and %A of ${R.minPercentA}% or more earns ₦${R.rewardLow.toLocaleString()}
  (₦${R.rewardHigh.toLocaleString()} when only No.2, No.3 or No.4 mats were produced).</p>`;

  // Day-by-day, each day computed with the same formulae as the summary
  const byDay={};
  prod.forEach(r=>{(byDay[r.date_col]=byDay[r.date_col]||[]).push(r);});
  html+=`<h4 style="color:var(--navy);margin:18px 0 8px;">Day by Day</h4><div class="table-scroll"><table>
  <tr><th>Date</th><th>Shift</th><th>Asset(s)</th><th>Work Type</th><th>A</th><th>B</th><th>C</th><th>Total</th><th>Target</th><th>Down (min)</th><th>ATG</th><th>MLU</th><th>%A</th><th>%B</th><th>%C</th><th>%P</th></tr>`;
  Object.keys(byDay).sort().forEach(d=>{
    const rows=byDay[d], m=computeOperatorMetrics(rows,dt,R);
    const uniq=f=>[...new Set(rows.map(f).filter(Boolean))].join(", ");
    html+=`<tr><td>${dmy(d)}</td><td>${esc(uniq(r=>r.shift))}</td><td class="left">${esc(uniq(r=>r.assets))}</td><td>${esc(uniq(r=>r.work_type)||"Normal")}</td>
    <td>${m.A}</td><td>${m.B}</td><td>${m.C}</td><td>${m.total}</td><td>${m.target}</td><td>${m.down}</td><td>${m.ATG}</td><td>${m.MLU}</td>
    <td class="${clr(m.pA)}">${m.pA}%</td><td>${m.pB}%</td><td>${m.pC}%</td><td class="${clr(m.pP)}">${m.pP}%</td></tr>`;
  });
  html+=`</table></div></div>`;
  $("reportArea").innerHTML=html;
}

init();
</script>
</body>
</html>
