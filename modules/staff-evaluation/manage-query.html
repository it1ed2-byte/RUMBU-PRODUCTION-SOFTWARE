<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Queries</title>
<link rel="stylesheet" href="../../styles.css">
<script>(function(){function apply(t){if(t)document.documentElement.setAttribute("data-theme",t);}window.addEventListener("message",function(e){if(e.data&&e.data.rumbuTheme)apply(e.data.rumbuTheme);});try{apply(localStorage.getItem("rumbu_theme"));}catch(e){}})();</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../auth.js"></script>
<style>
:root{--navy:var(--heading);--blue:var(--accent);--blue-dark:var(--accent-2);--muted:#6b7280;--red:#c0392b;--green:#1d8a4e;--amber:#d97706;}
*{box-sizing:border-box;}
body{font-family:var(--sans);background:var(--bg);margin:0;padding:18px;color:var(--text);}
.wrap{max-width:1200px;margin:0 auto;}
.page-head{background:linear-gradient(130deg,#7c2d12 0%,#c2410c 100%);border-radius:14px;padding:18px 22px;margin-bottom:16px;color:#fff;}
.page-head h2{margin:0 0 3px;font-size:18px;font-weight:800;color:#fff;}
.page-head p{margin:0;font-size:12px;opacity:.88;color:#fff;}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;}
label{display:block;font-size:12px;font-weight:700;color:var(--text);margin:0 0 4px;}
input,select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;background:var(--card);color:var(--text);}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
.row>div{flex:1;min-width:150px;}
button{padding:9px 14px;border:none;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;background:var(--blue);color:#fff;}
button:hover{background:var(--blue-dark);}
button.mini{padding:5px 10px;font-size:11px;}
.status{margin-top:8px;font-weight:700;font-size:13px;min-height:14px;}
.status.ok{color:var(--green);}.status.err{color:var(--red);}
#connStatus{font-size:12px;font-weight:700;text-align:center;margin-bottom:10px;}
.table-scroll{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;}
thead th{background:var(--navy);color:#fff;font-size:11px;position:sticky;top:0;}
tbody tr:nth-child(even){background:#f6f8fb;}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;color:#fff;}
.tag.QUERY{background:#2E75B6;}.tag.LASTWARNING{background:var(--amber);}.tag.SURCHARGE{background:var(--red);}.tag.CUSTOMQUERY{background:#6b7280;}
.no-query{color:var(--muted);font-style:italic;font-size:12px;}
.summary-bar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
.sbar-item{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:12px;font-weight:700;color:var(--navy);flex:1;min-width:120px;text-align:center;}
.sbar-item span{display:block;font-size:20px;font-weight:800;}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:13px;}
</style>
</head>
<body>
<div class="wrap">
<div id="connStatus">Loading...</div>
<div class="page-head" id="pageHead" style="display:none;"></div>

<div id="notLinked" style="display:none;" class="card">
  <p id="notLinkedMsg" style="color:var(--red);font-weight:700;margin:0;"></p>
</div>

<div id="appArea" style="display:none;">
  <div class="card">
    <div class="row">
      <div><label>From Date</label><input type="date" id="fromDate" name="date_from"></div>
      <div><label>To Date</label><input type="date" id="toDate" name="date_to"></div>
      <div>
        <label>Memo Type</label>
        <select id="typeFilter">
          <option value="">All Types</option>
          <option value="QUERY">QUERY</option>
          <option value="LAST WARNING">LAST WARNING</option>
          <option value="SURCHARGE">SURCHARGE</option>
          <option value="CUSTOM QUERY">CUSTOM QUERY</option>
        </select>
      </div>
      <div id="showWrap">
        <label>Show Operators</label>
        <select id="showFilter">
          <option value="all">All Operators</option>
          <option value="with">With Queries Only</option>
          <option value="without">Clean Record Only</option>
        </select>
      </div>
      <div><label id="searchLabel">Search</label><input type="text" id="search" placeholder="Type to filter…"></div>
      <div style="flex:0 0 auto;"><label>&nbsp;</label><button onclick="loadData()">🔄 Refresh</button></div>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div class="card">
    <div class="summary-bar" id="summaryBar"></div>
    <div class="table-scroll" id="tableWrap"></div>
  </div>
</div>

<!-- View memo modal -->
<div id="memoModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;overflow-y:auto;padding:30px 16px;">
  <div style="max-width:700px;margin:0 auto;background:#fff;border-radius:12px;padding:24px;position:relative;">
    <button onclick="closeMemo()" style="position:absolute;top:12px;right:12px;background:var(--red);padding:6px 12px;font-size:12px;">✕ Close</button>
    <div id="memoBody"></div>
  </div>
</div>
</div>

<script>
const MANAGER_ROLES=["super_admin","admin"];   // add a role here to give it the all-staff view
const COMPANY="Rumbu Industries Limited";
const $=id=>document.getElementById(id);
const esc=v=>String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function dmy(s){const p=String(s||"").split("-");return p.length===3?(p[2].slice(0,2)+" "+MONTHS[Number(p[1])-1]+" "+p[0]):String(s||"");}

let ME=null, MODE="personal", MY_EMP_ID=null;
let ALL_EMPS=[], ALL_QUERIES=[], COMBINED=[];

async function init(){
  const cs=$("connStatus");
  try{
    ME=await requireAuth("../../login.html");
    if(!ME)return;
    MODE=MANAGER_ROLES.includes(ME.role)?"manager":"personal";
    const head=$("pageHead");head.style.display="block";

    if(MODE==="manager"){
      head.innerHTML="<h2>⚠ Weaving Staff: Disciplinary Record</h2><p>Maps every Weaving operator to their HR query and memo records. Management view.</p>";
    }else{
      head.innerHTML="<h2>⚠ My Queries</h2><p>Queries, warnings and surcharges issued to you. Only you can see this list.</p>";
      $("showWrap").remove();
      $("searchLabel").textContent="Search (tracking no. or details)";
      cs.textContent="Loading your profile...";
      // Look up by linked_profile_id only
      const {data:emp,error}=await sb.from("employees").select("employee_id").eq("linked_profile_id",ME.id).maybeSingle();
      if(error)throw new Error("Profile lookup: "+error.message);
      if(!emp||!emp.employee_id){
        $("notLinkedMsg").textContent=`⚠ Your account (${ME.username}) is not linked to an employee record. Contact HR to link your account.`;
        $("notLinked").style.display="block";
        cs.style.color="var(--red)";cs.textContent="Account not linked.";
        return;
      }
      MY_EMP_ID=String(emp.employee_id);
    }
    // Dates are left blank on purpose: every query on record is shown until a range is chosen.
    cs.style.color="var(--green)";cs.textContent="Connected.";
    $("appArea").style.display="block";
    ["fromDate","toDate","typeFilter","showFilter"].forEach(id=>{const el=$(id);if(el)el.addEventListener("change",applyFilters);});
    $("search").addEventListener("input",applyFilters);
    await loadData();
  }catch(e){cs.style.color="var(--red)";cs.textContent="❌ "+e.message;console.error("manage-query init:",e);}
}

async function fetchWeavingEmployees(){
  const out=[];let from=0;
  for(;;){
    let q=sb.from("employees").select("employee_id,full_name,department,unit,branch")
      .or("department.ilike.%weaving%,unit.ilike.%weaving%");
    if(ME.role!=="super_admin"&&ME.sectionNames&&ME.sectionNames.length)q=q.in("branch",ME.sectionNames);
    const {data,error}=await q.range(from,from+999);
    if(error)throw new Error("Employee list: "+error.message);
    out.push(...(data||[]));
    if(!data||data.length<1000)break;
    from+=1000;
  }
  return out;
}

async function loadData(){
  const status=$("status");
  status.className="status";status.textContent="Loading records…";
  try{
    if(MODE==="manager"){
      ALL_EMPS=await fetchWeavingEmployees();
      const ids=ALL_EMPS.map(e=>e.employee_id).filter(Boolean);
      // chunked so the request URL stays short however many operators there are
      const chunks=[];for(let i=0;i<ids.length;i+=100)chunks.push(ids.slice(i,i+100));
      const results=await Promise.all(chunks.map(c=>sb.from("hr_queries").select("*").in("employee_id",c).order("created_at",{ascending:false})));
      ALL_QUERIES=[];
      results.forEach(r=>{if(r.error)throw new Error("Queries: "+r.error.message);ALL_QUERIES.push(...(r.data||[]));});
      COMBINED=ALL_EMPS.map(emp=>({...emp,queries:ALL_QUERIES.filter(q=>q.employee_id===emp.employee_id)}));
      status.className="status ok";
      status.textContent=`${ALL_EMPS.length} weaving operators · ${ALL_QUERIES.length} memo record(s) found.`;
    }else{
      const {data,error}=await sb.from("hr_queries").select("*").eq("employee_id",MY_EMP_ID).order("created_at",{ascending:false}).limit(1000);
      if(error)throw new Error("Queries: "+error.message);
      ALL_QUERIES=data||[];
      status.className="status ok";
      status.textContent=ALL_QUERIES.length?`${ALL_QUERIES.length} record(s) found.`:"";
    }
    applyFilters();
  }catch(e){status.className="status err";status.textContent="❌ "+e.message;console.error("manage-query load:",e);}
}

function memoFilter(list,from,to,type){
  let r=list.slice();
  if(from)r=r.filter(q=>(q.memo_date||"")>=from);
  if(to)r=r.filter(q=>(q.memo_date||"")<=to);
  if(type)r=r.filter(q=>q.letter_type===type);
  return r;
}

function applyFilters(){
  const from=$("fromDate").value,to=$("toDate").value,type=$("typeFilter").value;
  const search=$("search").value.trim().toLowerCase();

  if(MODE==="personal"){
    let list=memoFilter(ALL_QUERIES,from,to,type);
    if(search)list=list.filter(q=>(q.tracking_number||"").toLowerCase().includes(search)||
      (q.details||"").toLowerCase().includes(search)||(q.custom_subject||"").toLowerCase().includes(search));
    renderPersonal(list);return;
  }

  const show=$("showFilter").value;
  let data=COMBINED.map(emp=>({...emp,queries:memoFilter(emp.queries,from,to,type)}));
  if(show==="with")data=data.filter(d=>d.queries.length>0);
  if(show==="without")data=data.filter(d=>d.queries.length===0);
  if(search)data=data.filter(d=>(d.full_name||"").toLowerCase().includes(search)||
    (d.employee_id||"").toLowerCase().includes(search)||
    d.queries.some(q=>(q.tracking_number||"").toLowerCase().includes(search)));
  renderManager(data);
}

function summaryOf(q){
  let s=q.details||q.custom_subject||"";
  if(q.letter_type==="SURCHARGE"&&q.amount)s+=` (₦${q.amount})`;
  return s;
}

/* ── personal: no operator name, no employee columns ── */
function renderPersonal(list){
  const count=t=>list.filter(q=>q.letter_type===t).length;
  $("summaryBar").innerHTML=
    `<div class="sbar-item"><span>${list.length}</span>Total Records</div>`+
    `<div class="sbar-item"><span>${count("QUERY")}</span>Queries</div>`+
    `<div class="sbar-item"><span>${count("LAST WARNING")}</span>Last Warnings</div>`+
    `<div class="sbar-item"><span>${count("SURCHARGE")}</span>Surcharges</div>`+
    `<div class="sbar-item"><span>${count("CUSTOM QUERY")}</span>Other Memos</div>`;
  const wrap=$("tableWrap");
  if(!list.length){
    wrap.innerHTML=ALL_QUERIES.length
      ?'<div class="empty">No records match the filters you chose.</div>'
      :'<div class="empty">✅ You have no queries, warnings or surcharges on record.</div>';
    return;
  }
  let html=`<table><thead><tr><th>S/N</th><th>Tracking No.</th><th>Date</th><th>Type</th><th>Details</th><th>Action</th></tr></thead><tbody>`;
  list.forEach((q,i)=>{
    html+=`<tr><td>${i+1}</td><td>${esc(q.tracking_number)}</td><td>${esc(dmy(q.memo_date))}</td>
      <td><span class="tag ${esc((q.letter_type||"").replace(/\s+/g,""))}">${esc(q.letter_type)}</span></td>
      <td>${esc(summaryOf(q))}</td>
      <td><button class="mini" onclick="viewMemo(${Number(q.id)})">👁 View</button></td></tr>`;
  });
  wrap.innerHTML=html+"</tbody></table>";
}

/* ── manager: every Weaving operator with their records ── */
function renderManager(data){
  const withQuery=data.filter(d=>d.queries.length>0).length;
  const clean=data.length-withQuery;
  const totalQ=data.reduce((s,d)=>s+d.queries.length,0);
  $("summaryBar").innerHTML=
    `<div class="sbar-item"><span>${data.length}</span>Operators Shown</div>`+
    `<div class="sbar-item" style="border-color:var(--red);"><span style="color:var(--red);">${withQuery}</span>Have Queries</div>`+
    `<div class="sbar-item" style="border-color:var(--green);"><span style="color:var(--green);">${clean}</span>Clean Record</div>`+
    `<div class="sbar-item"><span>${totalQ}</span>Total Memos</div>`;
  const wrap=$("tableWrap");
  if(!data.length){wrap.innerHTML='<div class="empty">No records match.</div>';return;}

  let html=`<table><thead><tr><th>S/N</th><th>Employee ID</th><th>Name</th><th>Department</th><th>Unit</th><th>Branch</th>
    <th>Queries</th><th>Tracking No.</th><th>Date</th><th>Type</th><th>Details</th><th>Action</th></tr></thead><tbody>`;
  data.forEach((emp,idx)=>{
    const sn=idx+1;
    const who=`<td>${esc(emp.employee_id)}</td><td style="font-weight:700;">${esc(emp.full_name)}</td><td>${esc(emp.department)}</td><td>${esc(emp.unit)}</td><td>${esc(emp.branch)}</td>`;
    if(!emp.queries.length){
      html+=`<tr><td>${sn}</td>${who}<td><span class="no-query">None</span></td>
        <td colspan="4" style="color:var(--muted);font-style:italic;font-size:11px;">No disciplinary records for these filters</td></tr>`;
      return;
    }
    emp.queries.forEach((q,qi)=>{
      const rs=emp.queries.length;
      html+=`<tr>${qi===0
        ?`<td rowspan="${rs}">${sn}</td>`+
         `<td rowspan="${rs}">${esc(emp.employee_id)}</td><td rowspan="${rs}" style="font-weight:700;">${esc(emp.full_name)}</td>`+
         `<td rowspan="${rs}">${esc(emp.department)}</td><td rowspan="${rs}">${esc(emp.unit)}</td><td rowspan="${rs}">${esc(emp.branch)}</td>`+
         `<td rowspan="${rs}" style="text-align:center;font-weight:800;color:var(--red);">${rs}</td>`:""}
        <td>${esc(q.tracking_number)}</td><td>${esc(dmy(q.memo_date))}</td>
        <td><span class="tag ${esc((q.letter_type||"").replace(/\s+/g,""))}">${esc(q.letter_type)}</span></td>
        <td>${esc(summaryOf(q))}</td>
        <td><button class="mini" onclick="viewMemo(${Number(q.id)})">👁 View</button></td></tr>`;
    });
  });
  wrap.innerHTML=html+"</tbody></table>";
}

/* ── memo letter (the letter itself keeps the recipient's name) ── */
const CC_BLOCK=`<div style="margin-top:60px;">Kingsley Onulaka<br>Head, H.R.<br>Cc: Chairman &nbsp;&nbsp;&nbsp; Sign: …………………………<br>Vice Chairman<br>Admin Directors &nbsp;&nbsp;&nbsp; Name: ………………………<br>Executive Directors<br>Heads of Corporate<br>Heads of Admin/Departments<br>C.S.O.</div>`;

function buildBody(r){
  const subj=t=>`<p style="text-align:center;font-weight:bold;font-size:16pt;">Subject: ${esc(t)}</p>`;
  if(r.letter_type==="QUERY")
    return subj("QUERY")+`<p>Could you explain within <b>${esc(r.hours)} hours</b> why disciplinary action should not be taken against you for <b>${esc(r.title)} (${esc(r.details)})</b>?</p>`+
      `<p>This is viewed as misconduct. Reference to Section <b>${esc(r.service_section)}</b> of the Condition of Service, which attracts disciplinary action as this attitude will not be condoned by management.</p>`;
  if(r.letter_type==="LAST WARNING")
    return subj("LAST WARNING")+`<p>It has come to the attention of Management with dismay for ${esc(r.details)}.</p>`+
      `<p>This letter is hereby issued to you as a <b>LAST WARNING</b>. Further occurrence will lead to stricter disciplinary action.</p>`;
  if(r.letter_type==="SURCHARGE")
    return subj("SURCHARGE")+`<p>Having gone through your reply to the query issued on <b>${esc(r.query_date)}</b> for ${esc(r.details)}. You are hereby surcharged <b>₦${esc(r.amount)}</b> to be deducted from your salary.</p>`;
  if(r.letter_type==="CUSTOM QUERY"){
    const paras=[r.para1,r.para2,r.para3,r.para4,r.para5].filter(Boolean);
    return subj(r.custom_subject)+paras.map(p=>`<p>${esc(p)}</p>`).join("");
  }
  return"";
}

function viewMemo(id){
  const r=ALL_QUERIES.find(x=>Number(x.id)===Number(id));
  if(!r)return;
  const emp=ALL_EMPS.find(e=>e.employee_id===r.employee_id)||{};
  $("memoBody").innerHTML=`
    <div style="font-family:'Times New Roman',serif;font-size:13pt;line-height:1.7;padding:10px;color:#000;">
      <h2 style="text-align:center;font-size:18pt;margin-bottom:4px;">${COMPANY}</h2>
      <h3 style="text-align:center;font-size:14pt;margin-top:0;margin-bottom:20px;">MEMO</h3>
      <div style="text-align:right;margin-bottom:16px;">
        <p><b>Tracking No:</b> ${esc(r.tracking_number)}</p>
        <p>${esc(r.memo_from||"")}</p>
        <p><b>Date:</b> ${esc(dmy(r.memo_date))}</p>
      </div>
      <p><b>To:</b> ${esc(r.employee_name)} (${esc(r.employee_id||"")})</p>
      <p><b>Department:</b> ${esc(r.department||emp.department||"")}</p>
      ${buildBody(r)}
      ${CC_BLOCK}
    </div>`;
  $("memoModal").style.display="block";
  document.body.style.overflow="hidden";
}
function closeMemo(){$("memoModal").style.display="none";document.body.style.overflow="";}

init();
</script>
</body>
</html>
