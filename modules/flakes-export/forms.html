<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Export Forms — Flakes Export Form</title>
<link rel="stylesheet" href="../../styles.css">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("rumbu_theme")||"navy"); }catch(e){} })();
  window.addEventListener("message",function(e){ if(e.data&&e.data.rumbuTheme) document.documentElement.setAttribute("data-theme",e.data.rumbuTheme); });
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="../../auth.js"></script>
<script src="fef-common.js"></script>
<style>
  body{padding:20px;}
  .wrap{max-width:1150px;margin:0 auto;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:640px){ .grid2{grid-template-columns:1fr;} }
  label{font-size:12px;font-weight:700;display:block;margin:10px 0 4px;color:var(--muted);}
  input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;background:var(--card);color:var(--text);box-sizing:border-box;}
  input:read-only,input:disabled,select:disabled,textarea:disabled,textarea:read-only{background:var(--bg);}
  .badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
  .badge.details{background:#e5e7eb;color:#374151;} .badge.delivery_details{background:#dbeafe;color:#1e40af;}
  .badge.shipping_info{background:#e0e7ff;color:#3730a3;} .badge.weight_issue{background:#fee2e2;color:#991b1b;}
  .badge.completed{background:#d1fae5;color:#065f46;} .badge.in_progress{background:#fef3c7;color:#92400e;}
  .badge.me{background:#fde68a;color:#78350f;}
  .tbl{width:100%;border-collapse:collapse;font-size:13px;}
  .tbl th{background:var(--th-bg);color:var(--th-fg);text-align:left;padding:8px 10px;font-size:12px;white-space:nowrap;}
  .tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
  .tbl tr.click{cursor:pointer;} .tbl tr.click:hover td{background:var(--bg);}
  .strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:14px 0;}
  @media(max-width:640px){ .strip{grid-template-columns:1fr 1fr;} }
  .strip .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700;} .strip .v{font-size:14px;font-weight:700;color:var(--heading);margin-top:2px;}
  .stepper{display:flex;gap:6px;margin:6px 0 14px;flex-wrap:wrap;}
  .stp{flex:1;min-width:150px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;color:var(--text);font-family:inherit;display:block;}
  .stp .dot{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--muted);font-size:12px;font-weight:800;margin-right:6px;}
  .stp .nm{font-size:13px;font-weight:700;color:var(--heading);} .stp .own{display:block;font-size:11px;color:var(--muted);margin:4px 0 0 28px;} .stp .stt{display:block;font-size:11px;font-weight:700;margin:2px 0 0 28px;color:var(--muted);}
  .stp.done .dot{background:var(--ok);color:#fff;} .stp.done .stt{color:var(--ok);}
  .stp.cur{border-color:var(--accent);box-shadow:0 0 0 2px rgba(46,117,182,.18);} .stp.cur .dot{background:var(--accent);color:#fff;} .stp.cur .stt{color:var(--accent);}
  .stp.sel{background:var(--bg);} .stp.na{opacity:.65;} .stp.cond{border-style:dashed;}
  .panel{border:1px solid var(--line);border-radius:10px;padding:16px 18px;background:var(--card);}
  .panel h4{margin:0 0 4px;color:var(--heading);font-size:15px;}
  .hint{font-size:12px;color:var(--muted);margin:2px 0 8px;} .hint.warn{color:#92400e;font-weight:700;} .hint.bad{color:var(--bad);font-weight:700;}
  .diff{border-radius:10px;padding:16px;text-align:center;margin:12px 0;background:var(--bg);} .diff .val{font-size:26px;font-weight:800;color:var(--heading);} .diff .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:4px;}
  .diff.bad{background:#fee2e2;} .diff.bad .val{color:#991b1b;} .diff.ok{background:#d1fae5;} .diff.ok .val{color:#065f46;}
  .files{margin:4px 0 6px;font-size:12px;} .files .f{display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--line);} .files .f a{flex:1;word-break:break-all;} .files .f button{background:none;border:none;color:var(--bad);cursor:pointer;font-weight:800;padding:0 6px;width:auto;}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;} .actions button{width:auto;}
  .st{font-size:13px;font-weight:700;min-height:18px;margin-top:10px;} .st.ok{color:var(--ok);} .st.bad{color:var(--bad);}
  .cm{border-bottom:1px solid var(--line);padding:8px 0;font-size:13px;} .cm .who{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:2px;}
  .chipline{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 10px;font-size:12px;color:var(--muted);}
</style>
</head>
<body>
<div class="wrap">
  <button onclick="(window.parent&&window.parent.closeModule)?window.parent.closeModule():(window.location.href='../../index.html')" style="max-width:200px;margin-bottom:12px;background:var(--accent);">← Back</button>
  <div id="connStatus" style="font-size:12px;font-weight:700;text-align:center;margin-bottom:10px;color:var(--muted);">Loading...</div>

  <div id="appArea" style="display:none;">

    <div class="card-panel" id="listCard">
      <div style="font-weight:700;font-size:14px;color:var(--heading);margin:0 0 6px;">Flakes Export Forms</div>
      <div class="chipline" id="myRole"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center;">
        <input type="text" id="listSearch" placeholder="Search form no, client, picking slip, vehicle, container, bill of lading..." style="flex:1;min-width:220px;" oninput="renderList()">
        <select id="listStatus" style="width:150px;" onchange="renderList()"><option value="">All forms</option><option value="in_progress">In progress</option><option value="completed">Completed</option></select>
        <select id="listStep" style="width:190px;" onchange="renderList()"><option value="">All steps</option></select>
        <label style="display:flex;align-items:center;gap:6px;margin:0;font-size:12px;white-space:nowrap;"><input type="checkbox" id="listMine" style="width:auto;" onchange="renderList()"> Waiting for me</label>
        <button class="btn-ghost" onclick="reloadAll()" style="width:auto;padding:8px 14px;">Refresh</button>
        <button id="btnNew" onclick="newForm()" style="width:auto;">+ New export form</button>
      </div>
      <div id="listWrap"></div>
    </div>

    <div class="card-panel" id="formCard" style="display:none;margin-top:16px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;">
        <div>
          <h3 id="fTitle" style="margin:0;color:var(--heading);">New export form</h3>
          <p id="fSub" style="font-size:12px;color:var(--muted);margin:4px 0 0;"></p>
        </div>
        <div style="display:flex;gap:8px;">
          <button id="btnPdf" class="btn-ghost" onclick="downloadPdf()" style="width:auto;padding:6px 14px;font-size:12px;">Download PDF</button>
          <button class="btn-ghost" onclick="closeForm()" style="width:auto;padding:6px 14px;font-size:12px;">Close</button>
        </div>
      </div>
      <div class="strip" id="strip"></div>
      <div class="stepper" id="stepper"></div>
      <div class="panel" id="panel"></div>

      <div id="progressWrap" style="margin-top:18px;"></div>
      <div id="commentWrap" style="margin-top:18px;"></div>
    </div>
  </div>
</div>

<script>
let ME=null, ACTOR="", CLIENTS=[], FORMS=[], OWNERS=[], MY_STEPS=new Set(), CUR=null, VIEW="details", COMMENTS=[], FILES={odoo:[],wb:[],wi:[]}, BUSY=false;
const $ = id => document.getElementById(id);
const ctx = () => ({ ME, mySteps:MY_STEPS });
const KIND_FIELD = { odoo:"odoo_slips", wb:"weighbridge_attachments", wi:"weight_issue_attachments" };

function blankForm(){ return { id:null, form_no:null, status:"in_progress", current_step:"details", steps_done:{}, weight_issue_required:null, form_date:fefTodayYMD(),
  odoo_slips:[], weighbridge_attachments:[], weight_issue_attachments:[] }; }

async function init(){
  const cs = $("connStatus");
  try{
    if(typeof fefIsAdminLike !== "function") throw new Error("The shared file fef-common.js did not load. Check that it is in the same folder as this page (modules/flakes-export), named exactly fef-common.js (not .txt), and that it was pushed. Then reload.");
    ME = await requireAuth("../../login.html");
    if(!ME) return;
    cs.style.display = "none"; $("appArea").style.display = "block";
    ACTOR = ME.username;
    try{ const { data:emp } = await sb.from("employees").select("full_name").eq("linked_profile_id", ME.id).maybeSingle(); if(emp && emp.full_name) ACTOR = emp.full_name; }catch(e){}
    $("listStep").innerHTML = '<option value="">All steps</option>' + FEF_STEPS.map(s => `<option value="${s.key}">${s.no}. ${fefEsc(s.label)}</option>`).join("");
    await loadClients();
    await loadOwners();
    await loadForms();
  }catch(e){ cs.style.display = "block"; cs.style.color = "var(--bad)"; cs.textContent = "Error: " + e.message; }
}
async function loadClients(){
  const { data, error } = await sb.from("pet_export_clients").select("id,client_name").eq("is_active", true).order("client_name");
  CLIENTS = error ? [] : (data || []);
}
async function loadOwners(){
  const { data, error } = await sb.from("fef_step_owners").select("*");
  if(error) throw new Error("Could not load step owners: " + error.message);
  OWNERS = data || [];
  MY_STEPS = new Set(OWNERS.filter(o => o.profile_id === ME.id).map(o => o.step));
  const mine = FEF_STEPS.filter(s => MY_STEPS.has(s.key)).map(s => s.label);
  $("myRole").innerHTML = ME.readOnly ? '<span class="badge in_progress">View only</span> Your account can look but not change anything.'
    : (fefIsWriterSuper(ME) ? '<span class="badge completed">Super Admin</span> You can act on every open step.'
    : (mine.length ? 'Your steps: ' + mine.map(m => `<span class="badge details">${fefEsc(m)}</span>`).join(" ")
                   : '<span class="badge in_progress">View only</span> You are not an owner of any step yet. Ask an administrator to add you in Manage Step Owners.'));
  const cc = fefCanCreate(ctx()); $("btnNew").style.display = cc.ok ? "" : "none";
}
async function loadForms(){
  const { data, error } = await sb.from("fef_forms").select("*").order("created_at", { ascending:false });
  if(error){ $("listWrap").innerHTML = `<p style="color:var(--bad);font-size:13px;">Error: ${fefEsc(error.message)}</p>`; return; }
  FORMS = data || []; renderList();
}
async function reloadAll(){
  await loadOwners(); await loadForms();
  if(CUR){ const f = FORMS.find(x => x.id === CUR.id); if(f){ CUR = f; await loadComments(); render(); } }
}

/* ---------------- the list ---------------- */
function waitingForMe(f){ return f.status === "in_progress" && MY_STEPS.has(f.current_step); }
function renderList(){
  const q = $("listSearch").value.toLowerCase().trim(), stt = $("listStatus").value, stp = $("listStep").value, mine = $("listMine").checked;
  const rows = FORMS.filter(f => {
    if(stt && f.status !== stt) return false;
    if(stp && f.current_step !== stp) return false;
    if(mine && !waitingForMe(f)) return false;
    if(!q) return true;
    return [f.form_no, f.client_name, f.picking_slip_no, f.vehicle_number, f.container_number, f.bill_of_lading_number].join(" ").toLowerCase().includes(q);
  });
  const waiting = FORMS.filter(waitingForMe).length;
  if(!rows.length){ $("listWrap").innerHTML = '<p style="font-size:13px;color:var(--muted);">' + (FORMS.length ? "No forms match these filters." : "No export forms yet.") + "</p>"; return; }
  $("listWrap").innerHTML = (waiting ? `<div class="hint warn">${waiting} form(s) waiting for you.</div>` : "") +
    '<div class="table-scroll"><table class="tbl"><thead><tr><th>Form No</th><th>Date</th><th>Client</th><th>Step</th><th>Vehicle</th><th>Container</th><th>Diff (kg)</th><th>Started by</th><th>Updated</th></tr></thead><tbody>' +
    rows.map(f => {
      const stepBadge = f.status === "completed" ? '<span class="badge completed">Completed</span>' : `<span class="badge ${f.current_step}">${fefEsc(fefStepLabel(f.current_step))}</span>`;
      return `<tr class="click" onclick="openForm(${f.id})"><td><b>${fefEsc(f.form_no)}</b>${waitingForMe(f) ? ' <span class="badge me">Your turn</span>' : ""}</td><td>${fefEsc(fefFmtDate(f.form_date))}</td><td>${fefEsc(f.client_name || "-")}</td><td>${stepBadge}</td>` +
        `<td>${fefEsc(f.vehicle_number || "-")}</td><td>${fefEsc(f.container_number || "-")}</td><td>${f.weight_diff == null ? "-" : fefEsc(fefNum(f.weight_diff))}</td><td>${fefEsc(f.created_by_name || "-")}</td><td>${fefEsc(fefFmtDT(f.updated_at || f.created_at))}</td></tr>`;
    }).join("") + "</tbody></table></div>";
}

/* ---------------- open / close ---------------- */
function newForm(){
  const p = fefCanCreate(ctx()); if(!p.ok){ alert(p.reason); return; }
  CUR = null; VIEW = "details"; COMMENTS = []; render(); $("formCard").scrollIntoView({ behavior:"smooth", block:"start" });
}
async function openForm(id){
  const f = FORMS.find(x => x.id === id); if(!f) return;
  CUR = f; VIEW = f.status === "completed" ? "completed" : f.current_step; await loadComments(); render(); $("formCard").scrollIntoView({ behavior:"smooth", block:"start" });
}
function closeForm(){ CUR = null; $("formCard").style.display = "none"; }
async function loadComments(){
  COMMENTS = [];
  if(!CUR || !CUR.id) return;
  const { data } = await sb.from("fef_comments").select("*").eq("form_id", CUR.id).order("created_at", { ascending:true });
  COMMENTS = data || [];
}
function viewStep(k){ VIEW = k; render(); }

/* ---------------- drawing the form ---------------- */
function ownersText(k){
  const n = OWNERS.filter(o => o.step === k).map(o => o.employee_name || o.employee_code || "?");
  return !n.length ? "No owner assigned" : (n.length > 2 ? n.slice(0, 2).join(", ") + " +" + (n.length - 2) : n.join(", "));
}
function render(){
  const f = CUR || blankForm();
  $("formCard").style.display = "block";
  $("fTitle").textContent = CUR ? "Export form " + CUR.form_no : "New export form";
  $("fSub").textContent = CUR ? (CUR.client_name || "No client yet") : "Fill in Details and submit it to send the form to Delivery Details";
  $("btnPdf").style.display = CUR ? "" : "none";
  const prog = fefProgress(f), done = f.status === "completed";
  $("strip").innerHTML = [["Current step", done ? "Completed" : fefStepLabel(f.current_step)], ["Status", done ? "Completed" : "In progress"], ["Progress", prog.text], ["Started by", f.created_by_name || (CUR ? "-" : ACTOR)]]
    .map(c => `<div><div class="k">${c[0]}</div><div class="v">${fefEsc(c[1])}</div></div>`).join("");
  $("stepper").innerHTML = FEF_STEPS.map(s => {
    const st = CUR ? fefStepStatus(f, s.key) : (s.key === "details" ? "in_progress" : (s.key === "weight_issue" ? "conditional" : "not_started"));
    const cls = [st === "completed" ? "done" : "", st === "in_progress" ? "cur" : "", st === "not_required" ? "na" : "", st === "conditional" ? "cond" : "", VIEW === s.key ? "sel" : ""].join(" ");
    const dot = st === "completed" ? "✓" : (st === "not_required" ? "–" : s.no);
    return `<button class="stp ${cls}" onclick="viewStep('${s.key}')"><span class="dot">${dot}</span><span class="nm">${fefEsc(s.label)}</span><span class="own">${fefEsc(ownersText(s.key))}</span><span class="stt">${fefEsc(fefStatusLabel(st))}</span></button>`;
  }).join("");
  renderPanel(f);
  renderProgress(f);
  renderComments();
}

function fileList(kind, editable){
  const arr = FILES[kind];
  return '<div class="files" id="lst_' + kind + '">' + (arr.length ? arr.map((x, i) =>
    `<div class="f"><a href="${fefEsc(x.url)}" target="_blank" rel="noopener">${fefEsc(x.name)}</a><span style="color:var(--muted);">${fefEsc(fefSize(x.size))}</span>` +
    (editable ? `<button title="Remove" onclick="removeFile('${kind}',${i})">✕</button>` : "") + "</div>").join("") : '<div style="color:var(--muted);">No file attached.</div>') + "</div>";
}
function removeFile(kind, i){ FILES[kind].splice(i, 1); $("lst_" + kind).outerHTML = fileList(kind, true); }
function filePicker(kind, editable){
  return fileList(kind, editable) + (editable ? `<input type="file" id="new_${kind}" multiple>` : "");
}
function val(v){ return fefEsc(v == null ? "" : v); }

function renderPanel(form){
  const key = VIEW, isNew = !form.id, def = FEF_STEPS.find(s => s.key === key);
  FILES.odoo = (form.odoo_slips || []).slice(); FILES.wb = (form.weighbridge_attachments || []).slice(); FILES.wi = (form.weight_issue_attachments || []).slice();
  let perm;
  if(isNew) perm = key === "details" ? fefCanCreate(ctx()) : { ok:false, reason:"Save Details first." };
  else if(key === "completed") perm = completePerm(form);
  else perm = fefCanEdit(ctx(), form, key);
  const ed = perm.ok, d = (form.steps_done || {})[key];
  let hint = "";
  if(d) hint += `Submitted by <b>${fefEsc(d.by)}</b> on ${fefEsc(fefFmtDT(d.at))}. `;
  if(!ed) hint += `<span class="bad">${fefEsc(perm.reason || "")}</span>`;
  else if(perm.correction) hint += '<span class="warn">This step is already submitted. You can still correct it until the next step is submitted.</span>';
  let body = "";
  const dis = ed ? "" : " disabled";
  if(key === "details"){
    const cur = form.client_id, opts = CLIENTS.slice();
    if(form.client_name && !opts.some(c => String(c.id) === String(cur))) opts.unshift({ id:cur || "", client_name:form.client_name });
    body = `<div class="grid2"><div><label>Date</label><input type="date" id="f_date" value="${val(form.form_date)}"${dis}></div>
      <div><label>Form No</label><input id="f_formno" value="${val(form.form_no || "Assigned when you save")}" readonly></div></div>
      <div class="grid2"><div><label>Client name *</label><select id="f_client"${dis}><option value="">Select client</option>${opts.map(c => `<option value="${val(c.id)}"${String(c.id) === String(cur) ? " selected" : ""}>${val(c.client_name)}</option>`).join("")}</select></div>
      <div><label>Picking slip no *</label><input id="f_picking" value="${val(form.picking_slip_no)}"${dis}></div></div>
      <label>Odoo delivery, picking &amp; packages slip</label>${filePicker("odoo", ed)}`;
  }else if(key === "delivery_details"){
    body = `<div class="grid2"><div><label>Delivery slip weight (net), kg *</label><input type="number" step="0.01" min="0" id="f_slip" value="${val(form.delivery_slip_weight_net)}"${dis}></div>
      <div><label>Bag(s) quantity *</label><input type="number" step="1" min="0" id="f_bags" value="${val(form.bags_quantity)}"${dis}></div>
      <div><label>Vehicle number *</label><input id="f_vehicle" value="${val(form.vehicle_number)}"${dis}></div>
      <div><label>Container number *</label><input id="f_container" value="${val(form.container_number)}"${dis}></div>
      <div><label>Rumbu weighbridge weight, kg *</label><input type="number" step="0.01" min="0" id="f_wb" value="${val(form.rumbu_weighbridge_weight)}"${dis}></div></div>
      <label>Weighbridge attachment</label>${filePicker("wb", ed)}`;
  }else if(key === "shipping_info"){
    const diff = fefDiff(form.delivery_slip_weight_net, form.rumbu_weighbridge_weight);
    body = `<div class="grid2"><div><label>Bill of lading number *</label><input id="f_bol" value="${val(form.bill_of_lading_number)}"${dis}></div>
      <div><label>Shipping line name *</label><input id="f_line" value="${val(form.shipping_line_name)}"${dis}></div></div>
      ${diffBox(diff, "Difference between delivery slip weight and Rumbu weighbridge weight")}
      <div class="hint">If the two weights differ, submitting this step opens the Weight Issue step. If they match, the form goes straight to Completed.</div>`;
  }else if(key === "weight_issue"){
    if(form.weight_issue_required == null) body = '<div class="hint">This step opens only if the delivery slip weight and the Rumbu weighbridge weight differ. It is decided when Shipping Info is submitted.</div>';
    else if(form.weight_issue_required === false) body = diffBox(form.weight_diff, "Weights match. The Weight Issue step is not needed.");
    else body = diffBox(form.weight_diff, "The weights differ. Explain the difference.") +
      `<label>Remark *</label><textarea id="f_remark" rows="4" placeholder="Reason for the weight difference, and what was done about it"${dis}>${val(form.weight_issue_remark)}</textarea>
       <label>Attachment (optional)</label>${filePicker("wi", ed)}`;
  }else{
    const rows = [["Form No", form.form_no], ["Client", form.client_name], ["Picking slip no", form.picking_slip_no], ["Vehicle / container", [form.vehicle_number, form.container_number].filter(Boolean).join(" / ")],
      ["Delivery slip weight (net)", form.delivery_slip_weight_net != null ? fefNum(form.delivery_slip_weight_net) + " kg" : ""], ["Rumbu weighbridge weight", form.rumbu_weighbridge_weight != null ? fefNum(form.rumbu_weighbridge_weight) + " kg" : ""],
      ["Difference", form.weight_diff != null ? fefNum(form.weight_diff) + " kg" : ""], ["Bill of lading / line", [form.bill_of_lading_number, form.shipping_line_name].filter(Boolean).join(" / ")]];
    body = `<table class="tbl" style="margin-top:8px;"><tbody>${rows.map(r => `<tr><td style="width:220px;color:var(--muted);font-weight:700;">${fefEsc(r[0])}</td><td>${fefEsc(r[1] || "-")}</td></tr>`).join("")}</tbody></table>`;
    if(form.status === "completed") body += `<div class="hint" style="margin-top:10px;">Completed by <b>${fefEsc(form.completed_by_name || "")}</b> on ${fefEsc(fefFmtDT(form.completed_at))}.</div>`;
    else if(ed) body += '<div class="hint warn" style="margin-top:10px;">Check the summary above. Marking the form complete closes it and creates the PDF of the whole process.</div>';
  }
  let btns = "";
  if(key === "completed"){
    if(ed) btns = '<button onclick="completeForm()" id="btnComplete">Mark complete and create PDF</button>';
    if(form.id) btns += '<button class="btn-ghost" onclick="downloadPdf()">Download PDF</button>';
  }else if(ed){
    if(perm.correction) btns = `<button onclick="saveStep('${key}',false)" id="btnSave">Save correction</button>`;
    else btns = `<button class="btn-ghost" onclick="saveStep('${key}',false)" id="btnSave">Save</button><button onclick="saveStep('${key}',true)" id="btnSubmit">Submit step</button>`;
  }
  $("panel").innerHTML = `<h4>Step ${def.no}: ${fefEsc(def.label)}${def.alt ? ' <span style="font-weight:400;color:var(--muted);font-size:12px;">(' + fefEsc(def.alt) + ")</span>" : ""}</h4>
    <div class="hint">${hint}</div>${body}<div class="actions">${btns}</div><div class="st" id="stepStatus"></div>`;
}
function diffBox(diff, label){
  const cls = diff == null ? "" : (fefWeightsDiffer(diff) ? " bad" : " ok");
  return `<div class="diff${cls}"><div class="val">${diff == null ? "-" : fefEsc(fefNum(diff)) + " kg"}</div><div class="lbl">${fefEsc(label)}</div></div>`;
}
function completePerm(form){
  if(ME.readOnly) return { ok:false, reason:"Your account is view only." };
  if(form.status === "completed") return { ok:false, reason:"This form is completed." };
  if(form.current_step !== "completed") return { ok:false, reason:"The earlier steps must be submitted first." };
  return (fefIsWriterSuper(ME) || MY_STEPS.has("completed")) ? { ok:true } : { ok:false, reason:"You are not an owner of the Completed step." };
}

function renderProgress(form){
  if(!form.id){ $("progressWrap").innerHTML = ""; return; }
  $("progressWrap").innerHTML = '<div style="font-weight:700;font-size:14px;color:var(--heading);margin-bottom:6px;">Progress</div><div class="table-scroll"><table class="tbl"><thead><tr><th>Step</th><th>Person</th><th>Date and time</th><th>Status</th></tr></thead><tbody>' +
    FEF_STEPS.map(s => {
      const st = fefStepStatus(form, s.key), d = (form.steps_done || {})[s.key];
      const who = d ? d.by : ownersText(s.key);
      return `<tr><td><b>${fefEsc(s.label)}</b></td><td>${fefEsc(who)}</td><td>${d ? fefEsc(fefFmtDT(d.at)) : ""}</td><td>${fefEsc(fefStatusLabel(st))}</td></tr>`;
    }).join("") + "</tbody></table></div>";
}
function renderComments(){
  if(!CUR){ $("commentWrap").innerHTML = ""; return; }
  const can = fefCanComment(ctx());
  $("commentWrap").innerHTML = '<div style="font-weight:700;font-size:14px;color:var(--heading);margin-bottom:6px;">Comments</div>' +
    (COMMENTS.length ? COMMENTS.map(c => `<div class="cm"><div class="who">${fefEsc(c.author_name || "")} | ${fefEsc(fefFmtDT(c.created_at))}${c.step ? " | " + fefEsc(fefStepLabel(c.step)) : ""}</div>${fefEsc(c.comment)}</div>`).join("") : '<div class="hint">No comments</div>') +
    (can ? '<textarea id="newComment" rows="2" placeholder="Write a comment" style="margin-top:10px;"></textarea><div class="actions"><button class="btn-ghost" onclick="addComment()">Add comment</button></div><div class="st" id="commentStatus"></div>' : "");
}

/* ---------------- messages ---------------- */
function msg(t, cls){ const el = $("stepStatus"); if(el){ el.className = "st " + (cls || ""); el.textContent = t; } }
function busy(on){ BUSY = on; ["btnSave","btnSubmit","btnComplete"].forEach(i => { const b = $(i); if(b) b.disabled = on; }); }

/* ---------------- reading and checking a step ---------------- */
function collect(key){
  const g = id => { const el = $(id); return el ? el.value.trim() : ""; };
  const num = id => g(id) === "" ? null : Number(g(id));
  const p = {}, errs = [];
  if(key === "details"){
    p.form_date = g("f_date") || fefTodayYMD(); p.client_id = g("f_client") || null;
    const c = CLIENTS.find(x => String(x.id) === String(p.client_id)) || (CUR && String(CUR.client_id) === String(p.client_id) ? { client_name:CUR.client_name } : null);
    p.client_name = c ? c.client_name : (p.client_id ? (CUR && CUR.client_name) : null);
    p.picking_slip_no = g("f_picking") || null;
  }else if(key === "delivery_details"){
    p.delivery_slip_weight_net = num("f_slip"); p.bags_quantity = num("f_bags"); p.vehicle_number = g("f_vehicle") || null; p.container_number = g("f_container") || null; p.rumbu_weighbridge_weight = num("f_wb");
    [["delivery slip weight", p.delivery_slip_weight_net], ["bag(s) quantity", p.bags_quantity], ["Rumbu weighbridge weight", p.rumbu_weighbridge_weight]].forEach(([n, v]) => { if(v !== null && (!isFinite(v) || v < 0)) errs.push("Enter a valid " + n + "."); });
    if(p.bags_quantity !== null && isFinite(p.bags_quantity) && !Number.isInteger(p.bags_quantity)) errs.push("Bag(s) quantity must be a whole number.");
  }else if(key === "shipping_info"){
    p.bill_of_lading_number = g("f_bol") || null; p.shipping_line_name = g("f_line") || null;
  }else if(key === "weight_issue"){
    p.weight_issue_remark = g("f_remark") || null;
  }
  return { p, errs };
}
function requiredMissing(key, p){
  const m = [];
  if(key === "details"){ if(!p.client_id) m.push("client"); if(!p.picking_slip_no) m.push("picking slip no"); }
  else if(key === "delivery_details"){
    if(!(p.delivery_slip_weight_net > 0)) m.push("delivery slip weight"); if(!(p.bags_quantity >= 1)) m.push("bag(s) quantity");
    if(!p.vehicle_number) m.push("vehicle number"); if(!p.container_number) m.push("container number"); if(!(p.rumbu_weighbridge_weight > 0)) m.push("Rumbu weighbridge weight");
  }else if(key === "shipping_info"){ if(!p.bill_of_lading_number) m.push("bill of lading number"); if(!p.shipping_line_name) m.push("shipping line name"); }
  else if(key === "weight_issue"){ if(!p.weight_issue_remark) m.push("remark"); }
  return m;
}
const FILE_FOR = { details:["odoo"], delivery_details:["wb"], weight_issue:["wi"] };

async function guardedUpdate(form, patch){
  const { data, error } = await sb.from("fef_forms").update(Object.assign({ updated_at:new Date().toISOString() }, patch))
    .eq("id", form.id).eq("current_step", form.current_step).eq("status", "in_progress").select();
  if(error) throw new Error(error.message);
  if(!data || data.length !== 1){ const e = new Error("STALE"); e.stale = true; throw e; }
  return data[0];
}
function keep(row){ const i = FORMS.findIndex(x => x.id === row.id); if(i >= 0) FORMS[i] = row; else FORMS.unshift(row); CUR = row; }
async function staleReload(){
  await loadForms(); const f = FORMS.find(x => CUR && x.id === CUR.id); if(f){ CUR = f; VIEW = f.status === "completed" ? "completed" : f.current_step; await loadComments(); render(); }
  msg("This form was just changed by someone else, or you no longer have permission for this step. The latest version is shown. Check it and try again.", "bad");
}

/* ---------------- save / submit a step ---------------- */
async function saveStep(key, submit){
  if(BUSY) return;
  const form = CUR, perm = form ? fefCanEdit(ctx(), form, key) : fefCanCreate(ctx());
  if(!perm.ok){ msg(perm.reason, "bad"); return; }
  const { p, errs } = collect(key);
  if(errs.length){ msg(errs[0], "bad"); return; }
  if(submit){ const miss = requiredMissing(key, p); if(miss.length){ msg("Complete these before submitting: " + miss.join(", ") + ".", "bad"); return; } }
  busy(true); msg(submit ? "Submitting..." : "Saving...", "");
  const warn = [];
  try{
    // attachments: keep what was not removed, add what was chosen
    const folder = (form ? form.form_no : "new").replace(/[^A-Za-z0-9]+/g, "-");
    for(const kind of (FILE_FOR[key] || [])){
      const input = $("new_" + kind), added = input && input.files.length ? await fefUploadFiles(sb, Array.from(input.files), folder) : [];
      p[KIND_FIELD[kind]] = FILES[kind].concat(added);
    }
    let row = form;
    if(!form){                                   // first save of a new form: take the next number, then create it
      const { data:no, error:ne } = await sb.rpc("fef_next_form_no");
      if(ne || !no) throw new Error("Could not get a form number: " + (ne ? ne.message : "empty"));
      const ins = await sb.from("fef_forms").insert(Object.assign({ form_no:no, status:"in_progress", current_step:"details", steps_done:{}, created_by:ME.id, created_by_name:ACTOR }, p)).select().single();
      if(ins.error) throw new Error(ins.error.message);
      row = ins.data; keep(row);
      const w = await fefLog(sb, ME, ACTOR, row, "details", "created", "Form " + row.form_no + " created"); if(w) warn.push(w);
      if(!submit){ const w2 = await fefLog(sb, ME, ACTOR, row, "details", "saved", "Draft saved"); if(w2) warn.push(w2); }
    }else if(!submit){
      row = await guardedUpdate(form, p); keep(row);
      const w = await fefLog(sb, ME, ACTOR, row, key, perm.correction ? "edited" : "saved", perm.correction ? "Corrected after submitting" : "Draft saved"); if(w) warn.push(w);
    }
    if(submit){
      const now = new Date().toISOString(), patch = Object.assign({}, form ? p : {}), done = Object.assign({}, row.steps_done || {});
      done[key] = { by:ACTOR, by_id:ME.id, at:now };
      let detail;
      if(key === "shipping_info"){
        const diff = fefDiff(row.delivery_slip_weight_net, row.rumbu_weighbridge_weight), need = fefWeightsDiffer(diff);
        patch.weight_diff = diff; patch.weight_issue_required = need; patch.current_step = need ? "weight_issue" : "completed";
        detail = need ? "Weights differ by " + fefNum(diff) + " kg: Weight Issue step opened" : "Weights match: Weight Issue step not needed";
      }else{
        patch.current_step = fefNextStep(row); detail = "Moved to " + fefStepLabel(patch.current_step);
      }
      patch.steps_done = done;
      const updated = await guardedUpdate(row, patch); keep(updated);
      const w = await fefLog(sb, ME, ACTOR, updated, key, "submitted", detail); if(w) warn.push(w);
      VIEW = updated.current_step;
    }else if(!form){ VIEW = "details"; }
    renderList(); render();
    msg((submit ? "Submitted. " : "Saved. ") + (warn.length ? "Note: the activity log line could not be written (" + warn[0] + ")." : ""), warn.length ? "bad" : "ok");
  }catch(e){
    if(e.stale) await staleReload(); else msg("Error: " + e.message, "bad");
  }finally{ busy(false); }
}

/* ---------------- mark complete: the last person finishes the form and the PDF is made ---------------- */
async function completeForm(){
  if(BUSY || !CUR) return;
  const perm = completePerm(CUR); if(!perm.ok){ msg(perm.reason, "bad"); return; }
  if(!confirm("Mark form " + CUR.form_no + " complete? This closes the form and creates the PDF of the whole process.")) return;
  busy(true); msg("Completing...", "");
  try{
    const now = new Date().toISOString(), done = Object.assign({}, CUR.steps_done || {}); done.completed = { by:ACTOR, by_id:ME.id, at:now };
    const row = await guardedUpdate(CUR, { status:"completed", completed_at:now, completed_by:ME.id, completed_by_name:ACTOR, steps_done:done });
    keep(row);
    const w = await fefLog(sb, ME, ACTOR, row, "completed", "completed", "Form completed and PDF created");
    VIEW = "completed"; renderList(); render();
    try{ await downloadPdf(true); msg("Form completed. The PDF has been downloaded." + (w ? " Note: the activity log line could not be written (" + w + ")." : ""), w ? "bad" : "ok"); }
    catch(pe){ msg("Form completed, but the PDF could not be created: " + pe.message + ". Use Download PDF to try again.", "bad"); }
  }catch(e){ if(e.stale) await staleReload(); else msg("Error: " + e.message, "bad"); }
  finally{ busy(false); }
}

/* ---------------- the PDF of the whole process ---------------- */
async function downloadPdf(quiet){
  if(!CUR) return;
  if(!(window.jspdf && window.jspdf.jsPDF)) throw new Error("The PDF library did not load. Check your connection and reopen this page");
  const owners = {}; FEF_STEPS.forEach(s => { owners[s.key] = OWNERS.filter(o => o.step === s.key).map(o => o.employee_name || o.employee_code).filter(Boolean); });
  const doc = await fefBuildFormPdf({ form:CUR, owners, comments:COMMENTS });
  doc.save(fefFileName(["Flakes export form", CUR.form_no]));
}

/* ---------------- comments ---------------- */
async function addComment(){
  const ta = $("newComment"), st = $("commentStatus"); if(!ta || !CUR) return;
  const text = ta.value.trim(); if(!text){ st.className = "st bad"; st.textContent = "Write a comment first."; return; }
  if(!fefCanComment(ctx())){ st.className = "st bad"; st.textContent = "You cannot comment."; return; }
  st.className = "st"; st.textContent = "Saving...";
  const { data, error } = await sb.from("fef_comments").insert({ form_id:CUR.id, step:CUR.status === "completed" ? "completed" : CUR.current_step, comment:text, author_profile_id:ME.id, author_name:ACTOR }).select().single();
  if(error){ st.className = "st bad"; st.textContent = "Error: " + error.message; return; }
  COMMENTS.push(data); await fefLog(sb, ME, ACTOR, CUR, data.step, "commented", text.slice(0, 120)); renderComments();
}

init();
</script>
