<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dev Desk</title>
<link rel="stylesheet" href="../../styles.css">
<script>
  (function(){
    function apply(t){ if(t) document.documentElement.setAttribute("data-theme", t); }
    window.addEventListener("message", function(e){ if(e.data && e.data.rumbuTheme) apply(e.data.rumbuTheme); });
    try{ apply(localStorage.getItem("rumbu_theme")); }catch(e){}
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../auth.js"></script>
<style>
  *{box-sizing:border-box;}
  body{font-family:var(--sans);background:var(--bg);margin:0;padding:20px;color:var(--text);}
  .wrap{max-width:1280px;margin:0 auto;}
  h1{margin:0;font-size:22px;color:var(--heading);}
  .sub{margin:4px 0 18px;color:var(--muted);font-size:13.5px;}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;}
  .tabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:3px;}
  .tabs button{border:0;background:none;color:var(--muted);font:700 12.5px var(--sans);padding:7px 12px;border-radius:8px;cursor:pointer;}
  .tabs button.on{background:var(--heading);color:var(--card);}
  .tabs .n{opacity:.75;font-weight:600;margin-left:4px;}
  .bar .grow{flex:1;}
  .bar input,.bar select{height:36px;padding:0 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--text);font:13px var(--sans);}
  .bar input{min-width:220px;}
  .btn{height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--heading);font:700 13px var(--sans);cursor:pointer;white-space:nowrap;}
  .btn.pri{background:var(--heading);border-color:var(--heading);color:var(--card);}
  .btn.ok{background:var(--ok);border-color:var(--ok);color:#fff;}
  .btn.bad{color:var(--bad);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-size:11.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);padding:11px 14px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 60%,var(--card));}
  td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top;}
  tr.row{cursor:pointer;} tr.row:hover td{background:color-mix(in srgb,var(--accent) 5%,transparent);}
  tr.row.open td{background:color-mix(in srgb,var(--accent) 8%,transparent);}
  .ref{font-weight:800;color:var(--heading);white-space:nowrap;}
  .t b{display:block;color:var(--heading);}
  .t small{color:var(--muted);font-size:12px;}
  .muted{color:var(--muted);}
  .pill{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11.5px;font-weight:800;white-space:nowrap;}
  .s-raised{background:color-mix(in srgb,var(--muted) 16%,transparent);color:var(--muted);}
  .s-assigned{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);}
  .s-in_progress{background:color-mix(in srgb,#2563eb 14%,transparent);color:#2563eb;}
  .s-ready_for_test{background:color-mix(in srgb,#d4a017 20%,transparent);color:#8a6400;}
  .s-sent_back{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad);}
  .s-approved{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok);}
  .s-live{background:var(--ok);color:#fff;}
  .s-closed{background:color-mix(in srgb,var(--muted) 12%,transparent);color:var(--muted);}
  .p-urgent{color:var(--bad);font-weight:800;} .p-high{color:#b45309;font-weight:700;} .p-low{color:var(--muted);}
  .detail td{background:color-mix(in srgb,var(--bg) 55%,var(--card));padding:18px;}
  .dgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;}
  @media (max-width:900px){ .dgrid{grid-template-columns:1fr;} .bar input{min-width:0;flex:1;} th.hide,td.hide{display:none;} }
  .desc{white-space:pre-wrap;line-height:1.6;margin:0 0 14px;color:var(--text);}
  .facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:0 0 14px;}
  .facts dt{color:var(--muted);} .facts dd{margin:0;word-break:break-word;}
  pre.sql{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px;font-size:12px;white-space:pre-wrap;max-height:220px;overflow:auto;margin:0 0 14px;}
  .acts{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px;}
  .note-box{display:flex;gap:8px;margin-bottom:12px;}
  .note-box textarea{flex:1;min-height:42px;padding:9px;border:1px solid var(--line);border-radius:9px;font:13px var(--sans);background:var(--card);color:var(--text);resize:vertical;}
  .tl{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);}
  .tl li{position:relative;padding:0 0 12px 16px;font-size:13px;}
  .tl li::before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--accent);}
  .tl .w{color:var(--muted);font-size:12px;}
  .tl .n{white-space:pre-wrap;margin-top:3px;}
  h3{margin:0 0 10px;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);}
  .empty{padding:40px 16px;text-align:center;color:var(--muted);}
  .msg{margin:0 0 12px;padding:10px 12px;border-radius:10px;font-size:13px;}
  .msg.ok{background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--ok);}
  .msg.err{background:color-mix(in srgb,var(--bad) 10%,transparent);color:var(--bad);}
  .modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto;}
  .modal[hidden]{display:none;}
  .modal .box{background:var(--card);border-radius:14px;width:100%;max-width:620px;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.25);}
  .modal h2{margin:0 0 14px;font-size:18px;color:var(--heading);}
  .modal label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 5px;}
  .modal input,.modal select,.modal textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;font:13.5px var(--sans);background:var(--card);color:var(--text);}
  .modal textarea{min-height:90px;resize:vertical;}
  .modal .two{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .hint{font-size:12px;color:var(--muted);margin:4px 0 0;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Dev Desk</h1>
  <p class="sub" id="subLine">Loading…</p>
  <div id="msg"></div>

  <div class="bar">
    <div class="tabs" id="tabs"></div>
    <div class="grow"></div>
    <input id="search_items" data-ro="allow" type="search" placeholder="Search by ref, title or module" oninput="render()">
    <select id="filter_dev" data-ro="allow" onchange="render()" hidden></select>
    <button class="btn pri" id="newBtn" data-ro="allow" onclick="openForm(null)" hidden>+ New work item</button>
  </div>

  <div class="card">
    <table>
      <thead><tr><th>Ref</th><th>Work item</th><th class="hide">Developer</th><th>Priority</th><th>Status</th><th class="hide">Updated</th></tr></thead>
      <tbody id="rows"><tr><td colspan="6" class="empty">Loading…</td></tr></tbody>
    </table>
  </div>
</div>

<!-- new / edit (Head of IT) -->
<div class="modal" id="formModal" hidden>
  <div class="box">
    <h2 id="formTitle">New work item</h2>
    <label for="f_title">Title</label>
    <input id="f_title" data-ro="allow" maxlength="200" placeholder="e.g. Gatepass PDF shows the wrong branch address">
    <label for="f_desc">What needs doing</label>
    <textarea id="f_desc" data-ro="allow" placeholder="What is wrong or what is wanted, who asked for it, and how to check it is done"></textarea>
    <div class="two">
      <div><label for="f_kind">Type</label>
        <select id="f_kind" data-ro="allow"><option value="bug">Bug</option><option value="troubleshooting">Troubleshooting</option><option value="change" selected>Change</option><option value="new_module">New module</option></select></div>
      <div><label for="f_priority">Priority</label>
        <select id="f_priority" data-ro="allow"><option value="low">Low</option><option value="normal" selected>Normal</option><option value="high">High</option><option value="urgent">Urgent</option></select></div>
    </div>
    <div class="two">
      <div><label for="f_module">Module</label><input id="f_module" data-ro="allow" list="moduleList" placeholder="e.g. Gatepass"><datalist id="moduleList"></datalist></div>
      <div><label for="f_due">Due date</label><input id="f_due" data-ro="allow" type="date"></div>
    </div>
    <label for="f_assignee">Developer</label>
    <select id="f_assignee" data-ro="allow"></select>
    <div class="msg err" id="formErr" hidden></div>
    <div class="foot"><button class="btn" data-ro="allow" onclick="closeForm()">Cancel</button><button class="btn pri" id="formSave" data-ro="allow" onclick="saveForm()">Save</button></div>
  </div>
</div>

<!-- ready for test (Developer) -->
<div class="modal" id="readyModal" hidden>
  <div class="box">
    <h2>Ready for test</h2>
    <p class="hint">The Head of IT will open the preview link to check the work on the test database before approving it.</p>
    <label for="r_preview">Preview link (from Vercel)</label>
    <input id="r_preview" data-ro="allow" placeholder="https://rumbu-git-….vercel.app">
    <label for="r_branch">GitHub branch</label>
    <input id="r_branch" data-ro="allow" placeholder="e.g. fix-gatepass-pdf">
    <label for="r_sql">SQL to run on live, if any</label>
    <textarea id="r_sql" data-ro="allow" placeholder="Paste the SQL, or the file name in the pull request. Leave empty if none."></textarea>
    <label for="r_note">Note for the Head of IT</label>
    <textarea id="r_note" data-ro="allow" placeholder="What changed and what to test"></textarea>
    <div class="msg err" id="readyErr" hidden></div>
    <div class="foot"><button class="btn" data-ro="allow" onclick="document.getElementById('readyModal').hidden=true">Cancel</button><button class="btn pri" id="readySave" data-ro="allow" onclick="sendReady()">Mark ready for test</button></div>
  </div>
</div>

<script>
const STATUS = {
  raised: "Not assigned", assigned: "Assigned", in_progress: "In progress", ready_for_test: "Ready for test",
  sent_back: "Sent back", approved: "Approved", live: "Live", closed: "Closed"
};
const KIND = { bug: "Bug", troubleshooting: "Troubleshooting", change: "Change", new_module: "New module" };
const PRIO = { low: "Low", normal: "Normal", high: "High", urgent: "Urgent" };
const PRIO_ORDER = { urgent: 0, high: 1, normal: 2, low: 3 };
const TABS = [
  { k: "open",   label: "Open",           test: s => ["raised", "assigned", "in_progress", "sent_back"].includes(s) },
  { k: "test",   label: "Ready for test", test: s => s === "ready_for_test" },
  { k: "done",   label: "Approved and live", test: s => ["approved", "live"].includes(s) },
  { k: "closed", label: "Closed",         test: s => s === "closed" },
  { k: "all",    label: "All",            test: () => true }
];
let ME = null, IS_HEAD = false, ITEMS = [], EVENTS = {}, DEVS = [], OPEN_ID = null, TAB = "open", EDITING = null;

const esc = t => String(t == null ? "" : t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const when = iso => iso ? new Date(iso).toLocaleString("en-GB", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
const day = iso => iso ? new Date(iso + (iso.length === 10 ? "T00:00:00" : "")).toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }) : "";
const devName = id => { if(!id) return "Not assigned"; if(ME && id === ME.id) return "You"; const d = DEVS.find(x => x.id === id); return d ? d.full_name : "Developer"; };
function say(text, cls){ const m = document.getElementById("msg"); m.innerHTML = text ? '<div class="msg ' + (cls || "ok") + '">' + esc(text) + "</div>" : ""; }

async function init(){
  ME = await requireAuth("../../login.html");
  if(!ME) return;
  IS_HEAD = !!ME.isHeadOfIt;
  if(!IS_HEAD && !ME.isDeveloper){
    document.getElementById("subLine").textContent = "The Dev Desk is for the IT team.";
    document.getElementById("rows").innerHTML = '<tr><td colspan="6" class="empty">Only the Head of IT and the IT developers use the Dev Desk.</td></tr>';
    return;
  }
  document.getElementById("subLine").textContent = IS_HEAD
    ? "Raise work for the developers, follow it through testing, and approve it before it goes live."
    : "Your work items. Start them, test on a preview link, then mark them ready for the Head of IT.";
  if(IS_HEAD){
    document.getElementById("newBtn").hidden = false;
    const { data } = await sb.rpc("dev_developers");
    DEVS = data || [];
    const f = document.getElementById("filter_dev");
    f.innerHTML = '<option value="">All developers</option>' + DEVS.map(d => '<option value="' + d.id + '">' + esc(d.full_name) + "</option>").join("") + '<option value="none">Not assigned</option>';
    f.hidden = false;
    document.getElementById("f_assignee").innerHTML = '<option value="">Not assigned yet</option>' + DEVS.map(d => '<option value="' + d.id + '">' + esc(d.full_name) + "</option>").join("");
    const mods = await sb.from("modules").select("name").order("name");
    document.getElementById("moduleList").innerHTML = (mods.data || []).map(m => '<option value="' + esc(m.name) + '">').join("");
  }
  await load();
}

async function load(){
  const { data, error } = await sb.from("dev_work_items").select("*").order("updated_at", { ascending: false }).limit(500);
  if(error){
    document.getElementById("rows").innerHTML = '<tr><td colspan="6" class="empty">Could not load the Dev Desk: ' + esc(error.message) + "</td></tr>";
    return;
  }
  ITEMS = data || [];
  if(OPEN_ID) await loadEvents(OPEN_ID);
  render();
}
async function loadEvents(id){
  const { data } = await sb.from("dev_work_events").select("*").eq("item_id", id).order("created_at", { ascending: false });
  EVENTS[id] = data || [];
}

function visible(){
  const q = document.getElementById("search_items").value.trim().toLowerCase();
  const dv = IS_HEAD ? document.getElementById("filter_dev").value : "";
  return ITEMS.filter(i => {
    if(q && !(i.ref + " " + i.title + " " + (i.module || "")).toLowerCase().includes(q)) return false;
    if(dv === "none" && i.assignee) return false;
    if(dv && dv !== "none" && i.assignee !== dv) return false;
    return true;
  });
}

function render(){
  const list = visible();
  document.getElementById("tabs").innerHTML = TABS.map(t =>
    '<button data-ro="allow" class="' + (t.k === TAB ? "on" : "") + '" onclick="setTab(\'' + t.k + '\')">' + t.label +
    '<span class="n">' + list.filter(i => t.test(i.status)).length + "</span></button>").join("");
  const tab = TABS.find(t => t.k === TAB);
  const rows = list.filter(i => tab.test(i.status)).sort((a, b) =>
    TAB === "open" ? (PRIO_ORDER[a.priority] - PRIO_ORDER[b.priority]) || (b.updated_at > a.updated_at ? 1 : -1) : (b.updated_at > a.updated_at ? 1 : -1));
  const body = document.getElementById("rows");
  if(!rows.length){
    body.innerHTML = '<tr><td colspan="6" class="empty">' + (ITEMS.length ? "Nothing here." : (IS_HEAD ? "No work items yet. Press + New work item to raise the first one." : "No work items have been assigned to you yet.")) + "</td></tr>";
    return;
  }
  body.innerHTML = rows.map(i =>
    '<tr class="row' + (i.id === OPEN_ID ? " open" : "") + '" onclick="toggle(' + i.id + ')">' +
    '<td class="ref">' + esc(i.ref) + "</td>" +
    '<td class="t"><b>' + esc(i.title) + "</b><small>" + esc([i.module, KIND[i.kind]].filter(Boolean).join(" · ")) + (i.due_date ? " · due " + esc(day(i.due_date)) : "") + "</small></td>" +
    '<td class="hide">' + esc(devName(i.assignee)) + "</td>" +
    '<td class="p-' + i.priority + '">' + PRIO[i.priority] + "</td>" +
    '<td><span class="pill s-' + i.status + '">' + STATUS[i.status] + "</span></td>" +
    '<td class="hide muted">' + esc(when(i.updated_at)) + "</td></tr>" +
    (i.id === OPEN_ID ? '<tr class="detail"><td colspan="6">' + detail(i) + "</td></tr>" : "")
  ).join("");
}
function setTab(k){ TAB = k; render(); }
async function toggle(id){
  if(OPEN_ID === id){ OPEN_ID = null; render(); return; }
  OPEN_ID = id; await loadEvents(id); render();
}

function actionsFor(i){
  const b = (label, fn, cls) => '<button class="btn ' + (cls || "") + '" data-ro="allow" onclick="event.stopPropagation();' + fn + '">' + label + "</button>";
  const out = [];
  if(IS_HEAD){
    out.push(b("Edit", "openForm(" + i.id + ")"));
    if(i.status === "ready_for_test"){ out.push(b("Approve", "step(" + i.id + ",'approved')", "ok")); out.push(b("Send back", "step(" + i.id + ",'sent_back')", "bad")); }
    if(i.status === "approved") out.push(b("Mark live", "step(" + i.id + ",'live')", "ok"));
    if(!["closed", "live"].includes(i.status)) out.push(b("Close", "step(" + i.id + ",'closed')"));
    if(["closed", "live"].includes(i.status)) out.push(b("Reopen", "step(" + i.id + ",'" + (i.assignee ? "assigned" : "raised") + "')"));
  } else if(i.assignee === ME.id){
    if(["assigned", "sent_back"].includes(i.status)) out.push(b("Start work", "step(" + i.id + ",'in_progress')", "pri"));
    if(i.status === "in_progress") out.push(b("Mark ready for test", "openReady(" + i.id + ")", "pri"));
  }
  return out.join("");
}

function detail(i){
  const ev = EVENTS[i.id] || [];
  const facts = [
    ["Type", KIND[i.kind]], ["Module", i.module || "—"], ["Priority", PRIO[i.priority]], ["Developer", devName(i.assignee)],
    ["Due", i.due_date ? day(i.due_date) : "—"], ["Raised", when(i.created_at)],
    ["GitHub branch", i.git_branch || "—"],
    ["Preview link", i.preview_url ? '<a href="' + esc(i.preview_url) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">' + esc(i.preview_url) + "</a>" : "—"]
  ];
  const evLine = e => {
    let what = e.action === "raised" ? "Raised" : e.action === "assigned" ? "Assignment changed" : e.action === "edited" ? "Details edited"
      : e.action === "note" ? "Note" : (STATUS[e.from_status] || e.from_status || "") + " → " + (STATUS[e.to_status] || e.to_status);
    return "<li><div><b>" + esc(what) + '</b> <span class="w">' + esc(e.actor_name || "") + " · " + esc(when(e.created_at)) + "</span></div>" +
      (e.note ? '<div class="n">' + esc(e.note) + "</div>" : "") + "</li>";
  };
  const canNote = IS_HEAD || i.assignee === ME.id;
  return '<div class="dgrid" onclick="event.stopPropagation()"><div>' +
    '<p class="desc">' + (i.description ? esc(i.description) : '<span class="muted">No description.</span>') + "</p>" +
    '<dl class="facts">' + facts.map(f => "<dt>" + f[0] + "</dt><dd>" + (f[0] === "Preview link" ? f[1] : esc(f[1])) + "</dd>").join("") + "</dl>" +
    (i.sql_needed ? "<h3>SQL to run on live</h3><pre class=\"sql\">" + esc(i.sql_needed) + "</pre>" : "") +
    '<div class="acts">' + actionsFor(i) + "</div></div><div>" +
    (canNote ? '<div class="note-box"><textarea id="note_' + i.id + '" data-ro="allow" placeholder="Add a note"></textarea><button class="btn" data-ro="allow" onclick="addNote(' + i.id + ')">Add note</button></div>' : "") +
    "<h3>History</h3><ul class=\"tl\">" + (ev.length ? ev.map(evLine).join("") : '<li class="muted">Nothing yet.</li>') + "</ul></div></div>";
}

async function run(fn, args, okText){
  const { error } = await sb.rpc(fn, args);
  if(error){ say(error.message, "err"); return false; }
  say(okText, "ok"); await load(); return true;
}
async function step(id, to){
  const i = ITEMS.find(x => x.id === id); if(!i) return;
  let note = null;
  if(to === "sent_back"){ note = prompt("What needs changing? The developer sees this note.", ""); if(note === null) return; if(!note.trim()){ say("Say what needs changing when sending it back.", "err"); return; } }
  else if(to === "approved"){ if(!confirm("Approve " + i.ref + "? Merge its pull request on GitHub, run any SQL on live, then press Mark live.")) return; }
  else if(to === "live"){ note = prompt("Mark " + i.ref + " as live. Add a note if you like (for example the commit or merge):", ""); if(note === null) return; }
  else if(to === "closed"){ note = prompt("Close " + i.ref + "? Add a reason if you like:", ""); if(note === null) return; }
  await run("dev_change_status", { p_id: id, p_to: to, p_note: note, p_preview: null, p_branch: null, p_sql: null }, i.ref + ": " + STATUS[to] + ".");
}
async function addNote(id){
  const t = document.getElementById("note_" + id); const v = t ? t.value.trim() : "";
  if(!v) return;
  await run("dev_add_note", { p_id: id, p_note: v }, "Note added.");
}

function openForm(id){
  EDITING = id ? ITEMS.find(x => x.id === id) : null;
  const i = EDITING || {};
  document.getElementById("formTitle").textContent = EDITING ? "Edit " + EDITING.ref : "New work item";
  document.getElementById("f_title").value = i.title || "";
  document.getElementById("f_desc").value = i.description || "";
  document.getElementById("f_kind").value = i.kind || "change";
  document.getElementById("f_priority").value = i.priority || "normal";
  document.getElementById("f_module").value = i.module || "";
  document.getElementById("f_due").value = i.due_date || "";
  document.getElementById("f_assignee").value = i.assignee || "";
  document.getElementById("formErr").hidden = true;
  document.getElementById("formModal").hidden = false;
  document.getElementById("f_title").focus();
}
function closeForm(){ document.getElementById("formModal").hidden = true; }
async function saveForm(){
  const v = id => document.getElementById(id).value;
  const err = document.getElementById("formErr");
  if(v("f_title").trim().length < 3){ err.textContent = "Give it a title of at least 3 characters."; err.hidden = false; return; }
  const btn = document.getElementById("formSave"); btn.disabled = true;
  const args = { p_title: v("f_title"), p_description: v("f_desc"), p_kind: v("f_kind"), p_module: v("f_module"),
                 p_priority: v("f_priority"), p_assignee: v("f_assignee") || null, p_due: v("f_due") || null };
  const res = EDITING ? await sb.rpc("dev_update_item", Object.assign({ p_id: EDITING.id }, args)) : await sb.rpc("dev_create_item", args);
  btn.disabled = false;
  if(res.error){ err.textContent = res.error.message; err.hidden = false; return; }
  closeForm();
  if(!EDITING && res.data){ OPEN_ID = res.data; TAB = "open"; }
  say(EDITING ? EDITING.ref + " updated." : "Work item raised.", "ok");
  await load();
}

let READY_ID = null;
function openReady(id){
  const i = ITEMS.find(x => x.id === id); READY_ID = id;
  document.getElementById("r_preview").value = i.preview_url || "";
  document.getElementById("r_branch").value = i.git_branch || "";
  document.getElementById("r_sql").value = i.sql_needed || "";
  document.getElementById("r_note").value = "";
  document.getElementById("readyErr").hidden = true;
  document.getElementById("readyModal").hidden = false;
}
async function sendReady(){
  const v = id => document.getElementById(id).value.trim();
  const err = document.getElementById("readyErr");
  if(!READY_ID){ document.getElementById("readyModal").hidden = true; return; }
  if(!/^https:\/\/\S+$/.test(v("r_preview"))){ err.textContent = "Paste the preview link from Vercel (it starts with https://)."; err.hidden = false; return; }
  const btn = document.getElementById("readySave"); btn.disabled = true;
  const { error } = await sb.rpc("dev_change_status", { p_id: READY_ID, p_to: "ready_for_test", p_note: v("r_note") || null,
    p_preview: v("r_preview"), p_branch: v("r_branch") || null, p_sql: v("r_sql") || null });
  btn.disabled = false;
  if(error){ err.textContent = error.message; err.hidden = false; return; }
  document.getElementById("readyModal").hidden = true;
  say("Marked ready for test. The Head of IT will check the preview link.", "ok");
  await load();
}

document.addEventListener("keydown", e => { if(e.key === "Escape"){ closeForm(); document.getElementById("readyModal").hidden = true; } });
init();
</script>
