<!DOCTYPE html>

<title>Weekly Downtime Report</title>
<link rel="stylesheet" href="../../styles.css">
<script>
  (function(){
    function apply(t){ if(t) document.documentElement.setAttribute("data-theme", t); }
    window.addEventListener("message", function(e){ if(e.data && e.data.rumbuTheme) apply(e.data.rumbuTheme); });
    try{ apply(localStorage.getItem("rumbu_theme")); }catch(e){}
  })();

<style>
  :root{--navy:var(--heading);}
  *{box-sizing:border-box;}
  body{font-family:var(--sans);background:var(--bg);margin:0;padding:16px;}
  .container{max-width:520px;margin:0 auto 16px;background:var(--card);padding:22px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.15);}
  h3{text-align:center;color:var(--navy);margin-top:0;}
  label{font-weight:600;margin-top:10px;display:block;}
  input,select{width:100%;padding:8px;margin-top:5px;border:1px solid var(--line);border-radius:6px;}
  button{width:100%;padding:10px;margin-top:16px;background:var(--navy);color:#fff;border:none;border-radius:6px;font-size:15px;cursor:pointer;}
  button.alt{background:#38761d;}
  #status{margin-top:12px;text-align:center;font-weight:bold;font-size:13px;}
  .wide{max-width:1100px;margin:0 auto;}
  table{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px;background:var(--card);}
  th,td{border:1px solid #333;padding:5px;text-align:center;}
  th{background:var(--navy);color:#fff;}
  /* ── Job Code autocomplete ── */
  .jc-wrap{position:relative;margin-top:5px;}
  .jc-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#888;font-size:16px;line-height:1;padding:0;width:auto;display:none;}
  .jc-clear:hover{color:#e53935;}
  .jc-dropdown{position:absolute;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--line);border-top:none;border-radius:0 0 6px 6px;max-height:200px;overflow-y:auto;z-index:999;display:none;box-shadow:0 4px 8px rgba(0,0,0,.15);}
  .jc-option{padding:7px 10px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line);}
  .jc-option:last-child{border-bottom:none;}
  .jc-option:hover,.jc-option.active{background:var(--accent);color:#fff;}
  .jc-match{font-weight:700;}
  .jc-empty{padding:10px;text-align:center;color:#888;font-size:13px;}
  .jc-badge{display:inline-block;background:rgba(46,117,182,.15);color:var(--heading);border:1px solid var(--accent);border-radius:4px;padding:1px 7px;font-size:12px;font-weight:700;margin-left:6px;vertical-align:middle;}
  @media print{ .no-print{display:none !important;} }
</style>

// ── Job Code autocomplete state ──
let jobCodePool = [];
function naturalSort(a,b){ return a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'}); }
function rebuildJobCodeList(){
  const dept = document.getElementById("department").value;
  const codes = getJobCodesByDepartment(dept);
  jobCodePool = [...new Set(codes)].sort(naturalSort);
}

function getJobCodesByDepartment(department){
  if(department === "All") return Object.values(DEPARTMENTS).flat();
  return DEPARTMENTS[department] || [];
}

function getWeekDateRange(year, week){
  const simple = new Date(year, 0, 4);
  const dayOfWeek = simple.getDay() || 7;
  const mondayWeek1 = new Date(simple);
  mondayWeek1.setDate(simple.getDate() - dayOfWeek + 1);
  const start = new Date(mondayWeek1);
  start.setDate(mondayWeek1.getDate() + (week-1)*7);
  const end = new Date(start);
  end.setDate(start.getDate() + 6);
  return { startDate: fmtDate(start), endDate: fmtDate(end) };
}
function getMonthDateRange(year, month){
  const start = new Date(year, month-1, 1);
  const end = new Date(year, month, 0);
  return { startDate: fmtDate(start), endDate: fmtDate(end) };
}


// Fetch ALL rows from a table, paginating past Supabase's 1000-row cap.
async function fetchAllRows(table, select, query){
  let all = [], offset = 0; const pageSize = 1000; const q = query||"";
  for(let guard=0; guard<500; guard++){
    const headers = Object.assign({}, authHeaders(), { "Range-Unit":"items", "Range": offset + "-" + (offset+pageSize-1) });
    const res = await fetch(SUPABASE_URL + "/rest/v1/" + table + "?select=" + (select||"*") + q + "&order=id.asc", { headers });
    if(!res.ok) throw new Error(table + ": HTTP " + res.status);
    const batch = await res.json();
    all = all.concat(batch);
    if(batch.length < pageSize) break;
    offset += pageSize;
  }
  return all;
}

function normalizeControlRow(r){
  if(r.date_col === undefined) r.date_col = r.date;
  if(r.names === undefined) r.names = r.nurse_name;
  if(r.stop_time === undefined) r.stop_time = r.mc_stoppage_time;
  if(r.extimated_time === undefined) r.extimated_time = r.estimated_duration;
  if(r.discription === undefined) r.discription = r.description;
  return r;
}

async function init(){
  const status = document.getElementById("status");
  const me = await requireAuth("../../login.html");
  if(!me) return;

  const mySections = (me.sectionNames && me.sectionNames.length) ? me.sectionNames : ["Rumbu Mainmat","MamaSannu"];
  document.getElementById("section").innerHTML = '<option>All</option>' +
    mySections.map(s=>`<option value="${s}">${SECTION_LABEL[s]||s}</option>`).join("");

  const weekSel = document.getElementById("week");
  for(let i=1;i<=53;i++){ const o=document.createElement("option"); o.value=i; o.textContent="Week "+i; weekSel.appendChild(o); }
  const deptSel = document.getElementById("department");
  const allOpt = document.createElement("option"); allOpt.value="All"; allOpt.textContent="All"; deptSel.appendChild(allOpt);
  Object.keys(DEPARTMENTS).forEach(name=>{ const o=document.createElement("option"); o.value=name; o.textContent=name; deptSel.appendChild(o); });
    deptSel.addEventListener("change", ()=>{ resetJobCode(); rebuildJobCodeList(); });
    rebuildJobCodeList();

  const today = new Date();
  const onejan = new Date(today.getFullYear(),0,1);
  const week = Math.ceil((((today-onejan)/86400000)+onejan.getDay()+1)/7);
  document.getElementById("week").value = week;
  document.getElementById("year").value = today.getFullYear();

  status.style.color="#1d8a4e"; status.textContent = "Ready. Choose a period and click Generate Report.";
}

function togglePeriod(){
  const type = document.getElementById("periodType").value;
  document.getElementById("week").style.display = "none";
  document.getElementById("weekLabel").style.display = "none";
  document.getElementById("month").style.display = "none";
  document.getElementById("monthLabel").style.display = "none";
  document.getElementById("customRange").style.display = "none";
  if(type === "Weekly"){ document.getElementById("week").style.display="block"; document.getElementById("weekLabel").style.display="block"; }
  else if(type === "Monthly"){ document.getElementById("month").style.display="block"; document.getElementById("monthLabel").style.display="block"; }
  else if(type === "Custom"){ document.getElementById("customRange").style.display="block"; }
}

function normalizeCode(c){ return String(c||"").trim().toUpperCase().replace(/\.0+$/,""); }

function filterRows(range, department, shift, section, jobCode){
  // If a specific job code is selected, filter to ONLY that code.
  // Otherwise use the full department allow-list (excludes unlisted codes like OPR01, BR01, etc.)
  const jobCodes = (jobCode && jobCode !== "All")
    ? [jobCode]
    : getJobCodesByDepartment(department);
  const jobSet = new Set(jobCodes.map(normalizeCode));
  return CTRL_ROWS.filter(r=>{
    if(!r.stop_time || !r.starting_time || !r.finish_time) return false; // matches GAS WHERE ... IS NOT NULL
    // Use the date from mc_stoppage_time (matches old script's DATE(MC_Stoppage_Time) BETWEEN)
    const stopDate = r.stop_time ? r.stop_time.slice(0,10) : r.date_col;
    if(stopDate < range.startDate || stopDate > range.endDate) return false;
    // Job code: normalize both sides
    if(!jobSet.has(normalizeCode(r.job_code))) return false; // exclude codes not in any known department
    // Shift: case-insensitive
    if(shift !== "All" && (r.shift||"").trim().toUpperCase() !== shift.toUpperCase()) return false;
    // Section: match old AppScript's LIKE logic exactly
    // Rumbu Mainmat = NOT LIKE '%MAMASANNU%' (includes NULLs and other non-MamaSannu sections)
    // MamaSannu = LIKE '%MAMASANNU%' (matches "MamaSannu Extruder" variants too)
    if(section !== "All"){
      const sec = (r.section||"").toUpperCase().trim();
      if(section === "MamaSannu" && !sec.includes("MAMASANNU")) return false;
      if(section === "Rumbu Mainmat" && sec.includes("MAMASANNU")) return false;
      if(section !== "MamaSannu" && section !== "Rumbu Mainmat" && sec !== section.toUpperCase()) return false;
    }
    return true;
  });
}

function summariseRange(range, department, shift, section, jobCode){
  const rows = filterRows(range, department, shift, section, jobCode);
  let downtime=0, repair=0, waiting=0;
  rows.forEach(r=>{
    const stop=parseDT(r.stop_time), start=parseDT(r.starting_time), finish=parseDT(r.finish_time);
    downtime += minutesBetween(stop, finish);
    repair += minutesBetween(start, finish);
    waiting += minutesBetween(stop, start);
  });
  return { count: rows.length, downtime, repair, waiting,
    efficiency: repair>0 ? (repair/(repair+waiting))*100 : 0 };
}

function get5PeriodSummary(periodType, year, week, month, startDate, endDate, department, shift, section, jobCode){
  const summary = [];
  if(periodType === "Monthly"){
    for(let i=4;i>=0;i--){
      let m = Number(month)-i, y = Number(year);
      while(m<=0){ m+=12; y-=1; }
      const range = getMonthDateRange(y,m);
      const s = summariseRange(range, department, shift, section, jobCode);
      summary.push({ label: y+"-"+String(m).padStart(2,"0"), ...s });
    }
  } else if(periodType === "Custom"){
    const start = new Date(startDate), end = new Date(endDate);
    const intervalDays = Math.floor((end-start)/86400000)+1;
    for(let i=4;i>=0;i--){
      const rangeEnd = new Date(end); rangeEnd.setDate(end.getDate()-(intervalDays*i));
      const rangeStart = new Date(rangeEnd); rangeStart.setDate(rangeEnd.getDate()-intervalDays+1);
      const range = { startDate: fmtDate(rangeStart), endDate: fmtDate(rangeEnd) };
      const s = summariseRange(range, department, shift, section, jobCode);
      summary.push({ label: range.startDate+" &rarr; "+range.endDate, ...s });
    }
  } else {
    for(let i=4;i>=0;i--){
      const w = Number(week)-i;
      if(w<=0) continue;
      const range = getWeekDateRange(year, w);
      const s = summariseRange(range, department, shift, section, jobCode);
      summary.push({ label: "Week "+w, ...s });
    }
  }
  return summary;
}

(function initJC(){
  const jcInput    = document.getElementById("jobCodeInput");
  const jcDropdown = document.getElementById("jcDropdown");
  const jcHidden   = document.getElementById("jobCode");
  const jcClear    = document.getElementById("jcClear");
  const jcBadge    = document.getElementById("jcBadge");
  let activeIdx = -1;

  function escHtml(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  function renderDropdown(q){
    activeIdx = -1;
    jcDropdown.innerHTML = "";
    const matches = q
      ? jobCodePool.filter(j=>j.toUpperCase().includes(q))
      : jobCodePool.slice(0,80);
    if(!matches.length){
      jcDropdown.innerHTML = "<div class=\"jc-empty\">No matching job codes</div>";
      jcDropdown.style.display = "block"; return;
    }
    matches.forEach(code=>{
      const div = document.createElement("div");
      div.className = "jc-option"; div.dataset.value = code;
      if(q){
        const idx = code.toUpperCase().indexOf(q);
        div.innerHTML = escHtml(code.slice(0,idx))+"<span class=\"jc-match\">"+escHtml(code.slice(idx,idx+q.length))+"</span>"+escHtml(code.slice(idx+q.length));
      } else { div.textContent = code; }
      div.addEventListener("mousedown", e=>{ e.preventDefault(); selectJobCode(code); });
      jcDropdown.appendChild(div);
    });
    jcDropdown.style.display = "block";
  }

  function highlightItem(items){
    items.forEach((el,i)=>{ el.classList.toggle("active", i===activeIdx); if(i===activeIdx) el.scrollIntoView({block:"nearest"}); });
  }

  function selectJobCode(code){
    jcHidden.value = code; jcInput.value = code;
    jcBadge.textContent = code; jcBadge.style.display = "inline-block";
    jcClear.style.display = "block"; closeDropdown();
  }

  function resetJobCode(){
    jcHidden.value = "All"; jcInput.value = "";
    jcBadge.style.display = "none"; jcClear.style.display = "none"; closeDropdown();
  }

  function closeDropdown(){ jcDropdown.style.display = "none"; activeIdx = -1; }

  jcInput.addEventListener("input", function(){
    const q = this.value.trim().toUpperCase();
    jcHidden.value = "All"; jcBadge.style.display = "none";
    jcClear.style.display = this.value ? "block" : "none";
    renderDropdown(q);
  });
  jcInput.addEventListener("focus", function(){ if(this.value.trim()) renderDropdown(this.value.trim().toUpperCase()); });
  jcInput.addEventListener("keydown", function(e){
    const items = jcDropdown.querySelectorAll(".jc-option");
    if(e.key==="ArrowDown"){ e.preventDefault(); activeIdx=Math.min(activeIdx+1,items.length-1); highlightItem(items); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); activeIdx=Math.max(activeIdx-1,0); highlightItem(items); }
    else if(e.key==="Enter"){ e.preventDefault(); if(activeIdx>=0&&items[activeIdx]) selectJobCode(items[activeIdx].dataset.value); }
    else if(e.key==="Escape") closeDropdown();
  });
  jcClear.addEventListener("click", resetJobCode);
  document.addEventListener("click", e=>{ if(!e.target.closest(".jc-wrap")) closeDropdown(); });

  // expose resetJobCode globally so dept change listener can call it
  window.resetJobCode = resetJobCode;
})();

async function generate(){
  const year = Number(document.getElementById("year").value);
  const periodType = document.getElementById("periodType").value;
  const week = document.getElementById("week").value;
  const month = document.getElementById("month").value;
  const startDateI = document.getElementById("startDate").value;
  const endDateI = document.getElementById("endDate").value;
  const department = document.getElementById("department").value;
  const shift = document.getElementById("shift").value;
  const section = document.getElementById("section").value;
  const jobCode = document.getElementById("jobCode").value; // "All" or specific code

  let range;
  if(periodType === "Monthly") range = getMonthDateRange(year, month);
  else if(periodType === "Custom") range = { startDate: startDateI, endDate: endDateI };
  else range = getWeekDateRange(year, week);

  if(!range.startDate || !range.endDate){ alert("Please complete the period fields."); return; }

  // Fetch only the data span we need. For 5-period look-back we pull from the
  // prior year start (covers early-week/month look-back) up to the selected end.
  const status = document.getElementById("status");
  const fetchFrom = (periodType === "Custom") ? range.startDate : ((year-1) + "-01-01");
  const fetchTo   = (periodType === "Custom") ? range.endDate   : (year + "-12-31");
  status.style.color=""; status.textContent = "Loading…";
  try{
    // Use mc_stoppage_time filter to match old script's DATE(MC_Stoppage_Time) BETWEEN
  const ctrlQ = "&mc_stoppage_time=gte."+fetchFrom+"&mc_stoppage_time=lte."+fetchTo+"T23:59:59";
  CTRL_ROWS = await fetchAllRows("control","*", ctrlQ);
    CTRL_ROWS.forEach(normalizeControlRow);
  }catch(e){
    status.style.color="#c0392b"; status.textContent = "Could not read data: " + (e.message||e); return;
  }
  status.textContent = "";

  const summary5 = get5PeriodSummary(periodType, year, week, month, startDateI, endDateI, department, shift, section, jobCode);
  const rows = filterRows(range, department, shift, section, jobCode);

  if(!rows.length){
    document.getElementById("reportArea").innerHTML = "<p>⚠️ No data found for the selected filters.</p>";
    return;
  }

  // ---- main per-job-code table ----
  const byJob = {};
  rows.forEach(r=>{
    const j = r.job_code || "(blank)";
    if(!byJob[j]) byJob[j] = { job:j, count:0, downtime:0, repair:0, waiting:0, est:0 };
    const stop=parseDT(r.stop_time), start=parseDT(r.starting_time), finish=parseDT(r.finish_time);
    byJob[j].count++;
    byJob[j].downtime += minutesBetween(stop, finish);
    byJob[j].repair += minutesBetween(start, finish);
    byJob[j].waiting += minutesBetween(stop, start);
    byJob[j].est += Math.ceil(extractNumber(r.extimated_time)); // ceil per-row to match GAS
  });
  const jobData = Object.values(byJob).map(r=>({ ...r, eff: r.repair>0 ? (r.est/r.repair)*100 : 0 }))
    .sort((a,b)=>b.count-a.count);
  const worstSet = new Set([...jobData].sort((a,b)=>b.downtime-a.downtime).slice(0,5).map(x=>x.job));

  let reportTitle = periodType==="Monthly" ? "Monthly Downtime Report" : periodType==="Custom" ? "Custom Downtime Report" : "Weekly Downtime Report";
  let periodLabel = periodType==="Monthly" ? "Month: "+month : periodType==="Custom" ? "Custom Report" : "Week: "+week;
  const isSpecificCode = jobCode && jobCode !== "All";
  const jobCodeLabel = isSpecificCode ? "Job Code: "+jobCode : "Department: "+department;

  let html = `<h2 style="text-align:center;">${reportTitle}</h2>
    <p style="text-align:center;">Year: ${year} | ${periodType} ${periodLabel} | ${jobCodeLabel} (${range.startDate} &rarr; ${range.endDate})</p>
    <table><tr><th>Job</th><th>Count</th><th>Downtime</th><th>Repair</th><th>Waiting</th><th>Est</th><th>%</th></tr>`;

  let tC=0,tD=0,tR=0,tW=0,tE=0;
  jobData.forEach(r=>{
    tC+=r.count; tD+=Math.ceil(r.downtime); tR+=Math.ceil(r.repair); tW+=Math.ceil(r.waiting); tE+=Math.ceil(r.est);
    html += `<tr style="${worstSet.has(r.job)?'background:rgba(176,42,55,.18)':''}"><td>${r.job}</td><td>${r.count}</td>` +
      `<td>${Math.ceil(r.downtime)}</td><td>${Math.ceil(r.repair)}</td><td>${Math.ceil(r.waiting)}</td>` +
      `<td>${Math.ceil(r.est)}</td><td>${r.eff.toFixed(1)}%</td></tr>`;
  });
  html += `<tr style="background:var(--heading);color:#fff"><td>TOTAL</td><td>${tC}</td><td>${tD}</td><td>${tR}</td><td>${tW}</td><td>${tE}</td><td>-</td></tr></table>`;

  // ---- 5-period trailing summary ----
  if(summary5.length){
    html += `<br><h3 style="text-align:center;">Last 5 ${periodType==="Monthly"?"Months":"Weeks"}</h3>
      <table><tr><th>${periodType==="Monthly"?"Month":"Week"}</th><th>Count</th><th>Downtime</th><th>Repair</th><th>Waiting</th><th>%</th></tr>`;
    summary5.forEach(w=>{
      html += `<tr><td>${w.label}</td><td>${w.count}</td><td>${Math.round(w.downtime)}</td><td>${Math.round(w.repair)}</td>` +
        `<td>${Math.round(w.waiting)}</td><td>${w.efficiency.toFixed(1)}%</td></tr>`;
    });
    html += "</table>";
  }

  // ---- Asset Breakdown: Job Code > Shed > Asset, with subtotals ----
  const assetRows = [...rows].sort((a,b)=>{
    return (a.job_code||"").localeCompare(b.job_code||"") ||
      (a.shed||"").toString().localeCompare((b.shed||"").toString()) ||
      (a.assets||"").localeCompare(b.assets||"");
  });

  html += `<br><h3 style="text-align:center;">Asset Breakdown (Job Code Structure)</h3>
    <p style="text-align:center;">${jobCodeLabel} | Shift: ${shift} | Section: ${section}</p>
    <table><tr><th>Asset</th><th>Work Order</th><th>Nurse</th><th>Date</th><th>D</th><th>R</th><th>W</th><th>E</th></tr>`;

  let currentJob="", currentShed="", currentAsset="";
  let countWO=0, sumDown=0, sumRep=0, sumWait=0, sumEst=0;
  let gd=0, gr=0, gw=0, ge=0;

  function subtotalRow(){
    return `<tr style="background:var(--bg);font-weight:bold;color:var(--heading)"><td colspan="4">${currentAsset} (WO: ${countWO})</td>` +
      `<td>${Math.ceil(sumDown)}</td><td>${Math.ceil(sumRep)}</td><td>${Math.ceil(sumWait)}</td><td>${Math.ceil(sumEst)}</td></tr>`;
  }

  assetRows.forEach(r=>{
    const job = r.job_code || "", shed = r.shed!=null ? String(r.shed) : "", asset = r.assets || "";

    if(currentJob !== job){
      if(currentAsset !== "") html += subtotalRow();
      html += `<tr style="background:var(--heading);color:#fff;font-weight:bold"><td colspan="8">JOB CODE: ${job}</td></tr>`;
      currentJob = job; currentShed=""; currentAsset="";
      countWO=0; sumDown=0; sumRep=0; sumWait=0; sumEst=0;
    }
    if(currentShed !== shed){
      if(currentAsset !== "") html += subtotalRow();
      html += `<tr style="background:rgba(46,117,182,.18);font-weight:bold;color:var(--heading)"><td colspan="8">SHED: ${shed}</td></tr>`;
      currentShed = shed; currentAsset="";
      countWO=0; sumDown=0; sumRep=0; sumWait=0; sumEst=0;
    }
    if(currentAsset !== asset){
      if(currentAsset !== "") html += subtotalRow();
      currentAsset = asset;
      countWO=0; sumDown=0; sumRep=0; sumWait=0; sumEst=0;
    }

    const stop=parseDT(r.stop_time), start=parseDT(r.starting_time), finish=parseDT(r.finish_time);
    const down = minutesBetween(stop, finish), rep = minutesBetween(start, finish), wait = minutesBetween(stop, start);
    const est = extractNumber(r.extimated_time);

    const estC = Math.ceil(est); // ceil per-row to match GAS
    countWO++; sumDown+=down; sumRep+=rep; sumWait+=wait; sumEst+=estC;
    gd+=down; gr+=rep; gw+=wait; ge+=estC;

    const label = [asset, r.discription, r.part_needed].filter(Boolean).join(" / ") + (job ? " / "+job : "");
    html += `<tr><td>${label}</td><td>${r.work_order||""}</td><td>${r.names||""}</td><td>${r.date_col||""}</td>` +
      `<td>${down}</td><td>${rep}</td><td>${wait}</td><td>${Math.ceil(est)}</td></tr>`;
  });
  if(currentAsset !== "") html += subtotalRow();

  html += `<tr style="background:var(--heading);color:#fff;font-weight:bold"><td colspan="4">GRAND TOTAL</td>` +
    `<td>${Math.ceil(gd)}</td><td>${Math.ceil(gr)}</td><td>${Math.ceil(gw)}</td><td>${Math.ceil(ge)}</td></tr></table>`;

  document.getElementById("reportArea").innerHTML = html;
}

init();
togglePeriod();
</script>
