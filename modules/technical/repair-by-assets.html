<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Repair by Assets</title>
<link rel="stylesheet" href="../../styles.css">
<script>
  (function(){
    function apply(t){ if(t) document.documentElement.setAttribute("data-theme", t); }
    window.addEventListener("message", function(e){ if(e.data && e.data.rumbuTheme) apply(e.data.rumbuTheme); });
    try{ apply(localStorage.getItem("rumbu_theme")); }catch(e){}
  })();
</script>
<style>
  :root{--navy:var(--heading);}
  *{box-sizing:border-box;}
  body{font-family:var(--sans);background:var(--bg);margin:0;padding:16px;}
  .container{max-width:520px;margin:0 auto 16px;background:var(--card);border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.1);padding:20px;}
  h3{text-align:center;color:var(--navy);}
  label{font-weight:600;margin-top:10px;display:block;}
  input,select{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;margin-bottom:8px;}
  button{width:100%;padding:10px;background:var(--navy);color:#fff;font-weight:bold;border:none;border-radius:6px;cursor:pointer;margin-top:6px;}
  button.alt{background:#38761d;}
  #status{text-align:center;margin-top:10px;font-weight:bold;font-size:13px;}
  .wide{max-width:1100px;margin:0 auto;background:var(--card);border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.1);padding:20px;}
  table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px;}
  th,td{border:1px solid #333;padding:5px;text-align:center;white-space:nowrap;}
  th{background:var(--navy);color:#fff;}
  .green{background:#A5D6A7;} .red{background:#FFCDD2;}
  @media print{ .no-print{display:none !important;} }
</style>
</head>
<body>

<div class="container no-print">
  <h3>🛠️ Repair by Assets Report</h3>
  <label>Start Date</label><input type="date" id="startDate">
  <label>End Date</label><input type="date" id="endDate">
  <label>Department</label>
  <select id="department"><option value="All">All</option></select>
  <label>Assets</label>
  <select id="assets"><option value="All">All</option></select>
  <label>Shift</label>
  <select id="shift"><option value="All">All</option><option>Morning</option><option>Night</option></select>
  <label>Section</label>
  <select id="section"><option value="All">All</option></select>
  <button onclick="generate()">Generate Report</button>
  <button class="alt no-print" onclick="window.print()">Print / Save as PDF</button>
  <div id="status">Ready — select dates and click Generate.</div>
</div>

<div id="reportArea"></div>

<script>
const SUPABASE_URL     = "https://betfhunzmhtdzgvufmfk.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_AfDp1FlHghu9TOfqEUj20Q_Pke7GlTp";

function authHeaders(){
  return {
    "apikey":        SUPABASE_ANON_KEY,
    "Authorization": "Bearer " + SUPABASE_ANON_KEY
  };
}

function parseDT(v){
  if(!v) return null;
  const d = new Date(v);
  return isNaN(d) ? null : d;
}

function minutesBetween(a, b){
  return (!a || !b) ? 0 : Math.round((b - a) / 60000);
}

function parseNum(v){
  // FIX: use parseFloat (matches SAFE_CAST in BigQuery)
  if(v == null) return 0;
  const n = parseFloat(String(v));
  return isNaN(n) ? 0 : n;
}

// FIX: safe field reader — treats null and undefined identically
function field(r, ...keys){
  for(const k of keys){
    const v = r[k];
    if(v !== null && v !== undefined && v !== "") return v;
  }
  return null;
}

// FIX: paginate with server-side date filter so we never
// load the full table — only the rows in the requested range.
async function fetchFiltered(startDate, endDate){
  let all = [], offset = 0; const pageSize = 1000;

  // Use mc_stoppage_time for date filtering — matches AppScript DATE(MC_Stoppage_Time)
  const dateFilter =
    "&mc_stoppage_time=gte." + startDate + "T00:00:00" +
    "&mc_stoppage_time=lte." + endDate   + "T23:59:59";

  for(let guard = 0; guard < 500; guard++){
    const headers = Object.assign({}, authHeaders(), {
      "Range-Unit": "items",
      "Range":      offset + "-" + (offset + pageSize - 1)
    });
    const res = await fetch(
      SUPABASE_URL + "/rest/v1/control?select=*" +
      dateFilter + "&order=mc_stoppage_time.desc",
      { headers }
    );
    if(!res.ok) throw new Error("control: HTTP " + res.status);
    const batch = await res.json();
    all = all.concat(batch);
    if(batch.length < pageSize) break;
    offset += pageSize;
  }
  return all;
}

// ── Init: just set default dates — do NOT load data yet ──
function init(){
  const today = new Date();
  const iso   = today.toISOString().slice(0, 10);
  const past  = new Date(today);
  past.setDate(today.getDate() - 7);
  document.getElementById("endDate").value   = iso;
  document.getElementById("startDate").value = past.toISOString().slice(0, 10);
}

// ── Generate: fetch only the needed date range ────────────
async function generate(){
  const status    = document.getElementById("status");
  const startDate = document.getElementById("startDate").value;
  const endDate   = document.getElementById("endDate").value;
  const department = document.getElementById("department").value;
  const assetFilt  = document.getElementById("assets").value;
  const shift      = document.getElementById("shift").value;
  const section    = document.getElementById("section").value;

  if(!startDate || !endDate){
    alert("Please select both dates.");
    return;
  }

  status.style.color = "#1565C0";
  status.textContent = "Loading…";
  document.getElementById("reportArea").innerHTML = "";

  let rows;
  try{
    rows = await fetchFiltered(startDate, endDate);
    status.textContent = "Loaded " + rows.length + " rows for date range.";
  }catch(e){
    status.style.color = "#c0392b";
    status.textContent = "Error: " + e.message;
    return;
  }

  if(!rows.length){
    document.getElementById("reportArea").innerHTML =
      `<div class="wide"><p>⚠️ No records found for ${startDate} → ${endDate}.</p></div>`;
    return;
  }

  // Populate dropdowns from the loaded data (after first generate)
  repopulateDropdown("department", rows, r => field(r,"department"));
  repopulateDropdown("assets",     rows, r => field(r,"assets"));
  repopulateDropdown("section",    rows, r => field(r,"section"));

  // ── Client-side filters ────────────────────────────────
  const filtered = rows.filter(r => {
    if(department !== "All"){
      const d = (field(r,"department")||"").trim();
      if(d !== department) return false;
    }
    if(assetFilt !== "All"){
      const a = (field(r,"assets")||"").trim();
      if(a !== assetFilt) return false;
    }
    if(shift !== "All" && r.shift !== shift) return false;
    if(section !== "All"){
      const sec = (field(r,"section")||"").toUpperCase().trim();
      const fSec = section.toUpperCase().trim();
      if(!sec.includes(fSec) && sec !== fSec) return false;
    }

    // FIX: require mc_stoppage_time and finish_time at minimum
    // starting_time optional — waiting time shows 0 if missing
    const stop   = parseDT(field(r,"mc_stoppage_time","stop_time"));
    const finish = parseDT(field(r,"finish_time"));
    return !!(stop && finish);
  });

  if(!filtered.length){
    document.getElementById("reportArea").innerHTML =
      `<div class="wide"><p>⚠️ No records match the selected filters.</p></div>`;
    status.textContent = "No records after filtering.";
    return;
  }

  status.style.color = "#1d8a4e";
  status.textContent  = filtered.length + " record(s) found.";

  // ── Build report table ─────────────────────────────────
  let html = `<div class="wide">
    <h2 style="text-align:center;color:#1565C0;">🛠️ Repair by Assets Report</h2>
    <p style="text-align:center;">
      ${startDate} → ${endDate} | Dept: ${department} |
      Assets: ${assetFilt} | Shift: ${shift} | Section: ${section}
    </p>
    <table><thead><tr>
      <th>#</th><th>Asset</th><th>Job Code</th><th>Nurse Name</th>
      <th>Downtime (min)</th><th>Repair (min)</th><th>Waiting (min)</th>
      <th>Estimated (min)</th><th>Diff</th><th>Date</th>
    </tr></thead><tbody>`;

  filtered.forEach((r, i) => {
    // FIX: use field() to safely read with column name fallbacks
    const stop   = parseDT(field(r, "mc_stoppage_time", "stop_time"));
    const start  = parseDT(field(r, "starting_time"));
    const finish = parseDT(field(r, "finish_time"));

    // FIX: downtime = finish - mc_stoppage_time
    const downtime = minutesBetween(stop, finish);
    const repair   = minutesBetween(start, finish);
    const waiting  = start ? (downtime - repair) : 0;
    const est      = Math.round(parseNum(field(r, "estimated_duration", "extimated_time")));
    const diff     = est - repair;

    // FIX: date derived from mc_stoppage_time so it's never blank
    const recDate  = stop
      ? stop.toISOString().slice(0, 10)
      : (field(r, "date_col", "date") || "");

    html += `<tr>
      <td>${i + 1}</td>
      <td>${field(r,"assets")||""}</td>
      <td>${field(r,"job_code")||""}</td>
      <td>${field(r,"names","nurse_name")||""}</td>
      <td>${downtime}</td>
      <td>${repair}</td>
      <td>${waiting}</td>
      <td>${est}</td>
      <td class="${diff >= 0 ? "green" : "red"}">${diff}</td>
      <td>${recDate}</td>
    </tr>`;
  });

  html += "</tbody></table></div>";
  document.getElementById("reportArea").innerHTML = html;
}

function repopulateDropdown(id, rows, getter){
  const sel  = document.getElementById(id);
  const curr = sel.value;
  const vals = [...new Set(rows.map(getter).filter(Boolean))].sort();
  sel.innerHTML = `<option value="All">All</option>` +
    vals.map(v => `<option value="${v}">${v}</option>`).join("");
  // restore previous selection if still valid
  if(vals.includes(curr)) sel.value = curr;
}

init();
</script>
<script src="../../assets/letterhead.js"></script>
</body>
</html>
