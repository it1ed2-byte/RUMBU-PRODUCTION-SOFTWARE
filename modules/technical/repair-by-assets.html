<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Repair by Assets</title>
<link rel="stylesheet" href="../../styles.css">
<script>
  (function(){
    function apply(t){ if(t) document.documentElement.setAttribute("data-theme", t); }
    window.addEventListener("message", function(e){ if(e.data && e.data.rumbuTheme) apply(e.data.rumbuTheme); });
    try{ apply(localStorage.getItem("rumbu_theme")); }catch(e){}
  })();
</script>
<style>
  *{box-sizing:border-box;}
  body{font-family:var(--sans);background:var(--bg);margin:0;padding:16px;}
  .container{max-width:520px;margin:0 auto 16px;background:var(--card);border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.1);padding:20px;}
  h3{text-align:center;color:var(--heading);}
  label{font-weight:600;margin-top:10px;display:block;}
  input,select{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;margin-bottom:8px;background:var(--card);color:var(--text);}
  button{width:100%;padding:10px;background:var(--heading);color:#fff;font-weight:bold;border:none;border-radius:6px;cursor:pointer;margin-top:6px;}
  button.alt{background:#38761d;}
  #status{text-align:center;margin-top:10px;font-weight:bold;font-size:13px;}
  .muted{font-size:11px;color:var(--muted);text-align:right;margin-top:-6px;margin-bottom:6px;}
  .wide{max-width:1100px;margin:0 auto;background:var(--card);border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.1);padding:20px;}
  table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px;}
  th,td{border:1px solid #333;padding:5px;text-align:center;white-space:nowrap;}
  th{background:var(--heading);color:#fff;}
  .green{background:#A5D6A7;} .red{background:#FFCDD2;}
  .badge{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:2px 7px;font-size:11px;margin-left:6px;color:var(--muted);}
  @media print{ .no-print{display:none !important;} }
</style>
</head>
<body>

<div class="container no-print">
  <h3>🛠️ Repair by Assets Report</h3>

  <label>Section</label>
  <select id="section" onchange="onSectionChange()">
    <option value="All">All</option>
    <option value="Rumbu Mainmat">Rumbu Mainmat</option>
    <option value="MamaSannu">Mama Sannu</option>
  </select>

  <label>Department <span class="badge" id="deptCount">loading…</span></label>
  <select id="department" onchange="filterAssets()">
    <option value="All">All Departments</option>
  </select>

  <label>Asset <span class="badge" id="assetCount">loading…</span></label>
  <select id="assets">
    <option value="All">All Assets</option>
  </select>

  <label>Start Date</label><input type="date" id="startDate">
  <label>End Date</label>  <input type="date" id="endDate">

  <label>Shift</label>
  <select id="shift">
    <option value="All">All Shifts</option>
    <option>Morning</option>
    <option>Night</option>
  </select>

  <button onclick="generate()">Generate Report</button>
  <button class="alt no-print" onclick="window.print()">Print / Save as PDF</button>
  <div id="status">Loading asset list…</div>
</div>

<div id="reportArea"></div>

<script>
const SUPABASE_URL      = "https://betfhunzmhtdzgvufmfk.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_AfDp1FlHghu9TOfqEUj20Q_Pke7GlTp";

function authHeaders(){
  return {
    "apikey":        SUPABASE_ANON_KEY,
    "Authorization": "Bearer " + SUPABASE_ANON_KEY
  };
}

// ── Asset catalogue: dept → [assets] per section ──────────
// Populated from control table on init, filtered to Rumbu+MamaSannu
let CATALOGUE = {
  "All":           { depts: [], assetsByDept: {} },
  "Rumbu Mainmat": { depts: [], assetsByDept: {} },
  "MamaSannu":     { depts: [], assetsByDept: {} }
};

function sectionKey(raw){
  if(!raw) return "Rumbu Mainmat";
  const u = raw.toUpperCase().trim();
  if(u.includes("MAMA")) return "MamaSannu";
  return "Rumbu Mainmat";
}

async function initDropdowns(){
  const status = document.getElementById("status");
  try{
    // Fetch department+assets+section — no date filter, section restricted to Rumbu/Mama
    // Two pages max (2000 rows) — enough to capture all unique dept/asset combos
    let all = [];
    for(let offset = 0; offset < 4000; offset += 1000){
      const headers = Object.assign({}, authHeaders(), {
        "Range-Unit": "items",
        "Range":      offset + "-" + (offset + 999)
      });
      const res = await fetch(
        SUPABASE_URL +
        "/rest/v1/control?select=department,assets,section" +
        "&or=(section.ilike.*umbu*,section.ilike.*ama*)" +
        "&order=id.asc",
        { headers }
      );
      if(!res.ok) break;
      const batch = await res.json();
      all = all.concat(batch);
      if(batch.length < 1000) break;
    }

    // Build catalogue
    all.forEach(r => {
      const dept  = (r.department || "").trim();
      const asset = (r.assets     || "").trim();
      const sec   = sectionKey(r.section);
      if(!dept && !asset) return;

      ["All", sec].forEach(key => {
        const cat = CATALOGUE[key];
        if(dept && !cat.depts.includes(dept)) cat.depts.push(dept);
        if(dept && asset){
          if(!cat.assetsByDept[dept]) cat.assetsByDept[dept] = [];
          if(!cat.assetsByDept[dept].includes(asset)) cat.assetsByDept[dept].push(asset);
        }
        if(asset && !dept){
          if(!cat.assetsByDept["__all__"]) cat.assetsByDept["__all__"] = [];
          if(!cat.assetsByDept["__all__"].includes(asset)) cat.assetsByDept["__all__"].push(asset);
        }
      });
    });

    // Sort everything
    Object.values(CATALOGUE).forEach(cat => {
      cat.depts.sort();
      Object.values(cat.assetsByDept).forEach(arr => arr.sort());
    });

    fillDeptDropdown("All");
    filterAssets();

    const total = all.length;
    status.textContent = "Ready — " + total + " records scanned for filter options.";
    status.style.color = "var(--ok, #1d8a4e)";
  }catch(e){
    status.style.color = "#c0392b";
    status.textContent = "Filter init error: " + e.message;
  }
}

function fillDeptDropdown(section){
  const sel   = document.getElementById("department");
  const curr  = sel.value;
  const depts = CATALOGUE[section]?.depts || [];

  sel.innerHTML = `<option value="All">All Departments</option>` +
    depts.map(d => `<option value="${d}">${d}</option>`).join("");
  document.getElementById("deptCount").textContent = depts.length + " depts";

  if(depts.includes(curr)) sel.value = curr;
}

function filterAssets(){
  const section = document.getElementById("section").value;
  const dept    = document.getElementById("department").value;
  const sel     = document.getElementById("assets");
  const curr    = sel.value;

  const cat  = CATALOGUE[section] || CATALOGUE["All"];
  let assets = [];

  if(dept === "All"){
    // All assets across all depts for this section
    const seen = new Set();
    Object.values(cat.assetsByDept).forEach(arr =>
      arr.forEach(a => { if(!seen.has(a)){ seen.add(a); assets.push(a); } })
    );
    assets.sort();
  } else {
    assets = cat.assetsByDept[dept] || [];
  }

  sel.innerHTML = `<option value="All">All Assets</option>` +
    assets.map(a => `<option value="${a}">${a}</option>`).join("");
  document.getElementById("assetCount").textContent = assets.length + " assets";

  if(assets.includes(curr)) sel.value = curr;
}

function onSectionChange(){
  const section = document.getElementById("section").value;
  fillDeptDropdown(section);
  filterAssets();
}

// ── Fetch records for date range ──────────────────────────
function parseDT(v){ if(!v) return null; const d=new Date(v); return isNaN(d)?null:d; }
function minutesBetween(a,b){ return (!a||!b)?0:Math.round((b-a)/60000); }
function parseNum(v){ if(v==null) return 0; const n=parseFloat(String(v)); return isNaN(n)?0:n; }
function field(r,...keys){ for(const k of keys){ const v=r[k]; if(v!==null&&v!==undefined&&v!=="") return v; } return null; }

async function fetchFiltered(startDate, endDate, section){
  let all = [], offset = 0;
  const pageSize = 1000;

  let sectionFilter = "";
  if(section === "Rumbu Mainmat"){
    sectionFilter = "&or=(section.ilike.*umbu*,section.not.ilike.*ama*)";
  } else if(section === "MamaSannu"){
    sectionFilter = "&section=ilike.*ama*";
  } else {
    sectionFilter = "&or=(section.ilike.*umbu*,section.ilike.*ama*)";
  }

  const dateFilter = "&date=gte." + startDate + "&date=lte." + endDate;

  for(let guard = 0; guard < 500; guard++){
    const headers = Object.assign({}, authHeaders(), {
      "Range-Unit": "items",
      "Range":      offset + "-" + (offset + pageSize - 1)
    });
    const res = await fetch(
      SUPABASE_URL + "/rest/v1/control?select=*" + dateFilter + sectionFilter + "&order=id.asc",
      { headers }
    );
    if(!res.ok) throw new Error("control: HTTP " + res.status);
    const batch = await res.json();
    all = all.concat(batch);
    if(batch.length < pageSize) break;
    offset += pageSize;
  }
  return all;
}

// ── Generate report ───────────────────────────────────────
async function generate(){
  const status     = document.getElementById("status");
  const startDate  = document.getElementById("startDate").value;
  const endDate    = document.getElementById("endDate").value;
  const department = document.getElementById("department").value;
  const assetFilt  = document.getElementById("assets").value;
  const shift      = document.getElementById("shift").value;
  const section    = document.getElementById("section").value;

  if(!startDate || !endDate){ alert("Please select both dates."); return; }

  status.style.color = "#1565C0";
  status.textContent = "Loading…";
  document.getElementById("reportArea").innerHTML = "";

  let rows;
  try{
    rows = await fetchFiltered(startDate, endDate, section);
    status.textContent = rows.length + " rows loaded.";
  }catch(e){
    status.style.color = "#c0392b";
    status.textContent = "Error: " + e.message;
    return;
  }

  if(!rows.length){
    document.getElementById("reportArea").innerHTML =
      `<div class="wide"><p>⚠️ No records found for ${startDate} → ${endDate}.</p></div>`;
    return;
  }

  // Client-side filters
  const filtered = rows.filter(r => {
    if(department !== "All"){
      if((field(r,"department")||"").trim() !== department) return false;
    }
    if(assetFilt !== "All"){
      if((field(r,"assets")||"").trim() !== assetFilt) return false;
    }
    if(shift !== "All" && r.shift !== shift) return false;
    const finish = parseDT(field(r,"finish_time"));
    return !!finish;
  });

  if(!filtered.length){
    document.getElementById("reportArea").innerHTML =
      `<div class="wide"><p>⚠️ No records match the selected filters.</p></div>`;
    status.textContent = "No records after filtering.";
    return;
  }

  status.style.color = "#1d8a4e";
  status.textContent = filtered.length + " record(s) found.";

  // Build report
  const secLabel = section === "All" ? "All Sections" : section;
  let html = `<div class="wide">
    <h2 style="text-align:center;color:var(--heading);">🛠️ Repair by Assets Report</h2>
    <p style="text-align:center;font-size:13px;">
      ${startDate} → ${endDate} &nbsp;|&nbsp; Section: ${secLabel} &nbsp;|&nbsp;
      Dept: ${department} &nbsp;|&nbsp; Asset: ${assetFilt} &nbsp;|&nbsp; Shift: ${shift}
    </p>
    <table><thead><tr>
      <th>#</th><th>Date</th><th>Asset</th><th>Department</th><th>Job Code</th>
      <th>Nurse Name</th><th>Shift</th>
      <th>Downtime (min)</th><th>Repair (min)</th><th>Waiting (min)</th>
      <th>Estimated (min)</th><th>Diff</th>
    </tr></thead><tbody>`;

  filtered.forEach((r, i) => {
    const stop   = parseDT(field(r,"mc_stoppage_time","stop_time"));
    const start  = parseDT(field(r,"starting_time"));
    const finish = parseDT(field(r,"finish_time"));
    const downtime = minutesBetween(stop, finish);
    const repair   = minutesBetween(start, finish);
    const waiting  = start ? (downtime - repair) : 0;
    const est      = Math.round(parseNum(field(r,"estimated_duration","extimated_time")));
    const diff     = est - repair;
    const recDate  = field(r,"date_col","date") || "";

    html += `<tr>
      <td>${i+1}</td>
      <td>${recDate}</td>
      <td>${field(r,"assets")||""}</td>
      <td>${field(r,"department")||""}</td>
      <td>${field(r,"job_code")||""}</td>
      <td>${field(r,"names","nurse_name")||""}</td>
      <td>${r.shift||""}</td>
      <td>${downtime}</td>
      <td>${repair}</td>
      <td>${waiting}</td>
      <td>${est}</td>
      <td class="${diff>=0?"green":"red"}">${diff}</td>
    </tr>`;
  });

  html += "</tbody></table></div>";
  document.getElementById("reportArea").innerHTML = html;
}

// ── Init ─────────────────────────────────────────────────
function init(){
  const today = new Date();
  const past  = new Date(today); past.setDate(today.getDate()-7);
  document.getElementById("endDate").value   = today.toISOString().slice(0,10);
  document.getElementById("startDate").value = past.toISOString().slice(0,10);
  initDropdowns();
}

init();
</script>
<script src="../../assets/letterhead.js"></script>
</body>
</html>
