function authHeaders(){ return { "apikey": SUPABASE_ANON_KEY, "Authorization": "Bearer " + SUPABASE_ANON_KEY }; }
function parseDT(v){ const d=new Date(v); return isNaN(d)?null:d; }
function minutesBetween(a,b){ return (!a||!b)?0:Math.trunc((b-a)/60000); }

// FIX 5: Normalised estimated-duration parser.
// The BigQuery view stores Estimated_Minutes as a plain integer (minutes).
// The Supabase column estimated_duration / extimated_time may arrive as a
// plain number, a quoted number, or a string like "30 mins" / "0.5 hr".
// We convert all forms to minutes so the column is always comparable to
// the repair minutes calculated from timestamps.
function parseEstimatedMinutes(v){
  if(v == null || v === "") return 0;
  const s = String(v).trim().toLowerCase();
  // plain number — already in minutes
  if(/^\d+(\.\d+)?$/.test(s)) return Math.round(Number(s));
  // "X hr" / "X hrs" / "X hour(s)"
  const hrMatch = s.match(/^([\d.]+)\s*hr/);
  if(hrMatch) return Math.round(Number(hrMatch[1]) * 60);
  // "X min" / "X mins" / "X minute(s)"
  const minMatch = s.match(/^([\d.]+)\s*min/);
  if(minMatch) return Math.round(Number(minMatch[1]));
  // fallback: strip non-numeric and treat as minutes
  const bare = s.match(/[\d.]+/);
  return bare ? Math.round(Number(bare[0])) : 0;
}

// FIX 1: Planned / non-productive downtime codes to exclude.
// Mirrors the BigQuery view v_unplanned_downtime and every other report in this
// codebase (summary-report, grand-total-report) by fetching the live `job_table`
// from Supabase and excluding any control row whose job_code is in that table.
// The planned codes (BREAK, PRAYER, TOILET, LEAVE, EX, OPR, etc.) are stored
// in the `job_code` column of the control table — NOT in the description field.
let EXCLUDED_JOB_CODES = new Set();

let CTRL_ROWS = [];

function normalizeControlRow(r){
  if(r.date_col === undefined) r.date_col = r.date;
  if(r.names === undefined) r.names = r.nurse_name;
  if(r.stop_time === undefined) r.stop_time = r.mc_stoppage_time;
  if(r.extimated_time === undefined) r.extimated_time = r.estimated_duration;
  if(r.discription === undefined) r.discription = r.description;
  return r;
}

// FIX 2: Use the operator-recorded date (date_col) directly.
// The BigQuery view's Event_Date is exactly the date_col stored field — set
// by the control room operator at data entry time. summary-report.html and

// Deriving the date from mc_stoppage_time with a 06:00 cutoff was wrong: it
// caused ±1 count errors on boundary records and did not match the GAS view.
function getRecordDate(r){
  return r.date_col || null;
}

function getJobCodesByDepartment(department){
  if(department === "All") return Object.values(DEPARTMENTS).flat();
  return DEPARTMENTS[department] || [];
}

async function fetchAllRows(table, select, query){
  let all = [], offset = 0; const pageSize = 1000;
  const q = query || "";
  for(let guard=0; guard<500; guard++){
    const headers = Object.assign({}, authHeaders(), { "Range-Unit":"items", "Range": offset + "-" + (offset+pageSize-1) });
    const res = await fetch(SUPABASE_URL + "/rest/v1/" + table + "?select=" + (select||"*") + q, { headers });
    if(!res.ok) throw new Error(table + ": HTTP " + res.status);
    const batch = await res.json();
    all = all.concat(batch);
    if(batch.length < pageSize) break;
    offset += pageSize;
  }
  return all;
}

function normalizeControlRow(r){
  if(r.date_col === undefined) r.date_col = r.date;
  if(r.names === undefined) r.names = r.nurse_name;
  if(r.stop_time === undefined) r.stop_time = r.mc_stoppage_time;
  if(r.extimated_time === undefined) r.extimated_time = r.estimated_duration;
  if(r.discription === undefined) r.discription = r.description;
  return r;
}

async function init(){
  const status = document.getElementById("status");
  try{
    const me = await requireAuth("../../login.html");
    if(!me) return;

    const KNOWN_DEPARTMENTS = [
      "BEAMING","DELIVERY","DESIGN CARD","ELEC EXTRUDER","ELEC MAT WEAVING",
      "ELECRICAL RECYCLING","ELECTRICAL TWINE","EXT-MECH CUTTER","EXT-MECH DIE HEAD",
      "EXTRUDER","FEEDING","QUALITY CONTROL","RECYCLING","Technical",
      "TRANSMISSION","TWINE"
    ];
    const deptSel = document.getElementById("department");
    KNOWN_DEPARTMENTS.forEach(d=>{
      const o=document.createElement("option"); o.value=d; o.textContent=d; deptSel.appendChild(o);
    });

    const mySections = (me.sectionNames && me.sectionNames.length) ? me.sectionNames : ["Rumbu","MamaSannu","Rumbu Mainmat"];
    const secSel = document.getElementById("section");
    mySections.forEach(s=>{ const o=document.createElement("option"); o.value=s; o.textContent=s; secSel.appendChild(o); });

    status.style.color="#1d8a4e"; status.textContent = "Ready. Select a date range and click Generate Report.";
  }catch(e){
    status.style.color="#c0392b"; status.textContent = "Could not read data: " + (e.message||e);
  }
}

async function fetchRangeControl(fromDate, toDate){
  // FIX 2: Filter on the date column (operator-recorded date), matching
  // exactly how summary-report.html fetches control rows. This is the
  // same as the BigQuery view's Event_Date — a stored field, not derived.
  // The monitoring-room code notes the control table uses a column called
  // "date" (normalised to date_col by normalizeControlRow).

  // FIX 1: Fetch job_table exclusion list in parallel with control rows.
  // This matches exactly how summary-report.html and grand-total-report.html
  // exclude planned codes — by job_code column, not by description text.
  const [ctrlRows, jobRes] = await Promise.all([
    fetchAllRows(
      "control", "*",
      "&date=gte." + fromDate + "&date=lte." + toDate
    ),
    fetch(SUPABASE_URL + "/rest/v1/job_table?select=job_code", { headers: authHeaders() })
  ]);

  if(jobRes.ok){
    const jobRows = await jobRes.json();
    EXCLUDED_JOB_CODES = new Set(jobRows.map(r => r.job_code));
  } else {
    // Non-fatal: if job_table fetch fails, fall back to hardcoded known codes
    EXCLUDED_JOB_CODES = new Set(["BREAK","PRAYER","TOILET","LEAVE","EX","OPR"]);
    console.warn("job_table fetch failed, using fallback exclusion list");
  }

  CTRL_ROWS = ctrlRows;
  CTRL_ROWS.forEach(normalizeControlRow);
}

async function generate(){
  const startDate = document.getElementById("startDate").value;
  const endDate   = document.getElementById("endDate").value;
  const department = document.getElementById("department").value;
  const shift      = document.getElementById("shift").value;
  const section    = document.getElementById("section").value;
  const shed       = document.getElementById("shed").value;
  if(!startDate || !endDate){ alert("⚠️ Please select both Start and End dates."); return; }

  const status = document.getElementById("status");
  status.style.color=""; status.textContent = "Loading…";
  try{
    await fetchRangeControl(startDate, endDate);
  }catch(e){
    status.style.color="#c0392b"; status.textContent = "Could not read data: " + (e.message||e); return;
  }
  status.textContent = "";
  if(!CTRL_ROWS.length){ document.getElementById("reportArea").innerHTML = "<p>No records found for this date range.</p>"; return; }

  const rows = CTRL_ROWS.filter(r=>{

    // FIX 1: Exclude planned / non-productive job codes via job_table.
    // job_code is the column that stores BREAK, PRAYER, TOILET, LEAVE, EX, OPR
    // etc. in the control table. Matches summary-report and grand-total-report.
    if(EXCLUDED_JOB_CODES.has(r.job_code)) return false;

    // FIX 2: Use date_col (operator-recorded date = BigQuery Event_Date).
    const opDate = getRecordDate(r);
    if(!opDate || opDate < startDate || opDate > endDate) return false;

    // Department filter: match the actual department column value.
    if(department !== "All" && (r.department||"").trim() !== department) return false;

    if(shift !== "All" && r.shift !== shift) return false;

    // FIX 3: Section filter with extruder-section normalisation.
    // The BigQuery view folds all extruder-area sections into "Rumbu".
    // Any section that is not MamaSannu is treated as Rumbu here.
    if(section !== "All"){
      const sec = (r.section||"").toUpperCase().trim();
      const isMama = sec.includes("MAMASANNU");
      if(section === "MamaSannu" && !isMama) return false;
      if(section === "Rumbu"     &&  isMama) return false;
      // All extruder / Rumbu-area sub-sections are included when section = "Rumbu"
    }

    // FIX 4: Shed "1" value corrected from "i" to "1".
    if(shed !== "All" && String(r.shed) !== shed) return false;

    return true;
  });

  if(!rows.length){
    document.getElementById("reportArea").innerHTML = "<p>⚠️ No records found for the selected filters.</p>";
    return;
  }

  const byAsset = {};
  rows.forEach(r=>{
    const a = r.assets || "(blank)";
    if(!byAsset[a]) byAsset[a] = { asset:a, count:0, downtime:0, repair:0, est:0 };
    byAsset[a].count++;
    byAsset[a].downtime += minutesBetween(parseDT(r.stop_time),     parseDT(r.finish_time));
    byAsset[a].repair   += minutesBetween(parseDT(r.starting_time), parseDT(r.finish_time));
    // FIX 5: Normalised estimated-duration conversion (always produces minutes).
    byAsset[a].est += parseEstimatedMinutes(r.extimated_time);
  });

  // Totals row
  let totCount=0, totDowntime=0, totRepair=0, totEst=0;

  let html = `<h2 style="text-align:center;color:var(--heading);">📊 Downtime by Assets Report</h2>
    <p style="text-align:center;">${startDate} &rarr; ${endDate} | Department: ${department} | Shift: ${shift} | Section: ${section} | Shed: ${shed}</p>
    <table><thead><tr><th>Asset</th><th>Occurrences</th><th>Downtime (min)</th><th>Repair (min)</th><th>Est Duration (min)</th><th>Diff</th></tr></thead><tbody>`;

  Object.values(byAsset).sort((a,b)=>b.count-a.count).forEach(r=>{
    const downtime=Math.round(r.downtime), repair=Math.round(r.repair), est=Math.round(r.est);
    const diff = est - repair;
    totCount+=r.count; totDowntime+=downtime; totRepair+=repair; totEst+=est;
    html += `<tr><td>${r.asset}</td><td>${r.count}</td><td>${downtime}</td><td>${repair}</td><td>${est}</td>` +
      `<td class="${diff>0?'green':'red'}">${diff}</td></tr>`;
  });

  const totDiff = totEst - totRepair;
  html += `</tbody><tfoot><tr><td>TOTAL</td><td>${totCount}</td><td>${totDowntime}</td><td>${totRepair}</td><td>${totEst}</td>` +
    `<td class="${totDiff>0?'green':'red'}">${totDiff}</td></tr></tfoot></table>`;

  document.getElementById("reportArea").innerHTML = html;
  status.style.color="#1d8a4e";
  status.textContent = `Report generated — ${rows.length} unplanned records across ${Object.keys(byAsset).length} assets.`;
}

init();
</script>
