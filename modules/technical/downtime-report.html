<script>
  (function(){

<style>

  *{box-sizing:border-box;}
  body{font-family:var(--sans);background:var(--bg);margin:0;padding:16px;}

  .green{background:#A5D6A7;}

</style>

function parseDT(v){ const d=new Date(v); return isNaN(d)?null:d; }
function minutesBetween(a,b){ return (!a||!b)?0:Math.trunc((b-a)/60000); }

function getJobCodesByDepartment(department){
  if(department === "All") return Object.values(DEPARTMENTS).flat();
  return DEPARTMENTS[department] || [];
}



// Fetch ALL rows from a table, paginating past Supabase's 1000-row cap.
async function fetchAllRows(table, select, query){
  let all = [], offset = 0; const pageSize = 1000; const q = query||"";
  for(let guard=0; guard<500; guard++){
    const headers = Object.assign({}, authHeaders(), { "Range-Unit":"items", "Range": offset + "-" + (offset+pageSize-1) });
    const res = await fetch(SUPABASE_URL + "/rest/v1/" + table + "?select=" + (select||"*") + q, { headers });
    if(!res.ok) throw new Error(table + ": HTTP " + res.status);
    const batch = await res.json();
    all = all.concat(batch);
    if(batch.length < pageSize) break;
    offset += pageSize;
  }
  return all;
}

function normalizeControlRow(r){
  if(r.date_col === undefined) r.date_col = r.date;
  if(r.names === undefined) r.names = r.nurse_name;
  if(r.stop_time === undefined) r.stop_time = r.mc_stoppage_time;
  if(r.extimated_time === undefined) r.extimated_time = r.estimated_duration;
  if(r.discription === undefined) r.discription = r.description;
  return r;
}

async function init(){
  const status = document.getElementById("status");
  try{
    // Declare me in outer scope so mySections below can use it
    let me = null;
    if(typeof requireAuth === "function"){
      me = await requireAuth("../../login.html");
      if(!me) return;
    }
    if(typeof SUPABASE_URL === "undefined") throw new Error("Supabase credentials not loaded.");

    const mySections = (me.sectionNames && me.sectionNames.length) ? me.sectionNames : ["Rumbu","MamaSannu"];
    document.getElementById("section").innerHTML = '<option>All</option>' +
      mySections.map(s=>`<option value="${s}">${SECTION_LABEL[s]||s}</option>`).join("");

    status.style.color="#1d8a4e";
    status.textContent = "Ready. Select a date range and click Generate.";

    // Department dropdown from actual department column values — matches old
    // AppScript's SELECT DISTINCT Department FROM maintenance_log
    const KNOWN_DEPARTMENTS = [
      "BEAMING","DELIVERY","DESIGN CARD","ELEC EXTRUDER","ELEC MAT WEAVING",
      "ELECRICAL RECYCLING","ELECTRICAL TWINE","EXT-MECH CUTTER","EXT-MECH DIE HEAD",
      "EXTRUDER","FEEDING","QUALITY CONTROL","RECYCLING","Technical",
      "TRANSMISSION","TWINE"
    ];
    const sel = document.getElementById("department");
    KNOWN_DEPARTMENTS.forEach(d=>{ const o=document.createElement("option"); o.value=d; o.textContent=d; sel.appendChild(o); });
  }catch(e){
    status.style.color="#c0392b";
    status.textContent = "Could not read data: " + (e.message||e);
  }
}

async function fetchControlRange(fromDate, toDate){
  // Use mc_stoppage_time — matches old script's DATE(MC_Stoppage_Time) BETWEEN
  CTRL_ROWS = await fetchAllRows("control","*", "&mc_stoppage_time=gte."+fromDate+"&mc_stoppage_time=lte."+toDate+"T23:59:59");
  CTRL_ROWS.forEach(normalizeControlRow);
}

async function generate(){
  const startDate = document.getElementById("startDate").value;
  const endDate = document.getElementById("endDate").value;
  const department = document.getElementById("department").value;
  const shift = document.getElementById("shift").value;
  const section = document.getElementById("section").value;
  if(!startDate || !endDate){ alert("Please select dates."); return; }

  const status = document.getElementById("status");
  if(status){ status.style.color="#555"; status.textContent = "Loading "+startDate+" to "+endDate+"…"; }
  try{ await fetchControlRange(startDate, endDate); }
  catch(e){ if(status){ status.style.color="#c0392b"; status.textContent="Could not read data: "+(e.message||e); } return; }
  if(status){ status.textContent = ""; }
  if(!CTRL_ROWS.length){ alert("No downtime records found for this date range."); return; }

  const rows = CTRL_ROWS.filter(r=>{
    // Date: from mc_stoppage_time — matches old script's DATE(MC_Stoppage_Time) BETWEEN
    const stopDate = r.stop_time ? r.stop_time.slice(0,10) : r.date_col;
    if(stopDate < startDate || stopDate > endDate) return false;
    // Department: actual column — matches old script's AND Department=@dept
    if(department !== "All" && (r.department||"").trim() !== department) return false;
    if(shift !== "All" && r.shift !== shift) return false;
    // Section: LIKE logic matching old script behaviour
    if(section !== "All"){
      const sec = (r.section||"").toUpperCase().trim();
      if(section === "MamaSannu" && !sec.includes("MAMASANNU")) return false;
      if(section === "Rumbu" && sec.includes("MAMASANNU")) return false;
      if(section !== "MamaSannu" && section !== "Rumbu" && sec !== section.toUpperCase()) return false;
    }
    return true;
  });
  if(!rows.length){
    document.getElementById("reportArea").innerHTML = "<p>⚠️ No data found for selected filters.</p>";
    return;
  }

  const byJob = {};
  rows.forEach(r=>{
    const j = r.job_code || "(blank)";
    if(!byJob[j]) byJob[j] = { job:j, count:0, downtime:0, repair:0, waiting:0, est:0 };
    const stop=parseDT(r.stop_time), start=parseDT(r.starting_time), finish=parseDT(r.finish_time);
    byJob[j].count++;
    byJob[j].downtime += minutesBetween(stop, finish);
    byJob[j].repair += minutesBetween(start, finish);
    byJob[j].waiting += minutesBetween(stop, start);
    byJob[j].est += extractNumber(r.extimated_time);
  });

  let html = `<h2 style="text-align:center;color:var(--heading);">📊 Downtime Report</h2>
    <p style="text-align:center;">${startDate} &rarr; ${endDate} | Department: ${department} | Shift: ${shift} | Section: ${section}</p>
    <table><thead><tr><th>Job Code</th><th>Occurrences</th><th>Downtime (min)</th><th>Repair Time (min)</th>
    <th>Waiting Time (min)</th><th>Estimated Duration (min)</th><th>% Efficiency</th><th>Difference (min)</th></tr></thead><tbody>`;

  let tC=0,tD=0,tR=0,tW=0,tE=0,tDiff=0;
  Object.values(byJob).sort((a,b)=>b.count-a.count).forEach(r=>{
    const diff = Math.round(r.est - r.repair);
    const eff = r.repair>0 ? (r.est/r.repair)*100 : 0;
    tC+=r.count; tD+=Math.round(r.downtime); tR+=Math.round(r.repair); tW+=Math.round(r.waiting); tE+=Math.round(r.est); tDiff+=diff;
    html += `<tr><td>${r.job}</td><td>${r.count}</td><td>${Math.round(r.downtime)}</td><td>${Math.round(r.repair)}</td>` +
      `<td>${Math.round(r.waiting)}</td><td>${Math.round(r.est)}</td><td>${eff.toFixed(1)}%</td>` +
      `<td class="${diff>0?'green':''}">${diff}</td></tr>`;
  });
  const overallEff = tR>0 ? (tE/tR)*100 : 0;
  html += `</tbody><tfoot><tr><td>TOTAL</td><td>${tC}</td><td>${tD}</td><td>${tR}</td><td>${tW}</td><td>${tE}</td>` +
    `<td>${overallEff.toFixed(1)}%</td><td>${tDiff}</td></tr></tfoot></table>`;

  document.getElementById("reportArea").innerHTML = html;
}

init();
</script>
