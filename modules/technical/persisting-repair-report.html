<meta charset="UTF-8">

<title>Persisting Repair Report</title>
<link rel="stylesheet" href="../../styles.css">
<script>
  (function(){
    function apply(t){ if(t) document.documentElement.setAttribute("data-theme", t); }
    window.addEventListener("message", function(e){ if(e.data && e.data.rumbuTheme) apply(e.data.rumbuTheme); });
    try{ apply(localStorage.getItem("rumbu_theme")); }catch(e){}
  })();
</script>
<style>
  :root{--navy:var(--heading);}
  *{box-sizing:border-box;}
  body{font-family:var(--sans);background:var(--bg);margin:0;padding:16px;}
  .container{max-width:520px;margin:0 auto 16px;background:var(--card);padding:20px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.1);}
  h2{color:var(--navy);text-align:center;margin-bottom:15px;}
  label{font-weight:bold;display:block;margin-top:10px;}
  select,input{width:100%;padding:6px;margin-top:4px;border-radius:6px;border:1px solid var(--line);}
  button{width:100%;padding:10px;margin-top:15px;background:var(--navy);color:#fff;border:none;border-radius:6px;font-weight:bold;cursor:pointer;}
  button.alt{background:#2E7D32;}
  #status{margin-top:10px;text-align:center;font-size:13px;font-weight:bold;}
  .wide{max-width:1000px;margin:0 auto;}
  table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px;background:var(--card);}
  th,td{border:1px solid var(--line);padding:6px;text-align:center;}
  th{background:var(--navy);color:#fff;}
  @media print{ .no-print{display:none !important;} }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<div class="container no-print">
<h2>🔧 Persisting Repair Report</h2>
<label>From Date</label><input type="date" id="dateFrom">
<label>To Date</label><input type="date" id="dateTo">
<label>Department</label><select id="department"><option value="All">All</option></select>
<label>Shift</label><select id="shift"><option>All</option><option>Morning</option><option>Night</option></select>
<label>Section</label><select id="section"><option>All</option></select>
<label>Asset</label><select id="asset"><option value="All">All</option></select>
<button onclick="generate()">Generate Report</button>
<button class="alt" onclick="window.print()">Print / Save as PDF</button>
<div id="status">Connecting to Supabase...</div>
</div>

<div class="wide" id="reportArea"></div>

function getJobCodesByDepartment(department){
  if(department === "All") return Object.values(DEPARTMENTS).flat();
  return DEPARTMENTS[department] || [];
}

async function fetchAllControlRows(){
  const pageSize=1000; let all=[], offset=0;
  while(true){
    const res = await fetch(SUPABASE_URL + "/rest/v1/control?select=*&limit="+pageSize+"&offset="+offset, { headers: authHeaders() });
    if(!res.ok) throw new Error("HTTP " + res.status);
    const page = await res.json();
    all = all.concat(page);
    if(page.length < pageSize) break;
    offset += pageSize;
  }
  return all;
}


function normalizeControlRow(r){
  if(r.date_col === undefined) r.date_col = r.date;
  if(r.names === undefined) r.names = r.nurse_name;
  if(r.stop_time === undefined) r.stop_time = r.mc_stoppage_time;
  if(r.extimated_time === undefined) r.extimated_time = r.estimated_duration;
  if(r.discription === undefined) r.discription = r.description;
  return r;
}

async function init(){
  const status = document.getElementById("status");
  try{
    const me = await requireAuth("../../login.html");
    if(!me) return;

    const mySections = (me.sectionNames && me.sectionNames.length) ? me.sectionNames : ["Rumbu Mainmat","MamaSannu"];
    document.getElementById("section").innerHTML = '<option>All</option>' +
      mySections.map(s=>`<option value="${s}">${SECTION_LABEL[s]||s}</option>`).join("");

    const deptSel = document.getElementById("department");
    Object.keys(DEPARTMENTS).forEach(d=>{ const o=document.createElement("option"); o.value=d; o.textContent=d; deptSel.appendChild(o); });

    status.style.color="#1d8a4e";
    status.textContent = "Ready. Select a date range and click Generate.";
  }catch(e){
    status.style.color="#c0392b";
    status.textContent = "Could not read data: " + (e.message||e);
  }
}

async function fetchAllRows(table, select, query){
  let all = [], offset = 0; const pageSize = 1000;
  const q = query || "";
  for(let guard=0; guard<500; guard++){
    const headers = Object.assign({}, authHeaders(), { "Range-Unit":"items", "Range": offset + "-" + (offset+pageSize-1) });
    const res = await fetch(SUPABASE_URL + "/rest/v1/" + table + "?select=" + (select||"*") + q, { headers });
    if(!res.ok) throw new Error(table + ": HTTP " + res.status);
    const batch = await res.json();
    all = all.concat(batch);
    if(batch.length < pageSize) break;
    offset += pageSize;
  }
  return all;
}

async function generate(){
  const dateFrom = document.getElementById("dateFrom").value;
  const dateTo = document.getElementById("dateTo").value;
  const department = document.getElementById("department").value;
  const shift = document.getElementById("shift").value;
  const section = document.getElementById("section").value;
  const asset = document.getElementById("asset").value;
  if(!dateFrom || !dateTo){ alert("⚠️ Select both From and To dates"); return; }

  const status = document.getElementById("status");
  status.style.color=""; status.textContent = "Loading…";
  try{
    CTRL_ROWS = await fetchAllRows("control","*", "&date=gte."+dateFrom+"&date=lte."+dateTo);
    CTRL_ROWS.forEach(normalizeControlRow);
  }catch(e){
    status.style.color="#c0392b"; status.textContent = "Could not read data: " + (e.message||e); return;
  }
  status.textContent = "";
  // Refresh the asset dropdown from the loaded range (keep current pick if still valid).
  (function(){
    const sel=document.getElementById("asset"); if(!sel) return;
    const cur=sel.value;
    const assets=[...new Set(CTRL_ROWS.map(r=>r.assets).filter(Boolean))].sort();
    sel.innerHTML='<option>All</option>'+assets.map(a=>`<option value="${a}">${a}</option>`).join("");
    if(cur && assets.indexOf(cur)!==-1) sel.value=cur;
  })();

  const jobSet = department === "All" ? null : new Set(getJobCodesByDepartment(department));

  let rows = CTRL_ROWS.filter(r=>{
    if(r.date_col < dateFrom || r.date_col > dateTo) return false;
    if(jobSet && !jobSet.has(r.job_code)) return false;
    if(shift !== "All" && r.shift !== shift) return false;
    if(section !== "All" && r.section !== section) return false;
    if(asset !== "All" && r.assets !== asset) return false;
    return true;
  });

  // sort by Assets, Job Code, Date (matches the original's ORDER BY)
  rows = rows.slice().sort((a,b)=>
    (a.assets||"").localeCompare(b.assets||"") ||
    (a.job_code||"").localeCompare(b.job_code||"") ||
    (a.date_col||"").localeCompare(b.date_col||"")
  );

  const recordMap = {};
  rows.forEach(r=>{
    const key = r.assets + "|" + r.job_code;
    const nurseCell = r.names || "";
    const nurses = nurseCell.split(",").map(n=>n.trim()).filter(Boolean);
    if(!recordMap[key]) recordMap[key] = { date: r.date_col, assets: r.assets, jobCode: r.job_code, occurrence: 0, nurses: new Set() };
    recordMap[key].occurrence++;
    nurses.forEach(n=>recordMap[key].nurses.add(n));
  });

  const data = Object.values(recordMap).filter(r=>r.occurrence>=2).map(r=>({
    date: r.date, assets: r.assets, jobCode: r.jobCode, occurrence: r.occurrence,
    nurses: Array.from(r.nurses).join(", ")
  }));

  let html = "<table><tr><th>Date</th><th>Asset</th><th>Job Code</th><th>Occurrence</th><th>Nurses</th></tr>";
  if(!data.length){
    html += "<tr><td colspan='5'>✅ No persisting repairs found</td></tr>";
  } else {
    data.forEach(r=>{
      html += `<tr><td>${r.date}</td><td>${r.assets}</td><td>${r.jobCode}</td><td>${r.occurrence}</td><td>${r.nurses}</td></tr>`;
    });
  }
  html += "</table>";
  document.getElementById("reportArea").innerHTML = html;
}

init();
</script>
