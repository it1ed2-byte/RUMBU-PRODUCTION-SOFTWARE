<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HR — Create Query / Memo</title>
<link rel="stylesheet" href="../../styles.css">
<script>
  (function(){
    function apply(t){ if(t) document.documentElement.setAttribute("data-theme", t); }
    window.addEventListener("message", function(e){ if(e.data && e.data.rumbuTheme) apply(e.data.rumbuTheme); });
    try{ apply(localStorage.getItem("rumbu_theme")); }catch(e){}
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../auth.js"></script>
<script src="memo-print.js"></script>
<style>
  :root{--navy:var(--heading);--blue:var(--accent);--blue-dark:var(--accent-2);--muted:#6b7280;--red:#c0392b;--green:#1d8a4e;}
  *{box-sizing:border-box;}
  body{font-family:var(--sans);background:var(--bg);margin:0;padding:18px;color:var(--text);}
  .wrap{max-width:820px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;}
  .card h3{color:var(--navy);margin:0 0 4px;font-size:16px;}
  .card .sub{color:var(--blue);font-size:12px;margin:0 0 14px;}
  label{display:block;font-size:12px;font-weight:bold;color:var(--text);margin:10px 0 4px;}
  input,textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;}
  textarea{resize:vertical;min-height:60px;}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row > div{flex:1;min-width:180px;}
  button{padding:11px 16px;border:none;border-radius:8px;font-weight:bold;font-size:14px;cursor:pointer;background:var(--blue);color:#fff;margin-top:14px;}
  button:hover{background:var(--blue-dark);}
  button.secondary{background:#6b7280;}
  button.secondary:hover{background:#4b5563;}
  button:disabled{opacity:.6;cursor:not-allowed;}
  .status{margin-top:10px;font-weight:bold;font-size:13px;min-height:16px;}
  .status.ok{color:var(--green);} .status.err{color:var(--red);}
  #connStatus{font-size:12px;font-weight:bold;text-align:center;margin-bottom:10px;}
  .hidden{display:none;}
  .preview{margin-top:12px;}
  .preview iframe{width:100%;height:1000px;border:1px solid var(--line);border-radius:8px;background:#fff;}

  /* employee and sender pickers */
  .ac{position:relative;}
  .ac-list{position:absolute;left:0;right:0;top:100%;z-index:20;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.18);max-height:260px;overflow:auto;margin-top:2px;}
  .ac-item{padding:8px 10px;cursor:pointer;border-bottom:1px solid var(--line);}
  .ac-item:last-child{border-bottom:none;}
  .ac-item b{display:block;font-size:13px;}
  .ac-item span{font-size:11px;color:var(--muted);}
  .ac-item.on,.ac-item:hover{background:rgba(46,117,182,.14);}
  .ac-empty{padding:10px;font-size:12px;color:var(--muted);}
  .chip{margin-top:8px;padding:8px 10px;border:1px solid var(--line);border-left:4px solid var(--green);border-radius:8px;font-size:12px;line-height:1.5;background:rgba(29,138,78,.06);}
  .chip .warn{color:#b45309;font-weight:bold;display:block;}
  .chip .bad{color:var(--red);font-weight:bold;}
  .hint{font-size:11px;color:var(--muted);margin-top:4px;min-height:14px;}
  .chk{display:flex;align-items:center;gap:6px;font-weight:normal;margin:8px 0 0;}
  .chk input{width:auto;}
  .ac input.unpicked{border-color:var(--red);background:rgba(192,57,43,.05);}
</style>
</head>
<body>

<div class="wrap">
<div id="connStatus">Loading...</div>

<div class="card">
  <h3>Create Query / Memo</h3>
  <p class="sub" id="branchNote"></p>

  <div class="row">
    <div>
      <label>Letter Type</label>
      <select id="type" onchange="onTypeChange()">
        <option value="QUERY">QUERY</option>
        <option value="LAST WARNING">LAST WARNING</option>
        <option value="SURCHARGE">SURCHARGE</option>
        <option value="CUSTOM QUERY">CUSTOM QUERY</option>
      </select>
    </div>
    <div>
      <label>Memo Date</label>
      <input type="date" id="memoDate">
    </div>
  </div>

  <div class="row">
    <div>
      <label>Branch (this memo is for)</label>
      <select id="branch" onchange="onBranchChange()"></select>
    </div>
  </div>

  <div class="row">
    <div>
      <label>Employee Name</label>
      <div class="ac">
        <input type="text" id="name" placeholder="Start typing a name or ID" autocomplete="off">
        <div class="ac-list hidden" id="nameList"></div>
      </div>
    </div>
    <div>
      <label>Employee ID</label>
      <div class="ac">
        <input type="text" id="empId" placeholder="Start typing an ID, e.g. RD402" autocomplete="off">
        <div class="ac-list hidden" id="idList"></div>
      </div>
    </div>
  </div>
  <div class="hint" id="empMsg">Start typing (at least 2 letters). The list comes from the employee records. Pick the person and the ID and department fill in.</div>
  <label class="chk hidden" id="allBranchesRow"><input type="checkbox" id="allBranches"> Search employees in all branches</label>
  <div class="chip hidden" id="empChip"></div>

  <div class="row">
    <div>
      <label>Department (of employee)</label>
      <select id="department"></select>
    </div>
  </div>

  <div class="row">
    <div>
      <label>From (memo sender line)</label>
      <div class="ac">
        <input type="text" id="memoFrom" placeholder="Start typing the sender's name or ID" autocomplete="off">
        <div class="ac-list hidden" id="fromList"></div>
      </div>
      <div class="hint" id="fromMsg"></div>
      <div class="chip hidden" id="fromChip"></div>
    </div>
  </div>

  <!-- QUERY fields -->
  <div id="fld-query">
    <div class="row">
      <div>
        <label>Title (offence)</label>
        <input type="text" id="title" placeholder="e.g. Lateness to work">
      </div>
      <div>
        <label>Hours to respond <span style="font-weight:normal;color:var(--muted);">(default 2, you can change it)</span></label>
        <input type="number" id="hours" value="2" min="1" step="1" placeholder="e.g. 2">
      </div>
    </div>
    <label>Details</label>
    <textarea id="details" placeholder="Describe the incident / misconduct"></textarea>
    <label>Condition-of-Service Section reference</label>
    <input type="text" id="serviceSection" placeholder="e.g. 4.2">
  </div>

  <!-- LAST WARNING fields -->
  <div id="fld-warning" class="hidden">
    <label>Details</label>
    <textarea id="warnDetails" placeholder="Reason for the last warning"></textarea>
  </div>

  <!-- SURCHARGE fields -->
  <div id="fld-surcharge" class="hidden">
    <div class="row">
      <div>
        <label>Original Query Date</label>
        <input type="date" id="queryDate">
      </div>
      <div>
        <label>Surcharge Amount (NGN)</label>
        <input type="number" step="0.01" id="amount" placeholder="e.g. 5000">
      </div>
    </div>
    <label>Details</label>
    <textarea id="surDetails" placeholder="Reason for the surcharge"></textarea>
  </div>

  <!-- CUSTOM QUERY fields -->
  <div id="fld-custom" class="hidden">
    <label>Custom Subject</label>
    <input type="text" id="customSubject" placeholder="Subject line">
    <label>Body Paragraph 1</label>
    <textarea id="para1"></textarea>
    <label>Body Paragraph 2 (optional)</label>
    <textarea id="para2"></textarea>
    <label>Body Paragraph 3 (optional)</label>
    <textarea id="para3"></textarea>
    <label>Body Paragraph 4 (optional)</label>
    <textarea id="para4"></textarea>
    <label>Body Paragraph 5 (optional)</label>
    <textarea id="para5"></textarea>
  </div>

  <div>
    <button class="secondary" onclick="doPreview()">Preview</button>
    <button onclick="saveAndPrint()">Save &amp; Generate PDF</button>
  </div>
  <div class="status" id="status"></div>

  <div id="previewBox" class="preview hidden"></div>
</div>
</div>

<script>
let ME = null;
let SEL_EMP = null;    // the employee row picked from the employees table
let SEL_FROM = null;   // the sender row picked from the employees table
const DEFAULT_HOURS = "2";   // hours to respond, unless the sender changes it

const $ = id => document.getElementById(id);
function todayISO(){ return new Date().toISOString().slice(0,10); }
function esc(s){
  return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function same(a, b){ return String(a||"").trim().toLowerCase() === String(b||"").trim().toLowerCase(); }
function isInactive(e){
  return !!e.deactivated_at || /inactive|deactivated|terminated|resigned|dismissed/i.test(e.status || "");
}

async function logActivity(actionType, description){
  try{
    await sb.from("activity_log").insert({
      actor_id: ME.id, actor_username: ME.username, actor_role: ME.role,
      section_id: ME.sectionId, action_type: actionType, description: description
    });
  }catch(e){ console.warn("Activity log write failed (non-fatal):", e); }
}

async function init(){
  const status = $("connStatus");
  try{
    ME = await requireAuth("../../login.html");
    if(!ME) return;

    $("memoDate").value = todayISO();
    await populateBranches();
    $("branchNote").textContent = "Signed in as " + ME.username;

    // Only Admins and Super Admins may look beyond the selected branch for the employee.
    $("allBranchesRow").classList.toggle("hidden", !(ME.role === "super_admin" || ME.role === "admin"));

    wireSearch($("name"),    $("nameList"), { all: () => allBranchesOn(), onPick: pickEmployee, onEdit: () => onEmployeeEdit("name"), onBlur: () => resolveTyped($("name"), "emp") });
    wireSearch($("empId"),   $("idList"),   { all: () => allBranchesOn(), onPick: pickEmployee, onEdit: () => onEmployeeEdit("id"),   onBlur: () => resolveTyped($("empId"), "emp") });
    wireSearch($("memoFrom"),$("fromList"), { all: () => true,            onPick: pickFrom,     onEdit: onFromEdit,                   onBlur: () => resolveTyped($("memoFrom"), "from") });

    status.style.color = "#1d8a4e";
    status.textContent = "Connected.";
    onTypeChange();
    await onBranchChange();
  }catch(e){
    status.style.color = "#c0392b";
    status.textContent = "❌ " + e.message;
    console.error(e);
  }
}

function onTypeChange(){
  const t = $("type").value;
  $("fld-query").classList.toggle("hidden", t !== "QUERY");
  $("fld-warning").classList.toggle("hidden", t !== "LAST WARNING");
  $("fld-surcharge").classList.toggle("hidden", t !== "SURCHARGE");
  $("fld-custom").classList.toggle("hidden", t !== "CUSTOM QUERY");
}

// Populate the Branch dropdown with ONLY the branches this person is
// assigned to, so a memo can never be created for an unassigned branch.
// Super Admin (no/all branches) can pick from every branch instead.
async function populateBranches(){
  const sel = $("branch");
  sel.innerHTML = "";

  if(ME.role === "super_admin"){
    const { data } = await sb.from("app_sections").select("name").order("name");
    (data || []).forEach(s=>{
      const o = document.createElement("option");
      o.value = s.name; o.textContent = s.name;
      sel.appendChild(o);
    });
    sel.disabled = false;
    return;
  }

  const mine = ME.sectionNames || [];
  if(!mine.length){
    const o = document.createElement("option");
    o.value = ""; o.textContent = "— no branch assigned —";
    sel.appendChild(o);
    sel.disabled = true;
    return;
  }

  mine.forEach(name=>{
    const o = document.createElement("option");
    o.value = name; o.textContent = name;
    sel.appendChild(o);
  });
  // Single branch -> auto-select and lock, matching the pattern used elsewhere.
  sel.disabled = (mine.length === 1);
}

function allBranchesOn(){ return !$("allBranchesRow").classList.contains("hidden") && $("allBranches").checked; }

// ---- Branch and department -------------------------------------------------
async function onBranchChange(){
  clearEmployee();
  await loadDepartments($("branch").value);
}

async function loadDepartments(branch){
  const sel = $("department");
  sel.innerHTML = "";
  const first = document.createElement("option");
  first.value = ""; first.textContent = "Select department";
  sel.appendChild(first);
  if(!branch) return;
  const { data, error } = await sb.from("departments").select("id,name").eq("section", branch).order("name");
  if(error){ $("status").className = "status err"; $("status").textContent = "❌ Could not load departments: " + error.message; return; }
  (data || []).forEach(d=>{
    const o = document.createElement("option");
    o.value = d.name; o.textContent = d.name;
    sel.appendChild(o);
  });
}

// Select the employee's own department; if it is not in the branch list, add it so it is never lost.
function setDepartment(name){
  const sel = $("department");
  const wanted = String(name || "").trim();
  if(!wanted){ sel.value = ""; return; }
  let found = null;
  Array.prototype.forEach.call(sel.options, o => { if(same(o.value, wanted)) found = o; });
  if(!found){
    found = document.createElement("option");
    found.value = wanted; found.textContent = wanted + " (as registered)";
    sel.appendChild(found);
  }
  sel.value = found.value;
}

// ---- Employee search -------------------------------------------------------
function cleanTerm(s){ return String(s || "").replace(/[%,()*"'\\]/g, " ").replace(/\s+/g, " ").trim(); }

async function searchEmployees(term, allBranches){
  const t = cleanTerm(term);
  if(t.length < 2) return [];
  const p = t.replace(/ /g, "%");   // "noah chukwu" also matches names stored with double spaces
  let q = sb.from("employees")
    .select("id,employee_id,full_name,department,unit,branch,rank,status,deactivated_at")
    .or("full_name.ilike.%" + p + "%,employee_id.ilike.%" + p + "%")
    .order("full_name").limit(15);
  if(!allBranches) q = q.eq("branch", $("branch").value || "___none___");
  const { data, error } = await q;
  if(error) throw error;
  return data || [];
}

function wireSearch(input, list, cfg){
  let timer = null, items = [], active = -1, seq = 0;

  function close(){ list.classList.add("hidden"); list.innerHTML = ""; items = []; active = -1; }
  function render(){
    if(!items.length){
      list.innerHTML = '<div class="ac-empty">No matching employee found</div>';
      list.classList.remove("hidden");
      return;
    }
    list.innerHTML = items.map((e, i) =>
      '<div class="ac-item' + (i === active ? " on" : "") + '" data-i="' + i + '"><b>' + esc(e.full_name) + '</b><span>' +
      esc(e.employee_id) + " · " + esc(e.branch || "no branch") + " · " + esc(e.department || "no department") +
      (e.rank ? " · " + esc(e.rank) : "") + (isInactive(e) ? " · INACTIVE" : "") + "</span></div>"
    ).join("");
    list.classList.remove("hidden");
  }
  function pick(i){ const e = items[i]; if(!e) return; close(); cfg.onPick(e); }

  input.addEventListener("input", function(){
    if(cfg.onEdit) cfg.onEdit();
    refreshPickState();
    clearTimeout(timer);
    if(cleanTerm(input.value).length < 2){ seq++; close(); return; }
    timer = setTimeout(async function(){
      const mine = ++seq;
      list.innerHTML = '<div class="ac-empty">Searching the employee records...</div>';
      list.classList.remove("hidden");
      let res;
      try{ res = await searchEmployees(input.value, cfg.all()); }
      catch(e){ $("status").className = "status err"; $("status").textContent = "❌ Search failed: " + e.message; return; }
      if(mine !== seq) return;   // a newer search is already running
      items = res; active = res.length ? 0 : -1; render();
    }, 250);
  });
  input.addEventListener("keydown", function(ev){
    if(list.classList.contains("hidden") || !items.length) return;
    if(ev.key === "ArrowDown"){ ev.preventDefault(); active = (active + 1) % items.length; render(); }
    else if(ev.key === "ArrowUp"){ ev.preventDefault(); active = (active - 1 + items.length) % items.length; render(); }
    else if(ev.key === "Enter"){ ev.preventDefault(); pick(active); }
    else if(ev.key === "Escape"){ close(); }
  });
  list.addEventListener("mousedown", function(ev){
    const it = ev.target.closest(".ac-item");
    if(!it) return;
    ev.preventDefault();
    pick(parseInt(it.getAttribute("data-i"), 10));
  });
  input.addEventListener("blur", function(){
    setTimeout(close, 150);
    if(cfg.onBlur) cfg.onBlur();
  });
}

// ---- Picked employee ---------------------------------------------------------
function pickEmployee(e){
  SEL_EMP = e;
  $("name").value = e.full_name || "";
  $("empId").value = e.employee_id || "";
  setDepartment(e.department);
  $("empMsg").textContent = "";
  renderEmpChip();
  refreshPickState();
}

// Red outline on any box that holds typed text which is not (yet) a real employee from the list.
function refreshPickState(){
  $("name").classList.toggle("unpicked",     !!$("name").value.trim()     && !SEL_EMP);
  $("empId").classList.toggle("unpicked",    !!$("empId").value.trim()    && !SEL_EMP);
  $("memoFrom").classList.toggle("unpicked", !!$("memoFrom").value.trim() && !SEL_FROM);
}

function renderEmpChip(){
  const chip = $("empChip");
  if(!SEL_EMP){ chip.classList.add("hidden"); chip.innerHTML = ""; return; }
  const e = SEL_EMP;
  const bits = [e.branch || "no branch", e.department || "no department", e.unit, e.rank].filter(Boolean);
  let h = "<b>" + esc(e.full_name) + "</b> · " + esc(e.employee_id) + "<br>Registered: " + esc(bits.join(" · "));
  if(isInactive(e)) h += '<span class="bad">INACTIVE: this employee is marked as deactivated.</span>';
  const memoBranch = $("branch").value;
  if(e.branch && memoBranch && !same(e.branch, memoBranch)) h += '<span class="warn">This employee is registered under a different branch from the one selected above.</span>';
  chip.innerHTML = h;
  chip.classList.remove("hidden");
}

function clearEmployee(){
  SEL_EMP = null;
  $("name").value = ""; $("empId").value = "";
  $("empMsg").textContent = "Start typing (at least 2 letters). The list comes from the employee records. Pick the person and the ID and department fill in.";
  if($("department").options.length) $("department").value = "";
  renderEmpChip();
  refreshPickState();
}

// Typing over a picked employee drops the pick, so a name and ID can never get out of step.
function onEmployeeEdit(which){
  if(!SEL_EMP) return;
  const typed = which === "name" ? $("name").value : $("empId").value;
  const ref   = which === "name" ? SEL_EMP.full_name : SEL_EMP.employee_id;
  if(same(typed, ref)) return;
  SEL_EMP = null;
  if(which === "name") $("empId").value = ""; else $("name").value = "";
  $("department").value = "";
  renderEmpChip();
  refreshPickState();
}

// When you leave a box that holds typed text that was not picked from the list:
//   * exactly one employee matches (or the ID / full name matches exactly) -> that person is picked for you;
//   * otherwise the box is cleared, so it can never keep an incomplete name.
async function resolveTyped(input, kind){
  const picked = kind === "emp" ? SEL_EMP : SEL_FROM;
  const text = input.value.trim();
  if(!text || picked) return;
  const msg = kind === "emp" ? $("empMsg") : $("fromMsg");
  const all = kind === "emp" ? allBranchesOn() : true;
  let res;
  try{ res = await searchEmployees(text, all); }
  catch(e){ msg.textContent = "Lookup failed: " + e.message; return; }
  // the person may have picked someone, or typed something else, while the lookup ran
  if((kind === "emp" ? SEL_EMP : SEL_FROM) || input.value.trim() !== text) return;

  const exact = res.filter(e => same(e.employee_id, text) || same(e.full_name, text));
  const choice = exact.length === 1 ? exact[0] : (res.length === 1 ? res[0] : null);
  if(choice){ if(kind === "emp") pickEmployee(choice); else pickFrom(choice); return; }

  if(kind === "emp") clearEmployee(); else { input.value = ""; refreshPickState(); }
  msg.textContent = res.length
    ? res.length + " people match \"" + text + "\". Type more of the name, or pick one from the list."
    : "No employee matches \"" + text + "\"" + (all ? "." : " in this branch.");
}

// ---- Sender -------------------------------------------------------------------
function pickFrom(e){
  SEL_FROM = e;
  $("memoFrom").value = e.full_name || "";
  $("fromMsg").textContent = "";
  renderFromChip();
  refreshPickState();
}
function renderFromChip(){
  const chip = $("fromChip");
  if(!SEL_FROM){ chip.classList.add("hidden"); chip.innerHTML = ""; return; }
  const e = SEL_FROM;
  let h = "<b>" + esc(e.full_name) + "</b> · " + esc(e.employee_id) + "<br>" +
          (e.rank ? "Designation: " + esc(e.rank) : '<span class="warn">No designation is recorded for this person. The memo will show the name only.</span>');
  if(isInactive(e)) h += '<span class="bad">INACTIVE: this person is marked as deactivated.</span>';
  chip.innerHTML = h;
  chip.classList.remove("hidden");
}
function onFromEdit(){
  if(!SEL_FROM) return;
  if(same($("memoFrom").value, SEL_FROM.full_name)) return;
  SEL_FROM = null;
  renderFromChip();
  refreshPickState();
}

// ---- Form data ------------------------------------------------------------------
function collect(){
  const t = $("type").value;
  const g = id => $(id).value.trim();
  const fromName = SEL_FROM ? SEL_FROM.full_name : "";
  const fromRank = SEL_FROM ? (SEL_FROM.rank || "") : "";
  return {
    type: t,
    branch: g("branch"),
    name: SEL_EMP ? SEL_EMP.full_name : g("name"),
    empId: SEL_EMP ? SEL_EMP.employee_id : g("empId"),
    department: g("department"),
    fromId: SEL_FROM ? SEL_FROM.employee_id : "",
    fromName: fromName,
    fromRank: fromRank,
    memoFrom: fromName ? fromName + (fromRank ? ", " + fromRank : "") : "",
    memoDate: g("memoDate"),
    title: g("title"),
    details: t === "QUERY" ? g("details") : (t === "LAST WARNING" ? g("warnDetails") : g("surDetails")),
    serviceSection: g("serviceSection"),
    hours: g("hours"),
    queryDate: g("queryDate"),
    amount: g("amount"),
    customSubject: g("customSubject"),
    paras: [g("para1"), g("para2"), g("para3"), g("para4"), g("para5")]
  };
}

// Year-wise sequential tracking number, read from Supabase.
// "skip" moves the number on when a save collides with a number someone else just took.
async function nextTracking(skip){
  const year = new Date().getFullYear().toString();
  const { data, error } = await sb
    .from("hr_queries")
    .select("tracking_number")
    .like("tracking_number", year + "%")
    .order("tracking_number", { ascending: false })
    .limit(1);
  if(error) throw error;
  let seq = 1;
  if(data && data.length){
    const last = data[0].tracking_number;
    seq = parseInt(last.slice(4), 10) + 1;
  }
  return year + String(seq + (skip || 0)).padStart(4, "0");
}

function doPreview(){
  const d = collect();
  const box = $("previewBox");
  box.classList.remove("hidden");
  box.innerHTML = '<iframe id="pv" title="Memo preview"></iframe>';
  $("pv").srcdoc = MemoPrint.html(d, "(assigned on save)", { preview: true });
}

function validate(d){
  if(!SEL_EMP){ return "Pick the employee from the list, so the name and ID come from the employee records."; }
  if(!SEL_FROM){ return "Pick the sender (From) from the list."; }
  if(!d.memoDate){ return "Memo date is required."; }
  if(d.type === "QUERY" && (!d.title || !d.details)){ return "Query needs a title and details."; }
  if(d.type === "QUERY" && !d.hours){ return "Enter the hours the employee has to respond."; }
  if(d.type === "LAST WARNING" && !d.details){ return "Last warning needs details."; }
  if(d.type === "SURCHARGE" && (!d.amount || !d.details)){ return "Surcharge needs an amount and details."; }
  if(d.type === "SURCHARGE" && !d.queryDate){ return "Enter the date of the original query."; }
  if(d.type === "CUSTOM QUERY" && (!d.customSubject || !d.paras[0])){ return "Custom query needs a subject and at least one paragraph."; }
  return null;
}

async function saveAndPrint(){
  const status = $("status");
  const d = collect();

  const err = validate(d);
  if(err){ status.className = "status err"; status.textContent = err; return; }
  if(!d.branch){
    status.className = "status err";
    status.textContent = "No Branch available — ask your Super Admin to assign you a Branch.";
    return;
  }
  // Safety: a non-super-admin can only ever create for a branch they hold.
  if(ME.role !== "super_admin" && (ME.sectionNames || []).indexOf(d.branch) === -1){
    status.className = "status err";
    status.textContent = "You are not assigned to that Branch.";
    return;
  }
  if(isInactive(SEL_EMP) && !confirm(SEL_EMP.full_name + " is marked as deactivated. Issue the memo anyway?")) return;

  // Open the PDF window now, while the click is still fresh, so the browser does not block it.
  const w = window.open("", "_blank");
  if(w){ try{ w.document.write("<p style='font-family:Arial,sans-serif;padding:24px'>Saving memo, please wait...</p>"); }catch(e){} }

  status.className = "status"; status.textContent = "Saving...";
  try{
    let tracking = null, lastErr = null;
    for(let attempt = 0; attempt < 3 && !tracking; attempt++){
      const candidate = await nextTracking(attempt);
      const row = {
        tracking_number: candidate,
        branch: d.branch,
        employee_name: d.name,
        employee_id: d.empId || null,
        letter_type: d.type,
        department: d.department || null,
        memo_from: d.memoFrom || null,
        from_employee_id: d.fromId || null,
        from_name: d.fromName || null,
        from_rank: d.fromRank || null,
        memo_date: d.memoDate || null,
        title: d.title || null,
        details: d.details || null,
        service_section: d.serviceSection || null,
        hours: d.hours ? parseInt(d.hours, 10) : null,
        query_date: d.queryDate || null,
        amount: d.amount ? parseFloat(d.amount) : null,
        custom_subject: d.customSubject || null,
        para1: d.paras[0] || null,
        para2: d.paras[1] || null,
        para3: d.paras[2] || null,
        para4: d.paras[3] || null,
        para5: d.paras[4] || null,
        created_by_username: ME.username
      };
      const { error } = await sb.from("hr_queries").insert(row);
      if(!error){ tracking = candidate; break; }
      if(error.code === "23505"){ lastErr = error; continue; }   // number already taken: try the next one
      throw error;
    }
    if(!tracking) throw lastErr || new Error("Could not get a free tracking number.");

    await logActivity("hr_query_created", ME.username + " created a " + d.type + " memo for " + d.name + " (" + tracking + ")");

    status.className = "status ok";
    if(w){
      status.textContent = "✅ Saved as " + tracking + ". Opening PDF...";
      MemoPrint.write(w, d, tracking);
    }else{
      status.textContent = "✅ Saved as " + tracking + ", but your browser blocked the PDF window. Allow pop-ups for this site, then use Reprint in Manage Query/Memo.";
    }

    // Clear the employee and the details; keep type, date, branch and sender for the next memo.
    clearEmployee();
    ["title","details","serviceSection","queryDate","amount","customSubject","para1","para2","para3","para4","para5","warnDetails","surDetails"]
      .forEach(id => { const el = $(id); if(el) el.value = ""; });
    $("hours").value = DEFAULT_HOURS;
    $("previewBox").classList.add("hidden");
  }catch(e){
    if(w){ try{ w.close(); }catch(x){} }
    status.className = "status err";
    status.textContent = "❌ " + e.message;
  }
}

init();
</script>
</body>
</html>
