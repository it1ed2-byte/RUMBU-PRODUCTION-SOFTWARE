<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HR — Manage Query / Memo</title>
<link rel="stylesheet" href="../../styles.css">
<script>
  (function(){
    function apply(t){ if(t) document.documentElement.setAttribute("data-theme", t); }
    window.addEventListener("message", function(e){ if(e.data && e.data.rumbuTheme) apply(e.data.rumbuTheme); });
    try{ apply(localStorage.getItem("rumbu_theme")); }catch(e){}
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../auth.js"></script>
<script src="memo-print.js"></script>
<style>
  :root{--navy:var(--heading);--blue:var(--accent);--blue-dark:var(--accent-2);--muted:#6b7280;--red:#c0392b;--green:#1d8a4e;}
  *{box-sizing:border-box;}
  body{font-family:var(--sans);background:var(--bg);margin:0;padding:18px;color:var(--text);}
  .wrap{max-width:1050px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;}
  .card h3{color:var(--navy);margin:0 0 4px;font-size:16px;}
  .card .sub{color:var(--blue);font-size:12px;margin:0 0 14px;}
  label{display:block;font-size:12px;font-weight:bold;color:var(--text);margin:10px 0 4px;}
  input,select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
  .row > div{flex:1;min-width:150px;}
  button{padding:10px 14px;border:none;border-radius:8px;font-weight:bold;font-size:13px;cursor:pointer;background:var(--blue);color:#fff;}
  button:hover{background:var(--blue-dark);}
  button.mini{padding:6px 10px;font-size:12px;}
  button.del{background:var(--red);}
  button.del:hover{background:#96242e;}
  button.reprint{background:#6b7280;}
  button.reprint:hover{background:#4b5563;}
  .status{margin-top:10px;font-weight:bold;font-size:13px;min-height:16px;}
  .status.ok{color:var(--green);} .status.err{color:var(--red);}
  #connStatus{font-size:12px;font-weight:bold;text-align:center;margin-bottom:10px;}
  table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px;}
  th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;}
  thead th{background:var(--navy);color:#fff;font-size:12px;position:sticky;top:0;}
  tbody tr:nth-child(even){background:#f6f8fb;}
  .tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:bold;color:#fff;}
  .tag.QUERY{background:#2E75B6;}
  .tag.LASTWARNING{background:#d97706;}
  .tag.SURCHARGE{background:#c0392b;}
  .tag.CUSTOMQUERY{background:#6b7280;}
</style>
</head>
<body>

<div class="wrap">
<div id="connStatus">Loading...</div>

<div class="card">
  <h3>Manage Query / Memo</h3>
  <p class="sub" id="scopeNote"></p>

  <div class="row">
    <div>
      <label>From Date</label>
      <input type="date" id="fromDate">
    </div>
    <div>
      <label>To Date</label>
      <input type="date" id="toDate">
    </div>
    <div>
      <label>Type</label>
      <select id="typeFilter">
        <option value="">All</option>
        <option value="QUERY">QUERY</option>
        <option value="LAST WARNING">LAST WARNING</option>
        <option value="SURCHARGE">SURCHARGE</option>
        <option value="CUSTOM QUERY">CUSTOM QUERY</option>
      </select>
    </div>
    <div>
      <label>Search (name / ID / tracking)</label>
      <input type="text" id="search" placeholder="Type to filter" oninput="applyFilters()">
    </div>
    <div style="flex:0 0 auto;">
      <button onclick="loadRecords()">Refresh</button>
    </div>
  </div>
  <div class="status" id="status"></div>
</div>

<div class="card">
  <div id="tableWrap"></div>
</div>
</div>

<script>
let ME = null;
let ALL = [];   // all rows fetched (already branch-scoped)

async function logActivity(actionType, description){
  try{
    await sb.from("activity_log").insert({
      actor_id: ME.id, actor_username: ME.username, actor_role: ME.role,
      section_id: ME.sectionId, action_type: actionType, description: description
    });
  }catch(e){ console.warn("Activity log write failed (non-fatal):", e); }
}

async function init(){
  const status = document.getElementById("connStatus");
  try{
    ME = await requireAuth("../../login.html");
    if(!ME) return;

    document.getElementById("scopeNote").textContent = ME.role === "super_admin"
      ? "Showing memos from every Branch."
      : "Showing memos for your own Branch only" + (ME.sectionName ? " (" + ME.sectionName + ")." : ".");

    status.style.color = "#1d8a4e";
    status.textContent = "Connected.";
    await loadRecords();
  }catch(e){
    status.style.color = "#c0392b";
    status.textContent = "❌ " + e.message;
    console.error(e);
  }
}

async function loadRecords(){
  const status = document.getElementById("status");
  status.className = "status"; status.textContent = "Loading...";
  try{
    let q = sb.from("hr_queries").select("*").order("created_at", { ascending: false });

    // Branch scoping: everyone except Super Admin sees only their own Branch(es).
    if(ME.role !== "super_admin"){
      if(ME.sectionNames && ME.sectionNames.length){
        q = q.in("branch", ME.sectionNames);
      } else {
        // No branch assigned — show nothing rather than everything.
        q = q.eq("branch", "___none___");
      }
    }

    const { data, error } = await q;
    if(error) throw error;
    ALL = data || [];
    status.className = "status ok"; status.textContent = ALL.length + " record(s) loaded.";
    applyFilters();
  }catch(e){
    status.className = "status err"; status.textContent = "❌ " + e.message;
  }
}

function applyFilters(){
  const from = document.getElementById("fromDate").value;
  const to = document.getElementById("toDate").value;
  const type = document.getElementById("typeFilter").value;
  const search = document.getElementById("search").value.trim().toLowerCase();

  let rows = ALL.slice();

  if(from) rows = rows.filter(r => (r.memo_date || "") >= from);
  if(to)   rows = rows.filter(r => (r.memo_date || "") <= to);
  if(type) rows = rows.filter(r => r.letter_type === type);
  if(search){
    rows = rows.filter(r =>
      (r.employee_name || "").toLowerCase().includes(search) ||
      (r.employee_id || "").toLowerCase().includes(search) ||
      (r.tracking_number || "").toLowerCase().includes(search)
    );
  }
  render(rows);
}

function render(rows){
  const wrap = document.getElementById("tableWrap");
  if(!rows.length){ wrap.innerHTML = "<p>No records match.</p>"; return; }

  const canDelete = (ME.role === "super_admin" || ME.role === "admin");

  let html = "<table><thead><tr>" +
    "<th>Tracking</th><th>Date</th><th>Type</th><th>Employee</th><th>ID</th>" +
    "<th>Dept</th><th>Branch</th><th>Details</th><th>By</th><th>Actions</th>" +
    "</tr></thead><tbody>";

  rows.forEach(r=>{
    const tagCls = (r.letter_type || "").replace(/\s+/g, "");
    let summary = r.details || r.custom_subject || "";
    if(r.letter_type === "SURCHARGE" && r.amount) summary += " (₦" + r.amount + ")";
    html += "<tr>" +
      `<td>${r.tracking_number || ""}</td>` +
      `<td>${r.memo_date || ""}</td>` +
      `<td><span class="tag ${tagCls}">${r.letter_type || ""}</span></td>` +
      `<td>${r.employee_name || ""}</td>` +
      `<td>${r.employee_id || ""}</td>` +
      `<td>${r.department || ""}</td>` +
      `<td>${r.branch || ""}</td>` +
      `<td>${summary}</td>` +
      `<td>${r.created_by_username || ""}</td>` +
      `<td>` +
        `<button class="mini reprint" onclick="reprint(${r.id})">Reprint</button> ` +
        (canDelete ? `<button class="mini del" onclick="removeRow(${r.id})">Delete</button>` : "") +
      `</td>` +
    "</tr>";
  });
  html += "</tbody></table>";
  wrap.innerHTML = html;
}

// ---- Reprint: rebuild the memo from the stored row, using the same design as Create Query / Memo ----
function reprint(id){
  const r = ALL.find(x => x.id === id);
  if(!r) return;
  const w = window.open("", "_blank");
  if(!w){
    const status = document.getElementById("status");
    status.className = "status err";
    status.textContent = "Your browser blocked the PDF window. Allow pop-ups for this site and try again.";
    return;
  }
  MemoPrint.write(w, MemoPrint.fromRow(r), r.tracking_number);
}

async function removeRow(id){
  const r = ALL.find(x => x.id === id);
  if(!r) return;
  if(!confirm("Delete memo " + r.tracking_number + " for " + r.employee_name + "? This cannot be undone.")) return;

  const status = document.getElementById("status");
  status.className = "status"; status.textContent = "Deleting...";
  try{
    const { error } = await sb.from("hr_queries").delete().eq("id", id);
    if(error) throw error;
    await logActivity("hr_query_deleted", ME.username + " deleted memo " + r.tracking_number + " (" + r.employee_name + ")");
    status.className = "status ok"; status.textContent = "✅ Deleted " + r.tracking_number + ".";
    await loadRecords();
  }catch(e){
    status.className = "status err"; status.textContent = "❌ " + e.message;
  }
}

init();
</script>
</body>
</html>
