<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pending Requests</title>
<link rel="stylesheet" href="../../styles.css">
<script>
  (function(){
    function apply(t){ if(t) document.documentElement.setAttribute("data-theme",t); }
    window.addEventListener("message",function(e){ if(e.data&&e.data.rumbuTheme) apply(e.data.rumbuTheme); });
    try{ apply(localStorage.getItem("rumbu_theme")); }catch(e){}
  })();
</script>
<style>
  *{ box-sizing:border-box; }
  body{ font-family:var(--sans); background:var(--bg); margin:0; padding:16px; }
  .card{ background:var(--card); width:100%; max-width:1200px; margin:0 auto 16px; padding:20px; border-radius:12px; box-shadow:0 4px 12px rgba(0,0,0,.11); }
  h2{ text-align:center; color:var(--heading); border-bottom:2px solid var(--heading); padding-bottom:10px; margin:0 0 16px; font-size:18px; }
  #connStatus{ font-size:11px; text-align:center; color:#666; margin-bottom:10px; }
  .summary-row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .chip{ padding:7px 16px; border-radius:20px; font-size:12px; font-weight:700; white-space:nowrap; }
  .chip-total{ background:#e8f0fb; color:#1F3864; }
  .chip-submitted{ background:#dbeafe; color:#1d4ed8; }
  .chip-ack{ background:#e0f2fe; color:#0369a1; }
  .chip-progress{ background:#fef9c3; color:#92400e; }
  .chip-critical{ background:#fee2e2; color:#dc2626; }
  .toolbar{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px; align-items:center; }
  .toolbar input,.toolbar select{ padding:9px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:13px; outline:none; }
  .toolbar input{ flex:1; min-width:160px; }
  .toolbar select{ width:auto; }
  .count-label{ font-size:12px; color:#666; }
  .table-wrap{ overflow-x:auto; }
  table{ border-collapse:collapse; width:100%; font-size:13px; min-width:900px; }
  th{ background:var(--heading); color:#fff; padding:10px 8px; text-align:left; white-space:nowrap; }
  td{ padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tr:hover td{ background:var(--bg); }
  .badge{ display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; }
  .badge-submitted{ background:#dbeafe; color:#1d4ed8; }
  .badge-acknowledged{ background:#e0f2fe; color:#0369a1; }
  .badge-in_progress{ background:#fef9c3; color:#92400e; }
  .badge-partially_released{ background:#fff7ed; color:#c2410c; }
  .pri-Normal{ color:#2563eb; font-weight:700; }
  .pri-Urgent{ color:#d97706; font-weight:700; }
  .pri-Critical{ color:#dc2626; font-weight:700; }
  .req-link{ color:var(--accent); font-weight:700; text-decoration:underline; cursor:pointer; }
  .process-btn{ padding:5px 12px; background:var(--heading); color:#fff; border:none; border-radius:6px; cursor:pointer; font-size:12px; font-weight:600; }
  .pagination{ display:flex; align-items:center; justify-content:center; gap:6px; margin-top:14px; flex-wrap:wrap; }
  .pagination button{ padding:6px 12px; font-size:12px; background:var(--bg); color:var(--heading); border:1px solid var(--line); border-radius:6px; font-weight:600; cursor:pointer; }
  .pagination button.active{ background:var(--heading); color:#fff; }
  .pagination button:disabled{ opacity:.4; cursor:default; }
  .page-info{ font-size:12px; color:#666; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../auth.js"></script>
<script src="store-access.js"></script>
</head>
<body>
<div class="card">
  <h2>⏳ Pending Requests — Store View</h2>
  <div id="connStatus">Connecting...</div>
  <div class="summary-row" id="summaryRow"></div>
  <div class="toolbar">
    <input type="text" id="searchBox" placeholder="🔍 Search title, number or department..." oninput="onSearch()">
    <select id="filterStore" onchange="onSearch()"><option value="">All My Stores</option></select>
    <select id="filterPri" onchange="onSearch()">
      <option value="">All Priorities</option>
      <option value="Critical">🔴 Critical</option>
      <option value="Urgent">🟡 Urgent</option>
      <option value="Normal">🔵 Normal</option>
    </select>
    <select id="filterStatus" onchange="onSearch()">
      <option value="">All Pending</option>
      <option value="submitted">Submitted</option>
      <option value="partially_released">Partially Released</option>
    </select>
    <select id="rowsPerPage" onchange="onRowsChange()">
      <option value="10">10 rows</option>
      <option value="25" selected>25 rows</option>
      <option value="50">50 rows</option>
    </select>
    <button style="width:auto;padding:9px 14px;background:var(--heading);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;" onclick="loadData()">⟳ Refresh</button>
    <span class="count-label" id="countLabel"></span>
  </div>
  <div class="table-wrap"><div id="tableArea">Loading...</div></div>
  <div class="pagination" id="paginationArea"></div>
</div>

<script>
let ACCESS_TOKEN=null;
let ME=null, ALL_ROWS=[], FILTERED=[], currentPage=1, LAST_RELEASE={}, MY_STORE_IDS=[];
let EMP_MAP={};  // profile_id → {full_name, department}
const PENDING_STATUSES=["submitted","acknowledged","in_progress","partially_released"];
function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function authHeaders(){ return {"apikey":SUPABASE_ANON_KEY,"Authorization":"Bearer "+(ACCESS_TOKEN||SUPABASE_ANON_KEY)}; }
function fmtDate(d){ return d?d.slice(0,10):"—"; }
function getRowsPerPage(){ return Number(document.getElementById("rowsPerPage").value)||25; }
function statusBadge(s){ return `<span class="badge badge-${s}">${esc(s.replace(/_/g," "))}</span>`; }
function priBadge(p){ return `<span class="pri-${p}">${p==="Normal"?"🔵":p==="Urgent"?"🟡":"🔴"} ${p}</span>`; }

async function loadData(){
  document.getElementById("tableArea").innerHTML="Loading...";
  try{
    // Only the stores this user approves (Super Admin: everything)
    MY_STORE_IDS=await rsApproverStoreIds(ME);
    const scope=rsApproverFilter(MY_STORE_IDS);
    if(scope===null){
      ALL_ROWS=[];
      document.getElementById("summaryRow").innerHTML="";
      document.getElementById("tableArea").innerHTML="<p style='color:#92400e;font-weight:600;font-size:13px;'>You are not an approver for any store, so no requests are assigned to you. An admin can add you in Store Setup.</p>";
      document.getElementById("countLabel").textContent="";
      return;
    }
    const res=await fetch(SUPABASE_URL+"/rest/v1/requests?select=*&status=in.("+PENDING_STATUSES.join(",")+")"+scope+"&approval_status=in.(not_required,approved)&order=priority.asc,created_at.asc",
      {headers:Object.assign({},authHeaders(),{"Range-Unit":"items","Range":"0-4999"})});
    if(!res.ok) throw new Error("HTTP "+res.status);
    ALL_ROWS=await res.json();

    // Batch-fetch employee full names + departments for all requesters
    const profileIds=[...new Set(ALL_ROWS.map(r=>r.requester_id).filter(Boolean))];
    EMP_MAP={};
    if(profileIds.length){
      const { data:emps } = await sb.from("employees")
        .select("linked_profile_id,full_name,department")
        .in("linked_profile_id", profileIds);
      (emps||[]).forEach(e=>{ EMP_MAP[e.linked_profile_id]={full_name:e.full_name,department:e.department}; });
    }

    const stores=[...new Set(ALL_ROWS.map(r=>r.store_name||"(no store)"))].sort();
    const fs=document.getElementById("filterStore"), keep=fs.value;
    fs.innerHTML='<option value="">All My Stores</option>'+stores.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join("");
    if(stores.includes(keep)) fs.value=keep;
    // Sort: Critical first, then Urgent, then Normal
    const priOrder={Critical:0,Urgent:1,Normal:2};
    ALL_ROWS.sort((a,b)=>(priOrder[a.priority]||2)-(priOrder[b.priority]||2)||new Date(a.created_at)-new Date(b.created_at));
    // Latest release per request, for the "Released By" column
    LAST_RELEASE={};
    const ids=ALL_ROWS.filter(r=>r.status==="partially_released").map(r=>r.id);
    if(ids.length){
      const rr=await fetch(SUPABASE_URL+"/rest/v1/request_releases?select=request_id,released_by_name,released_by_id,released_at&request_id=in.("+ids.join(",")+")&order=released_at.desc",{headers:authHeaders()});
      if(rr.ok) (await rr.json()).forEach(x=>{ if(!LAST_RELEASE[x.request_id]) LAST_RELEASE[x.request_id]=x; });
    }
    const sr=document.getElementById("summaryRow");
    const c={submitted:0,acknowledged:0,in_progress:0,partially_released:0,critical:0};
    ALL_ROWS.forEach(r=>{
      if(r.status==="submitted"||r.status==="acknowledged"||r.status==="in_progress") c.submitted++;
      else if(r.status==="partially_released") c.partially_released++;
      if(r.priority==="Critical") c.critical++;
    });
    sr.innerHTML=`<span class="chip chip-total">📋 Total Pending: ${ALL_ROWS.length}</span>
      <span class="chip chip-submitted">📤 New: ${c.submitted}</span>
      <span class="chip chip-progress">⚠️ Partially Released: ${c.partially_released}</span>
      <span class="chip chip-critical">🔴 Critical: ${c.critical}</span>`;
    currentPage=1; document.getElementById("searchBox").value=""; onSearch();
  }catch(e){ document.getElementById("tableArea").innerHTML="❌ "+e.message; }
}

function onSearch(){ currentPage=1; applyFilter(); }
function onRowsChange(){ currentPage=1; applyFilter(); }

function applyFilter(){
  const q=document.getElementById("searchBox").value.trim().toLowerCase();
  const pri=document.getElementById("filterPri").value;
  const st=document.getElementById("filterStatus").value;
  const store=document.getElementById("filterStore").value;
  FILTERED=ALL_ROWS.filter(r=>{
    if(store&&(r.store_name||"(no store)")!==store) return false;
    if(pri&&r.priority!==pri) return false;
    const eff=(r.status==="acknowledged"||r.status==="in_progress")?"submitted":r.status;
    if(st&&eff!==st) return false;
    if(q&&!(r.title||"").toLowerCase().includes(q)&&!(r.request_number||"").toLowerCase().includes(q)&&!(r.department||"").toLowerCase().includes(q)) return false;
    return true;
  });
  renderTable();
}

function renderTable(){
  const total=FILTERED.length,rpp=getRowsPerPage();
  const totalPages=Math.max(1,Math.ceil(total/rpp));
  if(currentPage>totalPages) currentPage=totalPages;
  const start=(currentPage-1)*rpp,end=Math.min(start+rpp,total);
  document.getElementById("countLabel").textContent=total+" request"+(total!==1?"s":"");
  if(!FILTERED.length){ document.getElementById("tableArea").innerHTML="<p style='color:#666;padding:10px 0;'>No pending requests.</p>"; document.getElementById("paginationArea").innerHTML=""; return; }
  let html="<table><thead><tr><th>#</th><th>Number</th><th>Title</th><th>Store</th><th>Department</th><th>Requester</th><th>Priority</th><th>Status</th><th>Date Submitted</th><th>Released By</th></tr></thead><tbody>";
  FILTERED.slice(start,end).forEach((r,i)=>{
    html+=`<tr><td>${start+i+1}</td><td><a class="req-link" onclick="processRequest('${r.id}')" title="Open to release items">${esc(r.request_number)}</a></td><td>${esc(r.title)}</td>
      <td>${esc(r.store_name||"—")}</td>
      <td>${esc(EMP_MAP[r.requester_id]?.department || r.department || "—")}</td>
      <td>${esc(EMP_MAP[r.requester_id]?.full_name || r.requester_username)}<br><span style="font-size:11px;color:#888;">${esc(r.requester_username)}</span></td>
      <td>${priBadge(r.priority)}</td><td>${statusBadge(r.status)}</td>
      <td>${fmtDate(r.submitted_at||r.created_at)}</td>
      <td>${LAST_RELEASE[r.id]?esc(LAST_RELEASE[r.id].released_by_name)+" ("+esc(LAST_RELEASE[r.id].released_by_id)+")":"—"}</td></tr>`;
  });
  html+="</tbody></table>";
  document.getElementById("tableArea").innerHTML=html;
  if(totalPages<=1){ document.getElementById("paginationArea").innerHTML=""; return; }
  let p=`<button onclick="goPage(${currentPage-1})" ${currentPage===1?"disabled":""}>‹ Prev</button>`;
  let pages=new Set([1,totalPages]);
  for(let x=Math.max(1,currentPage-2);x<=Math.min(totalPages,currentPage+2);x++) pages.add(x);
  let prev=0;
  Array.from(pages).sort((a,b)=>a-b).forEach(pg=>{ if(prev&&pg-prev>1) p+=`<span class="page-info">…</span>`; p+=`<button class="${pg===currentPage?"active":""}" onclick="goPage(${pg})">${pg}</button>`; prev=pg; });
  p+=`<button onclick="goPage(${currentPage+1})" ${currentPage===totalPages?"disabled":""}>Next ›</button><span class="page-info">Page ${currentPage} of ${totalPages}</span>`;
  document.getElementById("paginationArea").innerHTML=p;
}
function goPage(p){ const tp=Math.max(1,Math.ceil(FILTERED.length/getRowsPerPage())); if(p<1||p>tp) return; currentPage=p; renderTable(); }

function processRequest(id){
  sessionStorage.setItem("process_request_id", id);
  window.location.href="process-request.html?id="+id;
}

async function init(){
  const s=document.getElementById("connStatus");
  try{
    ME=await requireAuth("../../login.html");
    if(!ME) return;
    { const { data:{ session } } = await sb.auth.getSession(); ACCESS_TOKEN = session ? session.access_token : null; }
    sb.auth.onAuthStateChange((ev, sess)=>{ if(sess) ACCESS_TOKEN = sess.access_token; });
    s.style.color="#1e7a34"; s.textContent="Connected as "+ME.username;
    await loadData();
  }catch(e){ s.style.color="#dc2626"; s.textContent="Error: "+e.message; }
}
init();
</script>
</body>
</html>
