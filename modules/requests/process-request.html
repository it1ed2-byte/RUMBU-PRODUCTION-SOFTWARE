<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Process Request</title>
<link rel="stylesheet" href="../../styles.css">
<script>
  (function(){
    function apply(t){ if(t) document.documentElement.setAttribute("data-theme",t); }
    window.addEventListener("message",function(e){ if(e.data&&e.data.rumbuTheme) apply(e.data.rumbuTheme); });
    try{ apply(localStorage.getItem("rumbu_theme")); }catch(e){}
  })();
</script>
<style>
  *{ box-sizing:border-box; }
  body{ font-family:var(--sans); background:var(--bg); margin:0; padding:16px; }
  .card{ background:var(--card); width:100%; max-width:1000px; margin:0 auto 16px; padding:22px; border-radius:12px; box-shadow:0 4px 12px rgba(0,0,0,.11); }
  h2{ text-align:center; color:var(--heading); border-bottom:2px solid var(--heading); padding-bottom:10px; margin:0 0 16px; font-size:18px; }
  h3{ color:var(--heading); font-size:14px; margin:0 0 12px; }
  #connStatus{ font-size:12px; text-align:center; color:#666; margin-bottom:10px; }
  .info-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px 20px; background:var(--bg); border-radius:10px; padding:14px; margin-bottom:12px; }
  .info-item label{ font-size:11px; color:#888; font-weight:700; display:block; margin-bottom:2px; }
  .info-item span{ font-size:13px; font-weight:700; color:var(--text); }
  .badge{ display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; }
  .badge-submitted,.badge-acknowledged,.badge-in_progress{ background:#dbeafe; color:#1d4ed8; }
  .badge-partially_released{ background:#fff7ed; color:#c2410c; }
  .badge-released{ background:#dcfce7; color:#15803d; }
  .badge-rejected{ background:#fee2e2; color:#dc2626; }
  .badge-closed{ background:#f3f4f6; color:#374151; }
  .badge-pending{ background:#fef9c3; color:#92400e; }
  .badge-partial{ background:#fff7ed; color:#c2410c; }
  .pri-Critical{ color:#dc2626; font-weight:700; } .pri-Urgent{ color:#d97706; font-weight:700; } .pri-Normal{ color:#2563eb; font-weight:700; }
  .table-wrap{ overflow-x:auto; }
  .tbl{ width:100%; border-collapse:collapse; font-size:13px; margin-bottom:14px; }
  .tbl th{ background:var(--heading); color:#fff; padding:9px 8px; text-align:left; white-space:nowrap; }
  .tbl td{ padding:8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  .tbl input[type="number"]{ width:90px; padding:6px 8px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:13px; }
  .tbl input.over{ border-color:#dc2626; background:#fef2f2; }
  .row-done td{ background:#f0fdf4; color:#666; }
  .num{ text-align:right; }
  label.fl{ font-size:12px; font-weight:600; color:#555; margin-bottom:4px; display:block; }
  input[type="text"],textarea{ width:100%; padding:9px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:13px; outline:none; }
  input[readonly]{ background:var(--bg); color:#666; }
  textarea{ min-height:64px; resize:vertical; }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px 20px; margin-bottom:14px; }
  .full{ grid-column:1/-1; }
  .hint{ font-size:11px; color:#888; margin-top:3px; }
  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; }
  .btn-row button{ flex:1; min-width:130px; padding:11px; font-size:13px; font-weight:700; border:none; border-radius:8px; cursor:pointer; }
  .btn-row button:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-release{ background:#15803d; color:#fff; } .btn-reject{ background:#dc2626; color:#fff; }
  .btn-back{ background:var(--bg); color:var(--heading); border:2px solid var(--heading)!important; }
  .msg{ text-align:center; margin-top:10px; font-size:13px; font-weight:600; min-height:18px; }
  .msg.ok{ color:#15803d; } .msg.err{ color:#dc2626; }
  .closed-note{ background:var(--bg); border-radius:8px; padding:12px; font-size:13px; font-weight:600; color:var(--heading); text-align:center; }
  @media(max-width:640px){ .info-grid{ grid-template-columns:1fr 1fr; } .form-grid{ grid-template-columns:1fr; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../auth.js"></script>
<script src="store-access.js"></script>
</head>
<body>
<div class="card" id="loadingCard">
  <h2>⚙️ Process Request</h2>
  <div id="connStatus">Loading request...</div>
</div>

<div id="mainContent" style="display:none;">
  <div class="card">
    <h2>⚙️ Process Request — <span id="reqNo"></span></h2>
    <div class="info-grid" id="reqInfo"></div>
    <div id="descBox" style="display:none;background:var(--bg);border-radius:8px;padding:12px;font-size:13px;"></div>
  </div>

  <div class="card">
    <h3>📦 Items — Update Release Status</h3>
    <div class="table-wrap">
      <table class="tbl">
        <thead><tr><th>#</th><th>Item</th><th>Unit</th><th class="num">Requested</th><th class="num">Released So Far</th><th class="num">Outstanding</th><th>Release Now</th><th>Requester Remarks</th></tr></thead>
        <tbody id="itemsBody"></tbody>
      </table>
    </div>

    <div id="actionArea">
      <div class="form-grid">
        <div>
          <label class="fl">Collector ID <span style="color:#dc2626;">*</span></label>
          <input type="text" id="colId" placeholder="Staff ID of person collecting" oninput="lookupCollector()">
          <div class="hint" id="colHint"></div>
        </div>
        <div>
          <label class="fl">Collector Name <span style="color:#dc2626;">*</span></label>
          <input type="text" id="colName" placeholder="Fills automatically from ID">
        </div>
        <div>
          <label class="fl">Released By</label>
          <input type="text" id="relBy" readonly>
        </div>
        <div></div>
        <div class="full">
          <label class="fl">Store Remark (visible to requester)</label>
          <textarea id="storeRemark" placeholder="e.g. Released 3 of 5 litres. Balance will be released when restocked."></textarea>
        </div>
        <div class="full" id="rejectWrap" style="display:none;">
          <label class="fl">Rejection Reason <span style="color:#dc2626;">*</span></label>
          <input type="text" id="rejectReason" placeholder="State why this request cannot be fulfilled">
        </div>
      </div>
      <div class="btn-row">
        <button class="btn-back" onclick="goBack()">← Back to Pending</button>
        <button class="btn-release" id="btnRelease" onclick="releaseItems()">✅ Release Items</button>
        <button class="btn-reject" id="btnReject" onclick="toggleReject()">❌ Reject</button>
      </div>
      <div id="rejectConfirmRow" style="display:none;margin-top:10px;text-align:right;">
        <button style="background:#dc2626;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-weight:700;font-size:13px;cursor:pointer;" onclick="confirmReject()">Confirm Rejection</button>
      </div>
    </div>
    <div id="closedArea" style="display:none;">
      <div class="closed-note" id="closedNote"></div>
      <div class="btn-row" style="margin-top:12px;">
        <button class="btn-back" onclick="goBack()">← Back to Pending</button>
      </div>
    </div>
    <div class="msg" id="actionMsg"></div>
  </div>

  <div class="card">
    <h3>🧾 Release History</h3>
    <div class="table-wrap" id="historyArea"></div>
  </div>
</div>

<script>
let ACCESS_TOKEN=null;
let ME=null, REQUEST=null, ITEMS=[], RELEASES=[], ME_NAME="", BUSY=false, MY_TYPE_IDS=[];
const OPEN_STATUSES=["submitted","acknowledged","in_progress","partially_released"];
const EPS=1e-9;

function esc(s){ return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function authHeaders(e){ return Object.assign({"apikey":SUPABASE_ANON_KEY,"Authorization":"Bearer "+(ACCESS_TOKEN||SUPABASE_ANON_KEY),"Content-Type":"application/json"},e||{}); }
function fmtDate(d){ if(!d) return "—"; const x=new Date(d); return x.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}); }
function fmtTime(d){ if(!d) return "—"; return new Date(d).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}); }
function n(v){ return Number(v)||0; }
function fmtQty(v){ return Math.round(n(v)*100)/100; }
function statusBadge(s){ return `<span class="badge badge-${s}">${esc(String(s).replace(/_/g," "))}</span>`; }
function api(path,opt){ return fetch(SUPABASE_URL+"/rest/v1/"+path, Object.assign({headers:authHeaders()},opt||{})); }

function getRequestId(){ return new URLSearchParams(window.location.search).get("id") || sessionStorage.getItem("process_request_id"); }

async function findEmployeeName(staffId){
  if(!staffId) return "";
  const r=await api("employees?employee_id=eq."+encodeURIComponent(staffId)+"&select=full_name&limit=1");
  if(!r.ok) return "";
  const rows=await r.json(); return rows[0]?.full_name || "";
}

let lookupTimer=null;
function lookupCollector(){
  clearTimeout(lookupTimer);
  const id=document.getElementById("colId").value.trim();
  const hint=document.getElementById("colHint");
  if(!id){ hint.textContent=""; return; }
  lookupTimer=setTimeout(async ()=>{
    const name=await findEmployeeName(id);
    if(document.getElementById("colId").value.trim()!==id) return;
    if(name){ document.getElementById("colName").value=name; hint.style.color="#15803d"; hint.textContent="✓ Staff found"; }
    else { hint.style.color="#d97706"; hint.textContent="ID not found in staff records. Type the name manually."; }
  },400);
}

async function loadRequest(){
  const id=getRequestId();
  if(!id){ document.getElementById("connStatus").textContent="No request selected. Open a request from Pending Requests."; return; }
  const [reqRows,items,rels]=await Promise.all([
    api("requests?id=eq."+id+"&select=*").then(r=>r.json()),
    api("request_items?request_id=eq."+id+"&order=created_at").then(r=>r.json()),
    api("request_releases?request_id=eq."+id+"&order=released_at.desc").then(r=>r.ok?r.json():[])
  ]);
  REQUEST=reqRows[0]; ITEMS=items||[]; RELEASES=rels||[];
  if(!REQUEST){ document.getElementById("connStatus").textContent="Request not found."; return; }

  document.getElementById("reqNo").textContent=REQUEST.request_number;
  const pri=REQUEST.priority;
  document.getElementById("reqInfo").innerHTML=`
    <div class="info-item"><label>Title</label><span>${esc(REQUEST.title)}</span></div>
    <div class="info-item"><label>Store</label><span>${esc(REQUEST.store_name||"—")}</span></div>
    <div class="info-item"><label>Request Type</label><span>${esc(REQUEST.store_type_name||"—")}</span></div>
    <div class="info-item"><label>Department</label><span>${esc(REQUEST.department)}</span></div>
    <div class="info-item"><label>Requester</label><span>${esc(REQUEST.requester_username)}</span></div>
    <div class="info-item"><label>Priority</label><span class="pri-${pri}">${pri==="Critical"?"🔴":pri==="Urgent"?"🟡":"🔵"} ${esc(pri)}</span></div>
    <div class="info-item"><label>Status</label><span>${statusBadge(REQUEST.status)}</span></div>
    <div class="info-item"><label>Date Submitted</label><span>${fmtDate(REQUEST.submitted_at||REQUEST.created_at)}</span></div>`;
  const d=document.getElementById("descBox");
  if(REQUEST.description){ d.style.display="block"; d.innerHTML="<b>Notes:</b> "+esc(REQUEST.description); } else d.style.display="none";

  renderItems(); renderHistory();

  const isOpen=OPEN_STATUSES.includes(REQUEST.status);
  const mine=rsCanProcess(MY_TYPE_IDS, REQUEST);
  const open=isOpen && mine;
  document.getElementById("actionArea").style.display=open?"block":"none";
  const note=document.getElementById("closedNote");
  document.getElementById("closedArea").style.display=open?"none":"block";
  if(isOpen && !mine){
    note.textContent="🔒 You can view this request, but only approvers of "+(REQUEST.store_name||"this store")+" / "+(REQUEST.store_type_name||"its type")+" can release or reject it.";
  } else if(!open){
    note.textContent = REQUEST.status==="released" ? "✅ This request has been fully released." :
                       REQUEST.status==="rejected" ? "❌ This request was rejected. Reason: "+(REQUEST.rejected_reason||"—") :
                       "This request is "+REQUEST.status.replace(/_/g," ")+" and cannot be processed.";
  }
  if(REQUEST.store_remark) document.getElementById("storeRemark").value=REQUEST.store_remark;
  document.getElementById("loadingCard").style.display="none";
  document.getElementById("mainContent").style.display="block";
}

function renderItems(){
  document.getElementById("itemsBody").innerHTML=ITEMS.map((it,i)=>{
    const out=Math.max(0,n(it.quantity)-n(it.qty_released));
    const done=out<=EPS;
    return `<tr class="${done?"row-done":""}">
      <td>${i+1}</td>
      <td><b>${esc(it.item_name)}</b></td>
      <td>${esc(it.unit)}</td>
      <td class="num">${fmtQty(it.quantity)}</td>
      <td class="num">${fmtQty(it.qty_released)}</td>
      <td class="num"><b>${fmtQty(out)}</b></td>
      <td>${done?'<span class="badge badge-released">Fully released</span>'
        :`<input type="number" id="rel_${it.id}" value="0" min="0" max="${out}" step="0.01" oninput="checkQty('${it.id}',${out})">`}</td>
      <td>${esc(it.remarks||"")}</td>
    </tr>`;
  }).join("");
}

function checkQty(id,out){
  const el=document.getElementById("rel_"+id);
  const v=n(el.value);
  el.classList.toggle("over", v<0 || v>out+EPS);
}

function renderHistory(){
  const wrap=document.getElementById("historyArea");
  if(!RELEASES.length){ wrap.innerHTML="<p style='color:#888;font-size:13px;margin:0;'>No items have been released yet.</p>"; return; }
  const itemName=id=>{ const it=ITEMS.find(x=>x.id===id); return it?it.item_name:"(removed item)"; };
  const unit=id=>{ const it=ITEMS.find(x=>x.id===id); return it?it.unit:""; };
  wrap.innerHTML=`<table class="tbl"><thead><tr><th>Date</th><th>Time</th><th>Item</th><th class="num">Qty</th><th>Collected By</th><th>Released By</th></tr></thead><tbody>`+
    RELEASES.map(r=>`<tr><td>${fmtDate(r.released_at)}</td><td>${fmtTime(r.released_at)}</td>
      <td>${esc(itemName(r.item_id))}</td><td class="num">${fmtQty(r.qty_released)} ${esc(unit(r.item_id))}</td>
      <td>${esc(r.collector_name)} (${esc(r.collector_id)})</td>
      <td>${esc(r.released_by_name)} (${esc(r.released_by_id)})</td></tr>`).join("")+`</tbody></table>`;
}

function setBusy(on){ BUSY=on; ["btnRelease","btnReject"].forEach(id=>{ const b=document.getElementById(id); if(b) b.disabled=on; }); }
function msg(t,cls){ const m=document.getElementById("actionMsg"); m.className="msg"+(cls?" "+cls:""); m.textContent=t; }

async function releaseItems(){
  if(BUSY) return;
  if(!rsCanProcess(MY_TYPE_IDS, REQUEST)){ msg("❌ You are not an approver for this store type.","err"); return; }
  const colId=document.getElementById("colId").value.trim();
  const colName=document.getElementById("colName").value.trim();
  if(!colId || !colName){ msg("❌ Enter the collector's ID and name.","err"); return; }

  // Validate every quantity against what is still outstanding
  const lines=[];
  for(const it of ITEMS){
    const el=document.getElementById("rel_"+it.id); if(!el) continue;
    const v=n(el.value), out=Math.max(0,n(it.quantity)-n(it.qty_released));
    if(v<0){ msg("❌ "+it.item_name+": quantity cannot be negative.","err"); return; }
    if(v>out+EPS){ msg("❌ "+it.item_name+": you entered "+fmtQty(v)+" but only "+fmtQty(out)+" "+it.unit+" is outstanding.","err"); el.classList.add("over"); return; }
    if(v>0) lines.push({it,v});
  }
  if(!lines.length){ msg("❌ Enter a quantity to release for at least one item.","err"); return; }

  setBusy(true); msg("Recording release...","");
  try{
    const now=new Date().toISOString();
    const remark=document.getElementById("storeRemark").value.trim();
    // 1) Record each release
    const relRows=lines.map(({it,v})=>({
      request_id:REQUEST.id, item_id:it.id, qty_released:v, released_at:now,
      collector_id:colId, collector_name:colName,
      released_by_id:ME.username, released_by_name:ME_NAME||ME.username, released_by_profile:ME.id
    }));
    let r=await api("request_releases",{method:"POST",body:JSON.stringify(relRows)});
    if(!r.ok) throw new Error("Saving release: HTTP "+r.status+" — "+await r.text());

    // 2) Update running totals on each item
    for(const {it,v} of lines){
      const total=n(it.qty_released)+v;
      const status= total>=n(it.quantity)-EPS ? "released" : "partial";
      r=await api("request_items?id=eq."+it.id,{method:"PATCH",body:JSON.stringify({qty_released:total,item_status:status})});
      if(!r.ok) throw new Error("Updating "+it.item_name+": HTTP "+r.status);
      it.qty_released=total;
    }

    // 3) Work out the request status from the items
    const allDone=ITEMS.every(it=>n(it.qty_released)>=n(it.quantity)-EPS);
    const upd={ status: allDone?"released":"partially_released", store_remark:remark||null, updated_at:now };
    if(allDone) upd.released_at=now;
    r=await api("requests?id=eq."+REQUEST.id,{method:"PATCH",body:JSON.stringify(upd)});
    if(!r.ok) throw new Error("Updating request: HTTP "+r.status);

    msg(allDone?"✅ All items released. Request "+REQUEST.request_number+" is complete.":"✅ Release recorded. Request "+REQUEST.request_number+" stays open for the outstanding items.","ok");
    document.getElementById("colId").value=""; document.getElementById("colName").value=""; document.getElementById("colHint").textContent="";
    await loadRequest();
  }catch(e){ msg("❌ "+e.message,"err"); }
  finally{ setBusy(false); }
}

function toggleReject(){
  const w=document.getElementById("rejectWrap"), r=document.getElementById("rejectConfirmRow");
  const show=w.style.display==="none";
  w.style.display=show?"block":"none"; r.style.display=show?"block":"none"; msg("","");
}

async function confirmReject(){
  if(BUSY) return;
  if(!rsCanProcess(MY_TYPE_IDS, REQUEST)){ msg("❌ You are not an approver for this store type.","err"); return; }
  const reason=document.getElementById("rejectReason").value.trim();
  if(!reason){ msg("❌ Please state a rejection reason.","err"); return; }
  setBusy(true); msg("Rejecting...","");
  try{
    const remark=document.getElementById("storeRemark").value.trim();
    const r=await api("requests?id=eq."+REQUEST.id,{method:"PATCH",body:JSON.stringify({status:"rejected",rejected_reason:reason,store_remark:remark||null,updated_at:new Date().toISOString()})});
    if(!r.ok) throw new Error("HTTP "+r.status+" — "+await r.text());
    msg("✅ Request rejected.","ok");
    setTimeout(goBack,1200);
  }catch(e){ msg("❌ "+e.message,"err"); setBusy(false); }
}

function goBack(){ window.location.href="pending-requests.html"; }

async function init(){
  const s=document.getElementById("connStatus");
  try{
    ME=await requireAuth("../../login.html");
    if(!ME) return;
    { const { data:{ session } } = await sb.auth.getSession(); ACCESS_TOKEN = session ? session.access_token : null; }
    sb.auth.onAuthStateChange((ev, sess)=>{ if(sess) ACCESS_TOKEN = sess.access_token; });
    MY_TYPE_IDS=await rsApproverTypeIds(ME);
    ME_NAME=await findEmployeeName(ME.username);
    document.getElementById("relBy").value=(ME_NAME||ME.username)+" ("+ME.username+")";
    await loadRequest();
  }catch(e){ s.style.color="#dc2626"; s.textContent="Error: "+e.message; }
}
init();
</script>
</body>
</html>
