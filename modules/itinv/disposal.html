<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IT Inventory — Disposal</title>
<link rel="stylesheet" href="../../styles.css">
<script>
  (function(){
    function apply(t){ if(t) document.documentElement.setAttribute("data-theme", t); }
    window.addEventListener("message", function(e){ if(e.data && e.data.rumbuTheme) apply(e.data.rumbuTheme); });
    try{ apply(localStorage.getItem("rumbu_theme")); }catch(e){}
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../auth.js"></script>
<style>
  :root{--navy:var(--heading);--blue:var(--accent);--blue-dark:var(--accent-2);--muted:#6b7280;--red:#c0392b;--green:#1d8a4e;}
  *{box-sizing:border-box;}
  body{font-family:var(--sans);background:var(--bg);margin:0;padding:18px;color:var(--text);}
  .wrap{max-width:1150px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;}
  .card h3{color:var(--navy);margin:0 0 4px;font-size:16px;}
  .card .sub{color:var(--blue);font-size:12px;margin:0 0 14px;}
  label{display:block;font-size:12px;font-weight:bold;color:var(--text);margin:10px 0 4px;}
  input,textarea,select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;}
  textarea{resize:vertical;min-height:50px;}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row > div{flex:1;min-width:170px;}
  button{padding:10px 14px;border:none;border-radius:8px;font-weight:bold;font-size:13px;cursor:pointer;background:var(--red);color:#fff;}
  button:hover{background:#96242e;}
  button.mini{padding:5px 9px;font-size:12px;background:#6b7280;} button.mini:hover{background:#4b5563;}
  .status{margin-top:10px;font-weight:bold;font-size:13px;min-height:16px;}
  .status.ok{color:var(--green);} .status.err{color:var(--red);}
  #connStatus{font-size:12px;font-weight:bold;text-align:center;margin-bottom:10px;}
  table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px;}
  th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top;}
  thead th{background:var(--navy);color:#fff;font-size:12px;}
  tbody tr:nth-child(even){background:#f6f8fb;}
</style>
</head>
<body>

<div class="wrap">
<div id="connStatus">Loading...</div>

<div id="appArea" style="display:none;">
  <div class="card">
    <h3>Dispose / Decommission a Device</h3>
    <p class="sub">Disposal sets the device status to "Decommissioned". This is recorded permanently.</p>
    <div class="row">
      <div><label>Device</label><select id="device" onchange="onDeviceChange()"></select></div>
      <div><label>Method</label><input type="text" id="method" placeholder="e.g. Sold, Scrapped, Donated"></div>
    </div>
    <div id="currentBox" style="font-size:12px;color:#6b7280;margin-top:6px;"></div>
    <label>Reason</label>
    <textarea id="reason" placeholder="Why is this device being disposed?"></textarea>
    <div class="row">
      <div><label>Authorised by</label><input type="text" id="authBy"></div>
      <div><label>Disposed by</label><input type="text" id="dispBy"></div>
      <div><label>Recovery value (₦, optional)</label><input type="number" step="0.01" id="recovery"></div>
    </div>
    <div style="margin-top:12px;"><button onclick="dispose()">Record Disposal</button></div>
    <div class="status" id="formStatus"></div>
  </div>

  <div class="card">
    <h3>Disposal Records</h3>
    <div class="row">
      <div><label>Search (device / reason / method)</label><input type="text" id="search" placeholder="Type to filter" oninput="applyFilters()"></div>
      <div style="flex:0 0 auto;"><label>&nbsp;</label><button class="mini" onclick="loadDisposals()">Refresh</button></div>
    </div>
    <div class="status" id="listStatus"></div>
    <div id="tableWrap"></div>
  </div>
</div>
</div>

<script>
let ME = null;
let DEVICES = [], DISP = [];

async function logActivity(actionType, description){
  try{
    await sb.from("activity_log").insert({
      actor_id: ME.id, actor_username: ME.username, actor_role: ME.role,
      section_id: ME.sectionId, action_type: actionType, description: description
    });
  }catch(e){ console.warn("Activity log write failed (non-fatal):", e); }
}
function deviceLabel(d){ return d.device_code + " — " + [d.make,d.model].filter(Boolean).join(" ") + (d.serial_number?(" ("+d.serial_number+")"):""); }

async function init(){
  const status = document.getElementById("connStatus");
  try{
    ME = await requireAuth("../../login.html");
    if(!ME) return;
    status.style.color = "#1d8a4e"; status.textContent = "Connected.";
    document.getElementById("appArea").style.display = "block";
    await loadDevices();
    await loadDisposals();
  }catch(e){
    status.style.color = "#c0392b"; status.textContent = "❌ " + e.message; console.error(e);
  }
}

async function loadDevices(){
  let q = sb.from("it_devices").select("*").order("device_code");
  if(ME.role !== "super_admin"){
    if(ME.sectionNames && ME.sectionNames.length){ q = q.in("branch", ME.sectionNames); }
    else { q = q.eq("branch","___none___"); }
  }
  const { data } = await q;
  // exclude already-decommissioned from the dropdown
  DEVICES = (data||[]).filter(d=>d.status!=="Decommissioned");
  const sel = document.getElementById("device");
  sel.innerHTML = "";
  DEVICES.forEach(d=>{ const o=document.createElement("option"); o.value=d.id; o.textContent=deviceLabel(d); sel.appendChild(o); });
  onDeviceChange();
}
function currentDevice(){ return DEVICES.find(d=>String(d.id)===document.getElementById("device").value); }
function onDeviceChange(){
  const d = currentDevice(); const box = document.getElementById("currentBox");
  if(!d){ box.textContent=""; return; }
  box.innerHTML = "Status: <b>"+(d.status||"—")+"</b> &nbsp;|&nbsp; Branch: "+(d.branch||"—");
}

async function nextCode(){
  const { data, error } = await sb.from("it_disposal").select("disposal_code").like("disposal_code","DIS-%").order("disposal_code",{ascending:false}).limit(1);
  if(error) throw error;
  let seq=1; if(data&&data.length){ seq=parseInt(data[0].disposal_code.slice(4),10)+1; }
  return "DIS-"+String(seq).padStart(5,"0");
}

async function dispose(){
  const status = document.getElementById("formStatus");
  const d = currentDevice();
  if(!d){ status.className="status err"; status.textContent="Select a device."; return; }
  const g=id=>document.getElementById(id).value.trim();
  if(!g("reason")){ status.className="status err"; status.textContent="Reason is required."; return; }
  if(!confirm("Dispose "+d.device_code+"? It will be marked Decommissioned.")) return;

  status.className="status"; status.textContent="Saving...";
  try{
    const code = await nextCode();
    const { error: dispErr } = await sb.from("it_disposal").insert({
      disposal_code: code, device_id: d.id, device_label: deviceLabel(d), branch: d.branch,
      reason: g("reason"), method: g("method")||null,
      authorised_by: g("authBy")||null, disposed_by: g("dispBy")||null,
      recovery_value: g("recovery")?parseFloat(g("recovery")):null
    });
    if(dispErr) throw dispErr;
    await sb.from("it_devices").update({ status: "Decommissioned" }).eq("id", d.id);
    await logActivity("it_device_disposed", ME.username+" disposed "+d.device_code+" ("+code+")");
    status.className="status ok"; status.textContent="✅ Disposal "+code+" recorded; device Decommissioned.";
    ["method","reason","authBy","dispBy","recovery"].forEach(id=>document.getElementById(id).value="");
    await loadDevices(); await loadDisposals();
  }catch(e){ status.className="status err"; status.textContent="❌ "+e.message; }
}

async function loadDisposals(){
  const status = document.getElementById("listStatus");
  status.className="status"; status.textContent="Loading...";
  try{
    let q = sb.from("it_disposal").select("*").order("disposal_date",{ascending:false});
    if(ME.role!=="super_admin"){
      if(ME.sectionNames && ME.sectionNames.length){ q = q.in("branch", ME.sectionNames); }
      else { q = q.eq("branch","___none___"); }
    }
    const { data, error } = await q;
    if(error) throw error;
    DISP = data||[];
    status.className="status ok"; status.textContent=DISP.length+" disposal(s).";
    applyFilters();
  }catch(e){ status.className="status err"; status.textContent="❌ "+e.message; }
}

function applyFilters(){
  const s = document.getElementById("search").value.trim().toLowerCase();
  let rows = DISP.slice();
  if(s){
    rows = rows.filter(r =>
      (r.device_label||"").toLowerCase().includes(s) ||
      (r.reason||"").toLowerCase().includes(s) ||
      (r.method||"").toLowerCase().includes(s));
  }
  render(rows);
}

function fmt(ts){ return ts ? new Date(ts).toLocaleDateString() : ""; }

function render(rows){
  const wrap = document.getElementById("tableWrap");
  if(!rows.length){ wrap.innerHTML="<p>No disposal records match.</p>"; return; }
  let html = "<table><thead><tr><th>Code</th><th>Device</th><th>Branch</th><th>Method</th><th>Reason</th><th>Date</th><th>Recovery</th><th>Authorised</th></tr></thead><tbody>";
  rows.forEach(r=>{
    html += "<tr>" +
      `<td>${r.disposal_code||""}</td>` +
      `<td>${r.device_label||""}</td>` +
      `<td>${r.branch||""}</td>` +
      `<td>${r.method||""}</td>` +
      `<td>${r.reason||""}</td>` +
      `<td>${fmt(r.disposal_date)}</td>` +
      `<td>${r.recovery_value!=null?"₦"+r.recovery_value:""}</td>` +
      `<td>${r.authorised_by||""}</td>` +
    "</tr>";
  });
  html += "</tbody></table>";
  wrap.innerHTML = html;
}

init();
</script>
</body>
</html>
