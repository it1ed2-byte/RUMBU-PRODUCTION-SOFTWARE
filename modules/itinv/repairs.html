<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IT Inventory — Repairs</title>
<link rel="stylesheet" href="../../styles.css">
<script>
  (function(){
    function apply(t){ if(t) document.documentElement.setAttribute("data-theme", t); }
    window.addEventListener("message", function(e){ if(e.data && e.data.rumbuTheme) apply(e.data.rumbuTheme); });
    try{ apply(localStorage.getItem("rumbu_theme")); }catch(e){}
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../auth.js"></script>
<style>
  :root{--navy:var(--heading);--blue:var(--accent);--blue-dark:var(--accent-2);--muted:#6b7280;--red:#c0392b;--green:#1d8a4e;--amber:#d97706;}
  *{box-sizing:border-box;}
  body{font-family:var(--sans);background:var(--bg);margin:0;padding:18px;color:var(--text);}
  .wrap{max-width:1150px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;}
  .card h3{color:var(--navy);margin:0 0 4px;font-size:16px;}
  .card .sub{color:var(--blue);font-size:12px;margin:0 0 14px;}
  label{display:block;font-size:12px;font-weight:bold;color:var(--text);margin:10px 0 4px;}
  input,textarea,select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;}
  textarea{resize:vertical;min-height:50px;}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row > div{flex:1;min-width:170px;}
  button{padding:10px 14px;border:none;border-radius:8px;font-weight:bold;font-size:13px;cursor:pointer;background:var(--blue);color:#fff;}
  button:hover{background:var(--blue-dark);}
  button.mini{padding:5px 9px;font-size:12px;}
  button.close{background:var(--green);} button.close:hover{background:#166a2c;}
  .status{margin-top:10px;font-weight:bold;font-size:13px;min-height:16px;}
  .status.ok{color:var(--green);} .status.err{color:var(--red);}
  #connStatus{font-size:12px;font-weight:bold;text-align:center;margin-bottom:10px;}
  table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px;}
  th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top;}
  thead th{background:var(--navy);color:#fff;font-size:12px;}
  tbody tr:nth-child(even){background:#f6f8fb;}
  .tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:bold;color:#fff;}
  .tag.Open{background:var(--amber);} .tag.Closed{background:var(--green);}
</style>
</head>
<body>

<div class="wrap">
<div id="connStatus">Loading...</div>

<div id="appArea" style="display:none;">
  <div class="card">
    <h3>Log a Repair (Open Fault)</h3>
    <p class="sub">Opening a repair sets the device status to "Under Repair". Closing it returns the device to "Active".</p>
    <div class="row">
      <div><label>Device</label><select id="device" onchange="onDeviceChange()"></select></div>
      <div><label>Reported by</label><input type="text" id="reportedBy"></div>
    </div>
    <div id="currentBox" style="font-size:12px;color:#6b7280;margin-top:6px;"></div>
    <label>Fault description</label>
    <textarea id="fault" placeholder="Describe the fault"></textarea>
    <div class="row">
      <div><label>Technician (optional)</label><input type="text" id="technician"></div>
      <div><label>Vendor (optional)</label><input type="text" id="vendor"></div>
    </div>
    <div style="margin-top:12px;"><button onclick="openRepair()">Open Repair</button></div>
    <div class="status" id="formStatus"></div>
  </div>

  <div class="card">
    <h3>Repairs</h3>
    <div class="row">
      <div><label>Status</label><select id="fStatus" onchange="applyFilters()"><option value="">All</option><option value="Open">Open</option><option value="Closed">Closed</option></select></div>
      <div><label>Search (device / fault / technician)</label><input type="text" id="search" placeholder="Type to filter" oninput="applyFilters()"></div>
      <div style="flex:0 0 auto;"><label>&nbsp;</label><button onclick="loadRepairs()">Refresh</button></div>
    </div>
    <div class="status" id="listStatus"></div>
    <div id="tableWrap"></div>
  </div>
</div>
</div>

<script>
let ME = null;
let DEVICES = [], REPAIRS = [];

async function logActivity(actionType, description){
  try{
    await sb.from("activity_log").insert({
      actor_id: ME.id, actor_username: ME.username, actor_role: ME.role,
      section_id: ME.sectionId, action_type: actionType, description: description
    });
  }catch(e){ console.warn("Activity log write failed (non-fatal):", e); }
}
function deviceLabel(d){ return d.device_code + " — " + [d.make,d.model].filter(Boolean).join(" ") + (d.serial_number?(" ("+d.serial_number+")"):""); }

async function init(){
  const status = document.getElementById("connStatus");
  try{
    ME = await requireAuth("../../login.html");
    if(!ME) return;
    status.style.color = "#1d8a4e"; status.textContent = "Connected.";
    document.getElementById("appArea").style.display = "block";
    await loadDevices();
    await loadRepairs();
  }catch(e){
    status.style.color = "#c0392b"; status.textContent = "❌ " + e.message; console.error(e);
  }
}

async function loadDevices(){
  let q = sb.from("it_devices").select("*").order("device_code");
  if(ME.role !== "super_admin"){
    if(ME.sectionNames && ME.sectionNames.length){ q = q.in("branch", ME.sectionNames); }
    else { q = q.eq("branch","___none___"); }
  }
  const { data } = await q;
  DEVICES = data||[];
  const sel = document.getElementById("device");
  sel.innerHTML = "";
  DEVICES.forEach(d=>{ const o=document.createElement("option"); o.value=d.id; o.textContent=deviceLabel(d); sel.appendChild(o); });
  onDeviceChange();
}
function currentDevice(){ return DEVICES.find(d=>String(d.id)===document.getElementById("device").value); }
function onDeviceChange(){
  const d = currentDevice(); const box = document.getElementById("currentBox");
  if(!d){ box.textContent=""; return; }
  box.innerHTML = "Status: <b>"+(d.status||"—")+"</b> &nbsp;|&nbsp; Branch: "+(d.branch||"—");
}

async function nextCode(){
  const { data, error } = await sb.from("it_repairs").select("repair_code").like("repair_code","REP-%").order("repair_code",{ascending:false}).limit(1);
  if(error) throw error;
  let seq=1; if(data&&data.length){ seq=parseInt(data[0].repair_code.slice(4),10)+1; }
  return "REP-"+String(seq).padStart(5,"0");
}

async function openRepair(){
  const status = document.getElementById("formStatus");
  const d = currentDevice();
  if(!d){ status.className="status err"; status.textContent="Select a device."; return; }
  const g=id=>document.getElementById(id).value.trim();
  if(!g("fault")){ status.className="status err"; status.textContent="Fault description is required."; return; }

  status.className="status"; status.textContent="Saving...";
  try{
    const code = await nextCode();
    const { error: rErr } = await sb.from("it_repairs").insert({
      repair_code: code, device_id: d.id, device_label: deviceLabel(d), branch: d.branch,
      fault_description: g("fault"), reported_by: g("reportedBy")||null,
      technician: g("technician")||null, vendor: g("vendor")||null, status: "Open"
    });
    if(rErr) throw rErr;
    await sb.from("it_devices").update({ status: "Under Repair" }).eq("id", d.id);
    await logActivity("it_repair_opened", ME.username+" opened repair "+code+" for "+d.device_code);
    status.className="status ok"; status.textContent="✅ Repair "+code+" opened; device set to Under Repair.";
    ["fault","reportedBy","technician","vendor"].forEach(id=>document.getElementById(id).value="");
    await loadDevices(); await loadRepairs();
  }catch(e){ status.className="status err"; status.textContent="❌ "+e.message; }
}

async function closeRepair(id){
  const r = REPAIRS.find(x=>x.id===id); if(!r) return;
  const cost = prompt("Repair cost (₦) for "+r.repair_code+" (leave blank if none):","");
  if(cost === null) return;
  const parts = prompt("Parts replaced (optional):","") || "";
  const notes = prompt("Resolution notes (optional):","") || "";

  const status = document.getElementById("listStatus");
  status.className="status"; status.textContent="Closing...";
  try{
    const { error: rErr } = await sb.from("it_repairs").update({
      status: "Closed", date_resolved: new Date().toISOString(),
      cost: cost ? parseFloat(cost) : null, parts_replaced: parts||null, resolution_notes: notes||null
    }).eq("id", id);
    if(rErr) throw rErr;
    if(r.device_id){ await sb.from("it_devices").update({ status: "Active" }).eq("id", r.device_id); }
    await logActivity("it_repair_closed", ME.username+" closed repair "+r.repair_code);
    status.className="status ok"; status.textContent="✅ Repair "+r.repair_code+" closed; device set to Active.";
    await loadDevices(); await loadRepairs();
  }catch(e){ status.className="status err"; status.textContent="❌ "+e.message; }
}

async function loadRepairs(){
  const status = document.getElementById("listStatus");
  status.className="status"; status.textContent="Loading...";
  try{
    let q = sb.from("it_repairs").select("*").order("date_reported",{ascending:false});
    if(ME.role!=="super_admin"){
      if(ME.sectionNames && ME.sectionNames.length){ q = q.in("branch", ME.sectionNames); }
      else { q = q.eq("branch","___none___"); }
    }
    const { data, error } = await q;
    if(error) throw error;
    REPAIRS = data||[];
    status.className="status ok"; status.textContent=REPAIRS.length+" repair(s).";
    applyFilters();
  }catch(e){ status.className="status err"; status.textContent="❌ "+e.message; }
}

function applyFilters(){
  const st = document.getElementById("fStatus").value;
  const s = document.getElementById("search").value.trim().toLowerCase();
  let rows = REPAIRS.slice();
  if(st) rows = rows.filter(r=>r.status===st);
  if(s){
    rows = rows.filter(r =>
      (r.device_label||"").toLowerCase().includes(s) ||
      (r.fault_description||"").toLowerCase().includes(s) ||
      (r.technician||"").toLowerCase().includes(s));
  }
  render(rows);
}

function fmt(ts){ return ts ? new Date(ts).toLocaleDateString() : ""; }

function render(rows){
  const wrap = document.getElementById("tableWrap");
  if(!rows.length){ wrap.innerHTML="<p>No repairs match.</p>"; return; }
  let html = "<table><thead><tr><th>Code</th><th>Device</th><th>Fault</th><th>Reported</th><th>Technician</th><th>Cost</th><th>Status</th><th>Action</th></tr></thead><tbody>";
  rows.forEach(r=>{
    const open = r.status==="Open";
    html += "<tr>" +
      `<td>${r.repair_code||""}</td>` +
      `<td>${r.device_label||""}</td>` +
      `<td>${r.fault_description||""}</td>` +
      `<td>${fmt(r.date_reported)}</td>` +
      `<td>${r.technician||""}</td>` +
      `<td>${r.cost!=null?"₦"+r.cost:""}</td>` +
      `<td><span class="tag ${r.status}">${(r.status||"").toUpperCase()}</span></td>` +
      `<td>${open?`<button class="mini close" onclick="closeRepair(${r.id})">Close</button>`:"—"}</td>` +
    "</tr>";
  });
  html += "</tbody></table>";
  wrap.innerHTML = html;
}

init();
</script>
</body>
</html>
