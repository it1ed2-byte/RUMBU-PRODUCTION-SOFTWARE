<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IT Inventory — Reports</title>
<link rel="stylesheet" href="../../styles.css">
<script>
  (function(){
    function apply(t){ if(t) document.documentElement.setAttribute("data-theme", t); }
    window.addEventListener("message", function(e){ if(e.data && e.data.rumbuTheme) apply(e.data.rumbuTheme); });
    try{ apply(localStorage.getItem("rumbu_theme")); }catch(e){}
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../auth.js"></script>
<script src="org-lists.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{--navy:var(--heading);--blue:var(--accent);--blue-dark:var(--accent-2);--muted:#6b7280;--red:#c0392b;--green:#1d8a4e;}
  *{box-sizing:border-box;}
  body{font-family:var(--sans);background:var(--bg);margin:0;padding:18px;color:var(--text);}
  .wrap{max-width:1200px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;}
  .card h3{color:var(--navy);margin:0 0 4px;font-size:16px;}
  label{display:block;font-size:12px;font-weight:bold;color:var(--text);margin:10px 0 4px;}
  input,select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
  .row > div{flex:1;min-width:160px;}
  button{padding:10px 14px;border:none;border-radius:8px;font-weight:bold;font-size:13px;cursor:pointer;background:var(--blue);color:#fff;}
  button:hover{background:var(--blue-dark);}
  button.print{background:#6b7280;} button.print:hover{background:#4b5563;}
  #connStatus{font-size:12px;font-weight:bold;text-align:center;margin-bottom:10px;}
  .status{margin-top:8px;font-weight:bold;font-size:13px;min-height:14px;}
  .status.err{color:var(--red);}
  table{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px;}
  th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;}
  thead th{background:var(--navy);color:#fff;}
  tbody tr:nth-child(even){background:#f6f8fb;}
  .count{font-size:13px;color:var(--muted);margin-top:8px;}
  .hint{font-size:12px;color:var(--muted);margin-top:6px;min-height:14px;}
</style>
</head>
<body>

<div class="wrap">
<div id="connStatus">Loading...</div>

<div id="appArea" style="display:none;">
  <div class="card">
    <h3>IT Inventory Reports</h3>
    <div class="row">
      <div>
        <label>Report</label>
        <select id="report" onchange="onReportChange()">
          <option value="full_register">Full Device Register</option>
          <option value="by_status">Devices by Status</option>
          <option value="by_branch">Devices by Branch</option>
          <option value="by_department">Devices by Department</option>
          <option value="active_assignments">Active Assignments (devices out)</option>
          <option value="open_repairs">Open Repairs</option>
          <option value="all_repairs">All Repairs</option>
          <option value="maintenance_due">Maintenance Due</option>
          <option value="all_maintenance">All Maintenance</option>
          <option value="movement_history">Movement History</option>
          <option value="disposals">Disposals</option>
        </select>
      </div>
      <div id="branchFilterWrap">
        <label>Branch</label>
        <select id="branchFilter"><option value="">All (my scope)</option></select>
      </div>
      <div id="statusFilterWrap" style="display:none;">
        <label>Status</label>
        <select id="statusFilter"><option value="">All</option></select>
      </div>
      <div style="flex:0 0 auto;"><button onclick="run()">Run Report</button></div>
      <div style="flex:0 0 auto;"><button class="print" onclick="downloadPdf()">Download PDF</button></div>
    </div>
    <div class="row" style="margin-top:4px;">
      <div>
        <label>Filter by date</label>
        <select id="dateBasis" onchange="updateDateHint()"></select>
      </div>
      <div>
        <label>From</label>
        <input type="date" id="dateFrom" oninput="onDateEdit()">
      </div>
      <div>
        <label>To</label>
        <input type="date" id="dateTo" oninput="onDateEdit()">
      </div>
      <div>
        <label>Quick range</label>
        <select id="quickRange" onchange="applyQuickRange()">
          <option value="">Custom</option>
          <option value="today">Today</option>
          <option value="7d">Last 7 days</option>
          <option value="30d">Last 30 days</option>
          <option value="month">This month</option>
          <option value="lastmonth">Last month</option>
          <option value="year">This year</option>
        </select>
      </div>
      <div style="flex:0 0 auto;"><button class="print" onclick="clearDates()">Clear dates</button></div>
    </div>
    <div class="hint" id="dateHint"></div>
    <div class="status" id="status"></div>
    <div class="count" id="count"></div>
  </div>

  <div class="card">
    <div id="reportWrap"><p style="color:#6b7280;">Choose a report and click "Run Report".</p></div>
  </div>
</div>
</div>

<script>
let ME = null;
let BRANCHES = [], STATUSES = [];
let lastTitle = "", lastRows = [], lastHeaders = [], lastMeta = null;

// ---- Rumbu standards: WAT time zone, dates as DD MMM YYYY, money as NGN 5,000 ----
const WAT_TZ = "Africa/Lagos";
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const pad2 = n => String(n).padStart(2, "0");
function watParts(d){
  const o = {};
  new Intl.DateTimeFormat("en-GB", { timeZone: WAT_TZ, year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", hourCycle:"h23" })
    .formatToParts(d).forEach(p => { o[p.type] = p.value; });
  return { y:+o.year, m:+o.month, d:+o.day, hh:o.hour, mm:o.minute };
}
function todayWAT(){ const p = watParts(new Date()); return p.y + "-" + pad2(p.m) + "-" + pad2(p.d); }
function fmtYmd(s){ const [y,m,d] = s.split("-").map(Number); return pad2(d) + " " + MON[m-1] + " " + y; }
function fmt(ts){
  if(!ts) return "";
  const s = String(ts);
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return fmtYmd(s);          // plain dates are shown as they are
  const d = new Date(ts); if(isNaN(d)) return s;
  const p = watParts(d); return pad2(p.d) + " " + MON[p.m-1] + " " + p.y;   // timestamps are shown as the WAT day
}
function stampWAT(){ const p = watParts(new Date()); return pad2(p.d) + " " + MON[p.m-1] + " " + p.y + ", " + p.hh + ":" + p.mm + " WAT"; }
function money(v){ if(v == null || v === "") return ""; const n = Number(v); return isNaN(n) ? String(v) : "NGN " + n.toLocaleString("en-GB", { maximumFractionDigits: 2 }); }
function loc(b,d,u,l){ return [b,d,u,l].filter(Boolean).join(" › ") || "—"; }
function esc(v){ return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

// ---- Date filter ----
// Which date each report can be filtered by (the first is the default). Records with no value in that field
// are left out whenever a range is set.
const DEVICE_DATES = [["created_at","Date registered"],["purchase_date","Purchase date"],["warranty_expiry","Warranty expiry"]];
const DATE_BASES = {
  full_register: DEVICE_DATES, by_status: DEVICE_DATES, by_branch: DEVICE_DATES, by_department: DEVICE_DATES,
  active_assignments: [["date_assigned","Date issued"]],
  open_repairs: [["date_reported","Date reported"]],
  all_repairs: [["date_reported","Date reported"],["date_resolved","Date resolved"]],
  maintenance_due: [["scheduled_date","Scheduled date"]],
  all_maintenance: [["scheduled_date","Scheduled date"],["date_performed","Date performed"],["next_due_date","Next due date"]],
  movement_history: [["move_date","Move date"]],
  disposals: [["disposal_date","Disposal date"]]
};
const OPTIONAL_DATES = new Set(["purchase_date","warranty_expiry","date_resolved","date_performed","next_due_date"]);
const gv = id => document.getElementById(id).value;

function addDays(ymd, n){ const d = new Date(ymd + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0,10); }
// A chosen day always means that day in WAT: it starts at 00:00 WAT and ends where the next day starts.
// This format is read correctly for both plain-date and timestamp columns.
const dayStartWAT = ymd => ymd + "T00:00:00+01:00";
function applyDateRange(q, col){
  const f = gv("dateFrom"), t = gv("dateTo");
  if(f) q = q.gte(col, dayStartWAT(f));
  if(t) q = q.lt(col, dayStartWAT(addDays(t, 1)));
  return q;
}
function fillDateBasis(){
  const sel = document.getElementById("dateBasis"), prev = sel.value;
  const opts = DATE_BASES[gv("report")] || [];
  sel.innerHTML = opts.map(o => `<option value="${o[0]}">${o[1]}</option>`).join("");
  if(opts.some(o => o[0] === prev)) sel.value = prev;
  sel.disabled = opts.length < 2;
  updateDateHint();
}
function updateDateHint(){
  const col = gv("dateBasis"), opt = (DATE_BASES[gv("report")]||[]).find(o => o[0] === col);
  document.getElementById("dateHint").textContent = (opt && OPTIONAL_DATES.has(col))
    ? "Records with no \"" + opt[1] + "\" are left out when a date range is set." : "";
}
function onDateEdit(){ document.getElementById("quickRange").value = ""; }
function clearDates(){ document.getElementById("dateFrom").value = ""; document.getElementById("dateTo").value = ""; document.getElementById("quickRange").value = ""; }
function applyQuickRange(){
  const v = gv("quickRange"); if(!v) return;
  const today = todayWAT(), [y, m] = today.split("-").map(Number);
  const lastDay = (yy, mm) => new Date(Date.UTC(yy, mm, 0)).getUTCDate();
  let from = "", to = "";
  if(v === "today"){ from = to = today; }
  else if(v === "7d"){ from = addDays(today, -6); to = today; }
  else if(v === "30d"){ from = addDays(today, -29); to = today; }
  else if(v === "month"){ from = y + "-" + pad2(m) + "-01"; to = y + "-" + pad2(m) + "-" + pad2(lastDay(y, m)); }
  else if(v === "lastmonth"){ const py = m === 1 ? y - 1 : y, pm = m === 1 ? 12 : m - 1; from = py + "-" + pad2(pm) + "-01"; to = py + "-" + pad2(pm) + "-" + pad2(lastDay(py, pm)); }
  else if(v === "year"){ from = y + "-01-01"; to = y + "-12-31"; }
  document.getElementById("dateFrom").value = from; document.getElementById("dateTo").value = to;
}

async function init(){
  const status = document.getElementById("connStatus");
  try{
    ME = await requireAuth("../../login.html");
    if(!ME) return;
    status.style.color = "#1d8a4e"; status.textContent = "Connected." + (itSeesAllBranches(ME)?" All branches.":" Your branch(es).");
    document.getElementById("appArea").style.display = "block";
    fillDateBasis();
    await loadRef();
  }catch(e){
    status.style.color = "#c0392b"; status.textContent = "❌ " + e.message; console.error(e);
  }
}

async function loadRef(){
  const [sec, st] = await Promise.all([
    sb.from("app_sections").select("name").order("name"),
    sb.from("it_ref_statuses").select("name").order("name")
  ]);
  BRANCHES = (itSeesAllBranches(ME)) ? (sec.data||[]).map(s=>s.name) : (ME.sectionNames||[]);
  STATUSES = (st.data||[]).map(s=>s.name);
  const bf = document.getElementById("branchFilter");
  BRANCHES.forEach(b=>{ const o=document.createElement("option"); o.value=b; o.textContent=b; bf.appendChild(o); });
  const sf = document.getElementById("statusFilter");
  STATUSES.forEach(s=>{ const o=document.createElement("option"); o.value=s; o.textContent=s; sf.appendChild(o); });
}

function onReportChange(){
  const r = gv("report");
  document.getElementById("statusFilterWrap").style.display = (r==="by_status") ? "block" : "none";
  fillDateBasis();
}

function scope(q){
  const bf = document.getElementById("branchFilter").value;
  if(bf) return q.eq("branch", bf);
  if(!itSeesAllBranches(ME)){
    if(ME.sectionNames && ME.sectionNames.length) return q.in("branch", ME.sectionNames);
    return q.eq("branch","___none___");
  }
  return q;
}

async function run(){
  const status = document.getElementById("status");
  status.className="status"; status.textContent="Running...";
  const r = gv("report");
  const from = gv("dateFrom"), to = gv("dateTo"), hasRange = !!(from || to);
  if(from && to && from > to){ status.className="status err"; status.textContent="❌ The From date is after the To date."; return; }
  const basis = gv("dateBasis"), basisLabel = ((DATE_BASES[r]||[]).find(o => o[0] === basis) || [])[1] || "";
  try{
    let headers=[], rows=[], title="", recs=[], addBasisCol=false, statusText="";
    if(r==="full_register" || r==="by_status" || r==="by_branch" || r==="by_department"){
      let q = scope(sb.from("it_devices").select("*"));
      const stF = gv("statusFilter");
      if(r==="by_status" && stF){ q = q.eq("status", stF); statusText = stF; }
      q = applyDateRange(q, basis);
      const { data, error } = await q; if(error) throw error;
      let devs = data||[];
      if(r==="by_branch") devs.sort((a,b)=>(a.branch||"").localeCompare(b.branch||""));
      if(r==="by_department") devs.sort((a,b)=>(a.department||"").localeCompare(b.department||""));
      headers = ["Code","Type","Make/Model","Serial","Branch","Dept/Unit","Assigned","Status","Condition"];
      rows = devs.map(d=>[d.device_code, d.type, [d.make,d.model].filter(Boolean).join(" "), d.serial_number, d.branch, [d.department,d.unit].filter(Boolean).join(" / "), d.assigned_name, d.status, d.condition]);
      recs = devs; addBasisCol = hasRange;     // none of the three dates is a column, so show the one used
      title = ({full_register:"Full Device Register", by_status:"Devices by Status"+(stF?": "+stF:""), by_branch:"Devices by Branch", by_department:"Devices by Department"})[r];
    } else if(r==="active_assignments"){
      let q = scope(sb.from("it_assignments").select("*")).is("date_returned", null);
      q = applyDateRange(q, basis);
      const { data, error } = await q; if(error) throw error;
      headers = ["Code","Device","Assigned To","Branch","Issued","By"];
      rows = (data||[]).map(a=>[a.assign_code, a.device_label, a.assigned_name, a.branch, fmt(a.date_assigned), a.assigned_by]);
      title = "Active Assignments";
    } else if(r==="open_repairs" || r==="all_repairs"){
      let q = scope(sb.from("it_repairs").select("*"));
      if(r==="open_repairs") q = q.eq("status","Open");
      q = applyDateRange(q, basis);
      const { data, error } = await q; if(error) throw error;
      headers = ["Code","Device","Fault","Reported","Technician","Cost","Status"];
      rows = (data||[]).map(x=>[x.repair_code, x.device_label, x.fault_description, fmt(x.date_reported), x.technician, money(x.cost), x.status]);
      recs = data||[]; addBasisCol = hasRange && basis === "date_resolved";
      title = r==="open_repairs" ? "Open Repairs" : "All Repairs";
    } else if(r==="maintenance_due" || r==="all_maintenance"){
      let q = scope(sb.from("it_maintenance").select("*"));
      q = applyDateRange(q, basis);
      const { data, error } = await q; if(error) throw error;
      let m = data||[];
      if(r==="maintenance_due"){
        m = m.filter(x=>x.status!=="Completed");
        if(!hasRange){   // no range chosen: the standing rule, due within 7 days or overdue
          const now = new Date();
          m = m.filter(x=>x.scheduled_date && (new Date(x.scheduled_date)-now)/86400000 <= 7);
        }
      }
      headers = ["Code","Device","Type","Scheduled","Performed","Next Due","Status"];
      rows = m.map(x=>[x.maint_code, x.device_label, x.type, fmt(x.scheduled_date), fmt(x.date_performed), fmt(x.next_due_date), x.status]);
      title = (r==="maintenance_due") ? (hasRange ? "Maintenance Due" : "Maintenance Due (next 7 days)") : "All Maintenance";
    } else if(r==="movement_history"){
      let q = scope(sb.from("it_movement").select("*"));
      q = applyDateRange(q, basis).order("move_date",{ascending:false});
      const { data, error } = await q; if(error) throw error;
      headers = ["Code","Date","Device","From","To","Reason","By"];
      rows = (data||[]).map(x=>[x.move_code, fmt(x.move_date), x.device_label, loc(x.from_branch,x.from_department,x.from_unit,x.from_location), loc(x.to_branch,x.to_department,x.to_unit,x.to_location), x.reason, x.moved_by]);
      title = "Movement History";
    } else if(r==="disposals"){
      let q = scope(sb.from("it_disposal").select("*"));
      q = applyDateRange(q, basis).order("disposal_date",{ascending:false});
      const { data, error } = await q; if(error) throw error;
      headers = ["Code","Device","Branch","Method","Reason","Date","Recovery"];
      rows = (data||[]).map(x=>[x.disposal_code, x.device_label, x.branch, x.method, x.reason, fmt(x.disposal_date), money(x.recovery_value)]);
      title = "Disposals";
    }
    if(addBasisCol){ headers.push(basisLabel); rows.forEach((row,i)=>row.push(fmt(recs[i][basis]))); }

    // What the report covers, captured now so the PDF always matches what was run (not later edits to the filters).
    const periodText = hasRange
      ? basisLabel + ": " + (from && to ? fmtYmd(from) + " to " + fmtYmd(to) : (from ? "from " + fmtYmd(from) : "up to " + fmtYmd(to)))
      : (r==="maintenance_due" ? "Due within the next 7 days, or overdue" : "All dates");
    const bf = document.getElementById("branchFilter").value;
    const branchText = bf || (itSeesAllBranches(ME) ? "All branches" : "All my branches");
    lastTitle=title; lastRows=rows; lastHeaders=headers;
    lastMeta = { title, periodText, branchText, from, to, hasRange };
    renderTable(headers, rows);
    document.getElementById("count").textContent = rows.length + " row(s). " + periodText + ".";
    status.textContent="";
  }catch(e){
    status.className="status err"; status.textContent="❌ "+e.message;
  }
}

function renderTable(headers, rows){
  const wrap = document.getElementById("reportWrap");
  if(!rows.length){ wrap.innerHTML="<p>No data for this report.</p>"; return; }
  let html = "<table><thead><tr>"+headers.map(h=>`<th>${esc(h)}</th>`).join("")+"</tr></thead><tbody>";
  rows.forEach(row=>{ html += "<tr>"+row.map(c=>`<td>${c!=null&&c!==""?esc(c):""}</td>`).join("")+"</tr>"; });
  html += "</tbody></table>";
  wrap.innerHTML = html;
}

// ---- PDF in the Rumbu house style ----
// A4 landscape. "RUMBU INDUSTRIES GROUP" top-left and the document title top-right on every page; CONFIDENTIAL
// bottom-left and "Page X of Y" bottom-right on every page; navy table header that repeats on each page.
const NAVY = [31,56,100], BLUE = [46,117,182];
// The standard PDF fonts cannot draw every character; replace the ones they cannot, so nothing prints as junk.
function pdfSafe(v){
  if(v == null) return "";
  const repl = { "–":"-", "—":"-", "‘":"'", "’":"'", "“":'"', "”":'"', "…":"...", "›":">", "₦":"NGN ",
                 "Ɓ":"B", "ɓ":"b", "Ɗ":"D", "ɗ":"d", "Ƙ":"K", "ƙ":"k", "Ƴ":"Y", "ƴ":"y" };   // Hausa hooked letters -> plain letters
  let out = "";
  for(const ch of String(v).normalize("NFC")){
    const c = ch.codePointAt(0);
    if((c >= 32 && c <= 126) || (c >= 160 && c <= 255)){ out += ch; continue; }
    if(c === 9 || c === 10 || c === 13){ out += " "; continue; }
    if(repl[ch] !== undefined){ out += repl[ch]; continue; }
    const base = ch.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    out += (base && base !== ch && base.codePointAt(0) <= 255) ? base : "?";
  }
  return out;
}
function pdfFileName(){
  const titleCase = t => t.replace(/[^A-Za-z0-9]+/g, " ").trim().split(" ").map(w => w.charAt(0).toUpperCase() + w.slice(1)).join("_");
  const dm = ymd => fmtYmd(ymd).replace(/ /g, "_");
  const m = lastMeta;
  const period = m.from && m.to ? dm(m.from) + "_to_" + dm(m.to) : (m.from ? "From_" + dm(m.from) : (m.to ? "Up_To_" + dm(m.to) : "As_At_" + dm(todayWAT())));
  return "IT_Inventory_" + titleCase(m.title) + "_" + period + ".pdf";
}
function downloadPdf(){
  if(!lastMeta){ alert("Run a report first."); return; }
  if(!(window.jspdf && window.jspdf.jsPDF)){ alert("The PDF library did not load. Check your connection and reopen this page."); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: "landscape", unit: "pt", format: "a4" });
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), MX = 36;
  const docTitle = "IT Inventory Report: " + lastMeta.title;
  const n = lastRows.length;

  // Title block (first page)
  let y = 72;
  doc.setFont("helvetica","bold"); doc.setFontSize(16); doc.setTextColor(...NAVY);
  doc.text(pdfSafe(docTitle), MX, y);
  y += 19; doc.setFontSize(11); doc.setTextColor(...BLUE);
  doc.text(pdfSafe(lastMeta.periodText), MX, y);
  y += 15; doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(80,80,80);
  doc.text(pdfSafe("Branch: " + lastMeta.branchText), MX, y);
  y += 12; doc.text(pdfSafe("Generated " + stampWAT() + (ME && ME.username ? " by " + ME.username : "") + "   |   " + n + " record(s)"), MX, y);

  if(n){
    const alignRight = {};
    lastHeaders.forEach((h,i)=>{ if(h === "Cost" || h === "Recovery") alignRight[i] = { halign: "right" }; });
    doc.autoTable({
      startY: y + 14,
      head: [lastHeaders.map(pdfSafe)],
      body: lastRows.map(r => r.map(c => pdfSafe(c))),
      theme: "grid",
      styles: { font: "helvetica", fontSize: 9, cellPadding: 4, textColor: [30,30,30], lineColor: [200,208,220], lineWidth: 0.4, overflow: "linebreak", valign: "top" },
      headStyles: { fillColor: NAVY, textColor: [255,255,255], fontStyle: "bold", fontSize: 9, lineColor: NAVY },
      alternateRowStyles: { fillColor: [242,246,251] },
      columnStyles: alignRight,
      didParseCell: function(data){ if(data.section === "head" && alignRight[data.column.index]) data.cell.styles.halign = "right"; },   // heading follows its figures
      margin: { top: 58, left: MX, right: MX, bottom: 46 },
      rowPageBreak: "avoid",
      showHead: "everyPage"
    });
  } else {
    doc.setFontSize(10); doc.setTextColor(30,30,30);
    doc.text("No records match these filters.", MX, y + 30);
  }

  // Running header and footer on every page, with "Page X of Y"
  const pages = doc.internal.getNumberOfPages();
  for(let i = 1; i <= pages; i++){
    doc.setPage(i);
    doc.setFont("helvetica","bold"); doc.setFontSize(8); doc.setTextColor(...NAVY);
    doc.text("RUMBU INDUSTRIES GROUP", MX, 30);
    doc.setFont("helvetica","normal");
    doc.text(pdfSafe(docTitle), W - MX, 30, { align: "right" });
    doc.setDrawColor(...BLUE); doc.setLineWidth(1); doc.line(MX, 38, W - MX, 38);
    doc.setDrawColor(200,208,220); doc.setLineWidth(0.5); doc.line(MX, H - 34, W - MX, H - 34);
    doc.setFontSize(8); doc.setTextColor(110,110,110);
    doc.text("CONFIDENTIAL", MX, H - 22);
    doc.text("Page " + i + " of " + pages, W - MX, H - 22, { align: "right" });
  }
  doc.save(pdfFileName());
}

init();
</script>
</body>
</html>
