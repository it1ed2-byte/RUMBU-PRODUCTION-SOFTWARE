<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>External Material Intake — PET Collection</title>
<link rel="stylesheet" href="../../styles.css">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("rumbu_theme")||"navy"); }catch(e){} })();
  window.addEventListener("message",function(e){ if(e.data&&e.data.rumbuTheme) document.documentElement.setAttribute("data-theme",e.data.rumbuTheme); });
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../auth.js"></script>
<style>
  body{padding:20px;}
  .wrap{max-width:900px;margin:0 auto;}
  label{font-size:12px;font-weight:700;display:block;margin:10px 0 4px;color:var(--muted);}
  input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;background:var(--card);color:var(--text);}
  .card-panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;}
  .form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:12px;}
  th{background:var(--th-bg);color:var(--th-fg);text-align:left;padding:7px;}
  td{padding:6px 7px;border-bottom:1px solid var(--line);}
</style>
</head>
<body>
<div id="authGate" style="text-align:center;padding:40px;font-size:13px;color:var(--muted);">Loading...</div>

<div class="wrap" id="app" style="display:none;">
  <h2 style="color:var(--heading);">External Material Intake</h2>
  <p style="font-size:12.5px;color:var(--muted);">
    Logs external PET material arriving from any source — each entry gets its own ID automatically and is placed into a LOT.
    See <a href="external-material-monitor.html">External Material Monitor</a> for balances and usage history per LOT.
  </p>

  <div class="card-panel">
    <h3 style="margin-top:0;">Log New Arrival</h3>
    <div class="form-row">
      <div><label>Arrival Date *</label><input type="date" id="in_date"></div>
      <div><label>Source / Origin *</label><input type="text" id="in_source" placeholder="e.g. Kano Wash Plant, Lagos, Ibadan..."></div>
      <div><label>Weight Received (kg) *</label><input type="number" id="in_kg" min="0" step="0.01" inputmode="decimal" placeholder="e.g. 500"></div>
      <div><label>Place Into LOT *</label>
        <select id="in_lot"><option value="">— select —</option></select>
      </div>
    </div>
    <div class="form-row" style="margin-top:8px;">
      <div><label>Received At (Branch)</label>
        <select id="in_branch"><option value="">— select —</option></select>
      </div>
      <div><label>Notes (optional)</label><input type="text" id="in_notes" placeholder="e.g. truck/driver, anything worth noting"></div>
    </div>
    <button onclick="saveIntake()" style="margin-top:14px;">Log Arrival</button>
    <div class="status" id="saveStatus"></div>
  </div>

  <div class="card-panel">
    <h3 style="margin-top:0;">Recent Arrivals</h3>
    <label>Search by ID or LOT</label>
    <input type="text" id="searchQ" oninput="renderList()" placeholder="Type an ID or LOT name...">
    <div id="listWrap"></div>
  </div>
</div>

<script>
let ME = null;
let INTAKE_ROWS = [];
let LOTS = [];

async function init(){
  const gate = document.getElementById("authGate");
  try{
    ME = await requireAuth("../../login.html");
    if(!ME) return;
    gate.style.display = "none";
    document.getElementById("app").style.display = "block";
    document.getElementById("in_date").value = new Date().toISOString().slice(0,10);
    await loadLots();
    await loadBranches();
    await loadIntakeList();
  }catch(e){
    gate.textContent = "❌ " + e.message;
  }
}

async function loadLots(){
  const { data } = await sb.from("pet_lots").select("id, lot_name").order("lot_name");
  LOTS = data || [];
  const sel = document.getElementById("in_lot");
  sel.innerHTML = "<option value=\"\">— select —</option>" +
    LOTS.map(l=>`<option value="${l.id}">${esc(l.lot_name)}</option>`).join("");
}

function lotNameFor(id){ const l = LOTS.find(x=>String(x.id)===String(id)); return l ? l.lot_name : ("#"+id); }

async function loadBranches(){
  const { data } = await sb.from("app_sections").select("name").order("name");
  const sel = document.getElementById("in_branch");
  const branches = (data||[]).map(s=>s.name);
  sel.innerHTML = "<option value=\"\">— select —</option>" + branches.map(b=>`<option value="${b}">${b}</option>`).join("");
  const lagos = branches.find(b => b.toLowerCase().indexOf("rumbu mainmat") === 0 || b.toLowerCase().indexOf("lagos") !== -1);
  if(lagos) sel.value = lagos;
}

async function loadIntakeList(){
  const { data, error } = await sb.from("pet_kano_material_intake").select("*").order("arrival_date", { ascending:false }).order("id", { ascending:false });
  if(error){ document.getElementById("listWrap").innerHTML = "<p style='color:var(--muted);'>Error: " + error.message + "</p>"; return; }
  INTAKE_ROWS = data || [];
  renderList();
}

function renderList(){
  const q = (document.getElementById("searchQ").value||"").trim().toLowerCase();
  const wrap = document.getElementById("listWrap");
  const rows = !q ? INTAKE_ROWS : INTAKE_ROWS.filter(r =>
    String(r.id).includes(q) || lotNameFor(r.lot_id).toLowerCase().includes(q));
  if(!rows.length){ wrap.innerHTML = "<p style='color:var(--muted);font-size:12.5px;'>No arrivals logged yet.</p>"; return; }
  wrap.innerHTML = `<table><thead><tr><th>ID</th><th>Arrival Date</th><th>Source</th><th>Weight (kg)</th><th>LOT</th><th>Received At</th><th>Notes</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>#${r.id}</td><td>${r.arrival_date}</td><td>${esc(r.source_name||"—")}</td><td>${Number(r.total_kg).toLocaleString()}</td><td>${esc(lotNameFor(r.lot_id))}</td><td>${esc(r.branch||"—")}</td><td>${esc(r.notes||"—")}</td></tr>`).join("")}
  </tbody></table>`;
}
window.renderList = renderList;

function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

async function saveIntake(){
  const status = document.getElementById("saveStatus");
  const kg = parseFloat(document.getElementById("in_kg").value);
  const date = document.getElementById("in_date").value;
  const lotId = document.getElementById("in_lot").value;
  const branch = document.getElementById("in_branch").value;
  const notes = document.getElementById("in_notes").value.trim();

  const source = document.getElementById("in_source").value.trim();
  if(!date){ status.className="status err"; status.textContent="Enter the arrival date."; return; }
  if(!source){ status.className="status err"; status.textContent="Enter the source or origin of this material."; return; }
  if(isNaN(kg) || kg <= 0){ status.className="status err"; status.textContent="Enter a valid weight in kg."; return; }
  if(!lotId){ status.className="status err"; status.textContent="Select which LOT this material is going into."; return; }

  status.className = "status"; status.textContent = "Saving...";
  try{
    const { data, error } = await sb.from("pet_kano_material_intake").insert({
      arrival_date: date, total_kg: kg, lot_id: Number(lotId),
      source_name: source || null, branch: branch || null, notes: notes || null, recorded_by: ME.id
    }).select("id").single();
    if(error) throw error;
    status.className = "status ok"; status.textContent = "✅ Logged as ID #" + data.id + ".";
    document.getElementById("in_kg").value = "";
    document.getElementById("in_source").value = "";
    document.getElementById("in_notes").value = "";
    await loadIntakeList();
  }catch(e){
    status.className = "status err"; status.textContent = "❌ " + e.message;
  }
}
window.saveIntake = saveIntake;

init();
</script>
</body>
</html>
