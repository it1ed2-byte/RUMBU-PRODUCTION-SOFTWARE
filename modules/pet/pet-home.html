<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PET Home — PET Collection</title>
<link rel="stylesheet" href="../../styles.css">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("rumbu_theme")||"navy"); }catch(e){} })();
  window.addEventListener("message",function(e){ if(e.data&&e.data.rumbuTheme) document.documentElement.setAttribute("data-theme",e.data.rumbuTheme); });
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../auth.js"></script>
<style>
  *{box-sizing:border-box;}
  body{padding:18px;}
  .wrap{max-width:1200px;margin:0 auto;}
  #connStatus{font-size:12px;font-weight:700;text-align:center;margin-bottom:10px;color:var(--muted);}
  .eyebrow{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
  h1.home-title{margin:2px 0 4px;font-size:26px;color:var(--heading);}
  .home-sub{margin:0 0 22px;font-size:13.5px;color:var(--muted);}
  .layout{display:flex;flex-wrap:wrap;gap:26px;align-items:flex-start;}
  .main{flex:999 1 620px;min-width:0;display:flex;flex-direction:column;gap:28px;}
  .side{flex:1 1 290px;min-width:0;display:flex;flex-direction:column;gap:14px;}
  h2.sec{margin:0 0 4px;font-size:17px;color:var(--heading);}
  p.sec-sub{margin:0 0 12px;font-size:13px;color:var(--muted);}
  .cards{display:flex;flex-wrap:wrap;gap:14px;}
  .need{flex:1 1 200px;min-width:200px;text-align:left;font-family:inherit;color:var(--text);background:var(--card);border:1px solid var(--line-2);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:9px;cursor:pointer;}
  .need:hover,.tile:not(.locked):hover{border-color:var(--accent);}
  .need .top,.tile .top{display:flex;align-items:center;gap:9px;}
  .num{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--logo-fg);font-size:13px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:none;}
  .need .nm{font-size:15px;font-weight:800;color:var(--heading);}
  .need .big{display:flex;align-items:baseline;gap:8px;}
  .need .big b{font-size:38px;line-height:1;font-weight:800;}
  .need .big span{font-size:13px;color:var(--muted);}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--bg);color:var(--text);}
  .chip.warn{background:#fff1cc;color:#7a4b00;}
  .chip.ret{background:#fde8e8;color:#7f1d1d;}
  .open{font-size:13px;font-weight:800;color:var(--accent);}
  .empty{font-size:13.5px;color:var(--muted);background:var(--card);border:1px dashed var(--line-2);border-radius:12px;padding:16px;}
  .tiles{display:flex;flex-wrap:wrap;gap:12px;}
  .tile{flex:1 1 140px;min-width:140px;text-align:left;font-family:inherit;color:var(--text);background:var(--card);border:1px solid var(--line-2);border-radius:12px;padding:13px;display:flex;flex-direction:column;gap:7px;cursor:pointer;}
  .tile .nm{font-size:13.5px;font-weight:800;line-height:1.25;min-height:34px;color:var(--heading);}
  .tile .cnt{font-size:28px;font-weight:800;line-height:1.1;}
  .tile .cnt.zero{color:var(--muted);}
  .tile .note{font-size:12px;color:var(--muted);}
  .tile.locked{cursor:not-allowed;border-style:dashed;background:transparent;opacity:.75;}
  .tile.locked .num{background:var(--line-2);color:var(--heading);}
  .linkcard{background:var(--card);border:1px solid var(--line-2);border-radius:12px;padding:6px 0;}
  .linkcard .lh{padding:11px 16px 6px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
  .linkcard button.li{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:40px;padding:0 16px;font-family:inherit;font-size:13.5px;color:var(--text);background:none;border:0;text-align:left;cursor:pointer;}
  .linkcard button.li:hover{background:var(--bg);}
  .linkcard details summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;min-height:44px;align-items:center;padding:0 16px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
  .linkcard details summary::-webkit-details-marker{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <div id="connStatus">Loading...</div>
  <div class="eyebrow">Rumbu Industries Group</div>
  <h1 class="home-title">PET Collection</h1>
  <p class="home-sub">Your work first, then the whole pipeline.</p>

  <div class="layout">
    <div class="main">
      <section>
        <h2 class="sec">Waiting for you</h2>
        <p class="sec-sub">Collections you can fill or review right now, in the stages and branches you are assigned to.</p>
        <div class="cards" id="needs"></div>
      </section>
      <section>
        <h2 class="sec">The pipeline</h2>
        <p class="sec-sub">Every collection moves through these stages in order. Tap a stage to open it.</p>
        <div class="tiles" id="pipeline"></div>
      </section>
    </div>
    <div class="side" id="side"></div>
  </div>
</div>

<script>
// This page lives inside the app shell, which already knows the PET stage list, the groups, which pages this person may open and
// what is waiting for them. It reads those from the shell instead of keeping its own copy, so the pill bar, the menu and this
// page always agree.
const AGE_WARN = 3;   // days a collection can sit at one stage before it is flagged (same limit as the PET Dashboard)

function shell(expr){ try{ return window.parent !== window ? window.parent.eval(expr) : null; }catch(e){ return null; } }
function esc(t){ return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function byId(i){ return document.getElementById(i); }
function go(path, label){
  const parts = path.split("/");
  if(window.parent && window.parent !== window && typeof window.parent.openModule === "function"){ window.parent.openModule(null, parts[0], parts[1], label || ""); }
  else { window.location.href = parts[1] + ".html"; }
}
function ageText(oldest){
  if(oldest == null) return null;
  const d = Math.floor((Date.now() - oldest) / 86400000);
  return { days:d, text: d <= 0 ? "Oldest: today" : "Oldest: " + d + (d === 1 ? " day" : " days") };
}

async function init(){
  const cs = byId("connStatus");
  try{
    const me = await requireAuth("../../login.html");
    if(!me) return;
  }catch(e){ cs.textContent = "Could not sign in: " + e.message; return; }

  const stages = shell("PET_STAGES"), groups = shell("PET_GROUPS");
  const allowedList = shell("Array.from(MY_ALLOWED_PATHS)");
  const pageList = shell("(MODULE_PAGES_BY_MODULE['PET Collection']||[]).map(p=>({path:p.module_path,name:p.name}))");
  if(!stages || !groups || !allowedList){ cs.textContent = "Open PET Home from the PET Collection menu."; return; }
  const allowed = new Set(allowedList), names = {};
  (pageList || []).forEach(p => { names[p.path] = p.name; });

  let counts = null;
  try{ counts = await window.parent.petLoadCounts(); }catch(e){ counts = null; }
  cs.textContent = "";

  // Waiting for you
  const needs = [];
  stages.forEach(s => { const c = counts && counts[s.n]; if(allowed.has(s.path) && c && c.waiting > 0) needs.push({ s, c }); });
  byId("needs").innerHTML = needs.length ? needs.map(({s, c}) => {
    const age = ageText(c.oldest), warn = age && age.days > AGE_WARN;
    return '<button class="need" data-path="' + esc(s.path) + '" data-label="' + esc(names[s.path] || s.full) + '">'
      + '<div class="top"><span class="num">' + s.n + '</span><span class="nm">' + esc(s.full) + '</span></div>'
      + '<div class="big"><b>' + c.waiting + '</b><span>waiting for you</span></div>'
      + '<div class="chips">'
      + (age ? '<span class="chip' + (warn ? ' warn' : '') + '">' + esc(age.text) + (warn ? ', over the ' + AGE_WARN + ' day limit' : '') + '</span>' : '')
      + (c.returned > 0 ? '<span class="chip ret">' + c.returned + ' returned for correction</span>' : '')
      + '</div><span class="open">Open stage ' + s.n + ' &rsaquo;</span></button>';
  }).join("") : '<div class="empty">' + (counts ? "Nothing is waiting for you right now." : "The numbers could not be loaded just now. The stages below still open.") + '</div>';

  // Pipeline
  byId("pipeline").innerHTML = stages.map(s => {
    const open = allowed.has(s.path), c = counts && counts[s.n];
    if(!open) return '<div class="tile locked" title="Not assigned to you" aria-disabled="true"><div class="top"><span class="num">' + s.n + '</span></div><span class="nm">' + esc(s.full) + '</span><span class="note">Not assigned to you</span></div>';
    const hasCount = c != null;
    return '<button class="tile" data-path="' + esc(s.path) + '" data-label="' + esc(names[s.path] || s.full) + '"><div class="top"><span class="num">' + s.n + '</span></div>'
      + '<span class="nm">' + esc(s.full) + '</span>'
      + (hasCount ? '<span class="cnt' + (c.waiting ? '' : ' zero') + '">' + c.waiting + '</span><span class="note">waiting for you</span>' : '<span class="note">Open stage</span>')
      + '</button>';
  }).join("");

  // Side links
  const side = [];
  groups.forEach(g => {
    const list = g.paths.filter(p => allowed.has(p) && names[p]);
    if(!list.length) return;
    const items = list.map(p => '<button class="li" data-path="' + esc(p) + '" data-label="' + esc(names[p]) + '"><span>' + esc(names[p]) + '</span><span aria-hidden="true">&rsaquo;</span></button>').join("");
    side.push(g.collapsed
      ? '<div class="linkcard"><details><summary><span>' + esc(g.label) + '</span><span>' + list.length + '</span></summary>' + items + '</details></div>'
      : '<div class="linkcard"><div class="lh">' + esc(g.label) + '</div>' + items + '</div>');
  });
  byId("side").innerHTML = side.join("");
}

document.addEventListener("click", function(e){
  const b = e.target.closest && e.target.closest("[data-path]");
  if(b) go(b.getAttribute("data-path"), b.getAttribute("data-label"));
});
init();
</script>
</body>
</html>
