<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rumbu Weight Details — PET Collection</title>
<link rel="stylesheet" href="../../styles.css">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("rumbu_theme")||"navy"); }catch(e){} })();
  window.addEventListener("message",function(e){ if(e.data&&e.data.rumbuTheme) document.documentElement.setAttribute("data-theme",e.data.rumbuTheme); });
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../auth.js"></script>
<script src="review-modal.js"></script>
<script src="queue-collapse.js"></script>
<style>
  body{padding:20px;}
  .wrap{max-width:1100px;margin:0 auto;}
  label{font-size:12px;font-weight:700;display:block;margin:10px 0 4px;color:var(--muted);}
  input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;background:var(--card);color:var(--text);}
  input[readonly]{background:var(--bg);color:var(--muted);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .file-row{display:flex;gap:8px;align-items:center;}
  .file-url{font-size:11px;color:var(--ok);word-break:break-all;margin-top:2px;}
  .queue-row{padding:10px 14px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;background:var(--card);gap:10px;flex-wrap:wrap;}
  .queue-row .meta{font-size:12px;color:var(--muted);}
  .badge-status{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:700;}
  .bs-submitted{background:#dbeafe;color:#1e40af;}
  .bs-rejected{background:#fee2e2;color:#991b1b;}
  .bs-approval{background:#fef3c7;color:#92400e;}
  .panel{border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px;}
  .panel-title{font-weight:700;font-size:14px;color:var(--heading);margin:0 0 14px;}
  .correction-note{background:#fef3c7;border:1px solid #d97706;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:12px;}
  .approve-card{border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:10px;background:var(--card);}
</style>
</head>
<body>
<div class="wrap">
  <button onclick="(window.parent&&window.parent.closeModule)?window.parent.closeModule():(window.location.href='../../index.html')" style="max-width:200px;margin-bottom:12px;background:var(--accent);color:var(--logo-fg);">&larr; Back</button>
  <div id="connStatus" style="font-size:12px;font-weight:700;text-align:center;margin-bottom:10px;color:var(--muted);">Loading...</div>

  <div id="fillSection" style="display:none;">
    <div class="panel">
      <div class="panel-title" id="fillQueueTitle">Your Queue — Stage 5: Rumbu Weight Details</div>
      <p style="font-size:12px;color:var(--muted);margin:0 0 12px;">Everything waiting for you at this stage — items to fill and items to review and approve — in one list.</p>
      <div id="fillQueue"></div>
    </div>

    <div id="rwForm" style="display:none;">
      <div class="card-panel">
        <h3 style="color:var(--heading);margin:0 0 4px;" id="rwFormTitle">Rumbu Weight Details</h3>
        <div id="rwCorrectionNote" style="display:none;" class="correction-note"></div>
        <div class="grid3" style="margin-bottom:8px;">
          <div><label>Form Number</label><input type="text" id="rwFormNum" readonly></div>
          <div><label>Agent Name</label><input type="text" id="rwAgent" readonly></div>
          <div><label>Agent Code (AGENT_CODE)</label><input type="text" id="rwAgentCode" readonly></div>
        </div>

        <div class="grid2" style="margin-top:4px;">
          <div>
            <label>Rumbu Weighbridge Weight (kg) *</label>
            <input type="number" id="rwWeight" step="0.01" placeholder="0.00">
            <label>Rumbu Weighbridge Attachment *</label>
            <div class="file-row">
              <input type="file" id="rwFile" accept=".pdf,.jpg,.jpeg,.png">
            </div>
            <div class="file-url" id="rwFileUrl"></div>
          </div>
        </div>

        <div style="margin-top:20px;display:flex;gap:10px;">
          <button onclick="submitRumbuWeight()">Submit</button>
          <button class="btn-ghost" onclick="closeRwForm()">Cancel</button>
        </div>
        <div id="rwFormStatus" style="margin-top:10px;font-size:13px;font-weight:700;min-height:16px;"></div>
      </div>
    </div>
  </div>

  <div id="noQueue" style="display:none;text-align:center;color:var(--muted);padding:40px 0;font-size:14px;">
    No collections assigned to you at this stage.
  </div>
</div>

<script>
let ME=null, ALL_SECTIONS=[], IS_FILLER=false, IS_APPROVER=false, CURRENT_COLLECTION=null, RW_QUEUE_DATA=[];

// Approving advances to Stage 4c (Quality Control). Rejecting sends back
// to Stage 4a (Bottle Offloading) — the stage immediately before this one.
const NEXT_STATUS   = { stage4b:'stage4c_qc_filling' };
const REJECT_STATUS = { stage4b:'rejected_to_stage4a' };

async function init(){
  const cs = document.getElementById("connStatus");
  try{
    ME = await requireAuth("../../login.html");
    if(!ME) return;

    const { data: secData } = await sb.from("app_sections").select("name").order("name");
    ALL_SECTIONS = (secData||[]).map(s=>s.name);

    const [{ data: fillerRows }, { data: approverRows }] = await Promise.all([
      sb.from("pet_stage_fillers").select("section").eq("stage","stage4b").eq("profile_id",ME.id),
      sb.from("pet_stage_approvers").select("section").eq("stage","stage4b").eq("profile_id",ME.id)
    ]);
    IS_FILLER   = (fillerRows&&fillerRows.length>0) || ME.role==="super_admin";
    IS_APPROVER = (approverRows&&approverRows.length>0) || ME.role==="super_admin";

    const fillerSections   = fillerRows   ? fillerRows.map(r=>r.section)   : [];
    const approverSections = approverRows ? approverRows.map(r=>r.section) : [];

    const [fillRows, apprRows] = await Promise.all([
      IS_FILLER   ? loadFillQueue(fillerSections)   : [],
      IS_APPROVER ? loadApprovalQueue(approverSections) : []
    ]);
    if(IS_FILLER || IS_APPROVER) renderQueue((fillRows||[]).concat(apprRows||[]));

    if(!IS_FILLER && !IS_APPROVER){
      document.getElementById("noQueue").style.display="block";
    }

    cs.style.color="var(--ok)"; cs.textContent="Connected.";
  }catch(e){
    cs.style.color="var(--bad)"; cs.textContent="Error: "+e.message;
  }
}

// One single list per stage: items to fill AND items to review/approve.
function renderQueue(rows){
  document.getElementById("fillSection").style.display = "block";
  document.getElementById("fillQueue").innerHTML = rows.length
    ? rows.join("")
    : `<p style="font-size:13px;color:var(--muted);">Nothing is waiting for you at this stage.</p>`;
  setupCollapsibleQueue("fillQueueTitle", "fillQueue", rows.length, "Your Queue — Stage 5: Rumbu Weight Details");
}

async function loadFillQueue(sections){
  const { data } = await sb.from("pet_collections")
    .select("id,form_number,agent_name,agent_code,section,status,updated_at")
    .in("status",["stage4b_weight_filling","rejected_to_stage4b"])
    .in("section", sections.length ? sections : ALL_SECTIONS)
    .order("updated_at",{ascending:false});

  return (data||[]).map(c=>`<div class="queue-row">
    <div>
      <b style="font-size:13px;">${c.form_number}</b>
      <span class="meta" style="margin-left:8px;">${c.agent_name} (${c.agent_code}) — ${c.section}</span>
      <span class="badge-status bs-${c.status==='stage4b_weight_filling'?'submitted':'rejected'}" style="margin-left:8px;">
        ${c.status==='stage4b_weight_filling'?'New':'Returned for correction'}
      </span>
    </div>
    <button onclick="openRwForm(${c.id})">Fill Weight Details</button>
  </div>`);
}

async function loadApprovalQueue(sections){
  const { data } = await sb.from("pet_collections")
    .select("id,form_number,agent_name,agent_code,section,status,cycle,updated_at,rumbu_weighbridge_weight,rumbu_weighbridge_attachment")
    .eq("status","stage4b_weight_approval")
    .in("section", sections.length ? sections : ALL_SECTIONS)
    .order("updated_at",{ascending:false});

  if(!data||!data.length) return [];

  const { data: myDecisions } = await sb.from("pet_approvals")
    .select("collection_id,decision,cycle").eq("approver_profile_id",ME.id).eq("stage","stage4b");
  const decided = new Set((myDecisions||[]).map(d=>d.collection_id+":"+d.cycle));

  RW_QUEUE_DATA = data;
  return data.map(c=>{
    const hasDec = decided.has(c.id+":"+c.cycle);
    return `<div class="approve-card">
      <div style="margin-bottom:6px;"><span class="badge-status bs-approval">Awaiting your approval</span></div>
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;">
        <div>
          <b>${c.form_number}</b> — ${c.agent_name} (${c.section})
          <div style="font-size:12px;color:var(--muted);margin-top:4px;">
            Weight: ${c.rumbu_weighbridge_weight||"—"} kg
          </div>
        </div>
        ${hasDec ? `<span class="badge-status bs-approval">Decision submitted — awaiting others</span>` : ""}
      </div>
      ${!hasDec ? `
      <div style="margin-top:10px;">
        <button onclick="openRwReview(${c.id})">Review &amp; Approve</button>
      </div>` : ""}
    </div>`;
  });
}

function openRwReview(collectionId){
  const c = RW_QUEUE_DATA.find(x=>x.id===collectionId);
  if(!c) return;
  showReviewModal({
    title: "Rumbu Weight Details — Review Submission",
    subtitle: c.form_number + " — " + c.agent_name + " (" + c.agent_code + ") — " + c.section,
    mode: "decide",
    sections: [
      { heading: "Weight Details", rows: [
        ["Rumbu Weighbridge Weight", (c.rumbu_weighbridge_weight||0) + " kg"],
        ["Weighbridge Attachment", reviewModalFileLink(c.rumbu_weighbridge_attachment, "View weighbridge slip")],
      ]}
    ],
    onApprove: ()=>decide(collectionId,'stage4b','approved',null),
    onReject: (note)=>decide(collectionId,'stage4b','rejected',note)
  });
}

async function openRwForm(id){
  const { data: c } = await sb.from("pet_collections").select("*").eq("id",id).single();
  if(!c) return;
  CURRENT_COLLECTION = c;

  document.getElementById("rwFormNum").value   = c.form_number;
  document.getElementById("rwAgent").value     = c.agent_name;
  document.getElementById("rwAgentCode").value = c.agent_code;
  document.getElementById("rwWeight").value    = c.rumbu_weighbridge_weight||"";
  document.getElementById("rwFileUrl").textContent = c.rumbu_weighbridge_attachment||"";

  if(c.status==="rejected_to_stage4b"){
    const { data: log } = await sb.from("pet_activity_log")
      .select("note").eq("collection_id",id).eq("action","rejected")
      .order("created_at",{ascending:false}).limit(1);
    if(log&&log.length&&log[0].note){
      const el = document.getElementById("rwCorrectionNote");
      el.style.display="block";
      el.innerHTML=`<b>Rejection reason:</b> ${log[0].note}`;
    }
  } else {
    document.getElementById("rwCorrectionNote").style.display="none";
  }

  document.getElementById("rwFormTitle").textContent =
    "Rumbu Weight Details — " + c.form_number + (c.status==="rejected_to_stage4b"?" (CORRECTION)":"");
  document.getElementById("rwFormStatus").textContent = "";
  document.getElementById("rwForm").style.display="block";
  document.getElementById("rwForm").scrollIntoView({behavior:"smooth"});
}

async function uploadFile(file, folder){
  if(!file) return null;
  const ext = file.name.split(".").pop();
  const path = `${folder}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
  const { data, error } = await sb.storage.from("pet-attachments").upload(path, file);
  if(error) throw new Error("Upload failed: "+error.message);
  const { data: urlData } = sb.storage.from("pet-attachments").getPublicUrl(path);
  return urlData.publicUrl;
}

async function submitRumbuWeight(){
  const st = document.getElementById("rwFormStatus");
  const rumbuW = document.getElementById("rwWeight").value;
  const file = document.getElementById("rwFile").files[0];
  const existingUrl = document.getElementById("rwFileUrl").textContent;

  if(!rumbuW){ st.style.color="var(--bad)"; st.textContent="Enter Rumbu weighbridge weight."; return; }
  if(!file && !existingUrl){ st.style.color="var(--bad)"; st.textContent="Attach the Rumbu weighbridge document."; return; }

  st.textContent = "";
  showReviewModal({
    title: "Review Before Submitting",
    subtitle: (CURRENT_COLLECTION?.form_number||"") + " — check everything below before you submit",
    mode: "submit",
    sections: [
      { heading: "Weight Details", rows: [
        ["Rumbu Weighbridge Weight", rumbuW + " kg"],
        ["Weighbridge Attachment", file ? file.name : "Already attached"],
      ]}
    ],
    onConfirm: proceedWithRumbuWeightSubmit
  });
}

async function proceedWithRumbuWeightSubmit(){
  const st = document.getElementById("rwFormStatus");
  st.style.color="var(--muted)"; st.textContent="Saving...";
  try{
    const rumbuW = parseFloat(document.getElementById("rwWeight").value);
    const file = document.getElementById("rwFile").files[0];
    const attachmentUrl = file ? await uploadFile(file, "weighbridges") : (document.getElementById("rwFileUrl").textContent || null);

    const oldStatus = CURRENT_COLLECTION.status;
    const needsApproval = await stageHasApprovers("stage4b", CURRENT_COLLECTION.section);
    const nextStatus = needsApproval ? "stage4b_weight_approval" : NEXT_STATUS.stage4b;
    const { error: updErr } = await sb.from("pet_collections").update({
      rumbu_weighbridge_weight: rumbuW,
      rumbu_weighbridge_attachment: attachmentUrl,
      status: nextStatus,
      updated_at: new Date().toISOString()
    }).eq("id",CURRENT_COLLECTION.id);
    if(updErr) throw new Error("Could not save weight details: "+updErr.message);

    const { error: logErr } = await sb.from("pet_activity_log").insert({
      collection_id:    CURRENT_COLLECTION.id,
      action:           "stage4b_filled",
      stage:            "stage4b",
      actor_profile_id: ME.id,
      actor_username:   ME.username,
      old_status:       oldStatus,
      new_status: nextStatus
    });
    if(logErr) console.warn("Activity log entry failed (non-fatal):", logErr.message);

    st.style.color="var(--ok)"; st.textContent = needsApproval ? "Submitted for approval." : "Submitted — moved on to the next stage.";
    setTimeout(()=>{ closeRwForm(); init(); }, 1200);
  }catch(e){
    st.style.color="var(--bad)"; st.textContent="Error: "+e.message;
  }
}

function closeRwForm(){
  document.getElementById("rwForm").style.display="none";
  CURRENT_COLLECTION=null;
}

async function decide(collectionId, stage, decision, note){
  if(decision==="rejected" && !note){ alert("Rejection reason is required."); return; }
  try{
    const { data: c, error: cErr } = await sb.from("pet_collections").select("section,cycle,status").eq("id",collectionId).single();
    if(cErr) throw new Error("Could not load collection: "+cErr.message);

    const { error: apprErr } = await sb.from("pet_approvals").insert({
      collection_id:       collectionId,
      stage:               stage,
      cycle:               c.cycle,
      approver_profile_id: ME.id,
      approver_username:   ME.username,
      decision:            decision,
      correction_note:     note||null,
      decided_at:          new Date().toISOString()
    });
    if(apprErr) throw new Error("Could not record your decision: "+apprErr.message);

    if(decision==="rejected"){
      const newStatus = REJECT_STATUS[stage];
      const newCycle  = (c.cycle||1) + 1;
      const { error: updErr } = await sb.from("pet_collections").update({ status: newStatus, cycle: newCycle, updated_at: new Date().toISOString() }).eq("id",collectionId);
      if(updErr) throw new Error("Could not update status: "+updErr.message);
      const { error: logErr } = await sb.from("pet_activity_log").insert({
        collection_id: collectionId, action:"rejected", stage,
        actor_profile_id: ME.id, actor_username: ME.username,
        old_status: c.status, new_status: newStatus, note
      });
      if(logErr) console.warn("Activity log entry failed (non-fatal):", logErr.message);
    } else {
      const allApproved = (ME.role==="super_admin") ? true : await checkAllApproved(collectionId, stage, c.cycle, c.section);
      if(allApproved){
        const newStatus = NEXT_STATUS[stage];
        const { error: updErr } = await sb.from("pet_collections").update({ status: newStatus, updated_at: new Date().toISOString() }).eq("id",collectionId);
        if(updErr) throw new Error("Could not advance status: "+updErr.message);
        const { error: logErr } = await sb.from("pet_activity_log").insert({
          collection_id: collectionId, action:"approved_all", stage,
          actor_profile_id: ME.id, actor_username: ME.username,
          old_status: c.status, new_status: newStatus
        });
        if(logErr) console.warn("Activity log entry failed (non-fatal):", logErr.message);
      } else {
        const { error: logErr } = await sb.from("pet_activity_log").insert({
          collection_id: collectionId, action:"approved_partial", stage,
          actor_profile_id: ME.id, actor_username: ME.username,
          old_status: c.status, new_status: c.status,
          note: "Awaiting remaining approvers"
        });
        if(logErr) console.warn("Activity log entry failed (non-fatal):", logErr.message);
      }
    }
    await init();
  }catch(e){ alert("Error: "+e.message); }
}

// True when at least one approver is assigned to this stage for this branch.
// If nobody is assigned, there is no approval step: submitting moves the
// collection straight on to the next stage.
async function stageHasApprovers(stage, section){
  const { data } = await sb.from("pet_stage_approvers").select("profile_id").eq("section",section).eq("stage",stage);
  return !!(data && data.length);
}

async function checkAllApproved(collectionId, stage, cycle, section){
  const [{ data: approvers }, { data: approvals }] = await Promise.all([
    sb.from("pet_stage_approvers").select("profile_id").eq("section",section).eq("stage",stage),
    sb.from("pet_approvals").select("approver_profile_id").eq("collection_id",collectionId).eq("stage",stage).eq("cycle",cycle).eq("decision","approved")
  ]);
  if(!approvers||!approvers.length) return true; // no approvers configured = auto-approve
  const assignedIds  = new Set(approvers.map(a=>a.profile_id));
  const approvedIds  = new Set((approvals||[]).map(a=>a.approver_profile_id));
  return [...assignedIds].every(id=>approvedIds.has(id));
}

init();
</script>
</body>
</html>
