<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bag Info — Rumbu Industries Group</title>
<style>
  :root{ --navy:#1F3864; --accent:#c8a34e; --bg:#eef1f6; --card:#ffffff; --line:#e2e7f0; --muted:#6b7280; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:#1a2333;padding:20px;}
  .wrap{max-width:480px;margin:40px auto;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;}
  .header{background:var(--navy);color:#fff;border-radius:14px 14px 0 0;margin:-24px -24px 20px;padding:20px 24px;text-align:center;}
  .header h1{margin:0;font-size:16px;letter-spacing:.3px;}
  .header p{margin:4px 0 0;font-size:12px;opacity:.8;}
  .row{padding:10px 0;border-bottom:1px solid var(--line);}
  .row:last-child{border-bottom:none;}
  .row .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700;}
  .row .v{font-size:15px;font-weight:700;color:var(--navy);margin-top:2px;}
  .status{text-align:center;font-size:13px;color:var(--muted);margin-top:30px;}
  .ref-badge{display:inline-block;background:var(--accent);color:var(--navy);font-weight:800;font-size:13px;padding:6px 14px;border-radius:20px;margin-top:10px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="header">
      <h1>RUMBU INDUSTRIES GROUP</h1>
      <p>PET Production — Bag Information</p>
    </div>
    <div id="content"><p style="text-align:center;color:var(--muted);">Loading...</p></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config.js"></script>
<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function row(label, value){
  return `<div class="row"><div class="l">${label}</div><div class="v">${value!=null&&value!==""?value:"—"}</div></div>`;
}

async function load(){
  const params = new URLSearchParams(window.location.search);
  const ref = params.get("ref");
  const content = document.getElementById("content");
  if(!ref){ content.innerHTML = `<p style="text-align:center;color:#c0392b;">No bag reference given.</p>`; return; }

  const { data, error } = await sb.rpc("get_bag_public_info", { p_reference: ref });
  const info = Array.isArray(data) ? data[0] : data;

  if(error || !info){
    content.innerHTML = `<p style="text-align:center;color:#c0392b;">No record found for this reference number. It may be mistyped, or not yet generated in the system.</p>`;
    return;
  }

  content.innerHTML = `
    <div style="text-align:center;margin-bottom:6px;"><span class="ref-badge">${info.bag_reference}</span></div>
    ${row("Form Number", info.form_number)}
    ${row("Agent", info.agent_name)}
    ${row("Branch", info.section)}
    ${row("Production Date", info.production_date)}
    ${row("Colored Flex (kg)", info.colored_flex_kg)}
    ${row("Non-Colored Flex (kg)", info.non_colored_flex_kg)}
    ${row("Total Production (kg)", info.total_production_kg)}
    ${row("Coloured PET Waste (kg)", info.waste_coloured_kg)}
    ${row("Labelled Bottles Waste (kg)", info.waste_labels_kg)}
    ${row("Caps & Rings Waste (kg)", info.waste_caps_rings_kg)}
    ${row("Non-Food Contact Waste (kg)", info.waste_non_food_kg)}
    ${row("Non-PET Product Waste (kg)", info.waste_non_pet_kg)}
    ${row("Aged PET Bottles Waste (kg)", info.waste_aged_kg)}
    ${row("Oily PET Bottles Waste (kg)", info.waste_oily_kg)}
    ${row("Metal Ring Waste (kg)", info.waste_metal_kg)}
    ${row("Total Waste (kg)", info.total_waste_kg)}
    ${row("Total Bags Produced in This Batch", info.total_bags)}
    <div class="status">Rumbu Industries Group — PET Recycling Division</div>
  `;
}

load();
</script>
</body>
</html>
