<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>About Rumbu — Rumbu Industries Group</title>
<style>
:root{
  --navy:#1F3864; --blue:#2E75B6; --teal:#0f766e;
  --accent:#c8a34e; --bg:#eef2f7; --card:#fff;
  --line:#dde3ee; --muted:#64748b; --text:#1a2333;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Segoe UI',system-ui,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;}
.page{max-width:560px;margin:0 auto;padding:20px 14px 48px;}
.card{background:var(--card);border-radius:18px;box-shadow:0 6px 32px rgba(31,56,100,.14);overflow:hidden;}

.pg-hdr{background:linear-gradient(135deg,#1F3864 0%,#2354a4 55%,#0f766e 100%);padding:26px 28px 22px;text-align:center;color:#fff;}
.pg-hdr .logo-row{display:flex;align-items:center;justify-content:center;gap:12px;}
.pg-hdr .logo-box{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:22px;}
.pg-hdr .co-name{font-size:17px;font-weight:900;letter-spacing:.6px;text-align:left;line-height:1.2;}
.pg-hdr .co-addr{font-size:11px;opacity:.75;text-align:left;margin-top:2px;}
.pg-hdr .doc-pill{display:inline-block;margin-top:12px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:4px 16px;font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;}
.hdr-gold-bar{height:3px;background:linear-gradient(90deg,transparent,var(--accent),#e8b75c,var(--accent),transparent);margin-top:20px;}

.card-body{padding:24px;}
.pub-label{font-size:9.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:0 0 12px;display:flex;align-items:center;gap:6px;}
.pub-label::before,.pub-label::after{content:'';flex:1;height:1px;background:var(--line);}
.pub-label.gap{margin-top:26px;}

.co-title{font-size:20px;font-weight:900;color:var(--navy);text-align:center;margin:0 0 16px;}
.link-btn{display:block;width:100%;padding:13px 18px;border-radius:10px;text-decoration:none;font-size:14px;font-weight:800;text-align:center;letter-spacing:.2px;margin-bottom:10px;word-break:break-all;}
.link-btn.main{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;box-shadow:0 4px 14px rgba(31,56,100,.22);}
.link-btn.alt{background:#fff;color:var(--navy);border:1.5px solid var(--navy);}

.contact{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;}
.contact .who{min-width:0;}
.contact .office{font-size:10.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--blue);}
.contact .nm{font-size:15px;font-weight:800;color:var(--navy);overflow-wrap:anywhere;}
.contact .ph{font-size:13px;color:var(--muted);}
.call{flex:none;text-decoration:none;background:var(--teal);color:#fff;font-weight:800;font-size:13px;padding:9px 16px;border-radius:20px;}
.note{font-size:12.5px;color:var(--muted);text-align:center;padding:6px 0;}

.pg-footer{background:#f6f8fb;border-top:1px solid var(--line);padding:16px 20px;text-align:center;font-size:11.5px;color:var(--muted);line-height:1.7;}
</style>
</head>
<body>
<div class="page">
<div class="card">

  <div class="pg-hdr">
    <div class="logo-row">
      <div class="logo-box">♻️</div>
      <div>
        <div class="co-name">RUMBU INDUSTRIES GROUP</div>
        <div class="co-addr">KM4, Hadejia Road, Kano State, Nigeria</div>
      </div>
    </div>
    <div class="doc-pill">About Rumbu</div>
    <div class="hdr-gold-bar"></div>
  </div>

  <div class="card-body">
    <div class="pub-label">Our company</div>
    <div class="co-title" id="coName">Rumbu Industries</div>
    <a class="link-btn main" id="webLink" href="https://rumbuindustries.com" target="_blank" rel="noopener">rumbuindustries.com</a>
    <a class="link-btn alt" id="mailLink" href="mailto:info@rumbuindustries.com">info@rumbuindustries.com</a>

    <div id="contactsArea" style="display:none;">
      <div class="pub-label gap">Contacts</div>
      <div id="contactList"></div>
    </div>
    <div class="note" id="statusNote"></div>
  </div>

  <div class="pg-footer">
    <b>Rumbu Industries Group</b><br>
    KM4, Hadejia Road, Kano State, Nigeria · Agbara Industrial Estate, Lagos
  </div>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
// The page works with no setup at all: it starts with the default website and email, then fills in whatever is saved.
var DEFAULT_SITE = "rumbuindustries.com", DEFAULT_MAIL = "info@rumbuindustries.com";

function setText(id, t){ document.getElementById(id).textContent = t; }
function cleanSite(s){ return String(s || "").trim().replace(/^https?:\/\//i, "").replace(/\/+$/, ""); }
function cleanPhone(p){ return String(p || "").replace(/[^0-9+]/g, ""); }

function showSite(site, mail){
  site = cleanSite(site) || DEFAULT_SITE; mail = String(mail || "").trim() || DEFAULT_MAIL;
  var w = document.getElementById("webLink"); w.textContent = site; w.href = "https://" + site;
  var m = document.getElementById("mailLink"); m.textContent = mail; m.href = "mailto:" + mail;
}

function showContacts(list){
  var box = document.getElementById("contactList"); box.textContent = "";
  var n = 0;
  (list || []).forEach(function(c){
    var tel = cleanPhone(c.phone); if(!tel) return;
    n++;
    var row = document.createElement("div"); row.className = "contact";
    var who = document.createElement("div"); who.className = "who";
    var o = document.createElement("div"); o.className = "office"; o.textContent = c.office || "";
    who.appendChild(o);
    if(c.name){ var nm = document.createElement("div"); nm.className = "nm"; nm.textContent = c.name; who.appendChild(nm); }
    var ph = document.createElement("div"); ph.className = "ph"; ph.textContent = c.phone; who.appendChild(ph);
    var call = document.createElement("a"); call.className = "call"; call.href = "tel:" + tel; call.textContent = "Call";
    row.appendChild(who); row.appendChild(call); box.appendChild(row);
  });
  document.getElementById("contactsArea").style.display = n ? "block" : "none";
}

async function init(){
  try{
    var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    var r = await sb.rpc("get_about_rumbu");
    if(r.error) throw r.error;
    var d = r.data || {};
    if(d.company) setText("coName", d.company);
    showSite(d.website, d.email);
    showContacts(d.contacts);
  }catch(e){
    showSite(DEFAULT_SITE, DEFAULT_MAIL);
    setText("statusNote", "Contact details could not be loaded just now. The website and email above still work.");
  }
}
init();
</script>
</body>
</html>
