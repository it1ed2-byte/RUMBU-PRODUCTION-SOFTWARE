<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rumbu Industries — Set Your Password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--navy:#1F3864;--blue:#2E75B6;--blue-dark:#245d92;--line:#d8dee8;--bg:#eef2f7;--red:#c0392b;
    --sans:"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  *{box-sizing:border-box;}
  body{font-family:var(--sans);background:linear-gradient(135deg,var(--navy) 0%,#142a4d 100%);margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .card{background:#fff;border-radius:14px;padding:36px 30px;width:100%;max-width:380px;box-shadow:0 12px 32px rgba(0,0,0,.25);}
  h1{color:var(--navy);font-size:18px;text-align:center;margin:0 0 4px;letter-spacing:.5px;}
  p.sub{text-align:center;color:#6b7280;font-size:12px;margin:0 0 24px;}
  label{display:block;font-size:12px;font-weight:bold;color:#111;margin:14px 0 4px;}
  input{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;}
  input:focus{outline:2px solid var(--blue);border-color:var(--blue);}
  button{width:100%;padding:12px;margin-top:20px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:bold;cursor:pointer;}
  button:hover{background:var(--blue-dark);}
  button:disabled{opacity:.6;cursor:not-allowed;}
  .status{margin-top:14px;text-align:center;font-size:13px;font-weight:bold;min-height:16px;}
  .status.err{color:var(--red);}
  .status.ok{color:#1d8a4e;}
  .pw-wrap{position:relative;}
  .pw-wrap input{padding-right:58px;}
  .pw-toggle{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:auto;margin:0;padding:6px 8px;background:none;color:var(--blue);border:none;border-radius:6px;font-size:12px;font-weight:bold;cursor:pointer;}
  .pw-toggle:hover{background:#eef2f7;color:var(--blue-dark);}
</style>
</head>
<body>

<div class="card">
  <h1>SET YOUR PASSWORD</h1>
  <p class="sub">RUMBU INDUSTRIES GROUP &bull; This account needs a permanent password before continuing.</p>

  <label>New Password</label>
  <div class="pw-wrap">
    <input type="password" id="p1" autocomplete="new-password">
    <button type="button" class="pw-toggle" onclick="togglePasswordField('p1', this)">Show</button>
  </div>

  <label>Confirm New Password</label>
  <div class="pw-wrap">
    <input type="password" id="p2" autocomplete="new-password" onkeydown="if(event.key==='Enter'){setPassword();}">
    <button type="button" class="pw-toggle" onclick="togglePasswordField('p2', this)">Show</button>
  </div>

  <button id="btn" onclick="setPassword()">SET PASSWORD &amp; CONTINUE</button>
  <div class="status" id="status"></div>
</div>

<script>
const SUPABASE_URL = "https://betfhunzmhtdzgvufmfk.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_AfDp1FlHghu9TOfqEUj20Q_Pke7GlTp";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function togglePasswordField(inputId, btn){
  const input = document.getElementById(inputId);
  if(!input) return;
  const showing = input.type === "text";
  input.type = showing ? "password" : "text";
  btn.textContent = showing ? "Show" : "Hide";
}

// Deliberately does NOT call the shared requireAuth() from auth.js — that
// function redirects HERE whenever must_change_password is true, so using
// it on this exact page would just loop back to itself. Instead: check for
// a session directly, and let the person clear the flag from here.
async function init(){
  const { data } = await sb.auth.getSession();
  if(!data.session){
    window.location.href = "login.html";
  }
}
init();

async function setPassword(){
  const p1 = document.getElementById("p1").value;
  const p2 = document.getElementById("p2").value;
  const status = document.getElementById("status");
  const btn = document.getElementById("btn");

  if(!p1 || !p2){ status.className="status err"; status.textContent="Fill in both fields."; return; }
  if(p1 !== p2){ status.className="status err"; status.textContent="Passwords do not match."; return; }
  if(p1.length < 6){ status.className="status err"; status.textContent="Password must be at least 6 characters."; return; }

  btn.disabled = true; btn.innerText = "Saving...";
  status.className = "status"; status.textContent = "";

  try{
    const { error: updErr } = await sb.auth.updateUser({ password: p1 });
    if(updErr) throw updErr;

    // Clear the flag so requireAuth() stops redirecting here on future
    // logins. Uses a dedicated RPC (matches the existing kwp_mark_password_
    // reset pattern) rather than a direct table update, so a signed-in
    // account can only ever clear this one flag on its own row — nothing
    // else on profiles becomes self-editable by this path.
    const { error: rpcErr } = await sb.rpc("clear_own_must_change_password");
    if(rpcErr){
      // Password itself is already changed successfully at this point —
      // don't block on this, but be honest that a further step is needed.
      console.warn("Could not clear must_change_password flag:", rpcErr.message);
      status.className = "status ok";
      status.textContent = "Password set, but please tell IT: the first-login flag could not be cleared automatically.";
      setTimeout(()=>{ window.location.href = "index.html"; }, 2500);
      return;
    }

    status.className = "status ok"; status.textContent = "Password set. Loading...";
    window.location.href = "index.html";
  }catch(e){
    status.className = "status err"; status.textContent = "Error: " + (e.message||e);
  }finally{
    btn.disabled = false; btn.innerText = "SET PASSWORD & CONTINUE";
  }
}
</script>
</body>
</html>
